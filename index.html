, "ch": "5500: above FULL, alarms only past ¾ used; 2216: below FULL, early LED alert", "wh": ["5500: below FULL, early LED alert; 2216: above FULL, alarms only past ¾ used", "5500: above FULL, alarms only past ½ used; 2216: below FULL, early LED alert", "5500: reads FULL, alarms work normally; 2216: below FULL, early LED alert"], "hash": "sha256:a3dbd79fce762b836a5dca0d9cfd186c9d284d42fceabb6c4396910628da7de7"}, {"n": 8, "q": "Why does a 4500 psi cylinder leak heavily when someone tries to thread it onto a 2216 psi RIT-Pak?", "a": "It's a deliberate safety design. The high-pressure coupling won't seal on the higher-pressure cylinder, so a large leak occurs when the valve opens. That keeps the 2216 psi parts from being pressurized to 4500.", "qh": "Why does a 4500 psi cylinder leak heavily when someone tries to thread it onto a 2216 psi RIT-Pak?", "ah": "It's a deliberate safety design. The high-pressure coupling won't seal on the higher-pressure cylinder, so a large leak occurs when the valve opens. That keeps the 2216 psi parts from being pressurized to 4500.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "By design the coupling won't seal, so 2216 parts never see 4500 psi", "wh": ["By design the relief valve vents, so 2216 parts never see 4500 psi", "Damaged threads; a 2216 cylinder would leak on that pack too", "A defect; the coupling should seal and run the pack at 4500 psi"], "hash": "sha256:55e801197b5108d70d0548780d6efb1698f31888f28f734e4b6445ac415ea2b5"}, {"n": 9, "q": "Working at 20 °F, which RIT-Pak parts can freeze and cause trouble? You fill a victim's cylinder outside and the SCBA goes back indoors. What must happen within 2 hours?", "a": "Water on the HP, UAC, or LP couplings can freeze and stop you from connecting or removing a hose. The reducer gets cold while air flows, so water or mud on it can freeze and affect operation. After a fill below 32 °F, check the cylinder for excess pressure within 2 hours of moving it indoors, and bleed it down to full with the regulator purge if it reads high.", "qh": "Working at 20 °F, which RIT-Pak parts can freeze and cause trouble? You fill a victim's cylinder outside and the SCBA goes back indoors. What must happen within 2 hours?", "ah": "Water on the HP, UAC, or LP couplings can freeze and stop you from connecting or removing a hose. The reducer gets cold while air flows, so water or mud on it can freeze and affect operation. After a fill below 32 °F, check the cylinder for excess pressure within 2 hours of moving it indoors, and bleed it down to full with the regulator purge if it reads high.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "HP, UAC, LP couplings and the reducer; check for over-pressure, bleed to full", "wh": ["HP, UAC, LP couplings and the reducer; check for under-pressure, top it off", "Only the cylinder valve; check for over-pressure, bleed to full", "HP, UAC, LP couplings and the reducer; send the cylinder for a hydro test"], "hash": "sha256:1ee550d3cd5d8de10f7a0c7dc8de17145d39d2dc333aabde998b66169699a974"}, {"n": 10, "q": "Why must one trained RIT member watch the RIT-Pak gauge for the whole rescue, and about what reading on a 4500 pack is the manual's example alert point?", "a": "The victim's own end-of-service alarm may not work normally while he's on the RIT-Pak, and failing to monitor can cut off his air without warning. The monitor needs a way to alert the team. The manual's example is ¼ full, about 1000 psi on a 4500 pack. The bell also rings below ¼.", "qh": "Why must one trained RIT member watch the RIT-Pak gauge for the whole rescue, and about what reading on a 4500 pack is the manual's example alert point?", "ah": "The victim's own end-of-service alarm may not work normally while he's on the RIT-Pak, and failing to monitor can cut off his air without warning. The monitor needs a way to alert the team. The manual's example is ¼ full, about 1000 psi on a 4500 pack. The bell also rings below ¼.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Victim's alarms may not work; about 1000 psi (¼ full)", "wh": ["Victim's alarms may not work; about 500 psi (¼ full)", "Victim's alarms may not work; about 2250 psi (¼ full)", "Victim's alarms may not work; about 1500 psi (⅓ full)"], "hash": "sha256:4b3f226394f684631de40d0b20939d52346ed4698a327b79a99f7f4c3de8c662"}], "sources": [{"label": "Scott RIT-Pak III O&M Instructions 595225-01 Rev D", "url": "https://www.sos-safety.com/wp-content/uploads/2017/10/RITPakIII_OperationMaintenance_595225-01D_LowRes.pdf"}, {"label": "3M Scott RIT-Pak III Emergency Air Supply System product page (3M US)", "url": "https://www.3m.com/3M/en_US/p/d/b5005047164/"}, {"label": "Library copy: Drive > Firefighter_Reference_Library > 08_RIC_RIT_Packs", "url": ""}, {"label": "3M Scott RIT-Pak III O&M 595225-01 Rev D, sections: Description, Service Life, Use of Alternate Cylinders, Low and High Pressure Air Supply Use, Use in Low Temperatures (same PDF as above)", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 04 RIT &gt; 04.2 RIT Air Supply Packs &gt; tool. <strong>Unlocks after:<\/strong> 01.2 SCBA (all), 04.1 Mayday and Self-Survival (planned). <strong>Cross-links:<\/strong> 01.2.1 Scott X3 Pro (RIC/UAC), 09.1.1 PASS.", "note_html": "Study aid only. Source: Scott RIT-Pak III O&amp;M Instructions P/N 595225-01 Rev D."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 650.69, "y": -261.45, "angle": 74.5, "vx": -379.58, "vy": 614.02, "vangle": 319.5}, "04.2.2": {"id": "04.2.2", "name": "MSA G1 RIT System and RescueAire II", "path": "04", "kind": "tool", "parent": "04.2", "prereqRaw": "parent 04.2", "children": [], "prereqs": ["04.2"], "unlocks": [], "cross": ["01.2.2", "09.1.1"], "doc": {"title": "04.2.2 MSA G1 RIT System and G1 RescueAire II", "file": "04.2.2_MSA_G1_RIT_and_RescueAire_II.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>These are MSA's two RIT air-supply options for crews with G1 SCBAs:<\/p><ul><li><strong>G1 RescueAire II System:<\/strong> a harness-carried emergency air supply with a G1 regulator, made to give air to a downed firefighter wearing a G1 facepiece.<\/li><li><strong>G1 RIT System:<\/strong> a complete RIT bag with a quick-connect pressure reducer that mounts on a user-supplied G1 cylinder.<\/li><\/ul>"}, {"key": "specs", "title": "Key specs", "html": "<p><strong>G1 RescueAire II<\/strong><\/p><ul><li>2216 or 4500 psi versions (sold with a 30-min or 60-min cylinder).<\/li><li>G1 PR-14 pressure reducer, G1 regulator, and Audi-Larm audible low-pressure alarm.<\/li><li>36-inch Quick-Fill emergency breathing system (EBS) connection, an ExtendAire EBS connection, and a carrying harness with an adjustable strap.<\/li><\/ul><p><strong>G1 RIT System<\/strong><\/p><ul><li>2216 or 4500 psi versions. The cylinder is ordered separately.<\/li><li><strong>6-ft high-pressure line<\/strong> ending in a female Quick-Fill fitting (transfill).<\/li><li><strong>6-ft intermediate-pressure line<\/strong> ending in an ExtendAire II manifold (male and female quick-disconnects).<\/li><li>Optional G1 facepiece (medium, 4-point Speed-ON harness), quick-connect G1 regulator, remote gauge, and URC fitting to link G1 RIT systems.<\/li><li>Audible warning bell, high-pressure first stage, and EBSS accessory.<\/li><li>Iron-Cloth bag with heat-shield skid plate, a 60-in strap (carry, drag, or lower), flashlight holder, tool pockets, and 360° reflective tape.<\/li><\/ul><p><strong>Ordering details that matter (bulletin)<\/strong><\/p><ul><li>RescueAire II comes complete with a cylinder: 4500 psi with a 60-min cylinder, or 2216 psi with a 30-min cylinder.<\/li><li>The G1 RIT System comes <strong>without<\/strong> a cylinder. It mounts on a G1 cylinder made for remote connection, and each cylinder needs its own Quick-Connect Cylinder Adapter (one part number for 2216 psi, another for 4500/5500 psi).<\/li><li>Neither RIT system comes in 5500 psi.<\/li><\/ul><p><strong>UAC rules on the receiving G1 SCBA (G1 manual, section 13)<\/strong><\/p><ul><li>Each G1 has one RIC UAC on the pressure reducer, plus an optional Remote Quick-Fill UAC on the front right. On 2216 and 4500 psi systems, either can be used. A 5500 psi G1 <strong>will not transfill<\/strong> between SCBAs.<\/li><li>The air at the Quick-Fill inlet must <strong>never<\/strong> be higher than the SCBA's operating pressure. To fill at all, it must be higher than the cylinder's current pressure.<\/li><li>The pressure reducer has an <strong>automatically resetting relief valve<\/strong> that vents if an emergency fill over-pressurizes the SCBA.<\/li><li>Use only MSA-approved hoses to keep the NIOSH approval. Don't lubricate the fittings, and keep oil and grease off them. Never use the UAC if a CBRN agent could be present, or as a buddy breather (two users on one cylinder), which voids the NIOSH approval.<\/li><li>Topping off: MSA recommends waiting until the cylinder cools to 70 °F (21 °C) after the first fill to get the full service time.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li>Keep it staged with the RIT tool cache, with the cylinder full and the hoses stowed in the quick-draw pocket.<\/li><li>At the victim: open the cylinder and check the remote gauge.<\/li><li><strong>Transfill:<\/strong> connect the HP Quick-Fill line to the victim's Quick-Fill or UAC fitting. (The G1 SCBA also has a RIC UAC fitting and an optional Remote Quick-Fill on the front right.)<\/li><li><strong>Supply:<\/strong> connect the IP ExtendAire line, or put the spare facepiece and regulator on a victim whose mask failed.<\/li><li>Watch the RIT cylinder and plan the exit or a cylinder swap. The bell warns of low pressure.<\/li><\/ol><p><strong>Quick-Fill sequence (G1 manual 13.2)<\/strong><\/p><ul><li>Connect the hose to the supply and turn the supply on. Uncap both fittings, make sure the victim's cylinder valve is fully open, push the hose on until it clicks, then tug it.<\/li><li>Filling starts the moment the fitting engages, and the pressures <strong>equalize in about 60 seconds<\/strong>. If the supply doesn't hold enough air, the cylinder won't reach full.<\/li><li>When the cylinder and remote gauges match the supply gauge, pressure is equal. Pull the gray sleeve to disconnect (a hiss or pop is normal), listen for leaks, and recap the UAC right away.<\/li><li><strong>If the UAC leaks and the dust cap won't stay on:<\/strong> reconnect the hose to seal it and head for fresh air. If it won't reconnect, close the cylinder valve, cap the fitting, reopen the valve, and leave immediately.<\/li><li>MSA: RITs should fill cylinders in IDLH atmospheres from a <strong>separate air supply<\/strong> such as RescueAire II.<\/li><\/ul><p><strong>ExtendAire II (the IP line, G1 manual section 14)<\/strong><\/p><ul><li>Using it as donor or receiver makes <strong>both SCBAs escape-only<\/strong>. Both users leave at once, and remaining service time drops by about half.<\/li><li>Don't connect if the donor's low-pressure alarm is sounding. Keep slack in the lines and don't pull on the hoses, because they can separate from the fittings. Make sure both cylinder valves are open before you disconnect.<\/li><li>MSA says the Quick-Fill system has fewer risks and keeps the approval, so use it when ExtendAire rules can't be followed.<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>The bulletin is a product overview, not an operating manual. Train from MSA's current G1 RIT instructions.<\/li><li>Don't mix quick-connect types. MSA warns that Snap-Tite and UEBSS quick-connect fittings are not interchangeable (G1 manual).<\/li><li>Match the system pressure to the cylinder.<\/li><li>The 2018 G1's ExtendAire II uses <strong>UEBSS<\/strong> fittings so it can connect to other brands' UEBSS. NFPA 1981 (2018) doesn't require cross-brand testing, so MSA doesn't warrant either SCBA in a mixed-brand hookup.<\/li><li>ExtendAire II is not approved in CBRN atmospheres either.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li>Before the G1, MSA sold the RescueAire family (RescueAire, RescueAire AL, RescueAire QR, and RescueAire II) for its Firehawk-era SCBA. They had 3-ft Quick-Fill hoses and 36-in low-pressure airlines, and RescueAire II came with a Firehawk mask-mounted regulator. Those systems used 2216 and 4500 psi cylinders (MSA literature 0114-18-MC, 2012).<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Your department is buying RIT air for G1 crews. Compare what arrives in the box with RescueAire II and with the G1 RIT System, including what you still need to order for each G1 RIT cylinder.", "a": "RescueAire II comes complete: a harness-carried system with a G1 PR-14 reducer, G1 regulator, and Audi-Larm alarm, sold with a cylinder (4500 psi/60-min or 2216 psi/30-min). The G1 RIT System is a full RIT bag with a quick-connect reducer but no cylinder. It mounts on a G1 cylinder made for remote connection, and each cylinder needs its own Quick-Connect Cylinder Adapter.", "qh": "Your department is buying RIT air for G1 crews. Compare what arrives in the box with RescueAire II and with the G1 RIT System, including what you still need to order for each G1 RIT cylinder.", "ah": "RescueAire II comes complete: a harness-carried system with a G1 PR-14 reducer, G1 regulator, and Audi-Larm alarm, sold with a cylinder (4500 psi/60-min or 2216 psi/30-min). The G1 RIT System is a full RIT bag with a quick-connect reducer but no cylinder. It mounts on a G1 cylinder made for remote connection, and each cylinder needs its own Quick-Connect Cylinder Adapter.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "RescueAire II comes with a cylinder; G1 RIT has none and needs an adapter per cylinder", "wh": ["G1 RIT comes with a cylinder; RescueAire II has none and needs an adapter per cylinder", "Both come with a cylinder; G1 RIT also needs an adapter per cylinder", "RescueAire II comes with a cylinder; G1 RIT has none and one adapter fits all"], "hash": "sha256:e16f4484df342483b6e9103633d3fe2a62903f5889e360c1dfa5485c8ca08a42"}, {"n": 2, "q": "Describe the two G1 RIT supply lines: their length, what each ends in, and which one refills the victim's cylinder. What does the URC fitting add?", "a": "Both are 6 ft. The high-pressure line ends in a female Quick-Fill fitting and refills the victim's cylinder through his UAC. The intermediate-pressure line ends in an ExtendAire II manifold (male and female quick-disconnects) and supplies breathing air. The URC fitting on the reducer lets you link G1 RIT systems together.", "qh": "Describe the two G1 RIT supply lines: their length, what each ends in, and which one refills the victim's cylinder. What does the URC fitting add?", "ah": "Both are 6 ft. The high-pressure line ends in a female Quick-Fill fitting and refills the victim's cylinder through his UAC. The intermediate-pressure line ends in an ExtendAire II manifold (male and female quick-disconnects) and supplies breathing air. The URC fitting on the reducer lets you link G1 RIT systems together.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Both 6 ft; HP ends in Quick-Fill and refills, IP ends in ExtendAire II; URC links systems", "wh": ["Both 6 ft; IP ends in Quick-Fill and refills, HP ends in ExtendAire II; URC links systems", "Both 36 in; HP ends in Quick-Fill and refills, IP ends in ExtendAire II; URC links systems", "Both 6 ft; HP ends in Quick-Fill and refills, IP ends in ExtendAire II; URC adds a remote gauge"], "hash": "sha256:ff82dc65de63e8c194f74e3efe66eb11dc92414814928942943f9f446c0220ce"}, {"n": 3, "q": "Your RIT carries a 4500 psi supply. The downed member wears a 2216 psi G1. Per the MSA G1 manual, can you Quick-Fill him from your 4500 supply? What protects his SCBA if it's over-pressurized?", "a": "No. MSA says the air at the Quick-Fill inlet must never exceed the SCBA's operating pressure, and a high-pressure SCBA must never connect to a supply above its operating system. If an emergency fill does over-pressurize it, the G1's automatically resetting relief valve vents the excess.", "qh": "Your RIT carries a 4500 psi supply. The downed member wears a 2216 psi G1. Per the MSA G1 manual, can you Quick-Fill him from your 4500 supply? What protects his SCBA if it's over-pressurized?", "ah": "No. MSA says the air at the Quick-Fill inlet must never exceed the SCBA's operating pressure, and a high-pressure SCBA must never connect to a supply above its operating system. If an emergency fill does over-pressurize it, the G1's automatically resetting relief valve vents the excess.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No, never above his operating pressure; an auto-resetting relief valve vents", "wh": ["Yes, the reducer steps it down; an auto-resetting relief valve vents", "Yes, if his cylinder valve is fully open; an auto-resetting relief valve vents", "No, never above his operating pressure; a burst disc must then be replaced"], "hash": "sha256:f950077bbabca111ab7854a4ec543bdbe4b107d37b40c5f4c4edc64ba6bb83de"}, {"n": 4, "q": "Walk through a G1 Quick-Fill. How do you know the fill has started and finished, about how long does it take, and why might his cylinder not reach full?", "a": "With his cylinder valve fully open, push the female fitting onto his UAC until it clicks, then tug-test it. Filling starts immediately, and pressures equalize in about 60 seconds. It's done when his cylinder and remote gauges match the supply gauge. If the supply doesn't hold enough air, his cylinder won't reach full.", "qh": "Walk through a G1 Quick-Fill. How do you know the fill has started and finished, about how long does it take, and why might his cylinder not reach full?", "ah": "With his cylinder valve fully open, push the female fitting onto his UAC until it clicks, then tug-test it. Filling starts immediately, and pressures equalize in about 60 seconds. It's done when his cylinder and remote gauges match the supply gauge. If the supply doesn't hold enough air, his cylinder won't reach full.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Starts on the click; done when gauges match supply, about 60 s; supply too low", "wh": ["Starts on the click; done when gauges match supply, about 5 min; supply too low", "Starts on valve opening; done when the bell rings, about 60 s; supply too low", "Starts on the click; done when gauges match supply, about 60 s; supply too high"], "hash": "sha256:f4de5d230c7897332b7039fa7a133612048fd5f554dbb84ec26389ff783dc34b"}, {"n": 5, "q": "After you pull the hose off, air keeps hissing from the victim's UAC and the dust cap won't stay on. What do you do?", "a": "Reconnect the Quick-Fill hose to seal the leak and go to fresh air. If it won't reconnect, close his cylinder valve, put the dust cap on, reopen the valve, and leave immediately.", "qh": "After you pull the hose off, air keeps hissing from the victim's UAC and the dust cap won't stay on. What do you do?", "ah": "Reconnect the Quick-Fill hose to seal the leak and go to fresh air. If it won't reconnect, close his cylinder valve, put the dust cap on, reopen the valve, and leave immediately.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Reconnect to seal and exit; if not, close valve, cap, reopen, leave", "wh": ["Reconnect to seal and exit; if not, close valve, cap, and leave it closed", "Close valve, cap, reopen, leave; reconnect only if the cap won't stay on", "Tape the cap on and keep working; the UAC check valve holds the air"], "hash": "sha256:2a7ae3fdc52ccf484a247f27f477ba8be3e2b691f24a76a44df014fc536695d0"}, {"n": 6, "q": "Name four things the G1 manual forbids when using the UAC fitting.", "a": "Any four of: using it where a CBRN agent could be present, using it as a buddy breather (two users on one cylinder, which voids the NIOSH approval), transfilling a 5500 psi SCBA, lubricating the fittings, letting oil or grease touch them, using non-MSA hoses, or feeding air above the SCBA's operating pressure.", "qh": "Name four things the G1 manual forbids when using the UAC fitting.", "ah": "Any four of: using it where a CBRN agent could be present, using it as a buddy breather (two users on one cylinder, which voids the NIOSH approval), transfilling a 5500 psi SCBA, lubricating the fittings, letting oil or grease touch them, using non-MSA hoses, or feeding air above the SCBA's operating pressure.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "CBRN use, buddy breathing, lubricating fittings, non-MSA hoses", "wh": ["CBRN use, buddy breathing, lubricating fittings, transfilling a 4500 psi SCBA", "CBRN use, buddy breathing, lubricating fittings, filling from a separate supply", "CBRN use, buddy breathing, using the Remote Quick-Fill, non-MSA hoses"], "hash": "sha256:6b6569db6e0f6be7627de04109bc01d70444a01b9b6579fd8f11b191f9242db9"}, {"n": 7, "q": "A partner suggests connecting two G1s with ExtendAire II instead of the Quick-Fill. What happens to both SCBAs and their air time, and when is ExtendAire not allowed?", "a": "Both SCBAs become escape-only, both users must leave at once, and remaining service time drops by about half. Don't connect if the donor's low-pressure alarm is sounding or he lacks enough air for both to escape, or in a possible CBRN atmosphere. MSA says Quick-Fill has fewer risks and keeps the approval.", "qh": "A partner suggests connecting two G1s with ExtendAire II instead of the Quick-Fill. What happens to both SCBAs and their air time, and when is ExtendAire not allowed?", "ah": "Both SCBAs become escape-only, both users must leave at once, and remaining service time drops by about half. Don't connect if the donor's low-pressure alarm is sounding or he lacks enough air for both to escape, or in a possible CBRN atmosphere. MSA says Quick-Fill has fewer risks and keeps the approval.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Both escape-only, time about halved; not if donor alarm sounds or CBRN", "wh": ["Both stay in service, time about halved; not if donor alarm sounds or CBRN", "Both escape-only, time about a quarter less; not if donor alarm sounds or CBRN", "Both escape-only, time about halved; fine even with the donor alarm sounding"], "hash": "sha256:0e180b8cd87296ee1c1ada3b89643258b57a11e570f189f853db894b1528dce1"}, {"n": 8, "q": "A neighboring department's member has a Snap-Tite buddy-breather fitting. Can you connect your 2018 G1 ExtendAire II to it, and what does MSA say about connecting to another brand's UEBSS?", "a": "No. Snap-Tite and UEBSS fittings don't work correctly together. The G1's UEBSS fittings can connect to other brands' UEBSS, but NFPA 1981 (2018) doesn't require cross-brand testing, so MSA doesn't warrant either SCBA in that hookup.", "qh": "A neighboring department's member has a Snap-Tite buddy-breather fitting. Can you connect your 2018 G1 ExtendAire II to it, and what does MSA say about connecting to another brand's UEBSS?", "ah": "No. Snap-Tite and UEBSS fittings don't work correctly together. The G1's UEBSS fittings can connect to other brands' UEBSS, but NFPA 1981 (2018) doesn't require cross-brand testing, so MSA doesn't warrant either SCBA in that hookup.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No, Snap-Tite and UEBSS don't mix; other UEBSS connects, but MSA won't warrant it", "wh": ["Yes, Snap-Tite and UEBSS mix; other UEBSS connects, but MSA won't warrant it", "No, Snap-Tite and UEBSS don't mix; other UEBSS is NFPA-tested and warranted", "No, Snap-Tite and UEBSS don't mix; G1 fittings can't connect to any other brand"], "hash": "sha256:da1741dd369a74fc7bf53e081150fbf0d2c19db2d4be1f5673b3c12fdf8a298f"}, {"n": 9, "q": "You topped off a cylinder through the UAC right after its first fill, and it came up short of the rated time. What did MSA recommend?", "a": "Wait until the cylinder cools to 70 °F (21 °C) after the first fill before topping off. Air heats as it's compressed, so a hot cylinder holds less air once it cools.", "qh": "You topped off a cylinder through the UAC right after its first fill, and it came up short of the rated time. What did MSA recommend?", "ah": "Wait until the cylinder cools to 70 °F (21 °C) after the first fill before topping off. Air heats as it's compressed, so a hot cylinder holds less air once it cools.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Wait until it cools to 70 °F (21 °C) before topping off", "wh": ["Wait until it cools to 32 °F (0 °C) before topping off", "Top off right away, while the cylinder is still warm", "Wait 2 hours, then bleed it down to full with the purge"], "hash": "sha256:73de1c7502e286ae831aa8f390790d642b1bf8a7725fa4158ad35da99f5380f2"}], "sources": [{"label": "MSA G1 RescueAire II and G1 RIT System bulletin", "url": "https://media.msanet.com/advisor/G1_%20RescueAireII_and_%20RIT_System_Bulletin0105_201.pdf"}, {"label": "MSA G1 SCBA Operating Manual (RIC UAC, Quick-Fill)", "url": "https://s7d9.scene7.com/is/content/minesafetyappliances/10187007_USOperatingManual-G1SCBA2018Ed"}, {"label": "MSA G1 user assets", "url": "https://us.msasafety.com/g1-scba-user-assets?locale=en"}, {"label": "MSA G1 SCBA 2018 Edition Operating Manual 10187007-03, sections 2.4.1 (RIC UAC relief valve), 13 (UAC fitting, filling, transfilling, leakage), and 14 (ExtendAire II): same link as above", "url": ""}, {"label": "MSA RescueAire Portable Air-Supply Systems literature 0114-18-MC (2012), History only", "url": "https://www.empirescba.com/PDF/MSA-RescuAire-II-Portable-Air-Supply-System.pdf"}], "position_html": "<strong>Tree position:<\/strong> Path 04 RIT &gt; 04.2 RIT Air Supply Packs &gt; tool. <strong>Unlocks after:<\/strong> 01.2.2 MSA G1 SCBA. <strong>Cross-links:<\/strong> 09.1.1 PASS, 01.2.2 (RIC UAC and Quick-Fill).", "note_html": "Study aid only. Source: MSA bulletin 0105-201-MC (Nov 2015). Get the current G1 RIT operating instructions from MSA before operational use."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 629.31, "y": -261.45, "angle": 105.5, "vx": -370.55, "vy": 633.4, "vangle": 350.5}, "04.3": {"id": "04.3", "name": "Downed Firefighter Packaging, Drags and Removal", "path": "04", "kind": "main", "parent": null, "prereqRaw": "04.2, 03.1", "children": [], "prereqs": ["04.2", "03.1"], "unlocks": ["04.4", "04.C"], "cross": ["03.1", "03.1.1", "03.1.2"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 840, "y": -300.0, "vx": -410.0, "vy": 790, "vangle": null}, "04.4": {"id": "04.4", "name": "RIT Tool Cache and Deployment", "path": "04", "kind": "main", "parent": null, "prereqRaw": "04.3, 03.2, 03.3", "children": [], "prereqs": ["04.3", "03.2", "03.3"], "unlocks": ["04.C"], "cross": ["03.2", "03.3", "05.2.3"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1040, "y": -300.0, "vx": -410.0, "vy": 940, "vangle": null}, "04.C": {"id": "04.C", "name": "CAPSTONE: RIT Specialist", "path": "04", "kind": "capstone", "parent": null, "prereqRaw": "04.1 to 04.4", "children": [], "prereqs": ["04.1", "04.2", "04.3", "04.4"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1640, "y": -300.0, "vx": -410.0, "vy": 1390, "vangle": null}, "05.1": {"id": "05.1", "name": "Vehicle Stabilization and Extrication Scene Safety", "path": "05", "kind": "main", "parent": null, "prereqRaw": "01.0", "children": [], "prereqs": ["01.0"], "unlocks": ["05.2", "05.C"], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 440, "y": -150.0, "vx": -205.0, "vy": 490, "vangle": null}, "05.2": {"id": "05.2", "name": "Hydraulic Extrication Tools (Holmatro)", "path": "05", "kind": "main", "parent": null, "prereqRaw": "05.1", "children": ["05.2.0", "05.2.1", "05.2.2", "05.2.3"], "prereqs": ["05.1"], "unlocks": ["05.2.0", "05.2.1", "05.2.2", "05.2.3", "05.3", "05.5", "05.C"], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 640, "y": -150.0, "vx": -205.0, "vy": 640, "vangle": null}, "05.2.0": {"id": "05.2.0", "name": "Hydraulic Rescue Tools: Overview", "path": "05", "kind": "tool", "parent": "05.2", "prereqRaw": "parent 05.2", "children": [], "prereqs": ["05.2"], "unlocks": [], "cross": ["03.2"], "doc": {"title": "05.2.0 Hydraulic Rescue Tools: Overview (Holmatro Focus)", "file": "05.2.0_Hydraulic_Extrication_Tools_Overview.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>Hydraulic rescue tools (\"Jaws of Life\" is a Hurst trademark) open, cut, push, and pull vehicle and structural parts to free trapped patients. The main tools are:<\/p><ul><li><strong>Spreader:<\/strong> pushes apart, squeezes, and (with chains) pulls.<\/li><li><strong>Cutter:<\/strong> shears posts, pillars, and bars.<\/li><li><strong>Combi tool:<\/strong> spreads, cuts, and squeezes in one tool.<\/li><li><strong>Ram:<\/strong> pushes over long distances (dash rolls and lifts).<\/li><\/ul><p>Two power types (DHS SAVER, 2023):<\/p><ul><li><strong>Hose tools:<\/strong> a separate power unit (pump) pushes oil to the tool through hydraulic hose.<\/li><li><strong>Battery tools:<\/strong> self-contained, with an onboard electro-hydraulic pump. No hoses to tangle or trip on, and several tools can work at once without a pump. The trade-offs are more weight in the hands and run time limited by the battery, so long jobs may need spare batteries.<\/li><\/ul>"}, {"key": "specs", "title": "Key specs (Holmatro, current)", "html": "<ul><li><strong>Pentheon (next-gen) cordless series:<\/strong> battery-hydraulic cutters (PCU), spreaders (PSP), rams (PRA/PTR), and combi tools (PCT).<\/li><li><strong>Battery PBPA288:<\/strong> Li-ion, <strong>28 VDC, 8 Ah<\/strong>. <strong>IP57<\/strong> protection on all Pentheon tools. On-Tool Charging, and one outlet can charge up to six batteries.<\/li><li><strong>Controls:<\/strong> 360° inline two-speed control handle with stepless speed, plus training and high-speed modes. App and Self Check connectivity.<\/li><li><strong>Hose (hydraulic) tools:<\/strong> run off a power unit such as the Holmatro Spider Series pump at <strong>720 bar / 10,500 psi<\/strong> working pressure.<\/li><li><strong>Ratings:<\/strong> NFPA 1960 (US) gives HSF/LSF (highest and lowest spreading force), HPF/LPF (highest and lowest pulling force), and cutting capacity codes (letters for material category, numbers for level). EN 13204 gives the European class code (e.g., BC165I-18.8). Compare tools with these numbers, not marketing figures.<\/li><\/ul><p><strong>How the NFPA ratings are earned<\/strong> (NFPA 1960 took over the rescue-tool standard NFPA 1936 in 2024; test details from DHS SAVER, quoting NFPA 1936)<\/p><ul><li>Testing is done by an OSHA-approved third-party lab, and manufacturers must publish the results for any tool sold as NFPA compliant.<\/li><li><strong>Spreading force:<\/strong> measured at <strong>10 equally spaced points<\/strong> from fully closed to <strong>95% open<\/strong>, then calculated at the tips. The lowest of the 10 is the <strong>LSF<\/strong>, the highest is the <strong>HSF<\/strong>. Because of leverage, LSF comes with the arms closed, where door work usually starts.<\/li><li><strong>Pulling force:<\/strong> also measured at 10 test points, giving the <strong>HPF<\/strong> and <strong>LPF<\/strong>. Pulling distance is a manufacturer figure only; NFPA doesn't define it.<\/li><li><strong>Cutting:<\/strong> five material categories, each with levels <strong>1 to 9<\/strong> (thicker stock = higher number): <strong>A<\/strong> round bar, <strong>B<\/strong> flat bar, <strong>C<\/strong> round pipe, <strong>D<\/strong> square tube, <strong>E<\/strong> angle iron. For each, the cutter must completely sever the piece in <strong>one continuous motion<\/strong>, repeated at least <strong>12 times<\/strong> with the thickest material claimed. To pass the cutter test at all, it must sever the thinnest piece in all five categories.<\/li><li><strong>F (optional, added in the 2020 edition):<\/strong> ultra-high-strength 4130 steel rectangular tube, heat-treated to at least 32 HRC, made to mimic modern roof pillars. Levels run <strong>F1 to F7<\/strong>, and the cut must be repeated at least <strong>6 times<\/strong>. Failing F does <strong>not<\/strong> fail the A to E cutter test.<\/li><li><strong>\"Max\" or \"theoretical\" force<\/strong> is a manufacturer's engineering calculation, not an NFPA test. SAVER warns it may not be achievable in practice (for example, cutter force calculated after the blades have already closed).<\/li><\/ul><p><strong>Spider pump rules (Holmatro Spider owner's manual)<\/strong><\/p><ul><li>Two hose systems: <strong>Twin-line<\/strong> (separate pressure and return hoses) and <strong>Core<\/strong> (the pressure line runs inside the return line). <strong>Never use a Core product with a Twin-line hose product.<\/strong><\/li><li>Set the pump on a stable, firm base free of gravel or loose material, at least <strong>3 ft (1 m) from buildings<\/strong>. Never run it in an enclosed space: the exhaust has colorless, odorless carbon monoxide.<\/li><li>Never refuel with the engine running or near open fire, and don't overfill. Check fluid levels only with the pump level and the engine off.<\/li><li><strong>Twin-line:<\/strong> never couple or uncouple with the pump relief valve in PRESSURE/OPERATION.<\/li><li><strong>Oil spraying from the back of a tool<\/strong> means the return line is blocked or (Twin-line) disconnected, and the tool's safety valve is venting. Twin-line: switch the pump valve to RELEASE, then reconnect the return hose. Core: turn the pump off, disconnect, and connect a new hose.<\/li><li>The dead-man's handle always springs back to neutral when released.<\/li><\/ul>"}, {"key": "how", "title": "How it's used (big picture)", "html": "<ol><li>Size up the scene and hazards. Stabilize the vehicle first (chocks, cribbing, struts). The Spider manual says the vehicle or object must be stabilized before <strong>any<\/strong> extrication technique.<\/li><li>Manage the glass. Protect the patient with a hard or soft shield between the tool and the patient.<\/li><li>Open space. Typical work is door removal (spreader), roof removal (cutter), and dash roll or lift (ram).<\/li><li>Check the tool after use, clean and lubricate it, and store it per the manual.<\/li><\/ol>"}, {"key": "safety", "title": "Safety considerations (from Holmatro manuals)", "html": "<ul><li>PPE: helmet, goggles or a full face shield, gloves, full-body reflective clothing, and safety boots. Wear a filter mask when cutting glass or plastics.<\/li><li>Never get between the tool and the object. Keep bystanders back.<\/li><li><strong>Oil leak under pressure can inject into skin.<\/strong> Stop and get medical care immediately, and bring the oil spec with you.<\/li><li>Stop if the tool makes strange noises, behaves oddly, or leaks.<\/li><li>Never cut parts under hydraulic, pneumatic, electrical, or mechanical tension.<\/li><li>Never change the setting of a tool or pump safety valve.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li>George Hurst filed a patent in 1961 for a hydraulic spreader to free race drivers from roll cages. The first Hurst Rescue Tool spreader was produced in 1971 and moved from motorsports into the fire service. Early systems ran on gasoline pumps big enough to fill a pickup bed, joined to the spreader by two hoses (DHS SAVER, 2023).<\/li><li>NFPA 1936 (Standard on Rescue Tools) first took effect in 1999. In 2024 it was consolidated with NFPA 1931, 1961, 1963, and 1964 into NFPA 1960.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "On one wreck you must pop a door, shear a B-pillar, and push the dash off a driver's legs. Which tool fits each job, and which single tool could cover the first two if it's all you brought?", "a": "Spreader for the door, cutter for the B-pillar, ram for the dash push. A combi tool spreads, cuts, and squeezes, so it can do the door and the pillar, though it isn't a long-stroke push tool like a ram.", "qh": "On one wreck you must pop a door, shear a B-pillar, and push the dash off a driver's legs. Which tool fits each job, and which single tool could cover the first two if it's all you brought?", "ah": "Spreader for the door, cutter for the B-pillar, ram for the dash push. A combi tool spreads, cuts, and squeezes, so it can do the door and the pillar, though it isn't a long-stroke push tool like a ram.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Spreader for door, cutter for pillar, ram for dash; a combi covers door and pillar", "wh": ["Cutter for door, spreader for pillar, ram for dash; a combi covers door and pillar", "Spreader for door, cutter for pillar, ram for dash; a combi covers pillar and dash", "Spreader for door, cutter for pillar, combi for dash; a ram covers door and pillar"], "hash": "sha256:66c3064ca557d71cb71fc50610987dd0121efb0c3901cc8fa6a08b793e19ab8c"}, {"n": 2, "q": "Spreader A advertises a much higher \"max spreading force\" than Spreader B, but B has the higher NFPA LSF. Which number better predicts how each will start a tight door seam, and why?", "a": "The LSF. NFPA measures force at the tips at 10 points from closed to 95% open, and the lowest (normally with the arms closed, where door work begins) is the LSF. \"Max force\" is the manufacturer's own figure, not measured the same way, so it isn't a fair comparison.", "qh": "Spreader A advertises a much higher \"max spreading force\" than Spreader B, but B has the higher NFPA LSF. Which number better predicts how each will start a tight door seam, and why?", "ah": "The LSF. NFPA measures force at the tips at 10 points from closed to 95% open, and the lowest (normally with the arms closed, where door work begins) is the LSF. \"Max force\" is the manufacturer's own figure, not measured the same way, so it isn't a fair comparison.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "The NFPA LSF; measured at the tips, lowest near closed, where door work starts", "wh": ["The max force; measured at the tips, highest near closed, where door work starts", "The NFPA HSF; measured at the tips, highest near closed, where door work starts", "The NFPA LSF; measured at the tips, lowest near fully open, where door work starts"], "hash": "sha256:a1ef5825c58083a81588c5ca10aa9776dcefa8571e5d66502054740b75631ea8"}, {"n": 3, "q": "Explain how a spreader's NFPA HSF and LSF are actually measured.", "a": "A third-party lab measures spreading force at 10 equally spaced points from fully closed to 95% open and calculates it at the tips. The lowest of the 10 is the LSF and the highest is the HSF.", "qh": "Explain how a spreader's NFPA HSF and LSF are actually measured.", "ah": "A third-party lab measures spreading force at 10 equally spaced points from fully closed to 95% open and calculates it at the tips. The lowest of the 10 is the LSF and the highest is the HSF.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Third-party lab, 10 equal points from closed to 95% open, calculated at the tips", "wh": ["Third-party lab, 10 equal points from closed to 100% open, calculated at the tips", "Third-party lab, 5 equal points from closed to 95% open, calculated at the tips", "Manufacturer in-house, 10 equal points from closed to 95% open, calculated at the tips"], "hash": "sha256:51edff6eb24d182b099a9f474ca040e0d8cca5e7e0c41846170d1e7fd1eed872"}, {"n": 4, "q": "A spec sheet lists a cutter as \"A7 B7 C6 D7 E8 F3\". What do the letters and numbers mean, how is each rating earned, and what does it mean if a cutter has no F rating?", "a": "Letters are material categories (A round bar, B flat bar, C round pipe, D square tube, E angle iron) and numbers are thickness levels 1 to 9. The tool has to sever the thickest claimed piece in one continuous motion at least 12 times per category. F is an optional ultra-high-strength 4130 rectangular-tube test (levels 1 to 7, six repeats) that mimics modern roof pillars. No F rating just means it wasn't claimed or passed; failing F doesn't fail the A to E test.", "qh": "A spec sheet lists a cutter as \"A7 B7 C6 D7 E8 F3\". What do the letters and numbers mean, how is each rating earned, and what does it mean if a cutter has no F rating?", "ah": "Letters are material categories (A round bar, B flat bar, C round pipe, D square tube, E angle iron) and numbers are thickness levels 1 to 9. The tool has to sever the thickest claimed piece in one continuous motion at least 12 times per category. F is an optional ultra-high-strength 4130 rectangular-tube test (levels 1 to 7, six repeats) that mimics modern roof pillars. No F rating just means it wasn't claimed or passed; failing F doesn't fail the A to E test.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Letters = material, numbers = levels 1–9; 12 one-motion cuts; no F = not claimed or passed", "wh": ["Letters = material, numbers = levels 1–9; 6 one-motion cuts; no F = not claimed or passed", "Letters = material, numbers = levels 1–9; 12 one-motion cuts; no F = fails the A–E test", "Letters = thickness, numbers = material; 12 one-motion cuts; no F = not claimed or passed"], "hash": "sha256:e4f225bbaf83f4c0adce452730f6d1de71e01354eafd97fa8686866c52c76659"}, {"n": 5, "q": "What is the working pressure of Holmatro hose tools powered by a Spider pump, and why must you never pair a Core hose with a Twin-line pump?", "a": "720 bar / 10,500 psi. Core puts the pressure line inside the return line and Twin-line uses separate hoses, and Holmatro says never to use a Core product with a Twin-line hose product.", "qh": "What is the working pressure of Holmatro hose tools powered by a Spider pump, and why must you never pair a Core hose with a Twin-line pump?", "ah": "720 bar / 10,500 psi. Core puts the pressure line inside the return line and Twin-line uses separate hoses, and Holmatro says never to use a Core product with a Twin-line hose product.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "720 bar / 10,500 psi; Core and Twin-line hose products must never be mixed", "wh": ["720 bar / 10,500 psi; Core and Twin-line hose products may be freely mixed", "820 bar / 11,900 psi; Core and Twin-line hose products must never be mixed", "720 psi / 10,500 bar; Core and Twin-line hose products must never be mixed"], "hash": "sha256:e83d7b46db1b93d664845657f5a9248d817bae1178636e750298af19a2c50849"}, {"n": 6, "q": "A crew wants to run the gasoline Spider pump inside a parking-garage bay right beside the wreck and top off its fuel without shutting it down. What does Holmatro say?", "a": "No. Never run the pump in an enclosed space, because the exhaust carries colorless, odorless carbon monoxide. Place it on a stable base at least 3 ft (1 m) from buildings, and never refuel while the engine runs.", "qh": "A crew wants to run the gasoline Spider pump inside a parking-garage bay right beside the wreck and top off its fuel without shutting it down. What does Holmatro say?", "ah": "No. Never run the pump in an enclosed space, because the exhaust carries colorless, odorless carbon monoxide. Place it on a stable base at least 3 ft (1 m) from buildings, and never refuel while the engine runs.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No: never in an enclosed space (CO), 3 ft from buildings, never refuel running", "wh": ["Yes, if the bay door is open: keep it 3 ft from buildings, never refuel running", "No: never in an enclosed space (CO), 3 ft from buildings, refuel only at idle", "No: never in an enclosed space (CO), 1 ft from buildings, never refuel running"], "hash": "sha256:92450f95695f4904c817f1cebf13d53056abb7e404b5032263910eb7bf234bfc"}, {"n": 7, "q": "Midway through a cut with a Twin-line hose tool, oil starts squirting from the back of the tool. What happened, and how do you fix it?", "a": "The return line is blocked or disconnected and the tool's safety valve is venting. Switch the pump relief valve to RELEASE, then reconnect the return hose. (On Core, turn the pump off, disconnect, and fit a new hose.)", "qh": "Midway through a cut with a Twin-line hose tool, oil starts squirting from the back of the tool. What happened, and how do you fix it?", "ah": "The return line is blocked or disconnected and the tool's safety valve is venting. Switch the pump relief valve to RELEASE, then reconnect the return hose. (On Core, turn the pump off, disconnect, and fit a new hose.)", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Return line blocked or off, safety valve venting; pump to RELEASE, reconnect return", "wh": ["Pressure line blocked or off, safety valve venting; pump to RELEASE, reconnect pressure", "Return line blocked or off, safety valve venting; reconnect return, then pump to RELEASE", "Return line blocked or off, safety valve venting; pump to PRESSURE, reconnect return"], "hash": "sha256:78c004c0da2bbaf357e5269bf050a08a3e808be55eaf0a1ce71777ce9ad6afa7"}, {"n": 8, "q": "What must happen to the vehicle before any cutting or spreading begins, and what goes between the tool and the patient?", "a": "Size it up and stabilize it (chocks, cribbing, struts), since Holmatro says the vehicle must be stabilized before any extrication technique. Then put a hard or soft shield between the tool and the patient.", "qh": "What must happen to the vehicle before any cutting or spreading begins, and what goes between the tool and the patient?", "ah": "Size it up and stabilize it (chocks, cribbing, struts), since Holmatro says the vehicle must be stabilized before any extrication technique. Then put a hard or soft shield between the tool and the patient.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Stabilize it (chocks, cribbing, struts); a hard or soft shield before the patient", "wh": ["Stabilize it after the door is open; a hard or soft shield before the patient", "Remove the glass, then stabilize it; a hard or soft shield before the patient", "Stabilize it (chocks, cribbing, struts); a shield only for glass, not tool work"], "hash": "sha256:a119b4b057109daf326eecec9b4b17c51d70cdd7dce32b6df1c1ce7ae8c12857"}, {"n": 9, "q": "A member gets a pinhole jet of hydraulic oil into his hand. He says it barely hurts. What do you do?", "a": "Treat it as an injection injury: stop and get him to a hospital immediately, and give the medical staff the hydraulic oil specification.", "qh": "A member gets a pinhole jet of hydraulic oil into his hand. He says it barely hurts. What do you do?", "ah": "Treat it as an injection injury: stop and get him to a hospital immediately, and give the medical staff the hydraulic oil specification.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Injection injury: stop, hospital now, and bring the hydraulic oil spec", "wh": ["Minor puncture: clean and bandage it, and report it after the call", "Injection injury: stop, hospital now, and bring the tool's pressure rating", "Injection injury: finish the evolution, then hospital with the oil spec"], "hash": "sha256:87ae63f61324ecd9250262d8da18a88759ff4284ff03ba90d6c32ef3727f838a"}, {"n": 10, "q": "Your department is choosing between battery tools and a hose-tool set. Give one operational advantage and one limitation of battery tools.", "a": "Advantage: no hoses or pump, so no tangle or trip hazard and several tools can work at once. Limitation: heavier in the hands, and run time is limited by the battery, so long jobs may need spare batteries.", "qh": "Your department is choosing between battery tools and a hose-tool set. Give one operational advantage and one limitation of battery tools.", "ah": "Advantage: no hoses or pump, so no tangle or trip hazard and several tools can work at once. Limitation: heavier in the hands, and run time is limited by the battery, so long jobs may need spare batteries.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No hoses or pump, several tools at once; heavier, battery-limited run time", "wh": ["No hoses or pump, several tools at once; lighter, but needs a power unit nearby", "No hoses or pump, several tools at once; heavier, but unlimited run time", "Lighter in the hands, several tools at once; hoses can still tangle or trip"], "hash": "sha256:1a9439dc4fd1fdb9e7fcce81751d6fb304e9308d2fb37cad19c249881cf9ea70"}], "sources": [{"label": "Holmatro Next-Gen Pentheon Series catalog 2026", "url": "https://www.holmatro.com/app/uploads/2026/04/F0025241_0002-1.pdf"}, {"label": "Holmatro HCT 511 Series combi tool user manual", "url": "https://www.holmatro.com/app/uploads/2026/09/G0020541_0001.pdf"}, {"label": "Holmatro Spider Series pump owner's manual (safety instructions, Twin-line and Core operation)", "url": "https://www.holmatro.com/app/uploads/2026/07/F0019415_0001.pdf"}, {"label": "Holmatro Rescue (manuals on product pages)", "url": "https://www.holmatro.com/rescue/"}, {"label": "DHS SAVER, Battery-Powered Combination Rescue Tools for Vehicle Extrication market survey (2023; NFPA 1936 test definitions and history)", "url": "https://www.dhs.gov/sites/default/files/2023-08/Battery-Powered%20Combination%20Rescue%20Tools%20for%20Vehicle%20Extrication%20Market%20Survey%20Report.pdf"}, {"label": "DHS SAVER, Battery-Powered Cutting Tools for Vehicle Extrication market survey (2023; F-category test)", "url": "https://www.dhs.gov/sites/default/files/2023-07/23_0721_st_battery_powered_cutting_tools_for_vehicle_extrication_market_survey_report.pdf"}, {"label": "HURST Jaws of Life, NFPA 1936 2020 compliance release, Apr 28 2020 (F-test levels F1 to F7; Firehouse copy)", "url": "https://www.firehouse.com/rescue/vehicle-extrication/press-release/21135957/hurst-jaws-of-life-hurst-jaws-of-life-earns-nfpa-1936-2020-compliant-status"}, {"label": "Howell Rescue, NFPA 1936 explainer (standard enacted 1999; History only)", "url": "https://howellrescue.com/nfpa-cut-ratings/"}, {"label": "NFPA 1960 standard page (consolidation of NFPA 1936)", "url": "https://www.nfpa.org/codes-and-standards/nfpa-1960-standard-development/1960"}, {"label": "Library copy: Drive > Firefighter_Reference_Library > 02_Hydraulic_Rescue_Tools", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 05 Technical Rescue &amp; Extrication &gt; 05.2 Hydraulic Extrication Tools (Level-3 overview). <strong>Unlocks after:<\/strong> 05.1 Vehicle Stabilization and Scene Safety (planned), 01.0 Fundamentals. <strong>Unlocks:<\/strong> 05.2.1 Spreaders, 05.2.2 Cutters, 05.2.3 Combi Tools, then 05.3 Rams and Shoring. <strong>Cross-links:<\/strong> 03.2 Forcible Entry (Holmatro T1).", "note_html": "Study aid only. Use your tool's own manual and your department extrication SOPs."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 669.01, "y": -122.47, "angle": 43.5, "vx": -192.31, "vy": 602.07, "vangle": 288.5}, "05.2.1": {"id": "05.2.1", "name": "Holmatro Pentheon Spreaders", "path": "05", "kind": "tool", "parent": "05.2", "prereqRaw": "parent 05.2", "children": [], "prereqs": ["05.2"], "unlocks": [], "cross": [], "doc": {"title": "05.2.1 Holmatro Pentheon Spreaders (PSP Series)", "file": "05.2.1_Holmatro_Pentheon_Spreaders.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>Battery-powered hydraulic spreaders. The arms open to push apart (door popping, creating purchase points), close to squeeze (crushing to make pivot points), and pull with a chain set.<\/p>"}, {"key": "specs", "title": "Key specs (battery not included in weights marked \"excl.\")", "html": "<p>| Model | Spread distance | Max spread force | NFPA 1960 HSF / LSF | Weight ready (with battery) | |---|---|---|---|---| | PSP40CL | 20.1 in | 29,450 lbf | 11,915 / 8,768 lbf | 33.7 lb | | PSP40 | 28.5 in | 62,947 lbf | 15,557 / 8,790 lbf | 43 lb | | PSP50 | 28.5 in | 82,280 lbf | 20,907 / 11,240 lbf | 46.3 lb | | PSP60 | 32.3 in | 117,350 lbf | 25,179 / 13,489 lbf | 54.9 lb |<\/p><ul><li><strong>Max pulling force (NFPA HPF):<\/strong> 10,791 / 11,623 / 15,062 / 17,760 lbf (PSP40CL to PSP60).<\/li><li><strong>NFPA LPF (lowest pulling force):<\/strong> 6,070 / 6,070 / 7,419 / 8,543 lbf.<\/li><li><strong>Min. spreading force (EN 13204):<\/strong> 9,667 / 9,667 / 12,140 / 13,938 lbf. <strong>Max squeezing force:<\/strong> 10,566 / 13,264 / 30,349 / 28,551 lbf.<\/li><li><strong>EN 13204 class:<\/strong> PSP40 AS43/725-19.5, PSP50 AS54/725-21, PSP60 BS62/820-24.9 (none listed for PSP40CL).<\/li><li><strong>Reading the numbers:<\/strong> \"max spread force\" is Holmatro's figure. NFPA HSF/LSF are measured at the tips at 10 points from closed to 95% open (see 05.2.0), so the PSP60's NFPA LSF (13,489 lbf) is far below its 117,350 lbf max.<\/li><li><strong>All models:<\/strong> IP57, PBPA288 28 V 8 Ah battery, and 360° two-speed inline handle.<\/li><li><strong>Extreme Grip tips:<\/strong> the outside teeth alternately point in opposite directions, with a taller middle row of teeth on both sides, for grip over the full spreading range.<\/li><li><strong>Accessories:<\/strong> pulling attachment sets (all models), cutting tip sets (PSP40/50/60 only, none for PSP40CL), pulling chain sets, and on-tool charging cord.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li>Stabilize the vehicle and shield the patient.<\/li><li><strong>Spreading:<\/strong> put both tips in the gap, with the load about <strong>25 mm (1 in) from the tip ends<\/strong>, using the <strong>full tip width<\/strong>. Then open.<\/li><li><strong>No gap yet:<\/strong> insert one tip, close to clamp and bend the metal away, and repeat until both tips fit (Holmatro procedure). Or make an opening with another tool.<\/li><li><strong>Squeezing:<\/strong> put the tips over the object, load near the tip ends, and close.<\/li><li><strong>Pulling:<\/strong> fully open, make sure the shortening-hook openings don't point down, attach the chains to the objects so they can't slip off, pull them tight and hook them to the pulling attachments, then close.<\/li><li>Store it with the tips slightly open (so it holds no pressure) and the handle in neutral (per the Holmatro manual).<\/li><\/ol><p><strong>Pulling rules (Holmatro HCT 511 manual, pulling accessories)<\/strong><\/p><ul><li>The pulling accessories are for <strong>horizontal movement of loads only<\/strong>. <strong>Hoisting is not permitted<\/strong> with them.<\/li><li>Keep the load supported from underneath and watch what it's doing the whole time.<\/li><li>The tool must move freely and stay in a <strong>straight line between both pulling attachments<\/strong>.<\/li><li>Use the pulling attachments only with their matching chain set. The shortening hooks grab only the chain.<\/li><li>Keep the lock pins locked, and never operate the tool while fitting or removing accessories.<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Load only the tips, using their full surface. If the tips lose grip, <strong>stop<\/strong> and find a new push point.<\/li><li>Never place your body between the tool and the object, or between moving parts.<\/li><li>Watch the vehicle and structure the whole time. Secure parts that could fly off.<\/li><li>Hold the tool by its carrying handle with both hands, standing on a stable base.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "A crew member says the PSP60 is the obvious pick for a tight door seam because it's rated at 117,350 lbf. What is its NFPA LSF, and why is that the more useful number for starting the spread?", "a": "13,489 lbf. NFPA measures force at the tips at 10 points from closed to 95% open, and the LSF (the lowest, with the arms near closed) is where door work starts. The 117,350 lbf \"max\" is Holmatro's own figure, not that NFPA measurement.", "qh": "A crew member says the PSP60 is the obvious pick for a tight door seam because it's rated at 117,350 lbf. What is its NFPA LSF, and why is that the more useful number for starting the spread?", "ah": "13,489 lbf. NFPA measures force at the tips at 10 points from closed to 95% open, and the LSF (the lowest, with the arms near closed) is where door work starts. The 117,350 lbf \"max\" is Holmatro's own figure, not that NFPA measurement.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "13,489 lbf; LSF is measured at the tips near closed, where door work starts", "wh": ["25,179 lbf; HSF is measured at the tips near closed, where door work starts", "13,938 lbf; LSF is measured at the tips near closed, where door work starts", "13,489 lbf; LSF is measured at the tips fully open, where door work starts"], "hash": "sha256:81f7cee06fba417eb8cec7a31121fd77c22cc55d5f84861ba6f035eb5a43a2bf"}, {"n": 2, "q": "Where exactly on the tips should the load sit when you spread, and why does Holmatro want the full tip width used?", "a": "About 25 mm (1 in) from the tip ends, using the full width. Holmatro says to load only the tips and use their entire surface, which spreads the load and helps keep the tips from losing grip.", "qh": "Where exactly on the tips should the load sit when you spread, and why does Holmatro want the full tip width used?", "ah": "About 25 mm (1 in) from the tip ends, using the full width. Holmatro says to load only the tips and use their entire surface, which spreads the load and helps keep the tips from losing grip.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "About 25 mm (1 in) from the tip ends, full width, to spread load and keep grip", "wh": ["About 50 mm (2 in) from the tip ends, full width, to spread load and keep grip", "Right at the very tip ends, full width, to spread load and keep grip", "About 25 mm (1 in) from the tip ends, center only, to spread load and keep grip"], "hash": "sha256:34cec1b728182cfbbe3c199b7655f0a166d23282ff8213561f485c2c094c5c9e"}, {"n": 3, "q": "Halfway through a door pop, the tips start skidding off the sheet metal. What do you do?", "a": "Stop and find a new push-off point. Don't keep forcing a slipping tip.", "qh": "Halfway through a door pop, the tips start skidding off the sheet metal. What do you do?", "ah": "Stop and find a new push-off point. Don't keep forcing a slipping tip.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Stop and find a new push-off point", "wh": ["Keep opening; the Extreme Grip teeth will bite in", "Switch to high speed to drive the tips through", "Reposition one tip and keep forcing the same seam"], "hash": "sha256:4aced9bb1c0d20092a2bc3940916846aac72ed68baa7d5b5dad4214903e52b45"}, {"n": 4, "q": "Walk through setting up a pull with the chain set. Which way must the shortening-hook openings face?", "a": "Fully open the tool, make sure the hook openings don't point down, attach the chains so they can't slip off, pull them tight and hook them to the pulling attachments, then close the arms.", "qh": "Walk through setting up a pull with the chain set. Which way must the shortening-hook openings face?", "ah": "Fully open the tool, make sure the hook openings don't point down, attach the chains so they can't slip off, pull them tight and hook them to the pulling attachments, then close the arms.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Fully open, hook openings not down, chains secured and tight to attachments, close", "wh": ["Fully close, hook openings not down, chains secured and tight to attachments, open", "Fully open, hook openings facing down, chains secured and tight to attachments, close", "Fully open, hook openings not down, close, then tighten chains to attachments"], "hash": "sha256:5b8d518a77325c38d81f9164df42a401474184a91642b287971d1197f7b7d74d"}, {"n": 5, "q": "Your partner wants to hook the pulling chains to a dash and lift it straight up with the spreader. Is that allowed? What else must be true of the load during any pull?", "a": "No. The pulling accessories are for horizontal movement only, and hoisting is not permitted. The load must be supported from underneath and watched throughout.", "qh": "Your partner wants to hook the pulling chains to a dash and lift it straight up with the spreader. Is that allowed? What else must be true of the load during any pull?", "ah": "No. The pulling accessories are for horizontal movement only, and hoisting is not permitted. The load must be supported from underneath and watched throughout.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No, horizontal only, no hoisting; load supported underneath and watched", "wh": ["Yes, if lifted slowly; load supported underneath and watched", "No, horizontal only, no hoisting; load hanging free so it can move", "Yes, with the matching chain set; load watched throughout the lift"], "hash": "sha256:01cf57d61a91546734f0d59a8e398ca0a5316f4d31bbc3fb5c9d056bd775110c"}, {"n": 6, "q": "During a pull, the spreader is twisted at an angle between the two chains. Why is that a problem?", "a": "It breaks Holmatro's rule that the tool must move freely and stay in a straight line between both pulling attachments. Stop and re-rig the chains so the tool hangs free and in line before you continue.", "qh": "During a pull, the spreader is twisted at an angle between the two chains. Why is that a problem?", "ah": "It breaks Holmatro's rule that the tool must move freely and stay in a straight line between both pulling attachments. Stop and re-rig the chains so the tool hangs free and in line before you continue.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Tool must move freely, in line between attachments; stop and re-rig", "wh": ["Only the chains must be straight; tool angle doesn't matter, keep pulling", "Tool must move freely, in line between attachments; finish, then re-rig", "Tool must be braced against the car, in line with one chain; re-rig"], "hash": "sha256:40bb21dee06cc1923b1e13e0a20bb6f35d38a951b7a5ee141d9828be3c05fa7d"}, {"n": 7, "q": "There's no gap at the door to fit both tips. How do you make room with the spreader alone?", "a": "Insert one tip, close the arms to clamp the metal, bend it away, and repeat until both tips fit. If there's still no opening, make one with another tool or accessory.", "qh": "There's no gap at the door to fit both tips. How do you make room with the spreader alone?", "ah": "Insert one tip, close the arms to clamp the metal, bend it away, and repeat until both tips fit. If there's still no opening, make one with another tool or accessory.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Insert one tip, close to clamp and bend metal away, repeat until both tips fit", "wh": ["Insert one tip, open to pry the metal away, repeat until both tips fit", "Insert both tips at the seam edge, open slowly, repeat until both tips fit", "Insert one tip, close to clamp and bend metal toward you, then cut it free"], "hash": "sha256:314f9e8c738e83da9dcdbb7617c8958f4652e0812da04b6c2972e95ab35f98f9"}, {"n": 8, "q": "The PSP40CL and PSP40 have almost the same NFPA LSF. What do you give up if you choose the lighter CL model?", "a": "Spread distance (20.1 in vs 28.5 in), some HSF (11,915 vs 15,557 lbf) and pulling force (10,791 vs 11,623 lbf HPF), and the option of a cutting tip set, which isn't offered for the CL. You save about 9 lb (33.7 vs 43 lb ready to use).", "qh": "The PSP40CL and PSP40 have almost the same NFPA LSF. What do you give up if you choose the lighter CL model?", "ah": "Spread distance (20.1 in vs 28.5 in), some HSF (11,915 vs 15,557 lbf) and pulling force (10,791 vs 11,623 lbf HPF), and the option of a cutting tip set, which isn't offered for the CL. You save about 9 lb (33.7 vs 43 lb ready to use).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Less spread (20.1 vs 28.5 in), HSF and HPF, and no cutting tips; saves ~9 lb", "wh": ["Less spread (20.1 vs 28.5 in), HSF and HPF, and no pulling set; saves ~9 lb", "Less spread (20.1 vs 28.5 in), HSF and HPF, and no cutting tips; saves ~19 lb", "Less spread (28.5 vs 32.3 in), HSF and HPF, and no cutting tips; saves ~9 lb"], "hash": "sha256:ea6f085306915d84b92ab769ee683fffddbba4514c49c6a375a740d04f313c25"}], "sources": [{"label": "Holmatro Next-Gen Pentheon catalog 2026", "url": "https://www.holmatro.com/app/uploads/2026/04/F0025241_0002-1.pdf"}, {"label": "Holmatro HCT 511 user manual (spreading, squeezing, and pulling procedures and safety rules)", "url": "https://www.holmatro.com/app/uploads/2026/09/G0020541_0001.pdf"}, {"label": "DHS SAVER, Battery-Powered Combination Rescue Tools market survey (2023; NFPA spreading and pulling force definitions)", "url": "https://www.dhs.gov/sites/default/files/2023-08/Battery-Powered%20Combination%20Rescue%20Tools%20for%20Vehicle%20Extrication%20Market%20Survey%20Report.pdf"}, {"label": "Holmatro Rescue", "url": "https://www.holmatro.com/rescue/"}, {"label": "Holmatro User Manual PSP (Pentheon spreaders)", "url": "https://www.holmatro.com/app/uploads/2026/02/F0027627_0001.pdf"}], "position_html": "<strong>Tree position:<\/strong> Path 05 &gt; 05.2 Hydraulic Extrication Tools &gt; tool. <strong>Unlocks after:<\/strong> 05.2.0 Overview. <strong>Next:<\/strong> 05.2.2 Cutters.", "note_html": "Study aid only. Specs are from the Holmatro Next-Gen Pentheon catalog (2026). Check your tool's plate and manual."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 650.69, "y": -111.45, "angle": 74.5, "vx": -174.58, "vy": 614.02, "vangle": 319.5}, "05.2.2": {"id": "05.2.2", "name": "Holmatro Pentheon Cutters and Mini Cutter", "path": "05", "kind": "tool", "parent": "05.2", "prereqRaw": "parent 05.2", "children": [], "prereqs": ["05.2"], "unlocks": [], "cross": [], "doc": {"title": "05.2.2 Holmatro Pentheon Cutters (PCU Series) and CCU10 Mini Cutter", "file": "05.2.2_Holmatro_Pentheon_Cutters.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>Battery-hydraulic cutters for posts, pillars, roof rails, and bars. The <strong>30° inclined cutter jaw<\/strong> reduces repositioning, and the slimmer <strong>i-Bolt<\/strong> center bolt helps the jaws reach tight spots.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<p>| Model | Max cut opening | Theoretical cut force | Round bar (S235) | NFPA 1960 cutting | Weight ready | |---|---|---|---|---|---| | PCU30CL | 6.7 in | 123,420 lbf | 1.2 in | A6 B5 C6 D6 E6 F2 | 33.7 lb | | PCU40 | 6.7 in | 171,754 lbf | 1.4 in | A7 B7 C6 D7 E8 F3 | 41.4 lb | | PCU50 | 7.2 in | 312,260 lbf | 1.6 in | A8 B8 C7 D9 E9 F4 | 47.6 lb | | PCU60 | 8.1 in | 396,788 lbf | 1.9 in | A9 B9 C9 D9 E9 F4 | 55.3 lb |<\/p><ul><li>All models are IP57 and use the 28 V 8 Ah PBPA288 battery.<\/li><li><strong>CCU10 Mini Cutter:<\/strong> 49,458 lbf, 2.3 in opening, 0.9 in round bar, 10.8 lb, and up to 70 cuts per 2 Ah battery. Made for pedals, steering wheels, headrests, rebar, and chains.<\/li><li><strong>CCU10 controls:<\/strong> push the button further for more speed, a control slide to switch between opening and closing, start-stop mode to save battery, and a battery that fits the Cordless Alliance System (CAS) of professional power tools.<\/li><\/ul><p><strong>Reading the cutting numbers<\/strong><\/p><ul><li><strong>NFPA codes:<\/strong> A round bar, B flat bar, C round pipe, D square tube, E angle iron, each at level 1 to 9. <strong>F<\/strong> is the optional ultra-high-strength 4130 rectangular-tube test (levels 1 to 7) that mimics modern roof pillars (DHS SAVER). Example: A9 means 1¾ in A-36 hot-rolled round bar; A6 means 1 in (NFPA table in the Holmatro HCT manual, Annex B).<\/li><li><strong>Round bar (S235)<\/strong> is a different test: S235 steel per the European EN 13204 standard. So the PCU60's 1.9 in S235 bar and its NFPA A9 (1¾ in A-36) aren't in conflict.<\/li><li><strong>Theoretical cutting force<\/strong> is a calculation, not an NFPA test. SAVER warns such figures may not be reachable in practice.<\/li><\/ul><p><strong>Blade design (catalog)<\/strong><\/p><ul><li>The <strong>U-shaped blades<\/strong> pull material into the cutting recess, close to the center bolt, <strong>where the cutting force is highest<\/strong>.<\/li><li>The <strong>i-Bolt<\/strong> presses the blades together directly (no blade holder in between). That keeps blade separation to a minimum and removes the need to tighten the bolt after each use.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li>Find hidden hazards before cutting (airbag inflators, seat-belt pretensioners, high-strength steel). Follow your department's vehicle-anatomy SOP.<\/li><li>Open the blades and set the cutter <strong>perpendicular<\/strong> to the material.<\/li><li>Put the material <strong>as deep in the blades as possible<\/strong> (near the center bolt), then close.<\/li><li><strong>After every use (Holmatro Pentheon after-use sheet 21370):<\/strong> check general condition and oil leaks, readable labels, the deadman's handle (moves smoothly, returns to neutral) and its protective cover, the blades for damage (a little WD-40 against corrosion), the LEDs and carrying handle, and clean battery connectors with a fully charged battery. Put Teflon oil on the hinges. Store with the blades not completely closed, tips just overlapped.<\/li><\/ol><p><strong>More from the CU 5000 sheet (a hose-tool cutter, but the checks carry over)<\/strong><\/p><ul><li>Lightly oil steel parts with WD-40 before storing. Check that the snap (smalley) rings are present and undamaged.<\/li><li>If the integrated lights stay on for about <strong>5 seconds and then switch off<\/strong>, replace the AA battery.<\/li><li><strong>Annually or after 100 hours:<\/strong> grease with Molylube 26 HD-EP only. Use Teflon oil for after-use and monthly lubrication.<\/li><li>Contact the Holmatro dealer if any item doesn't work properly.<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li><strong>Stop immediately if the blades separate or go out of line.<\/strong> That can cause serious injury and tool damage. Holmatro says blades that aren't perpendicular to the material can separate.<\/li><li><strong>Blade check:<\/strong> if the blades are more than <strong>0.6 mm<\/strong> apart, have a Holmatro Certified Technician replace them (Holmatro HCT 511 manual, blade maintenance).<\/li><li>Don't cut with only the blade tips. Don't cut hardened fasteners or bolts.<\/li><li>Never cut parts under tension or pressure (struts, springs, gas cylinders).<\/li><li>Put a protective shield between the cut and the patient. On the CU 5000 hose cutter, oil on the back of the control handle means the safety valve tripped, so get the tool serviced.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Where in the blades should the material sit for the cut, and why does Holmatro's blade design favor that spot?", "a": "As deep as possible, close to the center bolt, with the blades perpendicular. Holmatro's U-shaped blades pull material into that recess because that's where the cutting force is highest.", "qh": "Where in the blades should the material sit for the cut, and why does Holmatro's blade design favor that spot?", "ah": "As deep as possible, close to the center bolt, with the blades perpendicular. Holmatro's U-shaped blades pull material into that recess because that's where the cutting force is highest.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Deep, near the center bolt, blades perpendicular; cutting force is highest there", "wh": ["Near the blade tips, blades perpendicular; cutting force is highest there", "Deep, near the center bolt, blades at 30°; cutting force is highest there", "Mid-blade, between tip and bolt, blades perpendicular; force is even there"], "hash": "sha256:32231583f3071d7e71ec1a12ed613d126900e670ac57984ce4efffc8956dec0d"}, {"n": 2, "q": "Mid-cut, you see the blades start to spread apart sideways. What do you do, what likely caused it, and what blade-gap limit later sends the cutter to a technician?", "a": "Stop immediately. Blades that aren't perpendicular to the material can separate, causing serious injury and tool damage. If a check later shows more than 0.6 mm separation, a Holmatro Certified Technician must replace the blades.", "qh": "Mid-cut, you see the blades start to spread apart sideways. What do you do, what likely caused it, and what blade-gap limit later sends the cutter to a technician?", "ah": "Stop immediately. Blades that aren't perpendicular to the material can separate, causing serious injury and tool damage. If a check later shows more than 0.6 mm separation, a Holmatro Certified Technician must replace the blades.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Stop; blades not perpendicular to the material; over 0.6 mm gap means technician", "wh": ["Finish the cut; blades not perpendicular to the material; over 0.6 mm gap means technician", "Stop; blades not perpendicular to the material; over 6 mm gap means technician", "Stop; center bolt too loose; retighten it yourself if the gap is over 0.6 mm"], "hash": "sha256:c62c6e7d2518ccf9b143a948c4a641b5a8f36b5b782402bbee9f108ddea9856b"}, {"n": 3, "q": "You're cutting a roof post in tight quarters. What does the 30° inclined jaw buy you?", "a": "More working space between the tool and the car, so cuts are safer and quicker without repositioning the tool.", "qh": "You're cutting a roof post in tight quarters. What does the 30° inclined jaw buy you?", "ah": "More working space between the tool and the car, so cuts are safer and quicker without repositioning the tool.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "More working space between tool and car, so less repositioning", "wh": ["Higher cutting force near the tips, so less repositioning", "A wider max cut opening, so less repositioning", "Less blade separation, so no bolt retightening after use"], "hash": "sha256:54b7594b2c30f831c01c010c32a7f27b9300851bd6a185d512cec542cbb40e47"}, {"n": 4, "q": "Name four checks on Holmatro's Pentheon cutter after-use checklist, and say how the cutter should be stored.", "a": "Any four of: general condition and oil leaks, readable labels, the deadman's handle moving smoothly and returning to neutral, its protective cover, blade damage (with a little WD-40 against corrosion), the LEDs and carrying handle, Teflon oil on the hinges, clean battery connectors, and a fully charged battery. Store it with the blades not completely closed and the tips just overlapped (Holmatro after-use sheet 21370).", "qh": "Name four checks on Holmatro's Pentheon cutter after-use checklist, and say how the cutter should be stored.", "ah": "Any four of: general condition and oil leaks, readable labels, the deadman's handle moving smoothly and returning to neutral, its protective cover, blade damage (with a little WD-40 against corrosion), the LEDs and carrying handle, Teflon oil on the hinges, clean battery connectors, and a fully charged battery. Store it with the blades not completely closed and the tips just overlapped (Holmatro after-use sheet 21370).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Leaks, labels, deadman handle, LEDs, battery charged; store tips just overlapped", "wh": ["Leaks, labels, deadman handle, LEDs, battery charged; store blades fully closed", "Leaks, labels, deadman handle, LEDs, battery charged; store blades wide open", "Leaks, labels, deadman handle, LEDs, Molylube on hinges; store tips just overlapped"], "hash": "sha256:52b3715d960ff4c6e5e0889d4417664c4d50560efcef197be4ea3c3f5e21d498"}, {"n": 5, "q": "Your department wants a cutter for ultra-high-strength B-posts. Which part of the NFPA rating speaks to that, how do the PCU30CL and PCU60 compare on it, and why not just compare theoretical cutting force?", "a": "The F rating, the optional test on heat-treated 4130 rectangular tube that mimics modern roof pillars. The PCU30CL is F2 and the PCU60 is F4. Theoretical force is a calculation, not an NFPA test, and SAVER warns it may not be reachable in practice.", "qh": "Your department wants a cutter for ultra-high-strength B-posts. Which part of the NFPA rating speaks to that, how do the PCU30CL and PCU60 compare on it, and why not just compare theoretical cutting force?", "ah": "The F rating, the optional test on heat-treated 4130 rectangular tube that mimics modern roof pillars. The PCU30CL is F2 and the PCU60 is F4. Theoretical force is a calculation, not an NFPA test, and SAVER warns it may not be reachable in practice.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "The F rating; PCU30CL F2 vs PCU60 F4; theoretical force isn't an NFPA test", "wh": ["The F rating; PCU30CL F4 vs PCU60 F2; theoretical force isn't an NFPA test", "The E rating; PCU30CL E6 vs PCU60 E9; theoretical force isn't an NFPA test", "The F rating; PCU30CL F2 vs PCU60 F4; theoretical force is the NFPA result"], "hash": "sha256:24316957c82f8fb9b521c8014151b114458fee1d7b2505188a68388fdd13cca5"}, {"n": 6, "q": "One member says the PCU60 cuts 1.9 in bar; another reads its NFPA A9 as 1¾ in. Who is right?", "a": "Both. 1.9 in is S235 round bar under the European EN 13204 standard. A9 is the NFPA level for 1¾ in A-36 hot-rolled round bar. They're different tests.", "qh": "One member says the PCU60 cuts 1.9 in bar; another reads its NFPA A9 as 1¾ in. Who is right?", "ah": "Both. 1.9 in is S235 round bar under the European EN 13204 standard. A9 is the NFPA level for 1¾ in A-36 hot-rolled round bar. They're different tests.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Both: 1.9 in is EN 13204 S235 bar, A9 is NFPA 1¾ in A-36 bar", "wh": ["Both: 1.9 in is NFPA A-36 bar, A9 is EN 13204 1¾ in S235 bar", "Only the first: the NFPA A9 level means 1.9 in A-36 bar", "Only the second: the 1.9 in figure is theoretical, not a test"], "hash": "sha256:d61f91eb917626922711b4314011dbf6a59e6b7e0f9551c6c2ee3c7667f72e75"}, {"n": 7, "q": "During the after-use check of a CU 5000 hose cutter, you find oil at the back of the control handle, and the lights stay on for about 5 seconds and then shut off. What does each mean?", "a": "On the CU 5000, oil at the back of the handle means the safety valve was activated during use, so contact the dealer for service. Lights that shut off after about 5 seconds need a new AA battery.", "qh": "During the after-use check of a CU 5000 hose cutter, you find oil at the back of the control handle, and the lights stay on for about 5 seconds and then shut off. What does each mean?", "ah": "On the CU 5000, oil at the back of the handle means the safety valve was activated during use, so contact the dealer for service. Lights that shut off after about 5 seconds need a new AA battery.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Handle oil: safety valve tripped, get service; lights: replace the AA battery", "wh": ["Handle oil: normal lube runoff, wipe it off; lights: replace the AA battery", "Handle oil: safety valve tripped, get service; lights: recharge the PBPA288", "Handle oil: safety valve tripped, get service; lights: normal auto-off, no action"], "hash": "sha256:db86a25d2afeddd6d1edacdffcad4ead1118614f32cc95362ea0f751fb877249"}, {"n": 8, "q": "You need to cut a brake pedal deep in a crushed footwell, where a full-size cutter won't fit. What tool fits, and what are its key numbers?", "a": "The CCU10 Mini Cutter: 2.3 in opening, 49,458 lbf, cuts 0.9 in round bar, weighs 10.8 lb, and gets up to 70 cuts per 2 Ah battery. It's made for pedals, steering wheels, and headrests.", "qh": "You need to cut a brake pedal deep in a crushed footwell, where a full-size cutter won't fit. What tool fits, and what are its key numbers?", "ah": "The CCU10 Mini Cutter: 2.3 in opening, 49,458 lbf, cuts 0.9 in round bar, weighs 10.8 lb, and gets up to 70 cuts per 2 Ah battery. It's made for pedals, steering wheels, and headrests.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "CCU10: 2.3 in opening, 49,458 lbf, 0.9 in bar, 10.8 lb, 70 cuts/2 Ah", "wh": ["CCU10: 2.3 in opening, 49,458 lbf, 1.2 in bar,
