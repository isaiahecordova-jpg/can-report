 applicant lives in Sutter County and wants to work close to home. Which unit should they rank, and what other counties does that unit's plan cover?", "a": "NEU, the Nevada-Yuba-Placer Unit. Its 2026 Unit Fire Plan title covers Nevada, Yuba, Placer, Sierra, and Sutter. HQ is in Auburn.", "qh": "An FFI applicant lives in Sutter County and wants to work close to home. Which unit should they rank, and what other counties does that unit's plan cover?", "ah": "NEU, the Nevada-Yuba-Placer Unit. Its 2026 Unit Fire Plan title covers Nevada, Yuba, Placer, Sierra, and Sutter. HQ is in Auburn."}, {"n": 4, "q": "Why does the official Administrative Units GIS show 27 units when the Contacts page lists 21?", "a": "The GIS layer includes the 6 Contract Counties (MRN, KRN, LAC, ORC, SBC, VNC) as administrative units. The Contacts table lists only the 21 CAL FIRE field units (12 Northern, 9 Southern). 21 + 6 = 27.", "qh": "Why does the official Administrative Units GIS show 27 units when the Contacts page lists 21?", "ah": "The GIS layer includes the 6 Contract Counties (MRN, KRN, LAC, ORC, SBC, VNC) as administrative units. The Contacts table lists only the 21 CAL FIRE field units (12 Northern, 9 Southern). 21 + 6 = 27."}, {"n": 5, "q": "A new hire asks where the \"Northern Region HQ\" is. What's the accurate answer?", "a": "There isn't a single answer. The Facilities inventory lists the Northern Region RHQ at 135 Ridgeway Ave, Santa Rosa, and a separate Northern Operations Center at 6101 Airport Road, Redding. The Region Chief's phone is (530) 224-2460, a Redding-area number. Both are official records, so don't collapse them.", "qh": "A new hire asks where the \"Northern Region HQ\" is. What's the accurate answer?", "ah": "There isn't a single answer. The Facilities inventory lists the Northern Region RHQ at 135 Ridgeway Ave, Santa Rosa, and a separate Northern Operations Center at 6101 Airport Road, Redding. The Region Chief's phone is (530) 224-2460, a Redding-area number. Both are official records, so don't collapse them."}, {"n": 6, "q": "Besides running a unit, name three outside-facing roles of a Unit Chief.", "a": "Any three of: State Office of Emergency Services Operational Area Coordinator; coordinating contract fire protection with local governing bodies; liaison with CDCR on cooperative programs (EX-5386).", "qh": "Besides running a unit, name three outside-facing roles of a Unit Chief.", "ah": "Any three of: State Office of Emergency Services Operational Area Coordinator; coordinating contract fire protection with local governing bodies; liaison with CDCR on cooperative programs (EX-5386)."}, {"n": 7, "q": "How does the official text describe a Battalion Chief's job, and name four programs a BC might manage.", "a": "The first working supervisory level, a subunit manager directing personnel in department programs. Examples: training, safety, the emergency command center, fire prevention, air operations, camps, and fire stations (Join CAL FIRE BC page).", "qh": "How does the official text describe a Battalion Chief's job, and name four programs a BC might manage.", "ah": "The first working supervisory level, a subunit manager directing personnel in department programs. Examples: training, safety, the emergency command center, fire prevention, air operations, camps, and fire stations (Join CAL FIRE BC page)."}, {"n": 8, "q": "Which region is Marin County in, and what kind of administrative unit is it?", "a": "Northern Region. Marin (MRN) is a Contract County, not one of the 21 CAL FIRE field units (Administrative Units GIS).", "qh": "Which region is Marin County in, and what kind of administrative unit is it?", "ah": "Northern Region. Marin (MRN) is a Contract County, not one of the 21 CAL FIRE field units (Administrative Units GIS)."}, {"n": 9, "q": "You find two different official phone numbers for the Tulare Unit HQ. How do you handle that in a study doc or a call list?", "a": "Record both with their sources: 916-584-1447 (Contacts page) and 559-732-5954 (Facilities Public View HQ). Ranger's rule is not to silently correct either one.", "qh": "You find two different official phone numbers for the Tulare Unit HQ. How do you handle that in a study doc or a call list?", "ah": "Record both with their sources: 916-584-1447 (Contacts page) and 559-732-5954 (Facilities Public View HQ). Ranger's rule is not to silently correct either one."}, {"n": 10, "q": "Which unit covers Imperial County, and where is its HQ?", "a": "SDU, the San Diego Unit (2026 San Diego Imperial Unit Fire Plan). HQ is at 2249 Jamacha Road, El Cajon.", "qh": "Which unit covers Imperial County, and where is its HQ?", "ah": "SDU, the San Diego Unit (2026 San Diego Imperial Unit Fire Plan). HQ is at 2249 Jamacha Road, El Cajon."}], "sources": [{"label": "CAL FIRE Contacts (units, region chiefs, phones)", "url": "https://www.fire.ca.gov/about/resources/cal-fire-contacts"}, {"label": "CAL FIRE Administrative Units (GIS hub)", "url": "https://hub-calfire-forestry.hub.arcgis.com/datasets/cal-fire-administrative-units-1"}, {"label": "Administrative Units feature service cdfadmin19_1", "url": "https://services1.arcgis.com/jUJYIo9tSA7EHvfZ/arcgis/rest/services/cdfadmin19_1/FeatureServer"}, {"label": "CAL FIRE Facilities for Wildland Fire Protection, Public View", "url": "https://services1.arcgis.com/jUJYIo9tSA7EHvfZ/arcgis/rest/services/CAL_FIRE_Facilities_for_Wildland_Fire_Protection_-_Public_View/FeatureServer"}, {"label": "OSFM Pre-Fire Planning (2026 Unit Fire Plan titles)", "url": "https://osfm.fire.ca.gov/what-we-do/community-wildfire-preparedness-and-mitigation/pre-fire-planning"}, {"label": "Unit Chief exam bulletin EX-5386", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=5386"}, {"label": "Assistant Chief exam bulletin EX-4883", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4883"}, {"label": "Join CAL FIRE, Battalion Chief", "url": "https://www.joincalfire.com/classifications/fire-protection/firefighting-and-paramedics/battalion-chief"}, {"label": "CalHR Civil Service Pay Scale (updated 10/26/2026)", "url": "https://www.calhr.ca.gov/wp-content/uploads/sites/361/2026/09/PS_Sec_15.pdf"}, {"label": "FFI Work Location Form", "url": "https://www.fire.ca.gov/-/media/11FF7C81D681409C9A52CF4BD53A58BB"}, {"label": "Ranger batches and datasets: /workspace/can-report/calfire/calfire-batch-01.md, calfire-batch-01-addendum.md, calfire-batch-03.md, calfire-batch-03-administrative-units.csv, calfire-batch-03-facilities-public-view.csv", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 1. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> none listed in tree.py.", "note_html": "Study aid only. Source: Ranger calfire-batch-01, -01 addendum, and -03 (CAL FIRE Contacts page, Administrative Units GIS, Facilities Public View, OSFM 2026 Unit Fire Plan titles, and exam bulletins). There's no official org-chart graphic, so this structure comes from official text. Chief names are a 17 Nov 2026 snapshot."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [{"title": "CAL FIRE Administrative Units (cdfadmin19_1)", "rows": 27, "description": "Official Administrative Units extract (cdfadmin19_1), 27 polygons: 21 CAL FIRE field units plus 6 contract counties, with Unit, Unit Code, and Region. Downloaded 17 November 2026. Builder should render this as a lookup; do not create a tree node per unit.", "url": "https://gis.data.cnra.ca.gov/api/download/v1/items/d8bfc5ad7ede4e1ca60b0666efc2b50d/csv?layers=0"}, {"title": "CAL FIRE Facilities for Wildland Fire Protection — Public View", "rows": 1617, "description": "Official Facilities Public View extract queried 17 November 2026 (layer modified 5 August 2026): 1,617 records (1,566 Active; 39 Decommissioned; 12 Temporarily Decommissioned). Use as a station/camp/base lookup; do not create a tree node per facility. Current San Diego Unit code is SDU. MVU is a legacy code and belongs only in the node's history object, not in current unit coding.", "url": "https://data.ca.gov/@cal-fire/facilities-for-wildland-fire-protection1"}], "x": 1450.69, "y": 638.55, "angle": 74.5, "vx": 850.42, "vy": 1214.02, "vangle": 319.5}, "10.6.2": {"id": "10.6.2", "name": "Rank Ladder and CalHR Pay (FFI to Unit Chief)", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": [], "doc": {"title": "10.6.2 Rank Ladder and CalHR Pay (FFI to Unit Chief)", "file": "10.6.2_Rank_Ladder_and_CalHR_Pay_FFI_to_Unit_Chief.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>CAL FIRE's fire-protection ladder runs from a seasonal <strong>Fire Fighter I<\/strong> up to <strong>Unit Chief<\/strong>. Each rank is a CalHR civil-service class with its own code and pay range. The <strong>CalHR pay scale is the later official rate table<\/strong>. Recruiting pages and some exam bulletins lag behind it.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<p>Pay below is from the CalHR pay scale updated 10/26/2026, monthly:<\/p><ul><li><strong>Fire Fighter I (1083):<\/strong> $4,590 to $5,803. Non-tenured (NT).<\/li><li><strong>Fire Fighter II (1082):<\/strong> Range A $4,766 to $6,181. Range B $5,102 to $6,613.<\/li><li><strong>Fire Apparatus Engineer (1077):<\/strong> Range A $5,551 to $6,856. Range B $5,934 to $7,342.<\/li><li><strong>Fire Captain (1095):<\/strong> Range A $5,934 to $7,694. Range B $6,513 to $8,483. Range C $6,354 to $8,234.<\/li><li><strong>Battalion Chief (9723):<\/strong> $6,882 to $8,930.<\/li><li><strong>Assistant Chief (1039):<\/strong> $10,569 to $13,674.<\/li><li><strong>Unit Chief (1037):<\/strong> $11,093 to $14,360.<\/li><\/ul><p>Other pay facts:<\/p><ul><li><strong>Level names (official text):<\/strong> Battalion Chief is \"the first working supervisory level.\" Assistant Chief is \"the full supervisory level.\" Unit Chief is the administrative level that manages a unit.<\/li><li><strong>Class mergers, effective 31 July 2025:<\/strong> FFII 1082 merged with FFII-Paramedic 1755. FAE 1077 merged with FAE-Paramedic 1756. Captain 1095 merged with Captain-Paramedic 1757. Paramedic work is now a range of the merged class. The legacy codes still appear on the pay scale.<\/li><li><strong>FFI posting (JC-533177):<\/strong> $4,590 to $5,803 per month, plus <strong>EDWC<\/strong> (Extended Duty Week Compensation) of $1,560 to $1,972 every 4 weeks. Annual compensation is $56,521 to $71,457 (max of 9 months). New-to-state hires start at the minimum of the range.<\/li><li><strong>Captain bulletin (EX-5398):<\/strong> annual Range A $97,416 to $126,323, Range B $106,925 to $139,275, Range C (paramedic) $108,420 to $143,392. The paramedic range adds a <strong>$250 to $6,000 paramedic bonus paid every November<\/strong>.<\/li><li><strong>Pay above Unit Chief:<\/strong> Forestry and Fire Protection Administrator (1031) has the same range as Unit Chief. How \"Region Chief\" maps to CEA class 7500 is <strong>unverified<\/strong>. Director pay was <strong>not found<\/strong> in the pay-scale extract.<\/li><li><strong>Don't confuse<\/strong> CAL FIRE's 1083/1082 series with the separate \"Fire Fighter/Fire Chief Series\" (8979/8977) used at other state facilities.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<p><strong>Pay-source conflicts (shown side by side, not blended):<\/strong><\/p><ul><li><strong>FFI:<\/strong> JC-533177 and the pay scale both say $4,590 to $5,803. The Join CAL FIRE recruiting page still shows $4,296 to $5,432. The recruiting page lags.<\/li><li><strong>FFII:<\/strong> bulletin EX-4603 says Range A $4,650 to $6,030 and Range B $4,978 to $6,452. The pay scale says Range A $4,766 to $6,181 and Range B $5,102 to $6,613.<\/li><li><strong>FAE:<\/strong> bulletin EX-4473 says Range A $5,416 to $6,689 and Range B $5,789 to $7,163. The pay scale says Range A $5,551 to $6,856 and Range B $5,934 to $7,342.<\/li><li><strong>Battalion Chief:<\/strong> Join CAL FIRE says $6,714 to $8,712. The pay scale says $6,882 to $8,930.<\/li><li><strong>Unit Chief:<\/strong> the older bulletin EX-4515 (2025) said $9,411 to $12,182. The 2026 bulletin EX-5386 and the pay scale say $11,093 to $14,360.<\/li><li><strong>Assistant Chief:<\/strong> Join CAL FIRE shows $8,966 to $11,600. EX-4883 and the pay scale show $10,569 to $13,674.<\/li><\/ul><p>Ranger's handling rule: for current base monthly rates, use the pay scale as the later official table, but report what each bulletin printed.<\/p>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li><strong>Archived CalHR class specs (Ranger batch 04):<\/strong> these come from Wayback snapshots (FFI 9 Jul 2025 and 24 Mar 2013; FFII, FAE, and Captain 9 Oct 2014; Chief series 31 May 2015). Footers mostly say \"Updated 6/3/2012,\" so they may predate the 31 July 2025 mergers.<ul><li><strong>FFI (1083), archived definition:<\/strong> \"Under close supervision, as a temporary employee, to do heavy physical work involved in fire fighting as a member of a fire crew...\"<\/li><li><strong>FFII (1082) and FAE (1077), archived:<\/strong> \"Eligibles selected for positions in this classification are placed in an apprenticeship program.\"<\/li><li><strong>Chief series, archived class dates:<\/strong> Battalion Chief established 01/18/1995. Assistant Chief established 02/06/1934. Unit Chief established 10/08/1959. \"Series established July 28, 1971.\"<\/li><\/ul><\/li><li><strong>Legacy paramedic classes:<\/strong> FFII-Paramedic 1755, FAE-Paramedic 1756, and Captain-Paramedic 1757 were separate classes before the 31 July 2025 mergers.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "The Join CAL FIRE page shows FFI pay of $4,296 to $5,432, but the CalCareers posting shows $4,590 to $5,803. Which reflects current pay, and how do you know?", "a": "The posting's $4,590 to $5,803 matches the CalHR Civil Service Pay Scale updated 10/26/2026. Batch 01 notes that the Join CAL FIRE figures lag the official pay scale and CalCareers.", "qh": "The Join CAL FIRE page shows FFI pay of $4,296 to $5,432, but the CalCareers posting shows $4,590 to $5,803. Which reflects current pay, and how do you know?", "ah": "The posting's $4,590 to $5,803 matches the CalHR Civil Service Pay Scale updated 10/26/2026. Batch 01 notes that the Join CAL FIRE figures lag the official pay scale and CalCareers."}, {"n": 2, "q": "Put these in order from entry to top, with class codes: Unit Chief, FAE, Battalion Chief, FFI, Captain, Assistant Chief, FFII.", "a": "FFI (1083), FFII (1082), FAE (1077), Fire Captain (1095), Battalion Chief (9723), Assistant Chief (1039), Unit Chief (1037). Sources: pay scale and exam bulletins.", "qh": "Put these in order from entry to top, with class codes: Unit Chief, FAE, Battalion Chief, FFI, Captain, Assistant Chief, FFII.", "ah": "FFI (1083), FFII (1082), FAE (1077), Fire Captain (1095), Battalion Chief (9723), Assistant Chief (1039), Unit Chief (1037). Sources: pay scale and exam bulletins."}, {"n": 3, "q": "A paramedic FFII candidate asks if she should look for a separate \"FFII-Paramedic\" exam. What do you tell her?", "a": "There's no separate exam. Effective 31 July 2025, FFII (1082) and FFII-Paramedic (1755) merged, and candidates must pass the FFII exam for both paramedic and non-paramedic vacancies (EX-4603). Paramedic work is now a range of the merged class.", "qh": "A paramedic FFII candidate asks if she should look for a separate \"FFII-Paramedic\" exam. What do you tell her?", "ah": "There's no separate exam. Effective 31 July 2025, FFII (1082) and FFII-Paramedic (1755) merged, and candidates must pass the FFII exam for both paramedic and non-paramedic vacancies (EX-4603). Paramedic work is now a range of the merged class."}, {"n": 4, "q": "Why is the FFI annual compensation on JC-533177 stated as a \"max of 9 months,\" and what's the FFI job type?", "a": "FFI is a Non-Tenured, Full Time classification. The posting computes annual pay on a maximum of 9 months, which fits a seasonal or temporary entry class (JC-533177; the pay scale marks 1083 as NT).", "qh": "Why is the FFI annual compensation on JC-533177 stated as a \"max of 9 months,\" and what's the FFI job type?", "ah": "FFI is a Non-Tenured, Full Time classification. The posting computes annual pay on a maximum of 9 months, which fits a seasonal or temporary entry class (JC-533177; the pay scale marks 1083 as NT)."}, {"n": 5, "q": "A Fire Captain on the paramedic range asks what extra pay he gets beyond base, and when. Use the Captain bulletin.", "a": "Range C (paramedic) carries a $250 to $6,000 paramedic bonus paid every November. Annual compensation is $108,420 to $143,392 (EX-5398).", "qh": "A Fire Captain on the paramedic range asks what extra pay he gets beyond base, and when. Use the Captain bulletin.", "ah": "Range C (paramedic) carries a $250 to $6,000 paramedic bonus paid every November. Annual compensation is $108,420 to $143,392 (EX-5398)."}, {"n": 6, "q": "A Unit Chief bulletin from 2025 says $9,411 to $12,182, and a 2026 bulletin says $11,093 to $14,360. Which is current, and why?", "a": "The 2026 figures. The 2026 bulletin EX-5386 matches the 10/26/2026 pay scale. Batch 01 marks EX-4515's older range as superseded.", "qh": "A Unit Chief bulletin from 2025 says $9,411 to $12,182, and a 2026 bulletin says $11,093 to $14,360. Which is current, and why?", "ah": "The 2026 figures. The 2026 bulletin EX-5386 matches the 10/26/2026 pay scale. Batch 01 marks EX-4515's older range as superseded."}, {"n": 7, "q": "A posting at a state hospital is for \"Fire Fighter\" in class 8979. Is that a step on the CAL FIRE ladder?", "a": "No. CalHR's 8979/8977 \"Fire Fighter/Fire Chief Series\" is for other state facilities. CAL FIRE's ladder uses 1083/1082/1077/1095/9723/1039/1037.", "qh": "A posting at a state hospital is for \"Fire Fighter\" in class 8979. Is that a step on the CAL FIRE ladder?", "ah": "No. CalHR's 8979/8977 \"Fire Fighter/Fire Chief Series\" is for other state facilities. CAL FIRE's ladder uses 1083/1082/1077/1095/9723/1039/1037."}, {"n": 8, "q": "What do the official descriptions call the Battalion Chief, Assistant Chief, and Unit Chief levels?", "a": "Battalion Chief is the first working supervisory level. Assistant Chief is the full supervisory level. Unit Chief is the administrative level with management responsibility for a unit (Join CAL FIRE BC page, EX-4883, EX-5386).", "qh": "What do the official descriptions call the Battalion Chief, Assistant Chief, and Unit Chief levels?", "ah": "Battalion Chief is the first working supervisory level. Assistant Chief is the full supervisory level. Unit Chief is the administrative level with management responsibility for a unit (Join CAL FIRE BC page, EX-4883, EX-5386)."}, {"n": 9, "q": "An FFI's posting lists \"EDWC.\" What is it, how much is it for FFI, and how often is it paid?", "a": "EDWC is Extended Duty Week Compensation. For FFI it's $1,560 to $1,972, paid every 4 weeks, and it is listed separately from the $4,590 to $5,803 monthly base (JC-533177). It comes from CalCareers postings, not the alpha pay-scale extract.", "qh": "An FFI's posting lists \"EDWC.\" What is it, how much is it for FFI, and how often is it paid?", "ah": "EDWC is Extended Duty Week Compensation. For FFI it's $1,560 to $1,972, paid every 4 weeks, and it is listed separately from the $4,590 to $5,803 monthly base (JC-533177). It comes from CalCareers postings, not the alpha pay-scale extract."}], "sources": [{"label": "CalHR Civil Service Pay Scale, Alpha by Class Title (updated 10/26/2026)", "url": "https://www.calhr.ca.gov/wp-content/uploads/sites/361/2026/09/PS_Sec_15.pdf"}, {"label": "CalHR CAL FIRE class-code list (2025)", "url": "https://www.calhr.ca.gov/wp-content/uploads/sites/361/2025/05/rev-5.3.22-CalFIRE-3.4.2020-clean-version.pdf"}, {"label": "Firefighter I posting JC-533177", "url": "https://calcareers.ca.gov/CalHrPublic/Jobs/JobPosting.aspx?JobControlId=533177"}, {"label": "FFII exam bulletin EX-4603", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4603"}, {"label": "FAE exam bulletin EX-4473", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4473"}, {"label": "Fire Captain exam bulletin EX-5398", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=5398"}, {"label": "Assistant Chief exam bulletin EX-4883", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4883"}, {"label": "Unit Chief exam bulletin EX-5386 (2026)", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=5386"}, {"label": "Unit Chief exam bulletin EX-4515 (2025, older pay)", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4515"}, {"label": "Join CAL FIRE, Fire Fighter I", "url": "https://www.joincalfire.com/classifications/fire-protection/firefighting-and-paramedics/fire-fighter-i"}, {"label": "Join CAL FIRE, Battalion Chief", "url": "https://www.joincalfire.com/classifications/fire-protection/firefighting-and-paramedics/battalion-chief"}, {"label": "CalHR Fire Fighter/Fire Chief Series 8979", "url": "https://www.calhr.ca.gov/state-hr-professionals/Pages/8979.aspx"}, {"label": "Ranger batch: /workspace/can-report/calfire/calfire-batch-01.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 2. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> none listed in tree.py.", "note_html": "Study aid only. Source: CalHR Civil Service Pay Scale, Alpha by Class Title (updated 10/26/2026), plus CalCareers postings and bulletins (Ranger calfire-batch-01). Pay is monthly base unless noted, and it changes. Always check the current pay scale."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1452.98, "y": 666.75, "angle": 79.0, "vx": 887.99, "vy": 1238.81, "vangle": 359.0}, "10.6.3": {"id": "10.6.3", "name": "Related Classifications (Aviation, Heavy Equipment, Forestry, Prevention, OSFM)", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.6.9", "10.6.10"], "doc": {"title": "10.6.3 Related Classifications (Aviation, Heavy Equipment, Forestry, Prevention, OSFM)", "file": "10.6.3_Related_Classifications_Aviation_Heavy_Equipment_Forestry_Prevention_OSFM.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>These are the career tracks next to the main fire-protection ladder (10.6.2): <strong>aviation, heavy equipment, resource management (forestry), fire prevention, and the Office of the State Fire Marshal (OSFM) and law enforcement<\/strong>. Some feed back into the fire ladder. For example, a Heavy Fire Equipment Operator can reach Battalion Chief through a separate experience pattern.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<p>Monthly pay ranges (CalHR pay scale, 10/26/2026):<\/p><p><strong>Aviation<\/strong><\/p><ul><li>Forestry Fire Pilot (1046): $7,948 to $10,488.<\/li><li>Aviation Officer II, Flight Operations (1056) or Maintenance (6882): $8,440 to $10,938.<\/li><li>Aviation Officer III, Flight Operations (1053) or Maintenance (1050): $9,276 to $12,032.<\/li><li>Senior Aviation Officer (1052): $12,936 to $15,225.<\/li><\/ul><p><strong>Heavy equipment<\/strong><\/p><ul><li>Heavy Fire Equipment Operator, HFEO (6387): Range A $6,230 to $7,694. Range B $6,838 to $8,446.<\/li><\/ul><p><strong>Forestry<\/strong><\/p><ul><li>Forestry Aide (1060): $3,744 to $4,630 (NT).<\/li><li>Forestry Technician (1085): Range A $4,148 to $5,379.<\/li><li>Forestry Assistant I (1086) and II (1093).<\/li><li>Forester I, Nonsupervisory (1054): $6,932 to $8,997.<\/li><li>Forester II, Supervisory (1042): $9,428 to $12,226.<\/li><li>Forester III (1041): $9,897 to $12,843.<\/li><\/ul><p><strong>Fire prevention<\/strong><\/p><ul><li>Fire Prevention Specialist I (1067): $4,148 to $5,433.<\/li><li>Fire Prevention Specialist II (1069): $4,747 to $6,216.<\/li><\/ul><p><strong>OSFM<\/strong><\/p><ul><li>State Fire Marshal Trainee (8980): $6,392 to $7,489.<\/li><li>Deputy State Fire Marshal (9086): Range A $6,965 to $8,585. Range B $7,298 to $9,858.<\/li><li>DSFM III, Specialist (9013) or Supervisor (9010).<\/li><li>Division Chief, CSFM Office (8966): $10,783 to $13,482.<\/li><\/ul><p><strong>Arson and bomb<\/strong><\/p><ul><li>Arson and Bomb Investigator Assistant (8894).<\/li><li>Arson and Bomb Investigator (8997): $7,276 to $9,994.<\/li><li>Senior Arson and Bomb Investigator (9015): $8,504 to $11,814.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>HFEO to Battalion Chief (Pattern II):<\/strong> five years as an HFEO, two of them through a formal Training and Development assignment to Fire Captain, plus Basic Fire Control training, \"which includes the Fire Fighter Academy and Company Officer Academy\" (Join CAL FIRE BC page).<\/li><li><strong>Fire Captain specialty assignments (EX-5398):<\/strong> peace officer/fire prevention, dispatcher, assistant air attack coordinator, helitack captain, training instructor, and paramedic supervision.<\/li><li><strong>Aviation fire officers:<\/strong> the OV-10 crew is a pilot plus an observer (a Chief Officer or Fire Captain). The <strong>Air Attack Officer<\/strong> is a fire officer who works with the incident commander and directs drops (see 10.6.9).<\/li><li><strong>Law enforcement:<\/strong> \"Law Enforcement personnel enforce forest and fire laws and conduct investigations into the cause of fires,\" including arson and civil cost recovery (Fire Protection page).<\/li><li><strong>Forestry:<\/strong> timber harvest plans on non-federal land are prepared by <strong>Registered Professional Foresters<\/strong>. CAL FIRE administers the Forest Practice Act and licenses logging operators on non-federal lands (Our Organization page).<\/li><li><strong>OSFM:<\/strong> \"supports the mission of CAL FIRE by focusing on fire prevention.\" It regulates buildings and hazardous-liquid pipelines, gives statewide direction on wildland fire prevention, develops building standards, and runs training. Its elements are engineering, education, enforcement, and support from the State Board of Fire Services. <strong>State Fire Training (SFT)<\/strong> is an OSFM division. The current State Fire Marshal is Daniel Berlant.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li>OSFM has been \"part of the CAL FIRE team since 1995\" (Our Organization page).<\/li><li>The Forest Practice Act was passed in 1945 and revised in 1973 (Our Organization page).<\/li><li>The Assistant State Fire Marshal (8963) appears on the 2025 class list but was <strong>not found<\/strong> in the 10/26/2026 pay-scale extract.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "A Heavy Fire Equipment Operator wants to become a Battalion Chief without ever holding the Captain class. Is there a path? What exactly does it require?", "a": "Yes, BC Pattern II. It takes five years of state service as an HFEO, two of them through a formal Training and Development assignment to the Fire Captain class, plus Basic Fire Control training (Fire Fighter Academy and Company Officer Academy). Source: Join CAL FIRE BC page.", "qh": "A Heavy Fire Equipment Operator wants to become a Battalion Chief without ever holding the Captain class. Is there a path? What exactly does it require?", "ah": "Yes, BC Pattern II. It takes five years of state service as an HFEO, two of them through a formal Training and Development assignment to the Fire Captain class, plus Basic Fire Control training (Fire Fighter Academy and Company Officer Academy). Source: Join CAL FIRE BC page."}, {"n": 2, "q": "A Fire Captain loves aviation but doesn't want to be a pilot. What aviation roles do the records show for fire officers?", "a": "Fire Captain specialty assignments include assistant air attack coordinator and helitack captain (EX-5398). On the OV-10, the observer is a Chief Officer or Fire Captain acting as Air Attack Officer, working with the incident commander and directing drops (OV-10 page).", "qh": "A Fire Captain loves aviation but doesn't want to be a pilot. What aviation roles do the records show for fire officers?", "ah": "Fire Captain specialty assignments include assistant air attack coordinator and helitack captain (EX-5398). On the OV-10, the observer is a Chief Officer or Fire Captain acting as Air Attack Officer, working with the incident commander and directing drops (OV-10 page)."}, {"n": 3, "q": "Compare a Fire Prevention Specialist with a Fire Captain on a peace officer/fire prevention assignment. Which is a fire-ladder rank, and which is a separate classification?", "a": "Fire Captain (1095) is on the fire ladder, and peace officer/fire prevention is one of its specialty assignments (EX-5398). Fire Prevention Specialist I/II (1067/1069) are separate classes with their own pay ($4,148 to $5,433 and $4,747 to $6,216).", "qh": "Compare a Fire Prevention Specialist with a Fire Captain on a peace officer/fire prevention assignment. Which is a fire-ladder rank, and which is a separate classification?", "ah": "Fire Captain (1095) is on the fire ladder, and peace officer/fire prevention is one of its specialty assignments (EX-5398). Fire Prevention Specialist I/II (1067/1069) are separate classes with their own pay ($4,148 to $5,433 and $4,747 to $6,216)."}, {"n": 4, "q": "\"Division Chief, CSFM Office\" and an Assistant Chief \"serving as Division Chief\" sound alike. What's the difference?", "a": "Division Chief, California State Fire Marshal's Office (8966) is its own CalHR class ($10,783 to $13,482). In the fire-protection series, \"Division Chief\" is an assignment of the Assistant Chief class (1039), not a separate class (EX-4883).", "qh": "\"Division Chief, CSFM Office\" and an Assistant Chief \"serving as Division Chief\" sound alike. What's the difference?", "ah": "Division Chief, California State Fire Marshal's Office (8966) is its own CalHR class ($10,783 to $13,482). In the fire-protection series, \"Division Chief\" is an assignment of the Assistant Chief class (1039), not a separate class (EX-4883)."}, {"n": 5, "q": "Who prepares timber harvest plans on non-federal land, and what does CAL FIRE do under the Forest Practice Act?", "a": "Registered Professional Foresters prepare them. CAL FIRE administers the Forest Practice Act and licenses logging operators on non-federal lands (Our Organization page).", "qh": "Who prepares timber harvest plans on non-federal land, and what does CAL FIRE do under the Forest Practice Act?", "ah": "Registered Professional Foresters prepare them. CAL FIRE administers the Forest Practice Act and licenses logging operators on non-federal lands (Our Organization page)."}, {"n": 6, "q": "Trace the forestry series from the entry class to Forester III. Which class is non-tenured, and how does Forester I differ from Forester II?", "a": "Forestry Aide (1060, NT, non-tenured), Forestry Technician (1085), Forestry Assistant I (1086), Forestry Assistant II (1093), Forester I (1054), Forester II (1042), Forester III (1041). Forester I is nonsupervisory and Forester II is supervisory (pay scale titles).", "qh": "Trace the forestry series from the entry class to Forester III. Which class is non-tenured, and how does Forester I differ from Forester II?", "ah": "Forestry Aide (1060, NT, non-tenured), Forestry Technician (1085), Forestry Assistant I (1086), Forestry Assistant II (1093), Forester I (1054), Forester II (1042), Forester III (1041). Forester I is nonsupervisory and Forester II is supervisory (pay scale titles)."}, {"n": 7, "q": "What do CAL FIRE law enforcement personnel do, and which classifications on the pay scale cover arson and bomb work?", "a": "They enforce forest and fire laws and investigate fire causes, including arson and civil cost recovery (Fire Protection page). Pay-scale classes: Arson and Bomb Investigator Assistant (8894), Arson and Bomb Investigator (8997), and Senior Arson and Bomb Investigator (9015).", "qh": "What do CAL FIRE law enforcement personnel do, and which classifications on the pay scale cover arson and bomb work?", "ah": "They enforce forest and fire laws and investigate fire causes, including arson and civil cost recovery (Fire Protection page). Pay-scale classes: Arson and Bomb Investigator Assistant (8894), Arson and Bomb Investigator (8997), and Senior Arson and Bomb Investigator (9015)."}, {"n": 8, "q": "Describe OSFM's role inside CAL FIRE and name its four program elements.", "a": "OSFM supports CAL FIRE's mission by focusing on fire prevention: regulating buildings and hazardous-liquid pipelines, wildland fire-prevention direction, building standards, and training. Its elements are engineering, education, enforcement, and support from the State Board of Fire Services (OSFM About page).", "qh": "Describe OSFM's role inside CAL FIRE and name its four program elements.", "ah": "OSFM supports CAL FIRE's mission by focusing on fire prevention: regulating buildings and hazardous-liquid pipelines, wildland fire-prevention direction, building standards, and training. Its elements are engineering, education, enforcement, and support from the State Board of Fire Services (OSFM About page)."}, {"n": 9, "q": "Aviation Officer II comes in two versions with the same pay. What are they, and how can you tell them apart on paperwork?", "a": "Flight Operations (1056) and Maintenance (6882), both $8,440 to $10,938. The class code tells them apart. The same split exists at Aviation Officer III (1053 and 1050).", "qh": "Aviation Officer II comes in two versions with the same pay. What are they, and how can you tell them apart on paperwork?", "ah": "Flight Operations (1056) and Maintenance (6882), both $8,440 to $10,938. The class code tells them apart. The same split exists at Aviation Officer III (1053 and 1050)."}], "sources": [{"label": "CalHR Civil Service Pay Scale (updated 10/26/2026)", "url": "https://www.calhr.ca.gov/wp-content/uploads/sites/361/2026/09/PS_Sec_15.pdf"}, {"label": "CalHR CAL FIRE class-code list (2025)", "url": "https://www.calhr.ca.gov/wp-content/uploads/sites/361/2025/05/rev-5.3.22-CalFIRE-3.4.2020-clean-version.pdf"}, {"label": "Join CAL FIRE, Battalion Chief", "url": "https://www.joincalfire.com/classifications/fire-protection/firefighting-and-paramedics/battalion-chief"}, {"label": "Fire Captain exam bulletin EX-5398", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=5398"}, {"label": "Assistant Chief exam bulletin EX-4883", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4883"}, {"label": "CAL FIRE OV-10 page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program/cal-fire-ov10"}, {"label": "CAL FIRE Fire Protection", "url": "https://www.fire.ca.gov/what-we-do/fire-protection"}, {"label": "CAL FIRE Our Organization", "url": "https://www.fire.ca.gov/about/our-organization"}, {"label": "OSFM About Us", "url": "https://osfm.fire.ca.gov/about-us"}, {"label": "OSFM Accredited Academies (SFT)", "url": "https://osfm.fire.ca.gov/what-we-do/state-fire-training/accredited-academies"}, {"label": "Ranger batches: /workspace/can-report/calfire/calfire-batch-01.md, calfire-batch-02.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 3. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 10.6.9 Aviation Program (Aircraft and Bases), 10.6.10 Engines, Dozers, and Mobile Equipment.", "note_html": "Study aid only. Source: CalHR Civil Service Pay Scale (updated 10/26/2026) and the 2025 CAL FIRE class-code list (Ranger calfire-batch-01), plus official CAL FIRE and OSFM program pages. Most entries are <strong>pay and title facts only<\/strong>. Duty statements for these classes weren't retrieved."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1427.02, "y": 666.75, "angle": 101.0, "vx": 807.31, "vy": 1202.07, "vangle": 251.5}, "10.6.4": {"id": "10.6.4", "name": "Programs and Contract Counties", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.6.8", "10.6.11", "10.6.13"], "doc": {"title": "10.6.4 Programs and Contract Counties", "file": "10.6.4_Programs_and_Contract_Counties.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>CAL FIRE's official \"All Programs\" list has 12 entries: Fire Protection; Natural Resource Management; Office of the State Fire Marshal; Fire and Resource Assessment Program; Board of Forestry and Fire Protection; Communications; Returning Veterans; Enlisting Their Skills for CAL FIRE Service; Equal Employment Opportunity; Professional Standards; Law Enforcement &amp; Civil Cost Recovery; Tribal Workforce Development.<\/p><p><strong>Contract Counties<\/strong> are the six counties (Kern, Los Angeles, Marin, Orange, Santa Barbara, Ventura) that protect the State Responsibility Area (SRA) inside their borders <strong>under contract with CAL FIRE<\/strong>.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Contract Counties<\/strong> protect <strong>3.4 million acres of SRA<\/strong> and provide initial attack there. CAL FIRE funds them for prevention and suppression, including crew salaries, facility maintenance, pre-fire management positions, special repairs, and administrative services.<\/li><li><strong>What the state funds in the six Contract Counties:<\/strong> 84 fire engines, 12 bulldozers, 12 hand crews, 32 fire prevention officers, and 42 positions in the 6 emergency command centers.<\/li><li><strong>CAL FIRE still provides<\/strong> Contract Counties with urban forestry grants, resource management help, fire investigation support, and training.<\/li><li><strong>Contract County codes and HQs (Facilities Public View):<\/strong><ul><li>MRN (MCFD HQ, San Rafael; Northern Region)<\/li><li>KRN (Bakersfield)<\/li><li>LAC (County of Los Angeles Fire Department HQ, Los Angeles)<\/li><li>ORC (Orange County Fire Authority, Irvine)<\/li><li>SBC (Santa Barbara County Fire HQ)<\/li><li>VNC (Ventura County Fire Department HQ, Newbury Park)<\/li><\/ul><\/li><li><strong>Station type codes (Facilities layer):<\/strong> FSA = Fire Station, Schedule A. FSB = Schedule B. FSAB = Schedule A/B. <strong>FSCC = Fire Station, Contract County (\"Greybook\")<\/strong>. FSL = Local. FSO = Other.<\/li><li><strong>Active station rows (17 Nov 2026 query):<\/strong> FSA 214, FSB 206, FSAB 38, FSCC 96, FSL 359, FSO 18. This is a facility inventory, <strong>not<\/strong> the same measure as the Budget's \"operates 237 fire stations.\" Don't substitute one for the other.<\/li><li><strong>Natural Resource Management:<\/strong> \"We protect and restore California wildlands, 85 million acres of forests, watersheds, and wildlife habitat.\" It manages <strong>fourteen Demonstration State Forests<\/strong>. Subprograms include Forest Practice, Reforestation, Forest Health, Prescribed Fire, Urban and Community Forestry, the Vegetation Management Program (VMP) on SRA, and Wildfire Resilience.<\/li><li><strong>OSFM:<\/strong> fire-prevention engineering, education, and enforcement. <strong>State Fire Training<\/strong> is an OSFM division. CAL FIRE Ione Training Center is an SFT Accredited Local Academy.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Cooperative Fire Protection Program:<\/strong> contracts and agreements let CAL FIRE be \"the lead agency in providing fire, rescue, dispatch, and paramedic services to cities and towns in California that are not designated as state responsibility,\" under unified command.<\/li><li><strong>California Master Mutual Aid Agreement:<\/strong> CAL FIRE helps other departments when local resources are depleted and CAL FIRE resources are available. CAL FIRE can also draw on local government departments for wildland fire suppression.<\/li><li><strong>Cal OES:<\/strong> can request CAL FIRE help with non-fire emergencies when the Governor has declared a State of Emergency.<\/li><li><strong>CFMA:<\/strong> CAL FIRE's largest cooperative program, with the five federal wildland agencies (USFS, BLM, NPS, BIA, FWS), for closest-forces exchange of fire protection.<\/li><li><strong>Schedule A, Schedule B, and Greybook<\/strong> labels tell you how a station is tied to the state. The full Schedule A agreement text wasn't retrieved, so don't assume details beyond the type labels.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li>The Our Organization page's history narrative says \"The State Forest system now includes eight units totaling over 71,000 acres.\" The current Natural Resource Management page says fourteen Demonstration State Forests.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "A grass fire starts on SRA land in Ventura County. Who provides initial attack, and why isn't it a CAL FIRE unit engine by default?", "a": "Ventura County Fire. In Kern, Los Angeles, Marin, Orange, Santa Barbara, and Ventura, the county protects the SRA under contract with CAL FIRE and provides initial attack (Cooperative Efforts page).", "qh": "A grass fire starts on SRA land in Ventura County. Who provides initial attack, and why isn't it a CAL FIRE unit engine by default?", "ah": "Ventura County Fire. In Kern, Los Angeles, Marin, Orange, Santa Barbara, and Ventura, the county protects the SRA under contract with CAL FIRE and provides initial attack (Cooperative Efforts page)."}, {"n": 2, "q": "List what the state funds in the six Contract Counties. What does CAL FIRE still provide them beyond money?", "a": "84 fire engines, 12 bulldozers, 12 hand crews, 32 fire prevention officers, and 42 positions in the 6 emergency command centers. CAL FIRE also provides urban forestry grants, resource management help, fire investigation support, and training (Cooperative Efforts page).", "qh": "List what the state funds in the six Contract Counties. What does CAL FIRE still provide them beyond money?", "ah": "84 fire engines, 12 bulldozers, 12 hand crews, 32 fire prevention officers, and 42 positions in the 6 emergency command centers. CAL FIRE also provides urban forestry grants, resource management help, fire investigation support, and training (Cooperative Efforts page)."}, {"n": 3, "q": "How does a Contract County arrangement differ from CAL FIRE's Cooperative Fire Protection Program for cities?", "a": "In a Contract County, the county protects the state's SRA lands with state funding. Under Cooperative Fire Protection, CAL FIRE serves cities and towns that are not SRA, acting as the lead agency for fire, rescue, dispatch, and paramedic services under contract (Cooperative Efforts page).", "qh": "How does a Contract County arrangement differ from CAL FIRE's Cooperative Fire Protection Program for cities?", "ah": "In a Contract County, the county protects the state's SRA lands with state funding. Under Cooperative Fire Protection, CAL FIRE serves cities and towns that are not SRA, acting as the lead agency for fire, rescue, dispatch, and paramedic services under contract (Cooperative Efforts page)."}, {"n": 4, "q": "A wildfire in a city outside the SRA has drained the local department. Under which agreement can CAL FIRE help, and does it work the other way too?", "a": "The California Master Mutual Aid Agreement. CAL FIRE assists when local resources are depleted and its own resources are available. CAL FIRE can also access local government departments for wildland fire suppression (Cooperative Efforts page).", "qh": "A wildfire in a city outside the SRA has drained the local department. Under which agreement can CAL FIRE help, and does it work the other way too?", "ah": "The California Master Mutual Aid Agreement. CAL FIRE assists when local resources are depleted and its own resources are available. CAL FIRE can also access local government departments for wildland fire suppression (Cooperative Efforts page)."}, {"n": 5, "q": "A major flood hits, with no fire. When can Cal OES request CAL FIRE resources?", "a": "When the Governor has declared a State of Emergency (Cooperative Efforts page).", "qh": "A major flood hits, with no fire. When can Cal OES request CAL FIRE resources?", "ah": "When the Governor has declared a State of Emergency (Cooperative Efforts page)."}, {"n": 6, "q": "A fire starts on national forest land right next to SRA. Which agreement lets the closest engines respond, and which agencies are in it?", "a": "The CFMA, a closest-forces exchange with the five federal wildland agencies: USFS, BLM, NPS, BIA, and FWS. It's CAL FIRE's largest cooperative program (Cooperative Efforts page).", "qh": "A fire starts on national forest land right next to SRA. Which agreement lets the closest engines respond, and which agencies are in it?", "ah": "The CFMA, a closest-forces exchange with the five federal wildland agencies: USFS, BLM, NPS, BIA, and FWS. It's CAL FIRE's largest cooperative program (Cooperative Efforts page)."}, {"n": 7, "q": "A station shows TYPE=FSCC in the facilities inventory. What does that mean, and which counties would you expect it in?", "a": "A Fire Station, Contract County (\"Greybook\") record. Expect it in the Contract Counties, such as Kern, Los Angeles, Marin, Orange, Santa Barbara, and Ventura. Local stations there may show up as FSL instead (Facilities Public View domain, batch 03).", "qh": "A station shows TYPE=FSCC in the facilities inventory. What does that mean, and which counties would you expect it in?", "ah": "A Fire Station, Contract County (\"Greybook\") record. Expect it in the Contract Counties, such as Kern, Los Angeles, Marin, Orange, Santa Barbara, and Ventura. Local stations there may show up as FSL instead (Facilities Public View domain, batch 03)."}, {"n": 8, "q": "A classmate adds up the FSA, FSB, and FSAB counts and says, \"So the Budget's 237 stations is wrong.\" What's the flaw?", "a": "They're different measures. The Facilities Public View counts facility records by type code, while the Budget counts the stations CAL FIRE \"operates.\" No official crosswalk links the two, and batch 02 says not to use one in place of the other. Adding type codes doesn't test the Budget figure.", "qh": "A classmate adds up the FSA, FSB, and FSAB counts and says, \"So the Budget's 237 stations is wrong.\" What's the flaw?", "ah": "They're different measures. The Facilities Public View counts facility records by type code, while the Budget counts the stations CAL FIRE \"operates.\" No official crosswalk links the two, and batch 02 says not to use one in place of the other. Adding type codes doesn't test the Budget figure."}, {"n": 9, "q": "How many Demonstration State Forests does CAL FIRE manage today, and which page is the current authority?", "a": "Fourteen, per the dedicated Natural Resource Management page. An older line on the Organization page (\"eight units totaling over 71,000 acres\") is historical narrative and shouldn't be blended in.", "qh": "How many Demonstration State Forests does CAL FIRE manage today, and which page is the current authority?", "ah": "Fourteen, per the dedicated Natural Resource Management page. An older line on the Organization page (\"eight units totaling over 71,000 acres\") is historical narrative and shouldn't be blended in."}, {"n": 10, "q": "Name OSFM's four program elements and the OSFM division that runs statewide fire-service training.", "a": "Engineering, education, enforcement, and support from the State Board of Fire Services. The division is State Fire Training (SFT) (OSFM About and Accredited Academies pages).", "qh": "Name OSFM's four program elements and the OSFM division that runs statewide fire-service training.", "ah": "Engineering, education, enforcement, and support from the State Board of Fire Services. The division is State Fire Training (SFT) (OSFM About and Accredited Academies pages)."}], "sources": [{"label": "CAL FIRE What We Do (All Programs)", "url": "https://www.fire.ca.gov/what-we-do"}, {"label": "CAL FIRE Cooperative Efforts (Contract Counties, mutual aid, CFMA)", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/cooperative-efforts/"}, {"label": "CAL FIRE Natural Resource Management", "url": "https://www.fire.ca.gov/what-we-do/natural-resource-management"}, {"label": "CAL FIRE Our Organization", "url": "https://www.fire.ca.gov/about/our-organization"}, {"label": "OSFM About Us", "url": "https://osfm.fire.ca.gov/about-us"}, {"label": "OSFM Accredited Academies", "url": "https://osfm.fire.ca.gov/what-we-do/state-fire-training/accredited-academies"}, {"label": "CAL FIRE Facilities for Wildland Fire Protection, Public View", "url": "https://services1.arcgis.com/jUJYIo9tSA7EHvfZ/arcgis/rest/services/CAL_FIRE_Facilities_for_Wildland_Fire_Protection_-_Public_View/FeatureServer"}, {"label": "Facilities layer metadata (Schedule A/B/Greybook types)", "url": "https://egis.fire.ca.gov/arcgis/rest/services/FRAP/Facilities/MapServer/0"}, {"label": "2026-27 Governor's Budget Summary, Natural Resources (237 stations)", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}, {"label": "Ranger batches: /workspace/can-report/calfire/calfire-batch-01.md, calfire-batch-02.md, calfire-batch-03.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 4. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 10.6.8 Wildland and All-Risk Response, 10.6.11 Hand Crews, Conservation Camps, and Fire Centers, 10.6.13 Fire Hazard Severity Zones, Defensible Space, and Ready for Wildfire.", "note_html": "Study aid only. Source: CAL FIRE What We Do, Cooperative Efforts, and Natural Resource Management pages, the OSFM About page, and the Facilities Public View inventory (Ranger calfire-batch-01, -02, -03). Retrieved 17 Nov 2026."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1402.96, "y": 657.03, "angle": 123.0, "vx": 789.58, "vy": 1214.02, "vangle": 220.5}, "10.6.5": {"id": "10.6.5", "name": "CalCareers and Firefighter I Hiring", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.6.12"], "doc": {"title": "10.6.5 CalCareers and Firefighter I Hiring", "file": "10.6.5_CalCareers_and_Firefighter_I_Hiring.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>State jobs are posted on <strong>CalCareers<\/strong> (jobs.ca.gov redirects there). You apply through a <strong>CalCareer Account<\/strong> with the <strong>STD 678<\/strong> Examination/Employment Application. <strong>Fire Fighter I is a non-testing class.<\/strong> Anyone who meets the minimum qualifications may apply and selects \"I have eligibility.\"<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Minimum qualifications (Join CAL FIRE):<\/strong> a valid Class A, B, or C driver's license (with any applicable endorsements), and age <strong>18 at appointment<\/strong>. The formal 1083 class spec wasn't retrieved live.<\/li><li><strong>JC-533177 posting:<\/strong> Non-Tenured, Full Time; statewide; multiple positions.<\/li><li><strong>Pay:<\/strong> $4,590 to $5,803 per month (see 10.6.2).<\/li><li><strong>Application window:<\/strong> final filing date 11/30/2026. Join CAL FIRE says the period is November 1 to 30, \"and there may be additional cutoffs.\"<\/li><li><strong>Hiring pool:<\/strong> used to fill vacancies <strong>through 31 Oct 2027<\/strong>. Offers are expected starting the <strong>week of 4 Jan 2027<\/strong>. Candidates may be selected by resume review.<\/li><li><strong>Medical:<\/strong> \"The position(s) require(s) Medical Clearance prior to being hired.\" Applicants \"must pass medical clearances under the Respiratory Protection Program.\"<\/li><li><strong>Required package documents (19 items, in posting order):<\/strong><ol><li>STD 678<\/li><li>Resume<\/li><li>PO-299 release form<\/li><li>Work Location Form<\/li><li>SFT Fire Fighter 1 certificate<\/li><li>CAL FIRE 1A or NFPA 1001 (Structural)<\/li><li>Confined Space Awareness or higher<\/li><li>CAL FIRE 1B or NFPA 1072/472/470 (HazMat)<\/li><li>CAL FIRE 1C or NFPA 1051/1140 (Wildland)<\/li><li>FEMA IS-100<\/li><li>FEMA IS-200<\/li><li>FEMA IS-700<\/li><li>FEMA IS-800<\/li><li>CPR<\/li><li>Public Safety First Aid (PSFA)<\/li><li>EMT<\/li><li>Paramedic<\/li><li>DD-214 or NGB-22<\/li><li>Driver's license, front and back<\/li><\/ol><\/li><li><strong>Required trainings (Applicant Information Sheet):<\/strong><ul><li><strong>Non-hand-crew jobs<\/strong> (engines, helitack, etc.): EMS <strong>and<\/strong> FEMA <strong>and<\/strong> one of: Option 1, an SFT FFI Certificate (any version); or Option 2, CAL FIRE 1A/B/C.<\/li><li><strong>Hand-crew jobs:<\/strong> EMS <strong>and<\/strong> Confined Space Awareness <strong>and<\/strong> FEMA <strong>and<\/strong> CAL FIRE 1B <strong>and<\/strong> 1C.<\/li><li><strong>EMS<\/strong> means CPR/AED <strong>and<\/strong> PSFA, <strong>or<\/strong> EMT, <strong>or<\/strong> Paramedic.<\/li><li><strong>FEMA<\/strong> means IS-100, 200, 700, and 800.<\/li><\/ul><\/li><li><strong>Categories:<\/strong><ul><li><strong>0:<\/strong> returnee rights to a CAL FIRE unit (Join CAL FIRE).<\/li><li><strong>1:<\/strong> \"fully trained,\" with documents for ALL required trainings.<\/li><li><strong>2:<\/strong> \"partially trained,\" with at least one.<\/li><li><strong>3:<\/strong> no acceptable documentation for any.<\/li><\/ul><\/li><\/ul><p><strong>Acceptable Documents rules:<\/strong><\/p><ul><li>CPR, PSFA, EMT, and Paramedic cards must be <strong>current as of the final filing date<\/strong>.<\/li><li><strong>EMT and Paramedic cards<\/strong> must be California EMSA (state level). \"National Registry or local county cards will not qualify.\"<\/li><li><strong>CPR:<\/strong> a healthcare-provider-level CPR and AED card equivalent to AHA is OK. <strong>Heartsaver<\/strong>, OSHA CPR, train-the-trainer, refresher, and continuing-education certificates don't qualify.<\/li><li><strong>FEMA:<\/strong> an older course version counts as long as the certificate shows the course number.<\/li><li><strong>Out-of-state certificates:<\/strong> IFSAC or Pro Board FF1 from bodies such as DoD or Texas A&amp;M \"will not be accepted\" as a California FF1. Use the <strong>SFT Reciprocity Application<\/strong> instead.<\/li><li><strong>IFSAC/Pro Board for FFI:<\/strong> a California FF1 doesn't need IFSAC or Pro Board accreditation for the <strong>FFI<\/strong> class. It <strong>does<\/strong> for FFII and FAE.<\/li><li><strong>Equivalents:<\/strong> the file lists an <strong>SFT Fire Fighter I (2013, 2019, or 2024)<\/strong> as qualifying for 1B HazMat, 1C Wildland, and Confined Space Rescue Awareness.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li>Build <strong>one<\/strong> package per classification (\"DO NOT INCLUDE MULTIPLE CLASSIFICATIONS ON ONE APPLICATION PACKAGE\"). Submit through CalCareers, or mail or drop it off (8 AM to 5 PM) at CAL FIRE Southern Region Hiring, 1234 East Shaw Avenue, Fresno, CA 93710. <strong>No fax or email.<\/strong><\/li><li>Include only the listed certificates. Put any others on your resume.<\/li><li><strong>Work Location Form:<\/strong> rank only the units you want and use each number once. Offers follow your numerical order and unit availability at the time of the offer. There's <strong>no offer for unranked units<\/strong>. You may submit an updated WLF <strong>once<\/strong> per hiring year.<\/li><li>Missing documents? You're \"still encouraged to apply.\" Email new certificates later to <strong>FFHiring@fire.ca.gov<\/strong>. The hiring hotline is (951) 901-5051.<\/li><li><strong>NFPA numbers:<\/strong> the hiring form lists 1001, 1072/472/470, and 1051/1140 as <strong>document alternatives<\/strong>. That's a separate list from OSFM's current FF1 CTS basis (see 10.6.7 and 10.2). Don't merge them.<\/li><\/ol>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Medical clearance under the <strong>Respiratory Protection Program<\/strong> is a condition of hire (JC-533177).<\/li><li>The job is heavy physical work. The posting and Join CAL FIRE call for visual acuity, color vision, and hearing sufficient for the duties; physical strength, dexterity, and agility; good judgment in hazardous emergencies; and willingness to stay on duty 24 hours a day as required.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li><strong>Archived CalHR FFI spec (1083)<\/strong> comes from Wayback snapshots dated 9 Jul 2025 and 24 Mar 2013 (footer \"Updated 6/3/2012\"). It lists only \"Minimum Age: 18 years at the time of appointment\" as an MQ, with a California driver license as an \"Additional Desirable Qualification.\" Current Join CAL FIRE MQs list the license as an MQ. Report both, and don't treat the archived text as current.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "An applicant for an engine job has an SFT FFI certificate, CPR/AED plus PSFA, and IS-100, 200, 700, and 800. What category, and why?", "a": "Category 1, fully trained. Non-hand-crew jobs need EMS (CPR/AED plus PSFA meets it), FEMA (all four), and one option (an SFT FFI certificate, any version, is Option 1). Source: Applicant Information Sheet.", "qh": "An applicant for an <strong>engine<\/strong> job has an SFT FFI certificate, CPR/AED plus PSFA, and IS-100, 200, 700, and 800. What category, and why?", "ah": "Category 1, fully trained. Non-hand-crew jobs need EMS (CPR/AED plus PSFA meets it), FEMA (all four), and one option (an SFT FFI certificate, any version, is Option 1). Source: Applicant Information Sheet."}, {"n": 2, "q": "The same person applies for a hand crew instead. Using the Acceptable Documents file, do they still have everything, and which items does the SFT FFI cover?", "a": "Yes, if their certificate is a listed version. Hand crew needs EMS, Confined Space Awareness, FEMA, and CAL FIRE 1B and 1C. The Acceptable Documents file lists an SFT Fire Fighter I (2013, 2019, or 2024) as qualifying for 1B HazMat, 1C Wildland, and California Confined Space Rescue Awareness. An older or different version would need its own check against the file.", "qh": "The same person applies for a <strong>hand crew<\/strong> instead. Using the Acceptable Documents file, do they still have everything, and which items does the SFT FFI cover?", "ah": "Yes, if their certificate is a listed version. Hand crew needs EMS, Confined Space Awareness, FEMA, and CAL FIRE 1B and 1C. The Acceptable Documents file lists an SFT Fire Fighter I (2013, 2019, or 2024) as qualifying for 1B HazMat, 1C Wildland, and California Confined Space Rescue Awareness. An older or different version would need its own check against the file."}, {"n": 3, "q": "An applicant attaches a National Registry EMT card. Does it count for the EMT item?", "a": "No. EMT and Paramedic cards must be issued by the California EMS Authority (state level). \"National Registry or local county cards will not qualify\" (Acceptable Documents).", "qh": "An applicant attaches a National Registry EMT card. Does it count for the EMT item?", "ah": "No. EMT and Paramedic cards must be issued by the California EMS Authority (state level). \"National Registry or local county cards will not qualify\" (Acceptable Documents)."}, {"n": 4, "q": "Which of these CPR cards count: an AHA Heartsaver card, or a healthcare-provider-level CPR/AED card approved by a LEMSA? What date must the card be valid on?", "a": "Only the healthcare-provider-level CPR/AED card (AHA-equivalent, LEMSA-approved). Heartsaver doesn't qualify. The card must be current and valid as of the job ad's final filing date (Acceptable Documents).", "qh": "Which of these CPR cards count: an AHA Heartsaver card, or a healthcare-provider-level CPR/AED card approved by a LEMSA? What date must the card be valid on?", "ah": "Only the healthcare-provider-level CPR/AED card (AHA-equivalent, LEMSA-approved). Heartsaver doesn't qualify. The card must be current and valid as of the job ad's final filing date (Acceptable Documents)."}, {"n": 5, "q": "An applicant's FEMA certificate says IS-100.b, but the current course is IS-100.c. Do they need to retake it?", "a": "No. A previous version counts as long as the certificate shows the course number (Acceptable Documents FEMA note).", "qh": "An applicant's FEMA certificate says IS-100.b, but the current course is IS-100.c. Do they need to retake it?", "ah": "No. A previous version counts as long as the certificate shows the course number (Acceptable Documents FEMA note)."}, {"n": 6, "q": "A friend with a Texas A&M IFSAC FF1 says it should count as a \"California Fire Fighter I Certification.\" Does it? What should they do, and does FFI even need an IFSAC/Pro Board seal?", "a": "No. IFSAC or Pro Board FF1 from bodies like DoD or Texas A&M \"will not be accepted.\" They can use the CA SFT Fire Fighter 1 Reciprocity Application to get a California FF1. A California FF1 doesn't need IFSAC/Pro Board accreditation for the FFI class (it does for FFII and FAE).", "qh": "A friend with a Texas A&amp;M IFSAC FF1 says it should count as a \"California Fire Fighter I Certification.\" Does it? What should they do, and does FFI even need an IFSAC/Pro Board seal?", "ah": "No. IFSAC or Pro Board FF1 from bodies like DoD or Texas A&amp;M \"will not be accepted.\" They can use the CA SFT Fire Fighter 1 Reciprocity Application to get a California FF1. A California FF1 doesn't need IFSAC/Pro Board accreditation for the FFI class (it does for FFII and FAE)."}, {"n": 7, "q": "An applicant has none of the required certificates yet. Should they wait a season? What happens to their placement, and how do they add certificates later?", "a": "Apply anyway. The posting says candidates are \"still encouraged to apply.\" With no acceptable documentation they'd be Category 3. Later certificates can be emailed to FFHiring@fire.ca.gov or mailed or dropped off in Fresno.", "qh": "An applicant has none of the required certificates yet. Should they wait a season? What happens to their placement, and how do they add certificates later?", "ah": "Apply anyway. The posting says candidates are \"still encouraged to apply.\" With no acceptable documentation they'd be Category 3. Later certificates can be emailed to FFHiring@fire.ca.gov or mailed or dropped off in Fresno."}, {"n": 8, "q": "An applicant wants offers only in the Northern Region and ranks just four units. What happens if those four have no openings? Can they change the form later?", "a": "No offer is made for unranked units. Offers follow the ranked order and unit availability at the time of the offer. They can submit an updated Work Location Form one time during the hiring year.", "qh": "An applicant wants offers only in the Northern Region and ranks just four units. What happens if those four have no openings? Can they change the form later?", "ah": "No offer is made for unranked units. Offers follow the ranked order and unit availability at the time of the offer. They can submit an updated Work Location Form one time during the hiring year."}, {"n": 9, "q": "How do you submit the package, and what are two things that will get it handled wrong?", "a": "Online through CalCareers, or by mail or drop-off at CAL FIRE Southern Region Hiring, 1234 East Shaw Avenue, Fresno. Mistakes include sending it by fax or email (not accepted), putting multiple classifications in one package, or attaching certificates that aren't on the list (those go on the resume).", "qh": "How do you submit the package, and what are two things that will get it handled wrong?", "ah": "Online through CalCareers, or by mail or drop-off at CAL FIRE Southern Region Hiring, 1234 East Shaw Avenue, Fresno. Mistakes include sending it by fax or email (not accepted), putting multiple classifications in one package, or attaching certificates that aren't on the list (those go on the resume)."}, {"n": 10, "q": "Is a CPAT card listed as an FFI minimum qualification on JC-533177? Where does CPAT show up as an MQ?", "a": "No. CPAT isn't listed as an MQ on JC-533177. It's an MQ for FFII and FAE: you can be admitted to the exam without the card, but you need it before a job offer (EX-4603, EX-4473).", "qh": "Is a CPAT card listed as an FFI minimum qualification on JC-533177? Where does CPAT show up as an MQ?", "ah": "No. CPAT isn't listed as an MQ on JC-533177. It's an MQ for FFII and FAE: you can be admitted to the exam without the card, but you need it before a job offer (EX-4603, EX-4473)."}, {"n": 11, "q": "Name the medical condition of hire on the FFI posting.", "a": "Medical clearance before hire, including passing medical clearances under the Respiratory Protection Program (JC-533177).", "qh": "Name the medical condition of hire on the FFI posting.", "ah": "Medical clearance before hire, including passing medical clearances under the Respiratory Protection Program (JC-533177)."}, {"n": 12, "q": "When does the hiring pool start making offers, and how long is it used?", "a": "Offers are expected starting the week of 4 Jan 2027, and the pool fills vacancies through 31 Oct 2027 (JC-533177).", "qh": "When does the hiring pool start making offers, and how long is it used?", "ah": "Offers are expected starting the week of 4 Jan 2027, and the pool fills vacancies through 31 Oct 2027 (JC-533177)."}], "sources": [{"label": "Firefighter I posting JC-533177", "url": "https://calcareers.ca.gov/CalHrPublic/Jobs/JobPosting.aspx?JobControlId=533177"}, {"label": "STD 678 (hard copy)", "url": "http://jobs.ca.gov/pdf/std678.pdf"}, {"label": "FFI Applicant Information Sheet (required trainings)", "url": "https://www.fire.ca.gov/-/media/1EAFA2A1528141EE892CB692D4B982E0"}, {"label": "FFI Applicant Information Sheet (alternate URL)", "url": "https://www.fire.ca.gov/join-calfire/-/media/calfire-website/direct-links/required-trainings.pdf"}, {"label": "CAL FIRE Acceptable Documents (FFI, FFII, FAE; 2027 season and beyond)", "url": "https://www.fire.ca.gov/-/media/BF147896DED446F9B142FEF464A0E9AD"}, {"label": "PO-299 Authorization to Release Information", "url": "https://www.fire.ca.gov/-/media/D817B8E27D8049C3BC35297686467FB9"}, {"label": "2027 Work Location Form", "url": "https://incidents.fire.ca.gov/media/42chxu24/2027-wlf.pdf"}, {"label": "Bypass-a-missing-item directions", "url": "https://www.fire.ca.gov/-/media/5775A4D5B1124F37BA97020F60EDF81C"}, {"label": "Join CAL FIRE, Fire Fighter I", "url": "https://www.joincalfire.com/classifications/fire-protection/firefighting-and-paramedics/fire-fighter-i"}, {"label": "FFII exam bulletin EX-4603", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4603"}, {"label": "FAE exam bulletin EX-4473", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4473"}, {"label": "Ranger batches: /workspace/can-report/calfire/calfire-batch-01.md, calfire-batch-01-addendum.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 5. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 10.6.12 Peak and Base Staffing (Seasonal, Year-Round, and Workweek).", "note_html": "Study aid only. Source: FFI posting JC-533177 (final filing date 11/30/2026), the FFI Applicant Information Sheet, the CAL FIRE Acceptable Documents file (\"effective for the 2027 season and beyond\"), the 2027 Work Location Form, and Join CAL FIRE (Ranger calfire-batch-01 and addendum). Postings change every season, so always read the live one."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1384.3, "y": 639.0, "angle": 145.0, "vx": 780.55, "vy": 1233.4, "vangle": 189.5}, "10.6.6": {"id": "10.6.6", "name": "CAL FIRE Academy and Training Centers", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": [], "doc": {"title": "10.6.6 CAL FIRE Academy and Training Centers", "file": "10.6.6_CAL_FIRE_Academy_and_Training_Centers.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>CAL FIRE \"operates four state-of-the-art Training Centers.\" They provide \"year-round training in fire prevention and protection, emergency response, law enforcement and enhancement of natural resource systems.\" Curricula include fire control, arson investigation, leadership development, forest practice enforcement, aviation, and specialized courses. Allied agencies also attend.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Ione Training Center (est. 1967):<\/strong> on 420 acres in Amador County, in the City of Ione, about 35 miles southeast of Sacramento. It's an <strong>OSFM State Fire Training Accredited Local Academy (ALA)<\/strong> at 4501 State Highway 104, Ione, CA 95640.<\/li><li><strong>Riverside Training Center (est. 2017):<\/strong> at the Ben Clark Public Safety Training Center in Riverside. It was set up because of \"trends related to the increasing size and severity of wildfires.\"<\/li><li><strong>Redding Training Center (est. 2023):<\/strong> at Shasta College in Redding, to add employees and expand training further north.<\/li><li><strong>Atwater Training Center (est. 2025):<\/strong> at Castle Airport and Development Center in Atwater. It was set up \"to meet the Department's full alignment with IFSAC and Pro Board Testing and State Fire Training Fire Fighter 1 certification\" and growing hiring needs.<\/li><li><strong>Two different academies:<\/strong> the <strong>Fire Fighter Academy (FFA)<\/strong> is entry level. The <strong>Company Officer Academy (COA)<\/strong> is promotional. In 2025, \"CAL FIRE graduated a record 658 new Fire Apparatus Engineers through the Company Officer Academy.\" More than 600 more Company Officers are projected for 2026 (2026-27 Budget).<\/li><li><strong>What counts as an FFA certificate (Acceptable Documents):<\/strong> CAL FIRE FFA, CAL FIRE Fire Control Training (Firefighter), or the CAL FIRE Fire Fighter Module.<\/li><li><strong>What counts as a COA certificate:<\/strong> CAL FIRE COA, or CAL FIRE Fire Control Training (Company Officer).<\/li><li><strong>Other CAL FIRE course certificates on the file:<\/strong> Wildland Safety and Survival Level 1, and Chainsaw Operations (C-212).<\/li><li><strong>2026 FFA length is unclear.<\/strong> Two sources disagree, and neither is confirmed as the 2026 length:<ul><li>7 weeks (unclear): the Training Center page's \"Inside Look\" teaser, \"Learn about the 7 week training program,\" retrieved 17 Nov 2026.<\/li><li>4 weeks (unclear): a CAL FIRE memo dated 2 May 2022, which planned a 4-week FFA-2022 (with SFT FF1 as a prerequisite) and kept the 7-week FFA-2019 until 1 Jan 2024. It's a transition plan, not a 2026 catalog.<\/li><li>No official 2026 FFA catalog was found.<\/li><\/ul><\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Certification testing:<\/strong> as an SFT accredited academy, Ione falls under OSFM's process. Students at an accredited academy are automatically signed up for the FF1 certification exam (OSFM FF1 page, see 10.2).<\/li><li><strong>Promotion:<\/strong> the Battalion Chief HFEO pattern requires \"Basic Fire Control training which includes the Fire Fighter Academy and Company Officer Academy\" (Join CAL FIRE).<\/li><li><strong>FAE to Captain:<\/strong> COA graduates start a <strong>three-year apprenticeship<\/strong> toward Fire Captain (2026-27 Budget).<\/li><li><strong>Growth:<\/strong> the Relief Staffing budget item ($175.3 million, 576 positions) includes expanded training-center positions.<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Wildland Safety and Survival Level 1 and Fire Fighter Survival (Structural) are both CAL FIRE/SFT courses on the Acceptable Documents file (the latter must be 2010 or newer). Chainsaw Operations (C-212) also appears, with a note on \"Qualification cards and refresher training.\"<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li><strong>2022 memo (2 May 2022):<\/strong> starting 9 May 2022, CAL FIRE would begin moving to FFA-2022, a 4-week course with SFT FF1 as a prerequisite. The Training Center would keep teaching the 7-week FFA-2019 until full SFT FF1 implementation on 1 Jan 2024.<\/li><li>The same memo aligned FFI training with SFT curriculum: 1A Structure, 1B HazMat, 1C Wildland (or NWCG equivalent), plus a Fire Protection Orientation Course. It retired <strong>Basic Firefighter (BFF)<\/strong> on 1 Sep 2022 and set different paths for FFI-Crew and FFI-Engine.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Which CAL FIRE training center is the oldest, where is it, and what OSFM status does it hold?", "a": "Ione, established 1967, on 420 acres in Amador County about 35 miles southeast of Sacramento. It's an OSFM State Fire Training Accredited Local Academy (Training Center page, OSFM Accredited Academies).", "qh": "Which CAL FIRE training center is the oldest, where is it, and what OSFM status does it hold?", "ah": "Ione, established 1967, on 420 acres in Amador County about 35 miles southeast of Sacramento. It's an OSFM State Fire Training Accredited Local Academy (Training Center page, OSFM Accredited Academies)."}, {"n": 2, "q": "Why did CAL FIRE open the Atwater center in 2025?", "a": "\"To meet the Department's full alignment with IFSAC and Pro Board Testing and State Fire Training Fire Fighter 1 certification\" and growing hiring needs (Training Center page).", "qh": "Why did CAL FIRE open the Atwater center in 2025?", "ah": "\"To meet the Department's full alignment with IFSAC and Pro Board Testing and State Fire Training Fire Fighter 1 certification\" and growing hiring needs (Training Center page)."}, {"n": 3, "q": "What trend drove the 2017 Riverside center, and where is it located?", "a": "The increasing size and severity of wildfires. It's at the Ben Clark Public Safety Training Center in Riverside (Training Center page).", "qh": "What trend drove the 2017 Riverside center, and where is it located?", "ah": "The increasing size and severity of wildfires. It's at the Ben Clark Public Safety Training Center in Riverside (Training Center page)."}, {"n": 4, "q": "A friend reads \"658 graduates in 2025\" and says the Firefighter Academy is booming. What did those 658 actually graduate from, and what comes next for them?", "a": "The Company Officer Academy, a promotional academy, not the entry-level Firefighter Academy. The 658 were new Fire Apparatus Engineers, who then begin a three-year apprenticeship toward Fire Captain (2026-27 Budget).", "qh": "A friend reads \"658 graduates in 2025\" and says the Firefighter Academy is booming. What did those 658 actually graduate from, and what comes next for them?", "ah": "The Company Officer Academy, a promotional academy, not the entry-level Firefighter Academy. The 658 were new Fire Apparatus Engineers, who then begin a three-year apprenticeship toward Fire Captain (2026-27 Budget)."}, {"n": 5, "q": "An applicant has a \"CAL FIRE Fire Control Training, Firefighter\" certificate. Which Acceptable Documents item does it satisfy?", "a": "Item 2, the CAL FIRE Fire Fighter Academy (FFA) Certificate. Qualifying documents are CAL FIRE FFA, Fire Control Training (Firefighter), or the Fire Fighter Module (Acceptable Documents).", "qh": "An applicant has a \"CAL FIRE Fire Control Training, Firefighter\" certificate. Which Acceptable Documents item does it satisfy?", "ah": "Item 2, the CAL FIRE Fire Fighter Academy (FFA) Certificate. Qualifying documents are CAL FIRE FFA, Fire Control Training (Firefighter), or the Fire Fighter Module (Acceptable Documents)."}, {"n": 6, "q": "A Heavy Fire Equipment Operator wants to promote to Battalion Chief through Pattern II. Which academies must be part of their training?", "a": "Basic Fire Control training, which includes both the Fire Fighter Academy and the Company Officer Academy (Join CAL FIRE BC page).", "qh": "A Heavy Fire Equipment Operator wants to promote to Battalion Chief through Pattern II. Which academies must be part of their training?", "ah": "Basic Fire Control training, which includes both the Fire Fighter Academy and the Company Officer Academy (Join CAL FIRE BC page)."}, {"n": 7, "q": "Put the four centers in order by year established and give one location fact for each.", "a": "Ione 1967 (City of Ione, Amador County). Riverside 2017 (Ben Clark Public Safety Training Center). Redding 2023 (Shasta College). Atwater 2025 (Castle Airport and Development Center).", "qh": "Put the four centers in order by year established and give one location fact for each.", "ah": "Ione 1967 (City of Ione, Amador County). Riverside 2017 (Ben Clark Public Safety Training Center). Redding 2023 (Shasta College). Atwater 2025 (Castle Airport and Development Center)."}, {"n": 8, "q": "Name the curriculum areas the Training Center page lists beyond basic fire control.", "a": "Arson investigation, leadership development, forest practice enforcement, aviation, and specialized courses. Training covers prevention, protection, emergency response, law enforcement, and natural resources, and allied agencies attend too (Training Center page).", "qh": "Name the curriculum areas the Training Center page lists beyond basic fire control.", "ah": "Arson investigation, leadership development, forest practice enforcement, aviation, and specialized courses. Training covers prevention, protection, emergency response, law enforcement, and natural resources, and allied agencies attend too (Training Center page)."}, {"n": 9, "q": "Which two CAL FIRE survival or safety course certificates appear on the Acceptable Documents file, and what date limit applies to the structural one?", "a": "Wildland Safety and Survival Level 1, and Fire Fighter Survival (Structural). The structural course certificate must be 2010 or newer, or the SFT 2023 version (Acceptable Documents).", "qh": "Which two CAL FIRE survival or safety course certificates appear on the Acceptable Documents file, and what date limit applies to the structural one?", "ah": "Wildland Safety and Survival Level 1, and Fire Fighter Survival (Structural). The structural course certificate must be 2010 or newer, or the SFT 2023 version (Acceptable Documents)."}], "sources": [{"label": "CAL FIRE Training Center page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/training-center"}, {"label": "OSFM Accredited Academies", "url": "https://osfm.fire.ca.gov/what-we-do/state-fire-training/accredited-academies"}, {"label": "OSFM Fire Fighter 1 certification page", "url": "https://osfm.fire.ca.gov/what-we-do/state-fire-training/professional-certifications/fire-fighter-1"}, {"label": "CAL FIRE Acceptable Documents", "url": "https://www.fire.ca.gov/-/media/BF147896DED446F9B142FEF464A0E9AD"}, {"label": "Join CAL FIRE, Battalion Chief", "url": "https://www.joincalfire.com/classification
