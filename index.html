<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>CAN Report · Firefighter Study Tree</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23111' stroke='%23e8b64a' stroke-width='4'/%3E%3Cpath d='M32 10 L40 26 L54 32 L40 38 L32 54 L24 38 L10 32 L24 26Z' fill='%23e8b64a'/%3E%3C/svg%3E">
<style>:root{--bg:#0b0d10;--panel:#14171c;--panel2:#1b1f26;--line:#2c323b;--txt:#e7e3da;--muted:#8d939c;
--gold:#e8b64a;--gold2:#ffd76a;--ember:#ff6a2a;--ember2:#c2410c;--ok:#5fd08a;--bad:#ff5a5a;--blue:#3aa0e8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:fixed;inset:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
 background:radial-gradient(ellipse at 30% 60%,#1a1410 0%,#0d0f12 55%,#08090b 100%)}
#map.dragging{cursor:grabbing}
a{color:var(--gold2)}
.muted{color:var(--muted)} .small{font-size:12px}
.btn{background:#2a2f37;color:var(--txt);border:1px solid #444b55;border-radius:3px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{background:#353b45;border-color:#6a717c}
.btn.primary{background:linear-gradient(#e8b64a,#b8862a);color:#1a1205;border-color:#ffd76a;font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ember{background:linear-gradient(#ff7a3a,#c2410c);color:#fff;border-color:#ff9a62}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* brand */
#brand{position:absolute;top:8px;right:16px;text-align:right;pointer-events:none;text-shadow:0 0 12px #000}
#brand .logo{font-weight:800;letter-spacing:.12em;font-size:22px;color:var(--gold)}
#brand .logo span{color:var(--ember)} #brand .sub{font-size:11px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
/* options */
#options{position:absolute;top:8px;left:8px;width:210px;background:rgba(14,17,21,.92);border:1px solid #2f5f86;border-radius:3px;z-index:5}
.opt-title{display:block;width:100%;background:linear-gradient(#2b86c4,#1d6aa0);color:#fff;border:0;font:600 15px system-ui;padding:4px;cursor:pointer}
.opt-body{padding:8px;display:flex;flex-direction:column;gap:7px}
.opt-body.closed{display:none}
.chk{font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer}
#searchForm{display:flex;flex-wrap:wrap;gap:5px}
#search{flex:1 1 100%;background:#fff;color:#111;border:1px solid #888;border-radius:2px;padding:4px 6px;font:inherit;font-size:13px}
#searchForm .btn{margin:0 auto}
#searchInfo{flex:1 1 100%;font-size:11px;text-align:center;min-height:14px}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
select{background:#1d2128;color:var(--txt);border:1px solid #444b55;border-radius:3px;padding:4px;font:inherit;font-size:13px}
.row-btns{display:flex;gap:5px}.row-btns .btn{flex:1;padding:4px 6px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:3px 6px;font-size:11px;color:var(--muted)}
.lg{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:2px solid #555}
.lg.done{border-color:var(--gold2);background:#6d5a26;box-shadow:0 0 6px var(--gold)}
.lg.prog{border-color:var(--ember)}.lg.avail{border-color:#fff}.lg.locked{border-color:#4a4f57;background:#22252a}
.lg.pf{border:0;background:var(--gold2);width:8px;height:8px}.lg.rf{border:0;background:var(--ember);width:8px;height:8px}
.lg.soon{border-style:dashed;border-color:#5a6068}.lg.xl{border:0;border-top:2px dashed var(--ember);border-radius:0;height:2px;width:14px;vertical-align:3px}
/* hud */
#hud{position:absolute;left:14px;bottom:34px;width:200px;z-index:4;text-shadow:0 0 8px #000}
#hud .pts{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:34px;font-weight:700;line-height:1}
#hud .chev{width:30px;height:30px;fill:var(--gold);filter:drop-shadow(0 0 4px var(--gold))}
#hud .cp{font-size:12px;color:#c9c4b8;margin:2px 0 6px}
#hud .rank{font-size:13px;font-weight:600;color:var(--txt)}
#hud .bar{height:7px;background:#23272e;border:1px solid #3a4049;border-radius:4px;overflow:hidden;margin:4px 0}
#rankBar{height:100%;width:0;background:linear-gradient(90deg,var(--ember2),var(--gold));box-shadow:0 0 8px var(--ember);transition:width .4s}
#resetBtn{margin-top:6px}
#progressLine{line-height:1.5}
.streak{background:#22140b;border:1px solid #6a3a18;border-radius:4px;padding:8px 10px;margin:8px 0;font-size:13px}
/* footer */
#disclaimer{position:absolute;left:0;right:0;bottom:0;padding:5px 10px;font-size:11px;text-align:center;color:#a09a8e;background:rgba(8,9,11,.85);border-top:1px solid #222;z-index:3}
/* svg */
.edge{fill:none;stroke:#4a4f57;stroke-width:1.6;opacity:.75}
.edge.trunk{stroke:#6a5a3a;stroke-width:2;opacity:.5}
.edge.xpath{stroke-width:1.4;opacity:0;pointer-events:none;transition:opacity .15s}
.edge.xpath.hov,.edge.xpath.sel,.show-all .edge.xpath{opacity:.75}
.edge.xpath.hov,.edge.xpath.sel{stroke:#9fd3ff;stroke-width:2}
.edge.active{stroke:#d8d8d8;opacity:.85}
.edge.done{stroke:var(--gold);opacity:.95;filter:url(#softglow)}
.xedge{fill:none;stroke:var(--ember);stroke-width:1.6;stroke-dasharray:6 5;opacity:0;pointer-events:none;transition:opacity .15s}
.show-all .xedge{opacity:.55}
.xedge.hov,.xedge.sel{opacity:1;stroke-width:2.4}
.node{cursor:pointer;outline:none}
.node .ring{fill:url(#nodefill);stroke:#5b616a;stroke-width:2}
.node text.nid{fill:#9aa0a8;font:600 9px system-ui;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node.tool text.nid{font-size:6.5px}
.node.capstone text.nid{font-size:11px}
.node.locked .ring{fill:#1c1f23;stroke:#3a3f46}
.node.locked text.nid{fill:#5d636b}
.node.soon .ring{fill:#15171a;stroke:#454a52;stroke-dasharray:3 3}
.node.soon text.nid{fill:#565c64}
.node.soon.reach .ring{stroke:#9aa0a8}.node.soon.reach text.nid{fill:#9aa0a8}
.node.avail .ring{stroke:#f2f2f2;stroke-width:2.4;filter:url(#softglow)}
.node.avail text.nid{fill:#fff}
.node.prog .ring{stroke:var(--ember);stroke-width:2.6;filter:url(#softglow)}
.node.prog text.nid{fill:#ffc8a8}
.node.done .ring{fill:url(#donefill);stroke:var(--gold2);stroke-width:3;filter:url(#glow)}
.node.done text.nid{fill:#fff3c8}
.node .star{fill:#6a7078}.node.done .star{fill:var(--gold2)}
.node .mark{display:none;pointer-events:none}
.node.is-perfect .mark.perfect,.node.is-refl .mark.refl{display:inline}
.mark.perfect circle{fill:var(--gold2);stroke:#2a1f05;stroke-width:1.5;filter:url(#softglow)}
.mark.refl circle{fill:var(--ember);stroke:#2a1005;stroke-width:1.5}
.node .halo{fill:none;stroke:var(--gold2);stroke-width:2;opacity:0}
.node.hit .halo{opacity:1;stroke:#7fd4ff;stroke-dasharray:4 3;animation:spin 6s linear infinite}
.node.sel .halo{opacity:1;stroke:#fff}
.node:focus-visible .halo{opacity:1;stroke:#7fd4ff}
.node.pulse .halo{animation:pulse 1s ease-out 3;opacity:1;stroke:#7fd4ff}
@keyframes pulse{0%{stroke-width:8;opacity:1}100%{stroke-width:1;opacity:.2}}
@keyframes spin{to{stroke-dashoffset:-56}}
.node:hover .ring{stroke-width:3.2}
.dim{opacity:.12!important}
.label{fill:#cfd3d8;font:500 11px system-ui;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#0b0d10;stroke-width:3px}
.label.l3{font-size:var(--lf,15px);font-weight:600;fill:#d9dce0}
.label.sub{font-size:13px}
.label.tool{font-size:7.5px;fill:#b7bdc5;display:none}
.zoomed .label.tool{display:inline}
.label.done{fill:var(--gold2)}
.hide-names .label.name{display:none}
.caplabel{pointer-events:none}
.caplabel text{text-anchor:middle;font:700 var(--cf,17px) system-ui;paint-order:stroke;stroke:#0b0d10;stroke-width:3px}
.caplabel .cpath{fill:#9aa0a8;font-size:.62em;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.caplabel .cname{fill:#e7e3da}
.caplabel.done .cname{fill:var(--gold2)}
.rowband{fill:url(#bgember);opacity:.25}
.rootlabel{fill:var(--gold);font:700 var(--cf,17px) system-ui;paint-order:stroke;stroke:#0b0d10;stroke-width:3px;text-anchor:middle;letter-spacing:.1em}
/* panel */
#panel{position:absolute;top:0;right:0;bottom:24px;width:min(460px,100%);background:linear-gradient(180deg,#171a20,#111317);
 border-left:1px solid #3b2a1a;box-shadow:-10px 0 30px rgba(0,0,0,.6);z-index:8;overflow-y:auto;padding:18px 18px 30px;-webkit-overflow-scrolling:touch}
#panel .grab{display:none}
.close{position:absolute;top:8px;right:10px;background:none;border:0;color:#aaa;font-size:26px;cursor:pointer;line-height:1}
.close:hover{color:#fff}
.p-id{color:var(--ember);font:700 12px system-ui;letter-spacing:.12em}
#panel h2{margin:2px 30px 6px 0;font-size:20px;line-height:1.25;color:#fff}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.badge.done{background:#5b4a18;color:var(--gold2);border:1px solid var(--gold)}
.badge.prog{background:#4a1f0c;color:#ffb48a;border:1px solid var(--ember)}
.badge.avail{background:#2a2f37;color:#fff;border:1px solid #ddd}
.badge.locked{background:#1c1f23;color:#8a9098;border:1px solid #444}
.badge.perfect{background:#3a2e0c;color:var(--gold2);border:1px solid var(--gold)}
.badge.refl{background:#3a1a0c;color:#ffb48a;border:1px solid var(--ember)}
.badge.readb{background:#16261c;color:#9fe0b4;border:1px solid #3c6b4c}
.badge.soon{background:#1c1f23;color:#8a9098;border:1px dashed #555}
.pos{font-size:12.5px;color:#b9b4a8;margin:8px 0}
.note{border-left:3px solid var(--ember);background:#1f1712;padding:6px 10px;font-size:12.5px;color:#e5cdb8;margin:8px 0}
.rel{margin:6px 0;font-size:12.5px}.rel b{color:var(--muted);font-weight:600;margin-right:4px}
.chip{display:inline-block;margin:2px 3px 2px 0;padding:1px 7px;border-radius:10px;border:1px solid #444b55;background:#20242b;color:var(--txt);font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--gold)} .chip.done{border-color:var(--gold);color:var(--gold2)} .chip.soon{border-style:dashed;color:#8a9098}
.chip.xl{border-color:#8a3a18}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;position:sticky;top:-18px;background:#16191e;padding:8px 0;z-index:2;border-bottom:1px solid #262a31}
.stat{font-size:12px;color:var(--muted);margin:4px 0}
.doc h3{color:var(--gold);font-size:14px;text-transform:uppercase;letter-spacing:.08em;margin:18px 0 6px;border-bottom:1px solid #2a2e35;padding-bottom:3px}
.doc p,.doc li{font-size:13.5px;color:#ddd8cd}
.doc ul,.doc ol{padding-left:20px;margin:6px 0}
.doc blockquote{margin:6px 0;color:#cbb;font-style:italic}
.doc strong{color:#fff}
.doc code{background:#222;padding:0 3px}
.sources li{word-break:break-word}
.lock-msg{background:#1c1f23;border:1px solid #333;padding:8px 10px;font-size:12.5px;border-radius:3px;color:#b8bcc2}
.kids{list-style:none;padding:0}.kids li{margin:4px 0}
/* quiz */
.quiz .qnum{font-size:12px;color:var(--muted)}
.quiz .q{font-size:16px;font-weight:600;margin:6px 0 12px;color:#fff}
.choice{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 11px;background:#1f232a;border:1px solid #3c424b;color:var(--txt);border-radius:4px;font:inherit;font-size:13.5px;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--gold)}
.choice.right{border-color:var(--ok);background:#12301f}
.choice.wrong{border-color:var(--bad);background:#3a1515}
.choice:disabled{cursor:default}
.fb{margin:10px 0;padding:8px 10px;border-radius:4px;font-size:13px}
.fb.ok{background:#12301f;border:1px solid var(--ok)}.fb.no{background:#3a1515;border:1px solid var(--bad)}
.score{font-size:30px;font-weight:800;color:var(--gold);margin:10px 0 0}
.qprog{height:5px;background:#23272e;border-radius:3px;overflow:hidden;margin:6px 0}.qprog div{height:100%;background:var(--ember)}
/* journal */
.prompt{margin:12px 0}.prompt label{display:block;font-weight:600;font-size:13px;margin-bottom:4px;color:#f0e6d0}
textarea{width:100%;min-height:80px;background:#0f1114;color:var(--txt);border:1px solid #3c424b;border-radius:4px;padding:8px;font:inherit;font-size:13.5px;resize:vertical}
.entry{border:1px solid #2c3038;background:#15181d;border-radius:4px;padding:8px 10px;margin:8px 0}
.entry .meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.entry .pr{font-size:12px;color:var(--gold);margin:3px 0}
.entry .tx{white-space:pre-wrap;font-size:13.5px}
.linkbtn{background:none;border:0;color:#d88;cursor:pointer;font-size:11px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}
#modal[hidden]{display:none}
.modal-card{position:relative;background:#14171c;border:1px solid #3b2a1a;border-radius:6px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:18px}
.modal-card h2{margin-top:0;color:var(--gold)}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-80px);background:#2a1a0c;border:1px solid var(--gold);color:#ffe6a8;padding:8px 16px;border-radius:20px;z-index:30;transition:transform .3s;font-weight:600;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
/* mobile */
@media (max-width:720px){
 #brand{top:6px;right:10px}#brand .logo{font-size:17px}#brand .sub{font-size:9px}
 #options{width:auto;min-width:92px;max-width:210px}
 #options .opt-title{padding:4px 12px;font-size:14px}
 #options .opt-body{width:200px}
 /* compact Class Points bar along the bottom */
 #hud{left:0;right:0;bottom:var(--footh,30px);width:auto;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"pts rank reset" "pts bar reset" "stats stats stats";
  column-gap:10px;row-gap:1px;align-items:center;padding:5px 10px 4px;background:rgba(10,12,15,.92);border-top:1px solid #3b2a1a}
 #hud .pts{grid-area:pts;font-size:24px}#hud .chev{width:20px;height:20px}
 #hud .cp{display:none}
 #hud .rank{grid-area:rank;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #hud .bar{grid-area:bar;margin:0}
 #progressLine{grid-area:stats;font-size:10.5px!important;line-height:1.3!important}
 #progressLine br{display:none}#progressLine span{margin-left:4px}
 #resetBtn{grid-area:reset;margin:0;padding:3px 8px;font-size:12px}
 #panel{top:auto;left:0;right:0;bottom:0;width:100%;max-height:72vh;border-left:0;border-top:1px solid #5a3a1a;border-radius:14px 14px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.7);padding-top:22px}
 #panel .grab{display:block;position:absolute;top:7px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:#555}
 #panel.tall{max-height:94vh}
 .actions{top:-22px}
 #disclaimer{font-size:10px}
}
/* cross-path prereqs stay hidden by default even when active/completed; revealed on hover/select or "Show all connections" */
#map .edge.xpath{opacity:0}
#map .edge.xpath.hov,#map .edge.xpath.sel,#map.show-all .edge.xpath{opacity:.8}

/* dual counts (active vs planned) and source disagreements */
.counts{margin:12px 0}.counts h3{color:var(--gold);font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:10px 0 4px}
table.dual{width:100%;border-collapse:collapse;font-size:12.5px}
table.dual th,table.dual td{border:1px solid #2c3038;padding:5px 7px;vertical-align:top;text-align:left}
table.dual thead th{background:#1c2026;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
table.dual tbody th{color:#e7e3da;font-weight:600;width:32%}
table.dual .basis{font-size:11px;color:#c9b48a}
table.dual .nys{color:#8a9098;font-style:italic}
table.dual a.src{font-size:11px}
.disagree table.dual{border-left:3px solid var(--ember)}

/* horizontal layout: capstone labels sit to the right of the capstone */
.caplabel.side text{text-anchor:start}

.qnote{font-size:12px;margin:6px 0;padding:4px 8px;border-radius:3px;background:#1c2026;border:1px solid #3a4049;color:#c9cdd3}
.qnote.warn{border-color:#8a6a18;color:#f0d68a;background:#2a220c}
.qnote.bad{border-color:#8a2a1a;color:#ffb0a0;background:#2a120c}

/* read gate */
.qwrap{display:inline-flex;flex-direction:column;gap:3px;max-width:190px}
.qhint{font-size:11px;line-height:1.3;color:#f0d68a}
.readbtn.is-read{border-color:#3c6b4c;color:#9fe0b4}
.doc-end{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 6px;padding-top:12px;border-top:1px solid #2a2e35}

/* Challenge Coin */
.coin{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;padding:0;margin-left:6px;vertical-align:middle;
 background:radial-gradient(circle at 35% 30%,#ffe39a,#d9a33a 60%,#8a5f12);border:1px solid #6a4a10;cursor:pointer;box-shadow:0 0 4px rgba(232,182,74,.5)}
.coin span{font:800 10px system-ui;color:#3a2606}
.coin:hover{filter:brightness(1.15)}
.coin.big{width:26px;height:26px;margin:0 6px 0 0}.coin.big span{font-size:14px}
.dsec h3{display:flex;align-items:center;justify-content:space-between}
.quiz .q .coin{margin-left:8px}
#coinFloat{position:fixed;z-index:40;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.6)}
#coinFloat[hidden]{display:none}
#coinFloat .coin{margin:0;width:16px;height:16px}
blockquote.passage{white-space:pre-wrap;background:#0f1114;border-left:3px solid var(--gold);margin:8px 0;padding:8px 10px;max-height:220px;overflow:auto;font-size:13px;color:#ddd8cd;user-select:text}
.chq{background:#0f1114;border-left:3px solid var(--gold);padding:8px 10px;margin:8px 0;font-size:13px;display:grid;gap:4px}
.badge.coinb{background:#2e240a;color:#ffd76a;border:1px solid #8a6a18}
.badge.ch-open{background:#2a2f37;color:#ddd;border:1px solid #666}.badge.ch-accepted{background:#12301f;color:#9fe0b4;border:1px solid #3c6b4c}.badge.ch-rejected{background:#3a1515;color:#ffb0a0;border:1px solid #8a2a1a}
.chnode{margin:14px 0 4px;font-size:14px}

/* Coin case (accepted challenges; recognition only) */
.coincase{--cs:56px;display:flex;flex-wrap:wrap;gap:6px;padding:6px;margin:4px 0;border:1px solid #5a4418;border-radius:10px;
 background:linear-gradient(180deg,#1a1408,#120e06);box-shadow:inset 0 2px 6px rgba(0,0,0,.7);max-height:calc(var(--cs) * 2 + 20px);overflow-y:auto;text-shadow:none}
.coincase.empty{display:block}
.cc-empty{font-size:11px;color:#b9ab8a;font-style:italic;line-height:1.35}
.cc-head .coincase{--cs:104px;max-height:250px;gap:10px;padding:10px}
.cc-head .cc-empty{font-size:13px}
.ccoin{width:var(--cs);height:var(--cs);padding:0;border:0;background:none;cursor:pointer;perspective:500px;border-radius:50%;flex:none}
.ccoin:focus-visible{outline:2px solid #ffd76a;outline-offset:2px}
.ccoin-in{position:relative;display:block;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.ccoin[aria-pressed="true"] .ccoin-in{transform:rotateY(180deg)}
.ccoin .face{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
 backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid #7a5212;
 box-shadow:inset 0 0 0 3px rgba(255,236,170,.35),inset 0 -4px 8px rgba(70,40,0,.45),0 2px 6px rgba(0,0,0,.6)}

 [], "prereqs": [], "unlocks": ["01.1", "01.2", "01.3", "01.4", "01.5", "01.6", "03.1", "05.1", "06.1", "07.1", "08.1", "10.1"], "cross": [], "doc": {"title": "01.0 Firefighting Fundamentals (ROOT NODE)", "file": "01.0_Fundamentals_ROOT.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>The core knowledge every firefighter needs before any specialty: incident priorities, risk rules, the attack sequence, two-in/two-out, SCBA and PASS discipline, accountability, and training safety.<\/p>"}, {"key": "specs", "title": "Key specs (the core rules)", "html": "<ul><li><strong>Incident priorities (USFA/NFA):<\/strong> 1) Life safety, 2) Incident stabilization, 3) Property conservation.<\/li><li><strong>Risk limits (USFA/NFA STICO):<\/strong> Risk a lot to save a lot. Risk a little to save a little. Risk nothing to save nothing.<\/li><li><strong>RECEO-VS (traditional):<\/strong> Rescue, Exposures, Confine, Extinguish, Overhaul, plus Ventilate and Salvage.<\/li><li><strong>SLICE-RS (revised):<\/strong> Size-up, Locate the fire, Identify and control flow path, Cool the space from the safest location, Extinguish, plus Rescue and Salvage as \"actions of opportunity.\"<\/li><li><strong>Two-in/two-out (OSHA 29 CFR 1910.134(g)(4)):<\/strong> for interior structural firefighting, at least 2 enter and stay in voice or visual contact. At least 2 stay outside. Everyone inside uses SCBA.<\/li><li><strong>SCBA air rule:<\/strong> leave the IDLH area before you use your reserve air (NIOSH 2026-104, citing NFPA 1550/1400). Scott and MSA low-air alarms trigger at about 33% (Scott) or 33 to 37% (MSA bell) of full pressure.<\/li><li><strong>PASS:<\/strong> a motionless firefighter triggers a pre-alarm and then a full alarm (MSA G1: pre-alarm at 20 s, full alarm at 30 s).<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li><strong>Size-up<\/strong> (360° when possible) feeds the strategy. Sometimes size-up comes before rescue, for firefighter safety (STICO).<\/li><li>Pick a strategy within the risk limits, then assign tactics using RECEO-VS or SLICE-RS.<\/li><li>Before entry: full PPE, SCBA on air, PASS armed, crew integrity, and accountability tags or passport turned in.<\/li><li>Inside: stay in voice, visual, or touch contact with your crew and manage your air.<\/li><li>If you're lost, trapped, or low on air, call <strong>\"Mayday, Mayday, Mayday\"<\/strong>, activate PASS manually, and follow your survival training (NIOSH).<\/li><\/ol>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>NIOSH fatality investigations keep finding the same causes: PASS not activated, accountability lost, crews separated, and SCBA not maintained.<\/li><li>Keep wearing SCBA during overhaul unless air monitoring says it's safe (MSA G1 manual warning).<\/li><li>Training is dangerous too. Follow NIOSH 2017-113 controls for live-fire and training props.<\/li><li>Before SCBA use you need medical clearance, an annual fit test, and a clean shave where the seal sits (NIOSH 2026-104, OSHA 1910.134).<\/li><\/ul>"}], "qa": [{"n": 1, "q": "List the three incident priorities in order.", "a": "Life safety, incident stabilization, property conservation.", "qh": "List the three incident priorities in order.", "ah": "Life safety, incident stabilization, property conservation."}, {"n": 2, "q": "What does each letter of SLICE-RS stand for?", "a": "Size-up, Locate, Identify and control flow path, Cool from the safest location, Extinguish. Rescue and Salvage are actions of opportunity.", "qh": "What does each letter of SLICE-RS stand for?", "ah": "Size-up, Locate, Identify and control flow path, Cool from the safest location, Extinguish. Rescue and Salvage are actions of opportunity."}, {"n": 3, "q": "State the three risk limits.", "a": "Risk a lot to save a lot. Risk a little to save a little. Risk nothing to save nothing.", "qh": "State the three risk limits.", "ah": "Risk a lot to save a lot. Risk a little to save a little. Risk nothing to save nothing."}, {"n": 4, "q": "What are the three conditions of two-in/two-out?", "a": "2 inside in voice or visual contact, 2 outside, and SCBA for everyone inside.", "qh": "What are the three conditions of two-in/two-out?", "ah": "2 inside in voice or visual contact, 2 outside, and SCBA for everyone inside."}, {"n": 5, "q": "When should you leave the IDLH atmosphere with respect to your air?", "a": "Before you use your reserve air, so you're out before the low-air alarm.", "qh": "When should you leave the IDLH atmosphere with respect to your air?", "ah": "Before you use your reserve air, so you're out before the low-air alarm."}, {"n": 6, "q": "Name three recurring causes in NIOSH firefighter fatality reports.", "a": "Examples: PASS not activated, loss of accountability, crew separation, and SCBA not maintained.", "qh": "Name three recurring causes in NIOSH firefighter fatality reports.", "ah": "Examples: PASS not activated, loss of accountability, crew separation, and SCBA not maintained."}, {"n": 7, "q": "When does an MSA G1 PASS go into pre-alarm and full alarm?", "a": "Pre-alarm after about 20 s motionless, full alarm at 30 s.", "qh": "When does an MSA G1 PASS go into pre-alarm and full alarm?", "ah": "Pre-alarm after about 20 s motionless, full alarm at 30 s."}], "sources": [{"label": "USFA/NFA Strategy and Tactics for Initial Company Operations (STICO) student manual", "url": "https://apps.usfa.fema.gov/ax/sm/sm_0455.pdf"}, {"label": "USFA/NFA Preparation for Initial Company Operations (PICO)", "url": "https://apps.usfa.fema.gov/ax/sm/sm_0458.pdf"}, {"label": "OSHA 29 CFR 1910.134 Respiratory Protection", "url": "https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.134"}, {"label": "NIOSH 2026-104 Safe Use of SCBA for Firefighters", "url": "https://www.cdc.gov/niosh/media/pdfs/2026/07/2026-104.pdf"}, {"label": "NIOSH 2009-100 Leading Recommendations for Preventing Fire Fighter Fatalities", "url": "https://www.cdc.gov/niosh/docs/2009-100/pdfs/2009-100.pdf"}, {"label": "NIOSH 2017-113 Preventing Deaths and Injuries During Training", "url": "https://www.cdc.gov/niosh/docs/wp-solutions/2017-113/pdfs/2017-113.pdf"}, {"label": "Reference library (Drive)", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Level 1, the root. <strong>Unlocks:<\/strong> every path (02 to 10). <strong>Prerequisites:<\/strong> none.", "note_html": "Study aid only. Your department SOPs, your instructors, and the current manufacturer instructions take priority."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 0, "y": 0, "vx": 0, "vy": 0, "vangle": null}, "01.1": {"id": "01.1", "name": "Fire Behavior and Building Construction", "path": "01", "kind": "main", "parent": null, "prereqRaw": "01.0", "children": ["01.1.1", "01.1.2"], "prereqs": ["01.0"], "unlocks": ["01.1.1", "01.1.2", "02.5"], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 210, "y": -480.0, "vx": -462.5, "vy": 215, "vangle": null}, "01.1.1": {"id": "01.1.1", "name": "Fire Behavior", "path": "01", "kind": "tool", "parent": "01.1", "prereqRaw": "parent 01.1", "children": [], "prereqs": ["01.1"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 248.55, "y": -490.69, "angle": 344.5, "vx": -432.08, "vy": 189.02, "vangle": 319.5}, "01.1.2": {"id": "01.1.2", "name": "Building Construction", "path": "01", "kind": "tool", "parent": "01.1", "prereqRaw": "parent 01.1", "children": [], "prereqs": ["01.1"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 248.55, "y": -469.31, "angle": 15.5, "vx": -423.05, "vy": 208.4, "vangle": 350.5}, "01.2": {"id": "01.2", "name": "Respiratory Protection (SCBA)", "path": "01", "kind": "main", "parent": null, "prereqRaw": "01.0", "children": ["01.2.0", "01.2.1", "01.2.2"], "prereqs": ["01.0"], "unlocks": ["01.2.0", "01.2.1", "01.2.2", "02.1", "03.4", "04.1", "04.2", "07.4", "09.1", "09.3"], "cross": ["04.1", "07.4", "09.1"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 210, "y": -288.0, "vx": -277.5, "vy": 215, "vangle": null}, "01.2.0": {"id": "01.2.0", "name": "SCBA: How It Works (overview)", "path": "01", "kind": "tool", "parent": "01.2", "prereqRaw": "parent 01.2", "children": [], "prereqs": ["01.2"], "unlocks": [], "cross": [], "doc": {"title": "01.2.0 SCBA: How It Works (Level-3 Overview)", "file": "01.2.0_SCBA_Overview.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>An open-circuit, positive-pressure SCBA carries its own breathing air for IDLH atmospheres. The main parts are the cylinder and valve, a backframe and harness, a pressure reducer (first stage), a mask-mounted regulator (second stage), the facepiece, a heads-up display (HUD) with an end-of-service alarm, a RIC/UAC emergency fill fitting, and usually an integrated PASS.<\/p>"}, {"key": "specs", "title": "Key specs (common to Scott X3 Pro and MSA G1)", "html": "<ul><li><strong>Cylinder pressures:<\/strong> 2216 psig (30-min only), 4500 psig (30/45/60-min), and 5500 psig (Scott, up to 75-min. MSA lists 5500 cylinders in 30/45/60).<\/li><li><strong>Rated minutes are NIOSH lab numbers<\/strong> at a moderate work rate. Hard work can cut real duration to less than half (Scott manual).<\/li><li><strong>End-of-service (low-air) alarms:<\/strong> Scott Vibralert and HUD at about 33% of full pressure. MSA G1 bell between 33 and 37% of rated pressure.<\/li><li><strong>RIC/UAC:<\/strong> a standardized emergency fill fitting used by rapid intervention crews.<\/li><li><strong>Standards:<\/strong> NIOSH (including CBRN) approval. NFPA 1981 (SCBA) and NFPA 1982 (PASS), 2018 editions, for current models. NFPA has since consolidated these into NFPA 1970.<\/li><li><strong>Cylinders:<\/strong> composite cylinders have a 15-year life and need periodic DOT hydrostatic testing (Scott manual). Use only Grade D or better breathing air.<\/li><li><strong>The two alarms are independent.<\/strong> They may not go off at exactly the same moment, and they keep sounding until the cylinder is nearly empty (Scott manual).<\/li><li><strong>What shortens real duration (Scott manual):<\/strong> hard work, poor fitness, stress or fear, little training on the unit, a cylinder not full at the start, a loose facepiece, and the unit's condition. Higher surrounding pressure also matters: at 2 atmospheres (a pressurized tunnel) air lasts half as long, at 3 atmospheres one-third.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li><strong>Daily or pre-use check:<\/strong> cylinder full and hydro date current, harness, facepiece, regulator, and RIC/UAC caps. Open the valve and confirm the alarms, HUD, and PASS start-up.<\/li><li><strong>Don:<\/strong> open the cylinder, make sure there's no air-saver flow, seal the facepiece, and take a sharp first breath to start airflow.<\/li><li><strong>Check the seal and alarms:<\/strong> close the valve and breathe down. Confirm all end-of-service alarms.<\/li><li><strong>Work:<\/strong> watch the HUD. Leave as soon as any low-air alarm activates.<\/li><li><strong>After use:<\/strong> clean, inspect, swap the cylinder, and return the unit to service.<\/li><\/ol>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Leave right away on <strong>any<\/strong> end-of-service alarm, even if you think air remains (both manuals).<\/li><li>Use only cylinders of the pressure rated for that SCBA. Mismatches cause false gauge readings and late or early alarms.<\/li><li>Facial hair in the seal area defeats the fit. Fit-test every year (OSHA/NIOSH).<\/li><li>SCBA weight (up to about 40 lb with gear) plus breathing resistance strains the heart and raises heat stress (NIOSH 2026-104).<\/li><li>Keep the SCBA on during overhaul unless air monitoring says otherwise (MSA warning).<\/li><li>Redo the fit test after anything that could change the seal, such as a big weight change or facial surgery (NIOSH 2026-104). Medical clearance comes <strong>before<\/strong> fit testing (OSHA 1910.134).<\/li><li>Breathing resistance causes faster fatigue, shortness of breath, and higher air use. The extra weight raises the risk of heat illness, strains, and falls (NIOSH 2026-104).<\/li><li>Train on the same make and model you'll wear on the fireground, including seal checks and air management (NIOSH 2026-104).<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li>Early fire-service breathing sets were closed-circuit chemical or oxygen units. MSA's Chemox (1940s to 1960s) made oxygen chemically and had no oxygen gauge, so users tracked a rough 45-minute limit (Fire Fighting in Canada).<\/li><li>Scott introduced the compressed-air Air-Pak with a demand regulator in 1945 (Fire Engineering, Oct 1945). Pressure-demand and then positive-pressure designs followed. The first edition of NFPA 1981 required positive pressure so toxic gases couldn't leak into the facepiece.<\/li><li>4500 psi cylinders and composite wraps arrived in 1976. MSA's Quick-Fill (1987) led to the emergency fill fitting required on NFPA SCBA from 2002 (MSA timeline, via Scout batch 02).<\/li><li>NFPA 1981 and 1982 have since been consolidated into NFPA 1970.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Your Scott alarms are set at about 33% and the MSA G1 bell at 33 to 37%. Why is the rule \"be out of the IDLH before you use your reserve\" and not just \"start leaving when the alarm sounds\"?", "a": "The alarm marks the start of the reserve, not a safe margin. On hard work, time left after the alarm can be under half of what you'd expect (Scott manual). NIOSH 2026-104, citing NFPA 1550 and 1400, says to exit before using reserve air. So plan your exit so you're out by about 33%.", "qh": "Your Scott alarms are set at about 33% and the MSA G1 bell at 33 to 37%. Why is the rule \"be out of the IDLH before you use your reserve\" and not just \"start leaving when the alarm sounds\"?", "ah": "The alarm marks the start of the reserve, not a safe margin. On hard work, time left after the alarm can be under half of what you'd expect (Scott manual). NIOSH 2026-104, citing NFPA 1550 and 1400, says to exit before using reserve air. So plan your exit so you're out by about 33%."}, {"n": 2, "q": "A crew member says a 45-minute cylinder gives 45 minutes of work. Explain why that's wrong and name four factors that shorten real duration.", "a": "NIOSH ratings come from a breathing machine at a moderate work rate, and hard work can cut duration below half. Factors: work rate, fitness, stress or fear, training on the unit, a partly filled cylinder, a loose facepiece, the unit's condition, and higher surrounding pressure.", "qh": "A crew member says a 45-minute cylinder gives 45 minutes of work. Explain why that's wrong and name four factors that shorten real duration.", "ah": "NIOSH ratings come from a breathing machine at a moderate work rate, and hard work can cut duration below half. Factors: work rate, fitness, stress or fear, training on the unit, a partly filled cylinder, a loose facepiece, the unit's condition, and higher surrounding pressure."}, {"n": 3, "q": "Mid-search, your HUD still shows about half, but the end-of-service alarm starts. What do you do, and what could the alarm mean?", "a": "Leave right away. Both manuals say to exit on any end-of-service alarm. On a Scott, an early Vibralert can mean the primary reducer path failed and the transfer valve switched to the secondary path. The unit is warning you it's malfunctioning.", "qh": "Mid-search, your HUD still shows about half, but the end-of-service alarm starts. What do you do, and what could the alarm mean?", "ah": "Leave right away. Both manuals say to exit on any end-of-service alarm. On a Scott, an early Vibralert can mean the primary reducer path failed and the transfer valve switched to the secondary path. The unit is warning you it's malfunctioning."}, {"n": 4, "q": "Why is a cylinder rated for a different pressure than the SCBA dangerous even if it's full and the threads fit?", "a": "Gauges and alarms are set as a percentage of the SCBA's rated pressure. With the wrong cylinder the readings are false, so the alarm can come late (less escape air) or early.", "qh": "Why is a cylinder rated for a different pressure than the SCBA dangerous even if it's full and the threads fit?", "ah": "Gauges and alarms are set as a percentage of the SCBA's rated pressure. With the wrong cylinder the readings are false, so the alarm can come late (less escape air) or early."}, {"n": 5, "q": "A firefighter with a short beard passes his own seal check and argues that positive pressure will protect him. Why is he still not allowed to wear the SCBA?", "a": "Facial hair where the facepiece touches the skin stops a proper seal (OSHA 1910.134(g)(1)(i), NIOSH 2026-104). His own seal check doesn't override that. A broken seal leaks and wastes air, and it isn't the fit the respirator was approved with.", "qh": "A firefighter with a short beard passes his own seal check and argues that positive pressure will protect him. Why is he still not allowed to wear the SCBA?", "ah": "Facial hair where the facepiece touches the skin stops a proper seal (OSHA 1910.134(g)(1)(i), NIOSH 2026-104). His own seal check doesn't override that. A broken seal leaks and wastes air, and it isn't the fit the respirator was approved with."}, {"n": 6, "q": "Besides the yearly schedule, when must a firefighter be fit tested again, and what has to happen before any fit test?", "a": "After any change that could affect the seal, such as significant weight change or facial surgery (NIOSH 2026-104). A medical clearance evaluation must come first (OSHA 1910.134).", "qh": "Besides the yearly schedule, when must a firefighter be fit tested again, and what has to happen before any fit test?", "ah": "After any change that could affect the seal, such as significant weight change or facial surgery (NIOSH 2026-104). A medical clearance evaluation must come first (OSHA 1910.134)."}, {"n": 7, "q": "During overhaul the smoke has lifted and the crew wants to drop their masks. What's the rule, and why can't you decide by sight?", "a": "Keep SCBA on unless air monitoring shows it's safe (MSA G1 manual warning). Clear air doesn't mean safe air, so only monitoring can tell you.", "qh": "During overhaul the smoke has lifted and the crew wants to drop their masks. What's the rule, and why can't you decide by sight?", "ah": "Keep SCBA on unless air monitoring shows it's safe (MSA G1 manual warning). Clear air doesn't mean safe air, so only monitoring can tell you."}, {"n": 8, "q": "According to NIOSH, how does SCBA use raise a firefighter's risk of a heart attack or heat illness, and what preparation reduces that risk?", "a": "Up to 40 lb of weight plus breathing resistance raises the workload on the heart and lungs and builds body heat. That raises the risk of heart attack (especially with heart disease), heat illness, and injury. Preparation: medical clearance, prompt reporting of new conditions, annual fit testing, and regular training on your own model (NIOSH 2026-104).", "qh": "According to NIOSH, how does SCBA use raise a firefighter's risk of a heart attack or heat illness, and what preparation reduces that risk?", "ah": "Up to 40 lb of weight plus breathing resistance raises the workload on the heart and lungs and builds body heat. That raises the risk of heart attack (especially with heart disease), heat illness, and injury. Preparation: medical clearance, prompt reporting of new conditions, annual fit testing, and regular training on your own model (NIOSH 2026-104)."}], "sources": [{"label": "3M Scott Air-Pak X3 Pro O&M Instructions P/N 595373-01 Rev C", "url": "https://www.eastgreenbushfire.com/wp-content/uploads/2025/10/X3-Pro-NFPA-1981-2018-Edition-Operating-and-Maintenance-Instructions-English-595373-01_C.pdf"}, {"label": "MSA G1 SCBA 2018 Edition Operating Manual 10187007/03", "url": "https://s7d9.scene7.com/is/content/minesafetyappliances/10187007_USOperatingManual-G1SCBA2018Ed"}, {"label": "NIOSH 2026-104", "url": "https://www.cdc.gov/niosh/media/pdfs/2026/07/2026-104.pdf"}, {"label": "OSHA 1910.134", "url": "https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.134"}, {"label": "SCBA history (Scout batch 02), Fire Engineering, Oct 1945", "url": "https://www.fireengineering.com/firefighting/around-the-fire-service-1940-1949/"}, {"label": "SCBA history (Scout batch 02), Fire Fighting in Canada, 50 years of SCBA", "url": "https://www.firefightingincanada.com/50-years-of-scba-ffic-1235/"}, {"label": "SCBA history (Scout batch 02), MSA G1 bulletin timeline", "url": "http://s7d9.scene7.com/is/content/minesafetyappliances/Literature/Landing%20Pages/Fire%20Services/MSA%20G1%20SCBA.pdf"}, {"label": "NFPA 1981 development page (consolidation into NFPA 1970)", "url": "https://www.nfpa.org/codes-and-standards/nfpa-1981-standard-development/1981"}, {"label": "Library copies: Drive > Firefighter_Reference_Library > 07_SCBA_Scott_and_MSA (Scott X3 Pro manual, MSA G1 manual, NIOSH 2026-104)", "url": ""}], "position_html": "<strong>Tree position:<\/strong> ROOT 01 &gt; 01.2 Respiratory Protection (SCBA). <strong>Unlocks after:<\/strong> 01.0 Fundamentals. <strong>Unlocks:<\/strong> 01.2.1 Scott Air-Pak X3 Pro, 01.2.2 MSA G1, and Path 04 RIT (air supply).", "note_html": "Study aid only. Follow the manual for your exact SCBA model and your department SOPs."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 244.29, "y": -308.6, "angle": 329.0, "vx": -255.13, "vy": 181.84, "vangle": 304.0}, "01.2.1": {"id": "01.2.1", "name": "3M Scott Air-Pak X3 Pro", "path": "01", "kind": "tool", "parent": "01.2", "prereqRaw": "parent 01.2", "children": [], "prereqs": ["01.2"], "unlocks": [], "cross": ["04.2.1", "09.1.1"], "doc": {"title": "01.2.1 3M Scott Air-Pak X3 Pro SCBA", "file": "01.2.1_Scott_Air-Pak_X3_Pro.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>3M Scott's fire-service SCBA, certified to NFPA 1981 (2018 Edition) with NIOSH approval (CBRN versions). It comes in CGA-threaded or Snap-Change cylinder versions.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Pressures:<\/strong> 2.2 (2216 psig, 30-min), 4.5 (4500 psig, 30/45/60-min), and 5.5 (5500 psig, 30/45/60/75-min).<\/li><li><strong>Pressure reducer:<\/strong> dual-redundant. If the primary fails, a transfer valve switches to the secondary and the Vibralert activates.<\/li><li><strong>Regulator:<\/strong> E-Z Flo+ (AV-3000 HT facepiece) or E-Z Flo C5 (Vision C5 facepiece), with a red purge valve.<\/li><li><strong>Alarms:<\/strong> Vibralert (sound and vibration) plus the HUD, two independent end-of-service alarms at about 33%.<\/li><li><strong>HUD:<\/strong> 4 lights (full, ¾, ½, ⅓) plus a red battery light. It lights everything for 20 s at start-up.<\/li><li><strong>Remote gauge:<\/strong> must read within 10% of the cylinder gauge.<\/li><li><strong>PASS (if equipped):<\/strong> 3 quick chirps when the cylinder valve opens.<\/li><li><strong>Harness:<\/strong> aluminum backframe with Kevlar harness, a drag rescue loop, and optional UEBSS (buddy-breathing) hose.<\/li><li><strong>RIC/UAC fill:<\/strong> do not exceed 1500 psig/min. Fill pressure must not exceed 5500 psig.<\/li><li><strong>HUD levels:<\/strong> more than ¾ shows two green lights. ½ to ¾ shows one green. ⅓ to ½ shows a yellow light flashing once per second. Below ⅓, the red light flashes 10 times per second. The HUD reads cylinder pressure directly, so it's independent of the Vibralert.<\/li><li><strong>Air-saver:<\/strong> stops free flow when the facepiece is off and the valve is open. A strike to the regulator can start the flow again. Left engaged with the valve open for a long time, it can make the Vibralert sound on and off above 33%.<\/li><li><strong>Red purge valve:<\/strong> gives air into the facepiece in an emergency without breathing on the regulator, and bleeds the system after use. It turns ½ turn, by finger pressure only. Never use tools.<\/li><li><strong>Seal check:<\/strong> a negative-pressure leak test. Inhale and hold. No air should flow in, and the facepiece should pull tighter to your face.<\/li><\/ul>"}, {"key": "how", "title": "How it's used (operational check, from the manual)", "html": "<ol><li>Close the purge valve (pointer up). Press the air-saver/donning switch.<\/li><li>Open the cylinder valve slowly and fully (about 2½ turns). The Vibralert sounds then stops, the HUD initializes, and the PASS chirps.<\/li><li>Compare the remote and cylinder gauges (within 10%).<\/li><li>Seal the facepiece and inhale sharply to start the flow. Remove it and confirm free flow. Press the air-saver to stop.<\/li><li>Check for leaks. Cycle the purge valve (½ turn).<\/li><li>Close the valve and bleed slowly. Between ⅓ and empty, the Vibralert must click rapidly and the HUD red light must flash fast (10 times per second).<\/li><li>Reset the PASS/electronic alarm with the yellow reset button as described in the manual.<\/li><\/ol>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Leave at once if <strong>any<\/strong> end-of-service alarm activates, even above 33%. It can mean a reducer failure.<\/li><li>Don't use the drag rescue loop to lift or lower a person vertically.<\/li><li>The RIC/UAC is for emergencies only. If a leak shows during an emergency fill, stop and leave.<\/li><li>Below 32 °F / 0 °C, follow the low-temperature instructions.<\/li><li>Take a cylinder out of service if it shows heat or flame damage (discolored paint, charred decals, melted gauge lens, cracks, bulging) or has an expired hydro date.<\/li><li>Have it tested by a 3M Authorized Service Center at least once a year.<\/li><li>If air won't stop flowing after you engage the air-saver, close the cylinder valve at once to save air, then tag the SCBA out of service.<\/li><li>An open purge valve or a sounding Vibralert keeps using air until the cylinder valve is closed.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "The X3 Pro has two end-of-service alarms. Name them and explain why it matters that they're independent.", "a": "The Vibralert (sound and vibration in the regulator) and the HUD lights. The HUD reads cylinder pressure directly and runs separately from the Vibralert, so one failing doesn't silence the other. They may not trigger at exactly the same moment.", "qh": "The X3 Pro has two end-of-service alarms. Name them and explain why it matters that they're independent.", "ah": "The Vibralert (sound and vibration in the regulator) and the HUD lights. The HUD reads cylinder pressure directly and runs separately from the Vibralert, so one failing doesn't silence the other. They may not trigger at exactly the same moment."}, {"n": 2, "q": "Your HUD still shows ¾, but the Vibralert starts. What happened inside the SCBA, and what do you do?", "a": "The primary path of the dual-redundant reducer may have blocked or failed closed. The transfer valve switched to the secondary path and the Vibralert is warning you. Leave immediately, even though the HUD shows air.", "qh": "Your HUD still shows ¾, but the Vibralert starts. What happened inside the SCBA, and what do you do?", "ah": "The primary path of the dual-redundant reducer may have blocked or failed closed. The transfer valve switched to the secondary path and the Vibralert is warning you. Leave immediately, even though the HUD shows air."}, {"n": 3, "q": "At the morning check, the remote gauge reads 15% lower than the cylinder gauge. Can the SCBA go in service?", "a": "No. The remote gauge must read within 10% of the cylinder gauge.", "qh": "At the morning check, the remote gauge reads 15% lower than the cylinder gauge. Can the SCBA go in service?", "ah": "No. The remote gauge must read within 10% of the cylinder gauge."}, {"n": 4, "q": "During the bleed-down step of the operational check, what must you see and feel between ⅓ and empty, and why is this step important?", "a": "The Vibralert must click rapidly and the HUD red light must flash fast (10 times per second). It proves both independent alarms work before you rely on them in an IDLH atmosphere.", "qh": "During the bleed-down step of the operational check, what must you see and feel between ⅓ and empty, and why is this step important?", "ah": "The Vibralert must click rapidly and the HUD red light must flash fast (10 times per second). It proves both independent alarms work before you rely on them in an IDLH atmosphere."}, {"n": 5, "q": "You pull your facepiece off outside with the cylinder still open. Air keeps rushing out even after you engage the air-saver. What do you do?", "a": "Close the cylinder valve right away to stop losing air. Then remove the SCBA from service and tag it for repair by authorized personnel.", "qh": "You pull your facepiece off outside with the cylinder still open. Air keeps rushing out even after you engage the air-saver. What do you do?", "ah": "Close the cylinder valve right away to stop losing air. Then remove the SCBA from service and tag it for repair by authorized personnel."}, {"n": 6, "q": "Inside a structure your regulator stops giving air on demand. What does the red purge valve do, how do you work it, and what's the cost?", "a": "It sends air into the facepiece without you breathing on the regulator. Turn it ½ turn counterclockwise with your fingers, never a tool. Air keeps flowing while it's open, so you use air faster. Report the problem and leave.", "qh": "Inside a structure your regulator stops giving air on demand. What does the red purge valve do, how do you work it, and what's the cost?", "ah": "It sends air into the facepiece without you breathing on the regulator. Turn it ½ turn counterclockwise with your fingers, never a tool. Air keeps flowing while it's open, so you use air faster. Report the problem and leave."}, {"n": 7, "q": "A RIT is refilling your cylinder through the RIC/UAC. What are the fill limits, and what do you do if a leak shows up?", "a": "No faster than 1500 psig per minute, and never above 5500 psig. If a leak appears during an emergency fill, stop the fill and leave the hazard area.", "qh": "A RIT is refilling your cylinder through the RIC/UAC. What are the fill limits, and what do you do if a leak shows up?", "ah": "No faster than 1500 psig per minute, and never above 5500 psig. If a leak appears during an emergency fill, stop the fill and leave the hazard area."}, {"n": 8, "q": "After a fire, a cylinder has charred decals and a slightly melted gauge lens but holds pressure. Can it stay in service? Name other signs that pull it.", "a": "No. Heat or flame damage pulls it, even if it holds pressure. Other signs: brown or black paint, a distorted bumper, cracks, a peeling wrap, bulging, or an expired hydro date.", "qh": "After a fire, a cylinder has charred decals and a slightly melted gauge lens but holds pressure. Can it stay in service? Name other signs that pull it.", "ah": "No. Heat or flame damage pulls it, even if it holds pressure. Other signs: brown or black paint, a distorted bumper, cracks, a peeling wrap, bulging, or an expired hydro date."}, {"n": 9, "q": "Can you use the X3 Pro drag rescue loop to lower a downed firefighter out a window?", "a": "No. The manual says the drag rescue loop must not be used to lift or lower a person vertically. It's for dragging.", "qh": "Can you use the X3 Pro drag rescue loop to lower a downed firefighter out a window?", "ah": "No. The manual says the drag rescue loop must not be used to lift or lower a person vertically. It's for dragging."}], "sources": [{"label": "3M Scott Air-Pak X3 Pro O&M Instructions 595373-01 Rev C", "url": "https://www.eastgreenbushfire.com/wp-content/uploads/2025/10/X3-Pro-NFPA-1981-2018-Edition-Operating-and-Maintenance-Instructions-English-595373-01_C.pdf"}, {"label": "3M Scott Air-Pak X3 Pro product page", "url": "https://www.3m.com/3M/en_US/p/d/b5005672007/"}, {"label": "Library copy: Drive > Firefighter_Reference_Library > 07_SCBA_Scott_and_MSA", "url": ""}, {"label": "3M Scott Air-Pak X3 Pro O&M 595373-01 Rev C, sections on the HUD, air-saver, purge valve, and negative-pressure leak test (same PDF as above)", "url": ""}], "position_html": "<strong>Tree position:<\/strong> ROOT 01 &gt; 01.2 SCBA &gt; tool. <strong>Unlocks after:<\/strong> 01.2.0 SCBA Overview. <strong>Cross-links:<\/strong> 04.2.1 Scott RIT-Pak III, 09.1.1 PASS.", "note_html": "Study aid only. Source: 3M Scott O&amp;M Instructions P/N 595373-01 Rev C (April 2020). Check your department's revision."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 250.0, "y": -288.0, "angle": 0.0, "vx": -241.25, "vy": 198.1, "vangle": 335.0}, "01.2.2": {"id": "01.2.2", "name": "MSA G1 SCBA", "path": "01", "kind": "tool", "parent": "01.2", "prereqRaw": "parent 01.2", "children": [], "prereqs": ["01.2"], "unlocks": [], "cross": ["04.2.2", "09.1.1", "09.3"], "doc": {"title": "01.2.2 MSA G1 SCBA (2018 Edition)", "file": "01.2.2_MSA_G1_SCBA.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>MSA's fire-service SCBA. It meets NFPA 1981-2018 (SCBA) and, with power and control modules, NFPA 1982-2018 (PASS). It has an integrated PASS, a HUD, an electronic control module, and optional telemetry and a built-in thermal camera.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Cylinders:<\/strong> 2216 psig (30-min) and 4500/5500 psig (30/45/60-min). Carbon cylinders with threaded or quick-connect handwheel.<\/li><li><strong>Facepiece:<\/strong> one facepiece and nosecup in S/M/L sizes. It requires a fit factor of at least 500.<\/li><li><strong>Pressure reducer:<\/strong> fail-open design. The <strong>bell alarm<\/strong> sounds at 33 to 37% of rated pressure. A RIC UAC fitting has an auto-resetting relief valve.<\/li><li><strong>HUD (7 LEDs):<\/strong> 75 to 100% shows 4 green, 50 to 74% shows 3 green, 36 to 49% shows 2 yellow, 0 to 35% shows 1 red.<\/li><li><strong>PASS:<\/strong> motion sensor in the control module. <strong>Pre-alarm at 20 s<\/strong> motionless, <strong>full alarm at 30 s<\/strong>. The ALARM button triggers a manual full alarm with or without air.<\/li><li><strong>Power module:<\/strong> 4 buddy lights, sounds the PASS alarms, and has a RIT light that marks the UAC in the dark at low pressure.<\/li><li><strong>Batteries:<\/strong> 6 alkaline C-cells, or a rechargeable Li-ion module.<\/li><li><strong>Options:<\/strong> telemetry module (sends pressure, time remaining, PASS, and thermal alarms to command, and allows a remote evacuation signal), integrated TIC, Remote Quick-Fill, and UEBSS.<\/li><li><strong>Control module display:<\/strong> must agree with the cylinder within ±5% (110/2216, 225/4500, 275/5500 psi).<\/li><li><strong>Regulator bypass knob:<\/strong> turn counterclockwise to open it. It gives an emergency airflow and bleeds the system after the cylinder valve is closed.<\/li><li><strong>UAC fittings:<\/strong> the RIC UAC on the pressure reducer, plus the optional Remote Quick-Fill UAC on the front right. 2216 and 4500 psi systems can fill and transfill through either. <strong>5500 psi G1 systems will not transfill.<\/strong><\/li><li><strong>Transfill between SCBAs (emergencies or training only):<\/strong> the higher-pressure SCBA is the donor. The donor needs more than 1000 psi (2216 systems) or more than 2000 psi (4500 systems) and must not be in alarm. Pressures equalize in about 60 seconds. Then <strong>both<\/strong> users go to fresh air.<\/li><li><strong>Evacuation signal (telemetry):<\/strong> the running-man icon flashes and the power module sounds a unique alarm. Press RESET twice within about 1 second to confirm.<\/li><li><strong>Temperature:<\/strong> approved for use above -25 °F (-32 °C).<\/li><\/ul>"}, {"key": "how", "title": "How it's used (functional test, from the manual)", "html": "<ol><li>Open the cylinder valve and watch the HUD start-up. Listen for the power-module tone and the low-pressure bell. The buddy lights flash green.<\/li><li>Self-test: a \"Go\" icon means OK. A Hardware Alarm icon means take it out of service.<\/li><li>Leave the control module still for about 20 s to get the pre-alarm (red buddy lights, red HUD LED). Shake it to reset.<\/li><li>Leave it still until the full alarm (30 s). Confirm shaking does not reset it. Reset by pressing RESET twice within about 1 second.<\/li><li>Press and hold ALARM to test the manual full alarm, then reset.<\/li><li>Close the valve and bleed slowly. At about 775/1575/1925 psi (2216/4500/5500 systems), confirm the red HUD LED, red buddy lights, and the bell.<\/li><\/ol>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>A Hardware Alarm at start-up means the unit is out of service until an MSA-certified tech repairs it.<\/li><li>Never disconnect the coupling nut while the gauge shows pressure. Bleed first.<\/li><li>Don't mark the SCBA with paint or labels (flammability and function risk).<\/li><li>Keep wearing it on air during overhaul unless air monitoring shows it's unnecessary.<\/li><li>Follow OSHA 1910.134: medical evaluation, training, and fit testing.<\/li><li>Never use the UAC to buddy-breathe (two users on one cylinder at the same time). That voids NIOSH approval.<\/li><li>Don't use the UAC if the atmosphere could contain a CBRN agent. Don't lubricate UAC fittings or let oil or grease touch them.<\/li><li>If the donor's bell sounds or its lights flash red during a transfill (35% of rated pressure), the donor disconnects and uses the remaining air to escape.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "During the bleed-down test on a 4500 psi G1, at about what reading should the bell, red HUD LED, and red buddy lights come on? What if they don't?", "a": "About 1575 psi (roughly 35% of 4500). The 2216 point is about 775 psi and the 5500 point about 1925 psi. If any of them fails, the SCBA fails the functional test. Remove it from service for a certified technician.", "qh": "During the bleed-down test on a 4500 psi G1, at about what reading should the bell, red HUD LED, and red buddy lights come on? What if they don't?", "ah": "About 1575 psi (roughly 35% of 4500). The 2216 point is about 775 psi and the 5500 point about 1925 psi. If any of them fails, the SCBA fails the functional test. Remove it from service for a certified technician."}, {"n": 2, "q": "Mid-assignment your HUD shows 2 yellow LEDs. How much air do you have, and what should you be doing?", "a": "Between 36 and 49% of rated pressure. You're just above the 33 to 37% bell, so start your exit now to be out before using reserve air.", "qh": "Mid-assignment your HUD shows 2 yellow LEDs. How much air do you have, and what should you be doing?", "ah": "Between 36 and 49% of rated pressure. You're just above the 33 to 37% bell, so start your exit now to be out before using reserve air."}, {"n": 3, "q": "Your partner's G1 goes into full PASS alarm while he's fine. How do you clear it, and why won't shaking the control module work?", "a": "Press RESET twice within about 1 second. Motion clears only a pre-alarm (20 s). Once the full alarm (30 s) starts, it takes a deliberate reset, so a downed firefighter's alarm doesn't stop just because he's moved.", "qh": "Your partner's G1 goes into full PASS alarm while he's fine. How do you clear it, and why won't shaking the control module work?", "ah": "Press RESET twice within about 1 second. Motion clears only a pre-alarm (20 s). Once the full alarm (30 s) starts, it takes a deliberate reset, so a downed firefighter's alarm doesn't stop just because he's moved."}, {"n": 4, "q": "At start-up the control module shows a Hardware Alarm icon. What do you do?", "a": "Take it out of service. It stays out until an MSA-certified technician repairs it.", "qh": "At start-up the control module shows a Hardware Alarm icon. What do you do?", "ah": "Take it out of service. It stays out until an MSA-certified technician repairs it."}, {"n": 5, "q": "Your partner is nearly out of air. Your 4500 psi G1 reads 2,600 psi and isn't in alarm. Can you transfill? Walk through it and what happens afterward.", "a": "Yes. You're above the 2000 psi minimum for a 4500 system and not in alarm, so you're the donor. Connect the transfill hose to both UAC fittings. Filling starts right away and pressures equalize in about 60 seconds. Then both of you go straight to fresh air. If your bell sounds during the fill, disconnect and escape.", "qh": "Your partner is nearly out of air. Your 4500 psi G1 reads 2,600 psi and isn't in alarm. Can you transfill? Walk through it and what happens afterward.", "ah": "Yes. You're above the 2000 psi minimum for a 4500 system and not in alarm, so you're the donor. Connect the transfill hose to both UAC fittings. Filling starts right away and pressures equalize in about 60 seconds. Then both of you go straight to fresh air. If your bell sounds during the fill, disconnect and escape."}, {"n": 6, "q": "Why can't you transfill a 5500 psi G1, and why can't the UAC be used to buddy-breathe?", "a": "The manual says 5500 psi systems will not transfill. Using the UAC for two users on one cylinder voids the NIOSH approval.", "qh": "Why can't you transfill a 5500 psi G1, and why can't the UAC be used to buddy-breathe?", "ah": "The manual says 5500 psi systems will not transfill. Using the UAC for two users on one cylinder voids the NIOSH approval."}, {"n": 7, "q": "With the telemetry module, Command sends an evacuation signal. What do you see and hear, and how do you acknowledge it?", "a": "The running-man icon flashes on the control module and the power module sounds a unique alarm. Press the green RESET button twice within about 1 second. The icon then stays steady on.", "qh": "With the telemetry module, Command sends an evacuation signal. What do you see and hear, and how do you acknowledge it?", "ah": "The running-man icon flashes on the control module and the power module sounds a unique alarm. Press the green RESET button twice within about 1 second. The icon then stays steady on."}, {"n": 8, "q": "After a drill, a member starts unscrewing the coupling nut while the gauge still shows pressure. Why stop him, and what's the right way?", "a": "The manual says never disconnect the coupling nut while the gauge shows pressure. Close the cylinder valve, open the bypass knob counterclockwise to bleed all pressure, close the knob, then disconnect.", "qh": "After a drill, a member starts unscrewing the coupling nut while the gauge still shows pressure. Why stop him, and what's the right way?", "ah": "The manual says never disconnect the coupling nut while the gauge shows pressure. Close the cylinder valve, open the bypass knob counterclockwise to bleed all pressure, close the knob, then disconnect."}, {"n": 9, "q": "What information can the telemetry module send to Command?", "a": "Cylinder pressure, estimated time remaining, PASS alarms, low battery, and thermal alarms. It also lets Command send an evacuation signal.", "qh": "What information can the telemetry module send to Command?", "ah": "Cylinder pressure, estimated time remaining, PASS alarms, low battery, and thermal alarms. It also lets Command send an evacuation signal."}], "sources": [{"label": "MSA G1 SCBA 2018 Edition Operating Manual", "url": "https://s7d9.scene7.com/is/content/minesafetyappliances/10187007_USOperatingManual-G1SCBA2018Ed"}, {"label": "MSA G1 SCBA user assets", "url": "https://us.msasafety.com/g1-scba-user-assets?locale=en"}, {"label": "Library copy: Drive > Firefighter_Reference_Library > 07_SCBA_Scott_and_MSA", "url": ""}, {"label": "MSA G1 SCBA 2018 Edition Operating Manual, sections 2.2 to 2.8, 13 (UAC, transfilling), and 17.2 (evacuation signal) (same PDF as above)", " ol", "parent": "02.3", "prereqRaw": "parent 02.3", "children": [], "prereqs": ["02.3"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 829.31, "y": -561.45, "angle": 105.5, "vx": -780.55, "vy": 783.4, "vangle": 350.5}, "02.3.4": {"id": "02.3.4", "name": "FLIR K1", "path": "02", "kind": "tool", "parent": "02.3", "prereqRaw": "parent 02.3", "children": [], "prereqs": ["02.3"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 810.99, "y": -572.47, "angle": 136.5, "vx": -782.78, "vy": 804.66, "vangle": 21.5}, "02.4": {"id": "02.4", "name": "Supporting Fire Protection Systems (standpipes, sprinklers, FDCs)", "path": "02", "kind": "main", "parent": null, "prereqRaw": "02.2", "children": [], "prereqs": ["02.2"], "unlocks": ["02.C"], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1040, "y": -600.0, "vx": -820.0, "vy": 940, "vangle": null}, "02.5": {"id": "02.5", "name": "Fire Attack Tactics: Flow Path, Transitional/Interior Attack", "path": "02", "kind": "main", "parent": null, "prereqRaw": "02.3, 01.1", "children": [], "prereqs": ["02.3", "01.1"], "unlocks": ["02.C", "10.3"], "cross": ["10.3"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1240, "y": -600.0, "vx": -820.0, "vy": 1090, "vangle": null}, "02.C": {"id": "02.C", "name": "CAPSTONE: Fire Attack Specialist", "path": "02", "kind": "capstone", "parent": null, "prereqRaw": "02.1 to 02.5", "children": [], "prereqs": ["02.1", "02.2", "02.3", "02.4", "02.5"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1640, "y": -600.0, "vx": -820.0, "vy": 1390, "vangle": null}, "03.1": {"id": "03.1", "name": "Ground Ladders", "path": "03", "kind": "main", "parent": null, "prereqRaw": "01.0", "children": ["03.1.1", "03.1.2"], "prereqs": ["01.0"], "unlocks": ["03.1.1", "03.1.2", "03.3", "03.4", "03.5", "03.C", "04.3"], "cross": ["04.3"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 440, "y": -450.0, "vx": -615.0, "vy": 490, "vangle": null}, "03.1.1": {"id": "03.1.1", "name": "Ground Ladders: Types, Loading, Inspection, Testing", "path": "03", "kind": "tool", "parent": "03.1", "prereqRaw": "parent 03.1", "children": [], "prereqs": ["03.1"], "unlocks": [], "cross": ["04.3", "08.5"], "doc": {"title": "03.1.1 Ground Ladders: Types, Loading, Inspection, and Service Testing", "file": "03.1.1_Ground_Ladders_Types_Inspection_Testing.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>Portable ladders carried on apparatus for rescue, access, ventilation, and egress. Types:<\/p><ul><li><strong>Single (wall) ladder:<\/strong> one section, fixed length, one-person handling.<\/li><li><strong>Roof ladder:<\/strong> single ladder with <strong>folding hooks<\/strong> at the tip to grip a roof ridge and spread firefighter weight.<\/li><li><strong>Extension ladder:<\/strong> a base (bed) section plus 1 to 3 telescoping <strong>fly<\/strong> sections. It locks with <strong>pawls (dogs)<\/strong> and is raised with a <strong>halyard<\/strong>.<\/li><li><strong>Folding (attic) ladder<\/strong> for tight spaces, <strong>combination (A-frame/extension)<\/strong> ladders, and <strong>pompier<\/strong> ladders (a pole with rungs and a large hook).<\/li><\/ul>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Rung spacing:<\/strong> <strong>14 in<\/strong> on fire ladders (vs 12 in on commercial ladders). The extra room makes a leg lock possible.<\/li><li><strong>Climbing angle:<\/strong> <strong>75°<\/strong>. Set the base out <strong>¼ of the working height<\/strong> (a ladder touching at 20 ft has its base 5 ft out).<\/li><li><strong>Max loads (only if service-tested to NFPA):<\/strong> single and roof 750 lb distributed, extension 750 lb distributed, both with a 500 lb concentrated limit. Folding 300 lb. Pompier 300 lb. At other angles, or if untested, <strong>250 lb max<\/strong>.<\/li><li><strong>Aluminum and heat:<\/strong> about <strong>200 °F<\/strong> can permanently weaken heat-treated aluminum, and aluminum <strong>doesn't change color<\/strong>. Heat-sensor labels go on each section.<\/li><li><strong>Service test:<\/strong> <strong>at least yearly<\/strong>, plus after overload, unusual use (like forcing a door), suspected damage, or any repair.<\/li><li><strong>Horizontal bending (center load) test (ALCO-LITE summary of NFPA 1930):<\/strong> lay the ladder flat on supports under the end rungs. Extension ladders are fully extended, with the pawls strapped so they can't release while horizontal. The load sits on the beams over a 32-in area at the center.<ol><li>Apply 350 lb for 1 minute, remove it, and measure the center height.<\/li><li>Apply 500 lb for 5 minutes, remove it, wait 5 minutes, and measure again.<\/li><li>Allowed permanent set: ½ in (ladders up to 25 ft), 1 in (over 25 ft), 1½ in (over 35 ft). More set, or any visible failure, means repair or destroy.<\/li><\/ol><\/li><li><strong>Loads include everything on the ladder:<\/strong> people, tools, and a charged hoseline all count toward the 750/500 lb limits.<\/li><li><strong>Materials (ALCO-LITE):<\/strong><ul><li><strong>Aluminum:<\/strong> strong for its weight and can be load-tested. It tends to fail more gradually, but it conducts heat and electricity.<\/li><li><strong>Wood:<\/strong> less affected by heat, and nonconductive when dry. It's heavier, needs ongoing maintenance, and can hide defects that are hard to find.<\/li><li><strong>Fiberglass:<\/strong> nonconductive and chemical-resistant. It's heavier and less impact-resistant, about as heat-sensitive as aluminum, and fails more suddenly with less warning.<\/li><\/ul><\/li><\/ul>"}, {"key": "how", "title": "How it's used (inspection)", "html": "<p>Inspect <strong>before and after every use<\/strong>. Check for fractured or loose rails and rungs, damaged pawls, worn or missing halyards, worn or misadjusted wire rope (3-section ladders), changed heat-sensor labels, loose or missing fasteners, gouges, and any structural strain. If anything is off, take it out of service and test it.<\/p>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Never tie ladders together to gain length.<\/li><li>Secure the base (heel or tie off) and the tip.<\/li><li>Reposition a raised ladder <strong>only from the base<\/strong>, never from the top.<\/li><li>Use extension ladders <strong>fly-out<\/strong> unless the ladder is designed for fly-in.<\/li><li>Keep ladders away from <strong>electrical lines<\/strong>. Aluminum, wet wood, and fiberglass can all conduct.<\/li><li>Keep aluminum ladders away from apparatus exhaust heat. Water sizzling on a ladder means pull it from service.<\/li><li>With stay poles, if one pole can't be set, don't use the other one either.<\/li><li>Why no tying: the side rails are engineered to carry a set load over a set span, and two ladders tied together don't have the rail strength for the longer span.<\/li><li>Why only from the base: sliding or rolling a raised ladder can leave it on bad footing or let the pawls disengage.<\/li><li>Why both stay poles: using only one pole puts a twisting load on the ladder.<\/li><li>On 3-section ladders, the cable that raises the top fly should be moderately taut when the ladder is retracted.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li>Until ALCO-LITE introduced aluminum fire ladders, all fire-service ground ladders were wood. Some departments still use wood today (ALCO-LITE handbook).<\/li><li>NFPA 1931 (ladder design) and NFPA 1932 (use, maintenance, and service testing) have been combined into NFPA 1930.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Fire-service ground ladders use 14-in rung spacing instead of the 12 in on commercial ladders. Why?", "a": "The extra 2 in leave room for a leg lock and boots, and more working room on the ladder.", "qh": "Fire-service ground ladders use 14-in rung spacing instead of the 12 in on commercial ladders. Why?", "ah": "The extra 2 in leave room for a leg lock and boots, and more working room on the ladder."}, {"n": 2, "q": "A 24-ft extension ladder is raised so it touches the building at the 20-ft level. Where should the butt be, and what angle does that give?", "a": "5 ft out from the support point (¼ of the 20-ft working height). That gives the 75° climbing angle the load ratings are based on.", "qh": "A 24-ft extension ladder is raised so it touches the building at the 20-ft level. Where should the butt be, and what angle does that give?", "ah": "5 ft out from the support point (¼ of the 20-ft working height). That gives the 75° climbing angle the load ratings are based on."}, {"n": 3, "q": "A service-tested extension ladder at 75° holds one firefighter, his tools, and a charged 1¾-in line. Which limits apply and what counts toward them? What changes at 60°, or if the ladder was never service tested?", "a": "At about 75° a tested extension ladder is rated 750 lb distributed and 500 lb concentrated. The firefighter, tools, and charged hose all count. At any other angle, or if the ladder isn't service tested, the limit drops to 250 lb, and an untested ladder should be pulled until tested.", "qh": "A service-tested extension ladder at 75° holds one firefighter, his tools, and a charged 1¾-in line. Which limits apply and what counts toward them? What changes at 60°, or if the ladder was never service tested?", "ah": "At about 75° a tested extension ladder is rated 750 lb distributed and 500 lb concentrated. The firefighter, tools, and charged hose all count. At any other angle, or if the ladder isn't service tested, the limit drops to 250 lb, and an untested ladder should be pulled until tested."}, {"n": 4, "q": "After a working fire, an aluminum ladder that sat near the building looks perfect, but its heat-sensor label has changed. What do you do, and why can't you trust your eyes?", "a": "Remove it from service until it's service tested. Around 200 °F can permanently weaken heat-treated aluminum, and aluminum doesn't change color when heated. The label (or water sizzling on the ladder) is your only warning.", "qh": "After a working fire, an aluminum ladder that sat near the building looks perfect, but its heat-sensor label has changed. What do you do, and why can't you trust your eyes?", "ah": "Remove it from service until it's service tested. Around 200 °F can permanently weaken heat-treated aluminum, and aluminum doesn't change color when heated. The label (or water sizzling on the ladder) is your only warning."}, {"n": 5, "q": "A crew used a 24-ft extension ladder as a lever to force a door. Can it go back on the rig after a visual check?", "a": "No. Unusual use like forcing a door triggers a service test, the same as overload, suspected damage, or repair. Otherwise it's tested at least yearly.", "qh": "A crew used a 24-ft extension ladder as a lever to force a door. Can it go back on the rig after a visual check?", "ah": "No. Unusual use like forcing a door triggers a service test, the same as overload, suspected damage, or repair. Otherwise it's tested at least yearly."}, {"n": 6, "q": "Walk through the horizontal bending (center load) service test and its pass/fail rule for a 28-ft extension ladder.", "a": "Lay it flat on supports under the end rungs, fully extended, with the pawls strapped. Load the beams over a 32-in center area. Apply 350 lb for 1 min, remove it, and measure. Apply 500 lb for 5 min, remove it, wait 5 min, and re-measure. Over 25 ft, permanent set must be 1 in or less. More set, or any visible failure, means repair or destroy.", "qh": "Walk through the horizontal bending (center load) service test and its pass/fail rule for a 28-ft extension ladder.", "ah": "Lay it flat on supports under the end rungs, fully extended, with the pawls strapped. Load the beams over a 32-in center area. Apply 350 lb for 1 min, remove it, and measure. Apply 500 lb for 5 min, remove it, wait 5 min, and re-measure. Over 25 ft, permanent set must be 1 in or less. More set, or any visible failure, means repair or destroy."}, {"n": 7, "q": "Your 24-ft ladder is 3 ft short, so a member suggests lashing a roof ladder to the tip. Why is that forbidden?", "a": "Rails are engineered for a set load over a set span. Tied ladders don't have the rail strength for the longer span and can fail. Get a longer ladder instead.", "qh": "Your 24-ft ladder is 3 ft short, so a member suggests lashing a roof ladder to the tip. Why is that forbidden?", "ah": "Rails are engineered for a set load over a set span. Tied ladders don't have the rail strength for the longer span and can fail. Get a longer ladder instead."}, {"n": 8, "q": "A raised ladder is one window off. Why must it be moved from the base and not walked over from the top?", "a": "Moving it from the top can leave the base on poor footing or let the pawls disengage. Reposition only from the base.", "qh": "A raised ladder is one window off. Why must it be moved from the base and not walked over from the top?", "ah": "Moving it from the top can leave the base on poor footing or let the pawls disengage. Reposition only from the base."}, {"n": 9, "q": "Compare aluminum, wood, and fiberglass ground ladders for heat, electrical hazard, and how they fail.", "a": "Aluminum conducts heat and electricity, can lose strength at about 200 °F without changing color, and tends to fail gradually. Wood resists heat better and is nonconductive only when dry (wet wood conducts), but can hide defects. Fiberglass is nonconductive but about as heat-sensitive as aluminum and fails suddenly with less warning. Keep every type away from electrical lines.", "qh": "Compare aluminum, wood, and fiberglass ground ladders for heat, electrical hazard, and how they fail.", "ah": "Aluminum conducts heat and electricity, can lose strength at about 200 °F without changing color, and tends to fail gradually. Wood resists heat better and is nonconductive only when dry (wet wood conducts), but can hide defects. Fiberglass is nonconductive but about as heat-sensitive as aluminum and fails suddenly with less warning. Keep every type away from electrical lines."}, {"n": 10, "q": "You're raising a ladder with stay poles and one pole can't be set on the uneven ground. What do you do and why?", "a": "Remove the other pole from service and don't use stay poles. One pole puts a twisting load on the ladder, which isn't permitted.", "qh": "You're raising a ladder with stay poles and one pole can't be set on the uneven ground. What do you do and why?", "ah": "Remove the other pole from service and don't use stay poles. One pole puts a twisting load on the ladder, which isn't permitted."}], "sources": [{"label": "ALCO-LITE Fire Ladder Safety Handbook (Jan 2025)", "url": "https://www.fireladder.com/wp-content/uploads/2025/01/Fire-hand-Book.pdf"}, {"label": "Duo-Safety ladder documents", "url": "https://www.duosafety.com/"}, {"label": "NFPA 1930 (purchase)", "url": "https://www.nfpa.org/"}, {"label": "Library copy: Drive > Firefighter_Reference_Library > 10_PPE_Hose_Ladders_Other", "url": ""}, {"label": "ALCO-LITE Fire Ladder Safety Handbook: materials, center load test, loading, and safety notes (same PDF as above)", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 03 Truck &gt; 03.1 Ground Ladders &gt; node 1. <strong>Unlocks after:<\/strong> 01.0 Fundamentals. <strong>Unlocks:<\/strong> 03.1.2 Ladder Carries and Raises, then 03.4 Search and 03.5 Aerials (planned). <strong>Cross-links:<\/strong> 04.3 Firefighter Removal (ladder bail-out and rescue), 08.5 Aerial Operation.", "note_html": "Study aid only. NFPA ground-ladder requirements, formerly NFPA 1931 (design) and NFPA 1932 (use, maintenance, service testing), ar
