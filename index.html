s?", "ah": "Battalion Chief is the first working supervisory level. Assistant Chief is the full supervisory level. Unit Chief is the administrative level with management responsibility for a unit (Join CAL FIRE BC page, EX-4883, EX-5386).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "BC: first working supervisory; AC: full supervisory; Unit Chief: administrative level", "wh": ["BC: full supervisory; AC: first working supervisory; Unit Chief: administrative level", "BC: first working supervisory; AC: administrative level; Unit Chief: full supervisory", "BC: company officer level; AC: first working supervisory; Unit Chief: full supervisory"], "hash": "sha256:4296a51431c93131711cf788580d954d57873f3973e4d894cc1277866ff42824"}, {"n": 9, "q": "An FFI's posting lists \"EDWC.\" What is it, how much is it for FFI, and how often is it paid?", "a": "EDWC is Extended Duty Week Compensation. For FFI it's $1,560 to $1,972, paid every 4 weeks, and it is listed separately from the $4,590 to $5,803 monthly base (JC-533177). It comes from CalCareers postings, not the alpha pay-scale extract.", "qh": "An FFI's posting lists \"EDWC.\" What is it, how much is it for FFI, and how often is it paid?", "ah": "EDWC is Extended Duty Week Compensation. For FFI it's $1,560 to $1,972, paid every 4 weeks, and it is listed separately from the $4,590 to $5,803 monthly base (JC-533177). It comes from CalCareers postings, not the alpha pay-scale extract.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Extended Duty Week Compensation: $1,560 to $1,972, paid every 4 weeks", "wh": ["Extended Duty Week Compensation: $1,560 to $1,972, paid once a month", "Emergency Duty Wage Credit: $1,560 to $1,972, paid every 4 weeks", "Extended Duty Week Compensation: $156 to $197, paid every 2 weeks"], "hash": "sha256:ac0cfeebf6c31f30067f347ad3dcf64173cb49e321b282ad4420da1c93d190f9"}, {"n": 10, "q": "A CEA in a non-delegated department has been at Level B for 12 months and asks for a raise. Under CalHR Section 8, what's possible without prior CalHR approval, and what limits apply? (This is a general CEA rule. It isn't a Region Chief pay figure.)", "a": "A 5% increase up to the Level B maximum ($14,453), and no more than 5% in any 12 months without CalHR approval. Non-delegated departments can't go above the approved CEA level without prior CalHR approval. Only delegated departments can set salaries above approved levels, within a CalHR cap (Section 8, Rev. 08/19/25).", "qh": "A CEA in a non-delegated department has been at Level B for 12 months and asks for a raise. Under CalHR Section 8, what's possible without prior CalHR approval, and what limits apply? (This is a general CEA rule. It isn't a Region Chief pay figure.)", "ah": "A 5% increase up to the Level B maximum ($14,453), and no more than 5% in any 12 months without CalHR approval. Non-delegated departments can't go above the approved CEA level without prior CalHR approval. Only delegated departments can set salaries above approved levels, within a CalHR cap (Section 8, Rev. 08/19/25).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "5% up to the Level B max ($14,453); no more than 5% in any 12 months", "wh": ["10% up to the Level B max ($14,453); no more than 10% in any 12 months", "5% up to the Level C max ($15,297); no more than 5% in any 12 months", "5% up to the Restricted Zone max ($21,370); no more than 5% a year"], "hash": "sha256:814de66fcc4a96a4dc8bb2e4439c2298a996df5939f2b2390a4526acac160262"}], "sources": [{"label": "CalHR Civil Service Pay Scale, Alpha by Class Title (updated 10/26/2026)", "url": "https://www.calhr.ca.gov/wp-content/uploads/sites/361/2026/09/PS_Sec_15.pdf"}, {"label": "CalHR CAL FIRE class-code list (2025)", "url": "https://www.calhr.ca.gov/wp-content/uploads/sites/361/2025/05/rev-5.3.22-CalFIRE-3.4.2020-clean-version.pdf"}, {"label": "Firefighter I posting JC-533177", "url": "https://calcareers.ca.gov/CalHrPublic/Jobs/JobPosting.aspx?JobControlId=533177"}, {"label": "FFII exam bulletin EX-4603", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4603"}, {"label": "FAE exam bulletin EX-4473", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4473"}, {"label": "Fire Captain exam bulletin EX-5398", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=5398"}, {"label": "Assistant Chief exam bulletin EX-4883", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4883"}, {"label": "Unit Chief exam bulletin EX-5386 (2026)", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=5386"}, {"label": "Unit Chief exam bulletin EX-4515 (2025, older pay)", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4515"}, {"label": "Join CAL FIRE, Fire Fighter I", "url": "https://www.joincalfire.com/classifications/fire-protection/firefighting-and-paramedics/fire-fighter-i"}, {"label": "Join CAL FIRE, Battalion Chief", "url": "https://www.joincalfire.com/classifications/fire-protection/firefighting-and-paramedics/battalion-chief"}, {"label": "CalHR Fire Fighter/Fire Chief Series class spec 8979", "url": "https://eservices.calhr.ca.gov/enterprisehrblazorpublic/Public/ClassSpec/ClassSpecDetail/8979"}, {"label": "CalCareers Fire Fighter (8979) exam bulletin EX-2446, Department of State Hospitals", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=2446"}, {"label": "Ranger batch: /workspace/can-report/calfire/calfire-batch-01.md", "url": ""}, {"label": "CalHR CEA Salaries page", "url": "https://www.calhr.ca.gov/about-calhr/divisions-programs/personnel-management/cea-job-info/cea-salaries/"}, {"label": "CalHR Pay Scales Section 8, Variable Compensation (Rev. 08/19/25)", "url": "https://www.calhr.ca.gov/wp-content/uploads/sites/361/2025/07/PS_Sec_08.pdf"}, {"label": "Ranger batch 05: /workspace/can-report/calfire/calfire-batch-05.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 2. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> none listed in tree.py.", "note_html": "Study aid only. Source: CalHR Civil Service Pay Scale, Alpha by Class Title (updated 10/26/2026), plus CalCareers postings and bulletins (Ranger calfire-batch-01). Pay is monthly base unless noted, and it changes. Always check the current pay scale."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1452.98, "y": 666.75, "angle": 79.0, "vx": 887.99, "vy": 1238.81, "vangle": 359.0}, "10.6.3": {"id": "10.6.3", "name": "Related Classifications (Aviation, Heavy Equipment, Forestry, Prevention, OSFM)", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.6.9", "10.6.10"], "doc": {"title": "10.6.3 Related Classifications (Aviation, Heavy Equipment, Forestry, Prevention, OSFM)", "file": "10.6.3_Related_Classifications_Aviation_Heavy_Equipment_Forestry_Prevention_OSFM.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>These are the career tracks next to the main fire-protection ladder (10.6.2): <strong>aviation, heavy equipment, resource management (forestry), fire prevention, and the Office of the State Fire Marshal (OSFM) and law enforcement<\/strong>. Some feed back into the fire ladder. For example, a Heavy Fire Equipment Operator can reach Battalion Chief through a separate experience pattern.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<p>Monthly pay ranges (CalHR pay scale, 10/26/2026):<\/p><p><strong>Aviation<\/strong><\/p><ul><li>Forestry Fire Pilot (1046): $7,948 to $10,488.<\/li><li>Aviation Officer II, Flight Operations (1056) or Maintenance (6882): $8,440 to $10,938.<\/li><li>Aviation Officer III, Flight Operations (1053) or Maintenance (1050): $9,276 to $12,032.<\/li><li>Senior Aviation Officer (1052): $12,936 to $15,225.<\/li><\/ul><p><strong>Heavy equipment<\/strong><\/p><ul><li>Heavy Fire Equipment Operator, HFEO (6387): Range A $6,230 to $7,694. Range B $6,838 to $8,446.<\/li><\/ul><p><strong>Forestry<\/strong><\/p><ul><li>Forestry Aide (1060): $3,744 to $4,630 (NT).<\/li><li>Forestry Technician (1085): Range A $4,148 to $5,379.<\/li><li>Forestry Assistant I (1086): Range A $4,747 to $6,152. Range B $5,196 to $6,737 (batch 05).<\/li><li>Forestry Assistant II (1093): Range A $5,448 to $7,067. Range B $5,980 to $7,757 (batch 05).<\/li><li>Forester I, Nonsupervisory (1054): $6,932 to $8,997.<\/li><li>Forester II, Supervisory (1042): $9,428 to $12,226.<\/li><li>Forester III (1041): $9,897 to $12,843.<\/li><\/ul><p><strong>Fire prevention<\/strong><\/p><ul><li>Fire Prevention Specialist I (1067): $4,148 to $5,433.<\/li><li>Fire Prevention Specialist II (1069): $4,747 to $6,216.<\/li><\/ul><p><strong>OSFM<\/strong><\/p><ul><li>State Fire Marshal Trainee (8980): $6,392 to $7,489.<\/li><li>Deputy State Fire Marshal (9086): Range A $6,965 to $8,585. Range B $7,298 to $9,858.<\/li><li>DSFM III, Specialist (9013) or Supervisor (9010).<\/li><li>Division Chief, CSFM Office (8966): $10,783 to $13,482.<\/li><\/ul><p><strong>Arson and bomb<\/strong><\/p><ul><li>Arson and Bomb Investigator Assistant (8894).<\/li><li>Arson and Bomb Investigator (8997): $7,276 to $9,994.<\/li><li>Senior Arson and Bomb Investigator (9015): $8,504 to $11,814.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>HFEO to Battalion Chief (Pattern II):<\/strong> five years as an HFEO, two of them through a formal Training and Development assignment to Fire Captain, plus Basic Fire Control training, \"which includes the Fire Fighter Academy and Company Officer Academy\" (Join CAL FIRE BC page).<\/li><li><strong>Fire Captain specialty assignments (EX-5398):<\/strong> peace officer/fire prevention, dispatcher, assistant air attack coordinator, helitack captain, training instructor, and paramedic supervision.<\/li><li><strong>Aviation fire officers:<\/strong> the OV-10 crew is a pilot plus an observer (a Chief Officer or Fire Captain). The <strong>Air Attack Officer<\/strong> is a fire officer who works with the incident commander and directs drops (see 10.6.9).<\/li><li><strong>Law enforcement:<\/strong> \"Law Enforcement personnel enforce forest and fire laws and conduct investigations into the cause of fires,\" including arson and civil cost recovery (Fire Protection page).<\/li><li><strong>Forestry:<\/strong> timber harvest plans on non-federal land are prepared by <strong>Registered Professional Foresters<\/strong>. CAL FIRE administers the Forest Practice Act and licenses logging operators on non-federal lands (Our Organization page).<\/li><li><strong>OSFM:<\/strong> \"supports the mission of CAL FIRE by focusing on fire prevention.\" It regulates buildings and hazardous-liquid pipelines, gives statewide direction on wildland fire prevention, develops building standards, and runs training. Its elements are engineering, education, enforcement, and support from the State Board of Fire Services. <strong>State Fire Training (SFT)<\/strong> is an OSFM division. The current State Fire Marshal is Daniel Berlant.<\/li><li><strong>Forestry Assistant II, Unit Forester, Tulare Unit<\/strong> (PO-199, position 542-416-1093-001, Visalia, effective 07/01/2026; supervised by a Forester II Pre-Fire Manager). This is one position's duty statement:<ul><li>Works under close supervision on SRA fuels management, fire prevention, and resource protection.<\/li><li>Plans and runs SRA fire-prevention and VMP/CFIP projects, prepares CEQA and grant documents, inspects projects, and enters CalMAPPER data.<\/li><li>Does Forest Practice inspections and enforcement, <strong>including issuing citations as a trained Public Officer<\/strong>.<\/li><li>Serves as the Unit <strong>LE-100 Defensible Space Coordinator<\/strong>, overseeing Forestry Technicians and Aides working as Defensible Space Inspectors.<\/li><li>Responds to emergency incidents.<\/li><\/ul><\/li><li><strong>Aviation Officer II (Flight Operations), working title \"Aviation Officer – Safety\"<\/strong> (PO-199, position 542-065-1056-004, Sacramento, effective 8/6/26). Works under the Senior Aviation Officer's delegation to the Aviation Safety Program Manager:<ul><li>Runs aviation safety and its budget, plus safety standardization and training for pilots and staff.<\/li><li>Makes sure contracted pilots and aircraft meet department safety standards, and monitors pilots and aircraft on incidents.<\/li><li>Sets contract standards and approves invoices.<\/li><li>Is the <strong>Industrial Ground Safety Officer for McClellan Field, including the air tanker reload base<\/strong>.<\/li><li>Handles CAL-OSHA/FED-OSHA compliance and SAFECOM reporting.<\/li><li>Serves as <strong>Flight Operations Duty Chief<\/strong> as qualified: a 24-hour duty week, FRAT notifications, and immediate response to aviation accidents and incidents.<\/li><li>May fly as a pilot in state-owned, leased, or contracted aircraft as authorized.<\/li><\/ul><\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>The Forestry Assistant II PO-199 requires the <strong>Arduous Fitness Standard<\/strong>, annual <strong>respiratory-protection / SCBA medical clearance<\/strong>, and completion of the CAL FIRE <strong>Firefighter Academy (FFA) and Company Officer Academy (COA)<\/strong> during probation as a condition of employment. No academy length is given.<\/li><li>Aviation safety is a dedicated job. The Aviation Officer – Safety position covers safety standardization, OSHA compliance, SAFECOM reporting, and immediate response to aviation accidents as Flight Operations Duty Chief.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li>OSFM has been \"part of the CAL FIRE team since 1995\" (Our Organization page).<\/li><li>The Forest Practice Act was passed in 1945 and revised in 1973 (Our Organization page).<\/li><li>The Assistant State Fire Marshal (8963) appears on the 2025 class list but was <strong>not found<\/strong> in the 10/26/2026 pay-scale extract.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "A Heavy Fire Equipment Operator wants to become a Battalion Chief without ever holding the Captain class. Is there a path? What exactly does it require?", "a": "Yes, BC Pattern II. It takes five years of state service as an HFEO, two of them through a formal Training and Development assignment to the Fire Captain class, plus Basic Fire Control training (Fire Fighter Academy and Company Officer Academy). Source: Join CAL FIRE BC page.", "qh": "A Heavy Fire Equipment Operator wants to become a Battalion Chief without ever holding the Captain class. Is there a path? What exactly does it require?", "ah": "Yes, BC Pattern II. It takes five years of state service as an HFEO, two of them through a formal Training and Development assignment to the Fire Captain class, plus Basic Fire Control training (Fire Fighter Academy and Company Officer Academy). Source: Join CAL FIRE BC page.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Yes, Pattern II: 5 years as HFEO (2 in T&amp;D to Captain) plus Basic Fire Control (FFA and COA)", "wh": ["Yes, Pattern II: 3 years as HFEO (1 in T&amp;D to Captain) plus Basic Fire Control (FFA and COA)", "Yes, Pattern II: 5 years as HFEO (2 in T&amp;D to Captain) plus the Firefighter Academy only", "No: every Battalion Chief pattern requires 3 years in the Fire Captain class"], "hash": "sha256:489c524eb1d11a9618e5fe541b8435ebc65203747b83718902417de4c52650ee"}, {"n": 2, "q": "A Fire Captain loves aviation but doesn't want to be a pilot. What aviation roles do the records show for fire officers?", "a": "Fire Captain specialty assignments include assistant air attack coordinator and helitack captain (EX-5398). On the OV-10, the observer is a Chief Officer or Fire Captain acting as Air Attack Officer, working with the incident commander and directing drops (OV-10 page).", "qh": "A Fire Captain loves aviation but doesn't want to be a pilot. What aviation roles do the records show for fire officers?", "ah": "Fire Captain specialty assignments include assistant air attack coordinator and helitack captain (EX-5398). On the OV-10, the observer is a Chief Officer or Fire Captain acting as Air Attack Officer, working with the incident commander and directing drops (OV-10 page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Assistant air attack coordinator, helitack captain, and Air Attack Officer in the OV-10", "wh": ["Assistant air attack coordinator, helitack captain, and Air Attack Officer in the S-2T", "Only Forestry Fire Pilot (1046); aviation roles aren't open to Fire Captains", "Helitack captain and Senior Aviation Officer (1052) as a Captain assignment"], "hash": "sha256:18b76ba62b14fb41df1f1bd83d8d50dda7868ab87506a61138b4d88608455645"}, {"n": 3, "q": "Compare a Fire Prevention Specialist with a Fire Captain on a peace officer/fire prevention assignment. Which is a fire-ladder rank, and which is a separate classification?", "a": "Fire Captain (1095) is on the fire ladder, and peace officer/fire prevention is one of its specialty assignments (EX-5398). Fire Prevention Specialist I/II (1067/1069) are separate classes with their own pay ($4,148 to $5,433 and $4,747 to $6,216).", "qh": "Compare a Fire Prevention Specialist with a Fire Captain on a peace officer/fire prevention assignment. Which is a fire-ladder rank, and which is a separate classification?", "ah": "Fire Captain (1095) is on the fire ladder, and peace officer/fire prevention is one of its specialty assignments (EX-5398). Fire Prevention Specialist I/II (1067/1069) are separate classes with their own pay ($4,148 to $5,433 and $4,747 to $6,216).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Captain (1095) is the ladder rank; Fire Prevention Specialist I/II (1067/1069) are separate classes", "wh": ["Fire Prevention Specialist (1067) is the ladder rank; the Captain assignment is a separate class", "Both are ladder ranks; Fire Prevention Specialist sits between FAE and Captain", "Captain (1095) is the ladder rank; Fire Prevention Specialist is a Captain assignment, not a class"], "hash": "sha256:7fb3a2ae2fb2c918aa51ba24352d13e9b97f6816176c66f137be29ba8cad47ad"}, {"n": 4, "q": "\"Division Chief, CSFM Office\" and an Assistant Chief \"serving as Division Chief\" sound alike. What's the difference?", "a": "Division Chief, California State Fire Marshal's Office (8966) is its own CalHR class ($10,783 to $13,482). In the fire-protection series, \"Division Chief\" is an assignment of the Assistant Chief class (1039), not a separate class (EX-4883).", "qh": "\"Division Chief, CSFM Office\" and an Assistant Chief \"serving as Division Chief\" sound alike. What's the difference?", "ah": "Division Chief, California State Fire Marshal's Office (8966) is its own CalHR class ($10,783 to $13,482). In the fire-protection series, \"Division Chief\" is an assignment of the Assistant Chief class (1039), not a separate class (EX-4883).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "CSFM Division Chief (8966) is its own class; the fire-series Division Chief is an AC (1039) assignment", "wh": ["Both are assignments of the Assistant Chief class (1039), one in OSFM and one in a unit", "Both are separate classes: Division Chief (8966) and Division Chief, Fire Protection (1039)", "The fire-series Division Chief is its own class; the CSFM title is an AC assignment"], "hash": "sha256:05826dc0bb2f94bf6399b7717473ef3b7232f17893e660914c0cd41aeead4f9e"}, {"n": 5, "q": "Who prepares timber harvest plans on non-federal land, and what does CAL FIRE do under the Forest Practice Act?", "a": "Registered Professional Foresters prepare them. CAL FIRE administers the Forest Practice Act and licenses logging operators on non-federal lands (Our Organization page).", "qh": "Who prepares timber harvest plans on non-federal land, and what does CAL FIRE do under the Forest Practice Act?", "ah": "Registered Professional Foresters prepare them. CAL FIRE administers the Forest Practice Act and licenses logging operators on non-federal lands (Our Organization page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Registered Professional Foresters; CAL FIRE administers the Act and licenses logging operators", "wh": ["CAL FIRE Unit Foresters; the Board of Forestry licenses logging operators", "Registered Professional Foresters; CAL FIRE only reviews federal timber sales", "Forestry Technicians; CAL FIRE administers the Act and licenses logging operators"], "hash": "sha256:a45eef0d77f52a1c7de672ae4104d2fc8d755e1c56ff0e4c2d03cc2e05b5d20e"}, {"n": 6, "q": "Trace the forestry series from the entry class to Forester III. Which class is non-tenured, and how does Forester I differ from Forester II?", "a": "Forestry Aide (1060, NT, non-tenured), Forestry Technician (1085), Forestry Assistant I (1086), Forestry Assistant II (1093), Forester I (1054), Forester II (1042), Forester III (1041). Forester I is nonsupervisory and Forester II is supervisory (pay scale titles).", "qh": "Trace the forestry series from the entry class to Forester III. Which class is non-tenured, and how does Forester I differ from Forester II?", "ah": "Forestry Aide (1060, NT, non-tenured), Forestry Technician (1085), Forestry Assistant I (1086), Forestry Assistant II (1093), Forester I (1054), Forester II (1042), Forester III (1041). Forester I is nonsupervisory and Forester II is supervisory (pay scale titles).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Aide (NT), Technician, Assistant I, Assistant II, Forester I (nonsupervisory), II (supervisory), III", "wh": ["Technician (NT), Aide, Assistant I, Assistant II, Forester I (nonsupervisory), II (supervisory), III", "Aide (NT), Technician, Assistant I, Assistant II, Forester I (supervisory), II (nonsupervisory), III", "Aide (NT), Assistant I, Technician, Assistant II, Forester I (nonsupervisory), II (supervisory), III"], "hash": "sha256:0d504b1a5205372195b1db9fa69ad1809593de518421d92e0bafea97015edd68"}, {"n": 7, "q": "What do CAL FIRE law enforcement personnel do, and which classifications on the pay scale cover arson and bomb work?", "a": "They enforce forest and fire laws and investigate fire causes, including arson and civil cost recovery (Fire Protection page). Pay-scale classes: Arson and Bomb Investigator Assistant (8894), Arson and Bomb Investigator (8997), and Senior Arson and Bomb Investigator (9015).", "qh": "What do CAL FIRE law enforcement personnel do, and which classifications on the pay scale cover arson and bomb work?", "ah": "They enforce forest and fire laws and investigate fire causes, including arson and civil cost recovery (Fire Protection page). Pay-scale classes: Arson and Bomb Investigator Assistant (8894), Arson and Bomb Investigator (8997), and Senior Arson and Bomb Investigator (9015).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Enforce forest and fire laws, investigate fire cause; Arson and Bomb Investigator Assistant, Investigator, Senior", "wh": ["Enforce forest and fire laws, investigate fire cause; DSFM I, DSFM II, and DSFM III", "Patrol state forests only; Arson and Bomb Investigator Assistant, Investigator, Senior", "Investigate fire cause only, with no enforcement; Fire Prevention Specialist I and II"], "hash": "sha256:f2567b466a53638bb8cd18b6a77810e12393783d8fb1103a42383b19147d3af0"}, {"n": 8, "q": "Describe OSFM's role inside CAL FIRE and name its four program elements.", "a": "OSFM supports CAL FIRE's mission by focusing on fire prevention: regulating buildings and hazardous-liquid pipelines, wildland fire-prevention direction, building standards, and training. Its elements are engineering, education, enforcement, and support from the State Board of Fire Services (OSFM About page).", "qh": "Describe OSFM's role inside CAL FIRE and name its four program elements.", "ah": "OSFM supports CAL FIRE's mission by focusing on fire prevention: regulating buildings and hazardous-liquid pipelines, wildland fire-prevention direction, building standards, and training. Its elements are engineering, education, enforcement, and support from the State Board of Fire Services (OSFM About page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Fire prevention; engineering, education, enforcement, and State Board of Fire Services support", "wh": ["Fire prevention; engineering, education, enforcement, and Board of Forestry support", "Fire suppression; engineering, education, enforcement, and State Board of Fire Services support", "Fire prevention; planning, education, investigation, and State Board of Fire Services support"], "hash": "sha256:63bff1ead85c7c2cca8398edf4918b3ae374381a0243f442803517144508c71f"}, {"n": 9, "q": "Aviation Officer II comes in two versions with the same pay. What are they, and how can you tell them apart on paperwork?", "a": "Flight Operations (1056) and Maintenance (6882), both $8,440 to $10,938. The class code tells them apart. The same split exists at Aviation Officer III (1053 and 1050).", "qh": "Aviation Officer II comes in two versions with the same pay. What are they, and how can you tell them apart on paperwork?", "ah": "Flight Operations (1056) and Maintenance (6882), both $8,440 to $10,938. The class code tells them apart. The same split exists at Aviation Officer III (1053 and 1050).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Flight Operations (1056) and Maintenance (6882); the class code tells them apart", "wh": ["Flight Operations (1053) and Maintenance (1050); the class code tells them apart", "Pilot (1046) and Maintenance (6882); the pay range tells them apart", "Flight Operations (1056) and Safety (1052); the working title tells them apart"], "hash": "sha256:b0f2fcc48797d4c2e883717f6cfd65f3dcc107fcab8fe048ac37d6c24950440b"}, {"n": 10, "q": "A forestry graduate takes the Forestry Assistant II Unit Forester job in the Tulare Unit, thinking it's a desk-and-field resource job with no fire training. Based on the duty statement, what must they complete during probation, and what fitness and medical standards apply?", "a": "Firefighter Academy (FFA) and Company Officer Academy (COA), during probation as a condition of employment. They must also maintain the Arduous Fitness Standard, get annual respiratory-protection / SCBA medical clearance, and be willing to get and keep Department Public Officer status. The statement gives no academy length (FA II PO-199, effective 07/01/2026).", "qh": "A forestry graduate takes the Forestry Assistant II Unit Forester job in the Tulare Unit, thinking it's a desk-and-field resource job with no fire training. Based on the duty statement, what must they complete during probation, and what fitness and medical standards apply?", "ah": "Firefighter Academy (FFA) and Company Officer Academy (COA), during probation as a condition of employment. They must also maintain the Arduous Fitness Standard, get annual respiratory-protection / SCBA medical clearance, and be willing to get and keep Department Public Officer status. The statement gives no academy length (FA II PO-199, effective 07/01/2026).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "FFA and COA during probation; Arduous Fitness Standard and annual SCBA medical clearance", "wh": ["FFA only during probation; Arduous Fitness Standard and annual SCBA medical clearance", "FFA and COA within 3 years; Moderate Fitness Standard and a one-time medical exam", "No academy required; Arduous Fitness Standard and annual SCBA medical clearance"], "hash": "sha256:dc77e8a130e669496e0c9a4c0b127667175ffa92a2782089cf63fa1cbdcb046c"}, {"n": 11, "q": "As that Forestry Assistant II, you find a Forest Practice violation during an inspection. Can you write a citation, and on what basis?", "a": "Yes. The duty statement includes Forest Practice inspections and enforcement, including issuing citations as a trained Public Officer (FA II PO-199).", "qh": "As that Forestry Assistant II, you find a Forest Practice violation during an inspection. Can you write a citation, and on what basis?", "ah": "Yes. The duty statement includes Forest Practice inspections and enforcement, including issuing citations as a trained Public Officer (FA II PO-199).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Yes, as a trained Public Officer doing Forest Practice inspections and enforcement", "wh": ["No; only a sworn Fire Captain with peace officer status can write citations", "No; you report it to a Registered Professional Forester, who cites it", "Yes, but only after the Forester II signs the citation as a Public Officer"], "hash": "sha256:7ee08c0922da40e93b89a41fb22b67b6554b930884846ebe5d555f787c0b6f1f"}, {"n": 12, "q": "A unit's Forestry Technicians and Aides are doing defensible space inspections. In the Tulare Unit duty statement, which position coordinates them, and under what program label?", "a": "The Forestry Assistant II, as Unit LE-100 Defensible Space Coordinator, oversees Forestry Technicians and Aides working as Defensible Space Inspectors (FA II PO-199, Tulare Unit).", "qh": "A unit's Forestry Technicians and Aides are doing defensible space inspections. In the Tulare Unit duty statement, which position coordinates them, and under what program label?", "ah": "The Forestry Assistant II, as Unit LE-100 Defensible Space Coordinator, oversees Forestry Technicians and Aides working as Defensible Space Inspectors (FA II PO-199, Tulare Unit).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "The Forestry Assistant II, as Unit LE-100 Defensible Space Coordinator", "wh": ["The Forester II (Pre-Fire Manager), as Unit LE-100 Defensible Space Coordinator", "The Fire Prevention Specialist II, as Unit LE-100 Inspection Supervisor", "The Battalion Chief, as Unit Defensible Space Program Manager"], "hash": "sha256:e39a7ffcef74e283481a8c5610b09686d8808bc966ddc5f454687e48925f5ca6"}, {"n": 13, "q": "A contract helicopter has an accident at 0200. On the published Aviation Officer – Safety duty statement, which role answers, and what does that duty involve?", "a": "The Flight Operations Duty Chief, which the Aviation Officer – Safety serves as when qualified. The duty runs on a 24-hour duty week and covers FRAT notifications and immediate response to aviation accidents and incidents (AO II PO-199, effective 8/6/26).", "qh": "A contract helicopter has an accident at 0200. On the published Aviation Officer – Safety duty statement, which role answers, and what does that duty involve?", "ah": "The Flight Operations Duty Chief, which the Aviation Officer – Safety serves as when qualified. The duty runs on a 24-hour duty week and covers FRAT notifications and immediate response to aviation accidents and incidents (AO II PO-199, effective 8/6/26).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Flight Operations Duty Chief: 24-hour duty week, FRAT notifications, immediate response", "wh": ["Flight Operations Duty Chief: 48-hour duty week, SAFECOM report the next business day", "Aviation Safety Program Manager: 40-hour week, FRAT notifications, next-day response", "Air Attack Officer: 24-hour duty week, FAA notification, immediate response"], "hash": "sha256:db240ab2de3a800a27d4bd28ba23366056999f1b92cb637d1399c9dd1bbc1fcd"}, {"n": 14, "q": "Who is the Industrial Ground Safety Officer for McClellan Field, including the air tanker reload base, per the Aviation Officer – Safety duty statement? Is that position strictly non-flying?", "a": "The Aviation Officer II (Flight Operations), working title Aviation Officer – Safety. No, it isn't strictly non-flying: the statement says the incumbent may fly as a pilot in state-owned, leased, or contracted aircraft as authorized (AO II PO-199).", "qh": "Who is the Industrial Ground Safety Officer for McClellan Field, including the air tanker reload base, per the Aviation Officer – Safety duty statement? Is that position strictly non-flying?", "ah": "The Aviation Officer II (Flight Operations), working title Aviation Officer – Safety. No, it isn't strictly non-flying: the statement says the incumbent may fly as a pilot in state-owned, leased, or contracted aircraft as authorized (AO II PO-199).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Aviation Officer – Safety (AO II, Flight Ops); may fly as a pilot when authorized", "wh": ["Aviation Officer – Safety (AO II, Flight Ops); strictly non-flying by duty statement", "Senior Aviation Officer (1052); strictly non-flying by duty statement", "Aviation Officer II (Maintenance, 6882); may fly as a pilot when authorized"], "hash": "sha256:9d3c481e98a21fc93c85d2d204e1d2c898603fe5e1908553a81c3f62f3c9b911"}, {"n": 15, "q": "Forestry Assistant II pays more than Forestry Assistant I at both ranges. Give the Range A minimums for both, and explain why a duty statement for one Forestry Assistant II position isn't the class specification.", "a": "FA I (1086) Range A starts at $4,747/month and FA II (1093) Range A at $5,448 (pay scale 10/26/2026). A PO-199 duty statement describes one numbered position (542-416-1093-001, Tulare Unit), so its duties and conditions show that position, not every FA II statewide.", "qh": "Forestry Assistant II pays more than Forestry Assistant I at both ranges. Give the Range A minimums for both, and explain why a duty statement for one Forestry Assistant II position isn't the class specification.", "ah": "FA I (1086) Range A starts at $4,747/month and FA II (1093) Range A at $5,448 (pay scale 10/26/2026). A PO-199 duty statement describes one numbered position (542-416-1093-001, Tulare Unit), so its duties and conditions show that position, not every FA II statewide.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "FA I $4,747, FA II $5,448; a PO-199 describes one position, not the whole class", "wh": ["FA I $5,196, FA II $5,448; a PO-199 describes one position, not the whole class", "FA I $4,747, FA II $5,980; a PO-199 describes one position, not the whole class", "FA I $4,747, FA II $5,448; a PO-199 is the statewide class specification"], "hash": "sha256:f367592f09a535fb2698feb29e762df88bfe4c5508302960aa53d96ca34a30fd"}], "sources": [{"label": "CalHR Civil Service Pay Scale (updated 10/26/2026)", "url": "https://www.calhr.ca.gov/wp-content/uploads/sites/361/2026/09/PS_Sec_15.pdf"}, {"label": "CalHR CAL FIRE class-code list (2025)", "url": "https://www.calhr.ca.gov/wp-content/uploads/sites/361/2025/05/rev-5.3.22-CalFIRE-3.4.2020-clean-version.pdf"}, {"label": "Join CAL FIRE, Battalion Chief", "url": "https://www.joincalfire.com/classifications/fire-protection/firefighting-and-paramedics/battalion-chief"}, {"label": "Fire Captain exam bulletin EX-5398", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=5398"}, {"label": "Assistant Chief exam bulletin EX-4883", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4883"}, {"label": "CAL FIRE OV-10 page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program/cal-fire-ov10"}, {"label": "CAL FIRE Fire Protection", "url": "https://www.fire.ca.gov/what-we-do/fire-protection"}, {"label": "CAL FIRE Our Organization", "url": "https://www.fire.ca.gov/about/our-organization"}, {"label": "OSFM About Us", "url": "https://osfm.fire.ca.gov/about-us"}, {"label": "OSFM Accredited Academies (SFT)", "url": "https://osfm.fire.ca.gov/what-we-do/state-fire-training/accredited-academies"}, {"label": "Ranger batches: /workspace/can-report/calfire/calfire-batch-01.md, calfire-batch-02.md", "url": ""}, {"label": "Forestry Assistant II PO-199, Tulare Unit", "url": "https://calcareers.ca.gov/CalHrPublic/FileDownload.aspx?aid=32626253&name=PO-199.pdf"}, {"label": "Aviation Officer II – Safety PO-199", "url": "https://calcareers.ca.gov/CalHrPublic/FileDownload.aspx?aid=33092342&name=APPROVED_542-065-1056-004AOIISafetypo199-Updated.pdf"}, {"label": "Aviation Officer II – Safety posting JC-528951", "url": "https://calcareers.ca.gov/CalHrPublic/Jobs/JobPosting.aspx?JobControlId=528951"}, {"label": "Ranger batch 05: /workspace/can-report/calfire/calfire-batch-05.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 3. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 10.6.9 Aviation Program (Aircraft and Bases), 10.6.10 Engines, Dozers, and Mobile Equipment.", "note_html": "Study aid only. Source: CalHR Civil Service Pay Scale (updated 10/26/2026) and the 2025 CAL FIRE class-code list (Ranger calfire-batch-01), plus official CAL FIRE and OSFM program pages. Most entries are <strong>pay and title facts only<\/strong>. Batch 05 adds two single-position PO-199 duty statements (Forestry Assistant II, Tulare Unit, and Aviation Officer II \"Aviation Officer – Safety\"). These describe one position each, not the whole class. HFEO, Fire Prevention Specialist, and DSFM duty statements still weren't retrieved."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1427.02, "y": 666.75, "angle": 101.0, "vx": 807.31, "vy": 1202.07, "vangle": 251.5}, "10.6.4": {"id": "10.6.4", "name": "Programs and Contract Counties", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.6.8", "10.6.11", "10.6.13"], "doc": {"title": "10.6.4 Programs and Contract Counties", "file": "10.6.4_Programs_and_Contract_Counties.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>CAL FIRE's official \"All Programs\" list has 12 entries: Fire Protection; Natural Resource Management; Office of the State Fire Marshal; Fire and Resource Assessment Program; Board of Forestry and Fire Protection; Communications; Returning Veterans; Enlisting Their Skills for CAL FIRE Service; Equal Employment Opportunity; Professional Standards; Law Enforcement &amp; Civil Cost Recovery; Tribal Workforce Development.<\/p><p><strong>Contract Counties<\/strong> are the six counties (Kern, Los Angeles, Marin, Orange, Santa Barbara, Ventura) that protect the State Responsibility Area (SRA) inside their borders <strong>under contract with CAL FIRE<\/strong>.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Contract Counties<\/strong> protect <strong>3.4 million acres of SRA<\/strong> and provide initial attack there. CAL FIRE funds them for prevention and suppression, including crew salaries, facility maintenance, pre-fire management positions, special repairs, and administrative services.<\/li><li><strong>What the state funds in the six Contract Counties:<\/strong> 84 fire engines, 12 bulldozers, 12 hand crews, 32 fire prevention officers, and 42 positions in the 6 emergency command centers.<\/li><li><strong>CAL FIRE still provides<\/strong> Contract Counties with urban forestry grants, resource management help, fire investigation support, and training.<\/li><li><strong>Contract County codes and HQs (Facilities Public View):<\/strong><ul><li>MRN (MCFD HQ, San Rafael; Northern Region)<\/li><li>KRN (Bakersfield)<\/li><li>LAC (County of Los Angeles Fire Department HQ, Los Angeles)<\/li><li>ORC (Orange County Fire Authority, Irvine)<\/li><li>SBC (Santa Barbara County Fire HQ)<\/li><li>VNC (Ventura County Fire Department HQ, Newbury Park)<\/li><\/ul><\/li><li><strong>Station type codes (Facilities layer):<\/strong> FSA = Fire Station, Schedule A. FSB = Schedule B. FSAB = Schedule A/B. <strong>FSCC = Fire Station, Contract County (\"Greybook\")<\/strong>. FSL = Local. FSO = Other.<\/li><li><strong>Active station rows (17 Nov 2026 query):<\/strong> FSA 214, FSB 206, FSAB 38, FSCC 96, FSL 359, FSO 18. This is a facility inventory, <strong>not<\/strong> the same measure as the Budget's \"operates 237 fire stations.\" Don't substitute one for the other.<\/li><li><strong>Facilities FUNDING codes (layer domain, modified 5 Aug 2026):<\/strong> B = Schedule B. A = Schedule A. L = Local. C = Combined Schedule A/B. G = Greybook (may include county funded resources). F = Federal.<\/li><li><strong>Facilities STAFFING codes:<\/strong> P = Paid. V = Volunteer. C = Combined Paid/Volunteer. N = Not Staffed.<\/li><li><strong>Natural Resource Management:<\/strong> \"We protect and restore California wildlands, 85 million acres of forests, watersheds, and wildlife habitat.\" It manages <strong>fourteen Demonstration State Forests<\/strong>. Subprograms include Forest Practice, Reforestation, Forest Health, Prescribed Fire, Urban and Community Forestry, the Vegetation Management Program (VMP) on SRA, and Wildfire Resilience.<\/li><li><strong>OSFM:<\/strong> fire-prevention engineering, education, and enforcement. <strong>State Fire Training<\/strong> is an OSFM division. CAL FIRE Ione Training Center is an SFT Accredited Local Academy.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Cooperative Fire Protection Program:<\/strong> contracts and agreements let CAL FIRE be \"the lead agency in providing fire, rescue, dispatch, and paramedic services to cities and towns in California that are not designated as state responsibility,\" under unified command.<\/li><li><strong>California Master Mutual Aid Agreement:<\/strong> CAL FIRE helps other departments when local resources are depleted and CAL FIRE resources are available. CAL FIRE can also draw on local government departments for wildland fire suppression.<\/li><li><strong>Cal OES:<\/strong> can request CAL FIRE help with non-fire emergencies when the Governor has declared a State of Emergency.<\/li><li><strong>CFMA:<\/strong> CAL FIRE's largest cooperative program, with the five federal wildland agencies (USFS, BLM, NPS, BIA, FWS), for closest-forces exchange of fire protection.<\/li><li><strong>Schedule A, Schedule B, and Greybook<\/strong> labels tell you how a station is tied to the state. Batch 05 retrieved one public Schedule A sample (below). It's an example, not the text of every Schedule A, and it isn't a Contract County / Greybook agreement.<\/li><\/ul><p><strong>Sample Schedule A agreement (Groveland CSD, batch 05):<\/strong><\/p><ul><li><strong>Form:<\/strong> \"Cooperative Fire Programs Fire Protection Reimbursement Agreement,\" <strong>LG-1 REV. 8/2024<\/strong>.<ul><li>The sample is between CAL FIRE and the Groveland Community Services District (Tuolumne-Calaveras Unit).<\/li><li>Agreement 4CA07281, term <strong>1 Jul 2025 to 30 Jun 2030<\/strong>, maximum <strong>$9,986,132<\/strong>.<\/li><li>It was approved by the District board on 8 Jul 2025, and the District's staff report calls it a \"Schedule A contract.\"<\/li><li>The CAL FIRE signatory line is Matthew Sully, Deputy Director, Cooperative Fire Protection.<\/li><\/ul><\/li><li><strong>Authority:<\/strong> Public Resources Code Sections 4141, 4142, 4143, and 4144, \"as applicable.\" The exhibits are captioned \"This is a Schedule A - 4142 of the Cooperative Agreement.\"<\/li><li><strong>Who pays for what (Exhibit A):<\/strong> \"the STATE is primarily financially responsible for protecting natural resources from vegetation fires and the LOCAL AGENCY is primarily financially responsible for protecting life and property from fires and other emergencies.\"<ul><li>The local agency \"shall have sole authority to establish the fire protection organization and structure needed to meet the determined level of service.\"<\/li><li>The local agency is \"responsible for all STATE costs, both direct and indirect.\"<\/li><\/ul><\/li><li><strong>Services checked:<\/strong> emergency fire protection, medical and rescue response, and related administrative support.<\/li><li><strong>Payment:<\/strong> actual cost, not to exceed the <strong>Exhibit D, Schedule A<\/strong> amount for each fiscal year. The STATE prepares a new Exhibit D, Schedule A every year. Invoices are generally quarterly, with a fiscal-year-end reconciliation.<\/li><li><strong>Changes:<\/strong> reducing STATE civil-service employees assigned in Exhibit D, Schedule A takes <strong>120 days' written notice<\/strong>, except as otherwise stated.<\/li><li>Exhibits: A Scope of Work; B Budget Detail and Payment Provisions; C General Terms and Conditions; D Additional Provisions; E Description of Other Services.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li>Ranger batch 01 recorded an older history line on the Our Organization page: \"The State Forest system now includes eight units totaling over 71,000 acres.\" That wording has since been superseded. As fetched on 17 Nov 2026, the page says CAL FIRE manages 14 Demonstration State Forests, matching the Natural Resource Management page.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "A grass fire starts on SRA land in Ventura County. Who provides initial attack, and why isn't it a CAL FIRE unit engine by default?", "a": "Ventura County Fire. In Kern, Los Angeles, Marin, Orange, Santa Barbara, and Ventura, the county protects the SRA under contract with CAL FIRE and provides initial attack (Cooperative Efforts page).", "qh": "A grass fire starts on SRA land in Ventura County. Who provides initial attack, and why isn't it a CAL FIRE unit engine by default?", "ah": "Ventura County Fire. In Kern, Los Angeles, Marin, Orange, Santa Barbara, and Ventura, the county protects the SRA under contract with CAL FIRE and provides initial attack (Cooperative Efforts page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Ventura County Fire, which protects the SRA there under contract with CAL FIRE", "wh": ["The nearest CAL FIRE unit engine, since all SRA initial attack is CAL FIRE's", "Ventura County Fire, but only after a CAL FIRE Battalion Chief requests it", "The U.S. Forest Service, under the CFMA closest-forces agreement"], "hash": "sha256:55f66fc992602d64d694bf655b05c98fb0ad720f18b8ec3be15349ef2c76f7a6"}, {"n": 2, "q": "List what the state funds in the six Contract Counties. What does CAL FIRE still provide them beyond money?", "a": "84 fire engines, 12 bulldozers, 12 hand crews, 32 fire prevention officers, and 42 positions in the 6 emergency command centers. CAL FIRE also provides urban forestry grants, resource management help, fire investigation support, and training (Cooperative Efforts page).", "qh": "List what the state funds in the six Contract Counties. What does CAL FIRE still provide them beyond money?", "ah": "84 fire engines, 12 bulldozers, 12 hand crews, 32 fire prevention officers, and 42 positions in the 6 emergency command centers. CAL FIRE also provides urban forestry grants, resource management help, fire investigation support, and training (Cooperative Efforts page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "84 engines, 12 dozers, 12 crews, 32 prevention officers, 42 ECC positions; plus grants, investigation, training", "wh": ["84 engines, 12 dozers, 12 crews, 32 prevention officers, 42 ECC positions; plus aircraft and pilots", "48 engines, 12 dozers, 12 crews, 32 prevention officers, 42 ECC positions; plus grants, investigation, training", "84 engines, 21 dozers, 12 crews, 23 prevention officers, 42 ECC positions; plus grants, investigation, training"], "hash": "sha256:858f33b86dda49fd31baf2504def303735d9efb0c12fa6a523193c92c2fbe5cd"}, {"n": 3, "q": "How does a Contract County arrangement differ from CAL FIRE's Cooperative Fire Protection Program for cities?", "a": "In a Contract County, the county protects the state's SRA lands with state funding. Under Cooperative Fire Protection, CAL FIRE serves cities and towns that are not SRA, acting as the lead agency for fire, rescue, dispatch, and paramedic services under contract (Cooperative Efforts page).", "qh": "How does a Contract County arrangement differ from CAL FIRE's Cooperative Fire Protection Program for cities?", "ah": "In a Contract County, the county protects the state's SRA lands with state funding. Under Cooperative Fire Protection, CAL FIRE serves cities and towns that are not SRA, acting as the lead agency for fire, rescue, dispatch, and paramedic services under contract (Cooperative Efforts page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Contract County: county protects state SRA with state money; Co-op: CAL FIRE serves non-SRA cities", "wh": ["Contract County: CAL FIRE protects county land with county money; Co-op: cities protect SRA", "Contract County: county protects state SRA with state money; Co-op: cities serve CAL FIRE units", "They are the same program; Co-op is the newer name for Contract County agreements"], "hash": "sha256:7d5d0dc86662d62a0c3e20ff33c5a7585d12d62757017caf0f3601de0dc8dfa3"}, {"n": 4, "q": "A wildfire in a city outside the SRA has drained the local department. Under which agreement can CAL FIRE help, and does it work the other way too?", "a": "The California Master Mutual Aid Agreement. CAL FIRE assists when local resources are depleted and its own resources are available. CAL FIRE can also access local government departments for wildland fire suppression (Cooperative Efforts page).", "qh": "A wildfire in a city outside the SRA has drained the local department. Under which agreement can CAL FIRE help, and does it work the other way too?", "ah": "The California Master Mutual Aid Agreement. CAL FIRE assists when local resources are depleted and its own resources are available. CAL FIRE can also access local government departments for wildland fire suppression (Cooperative Efforts page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "California Master Mutual Aid Agreement; yes, CAL FIRE can also call on local departments", "wh": ["California Master Mutual Aid Agreement; no, it only lets CAL FIRE help local departments", "CFMA closest-forces agreement; yes, CAL FIRE can also call on local departments", "Cooperative Fire Protection contract; no, it only lets CAL FIRE help local departments"], "hash": "sha256:103e45cd1e8b853637fe7a7095d573ac75ec215897cbf81eb00c9a6c118a0cec"}, {"n": 5, "q": "A major flood hits, with no fire. When can Cal OES request CAL FIRE resources?", "a": "When the Governor has declared a State of Emergency (Cooperative Efforts page).", "qh": "A major flood hits, with no fire. When can Cal OES request CAL FIRE resources?", "ah": "When the Governor has declared a State of Emergency (Cooperative Efforts page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "When the Governor has declared a State of Emergency", "wh": ["When a county has declared a local emergency", "When CAL FIRE's Director approves a non-fire mission", "When the President has declared a federal disaster"], "hash": "sha256:7c20d7747372944ab6c99d75d3db3479b35fa3ecc28a3568924f79ed7354f567"}, {"n": 6, "q": "A fire starts on national forest land right next to SRA. Which agreement lets the closest engines respond, and which agencies are in it?", "a": "The CFMA, a closest-forces exchange with the five federal wildland agencies: USFS, BLM, NPS, BIA, and FWS. It's CAL FIRE's largest cooperative program (Cooperative Efforts page).", "qh": "A fire starts on national forest land right next to SRA. Which agreement lets the closest engines respond, and which agencies are in it?", "ah": "The CFMA, a closest-forces exchange with the five federal wildland agencies: USFS, BLM, NPS, BIA, and FWS. It's CAL FIRE's largest cooperative program (Cooperative Efforts page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "The CFMA, with USFS, BLM, NPS, BIA, and FWS", "wh": ["The CFMA, with USFS, BLM, NPS, FEMA, and FWS", "The Master Mutual Aid Agreement, with USFS, BLM, NPS, BIA, and FWS", "The CFAA, with USFS, BLM, NPS, BIA, and FWS"], "hash": "sha256:d0bbce8d7b56cc363575e1e53e37ce423dd2b8653bcf95347e33c9b070bc3348"}, {"n": 7, "q": "A station shows TYPE=FSCC in the facilities inventory. What does that mean, and which counties would you expect it in?", "a": "A Fire Station, Contract County (\"Greybook\") record. Expect it in the Contract Counties, such as Kern, Los Angeles, Marin, Orange, Santa Barbara, and Ventura. Local stations there may show up as FSL instead (Facilities Public View domain, batch 03).", "qh": "A station shows TYPE=FSCC in the facilities inventory. What does that mean, and which counties would you expect it in?", "ah": "A Fire Station, Contract County (\"Greybook\") record. Expect it in the Contract Counties, such as Kern, Los Angeles, Marin, Orange, Santa Barbara, and Ventura. Local stations there may show up as FSL instead (Facilities Public View domain, batch 03).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Fire Station, Contract County (Greybook); in Kern, LA, Marin, Orange, Santa Barbara, Ventura", "wh": ["Fire Station, Combined Schedule A/B; in Kern, LA, Marin, Orange, Santa Barbara, Ventura", "Fire Station, Conservation Camp; in Kern, LA, Marin, Orange, Santa Barbara, Ventura", "Fire Station, Contract County (Greybook); in all 21 CAL FIRE field units"], "hash": "sha256:ae3b7b82d5b6da9acf3d589dd5df141d804e056e507499acb28e431b24ac4b0a"}, {"n": 8, "q": "A classmate adds up the FSA, FSB, and FSAB counts and says, \"So the Budget's 237 stations is wrong.\" What's the flaw?", "a": "They're different measures. The Facilities Public View counts facility records by type code, while the Budget counts the stations CAL FIRE \"operates.\" No official crosswalk links the two, and batch 02 says not to use one in place of the other. Adding type codes doesn't test the Budget figure.", "qh": "A classmate adds up the FSA, FSB, and FSAB counts and says, \"So the Budget's 237 stations is wrong.\" What's the flaw?", "ah": "They're different measures. The Facilities Public View counts facility records by type code, while the Budget counts the stations CAL FIRE \"operates.\" No official crosswalk links the two, and batch 02 says not to use one in place of the other. Adding type codes doesn't test the Budget figure.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Different measures: inventory rows by type code vs stations CAL FIRE operates; no crosswalk", "wh": ["Nothing; the inventory is newer, so it replaces the Budget's station figure", "He left out FSCC and FSL rows; add those and the totals will line up", "He double-counted FSAB rows; subtract them and the totals will line up"], "hash": "sha256:b8ce6ff7742fb2119c6e963c5975cdfbe685db70054b3529bceaeaaa22f6a6b2"}, {"n": 9, "q": "How many Demonstration State Forests does CAL FIRE manage today, and which page is the current authority?", "a": "Fourteen, per the Natural Resource Management page; as of 17 Nov 2026 the Our Organization page also says 14. An older, superseded \"eight units\" line recorded in Ranger batch 01 is background only (see History) and shouldn't be blended in.", "qh": "How many Demonstration State Forests does CAL FIRE manage today, and which page is the current authority?", "ah": "Fourteen, per the Natural Resource Management page; as of 17 Nov 2026 the Our Organization page also says 14. An older, superseded \"eight units\" line recorded in Ranger batch 01 is background only (see History) and shouldn't be blended in.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Fourteen, per the Natural Resource Management page", "wh": ["Twelve, per the Natural Resource Management page", "Ten, per the Board of Forestry and Fire Protection page", "Sixteen, per the 2026-27 Governor's Budget"], "hash": "sha256:3cb4d2419dd1f7f8f6a25267e8dc049caf790196e81c4cb63653c30ebce8b70b"}, {"n": 10, "q": "Name OSFM's four program elements and the OSFM division that runs statewide fire-service training.", "a": "Engineering, education, enforcement, and support from the State Board of Fire Services. The division is State Fire Training (SFT) (OSFM About and Accredited Academies pages).", "qh": "Name OSFM's four program elements and the OSFM division that runs statewide fire-service training.", "ah": "Engineering, education, enforcement, and support from the State Board of Fire Services. The division is State Fire Training (SFT) (OSFM About and Accredited Academies pages).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Engineering, education, enforcement, Board of Fire Services support; State Fire Training", "wh": ["Engineering, education, enforcement, Board of Fire Services support; the CAL FIRE Academy", "Engineering, education, investigation, Board of Forestry support; State Fire Training", "Planning, education, enforcement, Board of Fire Services support; State Fire Training"], "hash": "sha256:e93729ebda77a8675d72ad820c831d9c4d9f0ce339637bddef2f3d65204084d7"}, {"n": 11, "q": "A community services district contracts with CAL FIRE under a Schedule A (LG-1) agreement. A structure fire and a vegetation fire break out the same week. Per the sample agreement, who is primarily financially responsible for each?", "a": "The STATE is primarily financially responsible for protecting natural resources from vegetation fires. The local agency is primarily financially responsible for protecting life and property from fires and other emergencies (LG-1 sample, Exhibit A, Groveland CSD packet).", "qh": "A community services district contracts with CAL FIRE under a Schedule A (LG-1) agreement. A structure fire and a vegetation fire break out the same week. Per the sample agreement, who is primarily financially responsible for each?", "ah": "The STATE is primarily financially responsible for protecting natural resources from vegetation fires. The local agency is primarily financially responsible for protecting life and property from fires and other emergencies (LG-1 sample, Exhibit A, Groveland CSD packet).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Vegetation fire: the STATE (natural resources); structure fire: the local agency (life, property)", "wh": ["Vegetation fire: the local agency; structure fire: the STATE", "Both fires: the STATE, because it staffs the stations under Schedule A", "Both fires: the local agency, because it pays all STATE costs"], "hash": "sha256:0a039f2c89c5e122cf71f23a6ad88691aec69a422824666f55d075556553d918"}, {"n": 12, "q": "Under that Schedule A sample, the district board wants to add a medic position and change station staffing. Who has authority to set the fire protection organization, and who pays CAL FIRE's costs?", "a": "The local agency has sole authority to establish the fire protection organization and structure needed for its chosen level of service. It's also responsible for all STATE costs, direct and indirect, of carrying out the agreement (LG-1 sample).", "qh": "Under that Schedule A sample, the district board wants to add a medic position and change station staffing. Who has authority to set the fire protection organization, and who pays CAL FIRE's costs?", "ah": "The local agency has sole authority to establish the fire protection organization and structure needed for its chosen level of service. It's also responsible for all STATE costs, direct and indirect, of carrying out the agreement (LG-1 sample).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "The local agency sets the organization and pays all STATE costs, direct and indirect", "wh": ["CAL FIRE sets the organization; the local agency pays only direct STATE costs", "The local agency sets the organization; CAL FIRE pays its own indirect costs", "CAL FIRE sets the organization and pays all costs, billing the district yearly"], "hash": "sha256:2b2cf02b8ca65d327397ffe452e722e16e5229a26410fe1f4b51447e27e3fdaa"}, {"n": 13, "q": "Budget season: the district wants to cut two STATE civil-service positions from its Exhibit D, Schedule A. How much notice does the sample agreement require, and what sets the annual payment cap?", "a": "120 days' written notice, except as otherwise stated. Payment is actual cost, not to exceed the Exhibit D, Schedule A amount for each fiscal year, which the STATE prepares annually (LG-1 sample).", "qh": "Budget season: the district wants to cut two STATE civil-service positions from its Exhibit D, Schedule A. How much notice does the sample agreement require, and what sets the annual payment cap?", "ah": "120 days' written notice, except as otherwise stated. Payment is actual cost, not to exceed the Exhibit D, Schedule A amount for each fiscal year, which the STATE prepares annually (LG-1 sample).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "120 days' written notice; cap is the Exhibit D, Schedule A amount each fiscal year", "wh": ["90 days' written notice; cap is the Exhibit D, Schedule A amount each fiscal year", "120 days' written notice; cap is the $9,986,132 split evenly over five years", "30 days' written notice; cap is the Exhibit B budget set once for the full term"], "hash": "sha256:5948c505761bb6fb913dcf667e21935e4a83eaf8d29d7fa7ce0c67f041ebdf04"}, {"n": 14, "q": "A facilities record shows TYPE=FSA, FUNDING=A, STAFFING=P. Another shows TYPE=FSCC, FUNDING=G. Decode both, and explain why the Groveland LG-1 agreement doesn't describe the second one.", "a": "The first is a Fire Station, Schedule A, funded by Schedule A, with paid staffing. The second is a Contract County (Greybook) station funded by Greybook, which may include county-funded resources. The Groveland document is a PRC 4142 local-government reimbursement (Schedule A) agreement, not a Contract County / Greybook agreement (Facilities layer domains; batch 05 note).", "qh": "A facilities record shows TYPE=FSA, FUNDING=A, STAFFING=P. Another shows TYPE=FSCC, FUNDING=G. Decode both, and explain why the Groveland LG-1 agreement doesn't describe the second one.", "ah": "The first is a Fire Station, Schedule A, funded by Schedule A, with paid staffing. The second is a Contract County (Greybook) station funded by Greybook, which may include county-funded resources. The Groveland document is a PRC 4142 local-government reimbursement (Schedule A) agreement, not a Contract County / Greybook agreement (Facilities layer domains; batch 05 note).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Schedule A station, Schedule A funded, paid; Greybook station; LG-1 is PRC 4142, not Greybook", "wh": ["Schedule A station, Schedule A funded, paid; Greybook station; LG-1 is the Greybook contract", "Schedule B station, Schedule B funded, paid; Greybook station; LG-1 is PRC 4142, not Greybook", "Schedule A station, Schedule A funded, volunteer; Greybook station; LG-1 is PRC 4142, not Greybook"], "hash": "sha256:29620a03677cdf9982763ce53299350eb1f0af9c121de68ad98f4f9c508214f8"}], "sources": [{"label": "CAL FIRE What We Do (All Programs)", "url": "https://www.fire.ca.gov/what-we-do"}, {"label": "CAL FIRE Cooperative Efforts (Contract Counties, mutual aid, CFMA)", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/cooperative-efforts/"}, {"label": "CAL FIRE Natural Resource Management", "url": "https://www.fire.ca.gov/what-we-do/natural-resource-management"}, {"label": "CAL FIRE Our Organization", "url": "https://www.fire.ca.gov/about/our-organization"}, {"label": "OSFM About Us", "url": "https://osfm.fire.ca.gov/about-us"}, {"label": "OSFM Accredited Academies", "url": "https://osfm.fire.ca.gov/what-we-do/state-fire-training/accredited-academies"}, {"label": "CAL FIRE Facilities for Wildland Fire Protection, Public View", "url": "https://services1.arcgis.com/jUJYIo9tSA7EHvfZ/arcgis/rest/services/CAL_FIRE_Facilities_for_Wildland_Fire_Protection_-_Public_View/FeatureServer"}, {"label": "Facilities layer definition (TYPE and FUNDING domains, incl. Schedule A/B/Greybook)", "url": "https://services1.arcgis.com/jUJYIo9tSA7EHvfZ/arcgis/rest/services/CAL_FIRE_Facilities_for_Wildland_Fire_Protection_-_Public_View/FeatureServer/0"}, {"label": "2026-27 Governor's Budget Summary, Natural Resources (237 stations)", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}, {"label": "Ranger batches: /workspace/can-report/calfire/calfire-batch-01.md, calfire-batch-02.md, calfire-batch-03.md", "url": ""}, {"label": "Groveland CSD Cooperative Fire Protection Agreement (LG-1 Schedule A sample, board packet 8 Jul 2025)", "url": "https://www.gcsd.org/files/713aeefa6/Item+6B+Cooperative+Fire+Protection+Agreement.pdf"}, {"label": "Ranger batch 05: /workspace/can-report/calfire/calfire-batch-05.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 4. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 10.6.8 Wildland and All-Risk Response, 10.6.11 Hand Crews, Conservation Camps, and Fire Centers, 10.6.13 Fire Hazard Severity Zones, Defensible Space, and Ready for Wildfire.", "note_html": "Study aid only. Source: CAL FIRE What We Do, Cooperative Efforts, and Natural Resource Management pages, the OSFM About page, and the Facilities Public View inventory (Ranger calfire-batch-01, -02, -03). Retrieved 17 Nov 2026."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1402.96, "y": 657.03, "angle": 123.0, "vx": 789.58, "vy": 1214.02, "vangle": 220.5}, "10.6.5": {"id": "10.6.5", "name": "CalCareers and Firefighter I Hiring", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.6.12"], "doc": {"title": "10.6.5 CalCareers and Firefighter I Hiring", "file": "10.6.5_CalCareers_and_Firefighter_I_Hiring.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>State jobs are posted on <strong>CalCareers<\/strong> (jobs.ca.gov redirects there). You apply through a <strong>CalCareer Account<\/strong> with the <strong>STD 678<\/strong> Examination/Employment Application. <strong>Fire Fighter I is a non-testing class.<\/strong> Anyone who meets the minimum qualifications may apply and selects \"I have eligibility.\"<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Minimum qualifications (Join CAL FIRE):<\/strong> a valid Class A, B, or C driver's license (with any applicable endorsements), and age <strong>18 at appointment<\/strong>. The formal 1083 class spec wasn't retrieved live.<\/li><li><strong>JC-533177 posting:<\/strong> Non-Tenured, Full Time; statewide; multiple positions.<\/li><li><strong>Pay:<\/strong> $4,590 to $5,803 per month (see 10.6.2).<\/li><li><strong>Application window:<\/strong> final filing date 11/30/2026. Join CAL FIRE says the period is November 1 to 30, \"and there may be additional cutoffs.\"<\/li><li><strong>Hiring pool:<\/strong> used to fill vacancies <strong>through 31 Oct 2027<\/strong>. Offers are expected starting the <strong>week of 4 Jan 2027<\/strong>. Candidates may be selected by resume review.<\/li><li><strong>Medical:<\/strong> \"The position(s) require(s) Medical Clearance prior to being hired.\" Applicants \"must pass medical clearances under the Respiratory Protection Program.\"<\/li><li><strong>Required package documents (19 items, in posting order):<\/strong><ol><li>STD 678<\/li><li>Resume<\/li><li>PO-299 release form<\/li><li>Work Location Form<\/li><li>SFT Fire Fighter 1 certificate<\/li><li>CAL FIRE 1A or NFPA 1001 (Structural)<\/li><li>Confined Space Awareness or higher<\/li><li>CAL FIRE 1B or NFPA 1072/472/470 (HazMat)<\/li><li>CAL FIRE 1C or NFPA 1051/1140 (Wildland)<\/li><li>FEMA IS-100<\/li><li>FEMA IS-200<\/li><li>FEMA IS-700<\/li><li>FEMA IS-800<\/li><li>CPR<\/li><li>Public Safety First Aid (PSFA)<\/li><li>EMT<\/li><li>Paramedic<\/li><li>DD-214 or NGB-22<\/li><li>Driver's license, front and back<\/li><\/ol><\/li><li><strong>Required trainings (Applicant Information Sheet):<\/strong><ul><li><strong>Non-hand-crew jobs<\/strong> (engines, helitack, etc.): EMS <strong>and<\/strong> FEMA <strong>and<\/strong> one of: Option 1, an SFT FFI Certificate (any version); or Option 2, CAL FIRE 1A/B/C.<\/li><li><strong>Hand-crew jobs:<\/strong> EMS <strong>and<\/strong> Confined Space Awareness <strong>and<\/strong> FEMA <strong>and<\/strong> CAL FIRE 1B <strong>and<\/strong> 1C.<\/li><li><strong>EMS<\/strong> means CPR/AED <strong>and<\/strong> PSFA, <strong>or<\/strong> EMT, <strong>or<\/strong> Paramedic.<\/li><li><strong>FEMA<\/strong> means IS-100, 200, 700, and 800.<\/li><\/ul><\/li><li><strong>Categories:<\/strong><ul><li><strong>0:<\/strong> returnee rights to a CAL FIRE unit (Join CAL FIRE).<\/li><li><strong>1:<\/strong> \"fully trained,\" with documents for ALL required trainings.<\/li><li><strong>2:<\/strong> \"partially trained,\" with at least one.<\/li><li><strong>3:<\/strong> no acceptable documentation for any.<\/li><\/ul><\/li><\/ul><p><strong>Acceptable Documents rules:<\/strong><\/p><ul><li>CPR, PSFA, EMT, and Paramedic cards must be <strong>current as of the final filing date<\/strong>.<\/li><li><strong>EMT and Paramedic cards<\/strong> must be California EMSA (state level). \"National Registry or local county cards will not qualify.\"<\/li><li><strong>CPR:<\/strong> a healthcare-provider-level CPR and AED card equivalent to AHA is OK. <strong>Heartsaver<\/strong>, OSHA CPR, train-the-trainer, refresher, and continuing-education certificates don't qualify.<\/li><li><strong>FEMA:<\/strong> an older course version counts as long as the certificate shows the course number.<\/li><li><strong>Out-of-state certificates:<\/strong> IFSAC or Pro Board FF1 from bodies such as DoD or Texas A&amp;M \"will not be accepted\" as a California FF1. Use the <strong>SFT Reciprocity Application<\/strong> instead.<\/li><li><strong>IFSAC/Pro Board for FFI:<\/strong> a California FF1 doesn't need IFSAC or Pro Board accreditation for the <strong>FFI<\/strong> class. It <strong>does<\/strong> for FFII and FAE.<\/li><li><strong>Equivalents:<\/strong> the file lists an <strong>SFT Fire Fighter I (2013, 2019, or 2024)<\/strong> as qualifying for 1B HazMat, 1C Wildland, and Confined Space Rescue Awareness.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li>Build <strong>one<\/strong> package per classification (\"DO NOT INCLUDE MULTIPLE CLASSIFICATIONS ON ONE APPLICATION PACKAGE\"). Submit through CalCareers, or mail or drop it off (8 AM to 5 PM) at CAL FIRE Southern Region Hiring, 1234 East Shaw Avenue, Fresno, CA 93710. <strong>No fax or email.<\/strong><\/li><li>Include only the listed certificates. Put any others on your resume.<\/li><li><strong>Work Location Form (2027 FFI form):<\/strong> rank only the locations where you're willing to accept employment, and use each number only once. \"You will not be considered for a job in any location(s) you have not ranked by number.\" You \"may submit an updated Work Location Form ONE TIME,\" with changes taking effect based on the cutoff dates in the FFI Vacancy Advertisement.<\/li><li>Missing documents? You're \"still encouraged to apply.\" Email new certificates later to <strong>FFHiring@fire.ca.gov<\/strong>. The hiring hotline is (951) 901-5051.<\/li><li><strong>NFPA numbers:<\/strong> the hiring form lists 1001, 1072/472/470, and 1051/1140 as <strong>document alternatives<\/strong>. That's a separate list from OSFM's current FF1 CTS basis (see 10.6.7 and 10.2). Don't merge them.<\/li><\/ol>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Medical clearance under the <strong>Respiratory Protection Program<\/strong> is a condition of hire (JC-533177).<\/li><li>The job is heavy physical work. The posting and Join CAL FIRE call for visual acuity, color vision, and hearing sufficient for the duties; physical strength, dexterity, and agility; good judgment in hazardous emergencies; and willingness to stay on duty 24 hours a day as required.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li><strong>Archived CalHR FFI spec (1083)<\/strong> comes from Wayback snapshots dated 9 Jul 2025 and 24 Mar 2013 (footer \"Updated 6/3/2012\"). It lists only \"Minimum Age: 18 years at the time of appointment\" as an MQ, with a California driver license as an \"Additional Desirable Qualification.\" Current Join CAL FIRE MQs list the license as an MQ. Report both, and don't treat the archived text as current.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "An applicant for an engine job has an SFT FFI certificate, CPR/AED plus PSFA, and IS-100, 200, 700, and 800. What category, and why?", "a": "Category 1, fully trained. Non-hand-crew jobs need EMS (CPR/AED plus PSFA meets it), FEMA (all four), and one option (an SFT FFI certificate, any version, is Option 1). Source: Applicant Information Sheet.", "qh": "An applicant for an <strong>engine<\/strong> job has an SFT FFI certificate, CPR/AED plus PSFA, and IS-100, 200, 700, and 800. What category, and why?", "ah": "Category 1, fully trained. Non-hand-crew jobs need EMS (CPR/AED plus PSFA meets it), FEMA (all four), and one option (an SFT FFI certificate, any version, is Option 1). Source: Applicant Information Sheet.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Category 1: EMS, all four FEMA courses, and an SFT FFI certificate (Option 1)", "wh": ["Category 2: engine jobs also need Confined Space Awareness, which is missing", "Category 1, but only once a current CPAT card is attached", "Category 3: an SFT FFI certificate doesn't count toward the options"], "hash": "sha256:c30592db0a2c591c5cb125b0333dfc7954018a227f313002ae4201f277d8b917"}, {"n": 2, "q": "The same person applies for a hand crew instead. Using the Acceptable Documents file, do they still have everything, and which items does the SFT FFI cover?", "a": "Yes, if their certificate is a listed version. Hand crew needs EMS, Confined Space Awareness, FEMA, and CAL FIRE 1B and 1C. The Acceptable Documents file lists an SFT Fire Fighter I (2013, 2019, or 2024) as qualifying for 1B HazMat, 1C Wildland, and California Confined Space Rescue Awareness. An older or different version would need its own check against the file.", "qh": "The same person applies for a <strong>hand crew<\/strong> instead. Using the Acceptable Documents file, do they still have everything, and which items does the SFT FFI cover?", "ah": "Yes, if their certificate is a listed version. Hand crew needs EMS, Confined Space Awareness, FEMA, and CAL FIRE 1B and 1C. The Acceptable Documents file lists an SFT Fire Fighter I (2013, 2019, or 2024) as qualifying for 1B HazMat, 1C Wildland, and California Confined Space Rescue Awareness. An older or different version would need its own check against the file.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Yes, if the SFT FFI is 2013, 2019, or 2024: it covers 1B, 1C, and Confined Space Awareness", "wh": ["Partly: the SFT FFI covers 1B and 1C, but Confined Space Awareness is still needed", "No: hand crews need separate CAL FIRE 1B and 1C courses, whatever the FFI version", "Yes, if the SFT FFI is 2019 or 2024 only: it covers 1B, 1C, and Confined Space Awareness"], "hash": "sha256:64083ed6c78a8220807cf3437ff1a79f576318b7cbb749e7c4f8953925c591f2"}, {"n": 3, "q": "An applicant attaches a National Registry EMT card. Does it count for the EMT item?", "a": "No. EMT and Paramedic cards must be issued by the California EMS Authority (state level). \"National Registry or local county cards will not qualify\" (Acceptable Documents).", "qh": "An applicant attaches a National Registry EMT card. Does it count for the EMT item?", "ah": "No. EMT and Paramedic cards must be issued by the California EMS Authority (state level). \"National Registry or local county cards will not qualify\" (Acceptable Documents).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No: EMT cards must come from the California EMS Authority", "wh": ["Yes: National Registry cards are accepted in place of a state card", "No: EMT cards must come from the local county EMS agency", "Yes, if a California LEMSA has also stamped the card"], "hash": "sha256:cf0d038bdfd675b8789cba43098199e971c2e0516d66b61f57e678dd8321f62e"}, {"n": 4, "q": "Which of these CPR cards count: an AHA Heartsaver card, or a healthcare-provider-level CPR/AED card approved by a LEMSA? What date must the card be valid on?", "a": "Only the healthcare-provider-level CPR/AED card (AHA-equivalent, LEMSA-approved). Heartsaver doesn't qualify. The card must be current and valid as of the job ad's final filing date (Acceptable Documents).", "qh": "Which of these CPR cards count: an AHA Heartsaver card, or a healthcare-provider-level CPR/AED card approved by a LEMSA? What date must the card be valid on?", "ah": "Only the healthcare-provider-level CPR/AED card (AHA-equivalent, LEMSA-approved). Heartsaver doesn't qualify. The card must be current and valid as of the job ad's final filing date (Acceptable Documents).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Only the LEMSA-approved healthcare-provider CPR/AED; valid on the final filing date", "wh": ["Both cards count; each must be valid on the date the package is mailed", "Only the AHA Heartsaver card; valid on the final filing date", "Only the LEMSA-approved healthcare-provider CPR/AED; valid on the first day of work"], "hash": "sha256:81bccf33f49ba6aa03e564c07fdab4a70fd000cf89cfcaec5f1e17bb74977351"}, {"n": 5, "q": "An applicant's FEMA certificate says IS-100.b, but the current course is IS-100.c. Do they need to retake it?", "a": "No. A previous version counts as long as the certificate shows the course number (Acceptable Documents FEMA note).", "qh": "An applicant's FEMA certificate says IS-100.b, but the current course is IS-100.c. Do they need to retake it?", "ah": "No. A previous version counts as long as the certificate shows the course number (Acceptable Documents FEMA note).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No: an earlier version counts if the certificate shows the course number", "wh": ["Yes: only the current .c version of IS-100 is accepted", "No, but only if it was completed within the last three years", "Yes: earlier versions count only for IS-700 and IS-800"], "hash": "sha256:312f732df6eecc8e274f6df4cd45e4fc20b8fd0ce5b647fc624c1c0ff23a58cb"}, {"n": 6, "q": "A friend with a Texas A&M IFSAC FF1 says it should count as a \"California Fire Fighter I Certification.\" Does it? What should they do, and does FFI even need an IFSAC/Pro Board seal?", "a": "No. IFSAC or Pro Board FF1 from bodies like DoD or Texas A&M \"will not be accepted.\" They can use the CA SFT Fire Fighter 1 Reciprocity Application to get a California FF1. A California FF1 doesn't need IFSAC/Pro Board accreditation for the FFI class (it does for FFII and FAE).", "qh": "A friend with a Texas A&amp;M IFSAC FF1 says it should count as a \"California Fire Fighter I Certification.\" Does it? What should they do, and does FFI even need an IFSAC/Pro Board seal?", "ah": "No. IFSAC or Pro Board FF1 from bodies like DoD or Texas A&amp;M \"will not be accepted.\" They can use the CA SFT Fire Fighter 1 Reciprocity Application to get a California FF1. A California FF1 doesn't need IFSAC/Pro Board accreditation for the FFI class (it does for FFII and FAE).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No: use the CA SFT FF1 Reciprocity Application; FFI doesn't need an IFSAC/Pro Board seal", "wh": ["Yes: any IFSAC FF1 counts as a California Fire Fighter I Certification", "No: retake a full California FF1 academy; FFI requires an IFSAC/Pro Board seal", "No: use the CA SFT FF1 Reciprocity Application; FFI requires an IFSAC/Pro Board seal"], "hash": "sha256:4c6ab2b2c63654c8a116e84c3e2abe045a99304eb63b80130c34d65a0125c2c5"}, {"n": 7, "q": "An applicant has none of the required certificates yet. Should they wait a season? What happens to their placement, and how do
