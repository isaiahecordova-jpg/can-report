 "url": "https://www.holmatro.com/app/uploads/2026/04/F0025241_0002-1.pdf"}, {"label": "Holmatro HCT 511 Series combi tool user manual", "url": "https://www.holmatro.com/app/uploads/2026/09/G0020541_0001.pdf"}, {"label": "Holmatro Spider Series pump owner's manual", "url": "https://www.holmatro.com/app/uploads/2026/07/F0019415_0001.pdf"}, {"label": "Holmatro Rescue (manuals on product pages)", "url": "https://www.holmatro.com/rescue/"}, {"label": "Library copy: Drive > Firefighter_Reference_Library > 02_Hydraulic_Rescue_Tools", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 05 Technical Rescue &amp; Extrication &gt; 05.2 Hydraulic Extrication Tools (Level-3 overview). <strong>Unlocks after:<\/strong> 05.1 Vehicle Stabilization and Scene Safety (planned), 01.0 Fundamentals. <strong>Unlocks:<\/strong> 05.2.1 Spreaders, 05.2.2 Cutters, 05.2.3 Combi Tools, then 05.3 Rams and Shoring. <strong>Cross-links:<\/strong> 03.2 Forcible Entry (Holmatro T1).", "note_html": "Study aid only. Use your tool's own manual and your department extrication SOPs."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 669.01, "y": -122.47, "angle": 43.5, "vx": -192.31, "vy": 602.07, "vangle": 288.5}, "05.2.1": {"id": "05.2.1", "name": "Holmatro Pentheon Spreaders", "path": "05", "kind": "tool", "parent": "05.2", "prereqRaw": "parent 05.2", "children": [], "prereqs": ["05.2"], "unlocks": [], "cross": [], "doc": {"title": "05.2.1 Holmatro Pentheon Spreaders (PSP Series)", "file": "05.2.1_Holmatro_Pentheon_Spreaders.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>Battery-powered hydraulic spreaders. The arms open to push apart (door popping, creating purchase points), close to squeeze (crushing to make pivot points), and pull with a chain set.<\/p>"}, {"key": "specs", "title": "Key specs (battery not included in weights marked \"excl.\")", "html": "<p>| Model | Spread distance | Max spread force | NFPA 1960 HSF / LSF | Weight ready (with battery) | |---|---|---|---|---| | PSP40CL | 20.1 in | 29,450 lbf | 11,915 / 8,768 lbf | 33.7 lb | | PSP40 | 28.5 in | 62,947 lbf | 15,557 / 8,790 lbf | 43 lb | | PSP50 | 28.5 in | 82,280 lbf | 20,907 / 11,240 lbf | 46.3 lb | | PSP60 | 32.3 in | 117,350 lbf | 25,179 / 13,489 lbf | 54.9 lb |<\/p><ul><li><strong>Max pulling force (NFPA HPF):<\/strong> 10,791 / 11,623 / 15,062 / 17,760 lbf (PSP40CL to PSP60).<\/li><li><strong>All models:<\/strong> IP57, PBPA288 28 V 8 Ah battery, and 360° two-speed inline handle.<\/li><li><strong>Accessories:<\/strong> cutting tip sets (PSP40/50/60), pulling chain sets, and on-tool charging cord.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li>Stabilize the vehicle and shield the patient.<\/li><li><strong>Spreading:<\/strong> put both tips in the gap, loaded close to the tip ends, using the <strong>full tip width<\/strong>. Then open.<\/li><li><strong>No gap yet:<\/strong> insert one tip, close to clamp and bend the metal away, and repeat until both tips fit (Holmatro procedure). Or make an opening with another tool.<\/li><li><strong>Squeezing:<\/strong> put the tips over the object, load near the tip ends, and close.<\/li><li><strong>Pulling:<\/strong> fully open, attach the chains with the hook openings not facing down, tension them, then close.<\/li><li>Store it with the tips slightly open and the handle in neutral (per the Holmatro manual).<\/li><\/ol>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Load only the tips, using their full surface. If the tips lose grip, <strong>stop<\/strong> and find a new push point.<\/li><li>Never place your body between the tool and the object, or between moving parts.<\/li><li>Watch the vehicle and structure the whole time. Secure parts that could fly off.<\/li><li>Hold the tool by its carrying handle with both hands, standing on a stable base.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Which PSP model has the longest spread distance and the highest max force?", "a": "PSP60: 32.3 in and 117,350 lbf.", "qh": "Which PSP model has the longest spread distance and the highest max force?", "ah": "PSP60: 32.3 in and 117,350 lbf."}, {"n": 2, "q": "Why should you use the full width of the tips?", "a": "To spread the load and avoid tip slip or damage. Holmatro says to load only the tips over their whole surface.", "qh": "Why should you use the full width of the tips?", "ah": "To spread the load and avoid tip slip or damage. Holmatro says to load only the tips over their whole surface."}, {"n": 3, "q": "What do you do if the spreader tips slip?", "a": "Stop and find a new push-off point.", "qh": "What do you do if the spreader tips slip?", "ah": "Stop and find a new push-off point."}, {"n": 4, "q": "How should the pulling chain hooks face?", "a": "With the hook openings not pointing down.", "qh": "How should the pulling chain hooks face?", "ah": "With the hook openings not pointing down."}], "sources": [{"label": "Holmatro Next-Gen Pentheon catalog 2026", "url": "https://www.holmatro.com/app/uploads/2026/04/F0025241_0002-1.pdf"}, {"label": "Holmatro HCT 511 user manual (spreading, squeezing, and pulling procedures and safety rules)", "url": "https://www.holmatro.com/app/uploads/2026/09/G0020541_0001.pdf"}, {"label": "Holmatro Rescue", "url": "https://www.holmatro.com/rescue/"}], "position_html": "<strong>Tree position:<\/strong> Path 05 &gt; 05.2 Hydraulic Extrication Tools &gt; tool. <strong>Unlocks after:<\/strong> 05.2.0 Overview. <strong>Next:<\/strong> 05.2.2 Cutters.", "note_html": "Study aid only. Specs are from the Holmatro Next-Gen Pentheon catalog (2026). Check your tool's plate and manual."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 650.69, "y": -111.45, "angle": 74.5, "vx": -174.58, "vy": 614.02, "vangle": 319.5}, "05.2.2": {"id": "05.2.2", "name": "Holmatro Pentheon Cutters and Mini Cutter", "path": "05", "kind": "tool", "parent": "05.2", "prereqRaw": "parent 05.2", "children": [], "prereqs": ["05.2"], "unlocks": [], "cross": [], "doc": {"title": "05.2.2 Holmatro Pentheon Cutters (PCU Series) and CCU10 Mini Cutter", "file": "05.2.2_Holmatro_Pentheon_Cutters.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>Battery-hydraulic cutters for posts, pillars, roof rails, and bars. The <strong>30° inclined cutter jaw<\/strong> reduces repositioning, and the slimmer <strong>i-Bolt<\/strong> center bolt helps the jaws reach tight spots.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<p>| Model | Max cut opening | Theoretical cut force | Round bar (S235) | NFPA 1960 cutting | Weight ready | |---|---|---|---|---|---| | PCU30CL | 6.7 in | 123,420 lbf | 1.2 in | A6 B5 C6 D6 E6 F2 | 33.7 lb | | PCU40 | 6.7 in | 171,754 lbf | 1.4 in | A7 B7 C6 D7 E8 F3 | 41.4 lb | | PCU50 | 7.2 in | 312,260 lbf | 1.6 in | A8 B8 C7 D9 E9 F4 | 47.6 lb | | PCU60 | 8.1 in | 396,788 lbf | 1.9 in | A9 B9 C9 D9 E9 F4 | 55.3 lb |<\/p><ul><li>All models are IP57 and use the 28 V 8 Ah PBPA288 battery.<\/li><li><strong>CCU10 Mini Cutter:<\/strong> 49,458 lbf, 2.3 in opening, 0.9 in round bar, 10.8 lb, and up to 70 cuts per 2 Ah battery. Made for pedals, steering wheels, headrests, rebar, and chains.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li>Find hidden hazards before cutting (airbag inflators, seat-belt pretensioners, high-strength steel). Follow your department's vehicle-anatomy SOP.<\/li><li>Open the blades and set the cutter <strong>perpendicular<\/strong> to the material.<\/li><li>Put the material <strong>as deep in the blades as possible<\/strong> (near the center bolt), then close.<\/li><li><strong>After every use (Holmatro CU 5000 sheet):<\/strong> check for oil leaks and readable labels. Check that the deadman handle and control handle work and return to neutral. Check the coupler and dust cap, the lights, and the blades. Spray PTFE (Teflon) lubricant on the center bolt, hinge pins, and blades while cycling. Store with the blade tips overlapping.<\/li><\/ol>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li><strong>Stop immediately if the blades separate or go out of line.<\/strong> That can cause serious injury and tool damage.<\/li><li>Don't cut with only the blade tips. Don't cut hardened fasteners or bolts.<\/li><li>Never cut parts under tension or pressure (struts, springs, gas cylinders).<\/li><li>Put a protective shield between the cut and the patient. Oil on the back of the control handle means the safety valve tripped, so get the tool serviced.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Where in the blades should material sit for the cut?", "a": "As deep as possible, close to the center bolt, with the blades perpendicular.", "qh": "Where in the blades should material sit for the cut?", "ah": "As deep as possible, close to the center bolt, with the blades perpendicular."}, {"n": 2, "q": "What must you do if the blades spread apart during a cut?", "a": "Stop immediately.", "qh": "What must you do if the blades spread apart during a cut?", "ah": "Stop immediately."}, {"n": 3, "q": "What's the advantage of the 30° inclined jaw?", "a": "A bigger working range with less tool repositioning.", "qh": "What's the advantage of the 30° inclined jaw?", "ah": "A bigger working range with less tool repositioning."}, {"n": 4, "q": "Name three items on the after-use checklist.", "a": "Any three of: leaks, labels, deadman or control handle, coupler and dust cap, lights, blades, lubrication, storage with tips overlapping.", "qh": "Name three items on the after-use checklist.", "ah": "Any three of: leaks, labels, deadman or control handle, coupler and dust cap, lights, blades, lubrication, storage with tips overlapping."}], "sources": [{"label": "Holmatro Next-Gen Pentheon catalog 2026", "url": "https://www.holmatro.com/app/uploads/2026/04/F0025241_0002-1.pdf"}, {"label": "Holmatro CU 5000 Series After-Use Maintenance (Rev 04-17)", "url": "https://www.holmatro.com/app/uploads/2026/07/F0016007_0001.pdf"}, {"label": "Holmatro HCT 511 manual (cutting procedure and warnings)", "url": "https://www.holmatro.com/app/uploads/2026/09/G0020541_0001.pdf"}], "position_html": "<strong>Tree position:<\/strong> Path 05 &gt; 05.2 Hydraulic Extrication Tools &gt; tool. <strong>Unlocks after:<\/strong> 05.2.1 Spreaders. <strong>Next:<\/strong> 05.2.3 Combi Tools.", "note_html": "Study aid only. Specs are from the Holmatro Next-Gen Pentheon catalog (2026) and the CU 5000 maintenance sheet."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 629.31, "y": -111.45, "angle": 105.5, "vx": -165.55, "vy": 633.4, "vangle": 350.5}, "05.2.3": {"id": "05.2.3", "name": "Holmatro Combi Tools (PCT, HCT 511)", "path": "05", "kind": "tool", "parent": "05.2", "prereqRaw": "parent 05.2", "children": [], "prereqs": ["05.2"], "unlocks": [], "cross": ["03.2", "04.4"], "doc": {"title": "05.2.3 Holmatro Combi Tools (Pentheon PCT and Hand-Operated HCT 511)", "file": "05.2.3_Holmatro_Combi_Tools.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>One tool that <strong>spreads, cuts, and squeezes<\/strong>. It's useful as a first-due tool, in tight spaces, or when there's only one tool. Two types:<\/p><ul><li><strong>Pentheon PCT:<\/strong> battery-powered. The PCT50/60 have removable tips and pulling attachments.<\/li><li><strong>HCT 5111/5114 (ST):<\/strong> hand-pumped, no battery or power unit, one-person operation. A pump handle drives the integrated hydraulic pump, and a control ring opens (clockwise) or closes (counterclockwise) the blades.<\/li><\/ul>"}, {"key": "specs", "title": "Key specs", "html": "<p>| Model | Spread distance | Max cut opening | Theoretical cut force | Round bar | Weight ready | |---|---|---|---|---|---| | PCT11 | 11.1 in | 7.7 in | 60,249 lbf | 0.9 in | 30.4 lb | | PCT14 | 14.3 in | 10.9 in | 60,249 lbf | 0.9 in | 31.3 lb | | PCT50 | 15 in | 12.6 in | 150,622 lbf | 1.4 in | 45.2 lb | | PCT60 | 18.4 in | 394 mm (about 15.5 in) | 208,848 lbf | 1.6 in | 51.8 lb | | HCT 5111 | — | 7.7 in | 60,249 lbf | — | 19.4 lb |<\/p><ul><li><strong>NFPA 1960 HSF/LSF (Pentheon):<\/strong> PCT11 11,690/8,992. PCT14 8,992/6,744. PCT50 9,554/7,396. PCT60 10,589/8,813 lbf.<\/li><li><strong>HCT 5111 NFPA 1960 cutting:<\/strong> A5 B5 C5 D6 E4 F3.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Cut:<\/strong> set the blades perpendicular, put the material deep in the opening, and close.<\/li><li><strong>Spread:<\/strong> close the blades, put both tips in the gap with the load near the tip ends and the full tip width used, then open.<\/li><li><strong>Squeeze:<\/strong> tips over the object, load near the tip ends, then close.<\/li><li><strong>HCT:<\/strong> pump the handle up and down and turn the control ring for direction. Store with the blades slightly open.<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Stop if the blades separate. Don't cut with the tips only or cut hardened bolts.<\/li><li>Load only the spreading tips. If they slip, stop and reset.<\/li><li>Put a flexible shield between the cut and the victim. Keep your body out of the tool's path.<\/li><li>Wear eye protection and a filter mask when cutting glass or plastic.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "What three functions does a combi tool perform?", "a": "Spread, cut, and squeeze. Some models also pull.", "qh": "What three functions does a combi tool perform?", "ah": "Spread, cut, and squeeze. Some models also pull."}, {"n": 2, "q": "How does the HCT 5111 get hydraulic power?", "a": "Its hand-operated pump handle drives an integrated hydraulic pump.", "qh": "How does the HCT 5111 get hydraulic power?", "ah": "Its hand-operated pump handle drives an integrated hydraulic pump."}, {"n": 3, "q": "Which way do you turn the HCT control ring to open the blades?", "a": "Clockwise.", "qh": "Which way do you turn the HCT control ring to open the blades?", "ah": "Clockwise."}, {"n": 4, "q": "How should a combi tool be stored?", "a": "With the blades slightly open (control in neutral).", "qh": "How should a combi tool be stored?", "ah": "With the blades slightly open (control in neutral)."}], "sources": [{"label": "Holmatro Next-Gen Pentheon catalog 2026", "url": "https://www.holmatro.com/app/uploads/2026/04/F0025241_0002-1.pdf"}, {"label": "Holmatro HCT 511 Series user manual", "url": "https://www.holmatro.com/app/uploads/2026/09/G0020541_0001.pdf"}, {"label": "Holmatro Rescue", "url": "https://www.holmatro.com/rescue/"}], "position_html": "<strong>Tree position:<\/strong> Path 05 &gt; 05.2 Hydraulic Extrication Tools &gt; tool. <strong>Unlocks after:<\/strong> 05.2.1 Spreaders and 05.2.2 Cutters. <strong>Next:<\/strong> 05.3 Rams and Shoring (planned). <strong>Cross-links:<\/strong> 03.2 Forcible Entry, 04.4 RIT Tool Cache.", "note_html": "Study aid only. Specs are from the Pentheon catalog (2026) and the HCT 511 manual (posted Sep 2026)."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 610.99, "y": -122.47, "angle": 136.5, "vx": -167.78, "vy": 654.66, "vangle": 21.5}, "05.3": {"id": "05.3", "name": "Rams, Shoring and Lifting", "path": "05", "kind": "main", "parent": null, "prereqRaw": "05.2", "children": ["05.3.1", "05.3.2", "05.3.3"], "prereqs": ["05.2"], "unlocks": ["05.3.1", "05.3.2", "05.3.3", "05.C"], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 840, "y": -150.0, "vx": -205.0, "vy": 790, "vangle": null}, "05.3.1": {"id": "05.3.1", "name": "Holmatro Pentheon Rams", "path": "05", "kind": "tool", "parent": "05.3", "prereqRaw": "parent 05.3", "children": [], "prereqs": ["05.3"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 860.6, "y": -115.71, "angle": 59.0, "vx": -182.63, "vy": 756.84, "vangle": 304.0}, "05.3.2": {"id": "05.3.2", "name": "Holmatro Omn round Hydraulics", "path": "08", "kind": "main", "parent": null, "prereqRaw": "08.2, 02.2", "children": ["08.3.1"], "prereqs": ["08.2", "02.2"], "unlocks": ["08.3.1", "08.C"], "cross": ["02.2"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 840, "y": 300.0, "vx": 410.0, "vy": 790, "vangle": null}, "08.3.1": {"id": "08.3.1", "name": "Hale/Class 1 Sentry and TPG Governors", "path": "08", "kind": "tool", "parent": "08.3", "prereqRaw": "parent 08.3", "children": [], "prereqs": ["08.3"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 840.0, "y": 340.0, "angle": 90.0, "vx": 446.25, "vy": 773.1, "vangle": 335.0}, "08.4": {"id": "08.4", "name": "Water Supply: Hydrants, Drafting, Relay, Tenders", "path": "08", "kind": "main", "parent": null, "prereqRaw": "08.2", "children": [], "prereqs": ["08.2"], "unlocks": ["08.C"], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1040, "y": 300.0, "vx": 410.0, "vy": 940, "vangle": null}, "08.5": {"id": "08.5", "name": "Aerial Apparatus Operation", "path": "08", "kind": "main", "parent": null, "prereqRaw": "08.1, 03.5", "children": [], "prereqs": ["08.1", "03.5"], "unlocks": ["08.C"], "cross": ["03.5", "03.1.1"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1240, "y": 300.0, "vx": 410.0, "vy": 1090, "vangle": null}, "08.C": {"id": "08.C", "name": "CAPSTONE: Driver/Operator", "path": "08", "kind": "capstone", "parent": null, "prereqRaw": "08.1 to 08.5", "children": [], "prereqs": ["08.1", "08.2", "08.3", "08.4", "08.5"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1640, "y": 300.0, "vx": 410.0, "vy": 1390, "vangle": null}, "09.1": {"id": "09.1", "name": "Navigation and Accountability Equipment", "path": "09", "kind": "main", "parent": null, "prereqRaw": "01.2", "children": ["09.1.1", "09.1.2", "09.1.3", "09.1.4"], "prereqs": ["01.2"], "unlocks": ["09.1.1", "09.1.2", "09.1.3", "09.1.4", "09.2", "09.3", "09.C"], "cross": ["01.2"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 440, "y": 450.0, "vx": 615.0, "vy": 490, "vangle": null}, "09.1.1": {"id": "09.1.1", "name": "PASS Devices", "path": "09", "kind": "tool", "parent": "09.1", "prereqRaw": "parent 09.1", "children": [], "prereqs": ["09.1"], "unlocks": ["04.1"], "cross": ["04.1", "01.2.1", "01.2.2", "04.2.1", "04.2.2", "09.1.4"], "doc": {"title": "09.1.1 PASS (Personal Alert Safety System) Devices", "file": "09.1.1_PASS_Devices.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>A PASS is an electronic alarm worn by a firefighter. It sounds a loud, distinctive alarm if the wearer stops moving for a set time, and it can be triggered manually. It can be <strong>integrated<\/strong> into the SCBA (it arms automatically when the air is turned on) or <strong>stand-alone<\/strong> (worn on the SCBA strap).<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>MSA G1 integrated PASS:<\/strong> motion sensor in the control module. <strong>Pre-alarm at 20 s<\/strong> motionless and <strong>full alarm at 30 s<\/strong>. The ALARM button gives a manual full alarm with or without air. Shaking resets the pre-alarm but <strong>not<\/strong> the full alarm. Reset by pressing RESET twice within about 1 s.<\/li><li><strong>Scott X3 Pro integrated PASS:<\/strong> <strong>3 quick chirps<\/strong> when the cylinder valve opens. The HUD flashes red in alternation for pre-alarm and red together for a full alarm. Change batteries at the low-battery alarm.<\/li><li><strong>NIOSH description:<\/strong> a PASS sounds if the firefighter is motionless for a set time (e.g., 30 s).<\/li><li><strong>Radio interference:<\/strong> the PASS can malfunction from RF interference (Scott manual).<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li>Check it at shift start: arming chirps or tones, a pre-alarm test, a full-alarm test, and a manual alarm test (see 01.2.2 steps).<\/li><li><strong>Wear it and arm it at every incident<\/strong> where you could be in a hazardous area. An integrated PASS arms when you open the cylinder.<\/li><li>If you're lost, trapped, disoriented, or low on air: <strong>call \"Mayday, Mayday, Mayday\"<\/strong> on the radio <strong>and press the manual PASS alarm<\/strong> (NIOSH recommendation).<\/li><li>If you hear a PASS alarm, treat it as an emergency until proven otherwise. Notify command and use RIT and accountability.<\/li><\/ol>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>NIOSH investigations found firefighters who died wearing PASS devices that were <strong>never activated<\/strong>.<\/li><li>NIOSH suggests departments consider a <strong>backup stand-alone PASS<\/strong> along with integrated PASS, in case one fails.<\/li><li>Remove from service any SCBA whose PASS fails its checks.<\/li><li>Know your PASS sounds and lights so you recognize a pre-alarm before it becomes a full alarm.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "What triggers a PASS full alarm automatically?", "a": "No motion for the set period (e.g., 30 s), or pressing the manual alarm.", "qh": "What triggers a PASS full alarm automatically?", "ah": "No motion for the set period (e.g., 30 s), or pressing the manual alarm."}, {"n": 2, "q": "G1 PASS pre-alarm and full-alarm times?", "a": "20 s for pre-alarm, 30 s for full alarm.", "qh": "G1 PASS pre-alarm and full-alarm times?", "ah": "20 s for pre-alarm, 30 s for full alarm."}, {"n": 3, "q": "How does an integrated PASS arm on Scott and MSA SCBAs?", "a": "Automatically when the cylinder valve is opened (Scott chirps 3 times).", "qh": "How does an integrated PASS arm on Scott and MSA SCBAs?", "ah": "Automatically when the cylinder valve is opened (Scott chirps 3 times)."}, {"n": 4, "q": "What two actions should a lost or trapped firefighter take right away?", "a": "Call Mayday on the radio and activate the PASS manually.", "qh": "What two actions should a lost or trapped firefighter take right away?", "ah": "Call Mayday on the radio and activate the PASS manually."}, {"n": 5, "q": "Why does NIOSH suggest a backup stand-alone PASS?", "a": "A second alarm if the integrated device fails (as in NIOSH report F2005-02).", "qh": "Why does NIOSH suggest a backup stand-alone PASS?", "ah": "A second alarm if the integrated device fails (as in NIOSH report F2005-02)."}], "sources": [{"label": "MSA G1 SCBA Operating Manual (PASS, sections 2.6 and 9)", "url": "https://s7d9.scene7.com/is/content/minesafetyappliances/10187007_USOperatingManual-G1SCBA2018Ed"}, {"label": "3M Scott Air-Pak X3 Pro O&M 595373-01 Rev C", "url": "https://www.eastgreenbushfire.com/wp-content/uploads/2025/10/X3-Pro-NFPA-1981-2018-Edition-Operating-and-Maintenance-Instructions-English-595373-01_C.pdf"}, {"label": "NIOSH FACE Report F2005-02 (backup PASS, Mayday and manual PASS)", "url": "https://www.cdc.gov/niosh/fire/reports/face200502.html"}, {"label": "NIOSH 94-125 Preventing Injuries and Deaths of Fire Fighters", "url": "https://archive.cdc.gov/www_cdc_gov/niosh/docs/94-125/default.html"}, {"label": "NIOSH 2009-100 Leading Recommendations", "url": "https://www.cdc.gov/niosh/docs/2009-100/pdfs/2009-100.pdf"}], "position_html": "<strong>Tree position:<\/strong> Path 09 Communications, Navigation and Accountability &gt; 09.1 Navigation and Accountability &gt; tool 1. <strong>Unlocks after:<\/strong> 01.2 SCBA. <strong>Unlocks:<\/strong> Path 04 RIT (04.1 Mayday and Self-Survival), 09.3 Telemetry (planned). <strong>Cross-links:<\/strong> 01.2.1 Scott X3 Pro, 01.2.2 MSA G1.", "note_html": "Study aid only. PASS requirements were in NFPA 1982 (2018 edition). NFPA has consolidated them, with the SCBA requirements, into NFPA 1970."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 469.01, "y": 477.53, "angle": 43.5, "vx": 627.69, "vy": 452.07, "vangle": 288.5}, "09.1.2": {"id": "09.1.2", "name": "Personnel Accountability Systems (Passport, PAR)", "path": "09", "kind": "tool", "parent": "09.1", "prereqRaw": "parent 09.1", "children": [], "prereqs": ["09.1"], "unlocks": [], "cross": ["04.1"], "doc": {"title": "09.1.2 Personnel Accountability Systems (Passport, Tags, PAR)", "file": "09.1.2_Personnel_Accountability_Systems.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>A way to track <strong>who<\/strong> is on scene, <strong>where<\/strong> they are, and <strong>what<\/strong> they're assigned to, so command knows right away if anyone is missing. Common types are <strong>passport/name-tag<\/strong> systems, tag boards, barcode systems, and electronic SCBA telemetry (USFA EFO research).<\/p>"}, {"key": "specs", "title": "Key specs (Passport system, MABAS Div. 1 OG 305)", "html": "<ul><li><strong>Name tags<\/strong> (Velcro) for each member go on the company <strong>Passport<\/strong>. Passports go to the IC or division officer and sit on a <strong>status board<\/strong> (9 in x 14 in).<\/li><li><strong>Helmet shields<\/strong> identify the company.<\/li><li><strong>Backup Passport (RED):<\/strong> kept on the apparatus (officer's side) as an emergency replacement and a second way to identify a lost crew.<\/li><li><strong>Reserve Passport (GREEN)<\/strong> stays in the station. <strong>Blank Passports<\/strong> live in make-up kits for new companies.<\/li><li><strong>PAR (Personnel Accountability Report):<\/strong> a roll call confirming all assigned members are safe and accounted for.<\/li><li><strong>Crew integrity:<\/strong> members stay in <strong>voice (not radio), visual, or touch<\/strong> contact inside the perimeter.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li>On arrival, the company officer turns in the Passport per SOP (to command or the accountability officer).<\/li><li>Command tracks the assignment on the status board and moves Passports with the crews.<\/li><li><strong>A PAR is required at set times<\/strong>, typically after a report of a missing or trapped member, a switch from offensive to defensive operations, or a sudden hazardous event (regional SOP examples).<\/li><li>When leaving the hot zone, crews get their Passport back.<\/li><li>Any member unaccounted for means an immediate search and RIT response (NIOSH).<\/li><\/ol>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>NIOSH: accountability is one of command's most important duties. In fatal incidents, \"no one could account for them.\"<\/li><li>A Passport is only as good as the crew discipline behind it. Stay together and don't freelance.<\/li><li>Pair it with PASS and radio Mayday procedures.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "What is a PAR?", "a": "A Personnel Accountability Report: a roll call confirming everyone is safe and accounted for.", "qh": "What is a PAR?", "ah": "A Personnel Accountability Report: a roll call confirming everyone is safe and accounted for."}, {"n": 2, "q": "What is the red backup Passport for?", "a": "Emergency replacement if the primary is lost, and a second way to identify a lost crew.", "qh": "What is the red backup Passport for?", "ah": "Emergency replacement if the primary is lost, and a second way to identify a lost crew."}, {"n": 3, "q": "Name three events that trigger a PAR.", "a": "A missing or trapped member, a switch from offensive to defensive, or a sudden hazardous event.", "qh": "Name three events that trigger a PAR.", "ah": "A missing or trapped member, a switch from offensive to defensive, or a sudden hazardous event."}, {"n": 4, "q": "What contact methods count for crew integrity inside the perimeter?", "a": "Voice (not radio), visual, or touch.", "qh": "What contact methods count for crew integrity inside the perimeter?", "ah": "Voice (not radio), visual, or touch."}], "sources": [{"label": "MABAS Division 1 OG/PS 305 Passport Personnel Accountability System (2021)", "url": "https://www.mabas1.org/files/95b8dee97/MABAS_OGPS_305_Passport_Accountability_Sys_-_FINAL_06-01-21.pdf"}, {"label": "Rogers (AR) FD SOP 310 Passport Accountability System", "url": "https://www.rogersar.gov/DocumentCenter/View/27842/SOP-310---Passport-Accountability-System"}, {"label": "USFA EFO paper, Selecting and Planning the Implementation of a Personnel Accountability System", "url": "https://apps.usfa.fema.gov/pdf/efop/efo28066.pdf"}, {"label": "NIOSH HHE 94-0244 (Memphis), accountability recommendation", "url": "https://www.cdc.gov/niosh/hhe/reports/pdfs/1994-0244-2431.pdf"}], "position_html": "<strong>Tree position:<\/strong> Path 09 &gt; 09.1 Navigation and Accountability &gt; tool 2. <strong>Unlocks after:<\/strong> 01.0 Fundamentals, 09.1.1 PASS. <strong>Unlocks:<\/strong> 09.4 Incident Command (planned) and the Path 09 capstone. <strong>Cross-links:<\/strong> Path 04 RIT, 10 Officer.", "note_html": "Study aid only. Systems vary by department and region. Learn your own SOP. This sheet uses a published regional operating guideline (MABAS Division 1) as the example."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 450.69, "y": 488.55, "angle": 74.5, "vx": 645.42, "vy": 464.02, "vangle": 319.5}, "09.1.3": {"id": "09.1.3", "name": "Apparatus GPS / AVL", "path": "09", "kind": "tool", "parent": "09.1", "prereqRaw": "parent 09.1", "children": [], "prereqs": ["09.1"], "unlocks": [], "cross": ["08.1"], "doc": {"title": "09.1.3 Apparatus GPS / AVL (Automatic Vehicle Location)", "file": "09.1.3_Apparatus_GPS_AVL.md", "sections": [{"key": "what", "title": "What it is", "html": "<p><strong>AVL<\/strong> uses a GPS receiver on each apparatus to report its real-time location to <strong>CAD<\/strong> (computer-aided dispatch), usually shown on <strong>MDTs<\/strong> (mobile data terminals) or mapping software. It allows <strong>closest-unit (\"dynamic\") dispatch<\/strong> based on where units actually are, instead of which station is closest.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Parts:<\/strong> a GPS receiver/transceiver on the apparatus, a data or radio link, CAD integration, and an MDT or map display.<\/li><li><strong>Use case:<\/strong> CAD recommends the closest available unit from live AVL positions (USFA EFO research, FDNY audit).<\/li><li><strong>DHS SAVER (2020):<\/strong> vehicle tracking systems give near-real-time fleet positions. Some add hydrant mapping, driver performance data, or alerts to civilian vehicles.<\/li><li><strong>Real deployments:<\/strong> Honolulu FD put AVL and MDTs on all front-line apparatus in 2006 (42 engines, 15 aerials, and more).<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li>The MDT and AVL stay powered and logged in, with unit status (available, en route, on scene) kept current.<\/li><li>CAD uses live position to recommend units, and dispatch assigns them.<\/li><li>Crews use the MDT map and routing for the address, hydrants, and pre-plans where available.<\/li><li>Command and dispatch can see where units are during large incidents.<\/li><\/ol>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>AVL only helps if <strong>status buttons and positions are accurate<\/strong>. An NYC Comptroller audit found FDNY's AVL wasn't fully integrated with fire CAD and sometimes showed vehicles inaccurately or not at all.<\/li><li>Don't drive by screen. Watch the road and follow your driver/operator rules (Path 08).<\/li><li>AVL tracks <strong>vehicles<\/strong>, not firefighters inside buildings. Interior accountability still relies on Passports, PASS, radio, and SCBA telemetry.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "What does AVL let CAD do that station-based dispatch can't?", "a": "Recommend the closest available unit based on its real-time position.", "qh": "What does AVL let CAD do that station-based dispatch can't?", "ah": "Recommend the closest available unit based on its real-time position."}, {"n": 2, "q": "What are the main parts of an AVL system?", "a": "GPS receiver/transceiver, data or radio link, CAD integration, and an MDT or map display.", "qh": "What are the main parts of an AVL system?", "ah": "GPS receiver/transceiver, data or radio link, CAD integration, and an MDT or map display."}, {"n": 3, "q": "Does AVL track firefighters inside a structure?", "a": "No, it tracks vehicles.", "qh": "Does AVL track firefighters inside a structure?", "ah": "No, it tracks vehicles."}, {"n": 4, "q": "Name one weakness found in a real AVL audit.", "a": "Incomplete CAD integration and inaccurate or missing vehicle positions (FDNY audit).", "qh": "Name one weakness found in a real AVL audit.", "ah": "Incomplete CAD integration and inaccurate or missing vehicle positions (FDNY audit)."}], "sources": [{"label": "USFA EFO, Impact of AVL on Incident Response Time in the Honolulu FD", "url": "https://apps.usfa.fema.gov/pdf/efop/efo42570.pdf"}, {"label": "USFA EFO, MDTs and AVL in the Fire Service: Tools or Toys", "url": "https://apps.usfa.fema.gov/pdf/efop/efo38000.pdf"}, {"label": "DHS SAVER Vehicle Tracking Technology Systems Market Survey (2020)", "url": "https://www.dhs.gov/sites/default/files/saver-vehicle-tracking-technology_12mar2020_final-508.pdf"}, {"label": "NYC Comptroller audit of FDNY AVL", "url": "https://comptroller.nyc.gov/reports/audit-report-on-the-fire-department-of-new-yorks-automatic-vehicle-location-system/"}], "position_html": "<strong>Tree position:<\/strong> Path 09 &gt; 09.1 Navigation and Accountability &gt; tool 3. <strong>Unlocks after:<\/strong> 09.1.2 Accountability. <strong>Cross-links:<\/strong> Path 08 Driver/Operator (response routing), 10 Officer (deployment).", "note_html": "Study aid only. Your department's CAD and MDT setup decides how AVL is actually used."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 429.31, "y": 488.55, "angle": 105.5, "vx": 654.45, "vy": 483.4, "vangle": 350.5}, "09.1.4": {"id": "09.1.4", "name": "TIC Navigation and Search", "path": "09", "kind": "tool", "parent": "09.1", "prereqRaw": "parent 09.1", "children": [], "prereqs": ["09.1"], "unlocks": ["02.3"], "cross": ["02.3", "04.1", "09.1.1"], "doc": {"title": "09.1.4 TIC Navigation and Search", "file": "09.1.4_TIC_Navigation_and_Search.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>A thermal imaging camera (TIC) shows heat instead of light, so you can \"see\" through smoke. NIOSH calls it a way to <strong>enhance the sense of sight<\/strong> during size-up (FACE F2020-10). It is a <strong>search aid, not a lifeline<\/strong>. It can't see through walls, glass, mirrors, or water, it can fail, and it does not show you the way out the way a hoseline or tagline does.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<p><strong>How auto-ranging works (FLIR K33/K53 Basic mode):<\/strong><\/p><ul><li>The K33/K53 has one mode: <strong>Basic<\/strong>, a multipurpose mode for initial attack, rescue, and fire control.<\/li><li><strong>High-sensitivity range:<\/strong> −20 to +150 °C (−4 to +302 °F). <strong>Low-sensitivity range:<\/strong> 0 to +650 °C (+32 to +1202 °F). <strong>Heat colorization:<\/strong> +150 to +650 °C (+302 to +1202 °F).<\/li><li>The camera switches ranges when objects <strong>above 150 °C (302 °F)<\/strong> enter the view. The decision uses the center box of the screen, from 15% to 85% of the width and height.<\/li><li><strong>High → low:<\/strong> more than <strong>2%<\/strong> of the pixels in that box stay above 150 °C for <strong>more than 1 s<\/strong>.<\/li><li><strong>Low → high:<\/strong> more than <strong>98%<\/strong> of the pixels stay more than 50 °C below the high-range max (that is, below 100 °C / 212 °F) for <strong>more than 1 s<\/strong>.<\/li><li><strong>Screen icons:<\/strong> a <strong>low-sensitivity indicator<\/strong> (the camera has switched because it sees a hot area) and an <strong>overheating indicator<\/strong> (the camera is about to shut down from internal heat). A <strong>flashing battery icon<\/strong> means at least 5 minutes of power remain.<\/li><li><strong>Low gain mode (setting):<\/strong> locks the camera in the low-sensitivity range. The upside is that it doesn't do a non-uniformity correction (NUC) when something above 150 °C enters the view. The downsides are <strong>lower sensitivity and more image noise<\/strong>.<\/li><li><strong>Buttons:<\/strong> push on/off to turn on. Hold 3–10 s for <strong>standby<\/strong> (auto-off after 6 h). Hold more than 10 s to turn off. The trigger is configurable. K33 default: pull and hold to <strong>freeze<\/strong> the image, release for live.<\/li><\/ul><p><strong>Mode choices (FLIR K45/K55; the K65 has \"NFPA Basic Plus\" versions):<\/strong> | Mode | Range | Heat colorization | Built for | |---|---|---|---| | Basic (default) | Auto (green icon) | 150–650 °C | Initial attack, rescue, fire control | | Black-and-white firefighting | Auto (green) | None | Departments that don't want color | | Fire | Auto (green) | <strong>250–650 °C<\/strong> | Scenes with lots of open flame and high background heat | | Search and rescue | <strong>Locked high-sens<\/strong> (blue) | <strong>100–150 °C<\/strong> | High contrast while searching for people | | Heat detection | <strong>Locked high-sens<\/strong> (blue) | <strong>Hottest 20%<\/strong> of the scene | Overhaul, hidden fire, people in car seats, in water, or in open terrain |<\/p><ul><li><strong>Green icon<\/strong> = auto-switching. <strong>Blue icon<\/strong> = range locked. Locked high-sens gives the best image of things below 150 °C even when something hotter is in view.<\/li><li>To get back to Basic from any mode: push the on/off button for <strong>less than 1 s<\/strong>.<\/li><li>The manual warns that working in an NFPA Basic Plus mode <strong>may require additional training<\/strong>.<\/li><li><strong>Durability (K45/K55/K65):<\/strong> 2 m (6.5 ft) drop onto concrete, IP67, fully operational to +85 °C (185 °F), and to +260 °C (500 °F) for 5 min. The K65 also lists +150 °C (302 °F) for 15 min. Its manual states it complies with NFPA 1801 (2013 ed.).<\/li><li><strong>Bullard (brochure, 2021):<\/strong> the low-sensitivity indicator comes on from about <strong>230 °F<\/strong>, which is lower than FLIR's 302 °F. Optional Electronic Thermal Throttle manually colors the hottest points blue for hidden heat and overhaul. QXT and NXT: 320×240, 60 Hz, 7–8 h operating time.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li><strong>Size-up:<\/strong> use the TIC during the initial size-up (NIOSH 2018-154). Look for fire location, entry points, and vent choices (USFA EFO 37508).<\/li><li><strong>Before entry:<\/strong> always check for a basement or other below-grade area, even if the fire seems to be on the ground floor or higher. A TIC scanning the ground floor <strong>may not detect a basement fire<\/strong>, because wood flooring plus carpet or laminate insulates and blocks heat transfer (NIOSH 2018-154).<\/li><li><strong>Search:<\/strong> stay low. The TIC has a <strong>limited field of view<\/strong>, so scan each room <strong>high and low<\/strong>, then physically check closets, under beds, and storage chests, because a child may hide (EFO 37508). Search and rescue mode, where available, holds high contrast for people.<\/li><li><strong>Orientation:<\/strong> keep your hoseline or tagline and your crew. In large or commercial buildings, NIOSH recommends that primary search crews and RIT <strong>advance with a hoseline or tagline<\/strong> (F2020-10). Use hose coupling direction to find the exit.<\/li><li><strong>White-out:<\/strong> if the screen whites out when you look into a room, give the camera a couple of seconds to readjust (EFO 37508). On the FLIR K-series, the low-sensitivity icon tells you it has switched to the hot range.<\/li><li><strong>Watch the ceiling:<\/strong> high ceiling heat can mean flashover is possible. As water goes on, watch the heat change to judge the stream (EFO 37508).<\/li><li><strong>RIT:<\/strong> each RIT should be assigned a TIC (EFO 37508). In F2023-10, a search crew tied a search rope to a burned-out vehicle, used a TIC and a sounding PASS to work through a maze of vehicles, and found the missing firefighter about 35–40 ft from the rope anchor.<\/li><li><strong>After use (FLIR):<\/strong> clean, charge, check the battery latch, lens, screen, body, buttons, triggers, and lanyard points.<\/li><\/ol>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li><strong>It fails.<\/strong> A TIC is a mechanical device that can fail at the worst time, including dead batteries. If it fails and you went deep without a line, you may not be able to retrace your path (EFO 37508). Basic skills save you when the TIC dies.<\/li><li><strong>It speeds you up.<\/strong> With their sight \"back,\" firefighters tend to move too fast and too deep, <strong>stand and walk where they would have crawled<\/strong>, and lose crew contact (EFO 37508).<\/li><li><strong>It can't see through<\/strong> walls, beds, windows or glass, mirrors, or water. Shiny surfaces reflect heat, and you may even see your own reflection. Sprinkler water can shield hot spots (EFO 37508).<\/li><li><strong>Misreading the image<\/strong> can make you miss flashover signs, collapse signs, or victims. A hole in the floor with fire below can be misread (EFO 37508). NIOSH: a TIC <strong>cannot reliably show a structural hazard<\/strong> (2018-154, citing NIST 2011).<\/li><li><strong>Below grade:<\/strong> don't go after a basement fire by the interior stairway. Attack it from an exterior door, window, or other opening, then reassess (NIOSH 2018-154).<\/li><li><strong>A TIC doesn't replace air, mask, or Mayday discipline.<\/strong> In F2022-03, a crew that couldn't find the stairs went out, got directions and a TIC, and went back in. A firefighter then fell on the stairs, lost his air, and his mask was displaced. He died of smoke inhalation. His TIC and helmet were found on the floor. In F2020-10, RIT members using TICs and a tagline still entered the wrong room, and a captain lost his TIC when falling ceiling material hit him.<\/li><li><strong>TIC as messenger:<\/strong> in F2023-10, a captain's TIC showed a warped steel I-beam and heavy ceiling heat, but his radio failed inside the steel ship, and he had to walk out to report it. Seeing the hazard isn't enough. You have to get the information to command.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Your FLIR K33 is in Basic mode and you turn toward a doorway with fire in it. Exactly what condition makes it switch to the low-sensitivity range, and which part of the screen does it measure?", "a": "More than 2% of the pixels in the center box (15%–85% of screen width and height) stay above 150 °C (302 °F) for more than 1 second.", "qh": "Your FLIR K33 is in Basic mode and you turn toward a doorway with fire in it. Exactly what condition makes it switch to the low-sensitivity range, and which part of the screen does it measure?", "ah": "More than 2% of the pixels in the center box (15%–85% of screen width and height) stay above 150 °C (302 °F) for more than 1 second."}, {"n": 2, "q": "After knockdown the room cools. What has to happen before the K33/K53 switches back to high sensitivity, and what icon tells you which range you're in?", "a": "More than 98% of the pixels in that box must stay below 100 °C (50 °C under the 150 °C high-range max) for more than 1 second. The low-sensitivity mode indicator shows while the camera is in the low-sensitivity (hot) range.", "qh": "After knockdown the room cools. What has to happen before the K33/K53 switches back to high sensitivity, and what icon tells you which range you're in?", "ah": "More than 98% of the pixels in that box must stay below 100 °C (50 °C under the 150 °C high-range max) for more than 1 second. The low-sensitivity mode indicator shows while the camera is in the low-sensitivity (hot) range."}, {"n": 3, "q": "On a K55 you switch from Basic to Search and Rescue mode. What happens to the temperature range and the heat colorization, and why is that better for finding a person?", "a": "The range locks to high sensitivity (−20 to +150 °C), and only 100–150 °C gets colorized. Locking out the hot-range switch keeps high contrast on cooler things like people, even with fire in view.", "qh": "On a K55 you switch from Basic to Search and Rescue mode. What happens to the temperature range and the heat colorization, and why is that better for finding a person?", "ah": "The range locks to high sensitivity (−20 to +150 °C), and only 100–150 °C gets colorized. Locking out the hot-range switch keeps high contrast on cooler things like people, even with fire in view."}, {"n": 4, "q": "A K55 shows a blue mode icon. What does that mean, and which two modes use it? How do you get back to Basic mode fast?", "a": "Blue means the range is locked to high sensitivity. Search and rescue mode and heat detection mode use it (green modes auto-switch). Push the on/off button for less than 1 second to return to Basic.", "qh": "A K55 shows a blue mode icon. What does that mean, and which two modes use it? How do you get back to Basic mode fast?", "ah": "Blue means the range is locked to high sensitivity. Search and rescue mode and heat detection mode use it (green modes auto-switch). Push the on/off button for less than 1 second to return to Basic."}, {"n": 5, "q": "During overhaul a member wants the camera to show \"only the hot stuff.\" Which FLIR mode does that, how does it decide what to color, and what other uses does the manual list for it?", "a": "Heat detection mode colors the hottest 20% of the scene. The manual also lists finding thermal patterns such as people in car seats after crashes, and searching for people in water and open landscapes.", "qh": "During overhaul a member wants the camera to show \"only the hot stuff.\" Which FLIR mode does that, how does it decide what to color, and what other uses does the manual list for it?", "ah": "Heat detection mode colors the hottest 20% of the scene. The manual also lists finding thermal patterns such as people in car seats after crashes, and searching for people in water and open landscapes."}, {"n": 6, "q": "Your crew scans the first floor of a house with a TIC and sees no heat, but smoke is pushing from the eaves. Why can't you rule out a basement fire, according to NIOSH 2018-154, and what should you do?", "a": "Wood flooring with carpet or laminate insulates and blocks heat transfer, so a TIC may not detect a basement fire from the ground floor. Always check for a below-grade area, and don't attack it down the interior stairs. Use an exterior door, window, or other opening, then reassess.", "qh": "Your crew scans the first floor of a house with a TIC and sees no heat, but smoke is pushing from the eaves. Why can't you rule out a basement fire, according to NIOSH 2018-154, and what should you do?", "ah": "Wood flooring with carpet or laminate insulates and blocks heat transfer, so a TIC may not detect a basement fire from the ground floor. Always check for a below-grade area, and don't attack it down the interior stairs. Use an exterior door, window, or other opening, then reassess."}, {"n": 7, "q": "A Bullard user and a FLIR user stand in the same room. Why might the Bullard show its low-sensitivity indicator before the FLIR shows its icon?", "a": "Bullard's brochure says its low-sensitivity indicator comes on from about 230 °F. FLIR K-series cameras switch when objects go above 302 °F (150 °C).", "qh": "A Bullard user and a FLIR user stand in the same room. Why might the Bullard show its low-sensitivity indicator before the FLIR shows its icon?", "ah": "Bullard's brochure says its low-sensitivity indicator comes on from about 230 °F. FLIR K-series cameras switch when objects go above 302 °F (150 °C)."}, {"n": 8, "q": "Give four limitations of a TIC from USFA EFO 37508 that could get a searcher lost or hurt even when the camera is working.", "a": "Any four: it can't see through walls, glass, mirrors, or water; shiny surfaces give false reflections; sprinkler water can shield hot spots; users move too fast or too deep and stand up where they would crawl; users lose crew contact and become disoriented; the limited field of view means you must scan high and low; misreading can miss flashover, collapse, or victims.", "qh": "Give four limitations of a TIC from USFA EFO 37508 that could get a searcher lost or hurt even when the camera is working.", "ah": "Any four: it can't see through walls, glass, mirrors, or water; shiny surfaces give false reflections; sprinkler water can shield hot spots; users move too fast or too deep and stand up where they would crawl; users lose crew contact and become disoriented; the limited field of view means you must scan high and low; misreading can miss flashover, collapse, or victims."}, {"n": 9, "q": "NIOSH FACE F2020-10: the RIT went in with thermal imagers and a tagline. What still went wrong, and what does NIOSH recommend primary search crews and RIT take into commercial or complex buildings?", "a": "Obstacles slowed them, they went into the wrong room (the computer room), and the captain lost his TIC when falling ceiling material struck him. They backed out as conditions worsened. NIOSH recommends that primary search crews and RIT advance with a hoseline or tagline in commercial or complex structures, with training in large-area search.", "qh": "NIOSH FACE F2020-10: the RIT went in with thermal imagers and a tagline. What still went wrong, and what does NIOSH recommend primary search crews and RIT take into commercial or complex buildings?", "ah": "Obstacles slowed them, they went into the wrong room (the computer room), and the captain lost his TIC when falling ceiling material struck him. They backed out as conditions worsened. NIOSH recommends that primary search crews and RIT advance with a hoseline or tagline in commercial or complex structures, with training in large-area search."}, {"n": 10, "q": "In NIOSH FACE F2022-03, the crew went back in with a TIC. Why is this case taught as a reminder about SCBA discipline rather than about the TIC, and what was the first key recommendation?", "a": "The death came from a fall with catastrophic air loss and a displaced mask, causing smoke inhalation, not from TIC performance. Key Recommendation #1 was to reinforce SCBA training and keep the mask on in IDLH environments.", "qh": "In NIOSH FACE F2022-03, the crew went back in with a TIC. Why is this case taught as a reminder about SCBA discipline rather than about the TIC, and what was the first key recommendation?", "ah": "The death came from a fall with catastrophic air loss and a displaced mask, causing smoke inhalation, not from TIC performance. Key Recommendation #1 was to reinforce SCBA training and keep the mask on in IDLH environments."}, {"n": 11, "q": "K-series \"Low gain mode\" sounds safer because the camera never switches. What is its one advantage, and what do you give up?", "a": "Advantage: no non-uniformity correction (NUC) when an object above 150 °C enters the scene. Cost: lower sensitivity and more signal noise.", "qh": "K-series \"Low gain mode\" sounds safer because the camera never switches. What is its one advantage, and what do you give up?", "ah": "Advantage: no non-uniformity correction (NUC) when an object above 150 °C enters the scene. Cost: lower sensitivity and more signal noise."}, {"n": 12, "q": "In NIOSH FACE F2023-10, how did the search crew combine a rope, a TIC, and the PASS to find the missing firefighter?", "a": "They followed the hoseline to the nozzle, tied a search rope to a burned-out vehicle, heard a PASS alarm, and used the TIC to navigate through the vehicles toward the sound. They found him about 35–40 ft from the rope anchor.", "qh": "In NIOSH FACE F2023-10, how did the search crew combine a rope, a TIC, and the PASS to find the missing firefighter?", "ah": "They followed the hoseline to the nozzle, tied a search rope to a burned-out vehicle, heard a PASS alarm, and used the TIC to navigate through the vehicles toward the sound. They found him about 35–40 ft from the rope anchor."}], "sources": [{"label": "FLIR K33/K53 Series User's Manual (T810170)", "url": "https://docs.flir.com/T810170/en-US/latest/T810170_en-US_AI_FLIR-K33-K53_UM.pdf"}, {"label": "FLIR Kxx Series (K45/K55/K65) User's Manual (T559946)", "url": "https://res.cloudinary.com/iwh/image/upload/q_auto,g_center/assets/1/26/FLIR_K55-K65_User_Manual.pdf"}, {"label": "Bullard Thermal Imaging Family Brochure (AM EN 0221), local: /workspace/Firefighter_Reference_Library/09_Thermal_Imaging_Cameras/Bullard_Thermal_Imaging_Family_Brochure_AM_EN_0221.pdf", "url": ""}, {"label": "NIOSH 2018-154, Preventing Deaths and Injuries of Fire Fighters Working at Basement and Other Below-Grade Fires", "url": "https://www.cdc.gov/niosh/docs/2018-154/pdfs/2018-154.pdf"}, {"label": "USFA/NFA EFO paper, J. A. Johnson, Proper Use and Deployment of Thermal Image Cameras (2004 literature review)", "url": "https://apps.usfa.fema.gov/pdf/efop/efo37508.pdf"}, {"label": "NIOSH FACE F2020-10, library search, out of air (California)", "url": "https://www.cdc.gov/niosh/firefighters/programs/pdfs/face202010.pdf"}, {"label": "NIOSH FACE F2022-03, smoke inhalation during initial attack (Kansas)", "url": "https://www.cdc.gov/niosh/firefighters/programs/pdfs/face202203.pdf"}, {"label": "NIOSH FACE F2023-10, marine vessel, lost and out of air (New Jersey)", "url": "https://www.cdc.gov/niosh/firefighters/programs/pdfs/face202310.pdf"}, {"label": "Scout batches 01 and 03 (TIC sections): /workspace/can-report/scout-batch-01.md, /workspace/can-report/scout-batch-03.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 09 Communications, Navigation and Accountability &gt; 09.1 Navigation and Accountability &gt; tool 4. <strong>Unlocks after:<\/strong> 01.2 SCBA. <strong>Unlocks:<\/strong> 02.3 Thermal Imaging for Fire Attack (02.3.1–02.3.4). <strong>Cross-links:<\/strong> 02.3 TIC for Fire Attack links here; 09.1.1 PASS; 04.1 Mayday, Self-Survival and Air Management.", "note_html": "Study aid only. Camera specs are from the FLIR K33/K53 and K45/K55/K65 user manuals and a Bullard brochure. Check your own camera's manual. NFPA 1801 (thermal imagers) is cited by number only."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 410.99, "y": 477.53, "angle": 136.5, "vx": 652.22, "vy": 504.66, "vangle": 21.5}, "09.2": {"id": "09.2", "name": "Radio Communications and Mayday Procedures", "path": "09", "kind": "main", "parent": null, "prereqRaw": "09.1", "children": [], "prereqs": ["09.1"], "unlocks": ["09.4", "09.C"], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 640, "y": 450.0, "vx": 615.0, "vy": 640, "vangle": null}, "09.3": {"id": "09.3", "name": "SCBA Telemetry and Electronic Accountability (MSA A2, Scott)", "path": "09", "kind": "main", "parent": null, "prereqRaw": "09.1, 01.2", "children": [], "prereqs": ["09.1", "01.2"], "unlocks": ["09.C"], "cross": ["01.2.2"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 840, "y": 450.0, "vx": 615.0, "vy": 790, "vangle": null}, "09.4": {"id": "09.4", "name": "Incident Command System (NIMS/ICS)", "path": "09", "kind": "main", "parent": null, "prereqRaw": "09.2", "children": [], "prereqs": ["09.2"], "unlocks": ["09.C"], "cross": ["10.6.8"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1040, "y": 450.0, "vx": 615.0, "vy": 940, "vangle": null}, "09.C": {"id": "09.C", "name": "CAPSTONE: Incident Safety / Accountability Officer", "path": "09", "kind": "capstone", "parent": null, "prereqRaw": "09.1 to 09.4", "children": [], "prereqs": ["09.1", "09.2", "09.3", "09.4"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1640, "y": 450.0, "vx": 615.0, "vy": 1390, "vangle": null}, "10.1": {"id": "10.1", "name": "Station Life, Daily Apparatus and Equipment Checks", "path": "10", "kind": "main", "parent": null, "prereqRaw": "01.0", "children": [], "prereqs": ["01.0"], "unlocks": ["10.2", "10.6", "10.C"], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 440, "y": 600.0, "vx": 820.0, "vy": 490, "vangle": null}, "10.2": {"id": "10.2", "name": "Certification Ladder (FF I/II, Driver, Instructor, Officer)", "path": "10", "kind": "main", "parent": null, "prereqRaw": "10.1", "children": [], "prereqs": ["10.1"], "unlocks": ["10.3", "10.4", "10.C"], "cross": ["10.6", "10.6.7", "10.6.0"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 640, "y": 600.0, "vx": 820.0, "vy": 640, "vangle": null}, "10.3": {"id": "10.3", "name": "Company Officer: Strategy and Tactics (USFA STICO/PICO)", "path": "10", "kind": "main", "parent": null, "prereqRaw": "10.2, 02.5", "children": [], "prereqs": ["10.2", "02.5"], "unlocks": ["10.5", "10.C"], "cross": ["02.5"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 840, "y": 600.0, "vx": 820.0, "vy": 790, "vangle": null}, "10.4": {"id": "10.4", "name": "Fire Instructor and Training Safety", "path": "10", "kind": "main", "parent": null, "prereqRaw": "10.2, 01.5", "children": [], "prereqs": ["10.2", "01.5"], "unlocks": ["10.C"], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1040, "y": 600.0, "vx": 820.0, "vy": 940, "vangle": null}, "10.5": {"id": "10.5", "name": "Promotional Exam Prep and Leadership", "path": "10", "kind": "main", "parent": null, "prereqRaw": "10.3", "children": [], "prereqs": ["10.3"], "unlocks": ["10.C"], "cross": ["10.6.7"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1240, "y": 600.0, "vx": 820.0, "vy": 1090, "vangle": null}, "10.6": {"id": "10.6", "name": "CAL FIRE Career Path", "path": "10", "kind": "main", "parent": null, "prereqRaw": "10.1", "children": ["10.6.0", "10.6.1", "10.6.10", "10.6.11", "10.6.12", "10.6.13", "10.6.2", "10.6.3", "10.6.4", "10.6.5", "10.6.6", "10.6.7", "10.6.8", "10.6.9"], "prereqs": ["10.1"], "unlocks": ["10.6.0", "10.6.1", "10.6.2", "10.6.3", "10.6.4", "10.6.5", "10.6.6", "10.6.7", "10.6.8", "10.6.9", "10.6.10", "10.6.11", "10.6.12", "10.6.13", "10.C"], "cross": ["10.2"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1440, "y": 600.0, "vx": 820.0, "vy": 1240, "vangle": null}, "10.6.0": {"id": "10.6.0", "name": "CAL FIRE Overview (Mission, Size, and Headquarters)", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.2"], "doc": {"title": "10.6.0 CAL FIRE Overview (Mission, Size, and Headquarters)", "file": "10.6.0_CAL_FIRE_Overview_Mission_Size_and_Headquarters.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>The <strong>California Department of Forestry and Fire Protection (CAL FIRE)<\/strong>. Its stated mission: to <strong>serve and safeguard the people and protect the property and resources of California<\/strong>. Shared values: <strong>Integrity, Service, Community, Diversity<\/strong>. The About page says CAL FIRE \"celebrates nearly 140 years of history.\"<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>People:<\/strong> \"nearly 12,000 permanent and seasonal employees\" (FFI posting JC-533177).<\/li><li><strong>Budget (2026-27 Governor's Budget):<\/strong> $5.3 billion ($2.2 billion General Fund) and <strong>14,044 positions<\/strong>. Employees and budgeted positions are different measures from different sources. Don't merge them.<\/li><li><strong>Land:<\/strong> responsible for <strong>over 31 million acres<\/strong> of State Responsibility Area (SRA). SRA is in <strong>56 of 58 counties<\/strong>. CAL FIRE provides emergency services in <strong>36 of 58 counties<\/strong>.<\/li><li><strong>Stations:<\/strong> the 2026-27 Budget says CAL FIRE \"operates 237 fire stations.\"<\/li><li><strong>Initial attack goal:<\/strong> aircraft can reach remote areas in about <strong>20 minutes<\/strong>, with the goal of keeping <strong>95% of fires at 10 acres or less<\/strong>.<\/li><li><strong>Sacramento HQ:<\/strong> 715 P St, Sacramento, CA 95814. Phone 916-653-5123. Mail: P.O. Box 944246, Sacramento, CA 94244-2460.<\/li><li><strong>Human Resources / Examination Unit:<\/strong> 710 Riverpoint Ct, West Sacramento, CA 95605 (916-894-9900).<\/li><li><strong>Recruitment:<\/strong> CALFIRErecruitment@fire.ca.gov, (916) 894-9585.<\/li><li><strong>Executive staff (as published):<\/strong> Joe Tyler, Director/Fire Chief. Anale Burlew, Chief Deputy Director, Operations. Kerry Garcia, Chief Deputy Director, Administration. Daniel Berlant, State Fire Marshal.<\/li><li><strong>Newest top post:<\/strong> Chief Deputy Director, Administration (effective 17 Feb 2025). It's \"a newly established position\" for day-to-day administration, working with the Chief Deputy Director of Operations and the State Fire Marshal.<\/li><li><strong>Org chart:<\/strong> Ranger found <strong>no official CAL FIRE org-chart graphic<\/strong>. The command structure in 10.6.1 comes from official text, not a chart.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>All-risk department:<\/strong> \"Beyond its wildland firefighting role, CAL FIRE is an 'all-risk' department.\" It runs medical aids, hazmat spills, swift-water rescue, search and rescue, civil disturbances, train wrecks, floods, and earthquakes.<\/li><li><strong>Prevention is part of the mission:<\/strong> preventing wildfires in the SRA is \"a vital part of CAL FIRE's mission\" (Our Organization page).<\/li><li><strong>Where to send things:<\/strong> policy and executive contacts go to Sacramento HQ. Exam applications go to the Examination Unit in West Sacramento. <strong>FFI application packages<\/strong> go to Southern Region Hiring in Fresno (see 10.6.5).<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li>The Office of the State Fire Marshal has been \"part of the CAL FIRE team since 1995\" (Our Organization page).<\/li><li>The Forest Practice Act dates to 1945 and was revised in 1973 (Our Organization page).<\/li><\/ul>"}], "qa": [{"n": 1, "q": "A friend says CAL FIRE \"just fights brush fires.\" Correct them using the department's own wording, and name at least four non-fire incident types.", "a": "The Our Organization page says that beyond its wildland role, CAL FIRE is an \"all-risk\" department. Examples: medical aids, hazmat spills, swift-water rescues, search and rescue, civil disturbances, train wrecks, floods, and earthquakes. The Fire Protection page also lists structure fires, accidents, heart attacks, and lost hikers.", "qh": "A friend says CAL FIRE \"just fights brush fires.\" Correct them using the department's own wording, and name at least four non-fire incident types.", "ah": "The Our Organization page says that beyond its wildland role, CAL FIRE is an \"all-risk\" department. Examples: medical aids, hazmat spills, swift-water rescues, search and rescue, civil disturbances, train wrecks, floods, and earthquakes. The Fire Protection page also lists structure fires, accidents, heart attacks, and lost hikers."}, {"n": 2, "q": "Someone quotes \"about 12,000 people,\" and someone else quotes \"14,044 positions.\" Is one of them wrong? How should you present both?", "a": "Neither is wrong. They measure different things from different sources. \"Nearly 12,000 permanent and seasonal employees\" is from the FFI posting (JC-533177). \"14,044 positions\" is budgeted positions in the 2026-27 Governor's Budget. Cite each with its source and don't average them.", "qh": "Someone quotes \"about 12,000 people,\" and someone else quotes \"14,044 positions.\" Is one of them wrong? How should you present both?", "ah": "Neither is wrong. They measure different things from different sources. \"Nearly 12,000 permanent and seasonal employees\" is from the FFI posting (JC-533177). \"14,044 positions\" is budgeted positions in the 2026-27 Governor's Budget. Cite each with its source and don't average them."}, {"n": 3, "q": "Your county has State Responsibility Area land. Does that automatically mean CAL FIRE crews do the initial attack there? Explain with the county figures.", "a": "No. SRA is in 56 of 58 counties, but CAL FIRE provides emergency services in 36. In six Contract Counties (Kern, Los Angeles, Marin, Orange, Santa Barbara, Ventura), the county protects the SRA under contract with CAL FIRE (Cooperative Efforts page; see 10.6.4).", "qh": "Your county has State Responsibility Area land. Does that automatically mean CAL FIRE crews do the initial attack there? Explain with the county figures.", "ah": "No. SRA is in 56 of 58 counties, but CAL FIRE provides emergency services in 36. In six Contract Counties (Kern, Los Angeles, Marin, Orange, Santa Barbara, Ventura), the county protects the SRA under contract with CAL FIRE (Cooperative Efforts page; see 10.6.4)."}, {"n": 4, "q": "State CAL FIRE's initial-attack aviation goal and the fire-size target it supports.", "a": "Initial-attack aircraft can reach even the most remote parts of California in about 20 minutes. The goal is keeping 95% of fires at 10 acres or less (What We Do page).", "qh": "State CAL FIRE's initial-attack aviation goal and the fire-size target it supports.", "ah": "Initial-attack aircraft can reach even the most remote parts of California in about 20 minutes. The goal is keeping 95% of fires at 10 acres or less (What We Do page)."}, {"n": 5, "q": "You need to (a) mail an FFI application package, (b) file a promotional exam application on paper, and (c) reach the Director's office. Where does each go?", "a": "(a) CAL FIRE Southern Region Hiring, 1234 East Shaw Avenue, Fresno (or online through CalCareers). (b) The Examination Unit, 710 Riverpoint Ct, West Sacramento. (c) HQ at 715 P St, Sacramento (executive office HQ.Executive@fire.ca.gov). Sources: JC-533177, exam bulletin EX-4883, Contacts page.", "qh": "You need to (a) mail an FFI application package, (b) file a promotional exam application on paper, and (c) reach the Director's office. Where does each go?", "ah": "(a) CAL FIRE Southern Region Hiring, 1234 East Shaw Avenue, Fresno (or online through CalCareers). (b) The Examination Unit, 710 Riverpoint Ct, West Sacramento. (c) HQ at 715 P St, Sacramento (executive office HQ.Executive@fire.ca.gov). Sources: JC-533177, exam bulletin EX-4883, Contacts page."}, {"n": 6, "q": "What executive position did CAL FIRE create in 2025, who holds it, and what is it for?", "a": "Chief Deputy Director, Administration, held by Kerry Garcia, effective 17 Feb 2025. Her profile calls it a newly established position focused on day-to-day administration, working with the Chief Deputy Director of Operations and the State Fire Marshal.", "qh": "What executive position did CAL FIRE create in 2025, who holds it, and what is it for?", "ah": "Chief Deputy Director, Administration, held by Kerry Garcia, effective 17 Feb 2025. Her profile calls it a newly established position focused on day-to-day administration, working with the Chief Deputy Director of Operations and the State Fire Marshal."}, {"n": 7, "q": "Give the CAL FIRE mission statement and its four shared values.", "a": "Mission: serve and safeguard the people and protect the property and resources of California. Values: Integrity, Service, Community, Diversity (About page).", "qh": "Give the CAL FIRE mission statement and its four shared values.", "ah": "Mission: serve and safeguard the people and protect the property and resources of California. Values: Integrity, Service, Community, Diversity (About page)."}, {"n": 8, "q": "A classmate hands you a \"CAL FIRE org chart\" from a random website. What does the record say about an official org chart, and where does the command structure in this tree come from?", "a": "Ranger found no official CAL FIRE org-chart graphic (batch 04). The Our Organization page, Executive Staff list, and eBudget 3540 are text or budget displays, not charts. The command structure here comes from official text: exam bulletins, the Contacts page, and GIS metadata.", "qh": "A classmate hands you a \"CAL FIRE org chart\" from a random website. What does the record say about an official org chart, and where does the command structure in this tree come from?", "ah": "Ranger found no official CAL FIRE org-chart graphic (batch 04). The Our Organization page, Executive Staff list, and eBudget 3540 are text or budget displays, not charts. The command structure here comes from official text: exam bulletins, the Contacts page, and GIS metadata."}], "sources": [{"label": "CAL FIRE About", "url": "https://www.fire.ca.gov/about"}, {"label": "CAL FIRE Our Organization", "url": "https://www.fire.ca.gov/about/our-organization"}, {"label": "CAL FIRE Executive Staff", "url": "https://www.fire.ca.gov/about/executive-staff"}, {"label": "Kerry Garcia profile", "url": "https://www.fire.ca.gov/about/executive-staff/profile-list/kerry-garcia"}, {"label": "CAL FIRE Contacts", "url": "https://www.fire.ca.gov/about/resources/cal-fire-contacts"}, {"label": "CAL FIRE What We Do", "url": "https://www.fire.ca.gov/what-we-do"}, {"label": "CAL FIRE Fire Protection", "url": "https://www.fire.ca.gov/what-we-do/fire-protection"}, {"label": "Cooperative Efforts (Contract Counties)", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/cooperative-efforts/"}, {"label": "Firefighter I posting JC-533177", "url": "https://calcareers.ca.gov/CalHrPublic/Jobs/JobPosting.aspx?JobControlId=533177"}, {"label": "Assistant Chief exam bulletin EX-4883", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4883"}, {"label": "2026-27 Governor's Budget Summary, Natural Resources", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}, {"label": "2026-27 Governor's Budget, Organization 3540", "url": "https://ebudget.ca.gov/2026-27/pdf/GovernorsBudget/3000/3540.pdf"}, {"label": "Ranger batches: /workspace/can-report/calfire/calfire-batch-01.md, calfire-batch-02.md, calfire-batch-04.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 0. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 10.2 Certification Ladder (statewide OSFM path).", "note_html": "Study aid only. Source: Ranger calfire-batch-01, -02, and -04 (official fire.ca.gov, CalCareers, and 2026-27 Governor's Budget pages, retrieved 17 Nov 2026). Names, phones, and counts change. Check the live pages."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1469.01, "y": 627.53, "angle": 43.5, "vx": 832.69, "vy": 1202.07, "vangle": 288.5}, "10.6.1": {"id": "10.6.1", "name": "Command Structure: Regions, Units, and Battalions", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": [], "doc": {"title": "10.6.1 Command Structure: Regions, Units, and Battalions", "file": "10.6.1_Command_Structure_Regions_Units_and_Battalions.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>CAL FIRE's official GIS metadata says: \"CAL FIRE administrative levels include statewide (Headquarters), Regions and Units.\" There are <strong>two regions<\/strong>, <strong>Northern<\/strong> (CNR) and <strong>Southern<\/strong> (CSR), and <strong>21 field units<\/strong> (12 Northern, 9 Southern). Inside a unit, <strong>Battalion Chiefs<\/strong> run subunits and <strong>Assistant Chiefs<\/strong> serve as Division or Deputy Chiefs. The six Contract Counties are covered in 10.6.4.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Region chiefs (Contacts page):<\/strong> Northern, George Morris III, (530) 224-2460. Southern, Mike van Loben Sels, (951) 314-3425. Each region also has two Assistant Region Chiefs.<\/li><li><strong>Region HQ (Facilities Public View, TYPE=RHQ):<\/strong><ul><li>Northern RHQ: 135 Ridgeway Ave, Santa Rosa (707-576-2275).<\/li><li>Southern RHQ: 1234 East Shaw, Fresno (559-222-2129). This is also the FFI hiring address.<\/li><li>There's also a separate <strong>Northern Operations Center<\/strong>: 6101 Airport Road, Redding. Both are official records, so don't collapse them into one \"Northern HQ.\"<\/li><\/ul><\/li><li><strong>Administrative Units GIS:<\/strong> 27 polygons = 21 field units + 6 Contract Counties (Marin MRN is Northern; Kern KRN, Los Angeles LAC, Orange ORC, Santa Barbara SBC, and Ventura VNC are Southern).<\/li><\/ul><p><strong>The 21 units<\/strong> (code: counties from the 2026 Unit Fire Plan title; HQ town from Contacts):<\/p><p>Northern (12):<\/p><ul><li><strong>HUU<\/strong> Humboldt-Del Norte: Humboldt, Del Norte. HQ Fortuna.<\/li><li><strong>SKU<\/strong> Siskiyou: Siskiyou. HQ Yreka.<\/li><li><strong>LMU<\/strong> Lassen-Modoc: Lassen, Modoc, Plumas. HQ Susanville.<\/li><li><strong>SHU<\/strong> Shasta-Trinity: Shasta, Trinity. HQ Redding.<\/li><li><strong>MEU<\/strong> Mendocino: Mendocino. HQ Willits.<\/li><li><strong>TGU<\/strong> Tehama-Glenn: Tehama, Glenn. HQ Red Bluff.<\/li><li><strong>BTU<\/strong> Butte: Butte. HQ Oroville.<\/li><li><strong>LNU<\/strong> Sonoma-Lake-Napa: Sonoma, Lake, Napa, Solano, Yolo, Colusa. HQ St. Helena.<\/li><li><strong>NEU<\/strong> Nevada-Yuba-Placer: Nevada, Yuba, Placer, Sierra, Sutter. HQ Auburn.<\/li><li><strong>AEU<\/strong> Amador-El Dorado: Amador, El Dorado, Alpine, Sacramento. HQ Camino.<\/li><li><strong>SCU<\/strong> Santa Clara: Santa Clara, Contra Costa, Alameda (West), Stanislaus (West), San Joaquin. HQ Morgan Hill.<\/li><li><strong>CZU<\/strong> San Mateo-Santa Cruz: San Mateo, Santa Cruz, San Francisco. HQ Felton.<\/li><\/ul><p>Southern (9):<\/p><ul><li><strong>TCU<\/strong> Tuolumne-Calaveras: Tuolumne, Calaveras (East), San Joaquin (East), Stanislaus. HQ San Andreas.<\/li><li><strong>MMU<\/strong> Madera-Mariposa-Merced: Madera, Mariposa, Merced. HQ Mariposa.<\/li><li><strong>FKU<\/strong> Fresno-Kings: Fresno, Kings. HQ Sanger.<\/li><li><strong>TUU<\/strong> Tulare: Tulare. HQ Visalia.<\/li><li><strong>BEU<\/strong> San Benito-Monterey: San Benito, Monterey. HQ Monterey.<\/li><li><strong>SLU<\/strong> San Luis Obispo: San Luis Obispo. HQ San Luis Obispo.<\/li><li><strong>BDU<\/strong> San Bernardino: San Bernardino, Inyo, Mono. HQ San Bernardino.<\/li><li><strong>RRU<\/strong> Riverside: Riverside. HQ Perris.<\/li><li><strong>SDU<\/strong> San Diego: San Diego, Imperial. HQ El Cajon.<\/li><li><strong>Unit Chief (class 1037):<\/strong> \"management responsibility for a specified geographical area called a unit.\" Oversees all operational and administrative functions. Serves as the State Office of Emergency Services <strong>Operational Area Coordinator<\/strong>, coordinates contract fire protection with local governments, and is the liaison to CDCR on cooperative programs (EX-5386).<\/li><li><strong>Assistant Chief (class 1039):<\/strong> \"the full supervisory level.\" In a typical unit, ACs serve as <strong>Division Chiefs<\/strong> over the whole administrative program, the operations program, or a conservation camp. In very large, complex units they may serve as <strong>Deputy Chiefs<\/strong> (EX-4883).<\/li><li><strong>Battalion Chief (class 9723):<\/strong> \"the first working supervisory level.\" BCs are <strong>subunit managers<\/strong> directing programs such as training, safety, the emergency command center, fire prevention, air operations, camps, and fire stations (Join CAL FIRE).<\/li><li><strong>Division Chief and Deputy Chief<\/strong> are assignments of the Assistant Chief class, not separate fire-protection class codes. One exception is a distinct class: <strong>Division Chief, California State Fire Marshal's Office (8966)<\/strong>.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Work Location Form:<\/strong> FFI applicants rank units by name, region, and code (see 10.6.5). Knowing which unit covers which county tells you where you might work.<\/li><li><strong>Name variants:<\/strong> the Contacts page prints \"Nevada-Yuba Placer,\" while the WLF and GIS use \"Nevada-Yuba-Placer.\" GIS prints \"Sonoma-Lake Napa.\" The unit codes (NEU, LNU) are the reliable keys.<\/li><li><strong>Partial counties:<\/strong> some plan titles split a county, such as \"Alameda (West)\" or \"Calaveras (East).\" San Joaquin and Stanislaus each appear in two unit titles (SCU and TCU).<\/li><li><strong>Phone conflicts:<\/strong> some Contacts phones differ from Facilities HQ phones. For example, TUU is 916-584-1447 (Contacts) vs 559-732-5954 (Facilities), and BEU is 209-385-7344 vs 831-333-4600. Both are official, so record both and don't \"fix\" either.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li><strong>MVU / Monte Vista (legacy San Diego code):<\/strong> an older unofficial file used MVU for San Diego. The current official code is <strong>SDU<\/strong> (Contacts page, Administrative Units GIS, and every live Facilities record). MVU still shows up only as a historic domain value and in some legacy CAD names and AKAs, such as \"MVU Ramona AAB\" and \"Monte Vista FS 20.\"<\/li><li>The archived CalHR Chief-series specification (2015 Wayback snapshot, footer \"Updated 6/3/2012\") gives the same BC/AC/Unit Chief level definitions. It may predate later changes.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Walk the chain from statewide to field level, naming each level and the rank that leads it below the region.", "a": "Headquarters (statewide), then Region (Northern or Southern, led by a Region Chief), then Unit (Unit Chief), then subunits or battalions (Battalion Chiefs). Assistant Chiefs serve between the BC and the Unit Chief as Division or Deputy Chiefs. Sources: GIS metadata, Contacts page, EX-5386, EX-4883, Join CAL FIRE BC page.", "qh": "Walk the chain from statewide to field level, naming each level and the rank that leads it below the region.", "ah": "Headquarters (statewide), then Region (Northern or Southern, led by a Region Chief), then Unit (Unit Chief), then subunits or battalions (Battalion Chiefs). Assistant Chiefs serve between the BC and the Unit Chief as Division or Deputy Chiefs. Sources: GIS metadata, Contacts page, EX-5386, EX-4883, Join CAL FIRE BC page."}, {"n": 2, "q": "You're promoted to Assistant Chief and assigned as \"Division Chief, Operations.\" What's your civil-service class? Is \"Division Chief\" a separate CAL FIRE fire-protection class? Name the one Division Chief class that does exist.", "a": "You're an Assistant Chief (class 1039). Division Chief is an assignment of that class, not a separate fire-protection class code. The distinct class is Division Chief, California State Fire Marshal's Office (8966), on the CalHR pay scale.", "qh": "You're promoted to Assistant Chief and assigned as \"Division Chief, Operations.\" What's your civil-service class? Is \"Division Chief\" a separate CAL FIRE fire-protection class? Name the one Division Chief class that does exist.", "ah": "You're an Assistant Chief (class 1039). Division Chief is an assignment of that class, not a separate fire-protection class code. The distinct class is Division Chief, California State Fire Marshal's Office (8966), on the CalHR pay scale."}, {"n": 3, "q": "An FFI
