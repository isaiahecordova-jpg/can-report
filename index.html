they add certificates later?", "a": "Apply anyway. The posting says candidates are \"still encouraged to apply.\" With no acceptable documentation they'd be Category 3. Later certificates can be emailed to FFHiring@fire.ca.gov or mailed or dropped off in Fresno.", "qh": "An applicant has none of the required certificates yet. Should they wait a season? What happens to their placement, and how do they add certificates later?", "ah": "Apply anyway. The posting says candidates are \"still encouraged to apply.\" With no acceptable documentation they'd be Category 3. Later certificates can be emailed to FFHiring@fire.ca.gov or mailed or dropped off in Fresno.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Apply now as Category 3; add certificates later by email, mail, or drop-off in Fresno", "wh": ["Wait a season; applications without certificates are rejected outright", "Apply now as Category 2; add certificates later only by reapplying online", "Apply now as Category 3; certificates can't be added until next hiring year"], "hash": "sha256:b63c3d466ed363218d9454eadd95c0496ab0160688d2a3c81e9d138e89eccca8"}, {"n": 8, "q": "An applicant wants offers only in the Northern Region and ranks just four units, leaving the rest blank. Per the 2027 FFI Work Location Form, will they be considered for the units they left blank? Can they change the form later?", "a": "No. The FFI form says \"You will not be considered for a job in any location(s) you have not ranked by number.\" They \"may submit an updated Work Location Form ONE TIME,\" and changes take effect based on the cutoff dates in the Fire Fighter I Vacancy Advertisement (2027 FFI Work Location Form).", "qh": "An applicant wants offers only in the Northern Region and ranks just four units, leaving the rest blank. Per the 2027 FFI Work Location Form, will they be considered for the units they left blank? Can they change the form later?", "ah": "No. The FFI form says \"You will not be considered for a job in any location(s) you have not ranked by number.\" They \"may submit an updated Work Location Form ONE TIME,\" and changes take effect based on the cutoff dates in the Fire Fighter I Vacancy Advertisement (2027 FFI Work Location Form).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Not considered for unranked units; they may submit an updated form one time", "wh": ["Considered for the nearest Northern unit; the form can't be updated", "Not considered for unranked units; the form can't be updated after filing", "Considered for any unit statewide; they may submit an updated form one time"], "hash": "sha256:6b495aba4cf8a2771874ea713d4e265f352478648165a18176f5ac66e83b2ccf"}, {"n": 9, "q": "How do you submit the package, and what are two things that will get it handled wrong?", "a": "Online through CalCareers, or by mail or drop-off at CAL FIRE Southern Region Hiring, 1234 East Shaw Avenue, Fresno. Mistakes include sending it by fax or email (not accepted), putting multiple classifications in one package, or attaching certificates that aren't on the list (those go on the resume).", "qh": "How do you submit the package, and what are two things that will get it handled wrong?", "ah": "Online through CalCareers, or by mail or drop-off at CAL FIRE Southern Region Hiring, 1234 East Shaw Avenue, Fresno. Mistakes include sending it by fax or email (not accepted), putting multiple classifications in one package, or attaching certificates that aren't on the list (those go on the resume).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "CalCareers, or mail/drop-off in Fresno; no fax or email, one classification per package", "wh": ["CalCareers, or email to FFHiring; no fax, one classification per package", "CalCareers, or mail/drop-off in Fresno; fax is fine, several classes per package", "Mail to the unit HQ only; no fax or email, one classification per package"], "hash": "sha256:9e350cec88793e1ec9ec31e686ebff8d494473f92728e29924f39e97211fc257"}, {"n": 10, "q": "Is a CPAT card listed as an FFI minimum qualification on JC-533177? Where does CPAT show up as an MQ?", "a": "No. CPAT isn't listed as an MQ on JC-533177. It's an MQ for FFII and FAE: you can be admitted to the exam without the card, but you need it before a job offer (EX-4603, EX-4473).", "qh": "Is a CPAT card listed as an FFI minimum qualification on JC-533177? Where does CPAT show up as an MQ?", "ah": "No. CPAT isn't listed as an MQ on JC-533177. It's an MQ for FFII and FAE: you can be admitted to the exam without the card, but you need it before a job offer (EX-4603, EX-4473).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No: CPAT is an MQ for FFII and FAE, needed before a job offer", "wh": ["Yes: FFI applicants must attach a current CPAT card to the package", "No: CPAT is an MQ for FFII and FAE, needed before the exam", "No: CPAT is an MQ only for Fire Captain, needed before promotion"], "hash": "sha256:4f1fb96c377a44437922a8d3194c5f432a41c97db447902e198f8b479eac768a"}, {"n": 11, "q": "Name the medical condition of hire on the FFI posting.", "a": "Medical clearance before hire, including passing medical clearances under the Respiratory Protection Program (JC-533177).", "qh": "Name the medical condition of hire on the FFI posting.", "ah": "Medical clearance before hire, including passing medical clearances under the Respiratory Protection Program (JC-533177).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Medical clearance, including Respiratory Protection Program clearances", "wh": ["A CPAT pass within 12 months, including a treadmill stress test", "Medical clearance, including a Hearing Conservation Program audiogram only", "A self-certified health questionnaire, with clearance after the academy"], "hash": "sha256:e4bdf895a06a6e41cf726fe516f8f3c3d77f9efec4e1d7c3357b262ff9047162"}, {"n": 12, "q": "When does the hiring pool start making offers, and how long is it used?", "a": "Offers are expected starting the week of 4 Jan 2027, and the pool fills vacancies through 31 Oct 2027 (JC-533177).", "qh": "When does the hiring pool start making offers, and how long is it used?", "ah": "Offers are expected starting the week of 4 Jan 2027, and the pool fills vacancies through 31 Oct 2027 (JC-533177).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Offers from the week of 4 Jan 2027; the pool runs through 31 Oct 2027", "wh": ["Offers from the week of 4 Jan 2027; the pool runs through 31 Dec 2027", "Offers from the week of 1 Oct 2026; the pool runs through 31 Oct 2027", "Offers from the week of 4 Jan 2027; the pool runs through 30 Jun 2027"], "hash": "sha256:78e98cf36c0a462dc09d2e3cdcda3203ff3754d38c05602083b092a06b109e56"}], "sources": [{"label": "Firefighter I posting JC-533177", "url": "https://calcareers.ca.gov/CalHrPublic/Jobs/JobPosting.aspx?JobControlId=533177"}, {"label": "STD 678 (hard copy)", "url": "https://calcareers.ca.gov/pdf/std678.pdf"}, {"label": "FFI Applicant Information Sheet (required trainings)", "url": "https://www.fire.ca.gov/-/media/1EAFA2A1528141EE892CB692D4B982E0"}, {"label": "FFI Applicant Information Sheet (alternate URL)", "url": "https://www.fire.ca.gov/join-calfire/-/media/calfire-website/direct-links/required-trainings.pdf"}, {"label": "CAL FIRE Acceptable Documents (FFI, FFII, FAE; 2027 season and beyond)", "url": "https://www.fire.ca.gov/-/media/BF147896DED446F9B142FEF464A0E9AD"}, {"label": "PO-299 Authorization to Release Information", "url": "https://www.fire.ca.gov/-/media/D817B8E27D8049C3BC35297686467FB9"}, {"label": "2027 Work Location Form", "url": "https://incidents.fire.ca.gov/media/42chxu24/2027-wlf.pdf"}, {"label": "Bypass-a-missing-item directions", "url": "https://www.fire.ca.gov/-/media/5775A4D5B1124F37BA97020F60EDF81C"}, {"label": "Join CAL FIRE, Fire Fighter I", "url": "https://www.joincalfire.com/classifications/fire-protection/firefighting-and-paramedics/fire-fighter-i"}, {"label": "FFII exam bulletin EX-4603", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4603"}, {"label": "FAE exam bulletin EX-4473", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4473"}, {"label": "Ranger batches: /workspace/can-report/calfire/calfire-batch-01.md, calfire-batch-01-addendum.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 5. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 10.6.12 Peak and Base Staffing (Seasonal, Year-Round, and Workweek).", "note_html": "Study aid only. Source: FFI posting JC-533177 (final filing date 11/30/2026), the FFI Applicant Information Sheet, the CAL FIRE Acceptable Documents file (\"effective for the 2027 season and beyond\"), the 2027 Work Location Form, and Join CAL FIRE (Ranger calfire-batch-01 and addendum). Postings change every season, so always read the live one."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1384.3, "y": 639.0, "angle": 145.0, "vx": 780.55, "vy": 1233.4, "vangle": 189.5}, "10.6.6": {"id": "10.6.6", "name": "CAL FIRE Academy and Training Centers", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": [], "doc": {"title": "10.6.6 CAL FIRE Academy and Training Centers", "file": "10.6.6_CAL_FIRE_Academy_and_Training_Centers.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>CAL FIRE \"operates four state-of-the-art Training Centers.\" They provide \"year-round training in fire prevention and protection, emergency response, law enforcement and enhancement of natural resource systems.\" Curricula include fire control, arson investigation, leadership development, forest practice enforcement, aviation, and specialized courses. Allied agencies also attend.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Ione Training Center (est. 1967):<\/strong> on 420 acres in Amador County, in the City of Ione, about 35 miles southeast of Sacramento. It's an <strong>OSFM State Fire Training Accredited Local Academy (ALA)<\/strong> at 4501 State Highway 104, Ione, CA 95640.<\/li><li><strong>Riverside Training Center (est. 2017):<\/strong> at the Ben Clark Public Safety Training Center in Riverside. It was set up because of \"trends related to the increasing size and severity of wildfires.\"<\/li><li><strong>Redding Training Center (est. 2023):<\/strong> at Shasta College in Redding, to add employees and expand training further north.<\/li><li><strong>Atwater Training Center (est. 2025):<\/strong> at Castle Airport and Development Center in Atwater. It was set up \"to meet the Department's full alignment with IFSAC and Pro Board Testing and State Fire Training Fire Fighter 1 certification\" and growing hiring needs.<\/li><li><strong>Two different academies:<\/strong> the <strong>Fire Fighter Academy (FFA)<\/strong> is entry level. The <strong>Company Officer Academy (COA)<\/strong> is promotional. In 2025, \"CAL FIRE graduated a record 658 new Fire Apparatus Engineers through the Company Officer Academy.\" More than 600 more Company Officers are projected for 2026 (2026-27 Budget).<\/li><li><strong>What counts as an FFA certificate (Acceptable Documents):<\/strong> CAL FIRE FFA, CAL FIRE Fire Control Training (Firefighter), or the CAL FIRE Fire Fighter Module.<\/li><li><strong>What counts as a COA certificate:<\/strong> CAL FIRE COA, or CAL FIRE Fire Control Training (Company Officer).<\/li><li><strong>Other CAL FIRE course certificates on the file:<\/strong> Wildland Safety and Survival Level 1, and Chainsaw Operations (C-212).<\/li><li><strong>2026 FFA length is unclear.<\/strong> Two sources disagree, and neither is confirmed as the 2026 length:<ul><li>7 weeks (unclear): the Training Center page's \"Inside Look\" teaser, \"Learn about the 7 week training program,\" retrieved 17 Nov 2026.<\/li><li>4 weeks (unclear): a CAL FIRE memo dated 2 May 2022, which planned a 4-week FFA-2022 (with SFT FF1 as a prerequisite) and kept the 7-week FFA-2019 until 1 Jan 2024. It's a transition plan, not a 2026 catalog.<\/li><li>No official 2026 FFA catalog was found.<\/li><\/ul><\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Certification testing:<\/strong> as an SFT accredited academy, Ione falls under OSFM's process. Students at an accredited academy are automatically signed up for the FF1 certification exam (OSFM FF1 page, see 10.2).<\/li><li><strong>Promotion:<\/strong> the Battalion Chief HFEO pattern requires \"Basic Fire Control training which includes the Fire Fighter Academy and Company Officer Academy\" (Join CAL FIRE).<\/li><li><strong>FAE to Captain:<\/strong> COA graduates start a <strong>three-year apprenticeship<\/strong> toward Fire Captain (2026-27 Budget).<\/li><li><strong>Growth:<\/strong> the Relief Staffing budget item ($175.3 million, 576 positions) includes expanded training-center positions.<\/li><li><strong>Not just fire-series ranks:<\/strong> one Forestry Assistant II duty statement (Unit Forester, Tulare Unit, effective 07/01/2026) makes completing the CAL FIRE <strong>Firefighter Academy (FFA) and Company Officer Academy (COA)<\/strong> during probation a condition of employment. It gives no academy length, so it doesn't settle the FFA-length question above (batch 05).<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Wildland Safety and Survival Level 1 and Fire Fighter Survival (Structural) are both CAL FIRE/SFT courses on the Acceptable Documents file (the latter must be 2010 or newer). Chainsaw Operations (C-212) also appears, with a note on \"Qualification cards and refresher training.\"<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li><strong>2022 memo (2 May 2022):<\/strong> starting 9 May 2022, CAL FIRE would begin moving to FFA-2022, a 4-week course with SFT FF1 as a prerequisite. The Training Center would keep teaching the 7-week FFA-2019 until full SFT FF1 implementation on 1 Jan 2024.<\/li><li>The same memo aligned FFI training with SFT curriculum: 1A Structure, 1B HazMat, 1C Wildland (or NWCG equivalent), plus a Fire Protection Orientation Course. It retired <strong>Basic Firefighter (BFF)<\/strong> on 1 Sep 2022 and set different paths for FFI-Crew and FFI-Engine.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Which CAL FIRE training center is the oldest, where is it, and what OSFM status does it hold?", "a": "Ione, established 1967, on 420 acres in Amador County about 35 miles southeast of Sacramento. It's an OSFM State Fire Training Accredited Local Academy (Training Center page, OSFM Accredited Academies).", "qh": "Which CAL FIRE training center is the oldest, where is it, and what OSFM status does it hold?", "ah": "Ione, established 1967, on 420 acres in Amador County about 35 miles southeast of Sacramento. It's an OSFM State Fire Training Accredited Local Academy (Training Center page, OSFM Accredited Academies).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Ione (1967), 420 acres in Amador County; an OSFM SFT Accredited Local Academy", "wh": ["Ione (1967), 420 acres in Amador County; an OSFM SFT Accredited Regional Training Program", "Riverside (1967), at the Ben Clark center; an OSFM SFT Accredited Local Academy", "Ione (1976), 240 acres in Amador County; an OSFM SFT Accredited Local Academy"], "hash": "sha256:a51bae4d100b0c10bdce1fadb2fe3174de70ed5a8326e83205f791dad1ae2aab"}, {"n": 2, "q": "Why did CAL FIRE open the Atwater center in 2025?", "a": "\"To meet the Department's full alignment with IFSAC and Pro Board Testing and State Fire Training Fire Fighter 1 certification\" and growing hiring needs (Training Center page).", "qh": "Why did CAL FIRE open the Atwater center in 2025?", "ah": "\"To meet the Department's full alignment with IFSAC and Pro Board Testing and State Fire Training Fire Fighter 1 certification\" and growing hiring needs (Training Center page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Full alignment with IFSAC/Pro Board testing and SFT FF1 certification, plus hiring needs", "wh": ["The increasing size and severity of wildfires in the Central Valley", "To replace the Ione center, which stopped running academies in 2025", "To host the Company Officer Academy for newly promoted Fire Captains"], "hash": "sha256:c337cdf45926d2e84597ed26b8dc4919accbe6ea583175cdebbacc4ea54a65bf"}, {"n": 3, "q": "What trend drove the 2017 Riverside center, and where is it located?", "a": "The increasing size and severity of wildfires. It's at the Ben Clark Public Safety Training Center in Riverside (Training Center page).", "qh": "What trend drove the 2017 Riverside center, and where is it located?", "ah": "The increasing size and severity of wildfires. It's at the Ben Clark Public Safety Training Center in Riverside (Training Center page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Increasing size and severity of wildfires; Ben Clark Public Safety Training Center, Riverside", "wh": ["Full IFSAC and Pro Board alignment; Ben Clark Public Safety Training Center, Riverside", "Increasing size and severity of wildfires; Castle Airport and Development Center, Atwater", "Increasing size and severity of wildfires; Shasta College, Redding"], "hash": "sha256:3ddf914829a56308e7fdf7ce901f83c36d7174c603f87d37701ae6c2e81df5c7"}, {"n": 4, "q": "A friend reads \"658 graduates in 2025\" and says the Firefighter Academy is booming. What did those 658 actually graduate from, and what comes next for them?", "a": "The Company Officer Academy, a promotional academy, not the entry-level Firefighter Academy. The 658 were new Fire Apparatus Engineers, who then begin a three-year apprenticeship toward Fire Captain (2026-27 Budget).", "qh": "A friend reads \"658 graduates in 2025\" and says the Firefighter Academy is booming. What did those 658 actually graduate from, and what comes next for them?", "ah": "The Company Officer Academy, a promotional academy, not the entry-level Firefighter Academy. The 658 were new Fire Apparatus Engineers, who then begin a three-year apprenticeship toward Fire Captain (2026-27 Budget).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "The Company Officer Academy; new FAEs then start a 3-year apprenticeship to Captain", "wh": ["The Firefighter Academy; new FFIs then start their first seasonal assignments", "The Company Officer Academy; new Captains then start a 1-year probation", "The Company Officer Academy; new FAEs then start a 2-year apprenticeship to Captain"], "hash": "sha256:d7b8d06a0ca48ce3c3f9cbcb8288c6fb2b64d5ab0fb35dc9225bfc7930499027"}, {"n": 5, "q": "An applicant has a \"CAL FIRE Fire Control Training, Firefighter\" certificate. Which Acceptable Documents item does it satisfy?", "a": "Item 2, the CAL FIRE Fire Fighter Academy (FFA) Certificate. Qualifying documents are CAL FIRE FFA, Fire Control Training (Firefighter), or the Fire Fighter Module (Acceptable Documents).", "qh": "An applicant has a \"CAL FIRE Fire Control Training, Firefighter\" certificate. Which Acceptable Documents item does it satisfy?", "ah": "Item 2, the CAL FIRE Fire Fighter Academy (FFA) Certificate. Qualifying documents are CAL FIRE FFA, Fire Control Training (Firefighter), or the Fire Fighter Module (Acceptable Documents).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Item 2, the CAL FIRE Fire Fighter Academy (FFA) Certificate", "wh": ["Item 1, the CAL FIRE Company Officer Academy (COA) Certificate", "Item 2, but only when paired with an SFT Fire Fighter I certificate", "None; only a certificate titled CAL FIRE FFA meets Item 2"], "hash": "sha256:39809c8d71cce7016ee43d3664b6de542745c28a32800e48fb5d046a7cff4e70"}, {"n": 6, "q": "A Heavy Fire Equipment Operator wants to promote to Battalion Chief through Pattern II. Which academies must be part of their training?", "a": "Basic Fire Control training, which includes both the Fire Fighter Academy and the Company Officer Academy (Join CAL FIRE BC page).", "qh": "A Heavy Fire Equipment Operator wants to promote to Battalion Chief through Pattern II. Which academies must be part of their training?", "ah": "Basic Fire Control training, which includes both the Fire Fighter Academy and the Company Officer Academy (Join CAL FIRE BC page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Basic Fire Control: both the Fire Fighter Academy and the Company Officer Academy", "wh": ["Basic Fire Control: the Company Officer Academy only", "Basic Fire Control: the Fire Fighter Academy only", "Basic Fire Control: the FFA, the COA, and a Battalion Chief Academy"], "hash": "sha256:d6b4c126a4282fdab2cf8d7d0f98f53456d8813bfeb74a882e424d13f5513303"}, {"n": 7, "q": "Put the four centers in order by year established and give one location fact for each.", "a": "Ione 1967 (City of Ione, Amador County). Riverside 2017 (Ben Clark Public Safety Training Center). Redding 2023 (Shasta College). Atwater 2025 (Castle Airport and Development Center).", "qh": "Put the four centers in order by year established and give one location fact for each.", "ah": "Ione 1967 (City of Ione, Amador County). Riverside 2017 (Ben Clark Public Safety Training Center). Redding 2023 (Shasta College). Atwater 2025 (Castle Airport and Development Center).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Ione 1967, Riverside 2017, Redding 2023 (Shasta College), Atwater 2025 (Castle Airport)", "wh": ["Ione 1967, Redding 2017 (Shasta College), Riverside 2023, Atwater 2025 (Castle Airport)", "Ione 1967, Riverside 2017, Atwater 2023 (Castle Airport), Redding 2025 (Shasta College)", "Riverside 1967, Ione 2017, Redding 2023 (Shasta College), Atwater 2025 (Castle Airport)"], "hash": "sha256:ee48ec727c37b8a67e92ea511aa6fb2daab6634e206d63ca88c7874cf86d8ab5"}, {"n": 8, "q": "Name the curriculum areas the Training Center page lists beyond basic fire control.", "a": "Arson investigation, leadership development, forest practice enforcement, aviation, and specialized courses. Training covers prevention, protection, emergency response, law enforcement, and natural resources, and allied agencies attend too (Training Center page).", "qh": "Name the curriculum areas the Training Center page lists beyond basic fire control.", "ah": "Arson investigation, leadership development, forest practice enforcement, aviation, and specialized courses. Training covers prevention, protection, emergency response, law enforcement, and natural resources, and allied agencies attend too (Training Center page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Arson investigation, leadership development, forest practice enforcement, aviation", "wh": ["Arson investigation, leadership development, swift-water rescue, aviation", "Arson investigation, paramedic licensing, forest practice enforcement, aviation", "Hazmat technician, leadership development, forest practice enforcement, aviation"], "hash": "sha256:5f2ce8ae049831e2f308946fff3c723d0f5a69290ee211c5a71bb846b9691e9f"}, {"n": 9, "q": "Which two CAL FIRE survival or safety course certificates appear on the Acceptable Documents file, and what date limit applies to the structural one?", "a": "Wildland Safety and Survival Level 1, and Fire Fighter Survival (Structural). The structural course certificate must be 2010 or newer, or the SFT 2023 version (Acceptable Documents).", "qh": "Which two CAL FIRE survival or safety course certificates appear on the Acceptable Documents file, and what date limit applies to the structural one?", "ah": "Wildland Safety and Survival Level 1, and Fire Fighter Survival (Structural). The structural course certificate must be 2010 or newer, or the SFT 2023 version (Acceptable Documents).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Wildland Safety and Survival Level 1, FF Survival (Structural): 2010 or newer, or SFT 2023", "wh": ["Wildland Safety and Survival Level 2, FF Survival (Structural): 2010 or newer, or SFT 2023", "Wildland Safety and Survival Level 1, FF Survival (Structural): 2013 or newer, or SFT 2023", "Wildland Safety and Survival Level 1, FF Survival (Structural): 2010 or newer; SFT 2023 not accepted"], "hash": "sha256:71545c1bb4014a2e0bddd609d254286f9cec9346e81aadbb5c74ee3ae429714c"}, {"n": 10, "q": "A newly hired Forestry Assistant II (Unit Forester) assumes the academies are only for firefighters and captains. What does the Tulare Unit duty statement require, by when, and does it settle how long the FFA is?", "a": "It requires completing the CAL FIRE Firefighter Academy (FFA) and Company Officer Academy (COA) during the probationary period as a condition of employment. It gives no length, so the 2026 FFA length stays unresolved (FA II PO-199, effective 07/01/2026).", "qh": "A newly hired Forestry Assistant II (Unit Forester) assumes the academies are only for firefighters and captains. What does the Tulare Unit duty statement require, by when, and does it settle how long the FFA is?", "ah": "It requires completing the CAL FIRE Firefighter Academy (FFA) and Company Officer Academy (COA) during the probationary period as a condition of employment. It gives no length, so the 2026 FFA length stays unresolved (FA II PO-199, effective 07/01/2026).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "FFA and COA during probation; no academy length is given", "wh": ["FFA only, during probation; no academy length is given", "FFA and COA within three years of hire; no academy length is given", "FFA and COA during probation; it fixes the FFA length for 2026"], "hash": "sha256:65bb26f636d3b60f5c3c00fa4dedb753d639bc8954d6c0d965315ddfdd49409b"}], "sources": [{"label": "CAL FIRE Training Center page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/training-center"}, {"label": "OSFM Accredited Academies", "url": "https://osfm.fire.ca.gov/what-we-do/state-fire-training/accredited-academies"}, {"label": "OSFM Fire Fighter 1 certification page", "url": "https://osfm.fire.ca.gov/what-we-do/state-fire-training/professional-certifications/fire-fighter-1"}, {"label": "CAL FIRE Acceptable Documents", "url": "https://www.fire.ca.gov/-/media/BF147896DED446F9B142FEF464A0E9AD"}, {"label": "Join CAL FIRE, Battalion Chief", "url": "https://www.joincalfire.com/classifications/fire-protection/firefighting-and-paramedics/battalion-chief"}, {"label": "2026-27 Governor's Budget Summary, Natural Resources", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}, {"label": "Governor's release, 650 new CAL FIRE officers (21 Nov 2025)", "url": "https://www.gov.ca.gov/2025/11/21/california-shatters-training-records-with-650-new-cal-fire-officers-in-2025/"}, {"label": "CAL FIRE memo, New Curriculum and Training Path for Firefighter I (2 May 2022; secondary host)", "url": "https://www.cftda.com/wp-content/uploads/2022/05/New-Curriculum-Training-Path-for-Firefighter-I-FINAL.pdf"}, {"label": "Ranger batches: /workspace/can-report/calfire/calfire-batch-01.md, calfire-batch-02.md, calfire-batch-04.md", "url": ""}, {"label": "Forestry Assistant II PO-199, Tulare Unit", "url": "https://calcareers.ca.gov/CalHrPublic/FileDownload.aspx?aid=32626253&name=PO-199.pdf"}, {"label": "Ranger batch 05: /workspace/can-report/calfire/calfire-batch-05.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 6. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> none listed in tree.py.", "note_html": "Study aid only. Source: CAL FIRE Training Center page, OSFM Accredited Academies, the CAL FIRE Acceptable Documents file, and the 2026-27 Governor's Budget (Ranger calfire-batch-01, -02, -04). <strong>The 2026 Firefighter Academy length is unverified.<\/strong> See Key specs, and don't quote a single number."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1481.33, "y": 686.65, "angle": 64.5, "vx": 782.78, "vy": 1254.66, "vangle": 158.5}, "10.6.7": {"id": "10.6.7", "name": "Promotional Path and Certifications (FFI to Unit Chief)", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.2", "10.5"], "doc": {"title": "10.6.7 Promotional Path and Certifications (FFI to Unit Chief)", "file": "10.6.7_Promotional_Path_and_Certifications_FFI_to_Unit_Chief.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>The typical ladder supported by the bulletins: <strong>FFI (1083, non-testing, seasonal) → FFII (1082, exam, CPAT) → FAE (1077, exam, experience plus CPAT) → Fire Captain (1095, exam, experience) → Battalion Chief (9723, promotional) → Assistant Chief (1039, promotional) → Unit Chief (1037, promotional)<\/strong>. It's not a guaranteed single path. Lateral routes exist through HFEO, the paramedic ranges, forestry, OSFM, and aviation.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<p><strong>Fire Fighter II (EX-4603, continuous, online only)<\/strong><\/p><ul><li>Class A, B, or C license.<\/li><li>Valid <strong>CPAT<\/strong> card (see the CPAT rules below).<\/li><li>For paramedic positions, a California or National Registry <strong>EMT-P<\/strong> (you can test within 6 months of finishing a program, but need the California license before an offer).<\/li><li>Age 18 at appointment.<\/li><li>At exam time, only the license is required. The rest is checked during hiring.<\/li><\/ul><p><strong>Fire Apparatus Engineer (EX-4473)<\/strong><\/p><ul><li>License, CPAT, and EMT-P for paramedic positions.<\/li><li>Experience: <strong>8 months<\/strong> of full-time firefighting, <strong>or 1,280 hours<\/strong> as a volunteer firefighter.<\/li><li>An FAE \"may act as fire captain relief,\" and eligible candidates may enter an apprenticeship. Camp jobs need Live Scan/PREA.<\/li><\/ul><p><strong>Fire Captain (EX-5398)<\/strong><\/p><ul><li><strong>Pattern I:<\/strong> 36 months as a CAL FIRE FAE plus completion of the California Fire Fighter <strong>Joint Apprenticeship Committee<\/strong> program (SubJAC journey-level).<\/li><li><strong>Pattern II:<\/strong> 24 months as a full-time paid <strong>Company Officer<\/strong> leading an engine company (or equivalent) or a hand crew such as an ICS Type I or II Crew.<\/li><li>Exam: a <strong>90-minute<\/strong> timed multiple-choice test taken online.<\/li><\/ul><p><strong>Battalion Chief (Join CAL FIRE)<\/strong><\/p><ul><li><strong>Pattern I:<\/strong> 3 years as Fire Captain.<\/li><li><strong>Pattern II:<\/strong> 5 years as HFEO (2 of them via a Training and Development assignment to Captain), plus Basic Fire Control (FFA and COA).<\/li><\/ul><p><strong>Assistant Chief (EX-4883):<\/strong> 2 years as Battalion Chief. Promotional exam. Some positions require peace officer status.<\/p><p><strong>Unit Chief (EX-5386):<\/strong> 2 years as Assistant Chief \"with Fire Administration/Fire Operations experience,\" plus \"possession of a valid driver license of the appropriate class.\" Promotional exam.<\/p><p><strong>Rules that apply across the ladder<\/strong><\/p><ul><li><strong>Six-month rule:<\/strong> if you're within 6 months of meeting experience, you can take the exam but must fully qualify before appointment or a job offer.<\/li><li><strong>Retest waits:<\/strong> FFII, FAE, and Captain exams are continuous and electronic only, with an <strong>11-month<\/strong> recompete wait. The AC and UC promotional exams have a <strong>six-month<\/strong> retest wait.<\/li><li><strong>CPAT:<\/strong> a <strong>Cal-JAC CPAT<\/strong> card valid as of the final filing date. Incumbents with no break over 12 consecutive months in an appropriate CAL FIRE class don't need a new card; they attach a personal statement instead.<\/li><li><strong>FF1 for FFII and FAE:<\/strong> the California FF1 must be <strong>IFSAC/Pro Board accredited<\/strong> for FFII and FAE (not required for the FFI class). An SFT <strong>Fire Fighter 2<\/strong> certification is also an Acceptable Documents item.<\/li><\/ul><p><strong>Two NFPA lists. Keep them separate:<\/strong><\/p><ul><li><strong>CAL FIRE FFI hiring-form alternatives (JC-533177):<\/strong> 1A Structural or <strong>NFPA 1001<\/strong>. 1B HazMat or <strong>NFPA 1072 / 472 / 470<\/strong>. 1C Wildland or <strong>NFPA 1051 / 1140<\/strong>.<\/li><li><strong>OSFM California FF1 CTS basis (2024 edition, implemented 1 Jul 2025):<\/strong> <strong>NFPA 1010<\/strong> (Fire Fighter 1), <strong>NFPA 1140<\/strong> (Wildland Fire Fighter 1), <strong>NFPA 470<\/strong> (Hazardous Material Awareness and Operations). See 10.2.<\/li><li>These are different documents: a department's hiring checklist versus the state certification standard. Don't merge them.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Plan backward.<\/strong> Captain Pattern I needs 36 months as FAE plus the JAC apprenticeship. In 2025, 658 new FAEs graduated the Company Officer Academy and began a <strong>three-year apprenticeship<\/strong> toward Captain (2026-27 Budget).<\/li><li><strong>Get CPAT and FF1 early.<\/strong> Both gate FFII and FAE job offers.<\/li><li><strong>Paramedic track:<\/strong> the paramedic ranges of FFII, FAE, and Captain need a California EMT-P license before an offer or reassignment.<\/li><li><strong>Battalion Chief exam status (checked 17 Nov 2026):<\/strong> the Join CAL FIRE BC page says, \"The CAL FIRE Examination Unit is not accepting exam applications at this time. Please check back periodically to see when the next exam bulletin is released.\" No current or archived BC exam bulletin was found. The same page advertised BC <strong>job postings<\/strong> (not exam bulletins) with filing dates 10/28/2026 (Sacramento), 11/02/2026 (Mendocino), 11/04/2026 (San Luis Obispo), and 11/06/2026 (Sacramento) (batch 05).<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>CPAT, a physical ability test, is an MQ for FFII and FAE (card before a job offer).<\/li><li>Peace-officer-designated positions (some Captain, BC, AC, and UC jobs) add felony disqualification, background investigation, and POST age and education rules, as quoted on the bulletins.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li><strong>Archived CalHR specs (2014 to 2015 Wayback snapshots, footers \"Updated 6/3/2012\").<\/strong> These may predate the 31 July 2025 class mergers and the current bulletins:<ul><li><strong>FFII, archived MQs:<\/strong> three months of firefighting, or one year as a certified volunteer, or completion of FFI certification courses, or one year as Fire Prevention Specialist I plus mandatory training.<\/li><li><strong>FAE, archived MQs:<\/strong> eight months of firefighting, or two years as a certified volunteer, or JAC preapprenticeship patterns from 1983 to 1984.<\/li><li><strong>Captain, archived MQs:<\/strong> also listed 48 months as FAE (Pattern II) and 48 months leading a hand crew (Pattern IV).<\/li><\/ul><\/li><li>The current bulletins differ (for example, CPAT and the 1,280 volunteer hours for FAE). Use the bulletins.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "An FFII applicant hasn't taken CPAT yet. Can they sit for the exam? When must the card be in hand? Who's exempt from getting a new card?", "a": "Yes, they're admitted without the card but must submit it before they can be eligible for a job offer. Incumbent FFIIs or FAEs with no break in service over 12 consecutive months don't need a new card. Under the Acceptable Documents file they attach a personal statement instead (EX-4603; Acceptable Documents item 20).", "qh": "An FFII applicant hasn't taken CPAT yet. Can they sit for the exam? When must the card be in hand? Who's exempt from getting a new card?", "ah": "Yes, they're admitted without the card but must submit it before they can be eligible for a job offer. Incumbent FFIIs or FAEs with no break in service over 12 consecutive months don't need a new card. Under the Acceptable Documents file they attach a personal statement instead (EX-4603; Acceptable Documents item 20).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Yes; card due before a job offer; FFIIs/FAEs without a 12-month break are exempt", "wh": ["No; the card is due before the exam; FFIIs/FAEs without a 12-month break are exempt", "Yes; card due before a job offer; only FAEs with no break in service are exempt", "Yes; card due by the end of the academy; FFIs with prior seasons are exempt"], "hash": "sha256:48a20551c84309f3c3e606dd206ba107b5f6958c0d7caa271540b2ecad5578e3"}, {"n": 2, "q": "A volunteer firefighter with 1,000 logged hours wants to test for FAE. Do they qualify? What are the two experience patterns?", "a": "No. FAE requires either 8 months of full-time firefighting or 1,280 hours as a volunteer firefighter. 1,000 hours falls short of Pattern II (EX-4473).", "qh": "A volunteer firefighter with 1,000 logged hours wants to test for FAE. Do they qualify? What are the two experience patterns?", "ah": "No. FAE requires either 8 months of full-time firefighting or 1,280 hours as a volunteer firefighter. 1,000 hours falls short of Pattern II (EX-4473).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No: FAE needs 8 months full-time firefighting or 1,280 volunteer hours", "wh": ["Yes: FAE needs 8 months full-time firefighting or 1,000 volunteer hours", "No: FAE needs 12 months full-time firefighting or 1,280 volunteer hours", "No: FAE needs 8 months full-time firefighting or 2,080 volunteer hours"], "hash": "sha256:905c84af8053e508b7516099f4076ae44d5550a93f89018bf8a72b4675bdfcd7"}, {"n": 3, "q": "An FAE has 31 months in class and is mid-apprenticeship. Can they take the Captain exam now? What must be done before an offer?", "a": "Yes, if they're within six months of the 36-month requirement. They can test, but must finish the apprenticeship (SubJAC journey-level certification) and the experience before a job offer (EX-5398).", "qh": "An FAE has 31 months in class and is mid-apprenticeship. Can they take the Captain exam now? What must be done before an offer?", "ah": "Yes, if they're within six months of the 36-month requirement. They can test, but must finish the apprenticeship (SubJAC journey-level certification) and the experience before a job offer (EX-5398).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Yes, within six months of 36; finish the apprenticeship and experience before an offer", "wh": ["No; they must have the full 36 months before they can test", "Yes, within six months of 36; the apprenticeship can be finished after the offer", "Yes, within twelve months of 36; finish the apprenticeship before an offer"], "hash": "sha256:5208d28ce61de402e01711979aa19497f2b19a27f0de9b5d177a7485b6f7a5b4"}, {"n": 4, "q": "A company officer from another state led an engine for 26 months. Which Captain pattern might fit, and what's the key condition?", "a": "Pattern II: 24 months as a full-time paid Company Officer leading an engine company (or equivalent) at a responsibility level equal to a CAL FIRE Captain. The experience must be fully complete before a job offer (EX-5398).", "qh": "A company officer from another state led an engine for 26 months. Which Captain pattern might fit, and what's the key condition?", "ah": "Pattern II: 24 months as a full-time paid Company Officer leading an engine company (or equivalent) at a responsibility level equal to a CAL FIRE Captain. The experience must be fully complete before a job offer (EX-5398).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Pattern II: 24 months as a paid Company Officer leading an engine; done before an offer", "wh": ["Pattern I: 24 months as a paid Company Officer leading an engine; done before the exam", "Pattern II: 36 months as a paid Company Officer leading an engine; done before an offer", "Pattern II: 24 months as a volunteer Company Officer leading an engine; done before an offer"], "hash": "sha256:2d6b13368c1833cf97180c3d39a63c830e15a07d6725fc255b130a50ccd82561"}, {"n": 5, "q": "A Captain with 1 year in rank wants to jump to Assistant Chief. Map the minimum path.", "a": "Captain → Battalion Chief needs 3 years as Captain (Join CAL FIRE). BC → Assistant Chief needs 2 years as BC (EX-4883). Minimum: about 2 more years as Captain, then 2 years as BC. The six-month rule only affects when you can test, not appointment.", "qh": "A Captain with 1 year in rank wants to jump to Assistant Chief. Map the minimum path.", "ah": "Captain → Battalion Chief needs 3 years as Captain (Join CAL FIRE). BC → Assistant Chief needs 2 years as BC (EX-4883). Minimum: about 2 more years as Captain, then 2 years as BC. The six-month rule only affects when you can test, not appointment.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "About 2 more years as Captain (3 total), then 2 years as Battalion Chief", "wh": ["About 1 more year as Captain (2 total), then 2 years as Battalion Chief", "About 2 more years as Captain (3 total), then 3 years as Battalion Chief", "About 2 more years as Captain (3 total), then straight to Assistant Chief"], "hash": "sha256:00162dbe7e7f40870d641f87cc409eff5eb8cdc7d9936408532880703f120f79"}, {"n": 6, "q": "A paramedic student finishes in 5 months. Can they test for FFII on the paramedic range now? What license is needed, and when?", "a": "Yes. FFII lets paramedic-program applicants test if they're within six months of completing training by the exam date. A California EMT-P license is required before a job offer or reassignment (EX-4603).", "qh": "A paramedic student finishes in 5 months. Can they test for FFII on the paramedic range now? What license is needed, and when?", "ah": "Yes. FFII lets paramedic-program applicants test if they're within six months of completing training by the exam date. A California EMT-P license is required before a job offer or reassignment (EX-4603).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Yes, if within six months of finishing; California EMT-P license before an offer", "wh": ["No; they must finish paramedic training before the exam date", "Yes, if within six months of finishing; National Registry paramedic before an offer", "Yes, if within twelve months of finishing; California EMT-P license before an offer"], "hash": "sha256:e512ae9d268cd8d1aa4d7c8a06324c7c210432cd641fbe94c96ea6aae6f9f833"}, {"n": 7, "q": "An applicant's California FF1 has no IFSAC or Pro Board seal. Which classes can it support, and which can't it?", "a": "It can support the FFI class. It can't support FFII or FAE, because the Acceptable Documents file requires an IFSAC/Pro Board accredited California FF1 for those.", "qh": "An applicant's California FF1 has no IFSAC or Pro Board seal. Which classes can it support, and which can't it?", "ah": "It can support the FFI class. It can't support FFII or FAE, because the Acceptable Documents file requires an IFSAC/Pro Board accredited California FF1 for those.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "FFI only; FFII and FAE need an IFSAC/Pro Board accredited California FF1", "wh": ["FFII and FAE only; FFI needs an IFSAC/Pro Board accredited California FF1", "FFI and FFII; only FAE needs an IFSAC/Pro Board accredited California FF1", "No class at all; every CAL FIRE class needs an IFSAC/Pro Board seal"], "hash": "sha256:56424f3301e30fa155c83cdc69b88fe943f3ce9c378e73a406765b2962ae4f8b"}, {"n": 8, "q": "A study partner writes \"CAL FIRE FF1 = NFPA 1001, 1072, 1051\" next to \"OSFM FF1 = NFPA 1010, 1140, 470\" and wants to merge them into one list. Why is that wrong?", "a": "They're two different documents. The first is CAL FIRE's FFI hiring-package list of acceptable alternatives (JC-533177). The second is the current OSFM CTS basis for California FF1 (2024 edition, implemented 1 Jul 2025). Per the 10.2 ↔ 10.6.7 cross-link rule, keep them unmerged and cite each one.", "qh": "A study partner writes \"CAL FIRE FF1 = NFPA 1001, 1072, 1051\" next to \"OSFM FF1 = NFPA 1010, 1140, 470\" and wants to merge them into one list. Why is that wrong?", "ah": "They're two different documents. The first is CAL FIRE's FFI hiring-package list of acceptable alternatives (JC-533177). The second is the current OSFM CTS basis for California FF1 (2024 edition, implemented 1 Jul 2025). Per the 10.2 ↔ 10.6.7 cross-link rule, keep them unmerged and cite each one.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Different documents: CAL FIRE FFI hiring alternatives vs the OSFM CTS basis; keep both", "wh": ["Same list: OSFM simply renumbered the standards, so merging is fine", "CAL FIRE's list is outdated: replace it with the OSFM list and drop the rest", "OSFM's list is for FFII only: merge them and label the result FFI"], "hash": "sha256:9cb6ab50f784631f67200a1fc6e9e1f786a5ece8fcb538c09c116167f6b7fa6a"}, {"n": 9, "q": "You fail the FFII exam today. When can you retest? How does that compare with the Assistant Chief exam?", "a": "FFII is continuous with an 11-month recompete wait (EX-4603). The Assistant Chief promotional exam has a six-month retest wait (EX-4883).", "qh": "You fail the FFII exam today. When can you retest? How does that compare with the Assistant Chief exam?", "ah": "FFII is continuous with an 11-month recompete wait (EX-4603). The Assistant Chief promotional exam has a six-month retest wait (EX-4883).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "FFII: continuous, 11-month recompete wait; Assistant Chief: six-month retest wait", "wh": ["FFII: continuous, six-month recompete wait; Assistant Chief: 11-month retest wait", "FFII: continuous, 12-month recompete wait; Assistant Chief: six-month retest wait", "FFII: once a year, 11-month recompete wait; Assistant Chief: no retest wait"], "hash": "sha256:2345972319a0b636ffd068e6a3bac84ba0e87213c9c3e65b282806a476100719"}, {"n": 10, "q": "Describe the Captain exam format and where you take it.", "a": "A 90-minute timed multiple-choice test on an online testing platform, taken virtually in a private location with reliable internet (EX-5398).", "qh": "Describe the Captain exam format and where you take it.", "ah": "A 90-minute timed multiple-choice test on an online testing platform, taken virtually in a private location with reliable internet (EX-5398).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "A 90-minute timed multiple-choice test online, taken in a private location", "wh": ["A 120-minute timed multiple-choice test online, taken in a private location", "A 90-minute timed multiple-choice test in person at the Examination Unit", "A 90-minute oral interview by video panel, taken in a private location"], "hash": "sha256:d5e66cb110a0e09fd6c876028eb54dcb14a97e3e51f0228e64a218a0e2450697"}, {"n": 11, "q": "What does the Unit Chief MQ require beyond time as an Assistant Chief?", "a": "The two years as an Assistant Chief must include Fire Administration/Fire Operations experience, plus a valid driver license (EX-5386).", "qh": "What does the Unit Chief MQ require beyond time as an Assistant Chief?", "ah": "The two years as an Assistant Chief must include Fire Administration/Fire Operations experience, plus a valid driver license (EX-5386).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Fire Administration/Fire Operations experience as AC, plus a valid driver license", "wh": ["Fire Administration/Fire Operations experience as AC, plus a paramedic license", "Fire Prevention/Law Enforcement experience as AC, plus a valid driver license", "Any experience as AC, plus a bachelor's degree in fire science"], "hash": "sha256:939f32034901c7ce4b6b97f12689e6e29f60caf98408cae85062a2c0f0d54446"}], "sources": [{"label": "FFII exam bulletin EX-4603", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4603"}, {"label": "FAE exam bulletin EX-4473", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4473"}, {"label": "Fire Captain exam bulletin EX-5398", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=5398"}, {"label": "Assistant Chief exam bulletin EX-4883", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4883"}, {"label": "Unit Chief exam bulletin EX-5386", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=5386"}, {"label": "Join CAL FIRE, Battalion Chief", "url": "https://www.joincalfire.com/classifications/fire-protection/firefighting-and-paramedics/battalion-chief"}, {"label": "CAL FIRE Acceptable Documents", "url": "https://www.fire.ca.gov/-/media/BF147896DED446F9B142FEF464A0E9AD"}, {"label": "Firefighter I posting JC-533177 (hiring-form NFPA alternatives)", "url": "https://calcareers.ca.gov/CalHrPublic/Jobs/JobPosting.aspx?JobControlId=533177"}, {"label": "OSFM Fire Fighter 1 certification (CTS basis)", "url": "https://osfm.fire.ca.gov/what-we-do/state-fire-training/professional-certifications/fire-fighter-1"}, {"label": "2026-27 Governor's Budget Summary, Natural Resources", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}, {"label": "NFPA 1001, 1010, 1051, 1072, 1140, 470, 472 (cited by number only; paywalled)", "url": "https://www.nfpa.org/"}, {"label": "Ranger batches: /workspace/can-report/calfire/calfire-batch-01.md, calfire-batch-01-addendum.md; Scout: /workspace/can-report/scout-batch-02.md (Cross-check notes)", "url": ""}, {"label": "Ranger batch 05: /workspace/can-report/calfire/calfire-batch-05.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 7. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 10.2 Certification Ladder (OSFM / SFT; do not merge NFPA number lists), 10.5 Promotional Exam Prep and Leadership.", "note_html": "Study aid only. Source: CalCareers exam bulletins EX-4603 (FFII), EX-4473 (FAE), EX-5398 (Captain), EX-4883 (Assistant Chief), and EX-5386 (Unit Chief); the Join CAL FIRE Battalion Chief page; the CAL FIRE Acceptable Documents file (Ranger calfire-batch-01 and addendum); and the OSFM FF1 page (Scout batch 02). MQs are condensed, so read the full bulletin before you apply."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1454.19, "y": 694.95, "angle": 81.5, "vx": 775.39, "vy": 1188.68, "vangle": 229.0}, "10.6.8": {"id": "10.6.8", "name": "Wildland and All-Risk Response", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["09.4", "10.6.4"], "doc": {"title": "10.6.8 Wildland and All-Risk Response", "file": "10.6.8_Wildland_and_All-Risk_Response.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>CAL FIRE provides \"natural resource management and wildland fire protection services to 31 million acres of State Responsibility Area (SRA)\" and \"supports federal and local efforts in non-SRA areas\" (2026-27 Budget). It is also an <strong>all-risk<\/strong> department: \"Beyond its wildland firefighting role, CAL FIRE is an 'all-risk' department.\"<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Daily emergencies (Fire Protection page):<\/strong> wildland fires, structure fires, accidents, heart attacks, lost hikers, spills, train wrecks, floods, and earthquakes.<\/li><li><strong>All-risk list (Our Organization page):<\/strong> medical aids, hazmat spills, swift-water rescue, search and rescue, civil disturbances, train wrecks, floods, earthquakes, and more.<\/li><li><strong>Coverage:<\/strong> over 31 million acres of wildlands. Emergency services in 36 of 58 counties.<\/li><li><strong>Initial attack target:<\/strong> aircraft reach remote areas in about 20 minutes, with a goal of <strong>95% of fires at 10 acres or less<\/strong>.<\/li><li><strong>Prevention work (Fire Prevention Program):<\/strong> wildland pre-fire engineering, vegetation management, fire planning, education, and law enforcement. Typical projects: brush clearance, prescribed fire, defensible space inspections, evacuation planning, fire hazard severity mapping, and fire-related law enforcement.<\/li><li><strong>Hand crews:<\/strong> respond to wildfires, floods, search and rescue, and earthquakes. Between emergencies they do hazardous-fuels reduction and prescribed fire (see 10.6.11).<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<p><strong>Mutual aid and cooperation (Cooperative Efforts page):<\/strong><\/p><ul><li><strong>Unified command:<\/strong> emergencies may be handled under unified command with the agencies CAL FIRE has agreements with.<\/li><li><strong>California Master Mutual Aid Agreement:<\/strong> CAL FIRE helps when local resources are depleted and CAL FIRE resources are available. CAL FIRE can also call on local departments for wildland suppression.<\/li><li><strong>Cal OES:<\/strong> can request CAL FIRE help on non-fire emergencies when the Governor has declared a State of Emergency.<\/li><li><strong>CFAA and the California Military Department / National Guard:<\/strong> can provide personnel, <strong>C-130 MAFFS<\/strong>, helicopters, and other resources when statewide wildfires stretch resources.<\/li><li><strong>CFMA:<\/strong> a closest-forces agreement with USFS, BLM, NPS, BIA, and FWS.<\/li><\/ul><p><strong>ICS fragments (official):<\/strong><\/p><ul><li><strong>FFI hiring requires<\/strong> FEMA IS-100 (Intro to ICS), IS-200 (ICS for Initial Response), IS-700 (NIMS), and IS-800 (National Response Framework).<\/li><li><strong>Air Attack Officer<\/strong> (a fire officer on the OV-10) coordinates with the incident commander, coordinates all aerial resources, and directs drops. The OV-10 can also serve as an <strong>Aerial Supervision Module<\/strong>, leading airtankers on drop runs.<\/li><li><strong>King Air:<\/strong> used to train the <strong>Air Tactical Group Supervisor (ATGS)<\/strong> position.<\/li><li><strong>Incident Management Teams:<\/strong> Anale Burlew's profile says that as Assistant Deputy Director of Fire Protection Operations she \"oversees vital Fire Protection Operations Programs, including Operations Support, Intelligence, and Incident Management Teams.\" She's now listed as Chief Deputy Director, Operations. She has served as Plans Section Chief and Incident Commander Trainee on CAL FIRE IMTs.<\/li><li><strong>Director Joe Tyler<\/strong> is qualified as Agency Administrator, Incident Commander Type 1, Safety Officer, and Operations Section Chief. His last IMT role was Deputy Incident Commander on CAL FIRE IMT 3.<\/li><li><strong>Fire Captains<\/strong> supervise engine companies and hand crews on wildland, structural, flood, hazmat, and other emergencies (EX-5398).<\/li><\/ul><p><strong>Statewide ICS catalog (batch 05):<\/strong><\/p><ul><li><strong>CICCS Qualification Guide 2026<\/strong> (California Incident Command Certification System, Cal OES Fire and Rescue) is the official catalog of ICS positions and the training and experience each needs. The 2026 guide has no appendices yet, so use the 2025 guide's Appendices A to G. FIRESCOPE describes CICCS as a joint effort of the State Fire Marshal's Office and Cal OES Fire and Rescue.<\/li><li><strong>IMT typing:<\/strong><ul><li>CICCS 2026 says \"NWCG Types their IMTs as Complex Incident Management Teams (CIMT) and CAL FIRE Types their IMTs as Type 1/CIM.\"<\/li><li>Local-government personnel on NWCG or CAL FIRE teams in <strong>C and G Staff<\/strong> positions must complete the <strong>Type 1 PTB and Regional Peer Review<\/strong>. Once qualified as Type 1, they're granted CIM qualification.<\/li><li>Both Type 1 and CIM experience can be earned on CAL FIRE IMTs and NWCG CIMTs.<\/li><\/ul><\/li><li><strong>Who can serve:<\/strong> local-government participation on CAL FIRE IMTs, Federal IMTs, and Local All-Hazards IMTs is \"at the discretion of the sponsoring Department/Agency\" (CICCS 2026).<\/li><li><strong>Operations positions (selected):<\/strong><ul><li>Section and branch: Operations Section Chief Type 1/Complex (OSC1/OSCC), All-Hazards OSC3, Operations Branch Director (OPBD).<\/li><li>Supervisors and leaders: Division/Group Supervisor (DIVS), Task Force Leader (TFLD), Strike Team Leader Crew/Heavy Equipment/Engine (STCR/STEQ/STEN).<\/li><li>Single resources: Crew Boss (CRWB), Heavy Equipment Boss (HEQB), Engine Boss (ENGB), Felling Boss (FELB), Firing Boss (FIRB).<\/li><li>Also: Structure Protection Specialist (STPS), Staging Area Manager (STAM), Firefighter Type 1 and 2 (FFT1/FFT2).<\/li><\/ul><\/li><li><strong>Air operations positions:<\/strong><ul><li>Air Operations Branch Director (AOBD) and Air Support Group Supervisor (ASGS).<\/li><li>Air Tactical Group Supervisor (ATGS) and Helicopter Coordinator (HLCO).<\/li><li>Helibase Manager (HEBM), Helicopter Manager (HMGB), Helicopter Crewmember (HECM).<\/li><li>UAS Manager, Leader, and Pilot (UASM/UASL/UASP).<\/li><\/ul><\/li><li><strong>Command positions:<\/strong> Area Commander (ACDR), Incident Commander Type 1/Complex (ICT1/ICCI), Safety Officer (SOF1/SOFC, SOFF), Public Information Officer (PIO1/PIOC), Liaison Officer (LOFR), and Agency Representative (AREP).<\/li><li><strong>FIRESCOPE Field Operations Guide, ICS 420-1 (2022):<\/strong> an interactive field guide covering Wildland Fire Management Guiding Principles, Tactical Engagement, Levels of Engagement, Powerline Safety, and a Structure Assessment Checklist. The FIRESCOPE ICS library also holds position manuals, such as <strong>ICS 702 Fireline EMT / Fireline Paramedic<\/strong> (Dec 2016).<\/li><li><strong>CAL FIRE teams in practice:<\/strong><ul><li>Deputy Director Matthew Sully's profile lists service on \"CAL FIRE Incident Command Team 4 and Incident Management Team 5\" as Hired Equipment Technical Specialist and Operations Branch Director.<\/li><li>A Lake Fire update (20 Jul 2024): \"CAL Fire will remain in Unified Command with CAIIMT2, however CAL Fire Incident Management Team 5 will no longer be assigned to the Lake Incident, effective Sunday, July 21, 2024.\"<\/li><\/ul><\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Defensible space \"gives firefighters a safer area to defend your property\" (Ready for Wildfire, see 10.6.13).<\/li><li>Wildland Safety and Survival Level 1 and Fire Fighter Survival (Structural) are listed course certificates on CAL FIRE's Acceptable Documents file.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "You're an FFI on an SRA engine and get toned out for a vehicle collision with injuries. Is that CAL FIRE's job? Back it up with the department's own wording.", "a": "Yes. The Fire Protection page lists accidents and heart attacks among daily emergencies, and the Our Organization page calls CAL FIRE an \"all-risk\" department beyond its wildland role.", "qh": "You're an FFI on an SRA engine and get toned out for a vehicle collision with injuries. Is that CAL FIRE's job? Back it up with the department's own wording.", "ah": "Yes. The Fire Protection page lists accidents and heart attacks among daily emergencies, and the Our Organization page calls CAL FIRE an \"all-risk\" department beyond its wildland role.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Yes: accidents are daily emergencies, and CAL FIRE calls itself \"all-risk\"", "wh": ["No: CAL FIRE engines respond only to vegetation fires in the SRA", "Only if the county requests it, since medical calls are local-only", "Yes, but only for collisions on state highways inside the SRA"], "hash": "sha256:b91dce9abd16f75bf70012496c9d4a38bf6940c5a8d1b460aafb9a81514827a0"}, {"n": 2, "q": "A wildfire is burning in a city outside the SRA, and the city's engines are all committed. How can CAL FIRE resources get there, and what conditions apply?", "a": "The California Master Mutual Aid Agreement lets CAL FIRE assist when local resources are depleted and CAL FIRE resources are available. For non-SRA cities, a Cooperative Fire Protection contract can also make CAL FIRE the lead agency (Cooperative Efforts page).", "qh": "A wildfire is burning in a city outside the SRA, and the city's engines are all committed. How can CAL FIRE resources get there, and what conditions apply?", "ah": "The California Master Mutual Aid Agreement lets CAL FIRE assist when local resources are depleted and CAL FIRE resources are available. For non-SRA cities, a Cooperative Fire Protection contract can also make CAL FIRE the lead agency (Cooperative Efforts page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Master Mutual Aid: when local resources are depleted and CAL FIRE resources are available", "wh": ["Master Mutual Aid: only after the Governor declares a State of Emergency", "CFMA: when the nearest federal engine is committed elsewhere", "Master Mutual Aid: whenever the city asks, whether or not CAL FIRE has resources"], "hash": "sha256:5fc3281c1d0bf6fb0e603a7a3f14f3da9838122f2d31c8a7783cc34c2c6f86b9"}, {"n": 3, "q": "Several large wildfires are burning statewide and resources are stretched thin. Which agreement and partner can add C-130 MAFFS and helicopters?", "a": "The California Fire Assistance Agreement (CFAA) and the California Military Department / National Guard can provide personnel, C-130 MAFFS, helicopters, and other resources (Cooperative Efforts page).", "qh": "Several large wildfires are burning statewide and resources are stretched thin. Which agreement and partner can add C-130 MAFFS and helicopters?", "ah": "The California Fire Assistance Agreement (CFAA) and the California Military Department / National Guard can provide personnel, C-130 MAFFS, helicopters, and other resources (Cooperative Efforts page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "CFAA, with the California Military Department / National Guard", "wh": ["CFMA, with the U.S. Forest Service and BLM", "CFAA, with Cal OES Fire and Rescue", "Master Mutual Aid, with the California Military Department"], "hash": "sha256:afa2c9ff02e18e27945149d67bdaa92a626b5b85caa01b278ecb5849d1dd978a"}, {"n": 4, "q": "A fire starts on BLM land near the SRA boundary, and a CAL FIRE engine is closest. Which agreement covers the closest-forces response, and which five agencies are in it?", "a": "The CFMA, a closest-forces exchange with USFS, BLM, NPS, BIA, and FWS. It's CAL FIRE's largest cooperative program (Cooperative Efforts page).", "qh": "A fire starts on BLM land near the SRA boundary, and a CAL FIRE engine is closest. Which agreement covers the closest-forces response, and which five agencies are in it?", "ah": "The CFMA, a closest-forces exchange with USFS, BLM, NPS, BIA, and FWS. It's CAL FIRE's largest cooperative program (Cooperative Efforts page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "The CFMA: USFS, BLM, NPS, BIA, and FWS", "wh": ["The CFMA: USFS, BLM, NPS, BIA, and FEMA", "The CFAA: USFS, BLM, NPS, BIA, and FWS", "The CFMA: USFS, BLM, NPS, Cal OES, and FWS"], "hash": "sha256:853394dbc9e34030f24a3e3372611ed5138b5cb66883503d0e0c82ab4b658e0f"}, {"n": 5, "q": "After a major earthquake (no fire), can Cal OES request CAL FIRE crews? What has to happen first?", "a": "Yes, once the Governor has declared a State of Emergency. Then Cal OES can request CAL FIRE assistance on non-fire emergencies (Cooperative Efforts page).", "qh": "After a major earthquake (no fire), can Cal OES request CAL FIRE crews? What has to happen first?", "ah": "Yes, once the Governor has declared a State of Emergency. Then Cal OES can request CAL FIRE assistance on non-fire emergencies (Cooperative Efforts page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Yes, once the Governor has declared a State of Emergency", "wh": ["Yes, once the county has declared a local emergency", "No; CAL FIRE crews can't be assigned to non-fire emergencies", "Yes, once FEMA has approved a federal disaster declaration"], "hash": "sha256:2340168dd5a6e006a611056331a9e7f4cc72c571afc29f571d0c4beb4f139497"}, {"n": 6, "q": "Over a large incident, who coordinates the aircraft with the incident commander, and from what platform? What else can that platform do?", "a": "The Air Attack Officer, a fire officer flying in the OV-10, who coordinates with the incident commander and directs retardant and water drops. With the right staffing, the OV-10 can also act as an Aerial Supervision Module leading airtankers (OV-10 page).", "qh": "Over a large incident, who coordinates the aircraft with the incident commander, and from what platform? What else can that platform do?", "ah": "The Air Attack Officer, a fire officer flying in the OV-10, who coordinates with the incident commander and directs retardant and water drops. With the right staffing, the OV-10 can also act as an Aerial Supervision Module leading airtankers (OV-10 page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Air Attack Officer in the OV-10, which can also act as an Aerial Supervision Module", "wh": ["Air Attack Officer in the S-2T, which can also lead airtankers as an Aerial Supervision Module", "Air Attack Officer in the S-70i, which can also perform hoist rescues", "Helicopter Coordinator in the OV-10, which can also carry retardant"], "hash": "sha256:2700b9d2d4ecfe77acd47fc68822b5c723dfb274f8ede1dcd492481c91f4a4f8"}, {"n": 7, "q": "Name the four FEMA ICS/NIMS courses required for FFI hiring and what each covers.", "a": "IS-100 Introduction to the Incident Command System; IS-200 Basic ICS for Initial Response; IS-700 Introduction to NIMS; IS-800 National Response Framework, An Introduction (JC-533177).", "qh": "Name the four FEMA ICS/NIMS courses required for FFI hiring and what each covers.", "ah": "IS-100 Introduction to the Incident Command System; IS-200 Basic ICS for Initial Response; IS-700 Introduction to NIMS; IS-800 National Response Framework, An Introduction (JC-533177).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "IS-100 Intro ICS; IS-200 Basic ICS for Initial Response; IS-700 NIMS; IS-800 NRF", "wh": ["IS-100 Intro ICS; IS-200 Basic ICS for Initial Response; IS-700 NRF; IS-800 NIMS", "IS-100 Intro ICS; IS-300 Intermediate ICS; IS-700 NIMS; IS-800 NRF", "IS-100 Intro NIMS; IS-200 Basic ICS for Initial Response; IS-700 Intro ICS; IS-800 NRF"], "hash": "sha256:b40034bbf5eb2bf72c8ee19b5c55e813911c5661e35bcabaecd90f532261ad4b"}, {"n": 8, "q": "CAL FIRE's initial-attack aviation goal is \"95% at 10 acres or less.\" Why do arrival time and fire size go together in that goal?", "a": "The page pairs reaching even remote areas in about 20 minutes with keeping 95% of fires at 10 acres or less. Fast initial attack is how CAL FIRE aims to keep fires small (What We Do page).", "qh": "CAL FIRE's initial-attack aviation goal is \"95% at 10 acres or less.\" Why do arrival time and fire size go together in that goal?", "ah": "The page pairs reaching even remote areas in about 20 minutes with keeping 95% of fires at 10 acres or less. Fast initial attack is how CAL FIRE aims to keep fires small (What We Do page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Fast arrival (about 20 minutes) is how CAL FIRE aims to keep fires at 10 acres or less", "wh": ["Keeping fires under 10 acres is what lets aircraft arrive within 20 minutes", "They're separate goals: 20 minutes for engines and 10 acres for aircraft", "Fast arrival (about 30 minutes) is how CAL FIRE aims to keep fires at 10 acres or less"], "hash": "sha256:0b86746d2bd753e89325e25978ac4737ae9f5d363a59dd30601123717b93cfe5"}, {"n": 9, "q": "Give five prevention activities CAL FIRE uses to reduce wildfire before it starts.", "a": "Any five of: brush clearance, prescribed fire, defensible space inspections, emergency evacuation planning, fire prevention education, fire hazard severity mapping, fire-related law enforcement, and vegetation management (Our Organization page).", "qh": "Give five prevention activities CAL FIRE uses to reduce wildfire before it starts.", "ah": "Any five of: brush clearance, prescribed fire, defensible space inspections, emergency evacuation planning, fire prevention education, fire hazard severity mapping, fire-related law enforcement, and vegetation management (Our Organization page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Brush clearance, prescribed fire, defensible space inspections, evacuation planning, hazard mapping", "wh": ["Brush clearance, prescribed fire, airtanker drops, evacuation planning, hazard mapping", "Brush clearance, prescribed fire, defensible space inspections, hazmat response, hazard mapping", "Brush clearance, swift-water rescue, defensible space inspections, evacuation planning, hazard mapping"], "hash": "sha256:6c21b656fdcddad383523d1186ef3e3d0ed947242ff69a651e07902ea41f85d6"}, {"n": 10, "q": "What do CAL FIRE hand crews do when they're not on an emergency?", "a": "Hazardous-fuels reduction and prescribed-fire project work (Cooperative Efforts page).", "qh": "What do CAL FIRE hand crews do when they're not on an emergency?", "ah": "Hazardous-fuels reduction and prescribed-fire project work (Cooperative Efforts page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Hazardous-fuels reduction and prescribed-fire projects", "wh": ["Station maintenance and daily apparatus checks", "Defensible space inspections and citations", "Hazardous-fuels reduction and timber harvest planning"], "hash": "sha256:21b58c754df5c3ab751cd22a10c705c48092f2f1e6ca4a9ca216c3f5f5d4e0de"}, {"n": 11, "q": "A municipal Operations Section Chief wants to fill a C or G Staff slot on a CAL FIRE IMT and earn Complex (CIM) credit. Under CICCS 2026, what process must they finish, and what qualification follows?", "a": "They must complete the Type 1 PTB and the Regional Peer Review. Once they qualify as Type 1, CIM qualification is granted. Both Type 1 and CIM experience can be earned on CAL FIRE IMTs and NWCG CIMTs (CICCS Qualification Guide 2026).", "qh": "A municipal Operations Section Chief wants to fill a C or G Staff slot on a CAL FIRE IMT and earn Complex (CIM) credit. Under CICCS 2026, what process must they finish, and what qualification follows?", "ah": "They must complete the Type 1 PTB and the Regional Peer Review. Once they qualify as Type 1, CIM qualification is granted. Both Type 1 and CIM experience can be earned on CAL FIRE IMTs and NWCG CIMTs (CICCS Qualification Guide 2026).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Type 1 PTB plus Regional Peer Review; CIM qualification is granted on Type 1", "wh": ["Type 1 PTB only; CIM needs a separate NWCG Complex exam", "Regional Peer Review only; Type 2 qualification is granted", "NWCG CIMT PTB plus peer review; Type 1 is granted after CIM"], "hash": "sha256:7f384234c434871b52b05f43805df8a3c9bf66ff5a78ca0ff1117577a48f8187"}, {"n": 12, "q": "How does CAL FIRE type its Incident Management Teams, and what's the NWCG equivalent? Can a member earn CIM experience while on a CAL FIRE team?", "a": "CAL FIRE types its IMTs as Type 1/CIM. NWCG types its teams as Complex Incident Management Teams (CIMT). Yes, CICCS says both Type 1 and CIM experience can be earned on CAL FIRE IMTs and NWCG CIMTs (CICCS 2026).", "qh": "How does CAL FIRE type its Incident Management Teams, and what's the NWCG equivalent? Can a member earn CIM experience while on a CAL FIRE team?", "ah": "CAL FIRE types its IMTs as Type 1/CIM. NWCG types its teams as Complex Incident Management Teams (CIMT). Yes, CICCS says both Type 1 and CIM experience can be earned on CAL FIRE IMTs and NWCG CIMTs (CICCS 2026).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "CAL FIRE: Type 1/CIM; NWCG: CIMT; yes, CIM experience counts on CAL FIRE teams", "wh": ["CAL FIRE: CIMT; NWCG: Type 1/CIM; yes, CIM experience counts on CAL FIRE teams", "CAL FIRE: Type 1/CIM; NWCG: CIMT; no, CIM experience counts only on NWCG teams", "CAL FIRE: Type 2/CIM; NWCG: CIMT; yes, CIM experience counts on CAL FIRE teams"], "hash": "sha256:9688665703529aacdec8fae6eefb1a2c88b6f07ef68cd9e7ba75a9daa3acf705"}, {"n": 13, "q": "A captain from a city department is excited to join a CAL FIRE IMT next season. Who decides whether they can participate?", "a": "Their sponsoring department or agency. CICCS 2026 says local-government participation on CAL FIRE, Federal, and Local All-Hazards IMTs is at the sponsoring agency's discretion.", "qh": "A captain from a city department is excited to join a CAL FIRE IMT next season. Who decides whether they can participate?", "ah": "Their sponsoring department or agency. CICCS 2026 says local-government participation on CAL FIRE, Federal, and Local All-Hazards IMTs is at the sponsoring agency's discretion.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Their sponsoring department or agency", "wh": ["The CAL FIRE Unit Chief where the team is based", "Cal OES Fire and Rescue, which runs CICCS", "The Incident Commander of the CAL FIRE IMT"], "hash": "sha256:9675e689e1737e814964e308b4191a984cf42d82f4361f7c257d05399555e366"}, {"n": 14, "q": "You're task-booking toward Strike Team Leader Engine. Which official document lists the required training and experience? What's the catch with the 2026 edition?", "a": "The CICCS Qualification Guide, published by Cal OES Fire and Rescue. The 2026 guide doesn't include appendices yet, so use the 2025 guide's appendices (A to G, updated 05.12.25) alongside it (Cal OES Documents & Publications page).", "qh": "You're task-booking toward Strike Team Leader Engine. Which official document lists the required training and experience? What's the catch with the 2026 edition?", "ah": "The CICCS Qualification Guide, published by Cal OES Fire and Rescue. The 2026 guide doesn't include appendices yet, so use the 2025 guide's appendices (A to G, updated 05.12.25) alongside it (Cal OES Documents &amp; Publications page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "CICCS Qualification Guide; the 2026 edition lacks appendices, so use 2025's A to G", "wh": ["FIRESCOPE FOG ICS 420-1; the 2026 edition lacks the Operations positions", "CICCS Qualification Guide; the 2026 edition drops STEN from its position list", "A CAL FIRE IMT handbook; the 2026 edition isn't public, so use the 2022 one"], "hash": "sha256:cf8a614dc73268836312a5a8c247e0f61d815f14d2ce26d5c32858d4c9720c52"}, {"n": 15, "q": "Your resource order lists you as \"STEN\" and your partner as \"ENGB.\" A third name is \"DIVS,\" and a fourth is \"TFLD.\" Decode all four using CICCS 2026, and say which one is the engine-specific strike team position.", "a": "STEN is Strike Team Leader Engine, the engine-specific strike team position. ENGB is Engine Boss. DIVS is Division/Group Supervisor. TFLD is Task Force Leader. These come from the CICCS 2026 Operations position list. Use the guide for each position's training and experience requirements.", "qh": "Your resource order lists you as \"STEN\" and your partner as \"ENGB.\" A third name is \"DIVS,\" and a fourth is \"TFLD.\" Decode all four using CICCS 2026, and say which one is the engine-specific strike team position.", "ah": "STEN is Strike Team Leader Engine, the engine-specific strike team position. ENGB is Engine Boss. DIVS is Division/Group Supervisor. TFLD is Task Force Leader. These come from the CICCS 2026 Operations position list. Use the guide for each position's training and experience requirements.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "STEN Strike Team Leader Engine (engine strike team); ENGB Engine Boss; DIVS Division/Group Supv; TFLD Task Force Leader", "wh": ["STEN Strike Team Leader Engine; ENGB Engine Boss (engine strike team); DIVS Division/Group Supv; TFLD Task Force Leader", "STEN Staging Area Engine Leader (engine strike team); ENGB Engine Boss; DIVS Division/Group Supv; TFLD Task Force Leader", "STEN Strike Team Leader Engine (engine strike team); ENGB Engine Boss; DIVS Dispatch Supervisor; TFLD Task Force Leader"], "hash": "sha256:be71f3f5941574439930d5df09179fc95170afd4fea21ac7a97634f1c656dcee"}, {"n": 16, "q": "A new UAS program asks which ICS positions cover drones. What does CICCS 2026 list?", "a": "Unmanned Aircraft Systems Manager (UASM), UAS Leader (UASL), and UAS Pilot (UASP), all in the Air Operations positions of CICCS 2026.", "qh": "A new UAS program asks which ICS positions cover drones. What does CICCS 2026 list?", "ah": "Unmanned Aircraft Systems Manager (UASM), UAS Leader (UASL), and UAS Pilot (UASP), all in the Air Operations positions of CICCS 2026.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "UASM, UASL, and UASP: UAS Manager, Leader, and Pilot", "wh": ["UASM, UASL, and UASO: UAS Manager, Leader, and Observer", "ATGS, HLCO, and UASP: air tactical, helicopter coordinator, UAS Pilot", "UAVM, UAVL, and UAVP: UAV Manager, Leader, and Pilot"], "hash": "sha256:9939bae2e00004dee448b15292f16a6a2b2deaab94df9a25367e2d8d8803df4b"}, {"n": 17, "q": "On the line you need a quick reference for Levels of Engagement and Powerline Safety. Which FIRESCOPE publication covers that, and what's its ICS number?", "a": "The FIRESCOPE Field Operations Guide, ICS 420-1 (2022 edition). It covers Wildland Fire Management Guiding Principles, Tactical Engagement, Levels of Engagement, Powerline Safety, and a Structure Assessment Checklist (FIRESCOPE FOG page).", "qh": "On the line you need a quick reference for Levels of Engagement and Powerline Safety. Which FIRESCOPE publication covers that, and what's its ICS number?", "ah": "The FIRESCOPE Field Operations Guide, ICS 420-1 (2022 edition). It covers Wildland Fire Management Guiding Principles, Tactical Engagement, Levels of Engagement, Powerline Safety, and a Structure Assessment Checklist (FIRESCOPE FOG page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "The FIRESCOPE Field Operations Guide, ICS 420-1 (2022)", "wh": ["The FIRESCOPE Glossary of Terms, ICS 010-1", "The FIRESCOPE Fireline EMT/Paramedic manual, ICS 702", "The CICCS Qualification Guide, 2026 edition"], "hash": "sha256:79913b7e1fdf69a6205c6d02c5a761ba6ac2e521a98f2efe93e6de74b795ae56"}, {"n": 18, "q": "A Lake Fire update says CAL FIRE stays in unified command with CAIIMT2, but CAL FIRE IMT 5 is released. What does that tell you about the difference between an agency's role in command and a specific team's assignment?", "a": "Unified command is held at the agency level, with CAL FIRE as one of the commanding agencies alongside CAIIMT2. An individual CAL FIRE team (IMT 5) can be released while CAL FIRE stays in unified command (CAL FIRE Lake Fire update, 20 Jul 2024).", "qh": "A Lake Fire update says CAL FIRE stays in unified command with CAIIMT2, but CAL FIRE IMT 5 is released. What does that tell you about the difference between an agency's role in command and a specific team's assignment?", "ah": "Unified command is held at the agency level, with CAL FIRE as one of the commanding agencies alongside CAIIMT2. An individual CAL FIRE team (IMT 5) can be released while CAL FIRE stays in unified command (CAL FIRE Lake Fire update, 20 Jul 2024).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Unified command is agency-level: one CAL FIRE team can leave while CAL FIRE stays in command", "wh": ["Releasing IMT 5 ended CAL FIRE's role in unified command on the Lake Fire", "CAIIMT2 took sole command, since unified command needs a CAL FIRE IMT on scene", "Unified command is team-level: the remaining team speaks for every agency"], "hash": "sha256:484e97e9844a20474872cfcdfc75187080931c0eacf3563f7f1a5503352ddced"}], "sources": [{"label": "CAL FIRE Fire Protection", "url": "https://www.fire.ca.gov/what-we-do/fire-protection"}, {"label": "CAL FIRE What We D
