screen, body, buttons, triggers, and lanyard points.<\/li><\/ol>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li><strong>It fails.<\/strong> A TIC is a mechanical device that can fail at the worst time, including dead batteries. If it fails and you went deep without a line, you may not be able to retrace your path (EFO 37508). Basic skills save you when the TIC dies.<\/li><li><strong>It speeds you up.<\/strong> With their sight \"back,\" firefighters tend to move too fast and too deep, <strong>stand and walk where they would have crawled<\/strong>, and lose crew contact (EFO 37508).<\/li><li><strong>It can't see through<\/strong> walls, beds, windows or glass, mirrors, or water. Shiny surfaces reflect heat, and you may even see your own reflection. Sprinkler water can shield hot spots (EFO 37508).<\/li><li><strong>Misreading the image<\/strong> can make you miss flashover signs, collapse signs, or victims. A hole in the floor with fire below can be misread (EFO 37508). NIOSH: a TIC <strong>cannot reliably show a structural hazard<\/strong> (2018-154, citing NIST 2011).<\/li><li><strong>Below grade:<\/strong> don't go after a basement fire by the interior stairway. Attack it from an exterior door, window, or other opening, then reassess (NIOSH 2018-154).<\/li><li><strong>A TIC doesn't replace air, mask, or Mayday discipline.<\/strong> In F2022-03, a crew that couldn't find the stairs went out, got directions and a TIC, and went back in. A firefighter then fell on the stairs, lost his air, and his mask was displaced. He died of smoke inhalation. His TIC and helmet were found on the floor. In F2020-10, RIT members using TICs and a tagline still entered the wrong room, and a captain lost his TIC when falling ceiling material hit him.<\/li><li><strong>TIC as messenger:<\/strong> in F2023-10, a captain's TIC showed a warped steel I-beam and heavy ceiling heat, but his radio failed inside the steel ship, and he had to walk out to report it. Seeing the hazard isn't enough. You have to get the information to command.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Your FLIR K33 is in Basic mode and you turn toward a doorway with fire in it. Exactly what condition makes it switch to the low-sensitivity range, and which part of the screen does it measure?", "a": "More than 2% of the pixels in the center box (15%–85% of screen width and height) stay above 150 °C (302 °F) for more than 1 second.", "qh": "Your FLIR K33 is in Basic mode and you turn toward a doorway with fire in it. Exactly what condition makes it switch to the low-sensitivity range, and which part of the screen does it measure?", "ah": "More than 2% of the pixels in the center box (15%–85% of screen width and height) stay above 150 °C (302 °F) for more than 1 second.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "&gt;2% of center-box pixels (15–85%) above 150 °C (302 °F) for &gt;1 s", "wh": ["&gt;98% of center-box pixels (15–85%) above 150 °C (302 °F) for &gt;1 s", "&gt;2% of center-box pixels (15–85%) above 100 °C (212 °F) for &gt;1 s", "&gt;2% of full-screen pixels above 150 °C (302 °F) for &gt;1 s"], "hash": "sha256:315bda8936d1e1076861b671b35b0c241556f7c0a0a11e200fdb70150d1fae67"}, {"n": 2, "q": "After knockdown the room cools. What has to happen before the K33/K53 switches back to high sensitivity, and what icon tells you which range you're in?", "a": "More than 98% of the pixels in that box must stay below 100 °C (50 °C under the 150 °C high-range max) for more than 1 second. The low-sensitivity mode indicator shows while the camera is in the low-sensitivity (hot) range.", "qh": "After knockdown the room cools. What has to happen before the K33/K53 switches back to high sensitivity, and what icon tells you which range you're in?", "ah": "More than 98% of the pixels in that box must stay below 100 °C (50 °C under the 150 °C high-range max) for more than 1 second. The low-sensitivity mode indicator shows while the camera is in the low-sensitivity (hot) range.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "&gt;98% of box pixels below 100 °C for &gt;1 s; low-sensitivity icon shows hot range", "wh": ["&gt;98% of box pixels below 150 °C for &gt;1 s; low-sensitivity icon shows hot range", "&gt;2% of box pixels below 100 °C for &gt;1 s; low-sensitivity icon shows hot range", "&gt;98% of box pixels below 100 °C for &gt;1 s; overheating icon shows hot range"], "hash": "sha256:d6c3e8318b42368f0cf4e0d807dd6b7e17a10d3aa5a6be927702dea3aabdfced"}, {"n": 3, "q": "On a K55 you switch from Basic to Search and Rescue mode. What happens to the temperature range and the heat colorization, and why is that better for finding a person?", "a": "The range locks to high sensitivity (−20 to +150 °C), and only 100–150 °C gets colorized. Locking out the hot-range switch keeps high contrast on cooler things like people, even with fire in view.", "qh": "On a K55 you switch from Basic to Search and Rescue mode. What happens to the temperature range and the heat colorization, and why is that better for finding a person?", "ah": "The range locks to high sensitivity (−20 to +150 °C), and only 100–150 °C gets colorized. Locking out the hot-range switch keeps high contrast on cooler things like people, even with fire in view.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Locks high-sens (−20 to 150 °C), colors only 100–150 °C; keeps people high-contrast", "wh": ["Locks low-sens (0 to 650 °C), colors only 100–150 °C; keeps people high-contrast", "Locks high-sens (−20 to 150 °C), colors 250–650 °C; keeps people high-contrast", "Stays auto-ranging, colors only 100–150 °C; keeps people high-contrast"], "hash": "sha256:4263bd160370653a7865e7278f922d41bdb6ce86c1fc84d5851901532a2002fb"}, {"n": 4, "q": "A K55 shows a blue mode icon. What does that mean, and which two modes use it? How do you get back to Basic mode fast?", "a": "Blue means the range is locked to high sensitivity. Search and rescue mode and heat detection mode use it (green modes auto-switch). Push the on/off button for less than 1 second to return to Basic.", "qh": "A K55 shows a blue mode icon. What does that mean, and which two modes use it? How do you get back to Basic mode fast?", "ah": "Blue means the range is locked to high sensitivity. Search and rescue mode and heat detection mode use it (green modes auto-switch). Push the on/off button for less than 1 second to return to Basic.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Range locked high-sens; S&amp;R and heat detection; on/off under 1 s for Basic", "wh": ["Range auto-switching; S&amp;R and heat detection; on/off under 1 s for Basic", "Range locked high-sens; S&amp;R and Fire modes; on/off under 1 s for Basic", "Range locked high-sens; S&amp;R and heat detection; hold on/off 3–10 s for Basic"], "hash": "sha256:4f53f9afed01d986f1a3e34cede0317d61da5f3a182b4c5f44cd83e25d62b672"}, {"n": 5, "q": "During overhaul a member wants the camera to show \"only the hot stuff.\" Which FLIR mode does that, how does it decide what to color, and what other uses does the manual list for it?", "a": "Heat detection mode colors the hottest 20% of the scene. The manual also lists finding thermal patterns such as people in car seats after crashes, and searching for people in water and open landscapes.", "qh": "During overhaul a member wants the camera to show \"only the hot stuff.\" Which FLIR mode does that, how does it decide what to color, and what other uses does the manual list for it?", "ah": "Heat detection mode colors the hottest 20% of the scene. The manual also lists finding thermal patterns such as people in car seats after crashes, and searching for people in water and open landscapes.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Heat detection: colors hottest 20%; also car seats, water, open terrain", "wh": ["Heat detection: colors hottest 10%; also car seats, water, open terrain", "Fire mode: colors 250–650 °C; also car seats, water, open terrain", "Heat detection: colors 100–150 °C; also car seats, water, open terrain"], "hash": "sha256:a4f3b03629c00813f967f27ad933fcaf38e93e6840cd3c5f4715f9f5ad3614d2"}, {"n": 6, "q": "Your crew scans the first floor of a house with a TIC and sees no heat, but smoke is pushing from the eaves. Why can't you rule out a basement fire, according to NIOSH 2018-154, and what should you do?", "a": "Wood flooring with carpet or laminate insulates and blocks heat transfer, so a TIC may not detect a basement fire from the ground floor. Always check for a below-grade area, and don't attack it down the interior stairs. Use an exterior door, window, or other opening, then reassess.", "qh": "Your crew scans the first floor of a house with a TIC and sees no heat, but smoke is pushing from the eaves. Why can't you rule out a basement fire, according to NIOSH 2018-154, and what should you do?", "ah": "Wood flooring with carpet or laminate insulates and blocks heat transfer, so a TIC may not detect a basement fire from the ground floor. Always check for a below-grade area, and don't attack it down the interior stairs. Use an exterior door, window, or other opening, then reassess.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Floors insulate heat; check below grade, attack from an exterior opening", "wh": ["Floors insulate heat; check below grade, attack down the interior stairs", "Smoke blocks the TIC; check below grade, attack from an exterior opening", "Floors insulate heat; switch to heat detection mode and rescan the floor"], "hash": "sha256:ff10dcc053557b2b0e379bdcb02346abaf2d1d95ec8e88b89f87b3379030ae64"}, {"n": 7, "q": "A Bullard user and a FLIR user stand in the same room. Why might the Bullard show its low-sensitivity indicator before the FLIR shows its icon?", "a": "Bullard's brochure says its low-sensitivity indicator comes on from about 230 °F. FLIR K-series cameras switch when objects go above 302 °F (150 °C).", "qh": "A Bullard user and a FLIR user stand in the same room. Why might the Bullard show its low-sensitivity indicator before the FLIR shows its icon?", "ah": "Bullard's brochure says its low-sensitivity indicator comes on from about 230 °F. FLIR K-series cameras switch when objects go above 302 °F (150 °C).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Bullard's indicator starts at ~230 °F; FLIR switches above 302 °F", "wh": ["Bullard's indicator starts at ~302 °F; FLIR switches above 230 °F", "Bullard's indicator starts at ~230 °F; FLIR switches above 212 °F", "Bullard's indicator starts at ~230 °C; FLIR switches above 302 °C"], "hash": "sha256:30d272e875b6339805ca345089be671e3fd0e7699cbfd3e5f18860a44247210c"}, {"n": 8, "q": "Give four limitations of a TIC from USFA EFO 37508 that could get a searcher lost or hurt even when the camera is working.", "a": "Any four: it can't see through walls, glass, mirrors, or water; shiny surfaces give false reflections; sprinkler water can shield hot spots; users move too fast or too deep and stand up where they would crawl; users lose crew contact and become disoriented; the limited field of view means you must scan high and low; misreading can miss flashover, collapse, or victims.", "qh": "Give four limitations of a TIC from USFA EFO 37508 that could get a searcher lost or hurt even when the camera is working.", "ah": "Any four: it can't see through walls, glass, mirrors, or water; shiny surfaces give false reflections; sprinkler water can shield hot spots; users move too fast or too deep and stand up where they would crawl; users lose crew contact and become disoriented; the limited field of view means you must scan high and low; misreading can miss flashover, collapse, or victims.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No seeing through walls or glass, false reflections, moving too fast, narrow view", "wh": ["No seeing through walls or glass, false reflections, moving too fast, sees through smoke", "Sees through glass and water, false reflections, moving too fast, narrow view", "No seeing through walls or glass, false reflections, moving too slow, narrow view"], "hash": "sha256:d427750fdbddfb879cd2de3d46b702c256b4ca18f85f69fe52307dcbebac54dd"}, {"n": 9, "q": "NIOSH FACE F2020-10: the RIT went in with thermal imagers and a tagline. What still went wrong, and what does NIOSH recommend primary search crews and RIT take into commercial or complex buildings?", "a": "Obstacles slowed them, they went into the wrong room (the computer room), and the captain lost his TIC when falling ceiling material struck him. They backed out as conditions worsened. NIOSH recommends that primary search crews and RIT advance with a hoseline or tagline in commercial or complex structures, with training in large-area search.", "qh": "NIOSH FACE F2020-10: the RIT went in with thermal imagers and a tagline. What still went wrong, and what does NIOSH recommend primary search crews and RIT take into commercial or complex buildings?", "ah": "Obstacles slowed them, they went into the wrong room (the computer room), and the captain lost his TIC when falling ceiling material struck him. They backed out as conditions worsened. NIOSH recommends that primary search crews and RIT advance with a hoseline or tagline in commercial or complex structures, with training in large-area search.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Wrong room and a lost TIC; advance with a hoseline or tagline", "wh": ["Wrong room and a lost TIC; advance with two TICs per crew", "TIC batteries died mid-search; advance with a hoseline or tagline", "Wrong room and a lost TIC; search without lines to move faster"], "hash": "sha256:fad8fdcfcf05601f671ed188a17bfe3f9a2da34fe2ae3676693e41a488d3f2d9"}, {"n": 10, "q": "In NIOSH FACE F2022-03, the crew went back in with a TIC. Why is this case taught as a reminder about SCBA discipline rather than about the TIC, and what was the first key recommendation?", "a": "The death came from a fall with catastrophic air loss and a displaced mask, causing smoke inhalation, not from TIC performance. Key Recommendation #1 was to reinforce SCBA training and keep the mask on in IDLH environments.", "qh": "In NIOSH FACE F2022-03, the crew went back in with a TIC. Why is this case taught as a reminder about SCBA discipline rather than about the TIC, and what was the first key recommendation?", "ah": "The death came from a fall with catastrophic air loss and a displaced mask, causing smoke inhalation, not from TIC performance. Key Recommendation #1 was to reinforce SCBA training and keep the mask on in IDLH environments.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Fall, air loss, and displaced mask caused it; reinforce SCBA, keep mask on", "wh": ["TIC failure in heavy smoke caused it; reinforce SCBA, keep mask on", "Fall, air loss, and displaced mask caused it; issue every member a TIC", "Fall and TIC battery failure caused it; reinforce SCBA, keep mask on"], "hash": "sha256:56400949e3b3bc386479e6ac23ace44e3be40ec05c73cceb550443eedd2b64f2"}, {"n": 11, "q": "K-series \"Low gain mode\" sounds safer because the camera never switches. What is its one advantage, and what do you give up?", "a": "Advantage: no non-uniformity correction (NUC) when an object above 150 °C enters the scene. Cost: lower sensitivity and more signal noise.", "qh": "K-series \"Low gain mode\" sounds safer because the camera never switches. What is its one advantage, and what do you give up?", "ah": "Advantage: no non-uniformity correction (NUC) when an object above 150 °C enters the scene. Cost: lower sensitivity and more signal noise.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No NUC when &gt;150 °C objects enter; lower sensitivity, more noise", "wh": ["No NUC when &gt;150 °C objects enter; higher sensitivity, less noise", "Colors only the hottest 20%; lower sensitivity, more noise", "No NUC when &gt;100 °C objects enter; lower sensitivity, more noise"], "hash": "sha256:2ac0226d22b87cf808f27fedd77df5d15e501cb3b84522c5b51cde9820aded24"}, {"n": 12, "q": "In NIOSH FACE F2023-10, how did the search crew combine a rope, a TIC, and the PASS to find the missing firefighter?", "a": "They followed the hoseline to the nozzle, tied a search rope to a burned-out vehicle, heard a PASS alarm, and used the TIC to navigate through the vehicles toward the sound. They found him about 35–40 ft from the rope anchor.", "qh": "In NIOSH FACE F2023-10, how did the search crew combine a rope, a TIC, and the PASS to find the missing firefighter?", "ah": "They followed the hoseline to the nozzle, tied a search rope to a burned-out vehicle, heard a PASS alarm, and used the TIC to navigate through the vehicles toward the sound. They found him about 35–40 ft from the rope anchor.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Rope tied to a vehicle, TIC used to follow the PASS sound; found 35–40 ft out", "wh": ["Rope tied to a vehicle, TIC used to follow the PASS sound; found 135–140 ft out", "Rope tied to the nozzle, TIC alone, PASS silent; found 35–40 ft out", "No rope; TIC used to follow the PASS sound through vehicles; found 35–40 ft out"], "hash": "sha256:7a830b2764d775f018f36c5479d284dd9572ca5464e096d8e6b70abed202e2d9"}], "sources": [{"label": "FLIR K33/K53 Series User's Manual (T810170)", "url": "https://docs.flir.com/T810170/en-US/latest/T810170_en-US_AI_FLIR-K33-K53_UM.pdf"}, {"label": "FLIR Kxx Series (K45/K55/K65) User's Manual (T559946)", "url": "https://res.cloudinary.com/iwh/image/upload/q_auto,g_center/assets/1/26/FLIR_K55-K65_User_Manual.pdf"}, {"label": "Bullard Thermal Imaging Family Brochure (AM EN 0221), local: /workspace/Firefighter_Reference_Library/09_Thermal_Imaging_Cameras/Bullard_Thermal_Imaging_Family_Brochure_AM_EN_0221.pdf", "url": ""}, {"label": "NIOSH 2018-154, Preventing Deaths and Injuries of Fire Fighters Working at Basement and Other Below-Grade Fires", "url": "https://www.cdc.gov/niosh/docs/2018-154/pdfs/2018-154.pdf"}, {"label": "USFA/NFA EFO paper, J. A. Johnson, Proper Use and Deployment of Thermal Image Cameras (2004 literature review)", "url": "https://apps.usfa.fema.gov/pdf/efop/efo37508.pdf"}, {"label": "NIOSH FACE F2020-10, library search, out of air (California)", "url": "https://www.cdc.gov/niosh/firefighters/programs/pdfs/face202010.pdf"}, {"label": "NIOSH FACE F2022-03, smoke inhalation during initial attack (Kansas)", "url": "https://www.cdc.gov/niosh/firefighters/programs/pdfs/face202203.pdf"}, {"label": "NIOSH FACE F2023-10, marine vessel, lost and out of air (New Jersey)", "url": "https://www.cdc.gov/niosh/firefighters/programs/pdfs/face202310.pdf"}, {"label": "Scout batches 01 and 03 (TIC sections): /workspace/can-report/scout-batch-01.md, /workspace/can-report/scout-batch-03.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 09 Communications, Navigation and Accountability &gt; 09.1 Navigation and Accountability &gt; tool 4. <strong>Unlocks after:<\/strong> 01.2 SCBA. <strong>Unlocks:<\/strong> 02.3 Thermal Imaging for Fire Attack (02.3.1–02.3.4). <strong>Cross-links:<\/strong> 02.3 TIC for Fire Attack links here; 09.1.1 PASS; 04.1 Mayday, Self-Survival and Air Management.", "note_html": "Study aid only. Camera specs are from the FLIR K33/K53 and K45/K55/K65 user manuals and a Bullard brochure. Check your own camera's manual. NFPA 1801 (thermal imagers) is cited by number only."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 410.99, "y": 477.53, "angle": 136.5, "vx": 652.22, "vy": 504.66, "vangle": 21.5}, "09.2": {"id": "09.2", "name": "Radio Communications and Mayday Procedures", "path": "09", "kind": "main", "parent": null, "prereqRaw": "09.1", "children": [], "prereqs": ["09.1"], "unlocks": ["09.4", "09.C"], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 640, "y": 450.0, "vx": 615.0, "vy": 640, "vangle": null}, "09.3": {"id": "09.3", "name": "SCBA Telemetry and Electronic Accountability (MSA A2, Scott)", "path": "09", "kind": "main", "parent": null, "prereqRaw": "09.1, 01.2", "children": [], "prereqs": ["09.1", "01.2"], "unlocks": ["09.C"], "cross": ["01.2.2"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 840, "y": 450.0, "vx": 615.0, "vy": 790, "vangle": null}, "09.4": {"id": "09.4", "name": "Incident Command System (NIMS/ICS)", "path": "09", "kind": "main", "parent": null, "prereqRaw": "09.2", "children": [], "prereqs": ["09.2"], "unlocks": ["09.C"], "cross": ["10.6.8"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1040, "y": 450.0, "vx": 615.0, "vy": 940, "vangle": null}, "09.C": {"id": "09.C", "name": "CAPSTONE: Incident Safety / Accountability Officer", "path": "09", "kind": "capstone", "parent": null, "prereqRaw": "09.1 to 09.4", "children": [], "prereqs": ["09.1", "09.2", "09.3", "09.4"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1640, "y": 450.0, "vx": 615.0, "vy": 1390, "vangle": null}, "10.1": {"id": "10.1", "name": "Station Life, Daily Apparatus and Equipment Checks", "path": "10", "kind": "main", "parent": null, "prereqRaw": "01.0", "children": [], "prereqs": ["01.0"], "unlocks": ["10.2", "10.6", "10.C"], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 440, "y": 600.0, "vx": 820.0, "vy": 490, "vangle": null}, "10.2": {"id": "10.2", "name": "Certification Ladder (FF I/II, Driver, Instructor, Officer)", "path": "10", "kind": "main", "parent": null, "prereqRaw": "10.1", "children": [], "prereqs": ["10.1"], "unlocks": ["10.3", "10.4", "10.C"], "cross": ["10.6", "10.6.7", "10.6.0"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 640, "y": 600.0, "vx": 820.0, "vy": 640, "vangle": null}, "10.3": {"id": "10.3", "name": "Company Officer: Strategy and Tactics (USFA STICO/PICO)", "path": "10", "kind": "main", "parent": null, "prereqRaw": "10.2, 02.5", "children": [], "prereqs": ["10.2", "02.5"], "unlocks": ["10.5", "10.C"], "cross": ["02.5"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 840, "y": 600.0, "vx": 820.0, "vy": 790, "vangle": null}, "10.4": {"id": "10.4", "name": "Fire Instructor and Training Safety", "path": "10", "kind": "main", "parent": null, "prereqRaw": "10.2, 01.5", "children": [], "prereqs": ["10.2", "01.5"], "unlocks": ["10.C"], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1040, "y": 600.0, "vx": 820.0, "vy": 940, "vangle": null}, "10.5": {"id": "10.5", "name": "Promotional Exam Prep and Leadership", "path": "10", "kind": "main", "parent": null, "prereqRaw": "10.3", "children": [], "prereqs": ["10.3"], "unlocks": ["10.C"], "cross": ["10.6.7"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1240, "y": 600.0, "vx": 820.0, "vy": 1090, "vangle": null}, "10.6": {"id": "10.6", "name": "CAL FIRE Career Path", "path": "10", "kind": "main", "parent": null, "prereqRaw": "10.1", "children": ["10.6.0", "10.6.1", "10.6.10", "10.6.11", "10.6.12", "10.6.13", "10.6.2", "10.6.3", "10.6.4", "10.6.5", "10.6.6", "10.6.7", "10.6.8", "10.6.9"], "prereqs": ["10.1"], "unlocks": ["10.6.0", "10.6.1", "10.6.2", "10.6.3", "10.6.4", "10.6.5", "10.6.6", "10.6.7", "10.6.8", "10.6.9", "10.6.10", "10.6.11", "10.6.12", "10.6.13", "10.C"], "cross": ["10.2"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1440, "y": 600.0, "vx": 820.0, "vy": 1240, "vangle": null}, "10.6.0": {"id": "10.6.0", "name": "CAL FIRE Overview (Mission, Size, and Headquarters)", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.2"], "doc": {"title": "10.6.0 CAL FIRE Overview (Mission, Size, and Headquarters)", "file": "10.6.0_CAL_FIRE_Overview_Mission_Size_and_Headquarters.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>The <strong>California Department of Forestry and Fire Protection (CAL FIRE)<\/strong>. Its stated mission: to <strong>serve and safeguard the people and protect the property and resources of California<\/strong>. Shared values: <strong>Integrity, Service, Community, Diversity<\/strong>. The About page says CAL FIRE \"celebrates nearly 140 years of history.\"<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>People:<\/strong> \"nearly 12,000 permanent and seasonal employees\" (FFI posting JC-533177).<\/li><li><strong>Budget (2026-27 Governor's Budget):<\/strong> $5.3 billion ($2.2 billion General Fund) and <strong>14,044 positions<\/strong>. Employees and budgeted positions are different measures from different sources. Don't merge them.<\/li><li><strong>Land:<\/strong> responsible for <strong>over 31 million acres<\/strong> of State Responsibility Area (SRA). SRA is in <strong>56 of 58 counties<\/strong>. CAL FIRE provides emergency services in <strong>36 of 58 counties<\/strong>.<\/li><li><strong>Stations:<\/strong> the 2026-27 Budget says CAL FIRE \"operates 237 fire stations.\"<\/li><li><strong>Initial attack goal:<\/strong> aircraft can reach remote areas in about <strong>20 minutes<\/strong>, with the goal of keeping <strong>95% of fires at 10 acres or less<\/strong>.<\/li><li><strong>Sacramento HQ:<\/strong> 715 P St, Sacramento, CA 95814. Phone 916-653-5123. Mail: P.O. Box 944246, Sacramento, CA 94244-2460.<\/li><li><strong>Human Resources / Examination Unit:<\/strong> 710 Riverpoint Ct, West Sacramento, CA 95605 (916-894-9900).<\/li><li><strong>Recruitment:<\/strong> CALFIRErecruitment@fire.ca.gov, (916) 894-9585.<\/li><li><strong>Executive staff (as published):<\/strong> Joe Tyler, Director/Fire Chief. Anale Burlew, Chief Deputy Director, Operations. Kerry Garcia, Chief Deputy Director, Administration. Daniel Berlant, State Fire Marshal.<\/li><li><strong>Newest top post:<\/strong> Chief Deputy Director, Administration (effective 17 Feb 2025). It's \"a newly established position\" for day-to-day administration, working with the Chief Deputy Director of Operations and the State Fire Marshal.<\/li><li><strong>Org chart:<\/strong> Ranger found <strong>no official CAL FIRE org-chart graphic<\/strong>. The command structure in 10.6.1 comes from official text, not a chart.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>All-risk department:<\/strong> \"Beyond its wildland firefighting role, CAL FIRE is an 'all-risk' department.\" It runs medical aids, hazmat spills, swift-water rescue, search and rescue, civil disturbances, train wrecks, floods, and earthquakes.<\/li><li><strong>Prevention is part of the mission:<\/strong> preventing wildfires in the SRA is \"a vital part of CAL FIRE's mission\" (Our Organization page).<\/li><li><strong>Where to send things:<\/strong> policy and executive contacts go to Sacramento HQ. Exam applications go to the Examination Unit in West Sacramento. <strong>FFI application packages<\/strong> go to Southern Region Hiring in Fresno (see 10.6.5).<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li>The Office of the State Fire Marshal has been \"part of the CAL FIRE team since 1995\" (Our Organization page).<\/li><li>The Forest Practice Act dates to 1945 and was revised in 1973 (Our Organization page).<\/li><\/ul>"}], "qa": [{"n": 1, "q": "A friend says CAL FIRE \"just fights brush fires.\" Correct them using the department's own wording, and name at least four non-fire incident types.", "a": "The Our Organization page says that beyond its wildland role, CAL FIRE is an \"all-risk\" department. Examples: medical aids, hazmat spills, swift-water rescues, search and rescue, civil disturbances, train wrecks, floods, and earthquakes. The Fire Protection page also lists structure fires, accidents, heart attacks, and lost hikers.", "qh": "A friend says CAL FIRE \"just fights brush fires.\" Correct them using the department's own wording, and name at least four non-fire incident types.", "ah": "The Our Organization page says that beyond its wildland role, CAL FIRE is an \"all-risk\" department. Examples: medical aids, hazmat spills, swift-water rescues, search and rescue, civil disturbances, train wrecks, floods, and earthquakes. The Fire Protection page also lists structure fires, accidents, heart attacks, and lost hikers.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "An \"all-risk\" department: medical aids, hazmat spills, swift-water rescues, floods", "wh": ["A wildland-only agency: structure and medical calls go to local departments", "An all-risk department, but only for fires, floods, and earthquakes", "A resource agency: it fights fire only inside the State Responsibility Area"], "hash": "sha256:bc7d297a96fcdca18ae259907f358ccf5bf5dc9950c40bd1857e7d5326313993"}, {"n": 2, "q": "Someone quotes \"about 12,000 people,\" and someone else quotes \"14,044 positions.\" Is one of them wrong? How should you present both?", "a": "Neither is wrong. They measure different things from different sources. \"Nearly 12,000 permanent and seasonal employees\" is from the FFI posting (JC-533177). \"14,044 positions\" is budgeted positions in the 2026-27 Governor's Budget. Cite each with its source and don't average them.", "qh": "Someone quotes \"about 12,000 people,\" and someone else quotes \"14,044 positions.\" Is one of them wrong? How should you present both?", "ah": "Neither is wrong. They measure different things from different sources. \"Nearly 12,000 permanent and seasonal employees\" is from the FFI posting (JC-533177). \"14,044 positions\" is budgeted positions in the 2026-27 Governor's Budget. Cite each with its source and don't average them.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Neither is wrong: ~12,000 employees (JC-533177) vs 14,044 budgeted positions; cite both", "wh": ["The 12,000 figure is outdated, so report only the Budget's 14,044", "Average the two and report about 13,000 CAL FIRE employees", "The 14,044 figure is wrong, so report only the posting's 12,000"], "hash": "sha256:7acd1733e4bdc0a48cef1a4131f97359bb1f3e3b7e6cd29e1eb92e73d94b7247"}, {"n": 3, "q": "Your county has State Responsibility Area land. Does that automatically mean CAL FIRE crews do the initial attack there? Explain with the county figures.", "a": "No. SRA is in 56 of 58 counties, but CAL FIRE provides emergency services in 36. In six Contract Counties (Kern, Los Angeles, Marin, Orange, Santa Barbara, Ventura), the county protects the SRA under contract with CAL FIRE (Cooperative Efforts page; see 10.6.4).", "qh": "Your county has State Responsibility Area land. Does that automatically mean CAL FIRE crews do the initial attack there? Explain with the county figures.", "ah": "No. SRA is in 56 of 58 counties, but CAL FIRE provides emergency services in 36. In six Contract Counties (Kern, Los Angeles, Marin, Orange, Santa Barbara, Ventura), the county protects the SRA under contract with CAL FIRE (Cooperative Efforts page; see 10.6.4).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No: SRA is in 56 counties, CAL FIRE serves 36, and six Contract Counties protect their own SRA", "wh": ["Yes: CAL FIRE does initial attack on SRA land in all 56 counties that have it", "No: SRA is in 36 counties, CAL FIRE serves 56, and six Contract Counties cover the rest", "No: SRA is in 56 counties, CAL FIRE serves 36, and four Contract Counties protect their own SRA"], "hash": "sha256:17473e38248d511641e7b883eb520248a8f5f7f764859041998573914086d617"}, {"n": 4, "q": "State CAL FIRE's initial-attack aviation goal and the fire-size target it supports.", "a": "Initial-attack aircraft can reach even the most remote parts of California in about 20 minutes. The goal is keeping 95% of fires at 10 acres or less (What We Do page).", "qh": "State CAL FIRE's initial-attack aviation goal and the fire-size target it supports.", "ah": "Initial-attack aircraft can reach even the most remote parts of California in about 20 minutes. The goal is keeping 95% of fires at 10 acres or less (What We Do page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "About 20 minutes to remote areas; keep 95% of fires at 10 acres or less", "wh": ["About 20 minutes to remote areas; keep 90% of fires at 10 acres or less", "About 30 minutes to remote areas; keep 95% of fires at 10 acres or less", "About 20 minutes to remote areas; keep 95% of fires at 100 acres or less"], "hash": "sha256:f1c1e87dff920e329e13a9a249f212432b43c56225b6c4eb43386f38cc01513b"}, {"n": 5, "q": "You need to (a) mail an FFI application package, (b) file a promotional exam application on paper, and (c) reach the Director's office. Where does each go?", "a": "(a) CAL FIRE Southern Region Hiring, 1234 East Shaw Avenue, Fresno (or online through CalCareers). (b) The Examination Unit, 710 Riverpoint Ct, West Sacramento. (c) HQ at 715 P St, Sacramento (executive office HQ.Executive@fire.ca.gov). Sources: JC-533177, exam bulletin EX-4883, Contacts page.", "qh": "You need to (a) mail an FFI application package, (b) file a promotional exam application on paper, and (c) reach the Director's office. Where does each go?", "ah": "(a) CAL FIRE Southern Region Hiring, 1234 East Shaw Avenue, Fresno (or online through CalCareers). (b) The Examination Unit, 710 Riverpoint Ct, West Sacramento. (c) HQ at 715 P St, Sacramento (executive office HQ.Executive@fire.ca.gov). Sources: JC-533177, exam bulletin EX-4883, Contacts page.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "(a) Southern Region Hiring, Fresno; (b) Examination Unit, West Sacramento; (c) HQ, 715 P St, Sacramento", "wh": ["(a) Northern Region Hiring, Santa Rosa; (b) Examination Unit, West Sacramento; (c) HQ, 715 P St, Sacramento", "(a) Southern Region Hiring, Fresno; (b) HQ, 715 P St, Sacramento; (c) Examination Unit, West Sacramento", "(a) Examination Unit, West Sacramento; (b) Southern Region Hiring, Fresno; (c) HQ, 715 P St, Sacramento"], "hash": "sha256:9640dc2754e87ed1943348c1658408c47eb207459f16337d245a2309e7ee65ab"}, {"n": 6, "q": "What executive position did CAL FIRE create in 2025, who holds it, and what is it for?", "a": "Chief Deputy Director, Administration, held by Kerry Garcia, effective 17 Feb 2025. Her profile calls it a newly established position focused on day-to-day administration, working with the Chief Deputy Director of Operations and the State Fire Marshal.", "qh": "What executive position did CAL FIRE create in 2025, who holds it, and what is it for?", "ah": "Chief Deputy Director, Administration, held by Kerry Garcia, effective 17 Feb 2025. Her profile calls it a newly established position focused on day-to-day administration, working with the Chief Deputy Director of Operations and the State Fire Marshal.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Chief Deputy Director, Administration: Kerry Garcia, for day-to-day administration", "wh": ["Chief Deputy Director, Administration: Anale Burlew, for day-to-day administration", "Deputy Director, Cooperative Fire Protection: Kerry Garcia, for contract counties", "Assistant State Fire Marshal: Kerry Garcia, for day-to-day prevention programs"], "hash": "sha256:197dd5954da123cfde8fb0bae00b67e9c17dfa31176ecbcc66273850350874ce"}, {"n": 7, "q": "Give the CAL FIRE mission statement and its four shared values.", "a": "Mission: serve and safeguard the people and protect the property and resources of California. Values: Integrity, Service, Community, Diversity (About page).", "qh": "Give the CAL FIRE mission statement and its four shared values.", "ah": "Mission: serve and safeguard the people and protect the property and resources of California. Values: Integrity, Service, Community, Diversity (About page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Serve and safeguard people, protect property and resources; Integrity, Service, Community, Diversity", "wh": ["Serve and safeguard people, protect property and resources; Integrity, Service, Courage, Diversity", "Serve and safeguard people, protect property and resources; Integrity, Respect, Community, Diversity", "Serve and safeguard people, protect property and resources; Honor, Service, Community, Diversity"], "hash": "sha256:eb200b0c92a28126c23229ffc64165a25c2f432192dd14bfe8db7239b17d762d"}, {"n": 8, "q": "A classmate hands you a \"CAL FIRE org chart\" from a random website. What does the record say about an official org chart, and where does the command structure in this tree come from?", "a": "Ranger found no official CAL FIRE org-chart graphic (batch 04). The Our Organization page, Executive Staff list, and eBudget 3540 are text or budget displays, not charts. The command structure here comes from official text: exam bulletins, the Contacts page, and GIS metadata.", "qh": "A classmate hands you a \"CAL FIRE org chart\" from a random website. What does the record say about an official org chart, and where does the command structure in this tree come from?", "ah": "Ranger found no official CAL FIRE org-chart graphic (batch 04). The Our Organization page, Executive Staff list, and eBudget 3540 are text or budget displays, not charts. The command structure here comes from official text: exam bulletins, the Contacts page, and GIS metadata.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No official chart was found; the structure comes from official text (bulletins, Contacts page, GIS)", "wh": ["The official chart is on the Our Organization page, and this tree copies it", "The official chart is eBudget display 3540, and this tree copies it directly", "No official chart exists, so this tree copies a widely shared unofficial chart"], "hash": "sha256:bd41d5884b24fcd7f4bc45c8a3194779653751b09a01ab2a5d358de06ead6f01"}], "sources": [{"label": "CAL FIRE About", "url": "https://www.fire.ca.gov/about"}, {"label": "CAL FIRE Our Organization", "url": "https://www.fire.ca.gov/about/our-organization"}, {"label": "CAL FIRE Executive Staff", "url": "https://www.fire.ca.gov/about/executive-staff"}, {"label": "Kerry Garcia profile", "url": "https://www.fire.ca.gov/about/executive-staff/profile-list/kerry-garcia"}, {"label": "CAL FIRE Contacts", "url": "https://www.fire.ca.gov/about/resources/cal-fire-contacts"}, {"label": "CAL FIRE What We Do", "url": "https://www.fire.ca.gov/what-we-do"}, {"label": "CAL FIRE Fire Protection", "url": "https://www.fire.ca.gov/what-we-do/fire-protection"}, {"label": "Cooperative Efforts (Contract Counties)", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/cooperative-efforts/"}, {"label": "Firefighter I posting JC-533177", "url": "https://calcareers.ca.gov/CalHrPublic/Jobs/JobPosting.aspx?JobControlId=533177"}, {"label": "Assistant Chief exam bulletin EX-4883", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4883"}, {"label": "2026-27 Governor's Budget Summary, Natural Resources", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}, {"label": "2026-27 Governor's Budget, Organization 3540", "url": "https://ebudget.ca.gov/2026-27/pdf/GovernorsBudget/3000/3540.pdf"}, {"label": "Ranger batches: /workspace/can-report/calfire/calfire-batch-01.md, calfire-batch-02.md, calfire-batch-04.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 0. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 10.2 Certification Ladder (statewide OSFM path).", "note_html": "Study aid only. Source: Ranger calfire-batch-01, -02, and -04 (official fire.ca.gov, CalCareers, and 2026-27 Governor's Budget pages, retrieved 17 Nov 2026). Names, phones, and counts change. Check the live pages."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1469.01, "y": 627.53, "angle": 43.5, "vx": 832.69, "vy": 1202.07, "vangle": 288.5}, "10.6.1": {"id": "10.6.1", "name": "Command Structure: Regions, Units, and Battalions", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": [], "doc": {"title": "10.6.1 Command Structure: Regions, Units, and Battalions", "file": "10.6.1_Command_Structure_Regions_Units_and_Battalions.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>CAL FIRE's official GIS metadata says: \"CAL FIRE administrative levels include statewide (Headquarters), Regions and Units.\" There are <strong>two regions<\/strong>, <strong>Northern<\/strong> (CNR) and <strong>Southern<\/strong> (CSR), and <strong>21 field units<\/strong> (12 Northern, 9 Southern). Inside a unit, <strong>Battalion Chiefs<\/strong> run subunits and <strong>Assistant Chiefs<\/strong> serve as Division or Deputy Chiefs. The six Contract Counties are covered in 10.6.4.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Region chiefs (Contacts page):<\/strong> Northern, George Morris III, (530) 224-2460. Southern, Mike van Loben Sels, (951) 314-3425. Each region also has two Assistant Region Chiefs.<\/li><li><strong>Region HQ (Facilities Public View, TYPE=RHQ):<\/strong><ul><li>Northern RHQ: 135 Ridgeway Ave, Santa Rosa (707-576-2275).<\/li><li>Southern RHQ: 1234 East Shaw, Fresno (559-222-2129). This is also the FFI hiring address.<\/li><li>There's also a separate <strong>Northern Operations Center<\/strong>: 6101 Airport Road, Redding. Both are official records, so don't collapse them into one \"Northern HQ.\"<\/li><\/ul><\/li><li><strong>Administrative Units GIS:<\/strong> 27 polygons = 21 field units + 6 Contract Counties (Marin MRN is Northern; Kern KRN, Los Angeles LAC, Orange ORC, Santa Barbara SBC, and Ventura VNC are Southern).<\/li><\/ul><p><strong>The 21 units<\/strong> (code: counties from the 2026 Unit Fire Plan title; HQ town from Contacts):<\/p><p>Northern (12):<\/p><ul><li><strong>HUU<\/strong> Humboldt-Del Norte: Humboldt, Del Norte. HQ Fortuna.<\/li><li><strong>SKU<\/strong> Siskiyou: Siskiyou. HQ Yreka.<\/li><li><strong>LMU<\/strong> Lassen-Modoc: Lassen, Modoc, Plumas. HQ Susanville.<\/li><li><strong>SHU<\/strong> Shasta-Trinity: Shasta, Trinity. HQ Redding.<\/li><li><strong>MEU<\/strong> Mendocino: Mendocino. HQ Willits.<\/li><li><strong>TGU<\/strong> Tehama-Glenn: Tehama, Glenn. HQ Red Bluff.<\/li><li><strong>BTU<\/strong> Butte: Butte. HQ Oroville.<\/li><li><strong>LNU<\/strong> Sonoma-Lake-Napa: Sonoma, Lake, Napa, Solano, Yolo, Colusa. HQ St. Helena.<\/li><li><strong>NEU<\/strong> Nevada-Yuba-Placer: Nevada, Yuba, Placer, Sierra, Sutter. HQ Auburn.<\/li><li><strong>AEU<\/strong> Amador-El Dorado: Amador, El Dorado, Alpine, Sacramento. HQ Camino.<\/li><li><strong>SCU<\/strong> Santa Clara: Santa Clara, Contra Costa, Alameda (West), Stanislaus (West), San Joaquin. HQ Morgan Hill.<\/li><li><strong>CZU<\/strong> San Mateo-Santa Cruz: San Mateo, Santa Cruz, San Francisco. HQ Felton.<\/li><\/ul><p>Southern (9):<\/p><ul><li><strong>TCU<\/strong> Tuolumne-Calaveras: Tuolumne, Calaveras (East), San Joaquin (East), Stanislaus. HQ San Andreas.<\/li><li><strong>MMU<\/strong> Madera-Mariposa-Merced: Madera, Mariposa, Merced. HQ Mariposa.<\/li><li><strong>FKU<\/strong> Fresno-Kings: Fresno, Kings. HQ Sanger.<\/li><li><strong>TUU<\/strong> Tulare: Tulare. HQ Visalia.<\/li><li><strong>BEU<\/strong> San Benito-Monterey: San Benito, Monterey. HQ Monterey.<\/li><li><strong>SLU<\/strong> San Luis Obispo: San Luis Obispo. HQ San Luis Obispo.<\/li><li><strong>BDU<\/strong> San Bernardino: San Bernardino, Inyo, Mono. HQ San Bernardino.<\/li><li><strong>RRU<\/strong> Riverside: Riverside. HQ Perris.<\/li><li><strong>SDU<\/strong> San Diego: San Diego, Imperial. HQ El Cajon.<\/li><li><strong>Unit Chief (class 1037):<\/strong> \"management responsibility for a specified geographical area called a unit.\" Oversees all operational and administrative functions. Serves as the State Office of Emergency Services <strong>Operational Area Coordinator<\/strong>, coordinates contract fire protection with local governments, and is the liaison to CDCR on cooperative programs (EX-5386).<\/li><li><strong>Assistant Chief (class 1039):<\/strong> \"the full supervisory level.\" In a typical unit, ACs serve as <strong>Division Chiefs<\/strong> over the whole administrative program, the operations program, or a conservation camp. In very large, complex units they may serve as <strong>Deputy Chiefs<\/strong> (EX-4883).<\/li><li><strong>Battalion Chief (class 9723):<\/strong> \"the first working supervisory level.\" BCs are <strong>subunit managers<\/strong> directing programs such as training, safety, the emergency command center, fire prevention, air operations, camps, and fire stations (Join CAL FIRE).<\/li><li><strong>Division Chief and Deputy Chief<\/strong> are assignments of the Assistant Chief class, not separate fire-protection class codes. One exception is a distinct class: <strong>Division Chief, California State Fire Marshal's Office (8966)<\/strong>.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Work Location Form:<\/strong> the 2027 FFI form lists units by name under Northern Region (CNR) and Southern Region (CSR), with separate non-handcrew and handcrew columns to rank (see 10.6.5). Knowing which unit covers which county tells you where you might work.<\/li><li><strong>Name variants:<\/strong> the Contacts page prints \"Nevada-Yuba Placer,\" while the WLF and GIS use \"Nevada-Yuba-Placer.\" GIS prints \"Sonoma-Lake Napa.\" The unit codes (NEU, LNU) are the reliable keys.<\/li><li><strong>Partial counties:<\/strong> some plan titles split a county, such as \"Alameda (West)\" or \"Calaveras (East).\" San Joaquin and Stanislaus each appear in two unit titles (SCU and TCU).<\/li><li><strong>Phone conflicts:<\/strong> some Contacts phones differ from Facilities HQ phones. For example, TUU is 916-584-1447 (Contacts) vs 559-732-5954 (Facilities), and BEU is 209-385-7344 vs 831-333-4600. Both are official, so record both and don't \"fix\" either.<\/li><li><strong>Reading a station record (Facilities layer domains, batch 05):<\/strong> FUNDING codes are B Schedule B, A Schedule A, L Local, C Combined Schedule A/B, G Greybook (may include county funded resources), and F Federal. STAFFING codes are P Paid, V Volunteer, C Combined Paid/Volunteer, and N Not Staffed. OWNER values include STATE, COUNTY, CITY, FEDERAL, TRIBAL, FIRE DISTRICT, DISTRICT OTHER, and PRIVATE. Funding, staffing, and ownership are separate fields, so one doesn't tell you the others.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li><strong>MVU / Monte Vista (legacy San Diego code):<\/strong> an older unofficial file used MVU for San Diego. The current official code is <strong>SDU<\/strong> (Contacts page, Administrative Units GIS, and every live Facilities record). MVU still shows up only as a historic domain value and in some legacy CAD names and AKAs, such as \"MVU Ramona AAB\" and \"Monte Vista FS 20.\"<\/li><li>The archived CalHR Chief-series specification (2015 Wayback snapshot, footer \"Updated 6/3/2012\") gives the same BC/AC/Unit Chief level definitions. It may predate later changes.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Walk the chain from statewide to field level, naming each level and the rank that leads it below the region.", "a": "Headquarters (statewide), then Region (Northern or Southern, led by a Region Chief), then Unit (Unit Chief), then subunits or battalions (Battalion Chiefs). Assistant Chiefs serve between the BC and the Unit Chief as Division or Deputy Chiefs. Sources: GIS metadata, Contacts page, EX-5386, EX-4883, Join CAL FIRE BC page.", "qh": "Walk the chain from statewide to field level, naming each level and the rank that leads it below the region.", "ah": "Headquarters (statewide), then Region (Northern or Southern, led by a Region Chief), then Unit (Unit Chief), then subunits or battalions (Battalion Chiefs). Assistant Chiefs serve between the BC and the Unit Chief as Division or Deputy Chiefs. Sources: GIS metadata, Contacts page, EX-5386, EX-4883, Join CAL FIRE BC page.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "HQ, then Region (Region Chief), then Unit (Unit Chief), then battalion (BC); ACs sit between BC and Unit Chief", "wh": ["HQ, then Unit (Unit Chief), then Region (Region Chief), then battalion (BC); ACs sit between BC and Unit Chief", "HQ, then Region (Region Chief), then Unit (Assistant Chief), then battalion (Fire Captain)", "HQ, then Region (Region Chief), then battalion (BC), then Unit (Unit Chief); ACs lead the battalions"], "hash": "sha256:24af5972907bee33895a2ce6564a90ae22705094890a752ae8b28975cfdd78fe"}, {"n": 2, "q": "You're promoted to Assistant Chief and assigned as \"Division Chief, Operations.\" What's your civil-service class? Is \"Division Chief\" a separate CAL FIRE fire-protection class? Name the one Division Chief class that does exist.", "a": "You're an Assistant Chief (class 1039). Division Chief is an assignment of that class, not a separate fire-protection class code. The distinct class is Division Chief, California State Fire Marshal's Office (8966), on the CalHR pay scale.", "qh": "You're promoted to Assistant Chief and assigned as \"Division Chief, Operations.\" What's your civil-service class? Is \"Division Chief\" a separate CAL FIRE fire-protection class? Name the one Division Chief class that does exist.", "ah": "You're an Assistant Chief (class 1039). Division Chief is an assignment of that class, not a separate fire-protection class code. The distinct class is Division Chief, California State Fire Marshal's Office (8966), on the CalHR pay scale.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Assistant Chief (1039); Division Chief is an assignment, and the real class is Division Chief, CSFM Office (8966)", "wh": ["Division Chief (1039), a separate fire-protection class above Assistant Chief", "Assistant Chief (1039); Division Chief is an assignment, and the real class is Deputy Chief (8966)", "Battalion Chief (9723); Division Chief is an assignment, and no Division Chief class exists"], "hash": "sha256:3ffc58c4ccf914027e8019c2d45192745380faee9c3e4bb94d05f8dc1fdabf7e"}, {"n": 3, "q": "An FFI applicant lives in Sutter County and wants to work close to home. Which unit should they rank, and what other counties does that unit's plan cover?", "a": "NEU, the Nevada-Yuba-Placer Unit. Its 2026 Unit Fire Plan title covers Nevada, Yuba, Placer, Sierra, and Sutter. HQ is in Auburn.", "qh": "An FFI applicant lives in Sutter County and wants to work close to home. Which unit should they rank, and what other counties does that unit's plan cover?", "ah": "NEU, the Nevada-Yuba-Placer Unit. Its 2026 Unit Fire Plan title covers Nevada, Yuba, Placer, Sierra, and Sutter. HQ is in Auburn.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "NEU (Nevada-Yuba-Placer): Nevada, Yuba, Placer, Sierra, Sutter; HQ Auburn", "wh": ["BTU (Butte): Butte and Sutter; HQ Oroville", "NEU (Nevada-Yuba-Placer): Nevada, Yuba, Placer, Sierra, Sutter; HQ Grass Valley", "AEU (Amador-El Dorado): Amador, El Dorado, Alpine, Sutter; HQ Camino"], "hash": "sha256:befdb085c666c38d4f8e44d5003d1f08d5fd25240337543e505e26f506fd814f"}, {"n": 4, "q": "Why does the official Administrative Units GIS show 27 units when the Contacts page lists 21?", "a": "The GIS layer includes the 6 Contract Counties (MRN, KRN, LAC, ORC, SBC, VNC) as administrative units. The Contacts table lists only the 21 CAL FIRE field units (12 Northern, 9 Southern). 21 + 6 = 27.", "qh": "Why does the official Administrative Units GIS show 27 units when the Contacts page lists 21?", "ah": "The GIS layer includes the 6 Contract Counties (MRN, KRN, LAC, ORC, SBC, VNC) as administrative units. The Contacts table lists only the 21 CAL FIRE field units (12 Northern, 9 Southern). 21 + 6 = 27.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "GIS adds the 6 Contract Counties to the 21 field units: 21 + 6 = 27", "wh": ["GIS splits 6 large units into two polygons each: 21 + 6 = 27", "GIS adds 6 conservation camps to the 21 field units: 21 + 6 = 27", "GIS still shows 6 retired legacy units such as MVU: 21 + 6 = 27"], "hash": "sha256:b973ffe342483d30cbb4a8abd7a9a7e0fa2804f753ff4278a56d55535e305c4b"}, {"n": 5, "q": "A new hire asks where the \"Northern Region HQ\" is. What's the accurate answer?", "a": "There isn't a single answer. The Facilities inventory lists the Northern Region RHQ at 135 Ridgeway Ave, Santa Rosa, and a separate Northern Operations Center at 6101 Airport Road, Redding. The Region Chief's phone is (530) 224-2460, a Redding-area number. Both are official records, so don't collapse them.", "qh": "A new hire asks where the \"Northern Region HQ\" is. What's the accurate answer?", "ah": "There isn't a single answer. The Facilities inventory lists the Northern Region RHQ at 135 Ridgeway Ave, Santa Rosa, and a separate Northern Operations Center at 6101 Airport Road, Redding. The Region Chief's phone is (530) 224-2460, a Redding-area number. Both are official records, so don't collapse them.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Both: RHQ at 135 Ridgeway Ave, Santa Rosa, plus a separate Northern Operations Center in Redding", "wh": ["Only Santa Rosa: the Redding listing is a duplicate of the Northern RHQ", "Only Redding: the Santa Rosa address is a retired Northern Region HQ", "1234 East Shaw, Fresno, which serves as the region HQ for both regions"], "hash": "sha256:353aede6f1900773cb7bd4162a1227f768fda8647fce5a4623bdee57f4ac0031"}, {"n": 6, "q": "Besides running a unit, name three outside-facing roles of a Unit Chief.", "a": "Any three of: State Office of Emergency Services Operational Area Coordinator; coordinating contract fire protection with local governing bodies; liaison with CDCR on cooperative programs (EX-5386).", "qh": "Besides running a unit, name three outside-facing roles of a Unit Chief.", "ah": "Any three of: State Office of Emergency Services Operational Area Coordinator; coordinating contract fire protection with local governing bodies; liaison with CDCR on cooperative programs (EX-5386).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "OES Operational Area Coordinator, contract fire protection with local bodies, and CDCR liaison", "wh": ["Directs subunit programs: training, safety, and the emergency command center", "Serves as Division Chief over the operations program or a conservation camp", "Coordinates all aerial resources with the IC and directs retardant drops"], "hash": "sha256:1bf932cc6a7914ec3fd795caed3b929025b45bcef2c5527ac70a865c231e3678"}, {"n": 7, "q": "How does the official text describe a Battalion Chief's job, and name four programs a BC might manage.", "a": "The first working supervisory level, a subunit manager directing personnel in department programs. Examples: training, safety, the emergency command center, fire prevention, air operations, camps, and fire stations (Join CAL FIRE BC page).", "qh": "How does the official text describe a Battalion Chief's job, and name four programs a BC might manage.", "ah": "The first working supervisory level, a subunit manager directing personnel in department programs. Examples: training, safety, the emergency command center, fire prevention, air operations, camps, and fire stations (Join CAL FIRE BC page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "First working supervisory level, a subunit manager: training, safety, ECC, fire stations", "wh": ["Full supervisory level, a division manager: operations, administration, camps", "First working supervisory level, a company officer: one engine, one crew, one station", "Administrative level, a unit manager: all operational and administrative functions"], "hash": "sha256:95be00933dbb1b1682ac257d6597879cca885878c96d24ae66bdc9f9c0156b3c"}, {"n": 8, "q": "Which region is Marin County in, and what kind of administrative unit is it?", "a": "Northern Region. Marin (MRN) is a Contract County, not one of the 21 CAL FIRE field units (Administrative Units GIS).", "qh": "Which region is Marin County in, and what kind of administrative unit is it?", "ah": "Northern Region. Marin (MRN) is a Contract County, not one of the 21 CAL FIRE field units (Administrative Units GIS).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Northern Region; Marin (MRN) is a Contract County, not one of the 21 field units", "wh": ["Southern Region; Marin (MRN) is a Contract County, not one of the 21 field units", "Northern Region; Marin (MRN) is one of the 12 Northern field units", "Northern Region; Marin is covered by LNU, the Sonoma-Lake-Napa Unit"], "hash": "sha256:18828b345136875f5d5913e55c1417f13c945ee037aa92a2df4ddaf71ffd8945"}, {"n": 9, "q": "You find two different official phone numbers for the Tulare Unit HQ. How do you handle that in a study doc or a call list?", "a": "Record both with their sources: 916-584-1447 (Contacts page) and 559-732-5954 (Facilities Public View HQ). Ranger's rule is not to silently correct either one.", "qh": "You find two different official phone numbers for the Tulare Unit HQ. How do you handle that in a study doc or a call list?", "ah": "Record both with their sources: 916-584-1447 (Contacts page) and 559-732-5954 (Facilities Public View HQ). Ranger's rule is not to silently correct either one.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Record both with sources: 916-584-1447 (Contacts) and 559-732-5954 (Facilities)", "wh": ["Keep only the Contacts number, 916-584-1447, since Facilities data is older", "Keep only the Facilities number, 559-732-5954, since it's local to Visalia", "Leave TUU out of the list until CAL FIRE publishes a single number"], "hash": "sha256:be638e92881541fa1d349667b6c28720354e8293848cb38c12dc72f93ca5e2ad"}, {"n": 10, "q": "Which unit covers Imperial County, and where is its HQ?", "a": "SDU, the San Diego Unit (2026 San Diego Imperial Unit Fire Plan). HQ is at 2249 Jamacha Road, El Cajon.", "qh": "Which unit covers Imperial County, and where is its HQ?", "ah": "SDU, the San Diego Unit (2026 San Diego Imperial Unit Fire Plan). HQ is at 2249 Jamacha Road, El Cajon.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "SDU (San Diego Unit); HQ at 2249 Jamacha Road, El Cajon", "wh": ["RRU (Riverside Unit); HQ at Perris", "TUU (Tulare Unit); HQ at Visalia", "BDU (San Bernardino Unit); HQ at San Bernardino"], "hash": "sha256:8a3f8cd5531e924df3bb194bab9806cefa429448e1a14059a9fce6e8006453b8"}, {"n": 11, "q": "You're building a unit station list from the Facilities layer. One record shows OWNER=COUNTY, FUNDING=A, STAFFING=C. Decode it, and explain why you can't assume a state-owned station is state-funded and fully paid.", "a": "County-owned, Schedule A funding, combined paid/volunteer staffing. Ownership, funding, and staffing are separate coded fields in the layer, so each has to be read on its own (Facilities Public View domains, layer modified 5 Aug 2026).", "qh": "You're building a unit station list from the Facilities layer. One record shows OWNER=COUNTY, FUNDING=A, STAFFING=C. Decode it, and explain why you can't assume a state-owned station is state-funded and fully paid.", "ah": "County-owned, Schedule A funding, combined paid/volunteer staffing. Ownership, funding, and staffing are separate coded fields in the layer, so each has to be read on its own (Facilities Public View domains, layer modified 5 Aug 2026).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "County-owned, Schedule A funded, combined paid/volunteer; owner, funding, staffing are separate fields", "wh": ["County-owned, Schedule A funded, contract-county staffed; owner sets funding and staffing", "County-owned, Combined A/B funded, paid staffing; owner, funding, staffing are separate fields", "Contract County (Greybook) funded, combined paid/volunteer; owner is always the state"], "hash": "sha256:6776fd718f20d7f01a69fa60992aeb7bb78448557dea28e31d5d90c3b5ba45e8"}], "sources": [{"label": "CAL FIRE Contacts (units, region chiefs, phones)", "url": "https://www.fire.ca.gov/about/resources/cal-fire-contacts"}, {"label": "CAL FIRE Administrative Units (GIS hub)", "url": "https://hub-calfire-forestry.hub.arcgis.com/datasets/cal-fire-administrative-units-1"}, {"label": "Administrative Units feature service cdfadmin19_1", "url": "https://services1.arcgis.com/jUJYIo9tSA7EHvfZ/arcgis/rest/services/cdfadmin19_1/FeatureServer"}, {"label": "CAL FIRE Facilities for Wildland Fire Protection, Public View", "url": "https://services1.arcgis.com/jUJYIo9tSA7EHvfZ/arcgis/rest/services/CAL_FIRE_Facilities_for_Wildland_Fire_Protection_-_Public_View/FeatureServer"}, {"label": "OSFM Pre-Fire Planning (2026 Unit Fire Plan titles)", "url": "https://osfm.fire.ca.gov/what-we-do/community-wildfire-preparedness-and-mitigation/pre-fire-planning"}, {"label": "Unit Chief exam bulletin EX-5386", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=5386"}, {"label": "Assistant Chief exam bulletin EX-4883", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4883"}, {"label": "Join CAL FIRE, Battalion Chief", "url": "https://www.joincalfire.com/classifications/fire-protection/firefighting-and-paramedics/battalion-chief"}, {"label": "CalHR Civil Service Pay Scale (updated 10/26/2026)", "url": "https://www.calhr.ca.gov/wp-content/uploads/sites/361/2026/09/PS_Sec_15.pdf"}, {"label": "2027 FFI Work Location Form", "url": "https://incidents.fire.ca.gov/media/42chxu24/2027-wlf.pdf"}, {"label": "Ranger batches and datasets: /workspace/can-report/calfire/calfire-batch-01.md, calfire-batch-01-addendum.md, calfire-batch-03.md, calfire-batch-03-administrative-units.csv, calfire-batch-03-facilities-public-view.csv", "url": ""}, {"label": "Ranger batch 05 (Facilities FUNDING/STAFFING domains): /workspace/can-report/calfire/calfire-batch-05.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 1. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> none listed in tree.py.", "note_html": "Study aid only. Source: Ranger calfire-batch-01, -01 addendum, and -03 (CAL FIRE Contacts page, Administrative Units GIS, Facilities Public View, OSFM 2026 Unit Fire Plan titles, and exam bulletins). There's no official org-chart graphic, so this structure comes from official text. Chief names are a 17 Nov 2026 snapshot."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [{"title": "CAL FIRE Administrative Units (cdfadmin19_1)", "rows": 27, "description": "Official Administrative Units extract (cdfadmin19_1), 27 polygons: 21 CAL FIRE field units plus 6 contract counties, with Unit, Unit Code, and Region. Downloaded 17 November 2026. Builder should render this as a lookup; do not create a tree node per unit.", "url": "https://gis.data.cnra.ca.gov/api/download/v1/items/d8bfc5ad7ede4e1ca60b0666efc2b50d/csv?layers=0"}, {"title": "CAL FIRE Facilities for Wildland Fire Protection — Public View", "rows": 1617, "description": "Official Facilities Public View extract queried 17 November 2026 (layer modified 5 August 2026): 1,617 records (1,566 Active; 39 Decommissioned; 12 Temporarily Decommissioned). Use as a station/camp/base lookup; do not create a tree node per facility. Current San Diego Unit code is SDU. MVU is a legacy code and belongs only in the node's history object, not in current unit coding.", "url": "https://data.ca.gov/@cal-fire/facilities-for-wildland-fire-protection1"}, {"title": "CAL FIRE Facilities FUNDING and STAFFING domain codes", "rows": null, "description": "Official Facilities Public View layer domains (queried 17 November 2026; layer modified 5 August 2026). Lookup/definition data for the facilities and units node; do not create a tree node per code. FUNDING (Funding): B = Schedule B; A = Schedule A; L = Local; C = Combined Schedule A/B; G = Greybook (may include county funded resources); F = Federal. STAFFING (Staffing_1): P = Paid; V = Volunteer; C = Combined Paid/Volunteer; N = Not Staffed.", "url": "https://services1.arcgis.com/jUJYIo9tSA7EHvfZ/arcgis/rest/services/CAL_FIRE_Facilities_for_Wildland_Fire_Protection_-_Public_View/FeatureServer"}], "x": 1450.69, "y": 638.55, "angle": 74.5, "vx": 850.42, "vy": 1214.02, "vangle": 319.5}, "10.6.2": {"id": "10.6.2", "name": "Rank Ladder and CalHR Pay (FFI to Unit Chief)", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": [], "doc": {"title": "10.6.2 Rank Ladder and CalHR Pay (FFI to Unit Chief)", "file": "10.6.2_Rank_Ladder_and_CalHR_Pay_FFI_to_Unit_Chief.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>CAL FIRE's fire-protection ladder runs from a seasonal <strong>Fire Fighter I<\/strong> up to <strong>Unit Chief<\/strong>. Each rank is a CalHR civil-service class with its own code and pay range. The <strong>CalHR pay scale is the later official rate table<\/strong>. Recruiting pages and some exam bulletins lag behind it.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<p>Pay below is from the CalHR pay scale updated 10/26/2026, monthly:<\/p><ul><li><strong>Fire Fighter I (1083):<\/strong> $4,590 to $5,803. Non-tenured (NT).<\/li><li><strong>Fire Fighter II (1082):<\/strong> Range A $4,766 to $6,181. Range B $5,102 to $6,613.<\/li><li><strong>Fire Apparatus Engineer (1077):<\/strong> Range A $5,551 to $6,856. Range B $5,934 to $7,342.<\/li><li><strong>Fire Captain (1095):<\/strong> Range A $5,934 to $7,694. Range B $6,513 to $8,483. Range C $6,354 to $8,234.<\/li><li><strong>Battalion Chief (9723):<\/strong> $6,882 to $8,930.<\/li><li><strong>Assistant Chief (1039):<\/strong> $10,569 to $13,674.<\/li><li><strong>Unit Chief (1037):<\/strong> $11,093 to $14,360.<\/li><\/ul><p>Other pay facts:<\/p><ul><li><strong>Level names (official text):<\/strong> Battalion Chief is \"the first working supervisory level.\" Assistant Chief is \"the full supervisory level.\" Unit Chief is the administrative level that manages a unit.<\/li><li><strong>Class mergers, effective 31 July 2025:<\/strong> FFII 1082 merged with FFII-Paramedic 1755. FAE 1077 merged with FAE-Paramedic 1756. Captain 1095 merged with Captain-Paramedic 1757. Paramedic work is now a range of the merged class. The legacy codes still appear on the pay scale.<\/li><li><strong>FFI posting (JC-533177):<\/strong> $4,590 to $5,803 per month, plus <strong>EDWC<\/strong> (Extended Duty Week Compensation) of $1,560 to $1,972 every 4 weeks. Annual compensation is $56,521 to $71,457 (max of 9 months). New-to-state hires start at the minimum of the range.<\/li><li><strong>Captain bulletin (EX-5398):<\/strong> annual Range A $97,416 to $126,323, Range B $106,925 to $139,275, Range C (paramedic) $108,420 to $143,392. The paramedic range adds a <strong>$250 to $6,000 paramedic bonus paid every November<\/strong>.<\/li><li><strong>Pay above Unit Chief:<\/strong> Forestry and Fire Protection Administrator (1031) has the same range as Unit Chief. \"Region Chief\" maps to CEA class 7500 on the 2025 class list. <strong>Which CEA level a Region Chief holds, and any actual rate, is not public in the sources retrieved<\/strong>, so no Region Chief dollar figure is given here. Director (class 4850) pay is still <strong>unverified<\/strong>. It wasn't found in the pay-scale extract, and publicpay.ca.gov wasn't retrieved.<\/li><li><strong>CEA pay (CalHR Section 8, Rev. 08/19/25):<\/strong> \"The CEA salary range is $10,349 - $21,370.\" Level A is $10,349 to $12,526. Level B is $12,131 to $14,453. Level C is $13,472 to $15,297. The Restricted Zone is $15,298 to $21,370. The 10/26/2026 alpha scale lists class 7500 C.E.A. at $10,349 to $21,370.<ul><li>A single range lets <strong>delegated<\/strong> departments set salaries above approved levels within a CalHR cap. <strong>Non-delegated<\/strong> departments are held to the approved level without prior CalHR approval.<\/li><li>After the first 12 months, a non-delegated CEA may get a 5% increase up to the level maximum, but no more than 5% in any 12 months without CalHR approval.<\/li><\/ul><\/li><li><strong>Don't confuse<\/strong> CAL FIRE's 1083/1082 series with the separate \"Fire Fighter/Fire Chief Series\" (8979/8977) used at other state facilities.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<p><strong>Pay-source conflicts (shown side by side, not blended):<\/strong><\/p><ul><li><strong>FFI:<\/strong> JC-533177 and the pay scale both say $4,590 to $5,803. The Join CAL FIRE recruiting page still shows $4,296 to $5,432. The recruiting page lags.<\/li><li><strong>FFII:<\/strong> bulletin EX-4603 says Range A $4,650 to $6,030 and Range B $4,978 to $6,452. The pay scale says Range A $4,766 to $6,181 and Range B $5,102 to $6,613.<\/li><li><strong>FAE:<\/strong> bulletin EX-4473 says Range A $5,416 to $6,689 and Range B $5,789 to $7,163. The pay scale says Range A $5,551 to $6,856 and Range B $5,934 to $7,342.<\/li><li><strong>Battalion Chief:<\/strong> Join CAL FIRE says $6,714 to $8,712. The pay scale says $6,882 to $8,930. As of 17 Nov 2026, the Join page still shows the lagging range, with EDWC of $2,282 to $2,961 and annual pay of $110,234 to $143,037 (batch 05).<\/li><li><strong>Unit Chief:<\/strong> the older bulletin EX-4515 (2025) said $9,411 to $12,182. The 2026 bulletin EX-5386 and the pay scale say $11,093 to $14,360.<\/li><li><strong>Assistant Chief:<\/strong> Join CAL FIRE shows $8,966 to $11,600. EX-4883 and the pay scale show $10,569 to $13,674.<\/li><\/ul><p>Ranger's handling rule: for current base monthly rates, use the pay scale as the later official table, but report what each bulletin printed.<\/p>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li><strong>Archived CalHR class specs (Ranger batch 04):<\/strong> these come from Wayback snapshots (FFI 9 Jul 2025 and 24 Mar 2013; FFII, FAE, and Captain 9 Oct 2014; Chief series 31 May 2015). Footers mostly say \"Updated 6/3/2012,\" so they may predate the 31 July 2025 mergers.<ul><li><strong>FFI (1083), archived definition:<\/strong> \"Under close supervision, as a temporary employee, to do heavy physical work involved in fire fighting as a member of a fire crew...\"<\/li><li><strong>FFII (1082) and FAE (1077), archived:<\/strong> \"Eligibles selected for positions in this classification are placed in an apprenticeship program.\"<\/li><li><strong>Chief series, archived class dates:<\/strong> Battalion Chief established 01/18/1995. Assistant Chief established 02/06/1934. Unit Chief established 10/08/1959. \"Series established July 28, 1971.\"<\/li><\/ul><\/li><li><strong>Legacy paramedic classes:<\/strong> FFII-Paramedic 1755, FAE-Paramedic 1756, and Captain-Paramedic 1757 were separate classes before the 31 July 2025 mergers.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "The Join CAL FIRE page shows FFI pay of $4,296 to $5,432, but the CalCareers posting shows $4,590 to $5,803. Which reflects current pay, and how do you know?", "a": "The posting's $4,590 to $5,803 matches the CalHR Civil Service Pay Scale updated 10/26/2026. Batch 01 notes that the Join CAL FIRE figures lag the official pay scale and CalCareers.", "qh": "The Join CAL FIRE page shows FFI pay of $4,296 to $5,432, but the CalCareers posting shows $4,590 to $5,803. Which reflects current pay, and how do you know?", "ah": "The posting's $4,590 to $5,803 matches the CalHR Civil Service Pay Scale updated 10/26/2026. Batch 01 notes that the Join CAL FIRE figures lag the official pay scale and CalCareers.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "The posting's $4,590 to $5,803, because it matches the 10/26/2026 CalHR pay scale", "wh": ["The Join page's $4,296 to $5,432, because recruiting pages are updated first", "The posting's $4,590 to $5,803, because postings override the CalHR pay scale", "Neither; report the midpoint until CalHR publishes a new FFI range"], "hash": "sha256:a801070f2e92cba8dd5546a2993aed841f7890adaa6dbe4d842d7a82eb4e0d14"}, {"n": 2, "q": "Put these in order from entry to top, with class codes: Unit Chief, FAE, Battalion Chief, FFI, Captain, Assistant Chief, FFII.", "a": "FFI (1083), FFII (1082), FAE (1077), Fire Captain (1095), Battalion Chief (9723), Assistant Chief (1039), Unit Chief (1037). Sources: pay scale and exam bulletins.", "qh": "Put these in order from entry to top, with class codes: Unit Chief, FAE, Battalion Chief, FFI, Captain, Assistant Chief, FFII.", "ah": "FFI (1083), FFII (1082), FAE (1077), Fire Captain (1095), Battalion Chief (9723), Assistant Chief (1039), Unit Chief (1037). Sources: pay scale and exam bulletins.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "FFI 1083, FFII 1082, FAE 1077, Captain 1095, BC 9723, AC 1039, Unit Chief 1037", "wh": ["FFI 1083, FFII 1082, Captain 1095, FAE 1077, BC 9723, AC 1039, Unit Chief 1037", "FFI 1083, FFII 1082, FAE 1077, Captain 1095, AC 1039, BC 9723, Unit Chief 1037", "FFII 1082, FFI 1083, FAE 1077, Captain 1095, BC 9723, AC 1039, Unit Chief 1037"], "hash": "sha256:9cd03fb84d202201f87a2f8ed7a7b67cc39507dd30b16d200322036553083017"}, {"n": 3, "q": "A paramedic FFII candidate asks if she should look for a separate \"FFII-Paramedic\" exam. What do you tell her?", "a": "There's no separate exam. Effective 31 July 2025, FFII (1082) and FFII-Paramedic (1755) merged, and candidates must pass the FFII exam for both paramedic and non-paramedic vacancies (EX-4603). Paramedic work is now a range of the merged class.", "qh": "A paramedic FFII candidate asks if she should look for a separate \"FFII-Paramedic\" exam. What do you tell her?", "ah": "There's no separate exam. Effective 31 July 2025, FFII (1082) and FFII-Paramedic (1755) merged, and candidates must pass the FFII exam for both paramedic and non-paramedic vacancies (EX-4603). Paramedic work is now a range of the merged class.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No separate exam: 1082 and 1755 merged 31 Jul 2025, so she takes the FFII exam", "wh": ["Yes: FFII-Paramedic (1755) still has its own exam for paramedic vacancies", "No separate exam: 1082 and 1755 merged 31 Jul 2025, so she takes the FAE exam", "No exam at all: paramedics are appointed straight into FFII from the EMT-P list"], "hash": "sha256:7dc1ff872c1e5fda772919a9c9746c25f1e043a3127014b64eff6bbb116f4c35"}, {"n": 4, "q": "Why is the FFI annual compensation on JC-533177 stated as a \"max of 9 months,\" and what's the FFI job type?", "a": "FFI is a Non-Tenured, Full Time classification. The posting computes annual pay on a maximum of 9 months, which fits a seasonal or temporary entry class (JC-533177; the pay scale marks 1083 as NT).", "qh": "Why is the FFI annual compensation on JC-533177 stated as a \"max of 9 months,\" and what's the FFI job type?", "ah": "FFI is a Non-Tenured, Full Time classification. The posting computes annual pay on a maximum of 9 months, which fits a seasonal or temporary entry class (JC-533177; the pay scale marks 1083 as NT).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Non-Tenured, Full Time; annual pay is figured on 9 months, fitting a seasonal class", "wh": ["Permanent, Full Time; annual pay is figured on 9 months to exclude the academy", "Non-Tenured, Part Time; annual pay is figured on 9 months of part-time hours", "Limited Term, Full Time; annual pay is figured on 9 months of a 12-month term"], "hash": "sha256:04210df410148dcc84d5dece0ac361ad76119ed0bfb24f763ff27dd5841b8a32"}, {"n": 5, "q": "A Fire Captain on the paramedic range asks what extra pay he gets beyond base, and when. Use the Captain bulletin.", "a": "Range C (paramedic) carries a $250 to $6,000 paramedic bonus paid every November. Annual compensation is $108,420 to $143,392 (EX-5398).", "qh": "A Fire Captain on the paramedic range asks what extra pay he gets beyond base, and when. Use the Captain bulletin.", "ah": "Range C (paramedic) carries a $250 to $6,000 paramedic bonus paid every November. Annual compensation is $108,420 to $143,392 (EX-5398).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Range C: a $250 to $6,000 paramedic bonus, paid every November", "wh": ["Range C: a $250 to $6,000 paramedic bonus, paid every July", "Range C: a $250 to $600 paramedic bonus, paid every November", "Range B: a $2,500 to $6,000 paramedic bonus, paid every November"], "hash": "sha256:a1cbef588c171785f02fd8de37b7e0067b5594f10638478e35e5684532aa1e59"}, {"n": 6, "q": "A Unit Chief bulletin from 2025 says $9,411 to $12,182, and a 2026 bulletin says $11,093 to $14,360. Which is current, and why?", "a": "The 2026 figures. The 2026 bulletin EX-5386 matches the 10/26/2026 pay scale. Batch 01 marks EX-4515's older range as superseded.", "qh": "A Unit Chief bulletin from 2025 says $9,411 to $12,182, and a 2026 bulletin says $11,093 to $14,360. Which is current, and why?", "ah": "The 2026 figures. The 2026 bulletin EX-5386 matches the 10/26/2026 pay scale. Batch 01 marks EX-4515's older range as superseded.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "2026 ($11,093 to $14,360): EX-5386 matches the 10/26/2026 pay scale", "wh": ["2025 ($9,411 to $12,182): EX-4515 stays the bulletin of record until it expires", "Both: they are Range A and Range B of the same Unit Chief class", "Neither: Unit Chief pay is now set only by CEA levels"], "hash": "sha256:03cf5e6df66ce7fa6158ba45d29ef52c6e24c17daac719ff98a51b4b25e24a75"}, {"n": 7, "q": "A posting at a state hospital is for \"Fire Fighter\" in class 8979. Is that a step on the CAL FIRE ladder?", "a": "No. CalHR's 8979/8977 \"Fire Fighter/Fire Chief Series\" is for other state facilities (CalHR class spec 8979: \"Fire Fighter/Fire Chief Series… 8979 Fire Fighter; 8977 Fire Chief\"; Ranger batch 01). A live CalCareers bulletin, EX-2446 (Department of State Hospitals, multiple testing departments), lists Fire Fighter 8979 for \"fire prevention and suppression duties at a California facility.\" CAL FIRE's ladder uses 1083/1082/1077/1095/9723/1039/1037.", "qh": "A posting at a state hospital is for \"Fire Fighter\" in class 8979. Is that a step on the CAL FIRE ladder?", "ah": "No. CalHR's 8979/8977 \"Fire Fighter/Fire Chief Series\" is for other state facilities (CalHR class spec 8979: \"Fire Fighter/Fire Chief Series… 8979 Fire Fighter; 8977 Fire Chief\"; Ranger batch 01). A live CalCareers bulletin, EX-2446 (Department of State Hospitals, multiple testing departments), lists Fire Fighter 8979 for \"fire prevention and suppression duties at a California facility.\" CAL FIRE's ladder uses 1083/1082/1077/1095/9723/1039/1037.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No: 8979/8977 is for other state facilities; CAL FIRE uses 1083 through 1037", "wh": ["Yes: 8979 is the old code for FFI, merged into 1083 in July 2025", "Yes: 8979 is a parallel entry step that feeds into FFII (1082)", "No: 8979 is CAL FIRE's seasonal Forestry Aide class, not a fire rank"], "hash": "sha256:deed40ad6892bd1aca6290063fd4fad7c3989cfc56b8eadd83e5a0ff5b35864a"}, {"n": 8, "q": "What do the official descriptions call the Battalion Chief, Assistant Chief, and Unit Chief levels?", "a": "Battalion Chief is the first working supervisory level. Assistant Chief is the full supervisory level. Unit Chief is the administrative level with management responsibility for a unit (Join CAL FIRE BC page, EX-4883, EX-5386).", "qh": "What do the official descriptions call the Battalion Chief, Assistant Chief, and Unit Chief level
