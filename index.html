 10.8 lb, 70 cuts/2 Ah", "CCU10: 3.2 in opening, 49,458 lbf, 0.9 in bar, 10.8 lb, 70 cuts/2 Ah", "PCU30CL: 6.7 in opening, 123,420 lbf, 1.2 in bar, 33.7 lb, IP57"], "hash": "sha256:16e616c37e279151b26c592840a0022e267d86d1288cc7763c564a1159771109"}, {"n": 9, "q": "Your crew finds a gas-filled hood strut and a hardened bolt in the cut path. Can you cut through either?", "a": "No to both. Never cut parts under pressure or tension, such as gas struts and springs, and don't cut hardened fasteners or bolts, because they damage the blades.", "qh": "Your crew finds a gas-filled hood strut and a hardened bolt in the cut path. Can you cut through either?", "ah": "No to both. Never cut parts under pressure or tension, such as gas struts and springs, and don't cut hardened fasteners or bolts, because they damage the blades.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No to both: never cut under pressure or tension, or hardened bolts", "wh": ["Strut no, bolt yes: cut the bolt deep near the center bolt", "Strut yes, bolt no: only hardened fasteners damage the blades", "Both yes, as long as the blades stay perpendicular to the cut"], "hash": "sha256:e062ea431a2042c41ba5afb99a5930d5473a5ee47528ab036a2cb006fce3a59d"}], "sources": [{"label": "Holmatro Next-Gen Pentheon catalog 2026", "url": "https://www.holmatro.com/app/uploads/2026/04/F0025241_0002-1.pdf"}, {"label": "Holmatro Maintenance after use, PCU30CL/40/50/60, doc 21370 (Apr-21; after-use checklist, store with tips just overlapped)", "url": "https://www.holmatro.com/app/uploads/2026/01/F0021370_0001-2.pdf"}, {"label": "Holmatro User manual PCU (Pentheon cutters)", "url": "https://www.holmatro.com/app/uploads/2026/02/F0027626_0001.pdf"}, {"label": "Holmatro CU 5000 Series After-Use Maintenance (Rev 04-17)", "url": "https://www.holmatro.com/app/uploads/2026/07/F0016007_0001.pdf"}, {"label": "Holmatro HCT 511 manual (cutting procedure, warnings, 0.6 mm blade check, NFPA cutting table in Annex B)", "url": "https://www.holmatro.com/app/uploads/2026/09/G0020541_0001.pdf"}, {"label": "DHS SAVER, Battery-Powered Cutting Tools for Vehicle Extrication market survey (2023; NFPA cutter categories and F test)", "url": "https://www.dhs.gov/sites/default/files/2023-07/23_0721_st_battery_powered_cutting_tools_for_vehicle_extrication_market_survey_report.pdf"}, {"label": "HURST Jaws of Life, NFPA 1936 2020 compliance release, Apr 28 2020 (F-test levels 1 to 7; Firehouse copy)", "url": "https://www.firehouse.com/rescue/vehicle-extrication/press-release/21135957/hurst-jaws-of-life-hurst-jaws-of-life-earns-nfpa-1936-2020-compliant-status"}], "position_html": "<strong>Tree position:<\/strong> Path 05 &gt; 05.2 Hydraulic Extrication Tools &gt; tool. <strong>Unlocks after:<\/strong> 05.2.1 Spreaders. <strong>Next:<\/strong> 05.2.3 Combi Tools.", "note_html": "Study aid only. Specs are from the Holmatro Next-Gen Pentheon catalog (2026) and the CU 5000 maintenance sheet."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 629.31, "y": -111.45, "angle": 105.5, "vx": -165.55, "vy": 633.4, "vangle": 350.5}, "05.2.3": {"id": "05.2.3", "name": "Holmatro Combi Tools (PCT, HCT 511)", "path": "05", "kind": "tool", "parent": "05.2", "prereqRaw": "parent 05.2", "children": [], "prereqs": ["05.2"], "unlocks": [], "cross": ["03.2", "04.4"], "doc": {"title": "05.2.3 Holmatro Combi Tools (Pentheon PCT and Hand-Operated HCT 511)", "file": "05.2.3_Holmatro_Combi_Tools.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>One tool that <strong>spreads, cuts, and squeezes<\/strong>. It's useful as a first-due tool, in tight spaces, or when there's only one tool. Two types:<\/p><ul><li><strong>Pentheon PCT:<\/strong> battery-powered. The PCT50/60 have removable tips and pulling attachments.<\/li><li><strong>HCT 5111/5114 (ST):<\/strong> hand-pumped, no battery or power unit, one-person operation. A pump handle drives the integrated hydraulic pump, and a control ring opens (clockwise) or closes (counterclockwise) the blades.<\/li><\/ul>"}, {"key": "specs", "title": "Key specs", "html": "<p>| Model | Spread distance | Max cut opening | Theoretical cut force | Round bar | Weight ready | |---|---|---|---|---|---| | PCT11 | 11.1 in | 7.7 in | 60,249 lbf | 0.9 in | 30.4 lb | | PCT14 | 14.3 in | 10.9 in | 60,249 lbf | 0.9 in | 31.3 lb | | PCT50 | 15 in | 12.6 in | 150,622 lbf | 1.4 in | 45.2 lb | | PCT60 | 18.4 in | 394 mm (about 15.5 in) | 208,848 lbf | 1.6 in | 51.8 lb | | HCT 5111 | — | 7.7 in | 60,249 lbf | — | 19.4 lb |<\/p><ul><li><strong>NFPA 1960 HSF/LSF (Pentheon):<\/strong> PCT11 11,690/8,992. PCT14 8,992/6,744. PCT50 9,554/7,396. PCT60 10,589/8,813 lbf.<\/li><li><strong>HCT 5111 NFPA 1960 cutting:<\/strong> A5 B5 C5 D6 E4 F3. <strong>HCT 5114 (B blades):<\/strong> A5 B5 C5 D6 E6 F3.<\/li><li><strong>Pulling (NFPA HPF/LPF):<\/strong> PCT50 23,380/17,917 lbf, PCT60 23,605/19,423 lbf. The PCT11 and PCT14 have no pulling rating.<\/li><li><strong>HCT pulling:<\/strong> only the <strong>HCT 5114 (ST)<\/strong> can pull (removable tips; 9.8 in pulling distance). The <strong>HCT 5111<\/strong> has fixed blade tips (configuration A), so it can't take pulling attachments.<\/li><li><strong>Pentheon PCT50/60 blades:<\/strong> grip teeth on the inside of each blade stop material from being pushed out during a cut. Pull the tips off by hand to cut without crushing the material, then put them back.<\/li><li><strong>HCT working pressure:<\/strong> 720 bar. Temperature range -4 to 131 °F (-20 to 55 °C). The LED light runs on an AA battery (about 6 hours) and isn't on ST versions.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Cut:<\/strong> set the blades perpendicular, put the material deep in the opening, and close.<\/li><li><strong>Spread:<\/strong> close the blades, put both tips in the gap with the load about 25 mm (1 in) from the tip ends and the full tip width used, then open.<\/li><li><strong>Squeeze:<\/strong> tips over the object, load near the tip ends, then close.<\/li><li><strong>HCT:<\/strong> pump the handle up and down and turn the control ring for direction. Blades move fairly quickly until they meet resistance, then the pump builds pressure. Store with the blades slightly open.<\/li><li><strong>HCT stroke count (Annex C):<\/strong> the HCT 5111 takes about 21 strokes to open and 15 to close with no load, and 17 to open and 10 to close at 90% load.<\/li><li><strong>Removing tips:<\/strong> with the blades slightly open, push and pull the lock pin out until it locks, then slide the tips off. Never operate the tool while fitting or removing accessories.<\/li><li><strong>Pulling (HCT 5114, PCT50/60):<\/strong> fit the pulling attachments over the blades and lock the pins. Use only the matching chain set (1.5 m and 3 m chains with shortening hooks that grab only the chain). Pulling is for horizontal loads only, never hoisting. Keep the load supported from below and the tool in a straight line between the attachments.<\/li><li><strong>HCT shutdown:<\/strong> close the arms with the tips slightly open so it stores without pressure, set the control ring to neutral, and put the pump handle in its storage position.<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Stop if the blades separate. Don't cut with the tips only or cut hardened bolts.<\/li><li>Load only the spreading tips. If they slip, stop and reset.<\/li><li>Put a flexible shield between the cut and the victim. Keep your body out of the tool's path.<\/li><li>Wear eye protection and a filter mask when cutting glass or plastic.<\/li><li><strong>HCT blade and bolt checks:<\/strong> have a Holmatro Certified Technician replace the blades if they're more than <strong>0.6 mm<\/strong> apart, or if the blades or tips are damaged or worn. The center bolt torque should be <strong>50 Nm<\/strong>. Never remove the center bolt or hinge pins yourself.<\/li><li><strong>Poor cutting (HCT troubleshooting):<\/strong> damaged blades should be sharpened or filed back to the correct shape. A wrong center-bolt torque is fixed by tightening it to 50 Nm.<\/li><li><strong>Adding oil to the HCT:<\/strong> the blades must always be open when you release the filler caps.<\/li><li>Holmatro recommends yearly inspection and testing by a Holmatro Certified Technician.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "A combi tool spreads, cuts, and squeezes. Which Pentheon and HCT models can also pull, and why can't the HCT 5111?", "a": "PCT50 and PCT60 (removable tips and pulling attachments), and the HCT 5114 (ST). The HCT 5111 has fixed tips (configuration A), so pulling attachments can't be fitted. The PCT11 and PCT14 also have no pulling rating.", "qh": "A combi tool spreads, cuts, and squeezes. Which Pentheon and HCT models can also pull, and why can't the HCT 5111?", "ah": "PCT50 and PCT60 (removable tips and pulling attachments), and the HCT 5114 (ST). The HCT 5111 has fixed tips (configuration A), so pulling attachments can't be fitted. The PCT11 and PCT14 also have no pulling rating.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "PCT50, PCT60 and HCT 5114; the 5111's fixed tips can't take pulling attachments", "wh": ["PCT11, PCT14 and HCT 5114; the 5111's fixed tips can't take pulling attachments", "PCT50, PCT60 and HCT 5111; the 5114's fixed tips can't take pulling attachments", "PCT50, PCT60 and HCT 5114; the 5111 lacks the pump pressure for pulling"], "hash": "sha256:b6e3b8844a1ce5ba1232ce03e35872015fb045c43647bfaf0218adaeaf183955"}, {"n": 2, "q": "Your engine is in a narrow alley with no power unit and a dead battery pack. How does the HCT 5111 still produce hydraulic force, and who can run it?", "a": "Its pump handle drives a hydraulic pump built into the tool, so it needs no battery or power unit. Holmatro built it to be operated by one person.", "qh": "Your engine is in a narrow alley with no power unit and a dead battery pack. How does the HCT 5111 still produce hydraulic force, and who can run it?", "ah": "Its pump handle drives a hydraulic pump built into the tool, so it needs no battery or power unit. Holmatro built it to be operated by one person.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Its pump handle drives a built-in hydraulic pump; one person can run it", "wh": ["Its pump handle drives a built-in hydraulic pump; it needs a two-person crew", "A small onboard backup cell runs its pump; one person can run it", "It connects to a Spider pump by Core hose; one person can run it"], "hash": "sha256:01daf4d42cf9e4b30be41c854a46450d2d012c493d552db22a3c405692724566"}, {"n": 3, "q": "On the HCT, which way do you turn the control ring to open the blades, and what drives the motion?", "a": "Clockwise opens and counterclockwise closes. Pumping the handle up and down supplies the pressure.", "qh": "On the HCT, which way do you turn the control ring to open the blades, and what drives the motion?", "ah": "Clockwise opens and counterclockwise closes. Pumping the handle up and down supplies the pressure.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Clockwise opens; pumping the handle up and down supplies the pressure", "wh": ["Counterclockwise opens; pumping the handle up and down supplies the pressure", "Clockwise opens; turning the control ring itself supplies the pressure", "Clockwise opens; a battery-driven motor supplies the pressure"], "hash": "sha256:0ca0c5e6ef7623182e52ed23fc8d65c88766e0e66d41ff82744456cc836e8228"}, {"n": 4, "q": "Describe the HCT shutdown and storage position, and why the tips are left slightly open.", "a": "Close the arms with the tips slightly open so the tool is stored without pressure, set the control ring to neutral, and put the pump handle in its storage position.", "qh": "Describe the HCT shutdown and storage position, and why the tips are left slightly open.", "ah": "Close the arms with the tips slightly open so the tool is stored without pressure, set the control ring to neutral, and put the pump handle in its storage position.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Tips slightly open, ring in neutral, handle stowed; stores without pressure", "wh": ["Tips fully closed, ring in neutral, handle stowed; stores without pressure", "Tips slightly open, ring set to close, handle stowed; stores without pressure", "Tips slightly open, ring in neutral, handle stowed; protects the blade edges"], "hash": "sha256:bedaf984e6b98841184ea7e311265def60bdf3eb3dbb06a9d75cce6a889a065c"}, {"n": 5, "q": "You need to cut a tube on a PCT50 without crushing it first. What can you change on the tool, and what stops the material from squirting out of the blades?", "a": "Pull the removable tips off by hand to cut without crushing, and refit them afterward. Grip teeth inside each blade keep the material from being pushed out during the cut.", "qh": "You need to cut a tube on a PCT50 without crushing it first. What can you change on the tool, and what stops the material from squirting out of the blades?", "ah": "Pull the removable tips off by hand to cut without crushing, and refit them afterward. Grip teeth inside each blade keep the material from being pushed out during the cut.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Pull the tips off by hand; inner grip teeth hold the material in", "wh": ["Pull the tips off by hand; the i-Bolt holds the material in", "Swap in cutting tips; inner grip teeth hold the material in", "Remove the center bolt; inner grip teeth hold the material in"], "hash": "sha256:bc194296c7a0bc0827ebee948d1d13159c4e529a5535b36feb94c897182c51f7"}, {"n": 6, "q": "At the weekly check, the HCT blades are 0.8 mm apart. Can you fix it in quarters?", "a": "No. More than 0.6 mm of separation means a Holmatro Certified Technician must replace the blades. Users must not remove the center bolt or hinge pins.", "qh": "At the weekly check, the HCT blades are 0.8 mm apart. Can you fix it in quarters?", "ah": "No. More than 0.6 mm of separation means a Holmatro Certified Technician must replace the blades. Users must not remove the center bolt or hinge pins.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No; over 0.6 mm means a Holmatro Certified Technician replaces the blades", "wh": ["Yes; tighten the center bolt to 50 Nm to close the blade gap", "Yes; the limit is 1.0 mm, so the tool stays in service as is", "Yes; file the blades back to shape, then recheck the gap"], "hash": "sha256:cff1c6385ec6d04c904330c2cb1af0ffa169a4285da80b47e1fdb9a1a7c5d13f"}, {"n": 7, "q": "The HCT 5111 has started cutting poorly. Give the two causes in Holmatro's troubleshooting table and their fixes.", "a": "Damaged blades: sharpen or file the cutting edge back to the correct shape. Wrong center-bolt torque: tighten it to 50 Nm.", "qh": "The HCT 5111 has started cutting poorly. Give the two causes in Holmatro's troubleshooting table and their fixes.", "ah": "Damaged blades: sharpen or file the cutting edge back to the correct shape. Wrong center-bolt torque: tighten it to 50 Nm.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Damaged blades: sharpen or file; wrong bolt torque: tighten to 50 Nm", "wh": ["Damaged blades: sharpen or file; wrong bolt torque: tighten to 60 Nm", "Low oil: top off with blades closed; wrong bolt torque: tighten to 50 Nm", "Damaged blades: sharpen or file; worn hinge pins: remove and replace them"], "hash": "sha256:ee35558c4e77ac8c55c9e2ae2dac536e949305a51c5ce92ac30cd761e2163822"}, {"n": 8, "q": "Compare the PCT11 and PCT14. Which reaches farther, and which pushes harder at the start of a spread?", "a": "The PCT14 reaches farther (14.3 in spread and 10.9 in cut opening, vs 11.1 and 7.7 in). The PCT11 pushes harder at the start, with an NFPA LSF of 8,992 lbf vs 6,744 lbf.", "qh": "Compare the PCT11 and PCT14. Which reaches farther, and which pushes harder at the start of a spread?", "ah": "The PCT14 reaches farther (14.3 in spread and 10.9 in cut open "08.C"], "cross": ["03.5", "03.1.1"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1240, "y": 300.0, "vx": 410.0, "vy": 1090, "vangle": null}, "08.C": {"id": "08.C", "name": "CAPSTONE: Driver/Operator", "path": "08", "kind": "capstone", "parent": null, "prereqRaw": "08.1 to 08.5", "children": [], "prereqs": ["08.1", "08.2", "08.3", "08.4", "08.5"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1640, "y": 300.0, "vx": 410.0, "vy": 1390, "vangle": null}, "09.1": {"id": "09.1", "name": "Navigation and Accountability Equipment", "path": "09", "kind": "main", "parent": null, "prereqRaw": "01.2", "children": ["09.1.1", "09.1.2", "09.1.3", "09.1.4"], "prereqs": ["01.2"], "unlocks": ["09.1.1", "09.1.2", "09.1.3", "09.1.4", "09.2", "09.3", "09.C"], "cross": ["01.2"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 440, "y": 450.0, "vx": 615.0, "vy": 490, "vangle": null}, "09.1.1": {"id": "09.1.1", "name": "PASS Devices", "path": "09", "kind": "tool", "parent": "09.1", "prereqRaw": "parent 09.1", "children": [], "prereqs": ["09.1"], "unlocks": ["04.1"], "cross": ["04.1", "01.2.1", "01.2.2", "04.2.1", "04.2.2", "09.1.4"], "doc": {"title": "09.1.1 PASS (Personal Alert Safety System) Devices", "file": "09.1.1_PASS_Devices.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>A PASS is an electronic alarm worn by a firefighter. It sounds a loud, distinctive alarm if the wearer stops moving for a set time, and it can be triggered manually. It can be <strong>integrated<\/strong> into the SCBA (it arms automatically when the air is turned on) or <strong>stand-alone<\/strong> (worn on the SCBA strap).<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>MSA G1 integrated PASS:<\/strong> motion sensor in the control module. <strong>Pre-alarm at 20 s<\/strong> motionless and <strong>full alarm at 30 s<\/strong>. The ALARM button gives a manual full alarm with or without air. Shaking resets the pre-alarm but <strong>not<\/strong> the full alarm. Reset by pressing RESET twice within about 1 s.<\/li><li><strong>Scott X3 Pro integrated PASS:<\/strong> <strong>3 quick chirps<\/strong> when the cylinder valve opens. The HUD flashes red in alternation for pre-alarm and red together for a full alarm. Change batteries at the low-battery alarm.<\/li><li><strong>NIOSH description:<\/strong> a PASS sounds if the firefighter is motionless for a set time (e.g., 30 s).<\/li><li><strong>Radio interference:<\/strong> the PASS can malfunction from RF interference (Scott manual).<\/li><\/ul><p><strong>MSA G1 details (G1 manual, sections 2.6 and 9)<\/strong><\/p><ul><li>Three parts: the <strong>control module<\/strong> (display and motion sensor), the <strong>power module<\/strong> (sounds the alarms and has four buddy lights), and the <strong>battery module<\/strong> (alkaline or rechargeable).<\/li><li>The PASS wakes from sleep when a battery is installed, the system is pressurized, or the ALARM button is pressed.<\/li><li>At start-up it runs a <strong>self-test<\/strong>. A <strong>Hardware Alarm<\/strong> icon with a full alarm means the PASS will not keep operating: remove the SCBA from service until an MSA-certified technician fixes it.<\/li><li><strong>Low battery:<\/strong> a flashing yellow HUD light and a beep every 10 seconds. One red battery segment means charge or replace it and do not use the device.<\/li><li><strong>ID tag lockup:<\/strong> the name tag must touch the power module when scanned, or the PASS can lock up. To clear it, remove the battery module, wait 30 seconds, and reinstall it.<\/li><li><strong>Telemetry (if fitted):<\/strong> a full PASS alarm automatically sends a signal to the base station.<\/li><\/ul><p><strong>Scott X3 Pro details (O&amp;M 595373-01)<\/strong><\/p><ul><li><strong>Six AA batteries<\/strong> power both the HUD and the PASS.<\/li><li><strong>Low battery:<\/strong> the HUD low-battery light comes on, and the green lights on the control module and backframe go out. The HUD and PASS keep working longer than the longest-duration cylinder, but you must replace the batteries before the next use.<\/li><li>Never remove or replace batteries in a pressurized system: close the cylinder, bleed the air, and make sure the PASS is fully off first.<\/li><\/ul><p><strong>Heat and muffling (NIST and NIOSH findings)<\/strong><\/p><ul><li><strong>Heat:<\/strong> NIOSH found that in four firefighter deaths from 2001 to 2004 the PASS alarms were not heard or were barely audible. NIST lab tests then showed alarm loudness can start to drop at temperatures <strong>as low as 300 °F (150 °C)<\/strong>. That affected every PASS NIST tested that was certified to the 1998 or earlier editions of NFPA 1982. NIST's data led to a new high-temperature requirement in NFPA 1982.<\/li><li><strong>Muffling:<\/strong> a downed firefighter's body can block the sound. In NIST tests of five PASS models in the standard's prescribed down positions (NIST TN 1641, 2009), sound-level losses ran from about 8.6% to 19.2% of dBA, depending on the device, the direction measured, and body blocking.<\/li><li><strong>NFPA's guidance:<\/strong> keep wearing and activating PASS in every hazard area, but treat it as a <strong>last-resort<\/strong> call for help. Command must still run full accountability. Report PASS malfunctions to the certification organization and to NIOSH.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li>Check it at shift start: arming chirps or tones, a pre-alarm test, a full-alarm test, and a manual alarm test (see 01.2.2 steps).<\/li><li><strong>Wear it and arm it at every incident<\/strong> where you could be in a hazardous area. An integrated PASS arms when you open the cylinder.<\/li><li>If you're lost, trapped, disoriented, or low on air: <strong>call \"Mayday, Mayday, Mayday\"<\/strong> on the radio <strong>and press the manual PASS alarm<\/strong> (NIOSH recommendation).<\/li><li>If you hear a PASS alarm, treat it as an emergency until proven otherwise. Notify command and use RIT and accountability.<\/li><\/ol>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>NIOSH investigations found firefighters who died wearing PASS devices that were <strong>never activated<\/strong>.<\/li><li>NIOSH suggests departments consider a <strong>backup stand-alone PASS<\/strong> along with integrated PASS, in case one fails.<\/li><li>Remove from service any SCBA whose PASS fails its checks.<\/li><li>Know your PASS sounds and lights so you recognize a pre-alarm before it becomes a full alarm.<\/li><li>High heat and body position can both make a PASS harder to hear. Don't count on it as your only way to be found.<\/li><li><strong>Case, NIOSH F2005-02 (Texas, December 2004):<\/strong> a 24-year-old probationary firefighter became separated from his fire-attack team. The crews made an emergency evacuation after about four minutes, and a PAR right afterward showed him missing. RIT couldn't enter because of fire conditions, and he was found about 15 minutes after the PAR, about 15 ft from the entry point. Among NIOSH's recommendations: consider a backup PASS alongside SCBA-integrated PASS, and train firefighters to call Mayday and manually activate PASS when lost, disoriented, or trapped.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li><strong>NFPA 1982, 2007 edition changes:<\/strong> a 500 °F oven test for 5 minutes with the alarm still at or above 95 dBA, water immersion after 350 °F heat exposure, a 3-hour tumble-vibration test, and a muffling test in five down positions (face down with arms extended, \"supine left\" and \"supine right\", and fetal left and right with knees drawn to the chest). NFPA 1982 is now part of NFPA 1970.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Name the two ways a PASS goes into full alarm. On a G1, what resets a pre-alarm, and what does it take to reset a full alarm?", "a": "No motion for the set time (30 s on the G1), or pressing the manual alarm. Shaking clears a G1 pre-alarm, but a full alarm only resets when you press RESET twice within about 1 second.", "qh": "Name the two ways a PASS goes into full alarm. On a G1, what resets a pre-alarm, and what does it take to reset a full alarm?", "ah": "No motion for the set time (30 s on the G1), or pressing the manual alarm. Shaking clears a G1 pre-alarm, but a full alarm only resets when you press RESET twice within about 1 second.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No motion or manual alarm; shaking clears pre-alarm, RESET twice in ~1 s clears full", "wh": ["No motion or manual alarm; shaking clears both the pre-alarm and the full alarm", "No motion or manual alarm; shaking clears pre-alarm, RESET once clears full", "No motion or low air; shaking clears pre-alarm, RESET twice in ~1 s clears full"], "hash": "sha256:b7d1f59a638adc1c46581fa8c861c1c8d61722824546bb474e415bcf84450679"}, {"n": 2, "q": "A member on a G1 stands motionless at a doorway, waiting for orders. How long until his PASS pre-alarms, and how long until it goes to full alarm?", "a": "Pre-alarm at 20 seconds of no motion and full alarm at 30 seconds.", "qh": "A member on a G1 stands motionless at a doorway, waiting for orders. How long until his PASS pre-alarms, and how long until it goes to full alarm?", "ah": "Pre-alarm at 20 seconds of no motion and full alarm at 30 seconds.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Pre-alarm at 20 s, full alarm at 30 s", "wh": ["Pre-alarm at 15 s, full alarm at 30 s", "Pre-alarm at 20 s, full alarm at 40 s", "Pre-alarm at 30 s, full alarm at 60 s"], "hash": "sha256:2049d893cf3b162615d42f1c65bdc47282f9c4c68fcf104b703dbc5846521f2e"}, {"n": 3, "q": "How does an integrated PASS arm on Scott and MSA SCBAs, and what tells a Scott user it armed? Will the G1 ALARM button work with the cylinder closed?", "a": "It arms automatically when the cylinder valve opens. The Scott sounds 3 quick chirps. Yes: the G1 ALARM button triggers a full alarm with or without air pressure.", "qh": "How does an integrated PASS arm on Scott and MSA SCBAs, and what tells a Scott user it armed? Will the G1 ALARM button work with the cylinder closed?", "ah": "It arms automatically when the cylinder valve opens. The Scott sounds 3 quick chirps. Yes: the G1 ALARM button triggers a full alarm with or without air pressure.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Arms when the cylinder valve opens; Scott gives 3 chirps; ALARM works without air", "wh": ["Arms when the cylinder valve opens; Scott gives 3 chirps; ALARM needs air pressure", "Arms when the cylinder valve opens; Scott gives 1 long tone; ALARM works without air", "Arms when the user presses RESET; Scott gives 3 chirps; ALARM works without air"], "hash": "sha256:bbbd199b12515bee09a38b8520102c54cd522c722c7b39c199d424d3786e4197"}, {"n": 4, "q": "You're lost and can't find a wall. What two actions should you take right away?", "a": "Call \"Mayday, Mayday, Mayday\" on the radio and manually activate your PASS.", "qh": "You're lost and can't find a wall. What two actions should you take right away?", "ah": "Call \"Mayday, Mayday, Mayday\" on the radio and manually activate your PASS.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Call \"Mayday\" three times on the radio and manually activate your PASS", "wh": ["Manually activate your PASS and wait for the next PAR to report", "Call \"Mayday\" three times, then search for a wall before using PASS", "Call for a PAR on the radio and shake your PASS to test it"], "hash": "sha256:fcd242cc007ce1e410acdf401ab59b0af7ca41f748a618c3c7d57a97f9a08c42"}, {"n": 5, "q": "Why does NIOSH suggest a backup stand-alone PASS, and which investigation is the example?", "a": "As a second alarm in case the integrated device fails. NIOSH made that recommendation in F2005-02, where a probationary firefighter became separated from his crew in a Texas house fire.", "qh": "Why does NIOSH suggest a backup stand-alone PASS, and which investigation is the example?", "ah": "As a second alarm in case the integrated device fails. NIOSH made that recommendation in F2005-02, where a probationary firefighter became separated from his crew in a Texas house fire.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "A second alarm if the integrated one fails; NIOSH F2005-02 (Texas)", "wh": ["A second alarm if the integrated one fails; NIST TN 1641 (muffling)", "A louder alarm for high-heat fires; NIOSH F2005-02 (Texas)", "A second alarm if the integrated one fails; NIOSH F2020-10 (California)"], "hash": "sha256:a6ea4ea231a2fb617977e4cb8c26856b11879b46c3f0f8eb9b6b765e67c10d4b"}, {"n": 6, "q": "What did NIOSH and NIST find about PASS alarms in high heat, what changed in the PASS standard as a result, and what did NFPA tell departments to keep doing?", "a": "NIOSH found PASS alarms weren't heard or were barely audible in four deaths (2001 to 2004), and NIST showed loudness can start dropping at about 300 °F (150 °C). NIST's data led to a new high-temperature requirement in NFPA 1982. NFPA said to keep wearing and activating PASS, treat it as a last-resort call for help, and keep full accountability running.", "qh": "What did NIOSH and NIST find about PASS alarms in high heat, what changed in the PASS standard as a result, and what did NFPA tell departments to keep doing?", "ah": "NIOSH found PASS alarms weren't heard or were barely audible in four deaths (2001 to 2004), and NIST showed loudness can start dropping at about 300 °F (150 °C). NIST's data led to a new high-temperature requirement in NFPA 1982. NFPA said to keep wearing and activating PASS, treat it as a last-resort call for help, and keep full accountability running.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Barely heard in 4 deaths; loudness drops from ~300 °F; new heat test; keep using PASS", "wh": ["Barely heard in 4 deaths; loudness drops from ~500 °F; new heat test; keep using PASS", "Barely heard in 4 deaths; loudness drops from ~300 °F; new heat test; rely on PASS alone", "Barely heard in 4 deaths; loudness drops from ~300 °F; PASS use suspended pending fix"], "hash": "sha256:4178f3282ac8371d1381cdb0a403b906e6e60b206f4051ec4b77438b5c27a489"}, {"n": 7, "q": "A downed firefighter is lying face down on his PASS. What did NIST find about body position and alarm sound?", "a": "The body can block the sound path. NIST measured sound-level losses of about 8.6% to 19.2% of dBA across five devices, depending on the device, the direction, and body blocking.", "qh": "A downed firefighter is lying face down on his PASS. What did NIST find about body position and alarm sound?", "ah": "The body can block the sound path. NIST measured sound-level losses of about 8.6% to 19.2% of dBA across five devices, depending on the device, the direction, and body blocking.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Body blocks sound; losses of about 8.6% to 19.2% of dBA across five devices", "wh": ["Body blocks sound; losses of about 86% to 92% of dBA across five devices", "Body blocks sound; losses of about 1% to 2% of dBA across five devices", "Body position had no measurable effect on sound across five devices"], "hash": "sha256:ad42c28941e199f2b8f36a89ff9df8436e7e6c6f7218549798f06a188585645f"}, {"n": 8, "q": "At start-up, your G1 shows a Hardware Alarm icon and goes into full alarm. What does that mean for the shift?", "a": "The self-test failed, so the PASS won't keep operating. Remove the SCBA from service until an MSA-certified technician fixes it.", "qh": "At start-up, your G1 shows a Hardware Alarm icon and goes into full alarm. What does that mean for the shift?", "ah": "The self-test failed, so the PASS won't keep operating. Remove the SCBA from service until an MSA-certified technician fixes it.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Self-test failed; out of service until an MSA-certified tech fixes it", "wh": ["Self-test failed; press RESET twice and use it if the alarm clears", "Low battery; swap the battery module and return it to service", "Self-test failed; usable for the shift, report it at shift end"], "hash": "sha256:2322081bb310519a4464da2e702021d5779b57785ab59c8c7f88ed43b3f94141"}, {"n": 9, "q": "Halfway through a shift, the green lights on your X3 Pro's control module and backframe go dark. Can you finish the current bottle, and what must happen before the next use?", "a": "Yes. In low-battery mode the HUD and PASS keep working longer than the longest-duration cylinder, but the batteries must be replaced before the next use, and never in a pressurized system.", "qh": "Halfway through a shift, the green lights on your X3 Pro's control module and backframe go dark. Can you finish the current bottle, and what must happen before the next use?", "ah": "Yes. In low-battery mode the HUD and PASS keep working longer than the longest-duration cylinder, but the batteries must be replaced before the next use, and never in a pressurized system.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Yes; it outlasts the longest cylinder, but replace batteries before next use", "wh": ["No; leave now, because the PASS shuts off within a few minutes", "Yes; and it can run one more full cylinder before a battery change", "Yes; swap the batteries now with the cylinder still pressurized"], "hash": "sha256:f0e397954a541deabdf685d9b46655b9b27f3b4b75457cfe1ee85d5abaf1907d"}, {"n": 10, "q": "While scanning your name tag into the G1, the PASS locks up. How do you clear it?", "a": "Remove the battery module, wait 30 seconds, and reinstall it. To avoid it, make sure the tag touches the power module when you scan.", "qh": "While scanning your name tag into the G1, the PASS locks up. How do you clear it?", "ah": "Remove the battery module, wait 30 seconds, and reinstall it. To avoid it, make sure the tag touches the power module when you scan.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Remove the battery module, wait 30 s, reinstall it", "wh": ["Remove the battery module, wait 10 s, reinstall it", "Press RESET twice within about 1 s", "Rescan the tag against the control module"], "hash": "sha256:739d157962d60f950534a2d80b6dbf54863c9c4fd4b8bd1f75bc42731e9582ec"}], "sources": [{"label": "MSA G1 SCBA Operating Manual (PASS, sections 2.6 and 9)", "url": "https://s7d9.scene7.com/is/content/minesafetyappliances/10187007_USOperatingManual-G1SCBA2018Ed"}, {"label": "3M Scott Air-Pak X3 Pro O&M 595373-01 Rev C", "url": "https://www.eastgreenbushfire.com/wp-content/uploads/2025/10/X3-Pro-NFPA-1981-2018-Edition-Operating-and-Maintenance-Instructions-English-595373-01_C.pdf"}, {"label": "NIOSH FACE Report F2005-02 (backup PASS, Mayday and manual PASS)", "url": "https://stacks.cdc.gov/view/cdc/163716"}, {"label": "NIOSH 94-125 Preventing Injuries and Deaths of Fire Fighters", "url": "https://archive.cdc.gov/www_cdc_gov/niosh/docs/94-125/default.html"}, {"label": "NIOSH 2009-100 Leading Recommendations", "url": "https://www.cdc.gov/niosh/docs/2009-100/pdfs/2009-100.pdf"}, {"label": "NIST, High Temperature Performance of Fire Fighter Equipment (PASS high-temperature finding)", "url": "https://www.nist.gov/programs-projects/high-temperature-performance-fire-fighter-equipment"}, {"label": "NIST TN 1641, PASS Sound Muffle Tests Using a Structural Firefighter Protective Ensemble Method (2009)", "url": "https://www.nist.gov/publications/pass-sound-muffle-tests-using-structural-firefighter-protective-ensemble-method"}, {"label": "EHS Today, NFPA 1982 (2007) changes and NFPA's PASS alert", "url": "https://www.ehstoday.com/emergency-management/article/21913972/performance-issues-addressed-in-new-edition-of-nfpas-standard-on-personal-alert-safety-systems"}, {"label": "Fire Fighting in Canada, PASS alarm signals can fail at high temperatures (2007)", "url": "https://www.firefightingincanada.com/pass-alarm-signals-can-fail-at-high-temperatures-cff-1474/"}], "position_html": "<strong>Tree position:<\/strong> Path 09 Communications, Navigation and Accountability &gt; 09.1 Navigation and Accountability &gt; tool 1. <strong>Unlocks after:<\/strong> 01.2 SCBA. <strong>Unlocks:<\/strong> Path 04 RIT (04.1 Mayday and Self-Survival), 09.3 Telemetry (planned). <strong>Cross-links:<\/strong> 01.2.1 Scott X3 Pro, 01.2.2 MSA G1.", "note_html": "Study aid only. PASS requirements were in NFPA 1982 (2018 edition). NFPA has consolidated them, with the SCBA requirements, into NFPA 1970."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 469.01, "y": 477.53, "angle": 43.5, "vx": 627.69, "vy": 452.07, "vangle": 288.5}, "09.1.2": {"id": "09.1.2", "name": "Personnel Accountability Systems (Passport, PAR)", "path": "09", "kind": "tool", "parent": "09.1", "prereqRaw": "parent 09.1", "children": [], "prereqs": ["09.1"], "unlocks": [], "cross": ["04.1"], "doc": {"title": "09.1.2 Personnel Accountability Systems (Passport, Tags, PAR)", "file": "09.1.2_Personnel_Accountability_Systems.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>A way to track <strong>who<\/strong> is on scene, <strong>where<\/strong> they are, and <strong>what<\/strong> they're assigned to, so command knows right away if anyone is missing. Common types are <strong>passport/name-tag<\/strong> systems, tag boards, barcode systems, and electronic SCBA telemetry (USFA EFO research).<\/p>"}, {"key": "specs", "title": "Key specs (Passport system, MABAS Div. 1 OG 305)", "html": "<ul><li><strong>Name tags<\/strong> (Velcro) for each member go on the company <strong>Passport<\/strong>. Passports go to the IC or division officer and sit on a <strong>status board<\/strong> (9 in x 14 in).<\/li><li><strong>Helmet shields<\/strong> identify the company.<\/li><li><strong>Backup Passport (RED):<\/strong> kept on the apparatus (officer's side) as an emergency replacement and a second way to identify a lost crew.<\/li><li><strong>Reserve Passport (GREEN)<\/strong> stays in the station. <strong>Blank Passports<\/strong> live in make-up kits for new companies.<\/li><li><strong>PAR (Personnel Accountability Report):<\/strong> a roll call confirming all assigned members are safe and accounted for.<\/li><li><strong>Crew integrity:<\/strong> members stay in <strong>voice (not radio), visual, or touch<\/strong> contact inside the perimeter.<\/li><\/ul><p><strong>More OG 305 details (2021)<\/strong><\/p><ul><li><strong>Hazard zone:<\/strong> any area that needs SCBA, or where a firefighter could be lost, trapped, or hurt by the environment or the structure. That includes an exterior attack close to the building, cause-and-origin work, confined space, and trench rescue.<\/li><li><strong>Sizes:<\/strong> the Passport is a 2 in x 4 in Velcro board. Name tags are 3/8 in x 2 in white tags with rank, last name, and the four-letter MABAS department code. Helmet shields (2 in x 4 in) are <strong>optional<\/strong>.<\/li><li><strong>Primary Passport (WHITE)<\/strong> rides on the officer's portable radio or holster until it's turned in at the perimeter.<\/li><li><strong>Name tags:<\/strong> each member keeps at least six. Tags go on the Passports <strong>before or while responding<\/strong>. The company officer's tag goes on top. An engineer staying with the apparatus turns his tag <strong>upside down at the bottom<\/strong>. Members cross-staffing two rigs keep tags on both rigs' Passports.<\/li><li><strong>When the radio exception applies:<\/strong> apparatus operators, chief officers, and lobby control teams may use radio or phone contact, because their location is fixed and known.<\/li><li><strong>Split crews:<\/strong> when part of a crew goes to a different officer, the new officer becomes accountable for it.<\/li><li><strong>When Passports are required:<\/strong> at every incident with an established Staging area, Division, or a multiple alarm. On small incidents they're recommended, not required.<\/li><li><strong>Mutual aid without Passports:<\/strong> they report to Staging, where the make-up kit supplies hand-written name tags, a customized blank green Passport, and helmet ID made from medical tape, plus a brief overview of the system.<\/li><li>The guideline is written to comply with OSHA 29 CFR 1910.134 and NFPA 1500 and 1561.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li>On arrival, the company officer turns in the Passport per SOP (to command or the accountability officer).<\/li><li>Command tracks the assignment on the status board and moves Passports with the crews.<\/li><li><strong>A PAR is required at set times<\/strong>, typically after a report of a missing or trapped member, at any change from offensive to defensive operations, or after a sudden hazardous event (Rogers SOP 310). MABAS OG/PS 305 §5.4.3 is more specific: the PAR comes <strong>before<\/strong> the change from offensive to defensive.<\/li><li>When leaving the hot zone, crews get their Passport back.<\/li><li>Any member unaccounted for means an immediate search and RIT response (NIOSH).<\/li><\/ol><p><strong>Arrival exceptions (OG 305 section 5.4.1):<\/strong> the Primary Passport stays with the officer when the company is the only unit on scene, when it is a committed first-arriving unit before an IC is established (or has passed the IC), or when it is sent to a remote side before a Division is set up. When those companies leave the hazard area, they report their status to the IC by radio or in person, and the IC sends them to transfer their Passport.<\/p><p><strong>OG 305 PAR triggers (section 5.4.3).<\/strong> The IC or Division Officers conduct a PAR:<\/p><ul><li>When a team is relieved and moved to a different Division. The Division Officer confirms the company officer has the whole crew.<\/li><li>When a firefighter, company, or crew is presumed missing or trapped. The Division Officer starts rescue at the <strong>last known location<\/strong> as soon as possible, and the IC then runs a PAR to confirm who is missing.<\/li><li><strong>Before<\/strong> a change from an offensive to a defensive strategy.<\/li><li>After a catastrophic change, such as a collapse, explosion, backdraft, sudden flooding, or vapor-cloud release.<\/li><li>Whenever the IC or a company officer decides a roll call is needed.<\/li><li>Also: if a reasonable time passes and a company officer hasn't returned or told the Division Officer the crew is out, the Division Officer starts a PAR.<\/li><\/ul><p><strong>Relieving a company (section 5.4.2):<\/strong> the IC or Division Officer confirms with the company officer that everyone is accounted for, asks about the assignment's progress, returns the Passport, and sends the crew to Rehab or a new task. Rehab officers write times on the Passports to keep crew rotation on track.<\/p>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>NIOSH: accountability is one of command's most important duties. In fatal incidents, \"no one could account for them.\"<\/li><li>A Passport is only as good as the crew discipline behind it. Stay together and don't freelance.<\/li><li>Pair it with PASS and radio Mayday procedures.<\/li><li><strong>NIOSH F2005-02 (Texas, 2004):<\/strong> a probationary firefighter became separated from his attack team. A PAR called right after an emergency evacuation showed he was missing, and he was found about 15 ft from the entry point about 15 minutes later. NIOSH recommended keeping team continuity.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "What is a PAR, and who conducts it on a MABAS Division 1 fireground?", "a": "A Personnel Accountability Report: a systematic roll call confirming that everyone in a division, or the whole incident, is safe and accounted for. The IC or Division Officers conduct it.", "qh": "What is a PAR, and who conducts it on a MABAS Division 1 fireground?", "ah": "A Personnel Accountability Report: a systematic roll call confirming that everyone in a division, or the whole incident, is safe and accounted for. The IC or Division Officers conduct it.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "A roll call confirming all are safe; run by the IC or Division Officers", "wh": ["A roll call confirming all are safe; run by each company's engineer", "A roll call confirming all are safe; run by the Rehab officer", "A radio check of every portable; run by the IC or Division Officers"], "hash": "sha256:f14963a7590fa255cd5d867ea6cfadcd9b5c0632df551c3d84a116af15f7ee57"}, {"n": 2, "q": "Your engine is first in, and the crew becomes lost before the officer hands the Primary Passport to command. How can command still identify the crew?", "a": "With the RED backup Passport, a duplicate kept on the apparatus door or dashboard on the officer's side. It's the backup ID for a crew lost before its Primary Passport was transferred.", "qh": "Your engine is first in, and the crew becomes lost before the officer hands the Primary Passport to command. How can command still identify the crew?", "ah": "With the RED backup Passport, a duplicate kept on the apparatus door or dashboard on the officer's side. It's the backup ID for a crew lost before its Primary Passport was transferred.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "The RED backup Passport kept on the apparatus, officer's side", "wh": ["The GREEN reserve Passport kept on the apparatus, officer's side", "The RED backup Passport kept in the station make-up kit", "The WHITE primary Passport kept on the apparatus, officer's side"], "hash": "sha256:564dd7c72301c940e7882462d6826491db82633d1ce4e3de80b3e92813e59a61"}, {"n": 3, "q": "Per MABAS OG/PS 305, the IC is about to pull everyone out and go defensive. When must the PAR happen relative to that switch, and what other events trigger one?", "a": "Before the change from offensive to defensive. Other triggers: a team moved to another Division, a member or crew presumed missing or trapped, a catastrophic change (collapse, explosion, backdraft, flooding, vapor release), a crew overdue to report out, or whenever the IC or a company officer decides one is needed.", "qh": "Per MABAS OG/PS 305, the IC is about to pull everyone out and go defensive. When must the PAR happen relative to that switch, and what other events trigger one?", "ah": "Before the change from offensive to defensive. Other triggers: a team moved to another Division, a member or crew presumed missing or trapped, a catastrophic change (collapse, explosion, backdraft, flooding, vapor release), a crew overdue to report out, or whenever the IC or a company officer decides one is needed.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Before the switch; also missing member, Division move, catastrophe, overdue crew", "wh": ["Only at the next timed PAR; also missing member, Division move, catastrophe, overdue crew", "During the switch; also missing member, Division move, catastrophe, overdue crew", "Only after the switch, once all crews are outside the collapse zone"], "hash": "sha256:8c0137a96ac7551809f656c586fdc1dfd135b84f228d2762213b1b1787ff0aae"}, {"n": 4, "q": "Two members inside are talking to each other by portable radio from different rooms. Does that meet crew integrity? Who is allowed to rely on radio contact?", "a": "No. Crew contact must be voice (not radio), visual, or touch. Radio or phone contact is allowed only for people with a fixed, known location, such as apparatus operators, chief officers, and lobby control teams.", "qh": "Two members inside are talking to each other by portable radio from different rooms. Does that meet crew integrity? Who is allowed to rely on radio contact?", "ah": "No. Crew contact must be voice (not radio), visual, or touch. Radio or phone contact is allowed only for people with a fixed, known location, such as apparatus operators, chief officers, and lobby control teams.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No, it must be voice, visual, or touch; radio only for fixed-location roles", "wh": ["Yes, radio counts as voice contact; radio is fine for any interior crew", "No, it must be voice, visual, or touch; radio only for the company officer", "No, it must be voice, visual, or touch; radio only for RIT members inside"], "hash": "sha256:e5eccaac4d84e72747b1cda2a00fcbf58e576686a7e18489a5d61a8f5c75025e"}, {"n": 5, "q": "You're the only company on scene and you go inside. Do you hand off your Primary Passport? Name the other exceptions in OG 305.", "a": "No, it stays with the officer. The other exceptions are a committed first-arriving unit before an IC is established (or one that has passed the IC), and a unit sent to a remote side before a Division is set up. When those companies come out, they report to the IC and then transfer their Passport.", "qh": "You're the only company on scene and you go inside. Do you hand off your Primary Passport? Name the other exceptions in OG 305.", "ah": "No, it stays with the officer. The other exceptions are a committed first-arriving unit before an IC is established (or one that has passed the IC), and a unit sent to a remote side before a Division is set up. When those companies come out, they report to the IC and then transfer their Passport.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No, it stays with the officer; also first-arriving before IC, remote side before Division", "wh": ["Yes, leave it on the rig; also first-arriving before IC, remote side before Division", "No, it stays with the officer; also any company in Rehab, and any RIT company", "No, it stays with the officer; also first-arriving before IC, remote side after Division"], "hash": "sha256:f94a76118c67a4ae3b75c6e1366566081e1f4400ed389c271f5e6b0f3ea46369"}, {"n": 6, "q": "A Division Officer believes a crew is trapped. What happens first, and what does the IC do next?", "a": "The Division Officer starts rescue efforts at the last known location as soon as possible. The IC then conducts a PAR to confirm who is missing.", "qh": "A Division Officer believes a crew is trapped. What happens first, and what does the IC do next?", "ah": "The Division Officer starts rescue efforts at the last known location as soon as possible. The IC then conducts a PAR to confirm who is missing.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Division Officer starts rescue at last known location; IC then runs a PAR", "wh": ["IC runs a PAR first; Division Officer then starts rescue at last known location", "Division Officer starts rescue at the entry point; IC then runs a PAR", "Division Officer starts rescue at last known location; IC then goes defensive"], "hash": "sha256:e031c1d5047bd735c716d5d3420447534d1b21c95a5f3563e3ad88b5d779201b"}, {"n": 7, "q": "When must name tags be on the Passports, whose tag goes on top, and how is an engineer who stays with the rig marked?", "a": "Before or while responding. The company officer's tag goes on top. An engineer who stays with the apparatus has his tag turned upside down at the bottom.", "qh": "When must name tags be on the Passports, whose tag goes on top, and how is an engineer who stays with the rig marked?", "ah": "Before or while responding. The company officer's tag goes on top. An engineer who stays with the apparatus has his tag turned upside down at the bottom.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Before or while responding; officer's tag on top; engineer's upside down at bottom", "wh": ["On arrival at the perimeter; officer's tag on top; engineer's upside down at bottom", "Before or while responding; officer's tag at bottom; engineer's upside down on top", "Before or while responding; officer's tag on top; engineer's tag removed entirely"], "hash": "sha256:c6155952e3275730900c1b2dddb9e6539bb15a2fb7390b143c834ac0a5708734"}, {"n": 8, "q": "A Division Officer is relieving a company. What four things should the officer do?", "a": "Confirm with the company officer that all members are accounted for, ask about the assignment's progress, return the Passport, and send the crew to Rehab or a new assignment.", "qh": "A Division Officer is relieving a company. What four things should the officer do?", "ah": "Confirm with the company officer that all members are accounted for, ask about the assignment's progress, return the Passport, and send the crew to Rehab or a new assignment.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Confirm all accounted for, ask progress, return Passport, send to Rehab or task", "wh": ["Confirm all accounted for, ask progress, keep the Passport, send to Rehab or task", "Confirm all accounted for, ask progress, return Passport, send to Staging only", "Confirm all accounted for, write rehab times, return Passport, send to Rehab or task"], "hash": "sha256:62720e76889b688ce659297aca48ffd3da06dc557c43cadd07b184b4e030f098"}, {"n": 9, "q": "A mutual-aid engine arrives with no Passports. How does it get into the system?", "a": "It reports to Staging. The make-up kit is used to write name tags, customize a blank green Passport, and make helmet ID from medical tape, and the crew gets a brief overview of the system.", "qh": "A mutual-aid engine arrives with no Passports. How does it get into the system?", "ah": "It reports to Staging. The make-up kit is used to write name tags, customize a blank green Passport, and make helmet ID from medical tape, and the crew gets a brief overview of the system.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Reports to Staging; kit makes name tags, a blank green Passport, tape helmet ID", "wh": ["Reports to the IC; kit makes name tags, a blank green Passport, tape helmet ID", "Reports to Staging; kit makes name tags, a blank red Passport, tape helmet ID", "Reports to Staging; the crew is held out until its own Passports arrive"], "hash": "sha256:50535508014714c76b2ed79b100770f06ada107dd953e03680a1465b46b2e6d3"}, {"n": 10, "q": "In the Texas fire in NIOSH F2005-02, what revealed that a firefighter was missing, and what crew-level recommendation did NIOSH make?", "a": "A PAR called right after the crews' emergency evacuation showed he was missing. He was found about 15 minutes later, about 15 ft from the entry point. NIOSH recommended making sure team continuity is maintained.", "qh": "In the Texas fire in NIOSH F2005-02, what revealed that a firefighter was missing, and what crew-level recommendation did NIOSH make?", "ah": "A PAR called right after the crews' emergency evacuation showed he was missing. He was found about 15 minutes later, about 15 ft from the entry point. NIOSH recommended making sure team continuity is maintained.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "A PAR right after the emergency evacuation; NIOSH urged team continuity", "wh": ["His PASS alarm after the emergency evacuation; NIOSH urged team continuity", "A PAR right after the emergency evacuation; NIOSH urged more Passports per crew", "A PAR called before the emergency evacuation; NIOSH urged team continuity"], "hash": "sha256:edddb4715b71038faf09a111672d21f76d2545c627d892c15d33a882aa54444d"}], "sources": [{"label": "MABAS Division 1 OG/PS 305 Passport Personnel Accountability System (2021)", "url": "https://www.mabas1.org/files/95b8dee97/MABAS_OGPS_305_Passport_Accountability_Sys_-_FINAL_06-01-21.pdf"}, {"label": "Rogers (AR) FD SOP 310 Passport Accountability System (updated Feb 2026)", "url": "https://www.rogersar.gov/DocumentCenter/View/46144/SOP-310---Passport-Accountability-System---2-2026"}, {"label": "USFA EFO paper, Selecting and Planning the Implementation of a Personnel Accountability System", "url": "https://apps.usfa.fema.gov/pdf/efop/efo28066.pdf"}, {"label": "NIOSH HHE 94-0244 (Memphis), accountability recommendation", "url": "https://www.cdc.gov/niosh/hhe/reports/pdfs/1994-0244-2431.pdf"}, {"label": "NIOSH FACE Report F2005-02 (PAR after emergency evacuation; team continuity)", "url": "https://stacks.cdc.gov/view/cdc/163716"}], "position_html": "<strong>Tree position:<\/strong> Path 09 &gt; 09.1 Navigation and Accountability &gt; tool 2. <strong>Unlocks after:<\/strong> 01.0 Fundamentals, 09.1.1 PASS. <strong>Unlocks:<\/strong> 09.4 Incident Command (planned) and the Path 09 capstone. <strong>Cross-links:<\/strong> Path 04 RIT, 10 Officer.", "note_html": "Study aid only. Systems vary by department and region. Learn your own SOP. This sheet uses a published regional operating guideline (MABAS Division 1) as the example."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 450.69, "y": 488.55, "angle": 74.5, "vx": 645.42, "vy": 464.02, "vangle": 319.5}, "09.1.3": {"id": "09.1.3", "name": "Apparatus GPS / AVL", "path": "09", "kind": "tool", "parent": "09.1", "prereqRaw": "parent 09.1", "children": [], "prereqs": ["09.1"], "unlocks": [], "cross": ["08.1"], "doc": {"title": "09.1.3 Apparatus GPS / AVL (Automatic Vehicle Location)", "file": "09.1.3_Apparatus_GPS_AVL.md", "sections": [{"key": "what", "title": "What it is", "html": "<p><strong>AVL<\/strong> uses a GPS receiver on each apparatus to report its real-time location to <strong>CAD<\/strong> (computer-aided dispatch), usually shown on <strong>MDTs<\/strong> (mobile data terminals) or mapping software. It allows <strong>closest-unit (\"dynamic\") dispatch<\/strong> based on where units actually are, instead of which station is closest.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Parts:<\/strong> a GPS receiver/transceiver on the apparatus, a data or radio link, CAD integration, and an MDT or map display.<\/li><li><strong>Use case:<\/strong> CAD recommends the closest available unit from live AVL positions (USFA EFO research, FDNY audit).<\/li><li><strong>DHS SAVER (2020):<\/strong> vehicle tracking systems give near-real-time fleet positions. Some add hydrant mapping, driver performance data, or alerts to civilian vehicles.<\/li><li><strong>Real deployments:<\/strong> Honolulu FD put AVL and MDTs on all front-line apparatus in 2006 (42 engines, 15 aerials, and more).<\/li><\/ul><p><strong>Honolulu FD (USFA EFO study)<\/strong><\/p><ul><li>A 2005 pilot covered one battalion. The 2006 rollout reached the other four: 42 engines, 15 aerials, 2 hazmat units, 5 battalion chief vehicles, and 1 mobile command center.<\/li><li>The AVL updates each rig's position to CAD <strong>every 5 seconds<\/strong>. CAD then recommends units from the incident location, the response plan for that incident type, and each rig's real-time position and most direct route. That's <strong>dynamic dispatching<\/strong>, a shift away from dispatch by first-due area.<\/li><li>Before CAD, dispatch used punch cards and a status board of magnetic toy trucks, and unavailable companies were sometimes dispatched by mistake.<\/li><li><strong>Result:<\/strong> response times in 2001 and 2007 differed significantly, and having AVL was linked to meeting total-response-time goals. <strong>Relocated companies<\/strong> were less likely to meet their goals. The author's possible reasons: they're unfamiliar with the area, drive more cautiously so they don't pass the address, or start farther away.<\/li><li><strong>Limit:<\/strong> AVL affects only one part of total response time, the <strong>travel time<\/strong>.<\/li><\/ul><p><strong>FDNY audit (NYC Comptroller, November 2011)<\/strong><\/p><ul><li>AVL was fully integrated with the EMS CAD but <strong>not with Starfire, the fire CAD<\/strong>.<\/li><li>The system didn't show vehicles in true real time, and sometimes showed them in the wrong place or not at all. The auditors didn't consider those instances a threat to public safety.<\/li><li>The project cost about $39 million, and auditors questioned the $7.3 million spent on fire vehicles.<\/li><li>Recommendations included having EMS crews confirm with their dispatcher, before each shift, that their AVL works, plus periodic diagnostics and better equipment inventory.<\/li><\/ul><p><strong>GPS limits<\/strong><\/p><ul><li><strong>GPS.gov:<\/strong> GPS phones are typically accurate to within <strong>4.9 m (16 ft)<\/strong> under open sky. Accuracy worsens near buildings, bridges, and trees. Common causes are signal blockage, indoor or underground use, and signals reflected off buildings (\"multipath\"). Often the GPS works fine but the <strong>map<\/strong> is wrong: missing roads or wrongly estimated addresses.<\/li><li><strong>USFA EFO (Alameda FD, 2005):<\/strong> agencies reported lost GPS signals in \"urban canyons,\" under heavy trees and foliage, and with rigs inside quarters. GIS maps and pre-plans need constant updating as the city grows (Phoenix FD).<\/li><\/ul><p><strong>More from DHS SAVER (2020)<\/strong><\/p><ul><li>A system has three parts: a transponder in the vehicle, a communications network (usually cellular; one surveyed product used satellite for range beyond cell coverage), and mapping software.<\/li><li>Agencies may prefer systems that <strong>don't connect to the vehicle's onboard computer<\/strong>, to reduce the risk of hacking.<\/li><li>Responder-to-vehicle (R2V) alerts warn civilian drivers and are broadcast <strong>only when the lightbar is on<\/strong>. About 25% of U.S. firefighter deaths have historically been vehicle-related (FEMA, cited by SAVER).<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li>The MDT and AVL stay powered and logged in, with unit status (available, en route, on scene) kept current.<\/li><li>CAD uses live position to recommend units, and dispatch assigns them.<\/li><li>Crews use the MDT map and routing for the address, hydrants, and pre-plans where available.<\/li><li>Command and dispatch can see where units are during large incidents.<\/li><li>MDTs let crews change unit status with a touch and read dispatch information as text, which cuts radio time and spoken or misheard errors (USFA EFO, Alameda).<\/li><\/ol>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>AVL only helps if <strong>status buttons and positions are accurate<\/strong>. An NYC Comptroller audit found FDNY's AVL wasn't fully integrated with fire CAD and sometimes showed vehicles inaccurately or not at all.<\/li><li>Don't drive by screen. Watch the road and follow your driver/operator rules (Path 08).<\/li><li>AVL tracks <strong>vehicles<\/strong>, not firefighters inside buildings. Interior accountability still relies on Passports, PASS, radio, and SCBA telemetry.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Your engine is clearing the hospital 1 mile from a new call, while the first-due station is 3 miles away. What does AVL let CAD do here that station-based dispatch can't?", "a": "Recommend the closest available unit from its real-time GPS position (dynamic dispatching) instead of by first-due area. In Honolulu, CAD combines the incident location, the response plan, and each rig's live position and most direct route.", "qh": "Your engine is clearing the hospital 1 mile from a new call, while the first-due station is 3 miles away. What does AVL let CAD do here that station-based dispatch can't?", "ah": "Recommend the closest available unit from its real-time GPS position (dynamic dispatching) instead of by first-due area. In Honolulu, CAD combines the incident location, the response plan, and each rig's live position and most direct route.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Recommend the closest unit from its live GPS position, not by first-due area", "wh": ["Recommend the first-due unit from its live GPS position, not by distance", "Recommend the closest station from its fixed address, not by live position", "Recommend the closest unit from its last status button, not by live GPS"], "hash": "sha256:a68ff5f8a526f90b525bcf231766b849e065502f02f172fd9a36e9bbb326a966"}, {"n": 2, "q": "What are the main parts of an AVL or vehicle-tracking system?", "a": "A GPS receiver/transponder on the vehicle, a communications link (usually cellular or radio, sometimes satellite), CAD integration, and mapping software on an MDT or display.", "qh": "What are the main parts of an AVL or vehicle-tracking system?", "ah": "A GPS receiver/transponder on the vehicle, a communications link (usually cellular or radio, sometimes satellite), CAD integration, and mapping software on an MDT or display.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Vehicle GPS transponder, comms link, CAD integration, mapping on an MDT", "wh": ["Vehicle GPS transponder, comms link, CAD integration, SCBA telemetry receiver", "Handheld GPS for each firefighter, comms link, CAD integration, MDT mapping", "Vehicle GPS transponder, onboard-computer tie-in, CAD, but no comms link"], "hash": "sha256:cd60257fd32be266649a0c246bf8a6dbb1327aff6f3e50d047507975bcbb3b18"}, {"n": 3, "q": "A firefighter calls a Mayday from inside a building. Will AVL show command where he is? What does?", "a": "No. AVL tracks vehicles, not people inside buildings. Use Passports and PAR, PASS, radio, and SCBA telemetry.", "qh": "A firefighter calls a Mayday from inside a building. Will AVL show command where he is? What does?", "ah": "No. AVL tracks vehicles, not people inside buildings. Use Passports and PAR, PASS, radio, and SCBA telemetry.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No, AVL tracks vehicles; use Passports/PAR, PASS, radio, SCBA telemetry", "wh": ["Yes, AVL shows his last position; use it with the PAR and radio", "No, AVL tracks vehicles; use MDT routing and hydrant maps instead", "Yes, if his rig is on scene; the MDT shows crew positions inside"], "hash": "sha256:62733b6202329ba567860fe67300bbf0748dda97c1c87bb8e9c6a1ee1ab8cf79"}, {"n": 4, "q": "Name two weaknesses found in the NYC Comptroller's audit of FDNY's AVL, and one fix it recommended.", "a": "Any two of: AVL wasn't integrated with the fire CAD (Starfire), it didn't show true real-time positions, and it sometimes showed vehicles in the wrong place or not at all. Fixes included crews confirming with dispatch before each shift that their AVL works, and periodic diagnostics.", "qh": "Name two weaknesses found in the NYC Comptroller's audit of FDNY's AVL, and one fix it recommended.", "ah": "Any two of: AVL wasn't integrated with the fire CAD (Starfire), it didn't show true real-time positions, and it sometimes showed vehicles in the wrong place or not at all. Fixes included crews confirming with dispatch before each shift that their AVL works, and periodic diagnostics.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Not tied to fire CAD, not true real time; fix: crews check AVL each shift", "wh": ["Not tied to EMS CAD, not true real time; fix: crews check AVL each shift", "Not tied to fire CAD, not true real time; fix: move fire rigs to satellite", "Not tied to fire CAD, a public-safety threat; fix: crews check AVL each shift"], "hash": "sha256:aa9b8a03615820a1a1766ccbd37cd1a0c9e172cddbf3bc0029f5c7e07ceaffdb"}, {"n": 5, "q": "Honolulu found AVL improved response times. Which part of total response time can AVL actually change?", "a": "Only travel time. Call processing and other parts of total response time depend on other factors.", "qh": "Honolulu found AVL improved response times. Which part of total response time can AVL actually change?", "ah": "Only travel time. Call processing and other parts of total response time depend on other factors.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Only travel time", "wh": ["Only call-processing time", "Travel and turnout time", "Total response time, end to end"], "hash": "sha256:1e75dea90043e22c5dfddefac9d58aed4eacb814e49fa835c119b558c41a157d"}, {"n": 6, "q": "In the Honolulu study, which companies were less likely to meet their response-time goals, and what reasons did the author suggest?", "a": "Relocated companies. Possible reasons: they're unfamiliar with the area, drive more cautiously so they don't pass the address, or start from farther away.", "qh": "In the Honolulu study, which companies were less likely to meet their response-time goals, and what reasons did the author suggest?", "ah": "Relocated companies. Possible reasons: they're unfamiliar with the area, drive more cautiously so they don't pass the address, or start from farther away.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Relocated companies: unfamiliar area, cautious driving, farther start", "wh": ["First-due companies: unfamiliar area, cautious driving, farther start", "Relocated companies: AVL gaps, older rigs, heavier traffic", "Aerial companies: unfamiliar area, cautious driving, farther start"], "hash": "sha256:b8360141b678c8026f6f40a6eb0bb8a1be32452d49e3bb7f851645b73d3c5a95"}, {"n": 7, "q": "Your rig shows in the wrong spot while it's parked in quarters, and again downtown between high-rises. Give the likely causes.", "a": "GPS signals are blocked indoors (in quarters) and are blocked or reflected (multipath) between tall buildings, the \"urban canyon\" effect. Accuracy also worsens near bridges and under heavy trees.", "qh": "Your rig shows in the wrong spot while it's parked in quarters, and again downtown between high-rises. Give the likely causes.", "ah": "GPS signals are blocked indoors (in quarters) and are blocked or reflected (multipath) between tall buildings, the \"urban canyon\" effect. Accuracy also worsens near bridges and under heavy trees.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Indoor blockage in quarters; blockage and multipath between tall buildings", "wh": ["Wrong map data in quarters; blockage and multipath between tall buildings", "Indoor blockage in quarters; CAD overload from too many units downtown", "MDT logged out in quarters; blockage and multipath between tall buildings"], "hash": "sha256:8497ea852886e0d49a3dc37177d217379604b81a8bfbf8ff7b9e3f5fa7a41af2"}, {"n": 8, "q": "The MDT's GPS fix is good, but the routing sends you to the wrong block. What's a common cause, and what upkeep does it point to?", "a": "Map errors such as missing roads or wrongly estimated street addresses, which GPS.gov says are common even when the GPS hardware is fine. GIS maps and pre-plans need continuous updating.", "qh": "The MDT's GPS fix is good, but the routing sends you to the wrong block. What's a common cause, and what upkeep does it point to?", "ah": "Map errors such as missing roads or wrongly estimated street addresses, which GPS.gov says are common even when the GPS hardware is fine. GIS maps and pre-plans need continuous updating.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Map errors (missing roads, wrong addresses); keep GIS and pre-plans updated", "wh": ["Multipath reflection off buildings; keep GIS and pre-plans updated", "Map errors (missing roads, wrong addresses); recalibrate the GPS receiver", "Weak cellular link to CAD; keep GIS and pre-plans updated"], "hash": "sha256:637ea7ec1c9ca78255344500d657adc57def341935875557d617585945f37c54"}, {"n": 9, "q": "Why might an agency choose a vehicle-tracking system that doesn't plug into the apparatus's onboard computer, and when do R2V systems alert civilian drivers?", "a": "Systems that connect to the onboard computer add a hacking risk, so SAVER says agencies may prefer ones that work independently. R2V alerts go out only when the lightbar is turned on during a response.", "qh": "Why might an agency choose a vehicle-tracking system that doesn't plug into the apparatus's onboard computer, and when do R2V systems alert civilian drivers?", "ah": "Systems that connect to the onboard computer add a hacking risk, so SAVER says agencies may prefer ones that work independently. R2V alerts go out only when the lightbar is turned on during a response.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Less hacking risk; R2V alerts go out only when the lightbar is on", "wh": ["Less hacking risk; R2V alerts go out any time the rig is moving", "Lower install cost; R2V alerts go out only when the lightbar is on", "Less hacking risk; R2V alerts go out only when the siren is on"], "hash": "sha256:0ab991902a6f5d565dc509b8ad24caf4fec3f95dcc75638b358ed0f55768d8aa"}], "sources": [{"label": "USFA EFO, Impact of AVL on Incident Response Time in the Honolulu FD", "url": "https://apps.usfa.fema.gov/pdf/efop/efo42570.pdf"}, {"label": "USFA EFO, MDTs and AVL in the Fire Service: Tools or Toys (Alameda FD, 2005)", "url": "https://apps.usfa.fema.gov/pdf/efop/efo38000.pdf"}, {"label": "DHS SAVER Vehicle Tracking Technology Systems Market Survey (2020)", "url": "https://www.dhs.gov/sites/default/files/saver-vehicle-tracking-technology_12mar2020_final-508.pdf"}, {"label": "NYC Comptroller audit of FDNY AVL (FM11-094A, Nov 2011)", "url": "https://comptroller.nyc.gov/reports/audit-report-on-the-fire-department-of-new-yorks-automatic-vehicle-location-system/"}, {"label": "GPS.gov, GPS Accuracy", "url": "https://www.gps.gov/gps-accuracy"}], "position_html": "<strong>Tree position:<\/strong> Path 09 &gt; 09.1 Navigation and Accountability &gt; tool 3. <strong>Unlocks after:<\/strong> 09.1.2 Accountability. <strong>Cross-links:<\/strong> Path 08 Driver/Operator (response routing), 10 Officer (deployment).", "note_html": "Study aid only. Your department's CAD and MDT setup decides how AVL is actually used."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 429.31, "y": 488.55, "angle": 105.5, "vx": 654.45, "vy": 483.4, "vangle": 350.5}, "09.1.4": {"id": "09.1.4", "name": "TIC Navigation and Search", "path": "09", "kind": "tool", "parent": "09.1", "prereqRaw": "parent 09.1", "children": [], "prereqs": ["09.1"], "unlocks": ["02.3"], "cross": ["02.3", "04.1", "09.1.1"], "doc": {"title": "09.1.4 TIC Navigation and Search", "file": "09.1.4_TIC_Navigation_and_Search.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>A thermal imaging camera (TIC) shows heat instead of light, so you can \"see\" through smoke. NIOSH calls it a way to <strong>enhance the sense of sight<\/strong> during size-up (FACE F2020-10). It is a <strong>search aid, not a lifeline<\/strong>. It can't see through walls, glass, mirrors, or water, it can fail, and it does not show you the way out the way a hoseline or tagline does.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<p><strong>How auto-ranging works (FLIR K33/K53 Basic mode):<\/strong><\/p><ul><li>The K33/K53 has one mode: <strong>Basic<\/strong>, a multipurpose mode for initial attack, rescue, and fire control.<\/li><li><strong>High-sensitivity range:<\/strong> −20 to +150 °C (−4 to +302 °F). <strong>Low-sensitivity range:<\/strong> 0 to +650 °C (+32 to +1202 °F). <strong>Heat colorization:<\/strong> +150 to +650 °C (+302 to +1202 °F).<\/li><li>The camera switches ranges when objects <strong>above 150 °C (302 °F)<\/strong> enter the view. The decision uses the center box of the screen, from 15% to 85% of the width and height.<\/li><li><strong>High → low:<\/strong> more than <strong>2%<\/strong> of the pixels in that box stay above 150 °C for <strong>more than 1 s<\/strong>.<\/li><li><strong>Low → high:<\/strong> more than <strong>98%<\/strong> of the pixels stay more than 50 °C below the high-range max (that is, below 100 °C / 212 °F) for <strong>more than 1 s<\/strong>.<\/li><li><strong>Screen icons:<\/strong> a <strong>low-sensitivity indicator<\/strong> (the camera has switched because it sees a hot area) and an <strong>overheating indicator<\/strong> (the camera is about to shut down from internal heat). A <strong>flashing battery icon<\/strong> means at least 5 minutes of power remain.<\/li><li><strong>Low gain mode (setting):<\/strong> locks the camera in the low-sensitivity range. The upside is that it doesn't do a non-uniformity correction (NUC) when something above 150 °C enters the view. The downsides are <strong>lower sensitivity and more image noise<\/strong>.<\/li><li><strong>Buttons:<\/strong> push on/off to turn on. Hold 3–10 s for <strong>standby<\/strong> (auto-off after 6 h). Hold more than 10 s to turn off. The trigger is configurable. K33 default: pull and hold to <strong>freeze<\/strong> the image, release for live.<\/li><\/ul><p><strong>Mode choices (FLIR K45/K55; the K65 has \"NFPA Basic Plus\" versions):<\/strong> | Mode | Range | Heat colorization | Built for | |---|---|---|---| | Basic (default) | Auto (green icon) | 150–650 °C | Initial attack, rescue, fire control | | Black-and-white firefighting | Auto (green) | None | Departments that don't want color | | Fire | Auto (green) | <strong>250–650 °C<\/strong> | Scenes with lots of open flame and high background heat | | Search and rescue | <strong>Locked high-sens<\/strong> (blue) | <strong>100–150 °C<\/strong> | High contrast while searching for people | | Heat detection | <strong>Locked high-sens<\/strong> (blue) | <strong>Hottest 20%<\/strong> of the scene | Overhaul, hidden fire, people in car seats, in water, or in open terrain |<\/p><ul><li><strong>Green icon<\/strong> = auto-switching. <strong>Blue icon<\/strong> = range locked. Locked high-sens gives the best image of things below 150 °C even when something hotter is in view.<\/li><li>To get back to Basic from any mode: push the on/off button for <strong>less than 1 s<\/strong>.<\/li><li>The manual warns that working in an NFPA Basic Plus mode <strong>may require additional training<\/strong>.<\/li><li><strong>Durability (K45/K55/K65):<\/strong> 2 m (6.5 ft) drop onto concrete, IP67, fully operational to +85 °C (185 °F), and to +260 °C (500 °F) for 5 min. The K65 also lists +150 °C (302 °F) for 15 min. Its manual states it complies with NFPA 1801 (2013 ed.).<\/li><li><strong>Bullard (brochure, 2021):<\/strong> the low-sensitivity indicator comes on from about <strong>230 °F<\/strong>, which is lower than FLIR's 302 °F. Optional Electronic Thermal Throttle manually colors the hottest points blue for hidden heat and overhaul. QXT and NXT: 320×240, 60 Hz, 7–8 h operating time.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li><strong>Size-up:<\/strong> use the TIC during the initial size-up (NIOSH 2018-154). Look for fire location, entry points, and vent choices (USFA EFO 37508).<\/li><li><strong>Before entry:<\/strong> always check for a basement or other below-grade area, even if the fire seems to be on the ground floor or higher. A TIC scanning the ground floor <strong>may not detect a basement fire<\/strong>, because wood flooring plus carpet or laminate insulates and blocks heat transfer (NIOSH 2018-154).<\/li><li><strong>Search:<\/strong> stay low. The TIC has a <strong>limited field of view<\/strong>, so scan each room <strong>high and low<\/strong>, then physically check closets, under beds, and storage chests, because a child may hide (EFO 37508). Search and rescue mode, where available, holds high contrast for people.<\/li><li><strong>Orientation:<\/strong> keep your hoseline or tagline and your crew. In large or commercial buildings, NIOSH recommends that primary search crews and RIT <strong>advance with a hoseline or tagline<\/strong> (F2020-10). Use hose coupling direction to find the exit.<\/li><li><strong>White-out:<\/strong> if the screen whites out when you look into a room, give the camera a couple of seconds to readjust (EFO 37508). On the FLIR K-series, the low-sensitivity icon tells you it has switched to the hot range.<\/li><li><strong>Watch the ceiling:<\/strong> high ceiling heat can mean flashover is possible. As water goes on, watch the heat change to judge the stream (EFO 37508).<\/li><li><strong>RIT:<\/strong> each RIT should be assigned a TIC (EFO 37508). In F2023-10, a search crew tied a search rope to a burned-out vehicle, used a TIC and a sounding PASS to work through a maze of vehicles, and found the missing firefighter about 35–40 ft from the rope anchor.<\/li><li><strong>After use (FLIR):<\/strong> clean, charge, check the battery latch, lens,
