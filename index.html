s/fire-protection/firefighting-and-paramedics/battalion-chief"}, {"label": "2026-27 Governor's Budget Summary, Natural Resources", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}, {"label": "Governor's release, 650 new CAL FIRE officers (21 Nov 2025)", "url": "https://www.gov.ca.gov/2025/11/21/california-shatters-training-records-with-650-new-cal-fire-officers-in-2025/"}, {"label": "CAL FIRE memo, New Curriculum and Training Path for Firefighter I (2 May 2022; secondary host)", "url": "https://www.cftda.com/wp-content/uploads/2022/05/New-Curriculum-Training-Path-for-Firefighter-I-FINAL.pdf"}, {"label": "Ranger batches: /workspace/can-report/calfire/calfire-batch-01.md, calfire-batch-02.md, calfire-batch-04.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 6. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> none listed in tree.py.", "note_html": "Study aid only. Source: CAL FIRE Training Center page, OSFM Accredited Academies, the CAL FIRE Acceptable Documents file, and the 2026-27 Governor's Budget (Ranger calfire-batch-01, -02, -04). <strong>The 2026 Firefighter Academy length is unverified.<\/strong> See Key specs, and don't quote a single number."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1481.33, "y": 686.65, "angle": 64.5, "vx": 782.78, "vy": 1254.66, "vangle": 158.5}, "10.6.7": {"id": "10.6.7", "name": "Promotional Path and Certifications (FFI to Unit Chief)", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.2", "10.5"], "doc": {"title": "10.6.7 Promotional Path and Certifications (FFI to Unit Chief)", "file": "10.6.7_Promotional_Path_and_Certifications_FFI_to_Unit_Chief.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>The typical ladder supported by the bulletins: <strong>FFI (1083, non-testing, seasonal) → FFII (1082, exam, CPAT) → FAE (1077, exam, experience plus CPAT) → Fire Captain (1095, exam, experience) → Battalion Chief (9723, promotional) → Assistant Chief (1039, promotional) → Unit Chief (1037, promotional)<\/strong>. It's not a guaranteed single path. Lateral routes exist through HFEO, the paramedic ranges, forestry, OSFM, and aviation.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<p><strong>Fire Fighter II (EX-4603, continuous, online only)<\/strong><\/p><ul><li>Class A, B, or C license.<\/li><li>Valid <strong>CPAT<\/strong> card (see the CPAT rules below).<\/li><li>For paramedic positions, a California or National Registry <strong>EMT-P<\/strong> (you can test within 6 months of finishing a program, but need the California license before an offer).<\/li><li>Age 18 at appointment.<\/li><li>At exam time, only the license is required. The rest is checked during hiring.<\/li><\/ul><p><strong>Fire Apparatus Engineer (EX-4473)<\/strong><\/p><ul><li>License, CPAT, and EMT-P for paramedic positions.<\/li><li>Experience: <strong>8 months<\/strong> of full-time firefighting, <strong>or 1,280 hours<\/strong> as a volunteer firefighter.<\/li><li>An FAE \"may act as fire captain relief,\" and eligible candidates may enter an apprenticeship. Camp jobs need Live Scan/PREA.<\/li><\/ul><p><strong>Fire Captain (EX-5398)<\/strong><\/p><ul><li><strong>Pattern I:<\/strong> 36 months as a CAL FIRE FAE plus completion of the California Fire Fighter <strong>Joint Apprenticeship Committee<\/strong> program (SubJAC journey-level).<\/li><li><strong>Pattern II:<\/strong> 24 months as a full-time paid <strong>Company Officer<\/strong> leading an engine company (or equivalent) or a hand crew such as an ICS Type I or II Crew.<\/li><li>Exam: a <strong>90-minute<\/strong> timed multiple-choice test taken online.<\/li><\/ul><p><strong>Battalion Chief (Join CAL FIRE)<\/strong><\/p><ul><li><strong>Pattern I:<\/strong> 3 years as Fire Captain.<\/li><li><strong>Pattern II:<\/strong> 5 years as HFEO (2 of them via a Training and Development assignment to Captain), plus Basic Fire Control (FFA and COA).<\/li><\/ul><p><strong>Assistant Chief (EX-4883):<\/strong> 2 years as Battalion Chief. Promotional exam. Some positions require peace officer status.<\/p><p><strong>Unit Chief (EX-5386):<\/strong> 2 years as Assistant Chief \"with Fire Administration/Fire Operations experience.\" Promotional exam.<\/p><p><strong>Rules that apply across the ladder<\/strong><\/p><ul><li><strong>Six-month rule:<\/strong> if you're within 6 months of meeting experience, you can take the exam but must fully qualify before appointment or a job offer.<\/li><li><strong>Retest waits:<\/strong> FFII, FAE, and Captain exams are continuous and electronic only, with an <strong>11-month<\/strong> recompete wait. The AC and UC promotional exams have a <strong>six-month<\/strong> retest wait.<\/li><li><strong>CPAT:<\/strong> a <strong>Cal-JAC CPAT<\/strong> card valid as of the final filing date. Incumbents with no break over 12 consecutive months in an appropriate CAL FIRE class don't need a new card; they attach a personal statement instead.<\/li><li><strong>FF1 for FFII and FAE:<\/strong> the California FF1 must be <strong>IFSAC/Pro Board accredited<\/strong> for FFII and FAE (not required for the FFI class). An SFT <strong>Fire Fighter 2<\/strong> certification is also an Acceptable Documents item.<\/li><\/ul><p><strong>Two NFPA lists. Keep them separate:<\/strong><\/p><ul><li><strong>CAL FIRE FFI hiring-form alternatives (JC-533177):<\/strong> 1A Structural or <strong>NFPA 1001<\/strong>. 1B HazMat or <strong>NFPA 1072 / 472 / 470<\/strong>. 1C Wildland or <strong>NFPA 1051 / 1140<\/strong>.<\/li><li><strong>OSFM California FF1 CTS basis (2024 edition, implemented 1 Jul 2025):<\/strong> <strong>NFPA 1010<\/strong> (Fire Fighter 1), <strong>NFPA 1140<\/strong> (Wildland Fire Fighter 1), <strong>NFPA 470<\/strong> (Hazardous Material Awareness and Operations). See 10.2.<\/li><li>These are different documents: a department's hiring checklist versus the state certification standard. Don't merge them.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Plan backward.<\/strong> Captain Pattern I needs 36 months as FAE plus the JAC apprenticeship. In 2025, 658 new FAEs graduated the Company Officer Academy and began a <strong>three-year apprenticeship<\/strong> toward Captain (2026-27 Budget).<\/li><li><strong>Get CPAT and FF1 early.<\/strong> Both gate FFII and FAE job offers.<\/li><li><strong>Paramedic track:<\/strong> the paramedic ranges of FFII, FAE, and Captain need a California EMT-P license before an offer or reassignment.<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>CPAT, a physical ability test, is an MQ for FFII and FAE (card before a job offer).<\/li><li>Peace-officer-designated positions (some Captain, BC, AC, and UC jobs) add felony disqualification, background investigation, and POST age and education rules, as quoted on the bulletins.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li><strong>Archived CalHR specs (2014 to 2015 Wayback snapshots, footers \"Updated 6/3/2012\").<\/strong> These may predate the 31 July 2025 class mergers and the current bulletins:<ul><li><strong>FFII, archived MQs:<\/strong> three months of firefighting, or one year as a certified volunteer, or completion of FFI certification courses, or one year as Fire Prevention Specialist I plus mandatory training.<\/li><li><strong>FAE, archived MQs:<\/strong> eight months of firefighting, or two years as a certified volunteer, or JAC preapprenticeship patterns from 1983 to 1984.<\/li><li><strong>Captain, archived MQs:<\/strong> also listed 48 months as FAE (Pattern II) and 48 months leading a hand crew (Pattern IV).<\/li><\/ul><\/li><li>The current bulletins differ (for example, CPAT and the 1,280 volunteer hours for FAE). Use the bulletins.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "An FFII applicant hasn't taken CPAT yet. Can they sit for the exam? When must the card be in hand? Who's exempt from getting a new card?", "a": "Yes, they're admitted without the card but must submit it before they can be eligible for a job offer. Incumbent FFIIs or FAEs with no break in service over 12 consecutive months don't need a new card. Under the Acceptable Documents file they attach a personal statement instead (EX-4603; Acceptable Documents item 20).", "qh": "An FFII applicant hasn't taken CPAT yet. Can they sit for the exam? When must the card be in hand? Who's exempt from getting a new card?", "ah": "Yes, they're admitted without the card but must submit it before they can be eligible for a job offer. Incumbent FFIIs or FAEs with no break in service over 12 consecutive months don't need a new card. Under the Acceptable Documents file they attach a personal statement instead (EX-4603; Acceptable Documents item 20)."}, {"n": 2, "q": "A volunteer firefighter with 1,000 logged hours wants to test for FAE. Do they qualify? What are the two experience patterns?", "a": "No. FAE requires either 8 months of full-time firefighting or 1,280 hours as a volunteer firefighter. 1,000 hours falls short of Pattern II (EX-4473).", "qh": "A volunteer firefighter with 1,000 logged hours wants to test for FAE. Do they qualify? What are the two experience patterns?", "ah": "No. FAE requires either 8 months of full-time firefighting or 1,280 hours as a volunteer firefighter. 1,000 hours falls short of Pattern II (EX-4473)."}, {"n": 3, "q": "An FAE has 31 months in class and is mid-apprenticeship. Can they take the Captain exam now? What must be done before an offer?", "a": "Yes, if they're within six months of the 36-month requirement. They can test, but must finish the apprenticeship (SubJAC journey-level certification) and the experience before a job offer (EX-5398).", "qh": "An FAE has 31 months in class and is mid-apprenticeship. Can they take the Captain exam now? What must be done before an offer?", "ah": "Yes, if they're within six months of the 36-month requirement. They can test, but must finish the apprenticeship (SubJAC journey-level certification) and the experience before a job offer (EX-5398)."}, {"n": 4, "q": "A company officer from another state led an engine for 26 months. Which Captain pattern might fit, and what's the key condition?", "a": "Pattern II: 24 months as a full-time paid Company Officer leading an engine company (or equivalent) at a responsibility level equal to a CAL FIRE Captain. The experience must be fully complete before a job offer (EX-5398).", "qh": "A company officer from another state led an engine for 26 months. Which Captain pattern might fit, and what's the key condition?", "ah": "Pattern II: 24 months as a full-time paid Company Officer leading an engine company (or equivalent) at a responsibility level equal to a CAL FIRE Captain. The experience must be fully complete before a job offer (EX-5398)."}, {"n": 5, "q": "A Captain with 1 year in rank wants to jump to Assistant Chief. Map the minimum path.", "a": "Captain → Battalion Chief needs 3 years as Captain (Join CAL FIRE). BC → Assistant Chief needs 2 years as BC (EX-4883). Minimum: about 2 more years as Captain, then 2 years as BC. The six-month rule only affects when you can test, not appointment.", "qh": "A Captain with 1 year in rank wants to jump to Assistant Chief. Map the minimum path.", "ah": "Captain → Battalion Chief needs 3 years as Captain (Join CAL FIRE). BC → Assistant Chief needs 2 years as BC (EX-4883). Minimum: about 2 more years as Captain, then 2 years as BC. The six-month rule only affects when you can test, not appointment."}, {"n": 6, "q": "A paramedic student finishes in 5 months. Can they test for FFII on the paramedic range now? What license is needed, and when?", "a": "Yes. FFII lets paramedic-program applicants test if they're within six months of completing training by the exam date. A California EMT-P license is required before a job offer or reassignment (EX-4603).", "qh": "A paramedic student finishes in 5 months. Can they test for FFII on the paramedic range now? What license is needed, and when?", "ah": "Yes. FFII lets paramedic-program applicants test if they're within six months of completing training by the exam date. A California EMT-P license is required before a job offer or reassignment (EX-4603)."}, {"n": 7, "q": "An applicant's California FF1 has no IFSAC or Pro Board seal. Which classes can it support, and which can't it?", "a": "It can support the FFI class. It can't support FFII or FAE, because the Acceptable Documents file requires an IFSAC/Pro Board accredited California FF1 for those.", "qh": "An applicant's California FF1 has no IFSAC or Pro Board seal. Which classes can it support, and which can't it?", "ah": "It can support the FFI class. It can't support FFII or FAE, because the Acceptable Documents file requires an IFSAC/Pro Board accredited California FF1 for those."}, {"n": 8, "q": "A study partner writes \"CAL FIRE FF1 = NFPA 1001, 1072, 1051\" next to \"OSFM FF1 = NFPA 1010, 1140, 470\" and wants to merge them into one list. Why is that wrong?", "a": "They're two different documents. The first is CAL FIRE's FFI hiring-package list of acceptable alternatives (JC-533177). The second is the current OSFM CTS basis for California FF1 (2024 edition, implemented 1 Jul 2025). Per the 10.2 ↔ 10.6.7 cross-link rule, keep them unmerged and cite each one.", "qh": "A study partner writes \"CAL FIRE FF1 = NFPA 1001, 1072, 1051\" next to \"OSFM FF1 = NFPA 1010, 1140, 470\" and wants to merge them into one list. Why is that wrong?", "ah": "They're two different documents. The first is CAL FIRE's FFI hiring-package list of acceptable alternatives (JC-533177). The second is the current OSFM CTS basis for California FF1 (2024 edition, implemented 1 Jul 2025). Per the 10.2 ↔ 10.6.7 cross-link rule, keep them unmerged and cite each one."}, {"n": 9, "q": "You fail the FFII exam today. When can you retest? How does that compare with the Assistant Chief exam?", "a": "FFII is continuous with an 11-month recompete wait (EX-4603). The Assistant Chief promotional exam has a six-month retest wait (EX-4883).", "qh": "You fail the FFII exam today. When can you retest? How does that compare with the Assistant Chief exam?", "ah": "FFII is continuous with an 11-month recompete wait (EX-4603). The Assistant Chief promotional exam has a six-month retest wait (EX-4883)."}, {"n": 10, "q": "Describe the Captain exam format and where you take it.", "a": "A 90-minute timed multiple-choice test on an online testing platform, taken virtually in a private location with reliable internet (EX-5398).", "qh": "Describe the Captain exam format and where you take it.", "ah": "A 90-minute timed multiple-choice test on an online testing platform, taken virtually in a private location with reliable internet (EX-5398)."}, {"n": 11, "q": "What does the Unit Chief MQ require beyond time as an Assistant Chief?", "a": "The two years as an Assistant Chief must include Fire Administration/Fire Operations experience, plus a valid driver license (EX-5386).", "qh": "What does the Unit Chief MQ require beyond time as an Assistant Chief?", "ah": "The two years as an Assistant Chief must include Fire Administration/Fire Operations experience, plus a valid driver license (EX-5386)."}], "sources": [{"label": "FFII exam bulletin EX-4603", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4603"}, {"label": "FAE exam bulletin EX-4473", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4473"}, {"label": "Fire Captain exam bulletin EX-5398", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=5398"}, {"label": "Assistant Chief exam bulletin EX-4883", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4883"}, {"label": "Unit Chief exam bulletin EX-5386", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=5386"}, {"label": "Join CAL FIRE, Battalion Chief", "url": "https://www.joincalfire.com/classifications/fire-protection/firefighting-and-paramedics/battalion-chief"}, {"label": "CAL FIRE Acceptable Documents", "url": "https://www.fire.ca.gov/-/media/BF147896DED446F9B142FEF464A0E9AD"}, {"label": "Firefighter I posting JC-533177 (hiring-form NFPA alternatives)", "url": "https://calcareers.ca.gov/CalHrPublic/Jobs/JobPosting.aspx?JobControlId=533177"}, {"label": "OSFM Fire Fighter 1 certification (CTS basis)", "url": "https://osfm.fire.ca.gov/what-we-do/state-fire-training/professional-certifications/fire-fighter-1"}, {"label": "2026-27 Governor's Budget Summary, Natural Resources", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}, {"label": "NFPA 1001, 1010, 1051, 1072, 1140, 470, 472 (cited by number only; paywalled)", "url": "https://www.nfpa.org/"}, {"label": "Ranger batches: /workspace/can-report/calfire/calfire-batch-01.md, calfire-batch-01-addendum.md; Scout: /workspace/can-report/scout-batch-02.md (Cross-check notes)", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 7. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 10.2 Certification Ladder (OSFM / SFT; do not merge NFPA number lists), 10.5 Promotional Exam Prep and Leadership.", "note_html": "Study aid only. Source: CalCareers exam bulletins EX-4603 (FFII), EX-4473 (FAE), EX-5398 (Captain), EX-4883 (Assistant Chief), and EX-5386 (Unit Chief); the Join CAL FIRE Battalion Chief page; the CAL FIRE Acceptable Documents file (Ranger calfire-batch-01 and addendum); and the OSFM FF1 page (Scout batch 02). MQs are condensed, so read the full bulletin before you apply."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1454.19, "y": 694.95, "angle": 81.5, "vx": 775.39, "vy": 1188.68, "vangle": 229.0}, "10.6.8": {"id": "10.6.8", "name": "Wildland and All-Risk Response", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["09.4", "10.6.4"], "doc": {"title": "10.6.8 Wildland and All-Risk Response", "file": "10.6.8_Wildland_and_All-Risk_Response.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>CAL FIRE provides \"natural resource management and wildland fire protection services to 31 million acres of State Responsibility Area (SRA)\" and \"supports federal and local efforts in non-SRA areas\" (2026-27 Budget). It is also an <strong>all-risk<\/strong> department: \"Beyond its wildland firefighting role, CAL FIRE is an 'all-risk' department.\"<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Daily emergencies (Fire Protection page):<\/strong> wildland fires, structure fires, accidents, heart attacks, lost hikers, spills, train wrecks, floods, and earthquakes.<\/li><li><strong>All-risk list (Our Organization page):<\/strong> medical aids, hazmat spills, swift-water rescue, search and rescue, civil disturbances, train wrecks, floods, earthquakes, and more.<\/li><li><strong>Coverage:<\/strong> over 31 million acres of wildlands. Emergency services in 36 of 58 counties.<\/li><li><strong>Initial attack target:<\/strong> aircraft reach remote areas in about 20 minutes, with a goal of <strong>95% of fires at 10 acres or less<\/strong>.<\/li><li><strong>Prevention work (Fire Prevention Program):<\/strong> wildland pre-fire engineering, vegetation management, fire planning, education, and law enforcement. Typical projects: brush clearance, prescribed fire, defensible space inspections, evacuation planning, fire hazard severity mapping, and fire-related law enforcement.<\/li><li><strong>Hand crews:<\/strong> respond to wildfires, floods, search and rescue, and earthquakes. Between emergencies they do hazardous-fuels reduction and prescribed fire (see 10.6.11).<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<p><strong>Mutual aid and cooperation (Cooperative Efforts page):<\/strong><\/p><ul><li><strong>Unified command:<\/strong> emergencies may be handled under unified command with the agencies CAL FIRE has agreements with.<\/li><li><strong>California Master Mutual Aid Agreement:<\/strong> CAL FIRE helps when local resources are depleted and CAL FIRE resources are available. CAL FIRE can also call on local departments for wildland suppression.<\/li><li><strong>Cal OES:<\/strong> can request CAL FIRE help on non-fire emergencies when the Governor has declared a State of Emergency.<\/li><li><strong>CFAA and the California Military Department / National Guard:<\/strong> can provide personnel, <strong>C-130 MAFFS<\/strong>, helicopters, and other resources when statewide wildfires stretch resources.<\/li><li><strong>CFMA:<\/strong> a closest-forces agreement with USFS, BLM, NPS, BIA, and FWS.<\/li><\/ul><p><strong>ICS fragments (official):<\/strong><\/p><ul><li><strong>FFI hiring requires<\/strong> FEMA IS-100 (Intro to ICS), IS-200 (ICS for Initial Response), IS-700 (NIMS), and IS-800 (National Response Framework).<\/li><li><strong>Air Attack Officer<\/strong> (a fire officer on the OV-10) coordinates with the incident commander, coordinates all aerial resources, and directs drops. The OV-10 can also serve as an <strong>Aerial Supervision Module<\/strong>, leading airtankers on drop runs.<\/li><li><strong>King Air:<\/strong> used to train the <strong>Air Tactical Group Supervisor (ATGS)<\/strong> position.<\/li><li><strong>Incident Management Teams:<\/strong> Anale Burlew's profile says that as Assistant Deputy Director of Fire Protection Operations she \"oversees vital Fire Protection Operations Programs, including Operations Support, Intelligence, and Incident Management Teams.\" She's now listed as Chief Deputy Director, Operations. She has served as Plans Section Chief and Incident Commander Trainee on CAL FIRE IMTs.<\/li><li><strong>Director Joe Tyler<\/strong> is qualified as Agency Administrator, Incident Commander Type 1, Safety Officer, and Operations Section Chief. His last IMT role was Deputy Incident Commander on CAL FIRE IMT 3.<\/li><li><strong>Fire Captains<\/strong> supervise engine companies and hand crews on wildland, structural, flood, hazmat, and other emergencies (EX-5398).<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Defensible space \"gives firefighters a safer area to defend your property\" (Ready for Wildfire, see 10.6.13).<\/li><li>Wildland Safety and Survival Level 1 and Fire Fighter Survival (Structural) are listed course certificates on CAL FIRE's Acceptable Documents file.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "You're an FFI on an SRA engine and get toned out for a vehicle collision with injuries. Is that CAL FIRE's job? Back it up with the department's own wording.", "a": "Yes. The Fire Protection page lists accidents and heart attacks among daily emergencies, and the Our Organization page calls CAL FIRE an \"all-risk\" department beyond its wildland role.", "qh": "You're an FFI on an SRA engine and get toned out for a vehicle collision with injuries. Is that CAL FIRE's job? Back it up with the department's own wording.", "ah": "Yes. The Fire Protection page lists accidents and heart attacks among daily emergencies, and the Our Organization page calls CAL FIRE an \"all-risk\" department beyond its wildland role."}, {"n": 2, "q": "A wildfire is burning in a city outside the SRA, and the city's engines are all committed. How can CAL FIRE resources get there, and what conditions apply?", "a": "The California Master Mutual Aid Agreement lets CAL FIRE assist when local resources are depleted and CAL FIRE resources are available. For non-SRA cities, a Cooperative Fire Protection contract can also make CAL FIRE the lead agency (Cooperative Efforts page).", "qh": "A wildfire is burning in a city outside the SRA, and the city's engines are all committed. How can CAL FIRE resources get there, and what conditions apply?", "ah": "The California Master Mutual Aid Agreement lets CAL FIRE assist when local resources are depleted and CAL FIRE resources are available. For non-SRA cities, a Cooperative Fire Protection contract can also make CAL FIRE the lead agency (Cooperative Efforts page)."}, {"n": 3, "q": "Several large wildfires are burning statewide and resources are stretched thin. Which agreement and partner can add C-130 MAFFS and helicopters?", "a": "The California Fire Assistance Agreement (CFAA) and the California Military Department / National Guard can provide personnel, C-130 MAFFS, helicopters, and other resources (Cooperative Efforts page).", "qh": "Several large wildfires are burning statewide and resources are stretched thin. Which agreement and partner can add C-130 MAFFS and helicopters?", "ah": "The California Fire Assistance Agreement (CFAA) and the California Military Department / National Guard can provide personnel, C-130 MAFFS, helicopters, and other resources (Cooperative Efforts page)."}, {"n": 4, "q": "A fire starts on BLM land near the SRA boundary, and a CAL FIRE engine is closest. Which agreement covers the closest-forces response, and which five agencies are in it?", "a": "The CFMA, a closest-forces exchange with USFS, BLM, NPS, BIA, and FWS. It's CAL FIRE's largest cooperative program (Cooperative Efforts page).", "qh": "A fire starts on BLM land near the SRA boundary, and a CAL FIRE engine is closest. Which agreement covers the closest-forces response, and which five agencies are in it?", "ah": "The CFMA, a closest-forces exchange with USFS, BLM, NPS, BIA, and FWS. It's CAL FIRE's largest cooperative program (Cooperative Efforts page)."}, {"n": 5, "q": "After a major earthquake (no fire), can Cal OES request CAL FIRE crews? What has to happen first?", "a": "Yes, once the Governor has declared a State of Emergency. Then Cal OES can request CAL FIRE assistance on non-fire emergencies (Cooperative Efforts page).", "qh": "After a major earthquake (no fire), can Cal OES request CAL FIRE crews? What has to happen first?", "ah": "Yes, once the Governor has declared a State of Emergency. Then Cal OES can request CAL FIRE assistance on non-fire emergencies (Cooperative Efforts page)."}, {"n": 6, "q": "Over a large incident, who coordinates the aircraft with the incident commander, and from what platform? What else can that platform do?", "a": "The Air Attack Officer, a fire officer flying in the OV-10, who coordinates with the incident commander and directs retardant and water drops. With the right staffing, the OV-10 can also act as an Aerial Supervision Module leading airtankers (OV-10 page).", "qh": "Over a large incident, who coordinates the aircraft with the incident commander, and from what platform? What else can that platform do?", "ah": "The Air Attack Officer, a fire officer flying in the OV-10, who coordinates with the incident commander and directs retardant and water drops. With the right staffing, the OV-10 can also act as an Aerial Supervision Module leading airtankers (OV-10 page)."}, {"n": 7, "q": "Name the four FEMA ICS/NIMS courses required for FFI hiring and what each covers.", "a": "IS-100 Introduction to the Incident Command System; IS-200 Basic ICS for Initial Response; IS-700 Introduction to NIMS; IS-800 National Response Framework, An Introduction (JC-533177).", "qh": "Name the four FEMA ICS/NIMS courses required for FFI hiring and what each covers.", "ah": "IS-100 Introduction to the Incident Command System; IS-200 Basic ICS for Initial Response; IS-700 Introduction to NIMS; IS-800 National Response Framework, An Introduction (JC-533177)."}, {"n": 8, "q": "CAL FIRE's initial-attack aviation goal is \"95% at 10 acres or less.\" Why do arrival time and fire size go together in that goal?", "a": "The page pairs reaching even remote areas in about 20 minutes with keeping 95% of fires at 10 acres or less. Fast initial attack is how CAL FIRE aims to keep fires small (What We Do page).", "qh": "CAL FIRE's initial-attack aviation goal is \"95% at 10 acres or less.\" Why do arrival time and fire size go together in that goal?", "ah": "The page pairs reaching even remote areas in about 20 minutes with keeping 95% of fires at 10 acres or less. Fast initial attack is how CAL FIRE aims to keep fires small (What We Do page)."}, {"n": 9, "q": "Give five prevention activities CAL FIRE uses to reduce wildfire before it starts.", "a": "Any five of: brush clearance, prescribed fire, defensible space inspections, emergency evacuation planning, fire prevention education, fire hazard severity mapping, fire-related law enforcement, and vegetation management (Our Organization page).", "qh": "Give five prevention activities CAL FIRE uses to reduce wildfire before it starts.", "ah": "Any five of: brush clearance, prescribed fire, defensible space inspections, emergency evacuation planning, fire prevention education, fire hazard severity mapping, fire-related law enforcement, and vegetation management (Our Organization page)."}, {"n": 10, "q": "What do CAL FIRE hand crews do when they're not on an emergency?", "a": "Hazardous-fuels reduction and prescribed-fire project work (Cooperative Efforts page).", "qh": "What do CAL FIRE hand crews do when they're not on an emergency?", "ah": "Hazardous-fuels reduction and prescribed-fire project work (Cooperative Efforts page)."}], "sources": [{"label": "CAL FIRE Fire Protection", "url": "https://www.fire.ca.gov/what-we-do/fire-protection"}, {"label": "CAL FIRE What We Do", "url": "https://www.fire.ca.gov/what-we-do"}, {"label": "CAL FIRE Our Organization", "url": "https://www.fire.ca.gov/about/our-organization"}, {"label": "CAL FIRE Cooperative Efforts", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/cooperative-efforts/"}, {"label": "CAL FIRE OV-10 page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program/cal-fire-ov10"}, {"label": "CAL FIRE King Air page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program/cal-fire-king-air"}, {"label": "Anale Burlew profile", "url": "https://www.fire.ca.gov/about/executive-staff/profile-list/anale-burlew"}, {"label": "Joe Tyler profile", "url": "https://www.fire.ca.gov/about/executive-staff/profile-list/joe-tyler"}, {"label": "Fire Captain exam bulletin EX-5398", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=5398"}, {"label": "Firefighter I posting JC-533177", "url": "https://calcareers.ca.gov/CalHrPublic/Jobs/JobPosting.aspx?JobControlId=533177"}, {"label": "Ready for Wildfire, Defensible Space", "url": "https://www.readyforwildfire.org/prepare-for-wildfire/defensible-space/"}, {"label": "2026-27 Governor's Budget Summary, Natural Resources", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}, {"label": "Ranger batches: /workspace/can-report/calfire/calfire-batch-01.md, calfire-batch-02.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 8. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 09.4 Incident Command System (NIMS/ICS) (CAL FIRE incident roles and mutual aid), 10.6.4 Programs and Contract Counties.", "note_html": "Study aid only. Source: CAL FIRE Fire Protection, What We Do, Our Organization, and Cooperative Efforts pages; aviation type pages; executive profiles; the 2026-27 Governor's Budget (Ranger calfire-batch-01, -02). Ranger found <strong>no single official CAL FIRE ICS role catalog<\/strong>, so the ICS items here are official fragments."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1425.81, "y": 694.95, "angle": 98.5, "vx": 758.37, "vy": 1211.26, "vangle": 205.0}, "10.6.9": {"id": "10.6.9", "name": "Aviation Program (Aircraft and Bases)", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.6.3"], "doc": {"title": "10.6.9 Aviation Program (Aircraft and Bases)", "file": "10.6.9_Aviation_Program_Aircraft_and_Bases.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>\"The CAL FIRE Aviation Program operates the world's largest aerial firefighting fleet.\" It aims to reach the most remote SRA fires in <strong>about 20 minutes<\/strong> and keep <strong>95% of fires at 10 acres or less<\/strong>. Fleet types: <strong>Grumman S-2T<\/strong> and <strong>C-130H Hercules<\/strong> airtankers, <strong>Sikorsky S-70i FIREHAWK<\/strong> helicopters, <strong>OV-10 Bronco<\/strong> tactical aircraft, <strong>King Air<\/strong> training and intelligence aircraft, and <strong>Bell UH-1H Super Hueys<\/strong>. The program is also integrating uncrewed aerial systems (UAS).<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<p><strong>Official counts, side by side (basis as Ranger tagged it):<\/strong><\/p><ul><li><strong>Aircraft:<\/strong><ul><li>over 70 (unclear; Aviation Program page)<\/li><li>over 60 (unclear; Fire Protection page)<\/li><\/ul><\/li><li><strong>Air tanker bases:<\/strong><ul><li>1 (unclear; Aviation Program page and 2026-27 Budget \"operates\")<\/li><li>14 (unclear; Fire Protection page)<\/li><\/ul><\/li><li><strong>Air attack bases:<\/strong><ul><li>13 (active; Aviation Program page and Budget)<\/li><li>16 (active; Facilities Public View, which includes county and federal sites)<\/li><\/ul><\/li><li><strong>Helitack bases:<\/strong><ul><li>11 (active; Aviation Program page and Budget)<\/li><li>10 CAL FIRE + 1 CAL FIRE/San Diego County Sheriff (active; Fire Protection page, different labeling)<\/li><li>17 (active; Facilities Public View, which includes county and contract sites)<\/li><\/ul><\/li><\/ul><p><strong>Aircraft (type pages):<\/strong><\/p><ul><li><strong>S-2T airtanker:<\/strong><ul><li>1 pilot, 1,200 gal of long-term retardant.<\/li><li>270 mph max, 4.5 hr endurance.<\/li><li>Two Garrett TPE331 turbines.<\/li><li>Initial-attack retardant delivery.<\/li><\/ul><\/li><li><strong>C-130H Hercules:<\/strong><ul><li>3 crew (pilot, co-pilot, flight engineer), 4,000 gal of retardant.<\/li><li>368 mph max, 8 hr endurance.<\/li><li>The first entered service at McClellan on 26 Aug 2024. Assigned to McClellan and Fresno Air Tanker Bases.<\/li><\/ul><\/li><li><strong>OV-10 Bronco:<\/strong><ul><li>The primary <strong>command-and-control<\/strong> platform.<\/li><li>Crew is a pilot plus an observer (Chief Officer or Fire Captain) serving as <strong>Air Attack Officer<\/strong>.<\/li><li>Can act as an <strong>Aerial Supervision Module<\/strong>.<\/li><\/ul><\/li><li><strong>S-70i FIREHAWK:<\/strong><ul><li>Night-capable, with a 1,000-gal water tank, about 2.5 hr fuel, and external rescue hoists.<\/li><li>Missions: rapid initial attack and complex rescue.<\/li><li>Funding for 12 was secured in 2018, with 4 more approved in FY 2022-23.<\/li><\/ul><\/li><li><strong>UH-1H Super Huey:<\/strong><ul><li>Missions: initial attack, rescue, helitack crew, firing operations (Helitorch or Plastic Spherical Dispenser), cargo, mapping, and medevac.<\/li><li>Payload: 324-gal bucket or 360-gal fixed tank.<\/li><li>Crew: one pilot, two Helitack Captains, and eight personnel.<\/li><\/ul><\/li><li><strong>King Air 200:<\/strong><ul><li><strong>Intel 641<\/strong> aerial intelligence and mapping, collecting more than 290,000 acres/hour.<\/li><li>Also the <strong>ATGS<\/strong> training platform.<\/li><li>In operational service since 2010.<\/li><\/ul><\/li><\/ul><p><strong>Ramona (Governor, 4 Jun 2026):<\/strong><\/p><ul><li>The <strong>fourth C-130H<\/strong> entered active service, \"the fourth aircraft out of a planned statewide fleet of seven.\"<\/li><li><strong>California's 11th Helitack base<\/strong> opened at Ramona.<\/li><li>Ramona is \"the oldest air attack base in the department's system\" and will expand its permanent fleet to five aircraft.<\/li><\/ul><p><strong>2026-27 Budget:<\/strong> $123.9 million one-time and $61.4 million ongoing General Fund, plus 51 positions. It supports <strong>seven C-130s<\/strong>, extends S-2T life, and buys <strong>four more S-70i<\/strong> so flight operations continue when frontline helicopters are in maintenance.<\/p><p><strong>Aviation Management Unit:<\/strong> 5500 Price Avenue, McClellan.<\/p>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Retardant:<\/strong> S-2Ts fly fast initial attack from air attack bases, and C-130Hs carry larger loads from tanker bases.<\/li><li><strong>In the air:<\/strong> the OV-10's Air Attack Officer coordinates with the incident commander, runs all aerial resources, and directs drops.<\/li><li><strong>Helitack:<\/strong> S-70i and UH-1H helicopters insert helitack crews, drop water, and perform rescues. The S-70i is night-capable.<\/li><li><strong>Intelligence:<\/strong> the King Air (Intel 641) maps fire perimeters from the air.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li><strong>S-2T:<\/strong> in 1996 CAL FIRE acquired 26 S-2E/G planes through FEPP. Marsh Aviation converted them, and the final three S-2Ts were delivered in 2005. That's acquisition history, not a current inventory.<\/li><li><strong>OV-10:<\/strong> in 1993, 15 OV-10As were acquired through FEPP, replacing Cessna O-2As. In 2009, three OV-10Ds were acquired, and one has been converted.<\/li><li><strong>UH-1:<\/strong> in 1981, 12 UH-1Fs were acquired through FEPP. In 1990 they were replaced by modified UH-1H \"Super Hueys.\"<\/li><li><strong>C-130H:<\/strong> in July 2018 California got approval to acquire seven C-130Hs. The NDAA (Dec 2023) authorized transfer from the U.S. Coast Guard.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "A fast-moving fire needs the biggest retardant load available from a tanker base. Which airtanker fits better, an S-2T or a C-130H? Compare crew and payload.", "a": "The C-130H: a 3-person crew (pilot, co-pilot, flight engineer) and 4,000 gal of long-term retardant, versus the S-2T's single pilot and 1,200 gal (type pages).", "qh": "A fast-moving fire needs the biggest retardant load available from a tanker base. Which airtanker fits better, an S-2T or a C-130H? Compare crew and payload.", "ah": "The C-130H: a 3-person crew (pilot, co-pilot, flight engineer) and 4,000 gal of long-term retardant, versus the S-2T's single pilot and 1,200 gal (type pages)."}, {"n": 2, "q": "A hiker is injured on a ridge at night. Which CAL FIRE helicopter type is described as night-capable with external rescue hoists?", "a": "The S-70i FIREHAWK. It's night-capable, has external hoists for rescue, and its primary mission includes complex rescue (S-70i page).", "qh": "A hiker is injured on a ridge at night. Which CAL FIRE helicopter type is described as night-capable with external rescue hoists?", "ah": "The S-70i FIREHAWK. It's night-capable, has external hoists for rescue, and its primary mission includes complex rescue (S-70i page)."}, {"n": 3, "q": "An IC wants to run a firing operation from the air with a Helitorch or Plastic Spherical Dispenser. Which helicopter's type page lists that mission?", "a": "The UH-1H Super Huey. Its mission list includes firing operations with a Helitorch or Plastic Spherical Dispenser (UH-1H page).", "qh": "An IC wants to run a firing operation from the air with a Helitorch or Plastic Spherical Dispenser. Which helicopter's type page lists that mission?", "ah": "The UH-1H Super Huey. Its mission list includes firing operations with a Helitorch or Plastic Spherical Dispenser (UH-1H page)."}, {"n": 4, "q": "Who in the air coordinates directly with the incident commander and directs drops? In which aircraft, and what extra lead role can that aircraft take on?", "a": "The Air Attack Officer, a fire officer, flying in the OV-10. With the right staffing, the OV-10 can also fill the Aerial Supervision Module role, leading airtankers on drop runs (OV-10 page).", "qh": "Who in the air coordinates directly with the incident commander and directs drops? In which aircraft, and what extra lead role can that aircraft take on?", "ah": "The Air Attack Officer, a fire officer, flying in the OV-10. With the right staffing, the OV-10 can also fill the Aerial Supervision Module role, leading airtankers on drop runs (OV-10 page)."}, {"n": 5, "q": "What is \"Intel 641,\" what does it collect, and what training role does the same aircraft type fill?", "a": "The King Air 200 aerial intelligence and mapping platform, collecting more than 290,000 acres per hour. The King Air is also the Air Tactical Group Supervisor (ATGS) training platform (King Air page).", "qh": "What is \"Intel 641,\" what does it collect, and what training role does the same aircraft type fill?", "ah": "The King Air 200 aerial intelligence and mapping platform, collecting more than 290,000 acres per hour. The King Air is also the Air Tactical Group Supervisor (ATGS) training platform (King Air page)."}, {"n": 6, "q": "What happened at Ramona in June 2026, and why does the Governor's release call Ramona notable?", "a": "The fourth C-130H entered active service, and California's 11th Helitack base opened, both at Ramona Airport. The release calls Ramona the department's oldest air attack base, which will grow its permanent fleet to five aircraft (Governor, 4 Jun 2026).", "qh": "What happened at Ramona in June 2026, and why does the Governor's release call Ramona notable?", "ah": "The fourth C-130H entered active service, and California's 11th Helitack base opened, both at Ramona Airport. The release calls Ramona the department's oldest air attack base, which will grow its permanent fleet to five aircraft (Governor, 4 Jun 2026)."}, {"n": 7, "q": "A student says, \"The Aviation Program page says 13 air attack bases, but the facilities inventory shows 16. One must be wrong.\" How do you answer?", "a": "Both are official and both are tagged active, but they measure different scopes. The 13 is the program count (Aviation Program page and Budget). The 16 is Active TYPE=AAB rows in the Facilities inventory, which includes county, federal, and local-funded sites such as Fullerton, Pacoima, and Fresno (federal). Report both, because no official crosswalk exists (batch 02).", "qh": "A student says, \"The Aviation Program page says 13 air attack bases, but the facilities inventory shows 16. One must be wrong.\" How do you answer?", "ah": "Both are official and both are tagged active, but they measure different scopes. The 13 is the program count (Aviation Program page and Budget). The 16 is Active TYPE=AAB rows in the Facilities inventory, which includes county, federal, and local-funded sites such as Fullerton, Pacoima, and Fresno (federal). Report both, because no official crosswalk exists (batch 02)."}, {"n": 8, "q": "The 2026-27 Budget funds four more S-70i helicopters. What gap are they meant to fill?", "a": "Aircraft availability, so flight operations continue during critical fire weather when frontline helicopters are due for maintenance (2026-27 Budget).", "qh": "The 2026-27 Budget funds four more S-70i helicopters. What gap are they meant to fill?", "ah": "Aircraft availability, so flight operations continue during critical fire weather when frontline helicopters are due for maintenance (2026-27 Budget)."}, {"n": 9, "q": "What two numbers make up CAL FIRE's aviation response goal, and which page states them?", "a": "Reach remote SRA fires in about 20 minutes, and keep 95% of fires at 10 acres or less (Aviation Program page).", "qh": "What two numbers make up CAL FIRE's aviation response goal, and which page states them?", "ah": "Reach remote SRA fires in about 20 minutes, and keep 95% of fires at 10 acres or less (Aviation Program page)."}], "sources": [{"label": "CAL FIRE Aviation Program", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program"}, {"label": "CAL FIRE Fire Protection", "url": "https://www.fire.ca.gov/what-we-do/fire-protection"}, {"label": "S-2T type page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program/cal-fire-s2t"}, {"label": "C-130H type page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program/cal-fire-c-130"}, {"label": "OV-10 type page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program/cal-fire-ov10"}, {"label": "S-70i type page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program/cal-fire-s-70"}, {"label": "UH-1H type page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program/cal-fire-uh-1h"}, {"label": "King Air type page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program/cal-fire-king-air"}, {"label": "Governor's release, fourth C-130H and new helitack base (4 Jun 2026)", "url": "https://www.gov.ca.gov/2026/06/04/governor-newsom-announces-expansion-of-the-worlds-largest-civilian-aerial-firefighting-fleet-deployment-of-fourth-c-130-h-airtanker-and-new-helitack-base/"}, {"label": "2026-27 Governor's Budget Summary, Natural Resources", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}, {"label": "CAL FIRE Facilities for Wildland Fire Protection, Public View", "url": "https://services1.arcgis.com/jUJYIo9tSA7EHvfZ/arcgis/rest/services/CAL_FIRE_Facilities_for_Wildland_Fire_Protection_-_Public_View/FeatureServer"}, {"label": "Ranger batch: /workspace/can-report/calfire/calfire-batch-02.md and calfire-batch-02.json (conflicting_counts)", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 9. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 10.6.3 Related Classifications (Aviation).", "note_html": "Study aid only. Source: CAL FIRE Aviation Program page and aircraft type pages, the Fire Protection page, the 2026-27 Governor's Budget, a Governor's release (4 Jun 2026), and the Facilities Public View inventory (Ranger calfire-batch-02). <strong>Official fleet and base counts disagree.<\/strong> They're shown side by side below with Ranger's basis tags. Don't pick one."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1398.67, "y": 686.65, "angle": 115.5, "vx": 752.01, "vy": 1238.81, "vangle": 181.0}, "10.6.10": {"id": "10.6.10", "name": "Engines, Dozers, and Mobile Equipment", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.6.3"], "doc": {"title": "10.6.10 Engines, Dozers, and Mobile Equipment", "file": "10.6.10_Engines_Dozers_and_Mobile_Equipment.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>CAL FIRE's <strong>Mobile Equipment Program<\/strong> handles everything on wheels and tracks. The fleet includes fire engines, bulldozers, crew-carrying vehicles, administrative vehicles, mobile kitchen units (MKUs), mobile communications units, trailers, forklifts, construction equipment, ATVs, snowmobiles, and insect-control vehicles. The <strong>Mobile Equipment Facility in Davis<\/strong> designs, acquires, maintains, repairs, replaces, and disposes of CAL FIRE vehicles.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Engine models (linked spec sheets):<\/strong> Model 14-15, Model 24, Model 25, and Model 34 &amp; 35.<\/li><li><strong>Pumps:<\/strong> \"two-stage, 500 GPM, PTO operated fire pumps with 180 GPM diesel powered auxiliary pumps,\" built to NFPA guidelines. Engines now have fully enclosed, air-conditioned cabs.<\/li><li><strong>Emergency Crew Transports (ECTs):<\/strong> 17-passenger, code 3 equipped, fully air conditioned.<\/li><li><strong>MKUs:<\/strong> 1,000-meal capacity. <strong>Mobile Communication Centers (MCCs)<\/strong> support incidents.<\/li><li><strong>Dozers:<\/strong> later-model Caterpillar <strong>D6XL and D6M<\/strong> high-track dozers with enclosed, air-conditioned cabs.<\/li><li><strong>Year-round engines (2026-27 Budget):<\/strong> $32.6 million and 131 positions added <strong>13 more year-round engines<\/strong>. That \"expanded the fleet to a total of 356 engines\" and raised to <strong>65<\/strong> the engines resourced for baseline year-round staffing.<\/li><li><strong>Surge equipment:<\/strong> $35.8 million one-time plus $5.8 million ongoing to buy <strong>42 fire engines and 10 bulldozers<\/strong>. Since 2023, surge units have been staffed during elevated fire weather or to cover other engines on extended assignments.<\/li><\/ul><p><strong>Fleet counts, side by side (basis as Ranger tagged it):<\/strong><\/p><ul><li><strong>Vehicles:<\/strong><ul><li>over 3,000 (unclear; Mobile Equipment page opening)<\/li><li>over 2,800 (unclear; same page, \"current fleet\" paragraph)<\/li><\/ul><\/li><li><strong>Engines:<\/strong><ul><li>383 front-line in 12 models (unclear; Mobile Equipment \"current fleet\" paragraph)<\/li><li>356 (unclear; 2026-27 Budget)<\/li><li>84 (unclear; state-funded in the six Contract Counties, a different scope)<\/li><\/ul><\/li><li><strong>Bulldozers:<\/strong><ul><li>58 (active; Mobile Equipment \"current fleet\" paragraph)<\/li><li>12 (unclear; Contract Counties, a different scope)<\/li><li>10 (unclear; Budget surge purchase, a different scope)<\/li><\/ul><\/li><li><strong>Crew buses:<\/strong> 237 (same \"current fleet\" paragraph).<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Year-round engines<\/strong> cover the \"year-round fire season,\" addressing \"the need for additional resources earlier and later in the calendar year\" (Budget).<\/li><li><strong>Surge engines and dozers<\/strong> add capacity on elevated-fire-weather days, or backfill when other engines are out on extended assignments.<\/li><li><strong>Dozers<\/strong> are run by Heavy Fire Equipment Operators (class 6387, see 10.6.3).<\/li><li><strong>ECTs<\/strong> move hand crews. <strong>MKUs<\/strong> feed large incidents.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li>ECTs evolved from 13-passenger crew-carrying vehicles in the 1970s (Mobile Equipment page).<\/li><li>The dozer fleet moved up from Caterpillar D6C dozers built in the 1960s (Mobile Equipment page).<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Describe the standard CAL FIRE engine fire pump as published, including its auxiliary pump.", "a": "Two-stage, 500 GPM, PTO-operated fire pumps with 180 GPM diesel-powered auxiliary pumps, built to NFPA guidelines (Mobile Equipment page).", "qh": "Describe the standard CAL FIRE engine fire pump as published, including its auxiliary pump.", "ah": "Two-stage, 500 GPM, PTO-operated fire pumps with 180 GPM diesel-powered auxiliary pumps, built to NFPA guidelines (Mobile Equipment page)."}, {"n": 2, "q": "Red Flag conditions are forecast and two of your unit's engines are out on a long assignment. What Budget-funded equipment exists for this, and how has it been used since 2023?", "a": "Surge equipment: 42 fire engines and 10 bulldozers bought with $35.8 million one-time and $5.8 million ongoing. Since 2023 they've been staffed during elevated fire weather or to cover other engines on extended assignments (2026-27 Budget).", "qh": "Red Flag conditions are forecast and two of your unit's engines are out on a long assignment. What Budget-funded equipment exists for this, and how has it been used since 2023?", "ah": "Surge equipment: 42 fire engines and 10 bulldozers bought with $35.8 million one-time and $5.8 million ongoing. Since 2023 they've been staffed during elevated fire weather or to cover other engines on extended assignments (2026-27 Budget)."}, {"n": 3, "q": "Today 65 engines are resourced for baseline year-round staffing. What does the Budget say that number becomes, and what has to happen first?", "a": "With full 66-hour workweek implementation, engines staffed during the base period increase from 65 to 153. The 153 is a planned figure tied to full implementation (2026-27 Budget; see 10.6.12).", "qh": "Today 65 engines are resourced for baseline year-round staffing. What does the Budget say that number becomes, and what has to happen first?", "ah": "With full 66-hour workweek implementation, engines staffed during the base period increase from 65 to 153. The 153 is a planned figure tied to full implementation (2026-27 Budget; see 10.6.12)."}, {"n": 4, "q": "A classmate writes \"CAL FIRE has 383 engines\" on a flashcard. What's wrong with presenting that as the single answer?", "a": "The 383 figure is from one paragraph of the Mobile Equipment page. The 2026-27 Budget says 356, and the Contract Counties page cites 84 state-funded engines (a different scope). Ranger tags the engine figures unclear, so show them side by side with sources.", "qh": "A classmate writes \"CAL FIRE has 383 engines\" on a flashcard. What's wrong with presenting that as the single answer?", "ah": "The 383 figure is from one paragraph of the Mobile Equipment page. The 2026-27 Budget says 356, and the Contract Counties page cites 84 state-funded engines (a different scope). Ranger tags the engine figures unclear, so show them side by side with sources."}, {"n": 5, "q": "What does the Mobile Equipment Facility in Davis do?", "a": "It designs, acquires, maintains, repairs, replaces, and disposes of CAL FIRE vehicles (Mobile Equipment page and Fire Protection page).", "qh": "What does the Mobile Equipment Facility in Davis do?", "ah": "It designs, acquires, maintains, repairs, replaces, and disposes of CAL FIRE vehicles (Mobile Equipment page and Fire Protection page)."}, {"n": 6, "q": "What is an ECT, and how is it equipped?", "a": "An Emergency Crew Transport: a 17-passenger, code 3 equipped, fully air-conditioned crew vehicle (Mobile Equipment page).", "qh": "What is an ECT, and how is it equipped?", "ah": "An Emergency Crew Transport: a 17-passenger, code 3 equipped, fully air-conditioned crew vehicle (Mobile Equipment page)."}, {"n": 7, "q": "Which dozer models does the Mobile Equipment page describe as the later-model fleet, and what operator class runs dozers?", "a": "Caterpillar D6XL and D6M high-track dozers with enclosed cabs (Mobile Equipment page). Heavy Fire Equipment Operator (6387) is the operator class (pay scale).", "qh": "Which dozer models does the Mobile Equipment page describe as the later-model fleet, and what operator class runs dozers?", "ah": "Caterpillar D6XL and D6M high-track dozers with enclosed cabs (Mobile Equipment page). Heavy Fire Equipment Operator (6387) is the operator class (pay scale)."}, {"n": 8, "q": "You're tallying statewide dozers and plan to add the Contract Counties' 12 and the surge 10 to the 58. Why is that a bad idea?", "a": "They're different scopes. The 12 are state-funded dozers in the six Contract Counties, and the 10 are a Budget surge purchase. The 58 comes from the Mobile Equipment fleet paragraph. Adding them could double-count, so report each with its source.", "qh": "You're tallying statewide dozers and plan to add the Contract Counties' 12 and the surge 10 to the 58. Why is that a bad idea?", "ah": "They're different scopes. The 12 are state-funded dozers in the six Contract Counties, and the 10 are a Budget surge purchase. The 58 comes from the Mobile Equipment fleet paragraph. Adding them could double-count, so report each with its source."}, {"n": 9, "q": "What did the 2026-27 \"Additional Engines with Year-Round Staffing\" item buy, and what total engine figure does the Budget give?", "a": "13 additional year-round engines ($32.6 million and 131 positions ongoing). The Budget says this expanded the fleet to 356 engines and raised baseline year-round staffing to 65 engines.", "qh": "What did the 2026-27 \"Additional Engines with Year-Round Staffing\" item buy, and what total engine figure does the Budget give?", "ah": "13 additional year-round engines ($32.6 million and 131 positions ongoing). The Budget says this expanded the fleet to 356 engines and raised baseline year-round staffing to 65 engines."}], "sources": [{"label": "CAL FIRE Mobile Equipment", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/mobile-equipment"}, {"label": "CAL FIRE Fire Protection", "url": "https://www.fire.ca.gov/what-we-do/fire-protection"}, {"label": "CAL FIRE What We Do", "url": "https://www.fire.ca.gov/what-we-do"}, {"label": "CAL FIRE Cooperative Efforts (Contract County equipment)", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/cooperative-efforts/"}, {"label": "2026-27 Governor's Budget Summary, Natural Resources", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}, {"label": "CalHR Civil Service Pay Scale (HFEO 6387)", "url": "https://www.calhr.ca.gov/wp-content/uploads/sites/361/2026/09/PS_Sec_15.pdf"}, {"label": "Ranger batch: /workspace/can-report/calfire/calfire-batch-02.md and calfire-batch-02.json (conflicting_counts)", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 10. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 10.6.3 Related Classifications (Heavy Equipment).", "note_html": "Study aid only. Source: CAL FIRE Mobile Equipment page, the 2026-27 Governor's Budget, and the Cooperative Efforts page (Ranger calfire-batch-02). The engine and dozer spec PDFs weren't retrieved. <strong>Fleet counts disagree across official pages.<\/strong> They're shown side by side with Ranger's basis tags."}, "hasContent": true, "counts": [{"label": "Engines staffed in the base period", "active": {"value": "65", "source": {"label": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}}, "planned": {"value": "153", "basis": "full 66-hour workweek implementation", "source": {"label": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}}}], "disagreements": [], "datasets": [], "x": 1429.31, "y": 638.55, "angle": 105.5, "vx": 859.45, "vy": 1233.4, "vangle": 350.5}, "10.6.11": {"id": "10.6.11", "name": "Hand Crews, Conservation Camps, and Fire Centers", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.6.4"], "doc": {"title": "10.6.11 Hand Crews, Conservation Camps, and Fire Centers", "file": "10.6.11_Hand_Crews_Conservation_Camps_and_Fire_Centers.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>The <strong>Hand Crew Program<\/strong> runs CAL FIRE Firefighter Hand Crews and partners with <strong>CDCR<\/strong> (incarcerated crews), the <strong>California Conservation Corps (CCC)<\/strong>, and the <strong>California Military Department (CMD)<\/strong>. Crews respond to wildfires, floods, search and rescue, and earthquakes. Between emergencies they do hazardous-fuels reduction and prescribed-fire projects. The official facilities inventory lists <strong>conservation camps<\/strong> (CC) and three <strong>fire center<\/strong> types: FCFFC (Firefighter Crews), FCCCC (CCC), and CNA (CMD).<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<p><strong>Official counts, side by side (basis as Ranger tagged it):<\/strong><\/p><ul><li><strong>Hand crews:<\/strong><ul><li>38 CAL FIRE + 75 incarcerated + 19 CCC (including 4 Ventura Training Center) + 14 CMD, \"currently authorized\" (unclear; Cooperative Efforts page)<\/li><li>180 state crews (95 incarcerated, 38 CAL FIRE, 33 CCC, 14 CMD) + 12 contract-county crews, \"as of January 2026\" (active; 2026-27 Budget)<\/li><\/ul><\/li><li><strong>Conservation camps:<\/strong><ul><li>25 (unclear; Budget \"operates\")<\/li><li>31 (active; Facilities Public View, Active TYPE=CC)<\/li><li>Of the 31: 25 are STATE/funding B, 5 are LAC-named camps, and 1 is VNC \"Camp 14.\" The 25-to-25 match is an observer count, not an official legend.<\/li><\/ul><\/li><li><strong>Fire centers:<\/strong><ul><li>31 (unclear; Budget \"operates\")<\/li><li>FCFFC (Firefighter Crews) 20, FCCCC (CCC) 13, CNA (CMD) 10 (active; Facilities Public View type counts). These don't sum to 31 and aren't the same classification.<\/li><\/ul><\/li><\/ul><p><strong>Other specs:<\/strong><\/p><ul><li><strong>Investment (2026-27 Budget):<\/strong> $484.4 million and 2,022 positions across CAL FIRE, CCC, and CMD for non-incarcerated crews. This responds to \"decreases in the number of incarcerated individuals available to staff hand crews.\"<ul><li>Since 2019: <strong>60 new state hand crews<\/strong>, <strong>12 contract-county crews<\/strong>, and <strong>16 state crews converted from seasonal to year-round<\/strong>.<\/li><\/ul><\/li><li><strong>CCC seven-day schedule:<\/strong> $11.7 million and 49 positions (plus 47 corpsmember FTE) for a year-round seven-day operating schedule.<\/li><li><strong>Inactive camps (inventory):<\/strong> Alder CC (temporarily decommissioned). Parlin Fork, Mount Bullion, La Cima, and Norco (decommissioned).<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Who runs a camp:<\/strong> an <strong>Assistant Chief<\/strong> may serve as Division Chief over a conservation camp. Camp ACs liaise with CDCR staff, direct \"workday custody, training, and daily ratings of inmates and wards,\" and plan and evaluate work projects (EX-4883).<\/li><li><strong>Crew supervision:<\/strong> Fire Captains supervise engine companies <strong>and hand crews<\/strong> (EX-5398). BCs may manage camps as a program (Join CAL FIRE).<\/li><li><strong>Background checks:<\/strong> FFII and FAE jobs in camps or supervising incarcerated people need <strong>Live Scan / PREA<\/strong> clearance.<\/li><li><strong>Hand-crew FFI training (Applicant Information Sheet):<\/strong> EMS <strong>and<\/strong> Confined Space Awareness <strong>and<\/strong> FEMA IS-100/200/700/800 <strong>and<\/strong> CAL FIRE 1B <strong>and<\/strong> 1C.<\/li><li><strong>Chainsaw:<\/strong> CAL FIRE Chainsaw Operations (C-212) is an Acceptable Documents item.<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Hand-crew FFIs need <strong>Confined Space Awareness<\/strong>, which engine FFIs don't (Applicant Information Sheet).<\/li><li>Chainsaw Operations (C-212) carries \"qualification cards and refresher training\" (Acceptable Documents).<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li>In WWII, \"honor camp\" inmate crews led to a 1945 Youth Honor Camp system with the California Youth Authority. The program later extended to the Department of Corrections' adult population, and honor camps were \"later renamed conservation camps\" (Our Organization page).<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Why has California spent heavily since 2019 on non-incarcerated hand crews? Name the three changes the Budget lists.", "a": "Fewer incarcerated individuals are available to staff hand crews. Since 2019 the state has added 60 new state hand crews and 12 contract-county crews, and converted 16 seasonal state crews to year-round ($484.4 million, 2,022 positions; 2026-27 Budget).", "qh": "Why has California spent heavily since 2019 on non-incarcerated hand crews? Name the three changes the Budget lists.", "ah": "Fewer incarcerated individuals are available to staff hand crews. Since 2019 the state has added 60 new state hand crews and 12 contract-county crews, and converted 16 seasonal state crews to year-round ($484.4 million, 2,022 positions; 2026-27 Budget)."}, {"n": 2, "q": "One source says 75 incarcerated crews and another says 95. Show how to present this correctly, and explain why both can appear on official pages.", "a": "Show both with labels and sources. 75 incarcerated is the \"currently authorized\" figure (Cooperative Efforts page, tagged unclear). 95 is \"as of January 2026\" (2026-27 Budget, tagged active). They use different wording (\"authorized\" vs a date-stamped count), so Ranger says don't blend them.", "qh": "One source says 75 incarcerated crews and another says 95. Show how to present this correctly, and explain why both can appear on official pages.", "ah": "Show both with labels and sources. 75 incarcerated is the \"currently authorized\" figure (Cooperative Efforts page, tagged unclear). 95 is \"as of January 2026\" (2026-27 Budget, tagged active). They use different wording (\"authorized\" vs a date-stamped count), so Ranger says don't blend them."}, {"n": 3, "q": "You're told to report to a \"fire center.\" What three Facilities types exist, and which partner's crews does each serve?", "a": "FCFFC is Fire Center for Firefighter Crews (CAL FIRE). FCCCC is Fire Center for CCC crews. CNA is Fire Center for CMD crews (Facilities Public View type codes).", "qh": "You're told to report to a \"fire center.\" What three Facilities types exist, and which partner's crews does each serve?", "ah": "FCFFC is Fire Center for Firefighter Crews (CAL FIRE). FCCCC is Fire Center for CCC crews. CNA is Fire Center for CMD crews (Facilities Public View type codes)."}, {"n": 4, "q": "The Budget says CAL FIRE operates 25 conservation camps, but the inventory shows 31 Active camps. What explains the gap, and what's the right way to cite it?", "a": "The inventory's 31 Active TYPE=CC rows include 5 LAC-named camps and 1 VNC \"Camp 14\" alongside 25 STATE/funding-B camps. The Budget's 25 happens to match that group, but that's an observer count, not an official legend. Cite both: 25 (Budget, unclear) and 31 (inventory, active).", "qh": "The Budget says CAL FIRE operates 25 conservation camps, but the inventory shows 31 Active camps. What explains the gap, and what's the right way to cite it?", "ah": "The inventory's 31 Active TYPE=CC rows include 5 LAC-named camps and 1 VNC \"Camp 14\" alongside 25 STATE/funding-B camps. The Budget's 25 happens to match that group, but that's an observer count, not an official legend. Cite both: 25 (Budget, unclear) and 31 (inventory, active)."}, {"n": 5, "q": "You're promoted to Assistant Chief and assigned to a conservation camp. What are your camp-specific duties?", "a": "Liaise with CDCR staff. Direct workday custody, training, and daily ratings of inmates and wards. Plan and evaluate work projects (EX-4883).", "qh": "You're promoted to Assistant Chief and assigned to a conservation camp. What are your camp-specific duties?", "ah": "Liaise with CDCR staff. Direct workday custody, training, and daily ratings of inmates and wards. Plan and evaluate work projects (EX-4883)."}, {"n": 6, "q": "An FAE is offered a position supervising incarcerated crews. What extra clearance applies?", "a": "Live Scan / PREA background clearance for camp or incarcerated-supervision positions (EX-4473 FAE bulletin).", "qh": "An FAE is offered a position supervising incarcerated crews. What extra clearance applies?", "ah": "Live Scan / PREA background clearance for camp or incarcerated-supervision positions (EX-4473 FAE bulletin)."}, {"n": 7, "q": "An FFI applicant wants a hand-crew job. List the required trainings and compare them with an engine job.", "a": "Hand crew: EMS (CPR/AED and PSFA, or EMT, or Paramedic), Confined Space Awareness, FEMA IS-100/200/700/800, and CAL FIRE 1B and 1C. Engine jobs need EMS and FEMA plus either an SFT FFI certificate or CAL FIRE 1A/B/C. They don't list Confined Space Awareness separately (Applicant Information Sheet).", "qh": "An FFI applicant wants a hand-crew job. List the required trainings and compare them with an engine job.", "ah": "Hand crew: EMS (CPR/AED and PSFA, or EMT, or Paramedic), Confined Space Awareness, FEMA IS-100/200/700/800, and CAL FIRE 1B and 1C. Engine jobs need EMS and FEMA plus either an SFT FFI certificate or CAL FIRE 1A/B/C. They don't list Confined Space Awareness separately (Applicant Information Sheet)."}, {"n": 8, "q": "What do hand crews do between emergencies?", "a": "Hazardous-fuels reduction and prescribed-fire project work (Cooperative Efforts page).", "qh": "What do hand crews do between emergencies?", "ah": "Hazardous-fuels reduction and prescribed-fire project work (Cooperative Efforts page)."}, {"n": 9, "q": "What scheduling change did the Budget fund for CCC hand crews?", "a": "A seven-day-per-week operating schedule year-round: $11.7 million, 49 positions, and 47 corpsmember FTE (2026-27 Budget).", "qh": "What scheduling change did the Budget fund for CCC hand crews?", "ah": "A seven-day-per-week operating schedule year-round: $11.7 million, 49 positions, and 47 corpsmember FTE (2026-27 Budget)."}], "sources": [{"label": "CAL FIRE Cooperative Efforts (Hand Crew Program)", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/cooperative-efforts/"}, {"label": "2026-27 Governor's Budget Summary, Natural Resources", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}, {"label": "CAL FIRE Facilities for Wildland Fire Protection, Public View", "url": "https://services1.arcgis.com/jUJYIo9tSA7EHvfZ/arcgis/rest/services/CAL_FIRE_Facilities_for_Wildland_Fire_Protection_-_Public_View/FeatureServer"}, {"label": "Facilities dataset page", "url": "https://data.ca.gov/@cal-fire/facilities-for-wildland-fire-protection1"}, {"label": "Assistant Chief exam bulletin EX-4883", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4883"}, {"label": "Fire Captain exam bulletin EX-5398", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=5398"}, {"label": "FAE exam bulletin EX-4473", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4473"}, {"label": "Join CAL FIRE, Battalion Chief", "url": "https://www.joincalfire.com/classifications/fire-protection/firefighting-and-paramedics/battalion-chief"}, {"label": "FFI Applicant Information Sheet", "url": "https://www.fire.ca.gov/-/media/1EAFA2A1528141EE892CB692D4B982E0"}, {"label": "CAL FIRE Acceptable Documents", "url": "https://www.fire.ca.gov/-/media/BF147896DED446F9B142FEF464A0E9AD"}, {"label": "CAL FIRE Our Organization (camp history)", "url": "https://www.fire.ca.gov/about/our-organization"}, {"label": "Ranger batches: /workspace/can-report/calfire/calfire-batch-01.md, calfire-batch-02.md, calfire-batch-03.md, calfire-batch-03-facilities-public-view.csv", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 11. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 10.6.4 Programs and Contract Counties.", "note_html": "Study aid only. Source: CAL FIRE Cooperative Efforts page, the 2026-27 Governor's Budget, the Facilities Public View inventory (queried 17 Nov 2026, layer modified 5 Aug 2026), exam bulletins, and the Acceptable Documents file (Ranger calfire-batch-01, -02, -03). <strong>Crew, camp, and fire-center counts disagree across official sources.<\/strong> They're shown side by side."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1410.99, "y": 627.53, "angle": 136.5, "vx": 857.22, "vy": 1254.66, "vangle": 21.5}, "10.6.12": {"id": "10.6.12", "name": "Peak and Base Staffing (Seasonal, Year-Round, and Workweek)", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.6.5"], "doc": {"title": "10.6.12 Peak and Base Staffing (Seasonal, Year-Round, and Workweek)", "file": "10.6.12_Peak_and_Base_Staffing_Seasonal_Year-Round_and_Workweek.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>CAL FIRE staffs up in <strong>peak<\/strong> fire season and drops to <strong>base<\/strong> staffing the rest of the year. The Budget describes \"a year-round fire season and longer, more severe peak fire seasons.\" The state is moving from a <strong>72-hour<\/strong> to a <strong>66-hour workweek<\/strong>, adding year-round engines and crews, and hiring more engineers to cover it.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>66-hour workweek:<\/strong> $770.4 million ($756.3 million General Fund) and 2,457 positions ongoing, phased in over <strong>five years beginning 2024-25<\/strong>. It reflects the <strong>2022 MOU with CAL FIRE Local 2881 (Bargaining Unit 8)<\/strong>, which committed to cutting the 72-hour workweek to 66 hours <strong>starting 1 Nov 2024<\/strong>.<\/li><li><strong>At full implementation:<\/strong> CAL FIRE will run <strong>peak staffing 9 months a year<\/strong> (previously 4 to 5) and <strong>base staffing 3 months<\/strong>. Engines staffed in the base period go from <strong>65 to 153<\/strong>.<\/li><li><strong>Engineers:<\/strong><ul><li>\"In 2025, CAL FIRE graduated a record 658 new Fire Apparatus Engineers through the Company Officer Academy.\" They begin a three-year apprenticeship toward Captain.<\/li><li>More than 600 more are projected for 2026, part of <strong>more than 1,350 new FAEs<\/strong> funded over the five-year plan.<\/li><\/ul><\/li><li><strong>Three-platoon schedule:<\/strong> \"As staffing levels rise, units across the state are moving to a three-platoon schedule, improving coverage and reducing reliance on extended duty.\"<\/li><li><strong>Relief Staffing:<\/strong> $175.3 million and 576 positions ongoing, including expanded training-center positions and proportional Contract County funding.<\/li><li><strong>Year-round engines:<\/strong> 13 more, for 65 engines resourced for baseline year-round staffing.<\/li><li><strong>Year-round crews:<\/strong> 16 state hand crews converted from seasonal to year-round since 2019. CCC crews moved to a seven-day year-round schedule.<\/li><li><strong>Year-round inspectors:<\/strong> $6.2 million and 31 positions toward the goal of <strong>250,000 annual defensible-space parcel inspections<\/strong> in the SRA.<\/li><li><strong>FFI:<\/strong> still Non-Tenured, Full Time. Annual compensation on JC-533177 is stated as a \"max of 9 months,\" and <strong>EDWC<\/strong> (Extended Duty Week Compensation) is paid every 4 weeks.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Peak vs base:<\/strong> at full implementation, more of the year runs at peak, and more engines stay staffed during the base months.<\/li><li><strong>The hiring push:<\/strong> the Budget puts the FAE graduations, the 1,350+ new FAEs, and the move to three platoons all under the 66-hour workweek item.<\/li><li><strong>For an FFI applicant:<\/strong> the entry job stays seasonal and non-tenured (see 10.6.5), even as engine staffing periods get longer.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "What workweek change is CAL FIRE implementing? From what to what, starting when, and under what agreement?", "a": "From a 72-hour to a 66-hour workweek starting 1 Nov 2024, under the 2022 MOU with CAL FIRE Local 2881 (Bargaining Unit 8) (2026-27 Budget).", "qh": "What workweek change is CAL FIRE implementing? From what to what, starting when, and under what agreement?", "ah": "From a 72-hour to a 66-hour workweek starting 1 Nov 2024, under the 2022 MOU with CAL FIRE Local 2881 (Bargaining Unit 8) (2026-27 Budget)."}, {"n": 2, "q": "Once the 66-hour workweek is fully implemented, how many months a year will CAL FIRE run at peak and at base staffing? How does that compare with before?", "a": "Peak for 9 months a year (previously 4 to 5 months) and base for 3 months (2026-27 Budget).", "qh": "Once the 66-hour workweek is fully implemented, how many months a year will CAL FIRE run at peak and at base staffing? How does that compare with before?", "ah": "Peak for 9 months a year (previously 4 to 5 months) and base for 3 months (2026-27 Budget)."}, {"n": 3, "q": "How many engines are staffed in the base period now, and how many under full implementation? Label each figure correctly.", "a": "65 now (active, baseline after the year-round engine investment). 153 under full 66-hour implementation (planned) (2026-27 Budget).", "qh": "How many engines are staffed in the base period now, and how many under full implementation? Label each figure correctly.", "ah": "65 now (active, baseline after the year-round engine investment). 153 under full 66-hour implementation (planned) (2026-27 Budget)."}, {"n": 4, "q": "Under which Budget item do the record Fire Apparatus Engineer graduations appear, and what are the numbers?", "a": "The 66-hour workweek item. It lists 658 new FAEs graduated through the Company Officer Academy in 2025 (a record), more than 600 more Company Officers projected for 2026, and more than 1,350 new FAEs funded over the five-year plan (2026-27 Budget).", "qh": "Under which Budget item do the record Fire Apparatus Engineer graduations appear, and what are the numbers?", "ah": "The 66-hour workweek item. It lists 658 new FAEs graduated through the Company Officer Academy in 2025 (a record), more than 600 more Company Officers projected for 2026, and more than 1,350 new FAEs funded over the five-year plan (2026-27 Budget)."}, {"n": 5, "q": "What schedule change are units making as staffing rises, and what two benefits does the Budget claim?", "a": "Moving to a three-platoon schedule, which the Budget says improves coverage and reduces reliance on extended duty.", "qh": "What schedule change are units making as staffing rises, and what two benefits does the Budget claim?", "ah": "Moving to a three-platoon schedule, which the Budget says improves coverage and reduces reliance on extended duty."}, {"n": 6, "q": "A seasonal FFI hire asks if the job is permanent now that the fire season is year-round. What does JC-533177 say about job type and pay period?", "a": "No. JC-533177 lists FFI as Non-Tenured, Full Time, with annual compensation figured on a maximum of 9 months.", "qh": "A seasonal FFI hire asks if the job is permanent now that the fire season is year-round. What does JC-533177 say about job type and pay period?", "ah": "No. JC-533177 lists FFI as Non-Tenured, Full Time, with annual compensation figured on a maximum of 9 months."}, {"n": 7, "q": "What's the \"Relief Staffing\" item, and what does it include beyond field positions?", "a": "$175.3 million General Fund and 576 positions ongoing for relief staffing. It includes expanded training-center positions and proportional ongoing Contract County funding (2026-27 Budget).", "qh": "What's the \"Relief Staffing\" item, and what does it include beyond field positions?", "ah": "$175.3 million General Fund and 576 positions ongoing for relief staffing. It includes expanded training-center positions and proportional ongoing Contract County funding (2026-27 Budget)."}, {"n": 8, "q": "Name two year-round conversions besides engines that the Budget describes.", "a": "Any two: 16 state hand crews converted from seasonal to year-round; CCC hand crews moved to a seven-day year-round schedule; added year-round defensible-space inspectors (2026-27 Budget).", "qh": "Name two year-round conversions besides engines that the Budget describes.", "ah": "Any two: 16 state hand crews converted from seasonal to year-round; CCC hand crews moved to a seven-day year-round schedule; added year-round defensible-space inspectors (2026-27 Budget)."}, {"n": 9, "q": "How is the 66-hour workweek fund
