 more suddenly with less warning.<\/li><\/ul><\/li><\/ul>"}, {"key": "how", "title": "How it's used (inspection)", "html": "<p>Inspect <strong>before and after every use<\/strong>. Check for fractured or loose rails and rungs, damaged pawls, worn or missing halyards, worn or misadjusted wire rope (3-section ladders), changed heat-sensor labels, loose or missing fasteners, gouges, and any structural strain. If anything is off, take it out of service and test it.<\/p>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Never tie ladders together to gain length.<\/li><li>Secure the base (heel or tie off) and the tip.<\/li><li>Reposition a raised ladder <strong>only from the base<\/strong>, never from the top.<\/li><li>Use extension ladders <strong>fly-out<\/strong> unless the ladder is designed for fly-in.<\/li><li>Keep ladders away from <strong>electrical lines<\/strong>. The handbook says to keep aluminum, wet wood, and fiberglass ladders from contacting electrical circuits, and never to let any ladder contact any electrical charge.<\/li><li>Keep aluminum ladders away from apparatus exhaust heat. Water sizzling on a ladder means pull it from service.<\/li><li>With stay poles, if one pole can't be set, don't use the other one either.<\/li><li>Why no tying: the side rails are engineered to carry a set load over a set span, and two ladders tied together don't have the rail strength for the longer span.<\/li><li>Why only from the base: sliding or rolling a raised ladder can leave it on bad footing or let the pawls disengage.<\/li><li>Why both stay poles: using only one pole puts a twisting load on the ladder.<\/li><li>On 3-section ladders, the cable that raises the top fly should be moderately taut when the ladder is retracted.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li>Until ALCO-LITE introduced aluminum fire ladders, all fire-service ground ladders were wood. Some departments still use wood today (ALCO-LITE handbook).<\/li><li>NFPA 1931 (ladder design) and NFPA 1932 (use, maintenance, and service testing) have been combined into NFPA 1930.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Fire-service ground ladders use 14-in rung spacing instead of the 12 in on commercial ladders. Why?", "a": "The extra 2 in leave room for a leg lock and boots, and more working room on the ladder.", "qh": "Fire-service ground ladders use 14-in rung spacing instead of the 12 in on commercial ladders. Why?", "ah": "The extra 2 in leave room for a leg lock and boots, and more working room on the ladder.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Room for a leg lock and boots, and more working room on the ladder", "wh": ["Room for a halyard tie and boots, and more working room on the ladder", "Wider spacing sets the 75° climbing angle the load ratings assume", "Wider spacing gives the pawls (dogs) room to lock onto each rung"], "hash": "sha256:0ce9c8dd689364a2440fa76a20bd71d9167a53fa52a51a7d8c85ad7a748edb65"}, {"n": 2, "q": "A 24-ft extension ladder is raised so it touches the building at the 20-ft level. Where should the butt be, and what angle does that give?", "a": "5 ft out from the support point (¼ of the 20-ft working height). That gives the 75° climbing angle the load ratings are based on.", "qh": "A 24-ft extension ladder is raised so it touches the building at the 20-ft level. Where should the butt be, and what angle does that give?", "ah": "5 ft out from the support point (¼ of the 20-ft working height). That gives the 75° climbing angle the load ratings are based on.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Butt 5 ft out (¼ of the 20-ft working height), giving 75°", "wh": ["Butt 6 ft out (¼ of the 24-ft ladder length), giving 75°", "Butt 5 ft out (¼ of the 20-ft working height), giving 60°", "Butt 4 ft out (⅕ of the 20-ft working height), giving 75°"], "hash": "sha256:a05fc7518c73c40ef2276c82927562e7598b3355d1a7824dcab3f7e3d895db68"}, {"n": 3, "q": "A service-tested extension ladder at 75° holds one firefighter, his tools, and a charged 1¾-in line. Which limits apply and what counts toward them? What changes at 60°, or if the ladder was never service tested?", "a": "At about 75° a tested extension ladder is rated 750 lb distributed and 500 lb concentrated. The firefighter, tools, and charged hose all count. At any other angle, or if the ladder isn't service tested, the limit drops to 250 lb, and an untested ladder should be pulled until tested.", "qh": "A service-tested extension ladder at 75° holds one firefighter, his tools, and a charged 1¾-in line. Which limits apply and what counts toward them? What changes at 60°, or if the ladder was never service tested?", "ah": "At about 75° a tested extension ladder is rated 750 lb distributed and 500 lb concentrated. The firefighter, tools, and charged hose all count. At any other angle, or if the ladder isn't service tested, the limit drops to 250 lb, and an untested ladder should be pulled until tested.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "750 lb distributed, 500 lb concentrated, FF plus tools plus charged hose; 250 lb at 60° or untested", "wh": ["750 lb distributed, 500 lb concentrated, the FF's body weight only; 250 lb at 60° or untested", "750 lb distributed, 500 lb concentrated, FF plus tools plus charged hose; 300 lb at 60° or untested", "500 lb distributed, 750 lb concentrated, FF plus tools plus charged hose; 250 lb at 60° or untested"], "hash": "sha256:2651902a19025f1bb35900b1f8d09be6fb06df6037128ed320d3b0a6d5b31e8b"}, {"n": 4, "q": "After a working fire, an aluminum ladder that sat near the building looks perfect, but its heat-sensor label has changed. What do you do, and why can't you trust your eyes?", "a": "Remove it from service until it's service tested. Around 200 °F can permanently weaken heat-treated aluminum, and aluminum doesn't change color when heated. The label (or water sizzling on the ladder) is your only warning.", "qh": "After a working fire, an aluminum ladder that sat near the building looks perfect, but its heat-sensor label has changed. What do you do, and why can't you trust your eyes?", "ah": "Remove it from service until it's service tested. Around 200 °F can permanently weaken heat-treated aluminum, and aluminum doesn't change color when heated. The label (or water sizzling on the ladder) is your only warning.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Pull it until service tested; aluminum weakens near 200 °F with no color change", "wh": ["Pull it until service tested; aluminum weakens near 200 °F and visibly darkens", "Keep it in service; heat damage on aluminum always shows as discoloration", "Replace the label and return it; aluminum isn't affected below 500 °F"], "hash": "sha256:7d167fda7ce49a5f9506ae786c4c8bf43440f4ffb395d47fb4ebf91e95e6ee4e"}, {"n": 5, "q": "A crew used a 24-ft extension ladder as a lever to force a door. Can it go back on the rig after a visual check?", "a": "No. Unusual use like forcing a door triggers a service test, the same as overload, suspected damage, or repair. Otherwise it's tested at least yearly.", "qh": "A crew used a 24-ft extension ladder as a lever to force a door. Can it go back on the rig after a visual check?", "ah": "No. Unusual use like forcing a door triggers a service test, the same as overload, suspected damage, or repair. Otherwise it's tested at least yearly.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No; forcing a door is unusual use that requires a service test", "wh": ["Yes; a visual check is enough unless the ladder was overloaded", "Yes; it only needs testing at its next yearly service test", "No; levering voids its rating, so it must be destroyed"], "hash": "sha256:46dfff9d77cdc615b908d7733d425a5a0532ae60d2a3339a74eec0bb22e275c3"}, {"n": 6, "q": "Walk through the horizontal bending (center load) service test and its pass/fail rule for a 28-ft extension ladder.", "a": "Lay it flat on supports under the end rungs, fully extended, with the pawls strapped. Load the beams over a 32-in center area. Apply 350 lb for 1 min, remove it, and measure. Apply 500 lb for 5 min, remove it, wait 5 min, and re-measure. Over 25 ft, permanent set must be 1 in or less. More set, or any visible failure, means repair or destroy.", "qh": "Walk through the horizontal bending (center load) service test and its pass/fail rule for a 28-ft extension ladder.", "ah": "Lay it flat on supports under the end rungs, fully extended, with the pawls strapped. Load the beams over a 32-in center area. Apply 350 lb for 1 min, remove it, and measure. Apply 500 lb for 5 min, remove it, wait 5 min, and re-measure. Over 25 ft, permanent set must be 1 in or less. More set, or any visible failure, means repair or destroy.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "500 lb at center for 5 min, removed, 5-min wait; set of 1 in or less passes", "wh": ["500 lb at center for 5 min, removed, 5-min wait; set of ½ in or less passes", "500 lb at center for 5 min, removed, 5-min wait; set of 1½ in or less passes", "750 lb at center for 5 min, removed, 5-min wait; set of 1 in or less passes"], "hash": "sha256:5a3e6970d077df0b7bd67ed84003cd98d3b44948e6b08ed6a9712e7caf0da835"}, {"n": 7, "q": "Your 24-ft ladder is 3 ft short, so a member suggests lashing a roof ladder to the tip. Why is that forbidden?", "a": "Rails are engineered for a set load over a set span. Tied ladders don't have the rail strength for the longer span and can fail. Get a longer ladder instead.", "qh": "Your 24-ft ladder is 3 ft short, so a member suggests lashing a roof ladder to the tip. Why is that forbidden?", "ah": "Rails are engineered for a set load over a set span. Tied ladders don't have the rail strength for the longer span and can fail. Get a longer ladder instead.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Rails lack the strength for the longer span; get a longer ladder", "wh": ["Rails handle the span, but lashings slip; use rated straps instead", "Only roof ladders are banned; two extension ladders may be tied", "Tying is fine if the combined load stays under 250 lb"], "hash": "sha256:d8c26521d334b2cea7e8a348a017d8e171d3ad0de68fa23a3b08e0c7ecb6c643"}, {"n": 8, "q": "A raised ladder is one window off. Why must it be moved from the base and not walked over from the top?", "a": "Moving it from the top can leave the base on poor footing or let the pawls disengage. Reposition only from the base.", "qh": "A raised ladder is one window off. Why must it be moved from the base and not walked over from the top?", "ah": "Moving it from the top can leave the base on poor footing or let the pawls disengage. Reposition only from the base.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "From the top, the base can land on bad footing or the pawls can disengage", "wh": ["From the base, the tip can lose the wall, so walk it from the top instead", "From the top, the base can land on bad footing or the stay poles can twist", "Either way is fine once the halyard is tied and the dogs are locked"], "hash": "sha256:5ed64df3c1d1c9864617780d4ffdcb45a807a854dc5d8fd22d9341a8f566b7f9"}, {"n": 9, "q": "Compare aluminum, wood, and fiberglass ground ladders for heat, electrical hazard, and how they fail.", "a": "Aluminum conducts heat and electricity, can lose strength at about 200 °F without changing color, and tends to fail gradually. Wood resists heat better and is nonconductive only when dry (wet wood conducts), but can hide defects. Fiberglass is nonconductive but about as heat-sensitive as aluminum and fails suddenly with less warning. Keep every type away from electrical lines.", "qh": "Compare aluminum, wood, and fiberglass ground ladders for heat, electrical hazard, and how they fail.", "ah": "Aluminum conducts heat and electricity, can lose strength at about 200 °F without changing color, and tends to fail gradually. Wood resists heat better and is nonconductive only when dry (wet wood conducts), but can hide defects. Fiberglass is nonconductive but about as heat-sensitive as aluminum and fails suddenly with less warning. Keep every type away from electrical lines.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Aluminum conducts, fails gradually; wood resists heat, conducts wet; fiberglass nonconductive, fails suddenly", "wh": ["Aluminum conducts, fails suddenly; wood resists heat, conducts wet; fiberglass nonconductive, fails gradually", "Aluminum conducts, fails gradually; wood resists heat, never conducts; fiberglass nonconductive, fails suddenly", "Aluminum conducts, fails gradually; wood heat-sensitive, conducts wet; fiberglass resists heat, fails suddenly"], "hash": "sha256:fa74672f2623d5391300e2d4fbb92dc960d36b138e77589ee5485d35c4632e24"}, {"n": 10, "q": "You're raising a ladder with stay poles and one pole can't be set on the uneven ground. What do you do and why?", "a": "Remove the other pole from service and don't use stay poles. One pole puts a twisting load on the ladder, which isn't permitted.", "qh": "You're raising a ladder with stay poles and one pole can't be set on the uneven ground. What do you do and why?", "ah": "Remove the other pole from service and don't use stay poles. One pole puts a twisting load on the ladder, which isn't permitted.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Use neither pole; a single pole puts a twisting load on the ladder", "wh": ["Use the one pole that sets; a single pole is enough for stability", "Use the one pole that sets and heel the base harder to offset it", "Use neither pole; a single pole overloads the fly section's pawls"], "hash": "sha256:2d47940507e6f277884ef3daae8d5620b17357882815cdb35826a15917519dae"}], "sources": [{"label": "ALCO-LITE Fire Ladder Safety Handbook (dated 3/2022; posted Jan 2025)", "url": "https://www.fireladder.com/wp-content/uploads/2025/01/Fire-hand-Book.pdf"}, {"label": "Duo-Safety ladder documents", "url": "https://www.duosafety.com/"}, {"label": "NFPA 1930 (purchase)", "url": "https://www.nfpa.org/"}, {"label": "Library copy: Drive > Firefighter_Reference_Library > 10_PPE_Hose_Ladders_Other", "url": ""}, {"label": "ALCO-LITE Fire Ladder Safety Handbook: materials, center load test, loading, and safety notes (same PDF as above)", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 03 Truck &gt; 03.1 Ground Ladders &gt; node 1. <strong>Unlocks after:<\/strong> 01.0 Fundamentals. <strong>Unlocks:<\/strong> 03.1.2 Ladder Carries and Raises, then 03.4 Search and 03.5 Aerials (planned). <strong>Cross-links:<\/strong> 04.3 Firefighter Removal (ladder bail-out and rescue), 08.5 Aerial Operation.", "note_html": "Study aid only. NFPA ground-ladder requirements, formerly NFPA 1931 (design) and NFPA 1932 (use, maintenance, service testing), are now in <strong>NFPA 1930<\/strong> (per the ALCO-LITE handbook). NFPA standards are paywalled, so this sheet uses manufacturer and academy summaries."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 450.69, "y": -411.45, "angle": 74.5, "vx": -584.58, "vy": 464.02, "vangle": 319.5}, "03.1.2": {"id": "03.1.2", "name": "Ground Ladder Carries and Raises", "path": "03", "kind": "tool", "parent": "03.1", "prereqRaw": "parent 03.1", "children": [], "prereqs": ["03.1"], "unlocks": [], "cross": ["04.3"], "doc": {"title": "03.1.2 Ground Ladder Carries and Raises", "file": "03.1.2_Ground_Ladder_Carries_and_Raises.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>The standard ways to carry a ground ladder to the objective and raise it safely, with one or more firefighters.<\/p>"}, {"key": "specs", "title": "Key specs (common skills)", "html": "<ul><li><strong>Carries:<\/strong> low-shoulder carry and straight-arm carry, with one, two, or three firefighters.<\/li><li><strong>Raises:<\/strong> one-firefighter flat raise (single ladder), two-firefighter <strong>flat raise<\/strong>, two-firefighter <strong>beam raise<\/strong>, and three-firefighter beam raise.<\/li><li><strong>Commands (Connecticut Fire Academy):<\/strong> preparatory \"<strong>Prepare to raise<\/strong>\", then execution \"<strong>RAISE<\/strong>\".<\/li><li><strong>Placement:<\/strong> set the butt about <strong>¼ of the usable height<\/strong> from the building for a 75° angle.<\/li><li><strong>Who calls commands:<\/strong> the butt firefighter, for raising, extending, laying in, taking away, retracting, and lowering. Every action gets a preparatory call, then an execution call (CT Fire Academy):<ul><li>\"Prepare to Raise\" / \"RAISE\"<\/li><li>\"Prepare to Extend\" / \"EXTEND\"<\/li><li>\"Prepare to Lay It In\" / \"LAY IT IN\"<\/li><li>\"Prepare to Take Away\" / \"TAKE AWAY\"<\/li><li>\"Prepare to Retract\" / \"RETRACT\"<\/li><li>\"Prepare to Lower\" / \"LOWER\"<\/li><li>\"Prepare to Step Out\" / \"STEP OUT\"<\/li><\/ul><\/li><li><strong>Safety calls:<\/strong> \"Check for Obstructions\" (answered \"Clear\"), \"Fingers and Toes\", \"Dogs Locked\", and \"3, 2, 1 Building\".<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<p><strong>Before any raise:<\/strong> look up and <strong>check for overhead obstructions and wires<\/strong> as you approach.<\/p><p><strong>Two-firefighter flat raise (extension ladder):<\/strong><\/p><ol><li>Ladder flat on the ground, butt toward the building, at about ¼ of the usable height out.<\/li><li>The <strong>butt FF heels the ladder<\/strong>, standing on the bottom rung (or with toes against the beams), and leans back.<\/li><li>The <strong>tip FF<\/strong> lifts the tip, steps under, and walks it up hand over hand on the rungs or beams until it's vertical.<\/li><li>Pivot if needed so the <strong>fly is out<\/strong>. Extend the fly hand over hand with the halyard to the target height.<\/li><li><strong>Check that the pawls (dogs) are locked<\/strong>, lower the ladder gently onto the building, and <strong>tie the halyard<\/strong>.<\/li><\/ol><p><strong>Two-firefighter beam raise:<\/strong><\/p><ol><li>Set the ladder on its beam at about ¼ of the usable height out.<\/li><li>The butt FF heels it, with a foot at the lower beam and the other foot back as a counterweight, gripping the upper beam.<\/li><li>The tip FF raises it hand over hand to vertical, then the crew pivots so the fly faces out, extends, locks, and lays it in.<\/li><li><strong>Low-shoulder carry straight into a beam raise<\/strong> is called the most common carry and raise in the fire service (CT skill station 13.4.1).<\/li><\/ol><p><strong>Footing (heeling) the ladder:<\/strong> stand under or in front of the ladder and stay alert for falling debris. From behind, don't look up while others climb.<\/p><p><strong>One-firefighter flat raise:<\/strong> raise to vertical against the building, then pull the butt out to a <strong>75°<\/strong> climbing angle by lifting a lower rung while pushing an upper rung to keep the tip on the wall. Tie the halyard and check the tip and butt before climbing.<\/p><p><strong>Lowering:<\/strong> reverse the steps. Retract the fly first, then lower. <strong>Standard checks (CT Fire Academy Ground Ladders Manual):<\/strong><\/p><ul><li><strong>Check for Obstructions:<\/strong> called by the butt FF before spotting, raising, or lowering. Check overhead (wires, trees) and the ground (trip hazards, sprinkler heads, uneven terrain). Every firefighter on the ladder shares this job.<\/li><li><strong>Halyard grip:<\/strong> gloved hands, thumbs down, which forms a bite on the halyard for the safest pull.<\/li><li><strong>\"Fingers and Toes\":<\/strong> before extending or retracting, the tip FF keeps fingers out of the fly's path and everyone keeps toes out from under it.<\/li><li><strong>\"Dogs Locked\":<\/strong> before letting go of the halyard, the butt FF checks that the tip of each dog is visible. The tip FF confirms both dogs are over the rungs and answers \"Dogs Locked\".<\/li><li><strong>Laying it in:<\/strong> the tip FF calls \"3, 2, 1 Building\" as the tip nears the wall. The butt FF steps back, pushing the ladder's weight away from the building. The tip FF pulls the weight away too. Both keep resisting until the tip touches.<\/li><li><strong>Beam raise straight from the carry:<\/strong> done without setting the ladder down. The butt FF plants the spur, foots the bottom beam, and keeps the top beam tight to the inside knee while the tip FF raises it hand over hand.<\/li><li><strong>Lowering:<\/strong> the butt FF calls \"Prepare to Step Out\" as the tip FF reaches the 3rd rung from the tip.<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Wires and obstructions are the classic killer. Check every time.<\/li><li>Confirm the locks before anyone climbs. Heel or tie off the base and secure the tip.<\/li><li>Lift with your legs. In wind, the butt FF stays on the bottom rung until the tip FF has the ladder steady.<\/li><li>Never overload the ladder, and climb only within NFPA loading limits (see 03.1.1).<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Who gives the commands during a ladder raise, and why does every action get a preparatory call before the execution call?", "a": "The butt firefighter. The preparatory call (e.g., \"Prepare to Raise\") lets him confirm everyone is set before the execution call (\"RAISE\"), so no one is moving the ladder out of sync.", "qh": "Who gives the commands during a ladder raise, and why does every action get a preparatory call before the execution call?", "ah": "The butt firefighter. The preparatory call (e.g., \"Prepare to Raise\") lets him confirm everyone is set before the execution call (\"RAISE\"), so no one is moving the ladder out of sync.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "The butt FF; the prep call confirms everyone is set before the move", "wh": ["The tip FF; the prep call confirms everyone is set before the move", "The officer; the prep call confirms everyone is set before the move", "The butt FF; the prep call starts the move and the execution call stops it"], "hash": "sha256:9fa55bc3e64d4faef48e31b169069b1eba38b543193eaecdc0aff0ef3e7a9838"}, {"n": 2, "q": "Before spotting or raising, what does \"Check for Obstructions\" cover, and who is responsible for it?", "a": "Overhead hazards like wires and trees, and ground hazards like trip hazards, sprinkler heads, and uneven terrain. The butt FF calls it and the area must be confirmed \"Clear\", but every firefighter carrying the ladder is responsible.", "qh": "Before spotting or raising, what does \"Check for Obstructions\" cover, and who is responsible for it?", "ah": "Overhead hazards like wires and trees, and ground hazards like trip hazards, sprinkler heads, and uneven terrain. The butt FF calls it and the area must be confirmed \"Clear\", but every firefighter carrying the ladder is responsible.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Overhead and ground hazards; butt FF calls it, every carrier is responsible", "wh": ["Overhead hazards only; butt FF calls it, every carrier is responsible", "Overhead and ground hazards; tip FF calls it, tip FF alone is responsible", "Overhead and ground hazards; butt FF calls it, butt FF alone is responsible"], "hash": "sha256:176e2a50fb31377e6709478ac187c0baa35421d2b9a13c972862ba2c61f928a5"}, {"n": 3, "q": "Just before the fly is extended, the butt FF calls \"Fingers and Toes\". What hazard is this preventing?", "a": "Crushed fingers and toes. The moving fly section can catch fingers wrapped around the rungs or beams and feet placed under its path.", "qh": "Just before the fly is extended, the butt FF calls \"Fingers and Toes\". What hazard is this preventing?", "ah": "Crushed fingers and toes. The moving fly section can catch fingers wrapped around the rungs or beams and feet placed under its path.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "The moving fly crushing fingers on rungs or beams and feet under its path", "wh": ["Halyard rope burns to fingers and the butt spur sliding onto toes", "Stay-pole locks pinching fingers and the heel plate landing on toes", "Tools dropped from the tip landing on hands and feet below"], "hash": "sha256:3a5b601a76b30b4275d29bab8b48dfa8535bbf64397a8bd0f4a10a62fc72d59e"}, {"n": 4, "q": "How should you grip the halyard, and why?", "a": "Gloved, with both thumbs down. That forms a bite on the halyard and is the safest grasp to pull.", "qh": "How should you grip the halyard, and why?", "ah": "Gloved, with both thumbs down. That forms a bite on the halyard and is the safest grasp to pull.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Gloved, both thumbs down, forming a bite for the safest pull", "wh": ["Gloved, both thumbs up, forming a bite for the safest pull", "Gloved, one thumb up and one down, forming a bite for the safest pull", "Bare-handed, both thumbs down, for a firmer grip on the rope"], "hash": "sha256:0583f339341d750b8d9524d32f996aa3a1d3d20eff336782f3cc2faae7d2799d"}, {"n": 5, "q": "The fly is at the target height. Describe the \"Dogs Locked\" check: who looks at what, and what must not happen until it's done?", "a": "Before the butt FF releases the halyard, he checks that the tip of each dog (pawl) is visible. The tip FF confirms both dogs are over the rungs and calls \"Dogs Locked\". Only then is the halyard released. A dog that isn't seated can let the fly drop.", "qh": "The fly is at the target height. Describe the \"Dogs Locked\" check: who looks at what, and what must not happen until it's done?", "ah": "Before the butt FF releases the halyard, he checks that the tip of each dog (pawl) is visible. The tip FF confirms both dogs are over the rungs and calls \"Dogs Locked\". Only then is the halyard released. A dog that isn't seated can let the fly drop.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Butt FF sees each dog tip, tip FF confirms both on rungs; then release halyard", "wh": ["Tip FF sees each dog tip, butt FF confirms both on rungs; then release halyard", "Butt FF sees each dog tip, tip FF confirms one on a rung; then release halyard", "Butt FF releases the halyard, then both confirm the dogs are on rungs"], "hash": "sha256:61915d64577d33d7a2b54eacd0981d59b0421ca112fa8b60e9a695bcfec57fa7"}, {"n": 6, "q": "In a two-firefighter flat raise, what does the butt firefighter do, and when may he step off the bottom rung?", "a": "He heels the ladder, standing on the bottom rung (or with toes against the beams) and leaning back as a counterweight, while the tip FF walks it up. He stays on the bottom rung until the tip FF has the vertical ladder stabilized.", "qh": "In a two-firefighter flat raise, what does the butt firefighter do, and when may he step off the bottom rung?", "ah": "He heels the ladder, standing on the bottom rung (or with toes against the beams) and leaning back as a counterweight, while the tip FF walks it up. He stays on the bottom rung until the tip FF has the vertical ladder stabilized.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Heels it on the bottom rung, leaning back, until the tip FF steadies it vertical", "wh": ["Heels it on the bottom rung, leaning back, until the tip leaves the ground", "Lifts the tip and walks it up hand over hand until it's vertical", "Stands beside the beam holding the halyard until the tip is vertical"], "hash": "sha256:5b14f76ee3b470a2e5317561dc6e76f912fc04e3e47538ff1353cabb6d03f8fc"}, {"n": 7, "q": "Describe how a raised ladder is laid in against the building and why both firefighters resist its weight.", "a": "On \"LAY IT IN\", the butt FF steps back with the foot on the rung, pushing the weight away from the building, and the tip FF pulls the weight away. The tip calls \"3, 2, 1 Building\". Both resist until the tip touches, so the ladder doesn't fall into the wall out of control.", "qh": "Describe how a raised ladder is laid in against the building and why both firefighters resist its weight.", "ah": "On \"LAY IT IN\", the butt FF steps back with the foot on the rung, pushing the weight away from the building, and the tip FF pulls the weight away. The tip calls \"3, 2, 1 Building\". Both resist until the tip touches, so the ladder doesn't fall into the wall out of control.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Butt steps back pushing away, tip pulls away; both resist until the tip touches", "wh": ["Butt steps back pushing away, tip pushes it in; both resist until the tip touches", "Butt steps back pushing away, tip pulls away; both let go on the 3, 2, 1 call", "Butt steps forward pushing it in, tip pulls away; both resist until the tip touches"], "hash": "sha256:4eae7bec695cec23f32f297c2a5fda1f0066e4e4595232a12e745322ae1a432c"}, {"n": 8, "q": "In the low-shoulder carry to beam raise (the most common carry and raise), how does the butt firefighter anchor the ladder at the spotting point?", "a": "He plants the spur into the ground at the spot, foots the bottom beam with his inside foot, and keeps the top beam tight against his inside knee. The tip FF raises it hand over hand. The ladder never gets set down between the carry and the raise.", "qh": "In the low-shoulder carry to beam raise (the most common carry and raise), how does the butt firefighter anchor the ladder at the spotting point?", "ah": "He plants the spur into the ground at the spot, foots the bottom beam with his inside foot, and keeps the top beam tight against his inside knee. The tip FF raises it hand over hand. The ladder never gets set down between the carry and the raise.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Plants the spur, foots the bottom beam, top beam tight to the inside knee", "wh": ["Plants the spur, foots the top beam, bottom beam tight to the inside knee", "Plants the spur, foots the bottom beam, top beam tight to the outside knee", "Sets the ladder flat, stands on the bottom rung, and leans back"], "hash": "sha256:930688d14f84cdd99d7162565abe2f21b440649b998ec0a420cd92be8d5b6966"}, {"n": 9, "q": "Working alone with a single ladder, how do you get from vertical against the wall to a safe climbing angle?", "a": "Raise it vertical against the building. Then pull the butt out by lifting a lower rung while pushing an upper rung, keeping the tip on the wall, until the ladder is at about 75° (butt out about ¼ of the working height). Check the tip and butt before climbing.", "qh": "Working alone with a single ladder, how do you get from vertical against the wall to a safe climbing angle?", "ah": "Raise it vertical against the building. Then pull the butt out by lifting a lower rung while pushing an upper rung, keeping the tip on the wall, until the ladder is at about 75° (butt out about ¼ of the working height). Check the tip and butt before climbing.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Pull the butt out by a lower rung, push an upper rung, tip on wall, to 75°", "wh": ["Pull the butt out by a lower rung, push an upper rung, tip on wall, to 60°", "Pull the butt out by a lower rung, letting the tip come off the wall, to 75°", "Pull the butt out by a lower rung, push an upper rung, until it's ½ the height out"], "hash": "sha256:722dfe09ab5ffc38caff9358d4df5dd52b47115130a2f7ff5100cf6e073ac378"}], "sources": [{"label": "NYS DHSES skill sheets (one-FF flat raise, two-FF flat raise and halyard tie, two-FF beam raise)", "url": "https://www.sullivanny.gov/sites/default/files/departments/bof/Web%20page%20material/BOF%20BEFO%20skill%20sheets.pdf"}, {"label": "Connecticut Fire Academy Ground Ladder Manual", "url": "https://portal.ct.gov/cfpc/-/media/cfpc/pj-norwood/ground-ladder-manual.pdf"}, {"label": "CT Fire Academy Skill Sheet 13.2.4 (two-FF 28' flat raise)", "url": "https://portal.ct.gov/-/media/CFPC/files/NEW-ITEMS-2019/Uploaded-Files/Instructor-Lesson-Plans/Uploaded-Files/Unit-13/Skill-Sheet-1324.pdf"}, {"label": "CT Skill Station 13.4.1 (beam raise from carry)", "url": "https://portal.ct.gov/-/media/CFPC/files/NEW-ITEMS-2019/Uploaded-Files/Instructor-Lesson-Plans/Uploaded-Files/Unit-13/Skill-Sheet-1341.pdf"}, {"label": "ALCO-LITE Fire Ladder Safety Handbook", "url": "https://www.fireladder.com/wp-content/uploads/2025/01/Fire-hand-Book.pdf"}, {"label": "CT Fire Academy Ground Ladders Manual (rev. 08/31/2018), commands, halyard grip, Dogs Locked, and laying in (same PDF as above)", "url": ""}, {"label": "CT Skill Station 13.4.1 (rev. 07/22/13), low-shoulder carry to beam raise steps (same PDF as above)", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 03 Truck &gt; 03.1 Ground Ladders &gt; node 2. <strong>Unlocks after:<\/strong> 03.1.1 Types, Inspection, and Testing. <strong>Unlocks:<\/strong> 03.4 Search and Rescue, 03.3 Roof Ventilation (planned). <strong>Cross-links:<\/strong> 04.3 Firefighter Removal.", "note_html": "Study aid only, summarized from state fire-academy skill sheets that follow IFSTA <em>Essentials<\/em> and NFPA 1001 (Firefighter I/II, 5.3.6). Train hands-on with an instructor."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 429.31, "y": -411.45, "angle": 105.5, "vx": -575.55, "vy": 483.4, "vangle": 350.5}, "03.2": {"id": "03.2", "name": "Forcible Entry and Hand Tools", "path": "03", "kind": "main", "parent": null, "prereqRaw": "01.4", "children": ["03.2.1", "03.2.2"], "prereqs": ["01.4"], "unlocks": ["03.2.1", "03.2.2", "03.3", "03.C", "04.4"], "cross": ["04.4", "05.2.3", "05.2.0"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 640, "y": -450.0, "vx": -615.0, "vy": 640, "vangle": null}, "03.2.1": {"id": "03.2.1", "name": "Halligan and Irons", "path": "03", "kind": "tool", "parent": "03.2", "prereqRaw": "parent 03.2", "children": [], "prereqs": ["03.2"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 650.69, "y": -411.45, "angle": 74.5, "vx": -584.58, "vy": 614.02, "vangle": 319.5}, "03.2.2": {"id": "03.2.2", "name": "Holmatro T1 Forcible Entry Tool", "path": "03", "kind": "tool", "parent": "03.2", "prereqRaw": "parent 03.2", "children": [], "prereqs": ["03.2"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 629.31, "y": -411.45, "angle": 105.5, "vx": -575.55, "vy": 633.4, "vangle": 350.5}, "03.3": {"id": "03.3", "name": "Ventilation and Rescue Saws", "path": "03", "kind": "main", "parent": null, "prereqRaw": "03.1, 03.2", "children": ["03.3.1", "03.3.2", "03.3.3"], "prereqs": ["03.1", "03.2"], "unlocks": ["03.3.1", "03.3.2", "03.3.3", "03.C", "04.4"], "cross": ["04.4"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 840, "y": -450.0, "vx": -615.0, "vy": 790, "vangle": null}, "03.3.1": {"id": "03.3.1", "name": "Husqvarna K 770 Rescue", "path": "03", "kind": "tool", "parent": "03.3", "prereqRaw": "parent 03.3", "children": [], "prereqs": ["03.3"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 860.6, "y": -415.71, "angle": 59.0, "vx": -592.63, "vy": 756.84, "vangle": 304.0}, "03.3.2": {"id": "03.3.2", "name": "STIHL MS 462 C-M R Rescue", "path": "03", "kind": "tool", "parent": "03.3", "prereqRaw": "parent 03.3", "children": [], "prereqs": ["03.3"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 840.0, "y": -410.0, "angle": 90.0, "vx": -578.75, "vy": 773.1, "vangle": 335.0}, "03.3.3": {"id": "03.3.3", "name": "Husqvarna 565/572 XP", "path": "03", "kind": "tool", "parent": "03.3", "prereqRaw": "parent 03.3", "children": [], "prereqs": ["03.3"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 819.4, "y": -415.71, "angle": 121.0, "vx": -575.22, "vy": 794.18, "vangle": 6.0}, "03.4": {"id": "03.4", "name": "Search and Victim Removal", "path": "03", "kind": "main", "parent": null, "prereqRaw": "03.1, 01.2", "children": [], "prereqs": ["03.1", "01.2"], "unlocks": ["03.C"], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1040, "y": -450.0, "vx": -615.0, "vy": 940, "vangle": null}, "03.5": {"id": "03.5", "name": "Aerial Devices (operations overview)", "path": "03", "kind": "main", "parent": null, "prereqRaw": "03.1, 08.1", "children": ["03.5.1", "03.5.2"], "prereqs": ["03.1", "08.1"], "unlocks": ["03.5.1", "03.5.2", "03.C", "08.5"], "cross": ["08.5"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1240, "y": -450.0, "vx": -615.0, "vy": 1090, "vangle": null}, "03.5.1": {"id": "03.5.1", "name": "E-ONE Rear-Mount Aluminum Ladder", "path": "03", "kind": "tool", "parent": "03.5", "prereqRaw": "parent 03.5", "children": [], "prereqs": ["03.5"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1250.69, "y": -411.45, "angle": 74.5, "vx": -584.58, "vy": 1064.02, "vangle": 319.5}, "03.5.2": {"id": "03.5.2", "name": "Sutphen SL100 / 110-112 Aerials", "path": "03", "kind": "tool", "parent": "03.5", "prereqRaw": "parent 03.5", "children": [], "prereqs": ["03.5"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1229.31, "y": -411.45, "angle": 105.5, "vx": -575.55, "vy": 1083.4, "vangle": 350.5}, "03.C": {"id": "03.C", "name": "CAPSTONE: Truck Company Specialist", "path": "03", "kind": "capstone", "parent": null, "prereqRaw": "03.1 to 03.5", "children": [], "prereqs": ["03.1", "03.2", "03.3", "03.4", "03.5"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1640, "y": -450.0, "vx": -615.0, "vy": 1390, "vangle": null}, "04.1": {"id": "04.1", "name": "Mayday, Self-Survival and Air Management", "path": "04", "kind": "main", "parent": null, "prereqRaw": "01.2, 09.1.1", "children": [], "prereqs": ["01.2", "09.1.1"], "unlocks": ["04.2", "04.C"], "cross": ["01.2", "09.1.1", "09.1.2", "09.1.4"], "doc": {"title": "04.1 Mayday, Self-Survival and Air Management", "file": "04.1_Mayday_Self-Survival_and_Air_Management.md", "sections": [{"key": "what", "title": "What it is", "html": "<p><strong>Mayday<\/strong> is the radio word for a member in a life-threatening situation who needs immediate help. <strong>Self-survival<\/strong> means the actions you take yourself to stay alive until you get out or RIT reaches you. <strong>Air management<\/strong> means having enough air to do the job <strong>and<\/strong> get out with your reserve still in the cylinder. NIOSH found failures in all three in recent out-of-air deaths (FACE F2020-10, F2021-10, F2023-10).<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<p><strong>Air (NIOSH 2026-104 and FACE F2020-10):<\/strong><\/p><ul><li><strong>Rule:<\/strong> be trained to <strong>exit the IDLH before you start using your reserve air<\/strong> (NIOSH 2026-104, citing NFPA 1550 and NFPA 1400). NIOSH F2020-10: leave <strong>before the low-air alarm activates<\/strong>.<\/li><li><strong>Working and exiting air:<\/strong> the first <strong>67%<\/strong> of the supply covers getting in, doing the work, and getting out (F2020-10). A low-air alarm means you're <strong>into reserve<\/strong>. It requires immediate action by you <strong>and your crew<\/strong>.<\/li><li><strong>Real duration:<\/strong> SCBA ratings assume <strong>40 L/min<\/strong>. Working firefighters can breathe close to <strong>100 L/min<\/strong>. A \"30-minute\" <strong>1200 L<\/strong> cylinder lasts an average working firefighter about <strong>15–18 minutes<\/strong> (F2020-10). Hard work can cut service time by 50% or more.<\/li><li><strong>Service time also drops with:<\/strong> poor fitness, fear or excitement, little training, a cylinder not fully charged, a poor facepiece fit, a worn-out SCBA, and pressure (at 2 atmospheres, duration is halved).<\/li><li><strong>Officer's job:<\/strong> estimate the crew's exit time from the member with the <strong>highest<\/strong> air use. <strong>Your job:<\/strong> keep checking and reporting your own air (F2020-10).<\/li><li><strong>HUD:<\/strong> NIOSH found that the heads-up display is often ignored, and the end-of-service alarm (EOSTI) may be the first air warning a firefighter notices (F2020-10).<\/li><li><strong>EOSTI setting by NFPA 1981 edition (F2020-10):<\/strong> SCBA built to editions <strong>before 2013<\/strong> sound the end-of-service alarm at <strong>25% ± 2%<\/strong> remaining. Later editions alarm at about <strong>35%<\/strong>, which leaves more reserve. An older unit warns you later, with less air left to get out.<\/li><li><strong>SCBA load on the body (2026-104):<\/strong> up to <strong>40 lb<\/strong> of added weight and harder breathing. That means faster fatigue, hyperventilation, claustrophobia, <strong>higher air use<\/strong>, heat illness, and heart strain.<\/li><li><strong>Readiness (2026-104):<\/strong> medical clearance before fit testing (OSHA 29 CFR 1910.134). <strong>Annual fit test<\/strong>, and a new one after big weight changes or facial surgery. <strong>Clean-shaven<\/strong> where the mask seals. Train on the <strong>same make and model<\/strong> you'll use on the fireground.<\/li><\/ul><p><strong>Mayday triggers and timing:<\/strong><\/p><ul><li>Call Mayday when you're <strong>lost, disoriented, trapped, injured, or low or out of air<\/strong> (NIOSH 2009-100; F2020-10).<\/li><li><strong>Separated from your crew:<\/strong> try the radio. If you aren't reconnected after <strong>3 radio attempts or within 1 minute<\/strong>, call Mayday. If conditions are getting worse fast, call it <strong>immediately<\/strong>. The same rule applies to an officer or partner missing a member (F2020-10, citing IAFC 2021).<\/li><li>A Mayday should be called if <strong>any member can't be accounted for during a PAR<\/strong> (F2021-10).<\/li><li>IAFC Rules of Engagement <strong>#11: declare a Mayday as soon as you think you are in danger<\/strong> (F2020-10).<\/li><li><strong>RIT usually isn't activated until a Mayday is declared.<\/strong> Any delay shrinks your survival window and raises the risk to RIT (F2020-10, F2021-10).<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<p><strong>Mayday sequence (FACE F2020-10, F2021-10):<\/strong><\/p><ol><li>Quickly judge whether your spot is survivable. Move away from untenable fire if you must, but <strong>call while you still can and still have air<\/strong>.<\/li><li><strong>Press the radio emergency alert button (EAB)<\/strong> for 1–3 seconds.<\/li><li>Say <strong>\"MAYDAY, MAYDAY, MAYDAY,\"<\/strong> then your unit, then a short report. <strong>LUNAR<\/strong> prompt: <strong>L<\/strong>ocation, <strong>U<\/strong>nit, <strong>N<\/strong>ame, <strong>A<\/strong>ssignment/Air, <strong>R<\/strong>esources needed. Example: <em>\"Mayday, Mayday, Mayday, Division 1 Quadrant C, Engine 71, Smith, search/out of air/vomited, can't find exit.\"<\/em> At minimum, give the <strong>division (floor) and quadrant<\/strong>.<\/li><li><strong>Make sure command or dispatch acknowledges<\/strong> the Mayday.<\/li><li><strong>Manually activate your PASS.<\/strong><\/li><li><strong>Conserve air:<\/strong> stay calm and avoid unnecessary activity. Only after command and RIT know where you are should you try to fix the problem (for example, clearing the nose cup).<\/li><li><strong>Get your bearings:<\/strong> look for windows, doors, hallways, and changes in flooring. Stay on the radio with command and rescuers.<\/li><li><strong>Help them find you:<\/strong> point the PASS into open space, point your flashlight at the ceiling or wave it, and tap a tool on the floor or wall.<\/li><li><strong>Calling for someone else:<\/strong> try to reach the missing member by radio. If that fails, call a Mayday with their <strong>last known location<\/strong>.<\/li><\/ol><p><strong>Crew rules:<\/strong><\/p><ul><li><strong>One member's low-air alarm is an emergency for the whole crew.<\/strong> The whole crew leaves together and stays together. Crews that went in together run low on air in quick succession (F2020-10).<\/li><li>Stay in contact by sight, voice, or touch. The <strong>company officer<\/strong> is ultimately responsible for crew integrity (F2020-10, F2021-10).<\/li><li><strong>Evacuation signal (example in F2020-10):<\/strong> \"emergency traffic\" on the radio, then short air-horn blasts for about <strong>10 s<\/strong>, then 10 s of silence, repeated <strong>3 times<\/strong>. Withdraw immediately. Officers give a <strong>PAR<\/strong> to command.<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li><strong>Carbon monoxide steals your judgment.<\/strong> A firefighter breathing CO quickly loses the ability to communicate clearly and can wander away from the exit and the crew before passing out. Give your location <strong>early<\/strong> (F2020-10).<\/li><li><strong>Stress distorts your senses and slows your thinking.<\/strong> Mayday skills must be <strong>over-learned<\/strong>, trained to mastery, and practiced <strong>more often than once a year<\/strong> (F2020-10).<\/li><li><strong>Don't stay quiet to \"save resources.\"<\/strong> In F2021-10, one firefighter ran completely out of air about <strong>30 ft<\/strong> from the exit and did <strong>not<\/strong> call his own Mayday, because he didn't want to pull resources from his partner's Mayday. A FAST found him by his voice saying \"I am out of air.\" Command spent minutes not knowing who had called, and the Mayday firefighter in Room 306 died.<\/li><li><strong>Two Maydays at once cause confusion.<\/strong> Identify yourself. In F2023-10, a later Mayday from other out-of-air firefighters was briefly mistaken for the missing member.<\/li><li><strong>Radios fail.<\/strong> In F2023-10, a captain's Mayday inside a steel ship <strong>wasn't heard<\/strong>. Dispatch had to sound the emergency tones. That's why the EAB, PASS, and repeated calls matter.<\/li><li><strong>Keep your mask on.<\/strong> In F2022-03, a firefighter fell down the stairs, lost his air, and his mask was displaced. He died of smoke inhalation. NIOSH: keep the mask on in IDLH, and groom facial hair so it doesn't break the seal.<\/li><li><strong>Your PPE and SCBA don't give unlimited protection.<\/strong> Gear not donned, worn, or activated properly protects less or not at all (F2020-10).<\/li><li><strong>Large and commercial buildings:<\/strong> residential tactics and searching without a hoseline or tagline contributed to the F2020-10 deaths. Bigger buildings need more air. NIOSH suggests larger cylinders (for example, 1800 L) for companies that respond there.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li><strong>Cylinder upgrades:<\/strong> the F2020-10 department used 1200 L (30-minute) cylinders at the time of the fire and has since moved to 1800 L.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Your SCBA is rated \"30 minutes.\" NIOSH F2020-10 says how long a working firefighter can expect it to last, and why is there a gap?", "a": "About 15–18 minutes for a 1200 L cylinder. Ratings assume 40 L/min, but working firefighters can breathe close to 100 L/min.", "qh": "Your SCBA is rated \"30 minutes.\" NIOSH F2020-10 says how long a working firefighter can expect it to last, and why is there a gap?", "ah": "About 15–18 minutes for a 1200 L cylinder. Ratings assume 40 L/min, but working firefighters can breathe close to 100 L/min.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "About 15–18 min; rated at 40 L/min, but work nears 100 L/min", "wh": ["About 20–25 min; rated at 40 L/min, but work nears 100 L/min", "About 15–18 min; rated at 100 L/min, but work nears 160 L/min", "About 25–28 min; rated at 40 L/min, but work nears 50 L/min"], "hash": "sha256:2dc136d14548304dce5927fddbea22f3244161c2c1260ff67b51e4337c349157"}, {"n": 2, "q": "According to NIOSH, what share of your air is \"working and exiting air,\" and what does it mean when your low-air alarm sounds?", "a": "The first 67% is working and exiting air. A low-air alarm means you're already using reserve air, and you and your crew must act immediately. You should have left before it sounded.", "qh": "According to NIOSH, what share of your air is \"working and exiting air,\" and what does it mean when your low-air alarm sounds?", "ah": "The first 67% is working and exiting air. A low-air alarm means you're already using reserve air, and you and your crew must act immediately. You should have left before it sounded.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "The first 67%; the alarm means you're already into reserve", "wh": ["The first 50%; the alarm means you're already into reserve", "The first 67%; the alarm means reserve starts in a few minutes", "The first 75%; the alarm means finish the task, then leave"], "hash": "sha256:c660a8c2c19719e39defae5767fce22af1e275d9aeaeb0474eb39b9d2146d975"}, {"n": 3, "q": "Your partner's low-air alarm sounds, but you have plenty of air and are close to finding the seat of the fire. What does NIOSH say the crew should do, and why do crews tend to run out together?", "a": "Treat it as an emergency for the whole crew: everyone leaves together and keeps crew integrity. Crews that enter together use air at similar rates, so they run low in quick succession.", "qh": "Your partner's low-air alarm sounds, but you have plenty of air and are close to finding the seat of the fire. What does NIOSH say the crew should do, and why do crews tend to run out together?", "ah": "Treat it as an emergency for the whole crew: everyone leaves together and keeps crew integrity. Crews that enter together use air at similar rates, so they run low in quick succession.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Whole crew leaves together; crews entering together use air at similar rates", "wh": ["Partner leaves alone; you have air, so you finish locating the fire", "Partner leaves with one member; the rest of the crew keeps working", "Whole crew leaves together; one low-air alarm sets off every crew PASS"], "hash": "sha256:b8d1637075c160052f93ba2977329ba543df4d6fb62a93a1de6c07aa545e1622"}, {"n": 4, "q": "In the LUNAR Mayday format, what does each letter stand for, and what is the minimum location information NIOSH wants?", "a": "Location, Unit, Name, Assignment/Air, Resources needed. At minimum, the division (floor) and quadrant.", "qh": "In the LUNAR Mayday format, what does each letter stand for, and what is the minimum location information NIOSH wants?", "ah": "Location, Unit, Name, Assignment/Air, Resources needed. At minimum, the division (floor) and quadrant.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Location, Unit, Name, Assignment/Air, Resources; floor and quadrant", "wh": ["Location, Unit, Name, Assignment/Air, Radio channel; floor and quadrant", "Location, Unit, Number, Assignment/Air, Resources; floor and quadrant", "Location, Unit, Name, Assignment/Air, Resources; floor only"], "hash": "sha256:c2f487bb26d3aae3f07625948f0a305d833800c6c3041421252dd18213e4c73a"}, {"n": 5, "q": "List, in order, the four radio and PASS steps NIOSH F2020-10 gives for transmitting a Mayday.", "a": "Press the radio emergency alert button (1–3 s). Say \"Mayday, Mayday, Mayday\" plus your unit and a short report. Make sure command or dispatch acknowledges it. Make sure your PASS is activated.", "qh": "List, in order, the four radio and PASS steps NIOSH F2020-10 gives for transmitting a Mayday.", "ah": "Press the radio emergency alert button (1–3 s). Say \"Mayday, Mayday, Mayday\" plus your unit and a short report. Make sure command or dispatch acknowledges it. Make sure your PASS is activated.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "EAB, Mayday ×3 with unit and report, confirm acknowledgment, PASS", "wh": ["Mayday ×3 with unit and report, EAB, confirm acknowledgment, PASS", "EAB, Mayday ×3 with unit and report, PASS, confirm acknowledgment", "PASS, EAB, Mayday ×3 with unit and report, confirm acknowledgment"], "hash": "sha256:beff464f118209d31060d762cf1f7977bb71cca8a3d3bc58de90e145c7d16e01"}, {"n": 6, "q": "You've lost voice contact with your crew in heavy smoke. Under the IAFC rule NIOSH cites, when do you call a Mayday, and when do you skip the waiting period?", "a": "After 3 radio attempts with no reconnection, or 1 minute without reconnecting, whichever comes first. If conditions are deteriorating rapidly, call it immediately.", "qh": "You've lost voice contact with your crew in heavy smoke. Under the IAFC rule NIOSH cites, when do you call a Mayday, and when do you skip the waiting period?", "ah": "After 3 radio attempts with no reconnection, or 1 minute without reconnecting, whichever comes first. If conditions are deteriorating rapidly, call it immediately.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "After 3 radio attempts or 1 minute; at once if conditions worsen fast", "wh": ["After 3 radio attempts or 5 minutes; at once if conditions worsen fast", "After 1 radio attempt or 3 minutes; at once if conditions worsen fast", "After 3 radio attempts or 1 minute; at once only if command orders it"], "hash": "sha256:6ca632a988b93bf166eb228e830e6168cfa9a298bc224ea8b7530be497d7221e"}, {"n": 7, "q": "After calling the Mayday, you're waiting for RIT. Give three things to do to help yourself survive and three ways to help RIT find you.", "a": "Survival: stay calm, limit activity to save air, look for escape routes (windows, doors, hallways, flooring changes), and stay on the radio. Be found: point the PASS into open space, shine or wave the flashlight at the ceiling, and tap a tool on the floor or wall.", "qh": "After calling the Mayday, you're waiting for RIT. Give three things to do to help yourself survive and three ways to help RIT find you.", "ah": "Survival: stay calm, limit activity to save air, look for escape routes (windows, doors, hallways, flooring changes), and stay on the radio. Be found: point the PASS into open space, shine or wave the flashlight at the ceiling, and tap a tool on the floor or wall.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Stay calm, limit activity, find exits; aim PASS out, light at ceiling, tap a tool", "wh": ["Stay calm, limit activity, find exits; cover PASS, light at floor, stay silent", "Work fast, fix your mask first, find exits; aim PASS out, light at ceiling, tap a tool", "Stay calm, limit activity, go off the radio; aim PASS out, light at ceiling, tap a tool"], "hash": "sha256:93f7f7d4763bca334d8f672f6f5a83fca80b6133cfff2717c799d0ec051f6a3f"}, {"n": 8, "q": "In NIOSH FACE F2021-10, one firefighter ran out of air about 30 ft from an exit. What did he not do, why, and what problem did that cause for command?", "a": "He didn't call his own Mayday because he didn't want to divert resources from his partner's Mayday. Command didn't know who had called or where they were, so the FAST that found him was first taken for the Mayday firefighter in Room 306, and command didn't learn otherwise for several minutes.", "qh": "In NIOSH FACE F2021-10, one firefighter ran out of air about 30 ft from an exit. What did he not do, why, and what problem did that cause for command?", "ah": "He didn't call his own Mayday because he didn't want to divert resources from his partner's Mayday. Command didn't know who had called or where they were, so the FAST that found him was first taken for the Mayday firefighter in Room 306, and command didn't learn otherwise for several minutes.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Didn't call his own Mayday, to spare his partner's resources; command was confused", "wh": ["Didn't call his own Mayday, because his radio failed; command was confused", "Didn't call his own Mayday, because command ordered radio silence; command was confused", "Didn't call his own Mayday, to spare his partner's resources; command knew him at once"], "hash": "sha256:f32a287ab9fa39d299f2ddb7fadcd30fb2f84c965214ffaf193c9274286cb11b"}, {"n": 9, "q": "Why does NIOSH stress giving your location early, before anything else, when CO is involved?", "a": "CO quickly takes away your ability to communicate clearly and can lead you away from the exit before you pass out. Without an accurate location, RIT is slower, and your survival window closes.", "qh": "Why does NIOSH stress giving your location early, before anything else, when CO is involved?", "ah": "CO quickly takes away your ability to communicate clearly and can lead you away from the exit before you pass out. Without an accurate location, RIT is slower, and your survival window closes.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "CO quickly impairs clear speech and can lead you away from the exit", "wh": ["CO quickly drains the SCBA cylinder, so your air runs out sooner", "CO slowly impairs speech, so there's time to fix your gear first", "CO quickly disables radios and PASS devices near the floor"], "hash": "sha256:f2772f9f9d29862021990654e81673ef824156326a2ebcc46ee1d96ef88bea51"}, {"n": 10, "q": "NIOSH 2026-104 lists two ways SCBA use stresses the body. Name them and three effects that matter for air management.", "a": "Added weight (up to 40 lb) and increased breathing resistance. Effects: faster fatigue and shortness of breath or hyperventilation, claustrophobia, higher air consumption (also heat illness, heart strain, and reduced endurance or mobility).", "qh": "NIOSH 2026-104 lists two ways SCBA use stresses the body. Name them and three effects that matter for air management.", "ah": "Added weight (up to 40 lb) and increased breathing resistance. Effects: faster fatigue and shortness of breath or hyperventilation, claustrophobia, higher air consumption (also heat illness, heart strain, and reduced endurance or mobility).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Up to 40 lb and harder breathing; fatigue, claustrophobia, higher air use", "wh": ["Up to 20 lb and harder breathing; fatigue, claustrophobia, higher air use", "Up to 40 lb and easier breathing; fatigue, claustrophobia, higher air use", "Up to 40 lb and harder breathing; fatigue, claustrophobia, lower air use"], "hash": "sha256:3de6a2e2324bd6ee2e74c3843ece4ad05f4849539d17019b1076e97252dcc236"}, {"n": 11, "q": "In F2023-10, the first Mayday from inside the ship wasn't heard. What does this teach about relying on a voice Mayday alone?", "a": "Radios can fail, as with steel structures. Back up the voice call with the EAB and PASS, make sure someone acknowledges it, and keep trying. In F2023-10, dispatch had to sound the emergency tones.", "qh": "In F2023-10, the first Mayday from inside the ship wasn't heard. What does this teach about relying on a voice Mayday alone?", "ah": "Radios can fail, as with steel structures. Back up the voice call with the EAB and PASS, make sure someone acknowledges it, and keep trying. In F2023-10, dispatch had to sound the emergency tones.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Radios fail; back it up with EAB and PASS, confirm acknowledgment, keep trying", "wh": ["Radios fail; turn off your PASS so the voice call can be heard clearly", "Radios rarely fail; one clear voice call repeated once is enough", "Radios fail; stop calling and wait quietly for RIT to find you"], "hash": "sha256:454b4f0ebfc1bdf806d3f053d995bc1531c6a4d62b76458c0e250f2e383269e3"}, {"n": 12, "q": "An engineer says, \"Our older SCBAs alarm at the same point as the new ones.\" According to NIOSH F2020-10, how did the EOSTI setting change, and why does it matter?", "a": "SCBA built to pre-2013 editions of NFPA 1981 alarm at 25% ± 2%. Later editions alarm at about 35%. An older unit warns you later, leaving less reserve to get out.", "qh": "An engineer says, \"Our older SCBAs alarm at the same point as the new ones.\" According to NIOSH F2020-10, how did the EOSTI setting change, and why does it matter?", "ah": "SCBA built to pre-2013 editions of NFPA 1981 alarm at 25% ± 2%. Later editions alarm at about 35%. An older unit warns you later, leaving less reserve to get out.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Pre-2013 alarm at 25% ± 2%, later about 35%; older units warn later", "wh": ["Pre-2013 alarm at 35%, later about 25% ± 2%; older units warn earlier", "Pre-2013 alarm at 25% ± 2%, later about 50%; older units warn later", "Pre-2013 alarm at 25% ± 2%, later about 35%; both leave equal reserve"], "hash": "sha256:269c00acb9637e33e788c2367a3e42837d96823be342e1cdad85f9a8b444f110"}], "sources": [{"label": "NIOSH Publication 2026-104, Safe Use of Self-Contained Breathing Apparatus (SCBA) for Firefighters (July 2026)", "url": "https://www.cdc.gov/niosh/media/pdfs/2026/07/2026-104.pdf"}, {"label": "NIOSH Publication 2009-100, Leading Recommendations for Preventing Fire Fighter Fatalities, 1998–2005", "url": "https://stacks.cdc.gov/view/cdc/5205/cdc_5205_DS1.pdf"}, {"label": "NIOSH FACE F2020-10, Career Captain and Career Firefighter Die After Running Out of Air During a Search in a Public Library – California", "url": "https://www.cdc.gov/niosh/firefighters/programs/pdfs/face202010.pdf"}, {"label": "NIOSH FACE F2021-10 (revised Dec 17, 2024), Volunteer Firefighter Killed after Becoming Trapped at an Assisted Living Facility Fire – New York", "url": "https://www.cdc.gov/niosh/firefighters/programs/pdfs/face202110.pdf"}, {"label": "NIOSH FACE F2022-03, 35-year-old Volunteer Firefighter Dies from Smoke Inhalation Injury Sustained During Initial Fire Attack – Kansas", "url": "https://www.cdc.gov/niosh/firefighters/programs/pdfs/face202203.pdf"}, {"label": "NIOSH FACE F2023-10, Two Career Land-Based Firefighters Die After Becoming Lost and Running Out of Air During a Marine Vessel Fire in Port – New Jersey", "url": "https://www.cdc.gov/niosh/firefighters/programs/pdfs/face202310.pdf"}, {"label": "Scout batches 01 and 03 (04.1 sections): /workspace/can-report/scout-batch-01.md, /workspace/can-report/scout-batch-03.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 04 RIT / Firefighter Survival and Rescue &gt; 04.1 (task group). <strong>Unlocks after:<\/strong> 01.2 SCBA, 09.1.1 PASS. <strong>Unlocks:<\/strong> 04.2 RIT Air Supply Packs (04.2.1 Scott RIT-Pak III, 04.2.2 MSA G1 RIT/RescueAire II), 04.C capstone. <strong>Cross-links:<\/strong> 09.1.1 PASS, 09.1.2 Accountability, 09.1.4 TIC Navigation and Search.", "note_html": "Study aid only. Your department's Mayday SOP and radio procedures come first. NIOSH notes that there is no national Mayday standard and no mandate for when to call one, so each authority having jurisdiction sets its own rules. NFPA standards are cited by number only."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 440, "y": -300.0, "vx": -410.0, "vy": 490, "vangle": null}, "04.2": {"id": "04.2", "name": "RIT Air Supply Packs", "path": "04", "kind": "main", "parent": null, "prereqRaw": "04.1, 01.2", "children": ["04.2.1", "04.2.2"], "prereqs": ["04.1", "01.2"], "unlocks": ["04.2.1", "04.2.2", "04.3", "04.C"], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 640, "y": -300.0, "vx": -410.0, "vy": 640, "vangle": null}, "04.2.1": {"id": "04.2.1", "name": "3M Scott RIT-Pak III", "path": "04", "kind": "tool", "parent": "04.2", "prereqRaw": "parent 04.2", "children": [], "prereqs": ["04.2"], "unlocks": [], "cross": ["01.2.1", "09.1.1"], "doc": {"title": "04.2.1 3M Scott RIT-Pak III Portable Air Supply", "file": "04.2.1_Scott_RIT-Pak_III.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>An emergency air supply in a drag bag that a Rapid Intervention Team carries to a downed or trapped firefighter. It is <strong>not a complete respirator<\/strong> and is not NIOSH- or NFPA-approved as one. It's for emergency use only, supplying <strong>one<\/strong> user while they're being evacuated.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Models by pressure:<\/strong> 2216 psi (Scott 2.2, 30-min cylinder), 4500 psi (4.5, 30/45/60-min), 5500 psi (5.5, 30/45/60/75-min). The cylinder is bought separately.<\/li><li><strong>LOW-pressure supply:<\/strong> a reducer and hose to a dual manifold (male and female quick-disconnects). It replaces the downed firefighter's depleted cylinder or feeds a facepiece and regulator. The hose can release air at <strong>160 psi<\/strong>.<\/li><li><strong>HIGH-pressure supply:<\/strong> a <strong>RIC UAC<\/strong> hose that fits any NFPA 1981 (2002 or later) SCBA with a UAC, to <strong>partially recharge<\/strong> the victim's cylinder. A VENT button bleeds residual pressure.<\/li><li><strong>Remote gauge console<\/strong> outside the bag: analog gauge plus an LED display (lights up all 5 for 20 s at start-up).<\/li><li><strong>Low-air bell:<\/strong> rings when the RIT cylinder falls <strong>below ¼ full<\/strong>.<\/li><li><strong>Options:<\/strong> an Emergency facepiece (AV-3000 SureSeal variant, no nose cup or voicemitters) and an Emergency regulator (<strong>no<\/strong> end-of-service alarm). These options are not NIOSH/NFPA approved.<\/li><li><strong>Bag:<\/strong> rigid hose compartments, plastic skid plate, attachment rings, and a long shoulder strap.<\/li><li><strong>LP connection points (manual):<\/strong> the facepiece-mounted regulator quick-disconnect, the EBSS (\"buddy breather\"), or the extended-duration airline connection on the victim's SCBA. The optional emergency facepiece and regulator are the fallback if the victim's mask has failed.<\/li><li><strong>LED display:<\/strong> a convenience feature, not critical to operation. The analog gauge and the bell are what you rely on.<\/li><li><strong>Monitor alert point (manual example):<\/strong> about ¼ full, which is roughly 500 psi on a 2216 pack, 1000 psi on a 4500 pack, and 1200 psi on a 5500 pack. Your respiratory protection program sets the actual value.<\/li><li><strong>Air quality:<\/strong> Grade D or better (CGA G-7.1) with a dew point of −65 °F / −54 °C or lower. Never oxygen. Moisture in compressed air can freeze even well above 32 °F.<\/li><li><strong>Duration:<\/strong> hard work can cut the time to half the rated duration or less. At 2 atmospheres absolute (for example, in a pressurized tunnel), duration is halved.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li><strong>Pre-use:<\/strong> check the hydro date, cylinder FULL, hoses and quick-disconnects, and the UAC dust cover. Couplings are hand-tight only.<\/li><li>At the victim: open the RIT cylinder valve and check the gauge and LEDs.<\/li><li><strong>Option A (UAC transfill):<\/strong> connect the HIGH-pressure hose to the victim's RIC UAC to partly refill their cylinder.<\/li><li><strong>Option B (LP supply):<\/strong> connect the LOW-pressure manifold to the victim's SCBA, or use the emergency facepiece and regulator if their mask has failed.<\/li><li><strong>Assign one RIT member to watch the RIT cylinder gauge<\/strong> the whole time, and swap or exit before it runs out.<\/li><li>Afterward: close the valve, vent with the UAC VENT button or the regulator purge, then clean, decon, and inspect.<\/li><\/ol><p><strong>UAC transfill details (manual):<\/strong><\/p><ul><li>First make sure nothing on the LP hose will bleed air. Then open the RIT cylinder fully and set the pack on a flat, level surface away from heat.<\/li><li>A RIT member inspects the victim's cylinder: dents or gouges, valve damage, and heat signs (brown or black paint, charred or missing decals, melted gauge lens, distorted bumper). If the cylinder was dropped, flame-exposed, or is damaged in any way, don't use the UAC. Find another way to supply air.<\/li><li>Make sure the victim's cylinder valve is fully open (about 2½ turns). Push the coupling on until it clicks, then tug-test it. Never charge past the rated pressure marked on the cylinder.<\/li><li>Air flows only while the RIT cylinder is at higher pressure. It stops when the two cylinders equalize, and the victim's gauge settles <strong>below FULL<\/strong>. Then close the RIT valve.<\/li><li>If the victim's UAC relief valve vents, the respirator's rated pressure was exceeded. Close the RIT valve and check the victim's gauge. The relief valve resets on its own.<\/li><li>Any leak during the fill: stop and use another method. To disconnect, pull the sleeve back. A check valve in the victim's UAC holds the air. If the victim runs low again before getting out, repeat the fill with a fresh, full RIT-Pak.<\/li><li><strong>LP hookup:<\/strong> if the victim's cylinder is still open, he breathes from it until its supply pressure falls below the LP line pressure. If it's closed, the RIT-Pak is his only source. Secure the manifold to his body so it can't pull on the facepiece.<\/li><li>After the rescue, install a full cylinder. Don't keep a partly used one in service.<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Depending on the hookup, the <strong>victim's SCBA alarms may not work<\/strong>. Someone has to watch the gauge.<\/li><li>A transfill gives <strong>less<\/strong> than rated duration. The amount moved depends on both cylinders.<\/li><li>Use only the matching Scott cylinder pressure. Mismatches cause false gauge and alarm readings.<\/li><li>Don't add hoses or adapters except as the manual directs. Keep it away from flame.<\/li><li><strong>Cylinder mismatch (manual):<\/strong> a <em>lower<\/em>-pressure cylinder (for example, a 2216 or 3000 psi cylinder in a 4500 pack) reads less than FULL, and the low-air LED alert comes on well before about ¾ of the air is used. A <em>higher<\/em>-pressure cylinder (3000 in a 2216 pack, or 5500 in a 4500 pack) reads above FULL, and the end-of-service alarms won't activate until <strong>more<\/strong> than about ¾ is gone. In any mismatch, someone must watch the cylinder gauge.<\/li><li>A 4500 or 5500 psi cylinder <strong>can't<\/strong> be installed on a 2216 pack. By design, the coupling won't seal and leaks heavily, so the lower-pressure parts never see the higher pressure.<\/li><li><strong>Cold weather (below 32 °F / 0 °C):<\/strong> keep the HP, UAC, and LP couplings dry, because ice can stop you from connecting or disconnecting them. The reducer gets cold while air flows, so water or mud on it can freeze and affect operation. If you fill a cylinder through the HP hose in the cold and then move it indoors, check it for excess pressure <strong>within 2 hours<\/strong>. If it reads above full, bleed it down to full with the regulator purge.<\/li><li>The UAC is for an incapacitated user only. Don't charge an SCBA while it's being worn unless there's a compelling reason to accept the risk.<\/li><li>Compressed air against skin can cause an air embolism. A damaged LP hose can release air at 160 psi, and a cut HP hose can release 4500 psi.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "A new member calls the RIT-Pak III \"a spare SCBA in a bag.\" What's wrong with that, and what limits does the manual put on its use?", "a": "It isn't a complete respirator and isn't NIOSH- or NFPA-approved as one. It's an emergency air supply for one user at a time, only to help evacuate him. It's not an air cart, a routine air source, or a hose-line air supply, and you can't add hoses or adapters unless the manual says to.", "qh": "A new member calls the RIT-Pak III \"a spare SCBA in a bag.\" What's wrong with that, and what limits does the manual put on its use?", "ah": "It isn't a complete respirator and isn't NIOSH- or NFPA-approved as one. It's an emergency air supply for one user at a time, only to help evacuate him. It's not an air cart, a routine air source, or a hose-line air supply, and you can't add hoses or adapters unless the manual says to.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Not a complete or approved respirator; emergency air for one user during evacuation", "wh": ["A NIOSH-approved respirator; emergency air for one user during evacuation", "Not a complete respirator; emergency air for two users at once during evacuation", "Not a complete respirator; also fine as an air cart or hose-line air supply"], "hash": "sha256:8c5e4edffeb678b060599c1f82e1d10631e852dfb2f535231208a5829375d2f4"}, {"n": 2, "q": "You reach a downed Scott wearer and want to use the low-pressure line. Name the three places on his SCBA it can connect, and the fallback if his facepiece has failed.", "a": "The facepiece-mounted regulator quick-disconnect, the EBSS (buddy breather), or the extended-duration airline connection. If his mask has failed, use the optional emergency facepiece and regulator. That regulator has no end-of-service alarm.", "qh": "You reach a downed Scott wearer and want to use the low-pressure line. Name the three places on his SCBA it can connect, and the fallback if his facepiece has failed.", "ah": "The facepiece-mounted regulator quick-disconnect, the EBSS (buddy breather), or the extended-duration airline connection. If his mask has failed, use the optional emergency facepiece and regulator. That regulator has no end-of-service alarm.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Regulator quick-disconnect, EBSS, extended-duration airline; else emergency facepiece and regulator", "wh": ["Regulator quick-disconnect, RIC UAC, extended-duration airline; else emergency facepiece and regulator", "Regulator quick-disconnect, EBSS, cylinder valve; else emergency facepiece and regulator", "Regulator quick-disconnect, EBSS, extended-duration airline; else transfill through his UAC"], "hash": "sha256:929fd5ff5302f48beb0263bf54034b0b3b34cdb6ee017d41de96928f7fae6d4a"}, {"n": 3, "q": "You connect the LP line while the victim's own cylinder valve is still open. Whose air is he breathing, and when does that change?", "a": "His own cylinder, until its supply pressure drops below the LP line pressure. Then the RIT-Pak takes over. If his cylinder is closed, the RIT-Pak is his only air.", "qh": "You connect the LP line while the victim's own cylinder valve is still open. Whose air is he breathing, and when does that change?", "ah": "His own cylinder, until its supply pressure drops below the LP line pressure. Then the RIT-Pak takes over. If his cylinder is closed, the RIT-Pak is his only air.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "His own, until it falls below LP line pressure; then the RIT-Pak", "wh": ["The RIT-Pak's, from the moment the LP line is connected", "His own, until it falls below ¼ full; then the RIT-Pak", "Both equally, until the two cylinders equalize in pressure"], "hash": "sha256:ed0391bef12184d87f1a4902b2027429192a67e04f0b23e8a018030b4d502cc4"}, {"n": 4, "q": "Before you transfill through the victim's RIC UAC, what do you inspect, and which findings mean you don't use the UAC at all?", "a": "Check his cylinder for dents or gouges, valve damage, and heat signs: brown or black paint, charred or missing decals, a melted gauge lens, or a distorted bumper. Also check his hoses and parts. If the cylinder was dropped, flame-exposed, or damaged in any way, or anything looks unsafe, don't use the UAC. Find another way to get him air.", "qh": "Before you transfill through the victim's RIC UAC, what do you inspect, and which findings mean you don't use the UAC at all?", "ah": "Check his cylinder for dents or gouges, valve damage, and heat signs: brown or black paint, charred or missing decals, a melted gauge lens, or a distorted bumper. Also check his hoses and parts. If the cylinder was dropped, flame-exposed, or damaged in any way, or anything looks unsafe, don't use the UAC. Find another way to get him air.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Dents, gouges, valve damage, heat signs; skip UAC if dropped, flame-exposed, or damaged", "wh": ["Dents, gouges, valve damage, heat signs; skip UAC only if his gauge reads empty", "Hydro date and fill level only; skip UAC only if it's past its hydro date", "Dents, gouges, valve damage, heat signs; skip UAC only if it's actively leaking"], "hash": "sha256:7966efd8a75c31319d2f97dcae484e220608dadccb669e6631b1956147e2c6ed"}, {"n": 5, "q": "Your full 4500 psi RIT-Pak is transfilling an almost empty 45-minute cylinder. When does the air stop, what will the victim's gauge show, and why won't he get 45 minutes?", "a": "Air flows only while the RIT cylinder pressure is higher. It stops when the two equalize, so his gauge settles below FULL. The amount transferred depends on both cylinders and is always less than either cylinder's rating.", "qh": "Your full 4500 psi RIT-Pak is transfilling an almost empty 45-minute cylinder. When does the air stop, what will the victim's gauge show, and why won't he get 45 minutes?", "ah": "Air flows only while the RIT cylinder pressure is higher. It stops when the two equalize, so his gauge settles below FULL. The amount transferred depends on both cylinders and is always less than either cylinder's rating.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "When pressures equalize; his gauge below FULL; less than either cylinder's rating", "wh": ["When his gauge hits FULL; his gauge at FULL; hard work alone shortens it", "When pressures equalize; his gauge at FULL; heat loss cuts his usable time", "After a fixed 60 seconds; his gauge below FULL; less than either cylinder's rating"], "hash": "sha256:0731be317e3ded8c472b4186e50d9185a55365ca304d16591d268ea2540234c6"}, {"n": 6, "q": "Partway through the fill, a relief valve on the victim's UAC manifold starts venting. What does it mean, and what do you do?", "a": "The fill pressure exceeded his respirator's rated pressure. Close the RIT-Pak cylinder valve and check his cylinder gauge. The relief valve resets once the excess vents. Keep unprotected skin away from the venting air.", "qh": "Partway through the fill, a relief valve on the victim's UAC manifold starts venting. What does it mean, and what do you do?", "ah": "The fill pressure exceeded his respirator's rated pressure. Close the RIT-Pak cylinder valve and check his cylinder gauge. The relief valve resets once the excess vents. Keep unprotected skin away from the venting air.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Rated pressure exceeded; close the RIT valve, check his gauge; it self-resets", "wh": ["Rated pressure exceeded; open the RIT valve wider to finish the fill fast", "Normal end of fill; disconnect, then reconnect to top him off", "Rated pressure exceeded; close the RIT valve, then reset the relief valve by hand"], "hash": "sha256:ae7c723ab3a52eefb9a1dd35aeb137ed5264fbfdb3471fd2ce69017caea1bc43"}, {"n": 7, "q": "The RIT bag was restocked with a 5500 psi cylinder on a 4500 psi pack. How will the gauge and alarms behave, and why is that dangerous? How is a 2216 cylinder in the same pack different?", "a": "A higher-pressure cylinder makes the gauge read above FULL, and the end-of-service alarms won't activate until more than about ¾ of the air is gone. You could run out with little warning. A 2216 cylinder reads below FULL, and the low-air LED alert comes on well before ¾ is used. Either way, someone must watch the cylinder gauge.", "qh": "The RIT bag was restocked with a 5500 psi cylinder on a 4500 psi pack. How will the gauge and alarms behave, and why is that dangerous? How is a 2216 cylinder in the same pack different?", "ah": "A higher-pressure cylinder makes the gauge read above FULL, and the end-of-service alarms won't activate until more than about ¾ of the air is gone. You could run out with little warning. A 2216 cylinder reads below FULL, and the low-air LED alert comes on well before ¾ is used. Either way, someone must watch the cylinder gauge.", "fmt": "A", "gateStatus": "pass", "gate": true
