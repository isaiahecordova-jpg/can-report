ed and phased?", "a": "$770.4 million ($756.3 million General Fund) and 2,457 positions ongoing, phased in over five years beginning in 2024-25 (2026-27 Budget).", "qh": "How is the 66-hour workweek funded and phased?", "ah": "$770.4 million ($756.3 million General Fund) and 2,457 positions ongoing, phased in over five years beginning in 2024-25 (2026-27 Budget)."}], "sources": [{"label": "2026-27 Governor's Budget Summary, Natural Resources", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}, {"label": "Firefighter I posting JC-533177", "url": "https://calcareers.ca.gov/CalHrPublic/Jobs/JobPosting.aspx?JobControlId=533177"}, {"label": "Ranger batch: /workspace/can-report/calfire/calfire-batch-02.md and calfire-batch-02.json (conflicting_counts: year_round_staffed_engines)", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 12. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 10.6.5 CalCareers and Firefighter I Hiring.", "note_html": "Study aid only. Source: 2026-27 Governor's Budget Summary, Natural Resources chapter, and FFI posting JC-533177 (Ranger calfire-batch-02). Budget figures are plans and funding as stated in that document. Check later budgets for changes."}, "hasContent": true, "counts": [{"label": "Engines staffed in the base period", "active": {"value": "65", "source": {"label": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}}, "planned": {"value": "153", "basis": "full 66-hour workweek implementation", "source": {"label": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}}}], "disagreements": [], "datasets": [], "x": 1495.7, "y": 639.0, "angle": 35.0, "vx": 864.61, "vy": 1188.68, "vangle": 311.0}, "10.6.13": {"id": "10.6.13", "name": "Fire Hazard Severity Zones, Defensible Space, and Ready for Wildfire", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.6.4"], "doc": {"title": "10.6.13 Fire Hazard Severity Zones, Defensible Space, and Ready for Wildfire", "file": "10.6.13_Fire_Hazard_Severity_Zones_Defensible_Space_and_Ready_for_Wildfire.md", "sections": [{"key": "what", "title": "What it is", "html": "<ul><li><strong>Fire Hazard Severity Zones (FHSZ):<\/strong> the State Fire Marshal \"is mandated to classify lands within State Responsibility Areas into Fire Hazard Severity Zones.\" There are three levels: <strong>Moderate, High, Very High<\/strong>.<\/li><li><strong>Defensible space:<\/strong> \"the buffer created by removing dead plants, grass and weeds to help keep wildfire away from your home.\" It's \"key to slowing or stopping wildfire spread\" and \"gives firefighters a safer area to defend your property.\"<\/li><li><strong>Ready for Wildfire:<\/strong> CAL FIRE's public preparedness program, covering home hardening plus defensible space.<\/li><\/ul>"}, {"key": "specs", "title": "Key specs", "html": "<p><strong>FHSZ law and maps<\/strong><\/p><ul><li><strong>Legal authorities:<\/strong> PRC 4201-4204; CCR Title 14 §1280 (the SRA rule is §1280.01); Gov. Code 51175-89.<\/li><li><strong>Model inputs:<\/strong> fire history, existing and potential fuel, predicted flame length, blowing embers, terrain, and typical fire weather.<\/li><li><strong>Hazard, not risk:<\/strong> FHSZ maps show <strong>hazard<\/strong>, the physical conditions over a <strong>30- to 50-year<\/strong> period, <strong>without<\/strong> counting mitigation. <strong>Risk<\/strong> would account for fuel reduction, defensible space, and ignition-resistant construction.<\/li><li><strong>SRA maps:<\/strong> finished at the end of 2023, effective <strong>1 Apr 2024<\/strong>.<\/li><li><strong>LRA maps (2025):<\/strong> released to local jurisdictions in four phases (10 Feb, 24 Feb, 10 Mar, and 24 Mar 2025).<\/li><li><strong>2026 SRA update:<\/strong> public comment runs <strong>9 Nov 2026 to 8 Jan 2027<\/strong>. It follows the Board of Forestry's 5-Year SRA Review (PRC 4125), which changed SRA boundaries in <strong>34 counties<\/strong>.<\/li><\/ul><p><strong>PRC 4291 (SRA structures)<\/strong><\/p><ul><li>Who it applies to: anyone who owns, leases, controls, operates, or maintains a building or structure in the SRA.<\/li><li><strong>100 ft<\/strong> of defensible space from each side and the front and rear, but not past the property line.<\/li><li><strong>More intense fuel reduction between 5 and 30 ft.<\/strong><\/li><li>An <strong>ember-resistant zone within 5 ft<\/strong>, per Board regulations.<\/li><li>Trees kept <strong>10 ft<\/strong> from a chimney or stovepipe outlet.<\/li><li>Plants next to or over the building free of dead wood. Roof clear of leaves and needles.<\/li><\/ul><p><strong>Ready for Wildfire zones<\/strong><\/p><ul><li><strong>Zone 0 (0 to 5 ft), ember-resistant:<\/strong><ul><li>Approved by the Board, in final state review, <strong>not yet in effect<\/strong>.<\/li><li>Applies in the SRA and in <strong>Very High<\/strong> FHSZ within the LRA.<\/li><li>Existing homes: Phase 1 within 3 years, Phase 2 within 5 years.<\/li><\/ul><\/li><li><strong>Zone 1 (to 30 ft), \"Lean, Clean, and Green\":<\/strong><ul><li>Remove dead fuels.<\/li><li>Keep 10 ft clear from chimneys.<\/li><li>Move wood piles to Zone 2.<\/li><li>Keep 10 ft around outbuildings and LPG tanks.<\/li><\/ul><\/li><li><strong>Zone 2 (30 to 100 ft), \"Reduce Fuel\":<\/strong><ul><li>Mow grass to a <strong>maximum 4 in<\/strong>.<\/li><li>Space plants horizontally and vertically.<\/li><li>Up to <strong>3 in<\/strong> of leaves or needles may stay.<\/li><li>Keep wood piles 10 ft clear.<\/li><\/ul><\/li><\/ul><p><strong>Spacing and other rules<\/strong><\/p><ul><li>Remove tree branches <strong>at least 6 ft<\/strong> from the ground.<\/li><li>Vertical gap of at least <strong>3× the shrub height<\/strong> between shrubs and the lowest tree branches.<\/li><li><strong>Get Ready (CAL FIRE):<\/strong> 100 ft of defensible space, grass at most 4 in, and combustibles <strong>30 ft<\/strong> from the home.<\/li><li><strong>Local rules can be stricter.<\/strong> Example: San Diego County requires 50 ft in Zone 1.<\/li><li><strong>Inspection goal:<\/strong> <strong>250,000 annual parcel inspections<\/strong> in the SRA, with year-round inspectors (2026-27 Budget).<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Prevention crews and inspectors<\/strong> use the 4291 standard during defensible space inspections, a core Fire Prevention Program activity (Our Organization page).<\/li><li><strong>Ember-resistant zone enforcement:<\/strong> under PRC 4291 it doesn't take effect for new structures until the Board updates its regulations and guidance. For existing structures it starts three years after the new-structure date. CAL FIRE won't change inspection practices or forms for it until the State Fire Marshal finds in writing that the Legislature has appropriated enough resources.<\/li><li><strong>LRA property questions<\/strong> go to the local jurisdiction. Gov. Code 51182 is the related local-agency statute for VHFHSZ.<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Defensible space gives firefighters a safer area to work and defend structures (Ready for Wildfire).<\/li><li>Keep LPG tanks with 10 ft of clearance, and keep wood piles out of Zone 1 (Ready for Wildfire).<\/li><\/ul>"}], "qa": [{"n": 1, "q": "A homeowner says, \"My parcel was rated Very High, so the state thinks my house will burn.\" Explain hazard vs risk as OSFM uses them.", "a": "FHSZ maps show hazard: the physical conditions that drive fire likelihood and behavior over a 30- to 50-year period, without counting mitigation such as home hardening, recent wildfire, or fuel reduction. Risk accounts for changes like fuel reduction, defensible space, and ignition-resistant construction (OSFM FHSZ page).", "qh": "A homeowner says, \"My parcel was rated Very High, so the state thinks my house will burn.\" Explain hazard vs risk as OSFM uses them.", "ah": "FHSZ maps show hazard: the physical conditions that drive fire likelihood and behavior over a 30- to 50-year period, without counting mitigation such as home hardening, recent wildfire, or fuel reduction. Risk accounts for changes like fuel reduction, defensible space, and ignition-resistant construction (OSFM FHSZ page)."}, {"n": 2, "q": "Who must classify SRA lands into FHSZ, what are the three classes, and what statutes back it up?", "a": "The State Fire Marshal. The classes are Moderate, High, and Very High. Authorities: PRC 4201-4204, CCR Title 14 §1280, and Gov. Code 51175-89 (OSFM FHSZ page).", "qh": "Who must classify SRA lands into FHSZ, what are the three classes, and what statutes back it up?", "ah": "The State Fire Marshal. The classes are Moderate, High, and Very High. Authorities: PRC 4201-4204, CCR Title 14 §1280, and Gov. Code 51175-89 (OSFM FHSZ page)."}, {"n": 3, "q": "A homeowner in the SRA asks how far defensible space has to go and whether they must clear the neighbor's lot. What does PRC 4291 say?", "a": "100 ft from each side and the front and rear of the structure, but not beyond the property line except as provided in the law (PRC 4291).", "qh": "A homeowner in the SRA asks how far defensible space has to go and whether they must clear the neighbor's lot. What does PRC 4291 say?", "ah": "100 ft from each side and the front and rear of the structure, but not beyond the property line except as provided in the law (PRC 4291)."}, {"n": 4, "q": "Under 4291, where does the most intense fuel reduction happen, and what's required closest to the structure?", "a": "Between 5 and 30 ft from the structure. Within 5 ft, an ember-resistant zone per Board regulations (PRC 4291).", "qh": "Under 4291, where does the most intense fuel reduction happen, and what's required closest to the structure?", "ah": "Between 5 and 30 ft from the structure. Within 5 ft, an ember-resistant zone per Board regulations (PRC 4291)."}, {"n": 5, "q": "On an inspection you find a pine with limbs 6 ft from a chimney outlet and pine needles on the roof. Which 4291 requirements are violated?", "a": "Any portion of a tree within 10 ft of a chimney or stovepipe outlet must be removed. The roof must be kept free of leaves, needles, and other vegetation (PRC 4291).", "qh": "On an inspection you find a pine with limbs 6 ft from a chimney outlet and pine needles on the roof. Which 4291 requirements are violated?", "ah": "Any portion of a tree within 10 ft of a chimney or stovepipe outlet must be removed. The roof must be kept free of leaves, needles, and other vegetation (PRC 4291)."}, {"n": 6, "q": "A homeowner asks if Zone 0 is enforceable on their existing home today. What's the status, where will Zone 0 apply, and what's the phase timeline?", "a": "As of the retrieved page, Zone 0 is approved by the Board but in final state review and not yet in effect. It will apply in the SRA and in Very High FHSZ in the LRA. New construction follows when the rules take effect. Existing homes get Phase 1 within 3 years and Phase 2 within 5 years (Ready for Wildfire). PRC 4291 likewise delays the ember zone for existing structures until three years after the new-structure date.", "qh": "A homeowner asks if Zone 0 is enforceable on their existing home today. What's the status, where will Zone 0 apply, and what's the phase timeline?", "ah": "As of the retrieved page, Zone 0 is approved by the Board but in final state review and not yet in effect. It will apply in the SRA and in Very High FHSZ in the LRA. New construction follows when the rules take effect. Existing homes get Phase 1 within 3 years and Phase 2 within 5 years (Ready for Wildfire). PRC 4291 likewise delays the ember zone for existing structures until three years after the new-structure date."}, {"n": 7, "q": "Walk a homeowner through Zone 1 and Zone 2 tasks, including grass height and wood piles.", "a": "Zone 1 (to 30 ft): remove dead fuels, keep 10 ft from chimneys, move wood piles to Zone 2, and keep 10 ft around outbuildings and LPG tanks. Zone 2 (30 to 100 ft): mow grass to 4 in max, space plants horizontally and vertically, leave no more than 3 in of leaves or needles, and keep wood piles 10 ft clear (Ready for Wildfire).", "qh": "Walk a homeowner through Zone 1 and Zone 2 tasks, including grass height and wood piles.", "ah": "Zone 1 (to 30 ft): remove dead fuels, keep 10 ft from chimneys, move wood piles to Zone 2, and keep 10 ft around outbuildings and LPG tanks. Zone 2 (30 to 100 ft): mow grass to 4 in max, space plants horizontally and vertically, leave no more than 3 in of leaves or needles, and keep wood piles 10 ft clear (Ready for Wildfire)."}, {"n": 8, "q": "A shrub is 4 ft tall under an oak. How much vertical space should there be between the shrub and the oak's lowest branches, at minimum?", "a": "At least 12 ft of vertical space between the shrub and the lowest branches, three times the shrub's height (3 × 4 ft). Separately, tree branches in Zones 1 and 2 must be at least 6 ft off the ground (Ready for Wildfire).", "qh": "A shrub is 4 ft tall under an oak. How much vertical space should there be between the shrub and the oak's lowest branches, at minimum?", "ah": "At least 12 ft of vertical space between the shrub and the lowest branches, three times the shrub's height (3 × 4 ft). Separately, tree branches in Zones 1 and 2 must be at least 6 ft off the ground (Ready for Wildfire)."}, {"n": 9, "q": "Why is OSFM taking public comment on SRA FHSZ maps from Nov 2026 to Jan 2027, when the SRA maps took effect in April 2024?", "a": "The Board of Forestry finished its statewide 5-Year <script>/* CAN Report: firefighter study skill tree. Vanilla JS, no dependencies. */

                               // "strict" = quiz disabled, node can't complete and blocks its dependents

  toolLabelZoom: 1.15,         // tool labels appear at or above this zoom

  ranks: [

  DATA.order.forEach(id => { const n = N[id]; n.x = n.vx; n.y = n.vy; n.angle = n.vangle; });

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------------- state ----------------
function blankState() { return { v: 1, read: {}, quiz: {}, reflections: {}, ui: { showNames: true, showAll: false } }; }
function migrate(s) {

}
function save() { availMemo = {}; try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(S)); } catch (e) { toast("Could not save progress (storage blocked)"); } }

// ---------------- rules (linear: unwritten content blocks what comes after it) ----------------
const hasContent = id => !!N[id].hasContent;
const isCap = id => N[id].kind === "capstone";

// ---------------- points ----------------
function nodePoints(id) { const k = N[id].kind; return k === "tool" ? CONFIG.points.tool : k === "capstone" ? CONFIG.points.capstone : CONFIG.points.taskGroup; }
const dayNum = ts => { const d = new Date(ts); return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); };
// Streak from entry timestamps (local calendar days; several entries on one day count once).
function streakInfo(timestamps, now = Date.now()) {
  const L = CONFIG.REFLECTION_STREAK_DAYS, B = CONFIG.REFLECTION_STREAK_BONUS;
  const days = [...new Set(timestamps.map(dayNum))].sort((a, b) => a - b);
  let run = 0, prev = null, bonuses = 0, best = 0;
  for (const d of days) { run = prev !== null && d === prev + 1 ? run + 1 : 1; if (run % L === 0) bonuses++; best = Math.max(best, run); prev = d; }
  const today = dayNum(now);
  const current = prev !== null && (prev === today || prev === today - 1) ? run : 0; // a missed calendar day resets to 0

const PHONE = { dx: 100, zig: 88 };
function applyLayout(phone) {
  DATA.order.forEach(id => { N[id].x = ORIG[id].x; N[id].y = ORIG[id].y; });
  if (!phone) return;
  const row = DATA.paths.find(p => p.id === "01").nodes.filter(x => x !== CONFIG.rootId);
  const move = (id, dx, dy) => { N[id].x += dx; N[id].y += dy; N[id].children.forEach(c => { N[c].x += dx; N[c].y += dy; }); };
  row.forEach((id, i) => move(id, (i - (row.length - 1) / 2) * PHONE.dx - ORIG[id].x, i % 2 ? PHONE.zig : 0));
  DATA.order.forEach(id => { if (N[id].path !== "01") N[id].y += PHONE.zig; });
}

// ---------------- quiz ----------------
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function distractors(id, qa, k) {
  const same = N[id].doc.qa.filter(x => x !== qa).map(x => x.ah);
  const path = DATA.order.filter(o => o !== id && N[o].doc && N[o].path === N[id].path).flatMap(o => N[o].doc.qa.map(x => x.ah));
  const all = DATA.order.filter(o => o !== id && N[o].doc && N[o].path !== N[id].path).flatMap(o => N[o].doc.qa.map(x => x.ah));
  const out = [], seen = new Set([qa.ah.toLowerCase()]);
  for (const pool of [shuffle(same), shuffle(path), shuffle(all)]) for (const a of pool) {
    if (out.length >= k) return out; const key = a.toLowerCase(); if (seen.has(key)) continue; seen.add(key); out.push(a);
  }

}
let Q = null;
function startQuiz(id) {

  const qs = shuffle(N[id].doc.qa).map(qa => ({ qa, choices: shuffle([{ h: qa.ah, ok: true }, ...distractors(id, qa, CONFIG.quizChoices - 1).map(h => ({ h, ok: false }))]) }));

function renderQuiz() {
  const { id, qs, i } = Q, it = qs[i];

    <div class="qnum">Question ${i + 1} of ${qs.length} · ${Q.right} correct · pass at ${Math.round(CONFIG.passThreshold * 100)}%</div>
    <div class="qprog"><div style="width:${i / qs.length * 100}%"></div></div>
    <div class="q"><span class="qtext">${it.qa.qh}</span>${coinBtn('data-coin-quiz="1"', "Challenge this question or its answer")}</div>
    ${it.choices.map((c, k) => `<button class="choice" data-k="${k}">${String.fromCharCode(65 + k)}. ${c.h}</button>`).join("")}

    <div class="actions" style="position:static;border:0"><button class="btn" data-act="back">Quit quiz</button></div></div>`;

function answer(k) {
  if (Q.answered) return; Q.answered = true;
  const it = Q.qs[Q.i], ok = it.choices[k].ok; if (ok) Q.right++;

  const last = Q.i === Q.qs.length - 1;
  $("#fb").innerHTML = `<div class="fb ${ok ? "ok" : "no"}">${ok ? "✔ Correct." : "✘ Not quite."} <b>Answer:</b> ${it.qa.ah}</div>
    <button class="btn primary" id="nextQ">${last ? "See score" : "Next question"}</button>`;
  $("#nextQ").onclick = () => { if (last) finishQuiz(); else { Q.i++; Q.answered = false; renderQuiz(); } };

function finishQuiz() {
  const { id, qs, right } = Q, score = right / qs.length, pass = score >= CONFIG.passThreshold - 1e-9;
  const before = points(), wasDone = new Set(DATA.order.filter(completed)), wasAvail = new Set(DATA.order.filter(x => available(x) && hasContent(x))), wasPerfect = perfect(id);
  const prev = S.quiz[id] || { best: 0, attempts: 0, passed: false };
  S.quiz[id] = { best: Math.max(prev.best, score), attempts: prev.attempts + 1, passed: prev.passed || pass, last: score, lastAt: Date.now(), passedAt: prev.passedAt || (pass ? Date.now() : undefined) };
  save(); refreshMap();
  const gained = points() - before;
  const newDone = DATA.order.filter(x => completed(x) && !wasDone.has(x));
  const newly = DATA.order.filter(x => hasContent(x) && available(x) && !wasAvail.has(x));
  body.innerHTML = `<div id="quiz" class="quiz"><div class="p-id">${esc(id)} · QUIZ RESULT</div><h2>${esc(shortName(N[id]))}</h2>
    <div class="score">${Math.round(score * 100)}%</div><div class="muted">${right} of ${qs.length} correct · best ${Math.round(S.quiz[id].best * 100)}%</div>
    <div class="fb ${pass ? "ok" : "no"}">${pass ? "Passed. Node completed." : `Below ${Math.round(CONFIG.passThreshold * 100)}%. Review the doc and try again.`}${gained ? ` <b>+${gained} Class Points</b>` : ""}</div>
    ${!wasPerfect && perfect(id) ? `<div class="fb ok">★ <b>Perfect</b> badge earned.</div>` : ""}

    ${q ? `<div class="chq"><div><b>Question ${esc(draft.questionNumber)}:</b> ${esc(draft.questionText)}</div><div><b>Answer shown:</b> ${esc(draft.answerText)}</div></div>`

    <label for="coinNote" class="lbl" style="display:block;margin-top:10px">What do you think is wrong?</label>
    <textarea id="coinNote" placeholder="e.g. the manual says…, my department teaches…, the number looks outdated…"></textarea>
    <div class="actions" style="position:static;border:0"><button class="btn ember" id="coinSave">Save</button><button class="btn" id="coinCancel">Cancel</button></div>
    <p class="muted small">Saved on this device only. Export them from Options › Challenges to send for review.</p></div>`;
  $("#modal").hidden = false; setTimeout(() => $("#coinNote").focus(), 30);
  $("#coinCancel").onclick = () => { pendingCh = null; $("#modal").hidden = true; };
  $("#coinSave").onclick = () => {
    const note = $("#coinNote").value.trim(); if (!note) return toast("Say what you think is wrong");
    const c = { id: newCode(pendingCh.nodeId), ...pendingCh, note, createdAt: new Date().toISOString(), status: "open" };
    C.push(c); saveChallenges(); pendingCh = null; $("#modal").hidden = true; hideFloat(); toast("Challenge Coin saved");
    if (current && $("#panel .doc") && current === c.nodeId) { const y = panel.scrollTop; renderNode(current); panel.scrollTop = y; }
    renderStats();
  };
}
const baseDraft = (id, kind) => ({ nodeId: id, nodeTitle: nodeTitle(id), kind, section: null, passage: "", questionNumber: null, questionText: null, answerText: null });
// section header fallback (pre-fills the whole section text)
panel.addEventListener("click", e => {
  const b = e.target.closest("[data-coin-sec]"); if (b && current) {
    e.stopPropagation(); const sec = b.closest(".dsec");
    return openChallenge({ ...baseDraft(current, "doc"), section: sec.dataset.sec, passage: sec.querySelector(".dsec-body").innerText.trim() });
  }
  const q = e.target.closest("[data-coin-quiz]"); if (q && Q) {
    e.stopPropagation(); const qa = Q.qs[Q.i].qa;
    return openChallenge({ ...baseDraft(Q.id, "quiz"), section: "Study questions", passage: qa.q, questionNumber: qa.n, questionText: qa.q, answerText: qa.a });
  }
}, true);
// text selection inside the doc -> floating Challenge Coin button (mouse or mobile long-press selection)
const floatBtn = document.createElement("button");
floatBtn.id = "coinFloat"; floatBtn.type = "button"; floatBtn.className = "btn ember"; floatBtn.hidden = true;
floatBtn.innerHTML = `<span class="coin"><span>C</span></span> Challenge Coin`;
document.body.appendChild(floatBtn);
let selDraft = null;
function hideFloat() { floatBtn.hidden = true; selDraft = null; }
function onSelection() {
  const sel = window.getSelection(); const txt = sel && !sel.isCollapsed ? sel.toString().trim() : "";
  if (!txt || !current) return hideFloat();
  const node = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
  const doc = node && node.closest && node.closest("#panel .doc"); if (!doc) return hideFloat();
  const sec = node.closest(".dsec"), r = sel.getRangeAt(0).getBoundingClientRect();

  floatBtn.hidden = false;
  const top = r.top > 60 ? r.top - 44 : r.bottom + 8;
  floatBtn.style.top = Math.max(8, Math.min(window.innerHeight - 50, top)) + "px";

}
let selT; document.addEventListener("selectionchange", () => { clearTimeout(selT); selT = setTimeout(onSelection, 120); });
floatBtn.addEventListener("pointerdown", e => e.preventDefault()); // keep the selection while tapping
floatBtn.addEventListener("click", () => { if (selDraft) { const d = selDraft; hideFloat(); openChallenge(d); } });

function challengesMd() {
  const groups = {}; C.forEach(c => (groups[c.nodeId] = groups[c.nodeId] || []).push(c));
  const ids = Object.keys(groups).sort((a, b) => DATA.order.indexOf(a) - DATA.order.indexOf(b));
  const L = [`# CAN Report: Challenge Coins`, "", `Exported ${new Date().toISOString()} · ${C.length} challenge${C.length === 1 ? "" : "s"} across ${ids.length} node${ids.length === 1 ? "" : "s"}.`,
    "Each entry is a user flag on study content. Verify against the cited sources before changing a doc.", ""];
  ids.forEach(id => {
    L.push(`## ${id} ${groups[id][0].nodeTitle.replace(new RegExp("^" + id.replace(/\./g, "\\.") + "\\s*"), "")}`, "");
    groups[id].forEach(c => {
      const v = verdict(c);
      L.push(`### ${c.id}`, `- Kind: ${c.kind === "quiz" ? "quiz question" : "doc text"}${c.section ? ` · Section: ${c.section}` : ""}`, `- Created: ${c.createdAt}`, `- Status: ${chStatus(c)}${v && v.note ? ` (${v.note})` : ""}`);
      if (c.kind === "quiz") L.push(`- Question ${c.questionNumber}: ${c.questionText}`, `- Answer shown: ${c.answerText}`);
      else L.push("", ...c.passage.split("\n").map(x => "> " + x));
      L.push("", `**What's wrong:** ${c.note}`, "");
    });
  });
  return L.join("\n");
}
// Coin case: one flip coin per accepted challenge. Recognition only: never feeds points() or rank.
const flipped = new Set();
const COIN_EMBLEM = `<svg viewBox="-50 -50 100 100" aria-hidden="true" focusable="false"><circle r="44" fill="none" stroke="currentColor" stroke-width="2" opacity=".55"/>
  <path d="M0,-38 L38,0 L0,38 L-38,0Z" fill="none" stroke="currentColor" stroke-width="2.2" opacity=".8"/><circle r="28" fill="rgba(60,36,6,.22)" stroke="currentColor" stroke-width="2.5"/>
  ${[0, 90, 180, 270].map(a => `<path d="M0,-4 L-10,-23 Q0,-17 10,-23 Z" fill="currentColor" transform="rotate(${a})"/>`).join("")}<circle r="6" fill="rgba(60,36,6,.45)" stroke="currentColor" stroke-width="1.6"/></svg>`;
function fmtDay(d) { if (!d) return "date not recorded"; const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d);
  const x = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(d); return isNaN(x) ? String(d) : x.toLocaleDateString(undefined, { dateStyle: "medium" }); }
function acceptedCoins() { return C.filter(c => chStatus(c) === "accepted").map(c => {
  const n = N[c.nodeId]; return { id: c.id, nodeId: c.nodeId, title: n ? shortName(n) : (c.nodeTitle || ""), date: (verdict(c) || {}).date || "" }; }); }
function coinCase(where) {
  const coins = acceptedCoins();
  if (!coins.length) return `<div class="coincase empty" data-case="${where}"><span class="cc-empty">Earn a Challenge Coin when a challenge you submit is reviewed and accepted as a real fix.</span></div>`;
  return `<div class="coincase" data-case="${where}" role="list" aria-label="Challenge Coin case, ${coins.length} coin${coins.length === 1 ? "" : "s"}">${coins.map(c => {
    const on = flipped.has(where + ":" + c.id), day = fmtDay(c.date), cut = c.id.lastIndexOf("-", c.id.lastIndexOf("-") - 1);
    return `<span role="listitem"><button type="button" class="ccoin" data-cc="${esc(c.id)}" aria-pressed="${on}"
      aria-label="Challenge Coin ${esc(c.id)}, node ${esc(c.nodeId)} ${esc(c.title)}, accepted ${esc(day)}. Press to flip." title="${esc(c.id)} · ${esc(c.nodeId)} · accepted ${esc(day)}">
      <span class="ccoin-in"><span class="face front">${COIN_EMBLEM}<span class="cc-cap">CAN</span></span>
      <span class="face back"><span class="cc-id">${esc(c.id.slice(0, cut + 1))}<br>${esc(c.id.slice(cut + 1))}</span><span class="cc-node">${esc(c.nodeId)} ${esc(c.title)}</span><span class="cc-date">Accepted<br>${esc(day)}</span></span></span></button></span>`; }).join("")}</div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest(".ccoin"); if (!b) return;
  const key = b.closest(".coincase").dataset.case + ":" + b.dataset.cc, on = b.getAttribute("aria-pressed") !== "true";
  on ? flipped.add(key) : flipped.delete(key); b.setAttribute("aria-pressed", String(on));
});

function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function exportChallenges() {
  download("challenges.json", JSON.stringify({ app: "CAN Report", kind: "challenge-coins", exported: new Date().toISOString(), challenges: C }, null, 2), "application/json");
  setTimeout(() => download("challenges.md", challengesMd(), "text/markdown"), 400);
}
async function copyChallenges() {
  const t = challengesMd();
  try { await navigator.clipboard.writeText(t); toast("Copied as text"); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("Copied as text"); } catch (e2) { toast("Copy failed"); } ta.remove(); }
}
async function shareChallenges() {
  const t = challengesMd(), f = typeof File === "function" ? new File([t], "challenges.md", { type: "text/markdown" }) : null;
  try {
    if (f && navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ title: "CAN Report challenges", files: [f], text: "CAN Report Challenge Coins" });
    else await navigator.share({ title: "CAN Report challenges", text: t });
  } catch (e) { if (e && e.name !== "AbortError") toast("Share failed"); }
}
function showChallengesView() {
  const groups = {}; C.forEach((c, i) => (groups[c.nodeId] = groups[c.nodeId] || []).push({ c, i }));
  const ids = Object.keys(groups).sort((a, b) => DATA.order.indexOf(a) - DATA.order.indexOf(b));
  const cnt = st => C.filter(c => chStatus(c) === st).length;
  $("#modalBody").innerHTML = `<div id="chView"><h2>Challenges</h2>
    <div class="cc-head"><b>◉ Challenge Coins: ${coinsEarned()}</b>${coinCase("view")}</div>
    <p class="muted">${C.length} total · ${cnt("open")} open · ${cnt("accepted")} accepted · ${cnt("rejected")} rejected</p>
    <div class="row-btns" style="max-width:520px"><button class="btn ember" id="chExport" ${C.length ? "" : "disabled"}>Export challenges</button><button class="btn" id="chCopy" ${C.length ? "" : "disabled"}>Copy as text</button>${navigator.share ? `<button class="btn" id="chShare" ${C.length ? "" : "disabled"}>Share…</button>` : ""}</div>
    ${ids.map(id => `<h3 class="chnode"><span class="chip" data-go="${esc(id)}">${esc(id)}</span> ${esc(shortName(N[id]))}</h3>` + groups[id].map(({ c, i }) => { const v = verdict(c), stt = chStatus(c);
      return `<div class="entry"><div class="meta"><span><span class="badge ch-${stt}">${stt}</span>${c.kind === "quiz" ? `Quiz Q${esc(c.questionNumber)}` : `Doc · ${esc(c.section || "")}`} · ${esc(fmt(c.createdAt))}</span><button class="linkbtn" data-chdel="${i}">delete</button></div>
        <div class="pr">${c.kind === "quiz" ? esc(c.questionText) + `<br><span class="muted">Answer shown: ${esc(c.answerText)}</span>` : "“" + esc(c.passage.length > 280 ? c.passage.slice(0, 280) + "…" : c.passage) + "”"}</div>
        <div class="tx">${esc(c.note)}</div>${v && v.note ? `<div class="muted small">Reviewer: ${esc(v.note)}${v.date ? " · " + esc(v.date) : ""}</div>` : ""}<div class="muted small">${esc(c.id)}</div></div>`; }).join("")).join("")
      || '<p class="muted">No challenges yet. Select text in a doc (or tap the coin on a section header or quiz question) to flag something you think is wrong.</p>'}</div>`;
  $("#modal").hidden = false;
  const ex = $("#chExport"); if (ex) ex.onclick = exportChallenges;
  const cp = $("#chCopy"); if (cp) cp.onclick = copyChallenges;
  const sh = $("#chShare"); if (sh) sh.onclick = shareChallenges;
}
document.addEventListener("click", e => {
  const d = e.target.closest("[data-chdel]"); if (!d) return;
  if (!confirm("Delete this challenge?")) return;
  C.splice(+d.dataset.chdel, 1); saveChallenges(); showChallengesView(); renderStats(); if (current && $("#panel .doc")) renderNode(current);
});

// ---------------- options ----------------
const showNames = $("#showNames"), showAll = $("#showAll");
function syncToggles() { showNames.checked = !!S.ui.showNames; showAll.checked = !!S.ui.showAll; }
syncToggles();
showNames.onchange = () => { S.ui.showNames = showNames.checked; save(); refreshMap(); };
showAll.onchange = () => { S.ui.showAll = showAll.checked; save(); refreshMap(); };
$("#optToggle").onclick = () => { const b = $("#optBody"); b.classList.toggle("closed"); $("#optToggle").setAttribute("aria-expanded", !b.classList.contains("closed")); };
const pf = $("#pathFilter");
DATA.paths.forEach(p => { const o = document.createElement("option"); o.value = p.id; o.textContent = p.id + " " + p.name.replace(/^(PATH|ROOT):\s*/, ""); pf.appendChild(o); });
function inFilter(id) { const f = pf.value; return !f || N[id].path === f || (f !== "01" && id === CONFIG.rootId); }
function applyFilter() {
  const f = pf.value;
  DATA.order.forEach(id => { const on = inFilter(id); nodeEls[id].classList.toggle("dim", !on); (labelEls[id] || []).forEach(l => l.classList.toggle("dim", !on)); });
  edgeEls.forEach(({ e, from, to }) => e.classList.toggle("dim", !!f && !(inFilter(from) && inFilter(to))));
  xEls.forEach(({ e, a, b }) => e.classList.toggle("dim", !!f && N[a].path !== f && N[b].path !== f));
}
const filtered = () => pf.value ? DATA.order.filter(id => N[id].path === pf.value) : DATA.order;
pf.onchange = () => { applyFilter(); fit(filtered()); };
let hits = [], hitIdx = -1;
function runSearch(advance) {
  const q = $("#search").value.trim().toLowerCase();
  Object.values(nodeEls).forEach(g => g.classList.remove("hit"));
  if (!q) { hits = []; $("#searchInfo").textContent = ""; return; }
  const score = id => { const n = N[id]; if (id.toLowerCase() === q) return 3; if (id.toLowerCase().startsWith(q)) return 2;
    const hay = (n.name + " " + (n.doc ? n.doc.title : "")).toLowerCase(); if (hay.includes(q)) return 1;
    if (n.doc && n.doc.sections.some(s => s.html.toLowerCase().includes(q))) return 0.5; return 0; };
  const prev = hits.join(); hits = DATA.order.map(id => [id, score(id)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  hits.forEach(id => nodeEls[id].classList.add("hit"));
  if (!hits.length) { $("#searchInfo").textContent = "No match"; return; }
  if (advance) { hitIdx = prev === hits.join() ? (hitIdx + 1) % hits.length : 0; const id = hits[hitIdx];
    centerOn(id, Math.max(V.k, 1.3)); const g = nodeEls[id]; g.classList.remove("pulse"); void g.getBBox(); g.classList.add("pulse"); setTimeout(() => g.classList.remove("pulse"), 3200);
    $("#searchInfo").textContent = `${hitIdx + 1} of ${hits.length}: ${id} ${shortName(N[id]).slice(0, 28)}`; }
  else $("#searchInfo").textContent = `${hits.length} match${hits.length > 1 ? "es" : ""}, press Search to jump`;
}
$("#search").addEventListener("input", () => runSearch(false));
$("#searchForm").addEventListener("submit", e => { e.preventDefault(); runSearch(true); });
$("#fitBtn").onclick = () => fit(filtered());
$("#reflectBtn").onclick = showReflectionsView;
$("#challengesBtn").onclick = showChallengesView;
$("#resetBtn").onclick = () => {
  if (!confirm("Reset ALL progress? This clears points, quiz scores and reflections on this device. Export first if you want a backup.")) return;
  const ui = S.ui; S = blankState(); S.ui = ui; save(); refreshMap(); if (current) renderNode(current); toast("Progress reset");
};
$("#exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify({ app: "CAN Report", exported: new Date().toISOString(), progress: S, challenges: C }, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `can-report-progress-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
};
$("#importBtn").onclick = () => $("#importFile").click();
$("#importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const j = JSON.parse(await f.text()), p = j.progress || j;
    if (!p || p.v !== 1 || typeof p.quiz !== "object") throw new Error("not a CAN Report progress file");
    if (!confirm("Replace current progress with the imported file?")) return;
    S = migrate(p); save(); if (Array.isArray(j.challenges)) { C = j.challenges; saveChallenges(); } syncToggles(); refreshMap(); if (current) renderNode(current); toast("Progress imported");
  } catch (err) { alert("Import failed: " + err.message); }
  e.target.value = "";
};
let toastT; function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); }

// ---------------- PWA (only when served over http(s); file:// stays a plain single file) ----------------
if (window.CAN_PWA && /^https?:$/.test(location.protocol)) {
  const add = (rel, href, extra = {}) => { const l = document.createElement("link"); l.rel = rel; l.href = href; Object.assign(l, extra); document.head.appendChild(l); };
  add("manifest", "manifest.webmanifest"); add("apple-touch-icon", "icons/apple-touch-icon.png");
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(err => console.warn("SW registration failed", err)));
}

// ---------------- boot ----------------
if (narrow()) { $("#optBody").classList.add("closed"); $("#optToggle").setAttribute("aria-expanded", "false"); }
const syncFooter = () => document.documentElement.style.setProperty("--footh", $("#disclaimer").offsetHeight + "px");
syncFooter(); window.addEventListener("resize", syncFooter);
applyLayout(VERT && narrow()); buildMap(); refreshMap();
window.matchMedia("(max-width: 720px)").addEventListener("change", e => { if (VERT) { applyLayout(e.matches); rebuildMap(); } defaultFit(false); });
// phone: fit the narrow top of the tree (root + 01 fundamentals row) to the screen width; drag down to follow the paths.
// desktop: fit the whole tree.
const topIds = () => DATA.order.filter(id => N[id].path === "01");
// horizontal phone: start zoomed on the root, the 01 column and the first path column; drag right to go deeper
const startIds = () => VERT ? topIds() : DATA.order.filter(id => N[id].x <= 450 && N[id].kind !== "tool" || N[id].path === "01");
const defaultFit = animate => pf.value ? fit(filtered(), animate) : narrow() ? fit(startIds(), animate, VERT) : fit(DATA.order, animate);
defaultFit(false);
let lastW = window.innerWidth;
window.addEventListener("resize", () => { if (Math.abs(window.innerWidth - lastW) > 40) { lastW = window.innerWidth; defaultFit(false); } });
if (location.hash && N[decodeURIComponent(location.hash.slice(1))]) setTimeout(() => openNode(decodeURIComponent(location.hash.slice(1))), 50);
window.CAN = { CONFIG, DATA, RANKS, VERT, quizTier, quizOK, get challenges() { return C.map(c => ({ ...c, status: chStatus(c) })); }, challengesMd, coinsEarned, acceptedCoins, rankFor, defaultFit, setView: (x, y, k) => setView(x, y, k, false), get state() { return S; }, status, available, completed, points, rankFor, streakInfo, dayNum, openNode, fit, get view() { return { ...V }; } };
