e now in <strong>NFPA 1930<\/strong> (per the ALCO-LITE handbook). NFPA standards are paywalled, so this sheet uses manufacturer and academy summaries."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 450.69, "y": -411.45, "angle": 74.5, "vx": -584.58, "vy": 464.02, "vangle": 319.5}, "03.1.2": {"id": "03.1.2", "name": "Ground Ladder Carries and Raises", "path": "03", "kind": "tool", "parent": "03.1", "prereqRaw": "parent 03.1", "children": [], "prereqs": ["03.1"], "unlocks": [], "cross": ["04.3"], "doc": {"title": "03.1.2 Ground Ladder Carries and Raises", "file": "03.1.2_Ground_Ladder_Carries_and_Raises.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>The standard ways to carry a ground ladder to the objective and raise it safely, with one or more firefighters.<\/p>"}, {"key": "specs", "title": "Key specs (common skills)", "html": "<ul><li><strong>Carries:<\/strong> low-shoulder carry and straight-arm carry, with one, two, or three firefighters.<\/li><li><strong>Raises:<\/strong> one-firefighter flat raise (single ladder), two-firefighter <strong>flat raise<\/strong>, two-firefighter <strong>beam raise<\/strong>, and three-firefighter beam raise.<\/li><li><strong>Commands (Connecticut Fire Academy):<\/strong> preparatory \"<strong>Prepare to raise<\/strong>\", then execution \"<strong>RAISE<\/strong>\".<\/li><li><strong>Placement:<\/strong> set the butt about <strong>¼ of the usable height<\/strong> from the building for a 75° angle.<\/li><li><strong>Who calls commands:<\/strong> the butt firefighter, for raising, extending, laying in, taking away, retracting, and lowering. Every action gets a preparatory call, then an execution call (CT Fire Academy):<ul><li>\"Prepare to Raise\" / \"RAISE\"<\/li><li>\"Prepare to Extend\" / \"EXTEND\"<\/li><li>\"Prepare to Lay It In\" / \"LAY IT IN\"<\/li><li>\"Prepare to Take Away\" / \"TAKE AWAY\"<\/li><li>\"Prepare to Retract\" / \"RETRACT\"<\/li><li>\"Prepare to Lower\" / \"LOWER\"<\/li><li>\"Prepare to Step Out\" / \"STEP OUT\"<\/li><\/ul><\/li><li><strong>Safety calls:<\/strong> \"Check for Obstructions\" (answered \"Clear\"), \"Fingers and Toes\", \"Dogs Locked\", and \"3, 2, 1 Building\".<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<p><strong>Before any raise:<\/strong> look up and <strong>check for overhead obstructions and wires<\/strong> as you approach.<\/p><p><strong>Two-firefighter flat raise (extension ladder):<\/strong><\/p><ol><li>Ladder flat on the ground, butt toward the building, at about ¼ of the usable height out.<\/li><li>The <strong>butt FF heels the ladder<\/strong>, standing on the bottom rung (or with toes against the beams), and leans back.<\/li><li>The <strong>tip FF<\/strong> lifts the tip, steps under, and walks it up hand over hand on the rungs or beams until it's vertical.<\/li><li>Pivot if needed so the <strong>fly is out<\/strong>. Extend the fly hand over hand with the halyard to the target height.<\/li><li><strong>Check that the pawls (dogs) are locked<\/strong>, lower the ladder gently onto the building, and <strong>tie the halyard<\/strong>.<\/li><\/ol><p><strong>Two-firefighter beam raise:<\/strong><\/p><ol><li>Set the ladder on its beam at about ¼ of the usable height out.<\/li><li>The butt FF heels it, with a foot at the lower beam and the other foot back as a counterweight, gripping the upper beam.<\/li><li>The tip FF raises it hand over hand to vertical, then the crew pivots so the fly faces out, extends, locks, and lays it in.<\/li><li><strong>Low-shoulder carry straight into a beam raise<\/strong> is called the most common carry and raise in the fire service (CT skill station 13.4.1).<\/li><\/ol><p><strong>Footing (heeling) the ladder:<\/strong> stand under or in front of the ladder and stay alert for falling debris. From behind, don't look up while others climb.<\/p><p><strong>One-firefighter flat raise:<\/strong> raise to vertical against the building, then pull the butt out to a <strong>75°<\/strong> climbing angle by lifting a lower rung while pushing an upper rung to keep the tip on the wall. Tie the halyard and check the tip and butt before climbing.<\/p><p><strong>Lowering:<\/strong> reverse the steps. Retract the fly first, then lower. <strong>Standard checks (CT Fire Academy Ground Ladders Manual):<\/strong><\/p><ul><li><strong>Check for Obstructions:<\/strong> called by the butt FF before spotting, raising, or lowering. Check overhead (wires, trees) and the ground (trip hazards, sprinkler heads, uneven terrain). Every firefighter on the ladder shares this job.<\/li><li><strong>Halyard grip:<\/strong> gloved hands, thumbs down, which forms a bite on the halyard for the safest pull.<\/li><li><strong>\"Fingers and Toes\":<\/strong> before extending or retracting, the tip FF keeps fingers out of the fly's path and everyone keeps toes out from under it.<\/li><li><strong>\"Dogs Locked\":<\/strong> before letting go of the halyard, the butt FF checks that the tip of each dog is visible. The tip FF confirms both dogs are over the rungs and answers \"Dogs Locked\".<\/li><li><strong>Laying it in:<\/strong> the tip FF calls \"3, 2, 1 Building\" as the tip nears the wall. The butt FF steps back, pushing the ladder's weight away from the building. The tip FF pulls the weight away too. Both keep resisting until the tip touches.<\/li><li><strong>Beam raise straight from the carry:<\/strong> done without setting the ladder down. The butt FF plants the spur, foots the bottom beam, and keeps the top beam tight to the inside knee while the tip FF raises it hand over hand.<\/li><li><strong>Lowering:<\/strong> the butt FF calls \"Prepare to Step Out\" as the tip FF reaches the 3rd rung from the tip.<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Wires and obstructions are the classic killer. Check every time.<\/li><li>Confirm the locks before anyone climbs. Heel or tie off the base and secure the tip.<\/li><li>Lift with your legs. In wind, the butt FF stays on the bottom rung until the tip FF has the ladder steady.<\/li><li>Never overload the ladder, and climb only within NFPA loading limits (see 03.1.1).<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Who gives the commands during a ladder raise, and why does every action get a preparatory call before the execution call?", "a": "The butt firefighter. The preparatory call (e.g., \"Prepare to Raise\") lets him confirm everyone is set before the execution call (\"RAISE\"), so no one is moving the ladder out of sync.", "qh": "Who gives the commands during a ladder raise, and why does every action get a preparatory call before the execution call?", "ah": "The butt firefighter. The preparatory call (e.g., \"Prepare to Raise\") lets him confirm everyone is set before the execution call (\"RAISE\"), so no one is moving the ladder out of sync."}, {"n": 2, "q": "Before spotting or raising, what does \"Check for Obstructions\" cover, and who is responsible for it?", "a": "Overhead hazards like wires and trees, and ground hazards like trip hazards, sprinkler heads, and uneven terrain. The butt FF calls it and the area must be confirmed \"Clear\", but every firefighter carrying the ladder is responsible.", "qh": "Before spotting or raising, what does \"Check for Obstructions\" cover, and who is responsible for it?", "ah": "Overhead hazards like wires and trees, and ground hazards like trip hazards, sprinkler heads, and uneven terrain. The butt FF calls it and the area must be confirmed \"Clear\", but every firefighter carrying the ladder is responsible."}, {"n": 3, "q": "Just before the fly is extended, the butt FF calls \"Fingers and Toes\". What hazard is this preventing?", "a": "Crushed fingers and toes. The moving fly section can catch fingers wrapped around the rungs or beams and feet placed under its path.", "qh": "Just before the fly is extended, the butt FF calls \"Fingers and Toes\". What hazard is this preventing?", "ah": "Crushed fingers and toes. The moving fly section can catch fingers wrapped around the rungs or beams and feet placed under its path."}, {"n": 4, "q": "How should you grip the halyard, and why?", "a": "Gloved, with both thumbs down. That forms a bite on the halyard and is the safest grasp to pull.", "qh": "How should you grip the halyard, and why?", "ah": "Gloved, with both thumbs down. That forms a bite on the halyard and is the safest grasp to pull."}, {"n": 5, "q": "The fly is at the target height. Describe the \"Dogs Locked\" check: who looks at what, and what must not happen until it's done?", "a": "Before the butt FF releases the halyard, he checks that the tip of each dog (pawl) is visible. The tip FF confirms both dogs are over the rungs and calls \"Dogs Locked\". Only then is the halyard released. A dog that isn't seated can let the fly drop.", "qh": "The fly is at the target height. Describe the \"Dogs Locked\" check: who looks at what, and what must not happen until it's done?", "ah": "Before the butt FF releases the halyard, he checks that the tip of each dog (pawl) is visible. The tip FF confirms both dogs are over the rungs and calls \"Dogs Locked\". Only then is the halyard released. A dog that isn't seated can let the fly drop."}, {"n": 6, "q": "In a two-firefighter flat raise, what does the butt firefighter do, and when may he step off the bottom rung?", "a": "He heels the ladder, standing on the bottom rung (or with toes against the beams) and leaning back as a counterweight, while the tip FF walks it up. He stays on the bottom rung until the tip FF has the vertical ladder stabilized.", "qh": "In a two-firefighter flat raise, what does the butt firefighter do, and when may he step off the bottom rung?", "ah": "He heels the ladder, standing on the bottom rung (or with toes against the beams) and leaning back as a counterweight, while the tip FF walks it up. He stays on the bottom rung until the tip FF has the vertical ladder stabilized."}, {"n": 7, "q": "Describe how a raised ladder is laid in against the building and why both firefighters resist its weight.", "a": "On \"LAY IT IN\", the butt FF steps back with the foot on the rung, pushing the weight away from the building, and the tip FF pulls the weight away. The tip calls \"3, 2, 1 Building\". Both resist until the tip touches, so the ladder doesn't fall into the wall out of control.", "qh": "Describe how a raised ladder is laid in against the building and why both firefighters resist its weight.", "ah": "On \"LAY IT IN\", the butt FF steps back with the foot on the rung, pushing the weight away from the building, and the tip FF pulls the weight away. The tip calls \"3, 2, 1 Building\". Both resist until the tip touches, so the ladder doesn't fall into the wall out of control."}, {"n": 8, "q": "In the low-shoulder carry to beam raise (the most common carry and raise), how does the butt firefighter anchor the ladder at the spotting point?", "a": "He plants the spur into the ground at the spot, foots the bottom beam with his inside foot, and keeps the top beam tight against his inside knee. The tip FF raises it hand over hand. The ladder never gets set down between the carry and the raise.", "qh": "In the low-shoulder carry to beam raise (the most common carry and raise), how does the butt firefighter anchor the ladder at the spotting point?", "ah": "He plants the spur into the ground at the spot, foots the bottom beam with his inside foot, and keeps the top beam tight against his inside knee. The tip FF raises it hand over hand. The ladder never gets set down between the carry and the raise."}, {"n": 9, "q": "Working alone with a single ladder, how do you get from vertical against the wall to a safe climbing angle?", "a": "Raise it vertical against the building. Then pull the butt out by lifting a lower rung while pushing an upper rung, keeping the tip on the wall, until the ladder is at about 75° (butt out about ¼ of the working height). Check the tip and butt before climbing.", "qh": "Working alone with a single ladder, how do you get from vertical against the wall to a safe climbing angle?", "ah": "Raise it vertical against the building. Then pull the butt out by lifting a lower rung while pushing an upper rung, keeping the tip on the wall, until the ladder is at about 75° (butt out about ¼ of the working height). Check the tip and butt before climbing."}], "sources": [{"label": "NYS DHSES skill sheets (one-FF flat raise, two-FF flat raise and halyard tie, two-FF beam raise)", "url": "https://www.sullivanny.gov/sites/default/files/departments/bof/Web%20page%20material/BOF%20BEFO%20skill%20sheets.pdf"}, {"label": "Connecticut Fire Academy Ground Ladder Manual", "url": "https://portal.ct.gov/cfpc/-/media/cfpc/pj-norwood/ground-ladder-manual.pdf"}, {"label": "CT Fire Academy Skill Sheet 13.2.4 (two-FF 28' flat raise)", "url": "https://portal.ct.gov/-/media/CFPC/files/NEW-ITEMS-2019/Uploaded-Files/Instructor-Lesson-Plans/Uploaded-Files/Unit-13/Skill-Sheet-1324.pdf"}, {"label": "CT Skill Station 13.4.1 (beam raise from carry)", "url": "https://portal.ct.gov/-/media/CFPC/files/NEW-ITEMS-2019/Uploaded-Files/Instructor-Lesson-Plans/Uploaded-Files/Unit-13/Skill-Sheet-1341.pdf"}, {"label": "ALCO-LITE Fire Ladder Safety Handbook", "url": "https://www.fireladder.com/wp-content/uploads/2025/01/Fire-hand-Book.pdf"}, {"label": "CT Fire Academy Ground Ladders Manual (rev. 08/31/2018), commands, halyard grip, Dogs Locked, and laying in (same PDF as above)", "url": ""}, {"label": "CT Skill Station 13.4.1 (rev. 07/22/13), low-shoulder carry to beam raise steps (same PDF as above)", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 03 Truck &gt; 03.1 Ground Ladders &gt; node 2. <strong>Unlocks after:<\/strong> 03.1.1 Types, Inspection, and Testing. <strong>Unlocks:<\/strong> 03.4 Search and Rescue, 03.3 Roof Ventilation (planned). <strong>Cross-links:<\/strong> 04.3 Firefighter Removal.", "note_html": "Study aid only, summarized from state fire-academy skill sheets that follow IFSTA <em>Essentials<\/em> and NFPA 1001 (Firefighter I/II, 5.3.6). Train hands-on with an instructor."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 429.31, "y": -411.45, "angle": 105.5, "vx": -575.55, "vy": 483.4, "vangle": 350.5}, "03.2": {"id": "03.2", "name": "Forcible Entry and Hand Tools", "path": "03", "kind": "main", "parent": null, "prereqRaw": "01.4", "children": ["03.2.1", "03.2.2"], "prereqs": ["01.4"], "unlocks": ["03.2.1", "03.2.2", "03.3", "03.C", "04.4"], "cross": ["04.4", "05.2.3", "05.2.0"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 640, "y": -450.0, "vx": -615.0, "vy": 640, "vangle": null}, "03.2.1": {"id": "03.2.1", "name": "Halligan and Irons", "path": "03", "kind": "tool", "parent": "03.2", "prereqRaw": "parent 03.2", "children": [], "prereqs": ["03.2"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 650.69, "y": -411.45, "angle": 74.5, "vx": -584.58, "vy": 614.02, "vangle": 319.5}, "03.2.2": {"id": "03.2.2", "name": "Holmatro T1 Forcible Entry Tool", "path": "03", "kind": "tool", "parent": "03.2", "prereqRaw": "parent 03.2", "children": [], "prereqs": ["03.2"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 629.31, "y": -411.45, "angle": 105.5, "vx": -575.55, "vy": 633.4, "vangle": 350.5}, "03.3": {"id": "03.3", "name": "Ventilation and Rescue Saws", "path": "03", "kind": "main", "parent": null, "prereqRaw": "03.1, 03.2", "children": ["03.3.1", "03.3.2", "03.3.3"], "prereqs": ["03.1", "03.2"], "unlocks": ["03.3.1", "03.3.2", "03.3.3", "03.C", "04.4"], "cross": ["04.4"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 840, "y": -450.0, "vx": -615.0, "vy": 790, "vangle": null}, "03.3.1": {"id": "03.3.1", "name": "Husqvarna K 770 Rescue", "path": "03", "kind": "tool", "parent": "03.3", "prereqRaw": "parent 03.3", "children": [], "prereqs": ["03.3"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 860.6, "y": -415.71, "angle": 59.0, "vx": -592.63, "vy": 756.84, "vangle": 304.0}, "03.3.2": {"id": "03.3.2", "name": "STIHL MS 462 C-M R Rescue", "path": "03", "kind": "tool", "parent": "03.3", "prereqRaw": "parent 03.3", "children": [], "prereqs": ["03.3"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 840.0, "y": -410.0, "angle": 90.0, "vx": -578.75, "vy": 773.1, "vangle": 335.0}, "03.3.3": {"id": "03.3.3", "name": "Husqvarna 565/572 XP", "path": "03", "kind": "tool", "parent": "03.3", "prereqRaw": "parent 03.3", "children": [], "prereqs": ["03.3"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 819.4, "y": -415.71, "angle": 121.0, "vx": -575.22, "vy": 794.18, "vangle": 6.0}, "03.4": {"id": "03.4", "name": "Search and Victim Removal", "path": "03", "kind": "main", "parent": null, "prereqRaw": "03.1, 01.2", "children": [], "prereqs": ["03.1", "01.2"], "unlocks": ["03.C"], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1040, "y": -450.0, "vx": -615.0, "vy": 940, "vangle": null}, "03.5": {"id": "03.5", "name": "Aerial Devices (operations overview)", "path": "03", "kind": "main", "parent": null, "prereqRaw": "03.1, 08.1", "children": ["03.5.1", "03.5.2"], "prereqs": ["03.1", "08.1"], "unlocks": ["03.5.1", "03.5.2", "03.C", "08.5"], "cross": ["08.5"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1240, "y": -450.0, "vx": -615.0, "vy": 1090, "vangle": null}, "03.5.1": {"id": "03.5.1", "name": "E-ONE Rear-Mount Aluminum Ladder", "path": "03", "kind": "tool", "parent": "03.5", "prereqRaw": "parent 03.5", "children": [], "prereqs": ["03.5"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1250.69, "y": -411.45, "angle": 74.5, "vx": -584.58, "vy": 1064.02, "vangle": 319.5}, "03.5.2": {"id": "03.5.2", "name": "Sutphen SL100 / 110-112 Aerials", "path": "03", "kind": "tool", "parent": "03.5", "prereqRaw": "parent 03.5", "children": [], "prereqs": ["03.5"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1229.31, "y": -411.45, "angle": 105.5, "vx": -575.55, "vy": 1083.4, "vangle": 350.5}, "03.C": {"id": "03.C", "name": "CAPSTONE: Truck Company Specialist", "path": "03", "kind": "capstone", "parent": null, "prereqRaw": "03.1 to 03.5", "children": [], "prereqs": ["03.1", "03.2", "03.3", "03.4", "03.5"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1640, "y": -450.0, "vx": -615.0, "vy": 1390, "vangle": null}, "04.1": {"id": "04.1", "name": "Mayday, Self-Survival and Air Management", "path": "04", "kind": "main", "parent": null, "prereqRaw": "01.2, 09.1.1", "children": [], "prereqs": ["01.2", "09.1.1"], "unlocks": ["04.2", "04.C"], "cross": ["01.2", "09.1.1", "09.1.2", "09.1.4"], "doc": {"title": "04.1 Mayday, Self-Survival and Air Management", "file": "04.1_Mayday_Self-Survival_and_Air_Management.md", "sections": [{"key": "what", "title": "What it is", "html": "<p><strong>Mayday<\/strong> is the radio word for a member in a life-threatening situation who needs immediate help. <strong>Self-survival<\/strong> means the actions you take yourself to stay alive until you get out or RIT reaches you. <strong>Air management<\/strong> means having enough air to do the job <strong>and<\/strong> get out with your reserve still in the cylinder. NIOSH found failures in all three in recent out-of-air deaths (FACE F2020-10, F2021-10, F2023-10).<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<p><strong>Air (NIOSH 2026-104 and FACE F2020-10):<\/strong><\/p><ul><li><strong>Rule:<\/strong> be trained to <strong>exit the IDLH before you start using your reserve air<\/strong> (NIOSH 2026-104, citing NFPA 1550 and NFPA 1400). NIOSH F2020-10: leave <strong>before the low-air alarm activates<\/strong>.<\/li><li><strong>Working and exiting air:<\/strong> the first <strong>67%<\/strong> of the supply covers getting in, doing the work, and getting out (F2020-10). A low-air alarm means you're <strong>into reserve<\/strong>. It requires immediate action by you <strong>and your crew<\/strong>.<\/li><li><strong>Real duration:<\/strong> SCBA ratings assume <strong>40 L/min<\/strong>. Working firefighters can breathe close to <strong>100 L/min<\/strong>. A \"30-minute\" <strong>1200 L<\/strong> cylinder lasts an average working firefighter about <strong>15–18 minutes<\/strong> (F2020-10). Hard work can cut service time by 50% or more.<\/li><li><strong>Service time also drops with:<\/strong> poor fitness, fear or excitement, little training, a cylinder not fully charged, a poor facepiece fit, a worn-out SCBA, and pressure (at 2 atmospheres, duration is halved).<\/li><li><strong>Officer's job:<\/strong> estimate the crew's exit time from the member with the <strong>highest<\/strong> air use. <strong>Your job:<\/strong> keep checking and reporting your own air (F2020-10).<\/li><li><strong>HUD:<\/strong> NIOSH found that the heads-up display is often ignored, and the end-of-service alarm (EOSTI) may be the first air warning a firefighter notices (F2020-10).<\/li><li><strong>SCBA load on the body (2026-104):<\/strong> up to <strong>40 lb<\/strong> of added weight and harder breathing. That means faster fatigue, hyperventilation, claustrophobia, <strong>higher air use<\/strong>, heat illness, and heart strain.<\/li><li><strong>Readiness (2026-104):<\/strong> medical clearance before fit testing (OSHA 29 CFR 1910.134). <strong>Annual fit test<\/strong>, and a new one after big weight changes or facial surgery. <strong>Clean-shaven<\/strong> where the mask seals. Train on the <strong>same make and model<\/strong> you'll use on the fireground.<\/li><\/ul><p><strong>Mayday triggers and timing:<\/strong><\/p><ul><li>Call Mayday when you're <strong>lost, disoriented, trapped, injured, or low or out of air<\/strong> (NIOSH 2009-100; F2020-10).<\/li><li><strong>Separated from your crew:<\/strong> try the radio. If you aren't reconnected after <strong>3 radio attempts or within 1 minute<\/strong>, call Mayday. If conditions are getting worse fast, call it <strong>immediately<\/strong>. The same rule applies to an officer or partner missing a member (F2020-10, citing IAFC 2021).<\/li><li>A Mayday should be called if <strong>any member can't be accounted for during a PAR<\/strong> (F2021-10).<\/li><li>IAFC Rules of Engagement <strong>#11: declare a Mayday as soon as you think you are in danger<\/strong> (F2020-10).<\/li><li><strong>RIT usually isn't activated until a Mayday is declared.<\/strong> Any delay shrinks your survival window and raises the risk to RIT (F2020-10, F2021-10).<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<p><strong>Mayday sequence (FACE F2020-10, F2021-10):<\/strong><\/p><ol><li>Quickly judge whether your spot is survivable. Move away from untenable fire if you must, but <strong>call while you still can and still have air<\/strong>.<\/li><li><strong>Press the radio emergency alert button (EAB)<\/strong> for 1–3 seconds.<\/li><li>Say <strong>\"MAYDAY, MAYDAY, MAYDAY,\"<\/strong> then your unit, then a short report. <strong>LUNAR<\/strong> prompt: <strong>L<\/strong>ocation, <strong>U<\/strong>nit, <strong>N<\/strong>ame, <strong>A<\/strong>ssignment/Air, <strong>R<\/strong>esources needed. Example: <em>\"Mayday, Mayday, Mayday, Division 1 Quadrant C, Engine 71, Smith, search/out of air/vomited, can't find exit.\"<\/em> At minimum, give the <strong>division (floor) and quadrant<\/strong>.<\/li><li><strong>Make sure command or dispatch acknowledges<\/strong> the Mayday.<\/li><li><strong>Manually activate your PASS.<\/strong><\/li><li><strong>Conserve air:<\/strong> stay calm and avoid unnecessary activity. Only after command and RIT know where you are should you try to fix the problem (for example, clearing the nose cup).<\/li><li><strong>Get your bearings:<\/strong> look for windows, doors, hallways, and changes in flooring. Stay on the radio with command and rescuers.<\/li><li><strong>Help them find you:<\/strong> point the PASS into open space, point your flashlight at the ceiling or wave it, and tap a tool on the floor or wall.<\/li><li><strong>Calling for someone else:<\/strong> try to reach the missing member by radio. If that fails, call a Mayday with their <strong>last known location<\/strong>.<\/li><\/ol><p><strong>Crew rules:<\/strong><\/p><ul><li><strong>One member's low-air alarm is an emergency for the whole crew.<\/strong> The whole crew leaves together and stays together. Crews that went in together run low on air in quick succession (F2020-10).<\/li><li>Stay in contact by sight, voice, or touch. The <strong>company officer<\/strong> is ultimately responsible for crew integrity (F2020-10, F2021-10).<\/li><li><strong>Evacuation signal (example in F2020-10):<\/strong> \"emergency traffic\" on the radio, then short air-horn blasts for about <strong>10 s<\/strong>, then 10 s of silence, repeated <strong>3 times<\/strong>. Withdraw immediately. Officers give a <strong>PAR<\/strong> to command.<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li><strong>Carbon monoxide steals your judgment.<\/strong> A firefighter breathing CO quickly loses the ability to communicate clearly and can wander away from the exit and the crew before passing out. Give your location <strong>early<\/strong> (F2020-10).<\/li><li><strong>Stress distorts your senses and slows your thinking.<\/strong> Mayday skills must be <strong>over-learned<\/strong>, trained to mastery, and practiced <strong>more often than once a year<\/strong> (F2020-10).<\/li><li><strong>Don't stay quiet to \"save resources.\"<\/strong> In F2021-10, one firefighter ran completely out of air about <strong>30 ft<\/strong> from the exit and did <strong>not<\/strong> call his own Mayday, because he didn't want to pull resources from his partner's Mayday. A FAST found him by his voice saying \"I am out of air.\" Command spent minutes not knowing who had called, and the Mayday firefighter in Room 306 died.<\/li><li><strong>Two Maydays at once cause confusion.<\/strong> Identify yourself. In F2023-10, a later Mayday from other out-of-air firefighters was briefly mistaken for the missing member.<\/li><li><strong>Radios fail.<\/strong> In F2023-10, a captain's Mayday inside a steel ship <strong>wasn't heard<\/strong>. Dispatch had to sound the emergency tones. That's why the EAB, PASS, and repeated calls matter.<\/li><li><strong>Keep your mask on.<\/strong> In F2022-03, a firefighter fell down the stairs, lost his air, and his mask was displaced. He died of smoke inhalation. NIOSH: keep the mask on in IDLH, and groom facial hair so it doesn't break the seal.<\/li><li><strong>Your PPE and SCBA don't give unlimited protection.<\/strong> Gear not donned, worn, or activated properly protects less or not at all (F2020-10).<\/li><li><strong>Large and commercial buildings:<\/strong> residential tactics and searching without a hoseline or tagline contributed to the F2020-10 deaths. Bigger buildings need more air. NIOSH suggests larger cylinders (for example, 1800 L) for companies that respond there.<\/li><\/ul>"}, {"key": "history", "title": "History", "html": "<ul><li><strong>Older EOSTI setting:<\/strong> according to NIOSH F2020-10, SCBA built to NFPA 1981 editions before 2013 sounded the end-of-service alarm at <strong>25% ± 2%<\/strong> remaining. Later editions alarm at about <strong>35%<\/strong>, which leaves more reserve. Departments still running older units have less warning.<\/li><li><strong>Cylinder upgrades:<\/strong> the F2020-10 department used 1200 L (30-minute) cylinders at the time of the fire and has since moved to 1800 L.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Your SCBA is rated \"30 minutes.\" NIOSH F2020-10 says how long a working firefighter can expect it to last, and why is there a gap?", "a": "About 15–18 minutes for a 1200 L cylinder. Ratings assume 40 L/min, but working firefighters can breathe close to 100 L/min.", "qh": "Your SCBA is rated \"30 minutes.\" NIOSH F2020-10 says how long a working firefighter can expect it to last, and why is there a gap?", "ah": "About 15–18 minutes for a 1200 L cylinder. Ratings assume 40 L/min, but working firefighters can breathe close to 100 L/min."}, {"n": 2, "q": "According to NIOSH, what share of your air is \"working and exiting air,\" and what does it mean when your low-air alarm sounds?", "a": "The first 67% is working and exiting air. A low-air alarm means you're already using reserve air, and you and your crew must act immediately. You should have left before it sounded.", "qh": "According to NIOSH, what share of your air is \"working and exiting air,\" and what does it mean when your low-air alarm sounds?", "ah": "The first 67% is working and exiting air. A low-air alarm means you're already using reserve air, and you and your crew must act immediately. You should have left before it sounded."}, {"n": 3, "q": "Your partner's low-air alarm sounds, but you have plenty of air and are close to finding the seat of the fire. What does NIOSH say the crew should do, and why do crews tend to run out together?", "a": "Treat it as an emergency for the whole crew: everyone leaves together and keeps crew integrity. Crews that enter together use air at similar rates, so they run low in quick succession.", "qh": "Your partner's low-air alarm sounds, but you have plenty of air and are close to finding the seat of the fire. What does NIOSH say the crew should do, and why do crews tend to run out together?", "ah": "Treat it as an emergency for the whole crew: everyone leaves together and keeps crew integrity. Crews that enter together use air at similar rates, so they run low in quick succession."}, {"n": 4, "q": "In the LUNAR Mayday format, what does each letter stand for, and what is the minimum location information NIOSH wants?", "a": "Location, Unit, Name, Assignment/Air, Resources needed. At minimum, the division (floor) and quadrant.", "qh": "In the LUNAR Mayday format, what does each letter stand for, and what is the minimum location information NIOSH wants?", "ah": "Location, Unit, Name, Assignment/Air, Resources needed. At minimum, the division (floor) and quadrant."}, {"n": 5, "q": "List, in order, the four radio and PASS steps NIOSH F2020-10 gives for transmitting a Mayday.", "a": "Press the radio emergency alert button (1–3 s). Say \"Mayday, Mayday, Mayday\" plus your unit and a short report. Make sure command or dispatch acknowledges it. Make sure your PASS is activated.", "qh": "List, in order, the four radio and PASS steps NIOSH F2020-10 gives for transmitting a Mayday.", "ah": "Press the radio emergency alert button (1–3 s). Say \"Mayday, Mayday, Mayday\" plus your unit and a short report. Make sure command or dispatch acknowledges it. Make sure your PASS is activated."}, {"n": 6, "q": "You've lost voice contact with your crew in heavy smoke. Under the IAFC rule NIOSH cites, when do you call a Mayday, and when do you skip the waiting period?", "a": "After 3 radio attempts with no reconnection, or 1 minute without reconnecting, whichever comes first. If conditions are deteriorating rapidly, call it immediately.", "qh": "You've lost voice contact with your crew in heavy smoke. Under the IAFC rule NIOSH cites, when do you call a Mayday, and when do you skip the waiting period?", "ah": "After 3 radio attempts with no reconnection, or 1 minute without reconnecting, whichever comes first. If conditions are deteriorating rapidly, call it immediately."}, {"n": 7, "q": "After calling the Mayday, you're waiting for RIT. Give three things to do to help yourself survive and three ways to help RIT find you.", "a": "Survival: stay calm, limit activity to save air, look for escape routes (windows, doors, hallways, flooring changes), and stay on the radio. Be found: point the PASS into open space, shine or wave the flashlight at the ceiling, and tap a tool on the floor or wall.", "qh": "After calling the Mayday, you're waiting for RIT. Give three things to do to help yourself survive and three ways to help RIT find you.", "ah": "Survival: stay calm, limit activity to save air, look for escape routes (windows, doors, hallways, flooring changes), and stay on the radio. Be found: point the PASS into open space, shine or wave the flashlight at the ceiling, and tap a tool on the floor or wall."}, {"n": 8, "q": "In NIOSH FACE F2021-10, one firefighter ran out of air about 30 ft from an exit. What did he not do, why, and what problem did that cause for command?", "a": "He didn't call his own Mayday because he didn't want to divert resources from his partner's Mayday. Command didn't know who had called or where they were, so the FAST that found him was first taken for the Mayday firefighter in Room 306, and command didn't learn otherwise for several minutes.", "qh": "In NIOSH FACE F2021-10, one firefighter ran out of air about 30 ft from an exit. What did he not do, why, and what problem did that cause for command?", "ah": "He didn't call his own Mayday because he didn't want to divert resources from his partner's Mayday. Command didn't know who had called or where they were, so the FAST that found him was first taken for the Mayday firefighter in Room 306, and command didn't learn otherwise for several minutes."}, {"n": 9, "q": "Why does NIOSH stress giving your location early, before anything else, when CO is involved?", "a": "CO quickly takes away your ability to communicate clearly and can lead you away from the exit before you pass out. Without an accurate location, RIT is slower, and your survival window closes.", "qh": "Why does NIOSH stress giving your location early, before anything else, when CO is involved?", "ah": "CO quickly takes away your ability to communicate clearly and can lead you away from the exit before you pass out. Without an accurate location, RIT is slower, and your survival window closes."}, {"n": 10, "q": "NIOSH 2026-104 lists two ways SCBA use stresses the body. Name them and three effects that matter for air management.", "a": "Added weight (up to 40 lb) and increased breathing resistance. Effects: faster fatigue and shortness of breath or hyperventilation, claustrophobia, higher air consumption (also heat illness, heart strain, and reduced endurance or mobility).", "qh": "NIOSH 2026-104 lists two ways SCBA use stresses the body. Name them and three effects that matter for air management.", "ah": "Added weight (up to 40 lb) and increased breathing resistance. Effects: faster fatigue and shortness of breath or hyperventilation, claustrophobia, higher air consumption (also heat illness, heart strain, and reduced endurance or mobility)."}, {"n": 11, "q": "In F2023-10, the first Mayday from inside the ship wasn't heard. What does this teach about relying on a voice Mayday alone?", "a": "Radios can fail, as with steel structures. Back up the voice call with the EAB and PASS, make sure someone acknowledges it, and keep trying. In F2023-10, dispatch had to sound the emergency tones.", "qh": "In F2023-10, the first Mayday from inside the ship wasn't heard. What does this teach about relying on a voice Mayday alone?", "ah": "Radios can fail, as with steel structures. Back up the voice call with the EAB and PASS, make sure someone acknowledges it, and keep trying. In F2023-10, dispatch had to sound the emergency tones."}, {"n": 12, "q": "An engineer says, \"Our older SCBAs alarm at the same point as the new ones.\" According to NIOSH F2020-10, how did the EOSTI setting change, and why does it matter?", "a": "SCBA built to pre-2013 editions of NFPA 1981 alarm at 25% ± 2%. Later editions alarm at about 35%. An older unit warns you later, leaving less reserve to get out.", "qh": "An engineer says, \"Our older SCBAs alarm at the same point as the new ones.\" According to NIOSH F2020-10, how did the EOSTI setting change, and why does it matter?", "ah": "SCBA built to pre-2013 editions of NFPA 1981 alarm at 25% ± 2%. Later editions alarm at about 35%. An older unit warns you later, leaving less reserve to get out."}], "sources": [{"label": "NIOSH Publication 2026-104, Safe Use of Self-Contained Breathing Apparatus (SCBA) for Firefighters (July 2026)", "url": "https://www.cdc.gov/niosh/media/pdfs/2026/07/2026-104.pdf"}, {"label": "NIOSH Publication 2009-100, Leading Recommendations for Preventing Fire Fighter Fatalities, 1998–2005", "url": "https://stacks.cdc.gov/view/cdc/5205/cdc_5205_DS1.pdf"}, {"label": "NIOSH FACE F2020-10, Career Captain and Career Firefighter Die After Running Out of Air During a Search in a Public Library – California", "url": "https://www.cdc.gov/niosh/firefighters/programs/pdfs/face202010.pdf"}, {"label": "NIOSH FACE F2021-10 (revised Dec 17, 2024), Volunteer Firefighter Killed after Becoming Trapped at an Assisted Living Facility Fire – New York", "url": "https://www.cdc.gov/niosh/firefighters/programs/pdfs/face202110.pdf"}, {"label": "NIOSH FACE F2022-03, 35-year-old Volunteer Firefighter Dies from Smoke Inhalation Injury Sustained During Initial Fire Attack – Kansas", "url": "https://www.cdc.gov/niosh/firefighters/programs/pdfs/face202203.pdf"}, {"label": "NIOSH FACE F2023-10, Two Career Land-Based Firefighters Die After Becoming Lost and Running Out of Air During a Marine Vessel Fire in Port – New Jersey", "url": "https://www.cdc.gov/niosh/firefighters/programs/pdfs/face202310.pdf"}, {"label": "Scout batches 01 and 03 (04.1 sections): /workspace/can-report/scout-batch-01.md, /workspace/can-report/scout-batch-03.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 04 RIT / Firefighter Survival and Rescue &gt; 04.1 (task group). <strong>Unlocks after:<\/strong> 01.2 SCBA, 09.1.1 PASS. <strong>Unlocks:<\/strong> 04.2 RIT Air Supply Packs (04.2.1 Scott RIT-Pak III, 04.2.2 MSA G1 RIT/RescueAire II), 04.C capstone. <strong>Cross-links:<\/strong> 09.1.1 PASS, 09.1.2 Accountability, 09.1.4 TIC Navigation and Search.", "note_html": "Study aid only. Your department's Mayday SOP and radio procedures come first. NIOSH notes that there is no national Mayday standard and no mandate for when to call one, so each authority having jurisdiction sets its own rules. NFPA standards are cited by number only."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 440, "y": -300.0, "vx": -410.0, "vy": 490, "vangle": null}, "04.2": {"id": "04.2", "name": "RIT Air Supply Packs", "path": "04", "kind": "main", "parent": null, "prereqRaw": "04.1, 01.2", "children": ["04.2.1", "04.2.2"], "prereqs": ["04.1", "01.2"], "unlocks": ["04.2.1", "04.2.2", "04.3", "04.C"], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 640, "y": -300.0, "vx": -410.0, "vy": 640, "vangle": null}, "04.2.1": {"id": "04.2.1", "name": "3M Scott RIT-Pak III", "path": "04", "kind": "tool", "parent": "04.2", "prereqRaw": "parent 04.2", "children": [], "prereqs": ["04.2"], "unlocks": [], "cross": ["01.2.1", "09.1.1"], "doc": {"title": "04.2.1 3M Scott RIT-Pak III Portable Air Supply", "file": "04.2.1_Scott_RIT-Pak_III.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>An emergency air supply in a drag bag that a Rapid Intervention Team carries to a downed or trapped firefighter. It is <strong>not a complete respirator<\/strong> and is not NIOSH- or NFPA-approved as one. It's for emergency use only, supplying <strong>one<\/strong> user while they're being evacuated.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Models by pressure:<\/strong> 2216 psi (Scott 2.2, 30-min cylinder), 4500 psi (4.5, 30/45/60-min), 5500 psi (5.5, 30/45/60/75-min). The cylinder is bought separately.<\/li><li><strong>LOW-pressure supply:<\/strong> a reducer and hose to a dual manifold (male and female quick-disconnects). It replaces the downed firefighter's depleted cylinder or feeds a facepiece and regulator. The hose can release air at <strong>160 psi<\/strong>.<\/li><li><strong>HIGH-pressure supply:<\/strong> a <strong>RIC UAC<\/strong> hose that fits any NFPA 1981 (2002 or later) SCBA with a UAC, to <strong>partially recharge<\/strong> the victim's cylinder. A VENT button bleeds residual pressure.<\/li><li><strong>Remote gauge console<\/strong> outside the bag: analog gauge plus an LED display (lights up all 5 for 20 s at start-up).<\/li><li><strong>Low-air bell:<\/strong> rings when the RIT cylinder falls <strong>below ¼ full<\/strong>.<\/li><li><strong>Options:<\/strong> an Emergency facepiece (AV-3000 SureSeal variant, no nose cup or voicemitters) and an Emergency regulator (<strong>no<\/strong> end-of-service alarm). These options are not NIOSH/NFPA approved.<\/li><li><strong>Bag:<\/strong> rigid hose compartments, plastic skid plate, attachment rings, and a long shoulder strap.<\/li><li><strong>LP connection points (manual):<\/strong> the facepiece-mounted regulator quick-disconnect, the EBSS (\"buddy breather\"), or the extended-duration airline connection on the victim's SCBA. The optional emergency facepiece and regulator are the fallback if the victim's mask has failed.<\/li><li><strong>LED display:<\/strong> a convenience feature, not critical to operation. The analog gauge and the bell are what you rely on.<\/li><li><strong>Monitor alert point (manual example):<\/strong> about ¼ full, which is roughly 500 psi on a 2216 pack, 1000 psi on a 4500 pack, and 1200 psi on a 5500 pack. Your respiratory protection program sets the actual value.<\/li><li><strong>Air quality:<\/strong> Grade D or better (CGA G-7.1) with a dew point of −65 °F / −54 °C or lower. Never oxygen. Moisture in compressed air can freeze even well above 32 °F.<\/li><li><strong>Duration:<\/strong> hard work can cut the time to half the rated duration or less. At 2 atmospheres absolute (for example, in a pressurized tunnel), duration is halved.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li><strong>Pre-use:<\/strong> check the hydro date, cylinder FULL, hoses and quick-disconnects, and the UAC dust cover. Couplings are hand-tight only.<\/li><li>At the victim: open the RIT cylinder valve and check the gauge and LEDs.<\/li><li><strong>Option A (UAC transfill):<\/strong> connect the HIGH-pressure hose to the victim's RIC UAC to partly refill their cylinder.<\/li><li><strong>Option B (LP supply):<\/strong> connect the LOW-pressure manifold to the victim's SCBA, or use the emergency facepiece and regulator if their mask has failed.<\/li><li><strong>Assign one RIT member to watch the RIT cylinder gauge<\/strong> the whole time, and swap or exit before it runs out.<\/li><li>Afterward: close the valve, vent with the UAC VENT button or the regulator purge, then clean, decon, and inspect.<\/li><\/ol><p><strong>UAC transfill details (manual):<\/strong><\/p><ul><li>First make sure nothing on the LP hose will bleed air. Then open the RIT cylinder fully and set the pack on a flat, level surface away from heat.<\/li><li>A RIT member inspects the victim's cylinder: dents or gouges, valve damage, and heat signs (brown or black paint, charred or missing decals, melted gauge lens, distorted bumper). If the cylinder was dropped, flame-exposed, or is damaged in any way, don't use the UAC. Find another way to supply air.<\/li><li>Make sure the victim's cylinder valve is fully open (about 2½ turns). Push the coupling on until it clicks, then tug-test it. Never charge past the rated pressure marked on the cylinder.<\/li><li>Air flows only while the RIT cylinder is at higher pressure. It stops when the two cylinders equalize, and the victim's gauge settles <strong>below FULL<\/strong>. Then close the RIT valve.<\/li><li>If the victim's UAC relief valve vents, the respirator's rated pressure was exceeded. Close the RIT valve and check the victim's gauge. The relief valve resets on its own.<\/li><li>Any leak during the fill: stop and use another method. To disconnect, pull the sleeve back. A check valve in the victim's UAC holds the air. If the victim runs low again before getting out, repeat the fill with a fresh, full RIT-Pak.<\/li><li><strong>LP hookup:<\/strong> if the victim's cylinder is still open, he breathes from it until its supply pressure falls below the LP line pressure. If it's closed, the RIT-Pak is his only source. Secure the manifold to his body so it can't pull on the facepiece.<\/li><li>After the rescue, install a full cylinder. Don't keep a partly used one in service.<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Depending on the hookup, the <strong>victim's SCBA alarms may not work<\/strong>. Someone has to watch the gauge.<\/li><li>A transfill gives <strong>less<\/strong> than rated duration. The amount moved depends on both cylinders.<\/li><li>Use only the matching Scott cylinder pressure. Mismatches cause false gauge and alarm readings.<\/li><li>Don't add hoses or adapters except as the manual directs. Keep it away from flame.<\/li><li><strong>Cylinder mismatch (manual):<\/strong> a <em>lower<\/em>-pressure cylinder (for example, a 2216 or 3000 psi cylinder in a 4500 pack) reads less than FULL, and the low-air LED alert comes on well before about ¾ of the air is used. A <em>higher<\/em>-pressure cylinder (3000 in a 2216 pack, or 5500 in a 4500 pack) reads above FULL, and the end-of-service alarms won't activate until <strong>more<\/strong> than about ¾ is gone. In any mismatch, someone must watch the cylinder gauge.<\/li><li>A 4500 or 5500 psi cylinder <strong>can't<\/strong> be installed on a 2216 pack. By design, the coupling won't seal and leaks heavily, so the lower-pressure parts never see the higher pressure.<\/li><li><strong>Cold weather (below 32 °F / 0 °C):<\/strong> keep the HP, UAC, and LP couplings dry, because ice can stop you from connecting or disconnecting them. The reducer gets cold while air flows, so water or mud on it can freeze and affect operation. If you fill a cylinder through the HP hose in the cold and then move it indoors, check it for excess pressure <strong>within 2 hours<\/strong>. If it reads above full, bleed it down to full with the regulator purge.<\/li><li>The UAC is for an incapacitated user only. Don't charge an SCBA while it's being worn unless there's a compelling reason to accept the risk.<\/li><li>Compressed air against skin can cause an air embolism. A damaged LP hose can release air at 160 psi, and a cut HP hose can release 4500 psi.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "A new member calls the RIT-Pak III \"a spare SCBA in a bag.\" What's wrong with that, and what limits does the manual put on its use?", "a": "It isn't a complete respirator and isn't NIOSH- or NFPA-approved as one. It's an emergency air supply for one user at a time, only to help evacuate him. It's not an air cart, a routine air source, or a hose-line air supply, and you can't add hoses or adapters unless the manual says to.", "qh": "A new member calls the RIT-Pak III \"a spare SCBA in a bag.\" What's wrong with that, and what limits does the manual put on its use?", "ah": "It isn't a complete respirator and isn't NIOSH- or NFPA-approved as one. It's an emergency air supply for one user at a time, only to help evacuate him. It's not an air cart, a routine air source, or a hose-line air supply, and you can't add hoses or adapters unless the manual says to."}, {"n": 2, "q": "You reach a downed Scott wearer and want to use the low-pressure line. Name the three places on his SCBA it can connect, and the fallback if his facepiece has failed.", "a": "The facepiece-mounted regulator quick-disconnect, the EBSS (buddy breather), or the extended-duration airline connection. If his mask has failed, use the optional emergency facepiece and regulator. That regulator has no end-of-service alarm.", "qh": "You reach a downed Scott wearer and want to use the low-pressure line. Name the three places on his SCBA it can connect, and the fallback if his facepiece has failed.", "ah": "The facepiece-mounted regulator quick-disconnect, the EBSS (buddy breather), or the extended-duration airline connection. If his mask has failed, use the optional emergency facepiece and regulator. That regulator has no end-of-service alarm."}, {"n": 3, "q": "You connect the LP line while the victim's own cylinder valve is still open. Whose air is he breathing, and when does that change?", "a": "His own cylinder, until its supply pressure drops below the LP line pressure. Then the RIT-Pak takes over. If his cylinder is closed, the RIT-Pak is his only air.", "qh": "You connect the LP line while the victim's own cylinder valve is still open. Whose air is he breathing, and when does that change?", "ah": "His own cylinder, until its supply pressure drops below the LP line pressure. Then the RIT-Pak takes over. If his cylinder is closed, the RIT-Pak is his only air."}, {"n": 4, "q": "Before you transfill through the victim's RIC UAC, what do you inspect, and which findings mean you don't use the UAC at all?", "a": "Check his cylinder for dents or gouges, valve damage, and heat signs: brown or black paint, charred or missing decals, a melted gauge lens, or a distorted bumper. Also check his hoses and parts. If the cylinder was dropped, flame-exposed, or damaged in any way, or anything looks unsafe, don't use the UAC. Find another way to get him air.", "qh": "Before you transfill through the victim's RIC UAC, what do you inspect, and which findings mean you don't use the UAC at all?", "ah": "Check his cylinder for dents or gouges, valve damage, and heat signs: brown or black paint, charred or missing decals, a melted gauge lens, or a distorted bumper. Also check his hoses and parts. If the cylinder was dropped, flame-exposed, or damaged in any way, or anything looks unsafe, don't use the UAC. Find another way to get him air."}, {"n": 5, "q": "Your full 4500 psi RIT-Pak is transfilling an almost empty 45-minute cylinder. When does the air stop, what will the victim's gauge show, and why won't he get 45 minutes?", "a": "Air flows only while the RIT cylinder pressure is higher. It stops when the two equalize, so his gauge settles below FULL. The amount transferred depends on both cylinders and is always less than either cylinder's rating.", "qh": "Your full 4500 psi RIT-Pak is transfilling an almost empty 45-minute cylinder. When does the air stop, what will the victim's gauge show, and why won't he get 45 minutes?", "ah": "Air flows only while the RIT cylinder pressure is higher. It stops when the two equalize, so his gauge settles below FULL. The amount transferred depends on both cylinders and is always less than either cylinder's rating."}, {"n": 6, "q": "Partway through the fill, a relief valve on the victim's UAC manifold starts venting. What does it mean, and what do you do?", "a": "The fill pressure exceeded his respirator's rated pressure. Close the RIT-Pak cylinder valve and check his cylinder gauge. The relief valve resets once the excess vents. Keep unprotected skin away from the venting air.", "qh": "Partway through the fill, a relief valve on the victim's UAC manifold starts venting. What does it mean, and what do you do?", "ah": "The fill pressure exceeded his respirator's rated pressure. Close the RIT-Pak cylinder valve and check his cylinder gauge. The relief valve resets once the excess vents. Keep unprotected skin away from the venting air."}, {"n": 7, "q": "The RIT bag was restocked with a 5500 psi cylinder on a 4500 psi pack. How will the gauge and alarms behave, and why is that dangerous? How is a 2216 cylinder in the same pack different?", "a": "A higher-pressure cylinder makes the gauge read above FULL, and the end-of-service alarms won't activate until more than about ¾ of the air is gone. You could run out with little warning. A 2216 cylinder reads below FULL, and the low-air LED alert comes on well before ¾ is used. Either way, someone must watch the cylinder gauge.", "qh": "The RIT bag was restocked with a 5500 psi cylinder on a 4500 psi pack. How will the gauge and alarms behave, and why is that dangerous? How is a 2216 cylinder in the same pack different?", "ah": "A higher-pressure cylinder makes the gauge read above FULL, and the end-of-service alarms won't activate until more than about ¾ of the air is gone. You could run out with little warning. A 2216 cylinder reads below FULL, and the low-air LED alert comes on well before ¾ is used. Either way, someone must watch the cylinder gauge."}, {"n": 8, "q": "Why does a 4500 psi cylinder leak heavily when someone tries to thread it onto a 2216 psi RIT-Pak?", "a": "It's a deliberate safety design. The high-pressure coupling won't seal on the higher-pressure cylinder, so a large leak occurs when the valve opens. That keeps the 2216 psi parts from being pressurized to 4500.", "qh": "Why does a 4500 psi cylinder leak heavily when someone tries to thread it onto a 2216 psi RIT-Pak?", "ah": "It's a deliberate safety design. The high-pressure coupling won't seal on the higher-pressure cylinder, so a large leak occurs when the valve opens. That keeps the 2216 psi parts from being pressurized to 4500."}, {"n": 9, "q": "Working at 20 °F, which RIT-Pak parts can freeze and cause trouble? You fill a victim's cylinder outside and the SCBA goes back indoors. What must happen within 2 hours?", "a": "Water on the HP, UAC, or LP couplings can freeze and stop you from connecting or removing a hose. The reducer gets cold while air flows, so water or mud on it can freeze and affect operation. After a fill below 32 °F, check the cylinder for excess pressure within 2 hours of moving it indoors, and bleed it down to full with the regulator purge if it reads high.", "qh": "Working at 20 °F, which RIT-Pak parts can freeze and cause trouble? You fill a victim's cylinder outside and the SCBA goes back indoors. What must happen within 2 hours?", "ah": "Water on the HP, UAC, or LP couplings can freeze and stop you from connecting or removing a hose. The reducer gets cold while air flows, so water or mud on it can freeze and affect operation. After a fill below 32 °F, check the cylinder for excess pressure within 2 hours of moving it indoors, and bleed it down to full with the regulator purge if it reads high."}, {"n": 10, "q": "Why must one trained RIT member watch the RIT-Pak gauge for the whole rescue, and about what reading on a 4500 pack is the manual's example alert point?", "a": "The victim's own end-of-service alarm may not work normally while he's on the RIT-Pak, and failing to monitor can cut off his air without warning. The monitor needs a way to alert the team. The manual's example is ¼ full, about 1000 psi on a 4500 pack. The bell also rings below ¼.", "qh": "Why must one trained RIT member watch the RIT-Pak gauge for the whole rescue, and about what reading on a 4500 pack is the manual's example alert point?", "ah": "The victim's own end-of-service alarm may not work normally while he's on the RIT-Pak, and failing to monitor can cut off his air without warning. The monitor needs a way to alert the team. The manual's example is ¼ full, about 1000 psi on a 4500 pack. The bell also rings below ¼."}], "sources": [{"label": "Scott RIT-Pak III O&M Instructions 595225-01 Rev D", "url": "https://www.sos-safety.com/wp-content/uploads/2017/10/RITPakIII_OperationMaintenance_595225-01D_LowRes.pdf"}, {"label": "3M Scott fire product page", "url": "https://www.3m.com/3M/en_US/p/d/b5005672007/"}, {"label": "Library copy: Drive > Firefighter_Reference_Library > 08_RIC_RIT_Packs", "url": ""}, {"label": "3M Scott RIT-Pak III O&M 595225-01 Rev D, sections: Description, Service Life, Use of Alternate Cylinders, Low and High Pressure Air Supply Use, Use in Low Temperatures (same PDF as above)", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 04 RIT &gt; 04.2 RIT Air Supply Packs &gt; tool. <strong>Unlocks after:<\/strong> 01.2 SCBA (all), 04.1 Mayday and Self-Survival (planned). <strong>Cross-links:<\/strong> 01.2.1 Scott X3 Pro (RIC/UAC), 09.1.1 PASS.", "note_html": "Study aid only. Source: Scott RIT-Pak III O&amp;M Instructions P/N 595225-01 Rev D."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 650.69, "y": -261.45, "angle": 74.5, "vx": -379.58, "vy": 614.02, "vangle": 319.5}, "04.2.2": {"id": "04.2.2", "name": "MSA G1 RIT System and RescueAire II", "path": "04", "kind": "tool", "parent": "04.2", "prereqRaw": "parent 04.2", "children": [], "prereqs": ["04.2"], "unlocks": [], "cross": ["01.2.2", "09.1.1"], "doc": {"title": "04.2.2 MSA G1 RIT System and G1 RescueAire II", "file": "04.2.2_MSA_G1_RIT_and_RescueAire_II.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>These are MSA's two RIT air-supply options for crews with G1 SCBAs:<\/p><ul><li><strong>G1 RescueAire II System:<\/strong> a harness-carried emergency air supply with a G1 regulator, made to give air to a downed firefighter wearing a G1 facepiece.<\/li><li><strong>G1 RIT System:<\/strong> a complete RIT bag with a quick-connect pressure reducer that mounts on a user-supplied G1 cylinder.<\/li><\/ul>"}, {"key": "specs", "title": "Key specs", "html": "<p><strong>G1 RescueAire II<\/strong><\/p><ul><li>2216 or 4500 psi versions (sold with a 30-min or 60-min cylinder).<\/li><li>G1 PR-14 pressure reducer, G1 regulator, and Audi-Larm audible low-pressure alarm.<\/li><li>36-inch Quick-Fill emergency breathing system (EBS) connection, an ExtendAire EBS connection, and a carrying harness with an adjustable strap.<\/li><\/ul><p><strong>G1 RIT System<\/strong><\/p><ul><li>2216 or 4500 psi versions. The cylinder is ordered separately.<\/li><li><strong>6-ft high-pressure line<\/strong> ending in a female Quick-Fill fitting (transfill).<\/li><li><strong>6-ft intermediate-pressure line<\/strong> ending in an ExtendAire II manifold (male and female quick-disconnects).<\/li><li>Optional G1 facepiece (medium, 4-point Speed-ON harness), quick-connect G1 regulator, remote gauge, and URC fitting to link G1 RIT systems.<\/li><li>Audible warning bell, high-pressure first stage, and EBSS accessory.<\/li><li>Iron-Cloth bag with heat-shield skid plate, a 60-in strap (carry, drag, or lower), flashlight holder, tool pockets, and 360° reflective tape.<\/li><\/ul><p><strong>Ordering details that matter (bulletin)<\/strong><\/p><ul><li>RescueAire II comes complete with a cylinder: 4500 psi with a 60-min cylinder, or 2216 psi with a 30-min cylinder.<\/li><li>The G1 RIT System comes <strong>without<\/strong> a cylinder. It mounts on a G1 cylinder made for remote connection, and each cylinder needs its own Quick-Connect Cylinder Adapter (one part number for 2216 psi, another for 4500/5500 psi).<\/li><li>Neither RIT system comes in 5500 psi.<\/li><\/ul><p><strong>UAC rules on the receiving G1 SCBA (G1 manual, section 13)<\/strong><\/p><ul><li>Each G1 has one RIC UAC on the pressure reducer, plus an optional Remote Quick-Fill UAC on the front right. On 2216 and 4500 psi systems, either can be used. A 5500 psi G1 <strong>will not transfill<\/strong> between SCBAs.<\/li><li>The air at the Quick-Fill inlet must <strong>never<\/strong> be higher than the SCBA's operating pressure. To fill at all, it must be higher than the cylinder's current pressure.<\/li><li>The pressure reducer has an <strong>automatically resetting relief valve<\/strong> that vents if an emergency fill over-pressurizes the SCBA.<\/li><li>Use only MSA-approved hoses to keep the NIOSH approval. Don't lubricate the fittings, and keep oil and grease off them. Never use the UAC if a CBRN agent could be present, or as a buddy breather (two users on one cylinder), which voids the NIOSH approval.<\/li><li>Topping off: MSA recommends waiting until the cylinder cools to 70 °F (21 °C) after the first fill to get the full service time.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ol><li>Keep it staged with the RIT tool cache, with the cylinder full and the hoses stowed in the quick-draw pocket.<\/li><li>At the victim: open the cylinder and check the remote gauge.<\/li><li><strong>Transfill:<\/strong> connect the HP Quick-Fill line to the victim's Quick-Fill or UAC fitting. (The G1 SCBA also has a RIC UAC fitting and an optional Remote Quick-Fill on the front right.)<\/li><li><strong>Supply:<\/strong> connect the IP ExtendAire line, or put the spare facepiece and regulator on a victim whose mask failed.<\/li><li>Watch the RIT cylinder and plan the exit or a cylinder swap. The bell warns of low pressure.<\/li><\/ol><p><strong>Quick-Fill sequence (G1 manual 13.2)<\/strong><\/p><ul><li>Connect the hose to the supply and turn the supply on. Uncap both fittings, make sure the victim's cylinder valve is fully open, push the hose on until it clicks, then tug it.<\/li><li>Filling starts the moment the fitting engages, and the pressures <strong>equalize in about 60 seconds<\/strong>. If the supply doesn't hold enough air, the cylinder won't reach full.<\/li><li>When the cylinder and remote gauges match the supply gauge, pressure is equal. Pull the gray sleeve to disconnect (a hiss or pop is normal), listen for leaks, and recap the UAC right away.<\/li><li><strong>If the UAC leaks and the dust cap won't stay on:<\/strong> reconnect the hose to seal it and head for fresh air. If it won't reconnect, close the cylinder valve, cap the fitting, reopen the valve, and leave immediately.<\/li><li>MSA: RITs should fill cylinders in IDLH atmospheres from a <strong>separate air supply<\/strong> such as RescueAire II.<\/li><\/ul><p><strong>ExtendAire II (the IP line, G1 manual section 14)<\/strong><\/p><ul><li>Using it as donor or receiver makes <strong>both SCBAs escape-only<\/strong>. Both users leave at once, and remaining service time drops by about half.<\/li><li>Don't connect if the donor's low-pressure alarm is sounding. Keep slack in the lines and don't pull on the hoses, because they can separate from the fittings. Make sure both cylinder valves are open before you disconnect.<\/li><li>MSA says the Quick-Fill system has fewer risks and keeps the approval, so use it when ExtendAire rules can't be followed.<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>The bulletin is a product overview, not an operating manual. Train from MSA's current G1 RIT instructions.<\/li><li>Don't mix quick-connect types. MSA warns that Snap-Tite and UEBSS quick-connect fittings are not interchangeable (G1 manual).<\/li><li>Match the system pressure to the cylinder.<\/li><li>The 2018 G1's ExtendAire II uses <strong>UEBSS<\/strong> fittings so it can connect to other brands' UEBSS. NFPA 1981 (2018) doesn't require cross-brand testing, so MSA doesn't warrant either SCBA in a mixed-brand hookup.<\/li><li>ExtendAire II is not approved in CBRN atmospheres either.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li>Before the G1, MSA sold the RescueAire family (RescueAire, RescueAire AL, RescueAire QR, and RescueAire II) for its Firehawk-era SCBA. They had 3-ft Quick-Fill hoses and 36-in low-pressure airlines, and RescueAire II came with a Firehawk mask-mounted regulator. Those systems used 2216 and 4500 psi cylinders (MSA literature 0114-18-MC, 2012).<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Your department is buying RIT air for G1 crews. Compare what arrives in the box with RescueAire II and with the G1 RIT System, including what you still need to order for each G1 RIT cylinder.", "a": "RescueAire II comes complete: a harness-carried system with a G1 PR-14 reducer, G1 regulator, and Audi-Larm alarm, sold with a cylinder (4500 psi/60-min or 2216 psi/30-min). The G1 RIT System is a full RIT bag with a quick-connect reducer but no cylinder. It mounts on a G1 cylinder made for remote connection, and each cylinder needs its own Quick-Connect Cylinder Adapter.", "qh": "Your department is buying RIT air for G1 crews. Compare what arrives in the box with RescueAire II and with the G1 RIT System, including what you still need to order for each G1 RIT cylinder.", "ah": "RescueAire II comes complete: a harness-carried system with a G1 PR-14 reducer, G1 regulator, and Audi-Larm alarm, sold with a cylinder (4500 psi/60-min or 2216 psi/30-min). The G1 RIT System is a full RIT bag with a quick-connect reducer but no cylinder. It mounts on a G1 cylinder made for remote connection, and each cylinder needs its own Quick-Connect Cylinder Adapter."}, {"n": 2, "q": "Describe the two G1 RIT supply lines: their length, what each ends in, and which one refills the victim's cylinder. What does the URC fitting add?", "a": "Both are 6 ft. The high-pressure line ends in a female Quick-Fill fitting and refills the victim's cylinder through his UAC. The intermediate-pressure line ends in an ExtendAire II manifold (male and female quick-disconnects) and supplies breathing air. The URC fitting on the reducer lets you link G1 RIT systems together.", "qh": "Describe the two G1 RIT supply lines: their length, what each ends in, and which one refills the victim's cylinder. What does the URC fitting add?", "ah": "Both are 6 ft. The high-pressure line ends in a female Quick-Fill fitting and refills the victim's cylinder through his UAC. The intermediate-pressure line ends in an ExtendAire II manifold (male and female quick-disconnects) and supplies breathing air. The URC fitting on the reducer lets you link G1 RIT systems together."}, {"n": 3, "q": "Your RIT carries a 4500 psi supply. The downed member wears a 2216 psi G1. Can you Quick-Fill him from your 4500 supply? What protects his SCBA if it's over-pressurized?", "a": "No. MSA says the air at the Quick-Fill inlet must never exceed the SCBA's operating pressure, and a high-pressure SCBA must never connect to a supply above its operating system. If an emergency fill does over-pressurize it, the G1's automatically resetting relief valve vents the excess.", "qh": "Your RIT carries a 4500 psi supply. The downed member wears a 2216 psi G1. Can you Quick-Fill him from your 4500 supply? What protects his SCBA if it's over-pressurized?", "ah": "No. MSA says the air at the Quick-Fill inlet must never exceed the SCBA's operating pressure, and a high-pressure SCBA must never connect to a supply above its operating system. If an emergency fill does over-pressurize it, the G1's automatically resetting relief valve vents the excess."}, {"n": 4, "q": "Walk through a G1 Quick-Fill. How do you know the fill has started and finished, about how long does it take, and why might his cylinder not reach full?", "a": "With his cylinder valve fully open, push the female fitting onto his UAC until it clicks, then tug-test it. Filling starts immediately, and pressures equalize in about 60 seconds. It's done when his cylinder and remote gauges match the supply gauge. If the supply doesn't hold enough air, his cylinder won't reach full.", "qh": "Walk through a G1 Quick-Fill. How do you know the fill has started and finished, about how long does it take, and why might his cylinder not reach full?", "ah": "With his cylinder valve fully open, push the female fitting onto his UAC until it clicks, then tug-test it. Filling starts immediately, and pressures equalize in about 60 seconds. It's done when his cylinder and remote gauges match the supply gauge. If the supply doesn't hold enough air, his cylinder won't reach full."}, {"n": 5, "q": "After you pull the hose off, air keeps hissing from the victim's UAC and the dust cap won't stay on. What do you do?", "a": "Reconnect the Quick-Fill hose to seal the leak and go to fresh air. If it won't reconnect, close his cylinder valve, put the dust cap on, reopen the valve, and leave immediately.", "qh": "After you pull the hose off, air keeps hissing from the victim's UAC and the dust cap won't stay on. What do you do?", "ah": "Reconnect the Quick-Fill hose to seal the leak and go to fresh air. If it won't reconnect, close his cylinder valve, put the dust cap on, reopen the valve, and leave immediately."}, {"n": 6, "q": "Name four things the G1 manual forbids when using the UAC fitting.", "a": "Any four of: using it where a CBRN agent could be present, using it as a buddy breather (two users on one cylinder, which voids the NIOSH approval), transfilling a 5500 psi SCBA, lubricating the fittings, letting oil or grease touch them, using non-MSA hoses, or feeding air above the SCBA's operating pressure.", "qh": "Name four things the G1 manual forbids when using the UAC fitting.", "ah": "Any four of: using it where a CBRN agent could be present, using it as a buddy breather (two users on one cylinder, which voids the NIOSH approval), transfilling a 5500 psi SCBA, lubricating the fittings, letting oil or grease touch them, using non-MSA hoses, or feeding air above the SCBA's operating pressure."}, {"n": 7, "q": "A partner suggests connecting two G1s with ExtendAire II instead of the Quick-Fill. What happens to both SCBAs and their air time, and when is ExtendAire not allowed?", "a": "Both SCBAs become escape-only, both users must leave at once, and remaining service time drops by about half. Don't connect if the donor's low-pressure alarm is sounding or he lacks enough air for both to escape, or in a possible CBRN atmosphere. MSA says Quick-Fill has fewer risks and keeps the approval.", "qh": "A partner suggests connecting two G1s with ExtendAire II instead of the Quick-Fill. What happens to both SCBAs and their air time, and when is ExtendAire not allowed?", "ah": "Both SCBAs become escape-only, both users must leave at once, and remaining service time drops by about half. Don't connect if the donor's low-pressure alarm is sounding or he lacks enough air for both to escape, or in a possible CBRN atmosphere. MSA says Quick-Fill has fewer risks and keeps the approval."}, {"n": 8, "q": "A neighboring department's member has a Snap-Tite buddy-breather fitting. Can you connect your 2018 G1 ExtendAire II to it, and what does MSA say about connecting to another brand's UEBSS?", "a": "No. Snap-Tite and UEBSS fittings don't work correctly together. The G1's UEBSS fittings can connect to other brands' UEBSS, but NFPA 1981 (2018) doesn't require cross-brand testing, so MSA doesn't warrant either SCBA in that hookup.", "qh": "A neighboring department's member has a Snap-Tite buddy-breather fitting. Can you connect your 2018 G1 ExtendAire II to it, and what does MSA say about connecting to another brand's UEBSS?", "ah": "No. Snap-Tite and UEBSS fittings don't work correctly together. The G1's UEBSS fittings can connect to other brands' UEBSS, but NFPA 1981 (2018) doesn't require cross-brand testing, so MSA doesn't warrant either SCBA in that hookup."}, {"n": 9, "q": "You topped off a cylinder through the UAC right after its first fill, and it came up short of the rated time. What did MSA recommend?", "a": "Wait until the cylinder cools to 70 °F (21 °C) after the first fill before topping off. Air heats as it's compressed, so a hot cylinder holds less air once it cools.", "qh": "You topped off a cylinder through the UAC right after its first fill, and it came up short of the rated time. What did MSA recommend?", "ah": "Wait until the cylinder cools to 70 °F (21 °C) after the first fill before topping off. Air heats as it's compressed, so a hot cylinder holds less air once it cools."}], "sources": [{"label": "MSA G1 RescueAire II and G1 RIT System bulletin", "url": "https://media.msanet.com/advisor/G1_%20RescueAireII_and_%20RIT_System_Bulletin0105_201.pdf"}, {"label": "MSA G1 SCBA Operating Manual (RIC UAC, Quick-Fill)", "url": "https://s7d9.scene7.com/is/content/minesafetyappliances/10187007_USOperatingManual-G1SCBA2018Ed"}, {"label": "MSA G1 user assets", "url": "https://us.msasafety.com/g1-scba-user-assets?locale=en"}, {"label": "MSA G1 SCBA 2018 Edition Operating Manual 10187007-03, sections 2.4.1 (RIC UAC relief valve), 13 (UAC fitting, filling, transfilling, leakage), and 14 (ExtendAire II): same link as above", "url": ""}, {"label": "MSA RescueAire Portable Air-Supply Systems literature 0114-18-MC (2012), History only", "url": "https://www.empirescba.com/PDF/MSA-RescuAire-II-Portable-Air-Supply-System.pdf"}], "position_html": "<strong>Tree position:<\/strong> Path 04 RIT &gt; 04.2 RIT Air Supply Packs &gt; tool. <strong>Unlocks after:<\/strong> 01.2.2 MSA G1 SCBA. <strong>Cross-links:<\/strong> 09.1.1 PASS, 01.2.2 (RIC UAC and Quick-Fill).", "note_html": "Study aid only. Source: MSA bulletin 0105-201-MC (Nov 2015). Get the current G1 RIT operating instructions from MSA before operational use."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 629.31, "y": -261.45, "angle": 105.5, "vx": -370.55, "vy": 633.4, "vangle": 350.5}, "04.3": {"id": "04.3", "name": "Downed Firefighter Packaging, Drags and Removal", "path": "04", "kind": "main", "parent": null, "prereqRaw": "04.2, 03.1", "children": [], "prereqs": ["04.2", "03.1"], "unlocks": ["04.4", "04.C"], "cross": ["03.1", "03.1.1", "03.1.2"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 840, "y": -300.0, "vx": -410.0, "vy": 790, "vangle": null}, "04.4": {"id": "04.4", "name": "RIT Tool Cache and Deployment", "path": "04", "kind": "main", "parent": null, "prereqRaw": "04.3, 03.2, 03.3", "children": [], "prereqs": ["04.3", "03.2", "03.3"], "unlocks": ["04.C"], "cross": ["03.2", "03.3", "05.2.3"], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1040, "y": -300.0, "vx": -410.0, "vy": 940, "vangle": null}, "04.C": {"id": "04.C", "name": "CAPSTONE: RIT Specialist", "path": "04", "kind": "capstone", "parent": null, "prereqRaw": "04.1 to 04.4", "children": [], "prereqs": ["04.1", "04.2", "04.3", "04.4"], "unlocks": [], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 1640, "y": -300.0, "vx": -410.0, "vy": 1390, "vangle": null}, "05.1": {"id": "05.1", "name": "Vehicle Stabilization and Extrication Scene Safety", "path": "05", "kind": "main", "parent": null, "prereqRaw": "01.0", "children": [], "prereqs": ["01.0"], "unlocks": ["05.2", "05.C"], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 440, "y": -150.0, "vx": -205.0, "vy": 490, "vangle": null}, "05.2": {"id": "05.2", "name": "Hydraulic Extrication Tools (Holmatro)", "path": "05", "kind": "main", "parent": null, "prereqRaw": "05.1", "children": ["05.2.0", "05.2.1", "05.2.2", "05.2.3"], "prereqs": ["05.1"], "unlocks": ["05.2.0", "05.2.1", "05.2.2", "05.2.3", "05.3", "05.5", "05.C"], "cross": [], "doc": null, "hasContent": false, "counts": [], "disagreements": [], "datasets": [], "x": 640, "y": -150.0, "vx": -205.0, "vy": 640, "vangle": null}, "05.2.0": {"id": "05.2.0", "name": "Hydraulic Rescue Tools: Overview", "path": "05", "kind": "tool", "parent": "05.2", "prereqRaw": "parent 05.2", "children": [], "prereqs": ["05.2"], "unlocks": [], "cross": ["03.2"], "doc": {"title": "05.2.0 Hydraulic Rescue Tools: Overview (Holmatro Focus)", "file": "05.2.0_Hydraulic_Extrication_Tools_Overview.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>Hydraulic rescue tools (\"Jaws of Life\" is a Hurst trademark) open, cut, push, and pull vehicle and structural parts to free trapped patients. The main tools are:<\/p><ul><li><strong>Spreader:<\/strong> pushes apart, squeezes, and (with chains) pulls.<\/li><li><strong>Cutter:<\/strong> shears posts, pillars, and bars.<\/li><li><strong>Combi tool:<\/strong> spreads, cuts, and squeezes in one tool.<\/li><li><strong>Ram:<\/strong> pushes over long distances (dash rolls and lifts).<\/li><\/ul>"}, {"key": "specs", "title": "Key specs (Holmatro, current)", "html": "<ul><li><strong>Pentheon (next-gen) cordless series:<\/strong> battery-hydraulic cutters (PCU), spreaders (PSP), rams (PRA/PTR), and combi tools (PCT).<\/li><li><strong>Battery PBPA288:<\/strong> Li-ion, <strong>28 VDC, 8 Ah<\/strong>. <strong>IP57<\/strong> protection on all Pentheon tools. On-Tool Charging, and one outlet can charge up to six batteries.<\/li><li><strong>Controls:<\/strong> 360° inline two-speed control handle with stepless speed, plus training and high-speed modes. App and Self Check connectivity.<\/li><li><strong>Hose (hydraulic) tools:<\/strong> run off a power unit such as the Holmatro Spider Series pump at <strong>720 bar / 10,500 psi<\/strong> working pressure.<\/li><li><strong>Ratings:<\/strong> NFPA 1960 (US) gives HSF/LSF (highest and lowest spreading force), HPF/LPF (highest and lowest pulling force), and cutting capacity codes (letters for material category, numbers for level). EN 13204 gives the European class code (e.g., BC165I-18.8). Compare tools with these numbers, not marketing figures.<\/li><\/ul>"}, {"key": "how", "title": "How it's used (big picture)", "html": "<ol><li>Size up the scene and hazards. Stabilize the vehicle first (chocks, cribbing, struts).<\/li><li>Manage the glass. Protect the patient with a hard or soft shield between the tool and the patient.<\/li><li>Open space. Typical work is door removal (spreader), roof removal (cutter), and dash roll or lift (ram).<\/li><li>Check the tool after use, clean and lubricate it, and store it per the manual.<\/li><\/ol>"}, {"key": "safety", "title": "Safety considerations (from Holmatro manuals)", "html": "<ul><li>PPE: helmet, goggles or a full face shield, gloves, full-body reflective clothing, and safety boots. Wear a filter mask when cutting glass or plastics.<\/li><li>Never get between the tool and the object. Keep bystanders back.<\/li><li><strong>Oil leak under pressure can inject into skin.<\/strong> Stop and get medical care immediately, and bring the oil spec with you.<\/li><li>Stop if the tool makes strange noises, behaves oddly, or leaks.<\/li><li>Never cut parts under hydraulic, pneumatic, electrical, or mechanical tension.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Name the four main hydraulic rescue tools and their primary jobs.", "a": "Spreader (push, squeeze, pull), cutter (shear), combi (spread, cut, squeeze), ram (long push).", "qh": "Name the four main hydraulic rescue tools and their primary jobs.", "ah": "Spreader (push, squeeze, pull), cutter (shear), combi (spread, cut, squeeze), ram (long push)."}, {"n": 2, "q": "What do HSF and LSF mean in NFPA 1960 ratings?", "a": "Highest spreading force and lowest spreading force.", "qh": "What do HSF and LSF mean in NFPA 1960 ratings?", "ah": "Highest spreading force and lowest spreading force."}, {"n": 3, "q": "What is the working pressure of Holmatro hose tools powered by a Spider pump?", "a": "720 bar / 10,500 psi.", "qh": "What is the working pressure of Holmatro hose tools powered by a Spider pump?", "ah": "720 bar / 10,500 psi."}, {"n": 4, "q": "What is the first step before any cutting or spreading on a vehicle?", "a": "Scene size-up and vehicle stabilization.", "qh": "What is the first step before any cutting or spreading on a vehicle?", "ah": "Scene size-up and vehicle stabilization."}, {"n": 5, "q": "What must you do if pressurized oil penetrates skin?", "a": "Go to a hospital immediately and give the medical staff the oil specification.", "qh": "What must you do if pressurized oil penetrates skin?", "ah": "Go to a hospital immediately and give the medical staff the oil specification."}], "sources": [{"label": "Holmatro Next-Gen Pentheon Series catalog 2026",
