o", "url": "https://www.fire.ca.gov/what-we-do"}, {"label": "CAL FIRE Our Organization", "url": "https://www.fire.ca.gov/about/our-organization"}, {"label": "CAL FIRE Cooperative Efforts", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/cooperative-efforts/"}, {"label": "CAL FIRE OV-10 page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program/cal-fire-ov10"}, {"label": "CAL FIRE King Air page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program/cal-fire-king-air"}, {"label": "Anale Burlew profile", "url": "https://www.fire.ca.gov/about/executive-staff/profile-list/anale-burlew"}, {"label": "Joe Tyler profile", "url": "https://www.fire.ca.gov/about/executive-staff/profile-list/joe-tyler"}, {"label": "Fire Captain exam bulletin EX-5398", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=5398"}, {"label": "Firefighter I posting JC-533177", "url": "https://calcareers.ca.gov/CalHrPublic/Jobs/JobPosting.aspx?JobControlId=533177"}, {"label": "Ready for Wildfire, Defensible Space", "url": "https://www.readyforwildfire.org/prepare-for-wildfire/defensible-space/"}, {"label": "2026-27 Governor's Budget Summary, Natural Resources", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}, {"label": "Ranger batches: /workspace/can-report/calfire/calfire-batch-01.md, calfire-batch-02.md", "url": ""}, {"label": "CICCS Qualification Guide 2026 (Cal OES)", "url": "https://www.caloes.ca.gov/wp-content/uploads/Fire-Rescue/Documents/Admin.2026.Docs/2026_CICCS_QUALIFICATIONS_GUIDE.pdf"}, {"label": "CICCS Guide 2025 (with appendices, updated 05.12.25)", "url": "https://www.caloes.ca.gov/wp-content/uploads/Fire-Rescue/CICCS-Guide-2025-Updated-05-12-25.pdf"}, {"label": "Cal OES Fire and Rescue Documents & Publications", "url": "https://www.caloes.ca.gov/office-of-the-director/operations/response-operations/fire-rescue/documents-publications/"}, {"label": "FIRESCOPE Training (CICCS)", "url": "https://firescope.caloes.ca.gov/training"}, {"label": "FIRESCOPE Field Operations Guide ICS 420-1", "url": "https://firescope.caloes.ca.gov/fog-manual"}, {"label": "FIRESCOPE ICS 702 Fireline EMT / Fireline Paramedic", "url": "https://firescope.caloes.ca.gov/ICS%20Documents/ICS%20702.pdf"}, {"label": "Matthew Sully profile", "url": "https://www.fire.ca.gov/about/executive-staff/profile-list/matthew-sully"}, {"label": "CAL FIRE Lake Fire update (20 Jul 2024)", "url": "https://www.fire.ca.gov/incidents/2024/7/5/lake-fire/updates/18041097-5e00-4a71-a974-fcdd3e167305"}, {"label": "Ranger batch 05: /workspace/can-report/calfire/calfire-batch-05.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 8. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 09.4 Incident Command System (NIMS/ICS) (CAL FIRE incident roles and mutual aid), 10.6.4 Programs and Contract Counties.", "note_html": "Study aid only. Source: CAL FIRE Fire Protection, What We Do, Our Organization, and Cooperative Efforts pages; aviation type pages; executive profiles; the 2026-27 Governor's Budget (Ranger calfire-batch-01, -02). Batch 05 adds the 2026 CICCS Qualification Guide (Cal OES), the FIRESCOPE ICS library, and the Field Operations Guide (FOG). These are the statewide official position catalog. No public CAL FIRE-authored ICS handbook or IMT org catalog was found."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1425.81, "y": 694.95, "angle": 98.5, "vx": 758.37, "vy": 1211.26, "vangle": 205.0}, "10.6.9": {"id": "10.6.9", "name": "Aviation Program (Aircraft and Bases)", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.6.3"], "doc": {"title": "10.6.9 Aviation Program (Aircraft and Bases)", "file": "10.6.9_Aviation_Program_Aircraft_and_Bases.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>\"The CAL FIRE Aviation Program operates the world's largest aerial firefighting fleet.\" It aims to reach the most remote SRA fires in <strong>about 20 minutes<\/strong> and keep <strong>95% of fires at 10 acres or less<\/strong>. Fleet types: <strong>Grumman S-2T<\/strong> and <strong>C-130H Hercules<\/strong> airtankers, <strong>Sikorsky S-70i FIREHAWK<\/strong> helicopters, <strong>OV-10 Bronco<\/strong> tactical aircraft, and <strong>King Air<\/strong> training and intelligence aircraft. The Aviation Program page still lists <strong>Bell UH-1H Super Hueys<\/strong>, but all ten helitack bases have converted from the UH-1H to the Fire Hawk (Governor, 31 Jul 2025), and the UH-1H fact sheet says Super Hueys are being placed \"in reserve status.\" The UH-1H is treated here as a reserve type, not a front-line type. The program is also integrating uncrewed aerial systems (UAS).<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<p><strong>Official counts, side by side (basis as Ranger tagged it):<\/strong><\/p><ul><li><strong>Aircraft:<\/strong><ul><li>over 70 (unclear; Aviation Program page)<\/li><li>over 60 (unclear; Fire Protection page)<\/li><\/ul><\/li><li><strong>Air tanker bases:<\/strong><ul><li>1 (unclear; Aviation Program page and 2026-27 Budget \"operates\")<\/li><li>14 (unclear; Fire Protection page)<\/li><\/ul><\/li><li><strong>Air attack bases:<\/strong><ul><li>13 (active; Aviation Program page and Budget)<\/li><li>16 (active; Facilities Public View, which includes county and federal sites)<\/li><\/ul><\/li><li><strong>Helitack bases:<\/strong><ul><li>11 (active; Aviation Program page and Budget)<\/li><li>10 CAL FIRE + 1 CAL FIRE/San Diego County Sheriff (active; Fire Protection page, different labeling)<\/li><li>17 (active; Facilities Public View, which includes county and contract sites)<\/li><li>Dated notes (Governor releases, kept separate from the counts above): the 31 Jul 2025 release marks the \"full conversion of all ten CAL FIRE Helitack bases\" to the Fire Hawk. The 4 Jun 2026 release announces California's 11th Helitack base at Ramona.<\/li><\/ul><\/li><\/ul><p><strong>Aircraft (type pages):<\/strong><\/p><ul><li><strong>S-2T airtanker:<\/strong><ul><li>1 pilot, 1,200 gal of long-term retardant.<\/li><li>270 mph max, 4.5 hr endurance.<\/li><li>Two Garrett TPE331 turbines.<\/li><li>Initial-attack retardant delivery.<\/li><\/ul><\/li><li><strong>C-130H Hercules:<\/strong><ul><li>3 crew (pilot, co-pilot, flight engineer), 4,000 gal of retardant.<\/li><li>368 mph max, 8 hr endurance.<\/li><li>The first entered service at McClellan on 26 Aug 2024. The type page lists McClellan and Fresno Air Tanker Bases. That list doesn't reflect the Ramona (4 Jun 2026) or Paso Robles (19 Oct 2026) placements, so don't use it as the current station list.<\/li><\/ul><\/li><li><strong>OV-10 Bronco:<\/strong><ul><li>The primary <strong>command-and-control<\/strong> platform.<\/li><li>Crew is a pilot plus an observer (Chief Officer or Fire Captain) serving as <strong>Air Attack Officer<\/strong>.<\/li><li>Can act as an <strong>Aerial Supervision Module<\/strong>.<\/li><\/ul><\/li><li><strong>S-70i FIREHAWK:<\/strong><ul><li>Night-capable, with a 1,000-gal water tank, about 2.5 hr fuel, and external rescue hoists.<\/li><li>Missions: rapid initial attack and complex rescue.<\/li><li>Funding for 12 was secured in 2018, with 4 more approved in FY 2022-23.<\/li><li><strong>Fleet of 16:<\/strong> the final two of sixteen arrived at McClellan Airfield, \"bringing CAL FIRE's Fire Hawk fleet to a total of 16 stationed throughout the state\" (Governor, 31 Jul 2025).<\/li><\/ul><\/li><li><strong>UH-1H Super Huey (reserve, not front-line):<\/strong><ul><li>All ten helitack bases converted from the UH-1H to the Fire Hawk (Governor, 31 Jul 2025). The Apr 2025 fact sheet says CAL FIRE \"continues to place our Super Huey helicopters in reserve status as CAL FIRE HAWKS are placed in service.\" No reserve count is given here.<\/li><li>Type-page missions (they describe the type, not a current front-line role): initial attack, rescue, helitack crew, firing operations (Helitorch or Plastic Spherical Dispenser), cargo, mapping, and medevac.<\/li><li>Payload: 324-gal bucket or 360-gal fixed tank.<\/li><li>Crew: one pilot, two Helitack Captains, and eight personnel.<\/li><\/ul><\/li><li><strong>King Air 200:<\/strong><ul><li><strong>Intel 641<\/strong> aerial intelligence and mapping, collecting more than 290,000 acres/hour.<\/li><li>Also the <strong>ATGS<\/strong> training platform.<\/li><li>In operational service since 2010.<\/li><\/ul><\/li><\/ul><p><strong>Ramona (Governor, 4 Jun 2026):<\/strong><\/p><ul><li>The <strong>fourth C-130H<\/strong> entered active service, \"the fourth aircraft out of a planned statewide fleet of seven.\"<\/li><li><strong>California's 11th Helitack base<\/strong> opened at Ramona.<\/li><li>Ramona is \"the oldest air attack base in the department's system\" and will expand its permanent fleet to five aircraft.<\/li><\/ul><p><strong>2026-27 Budget:<\/strong> $123.9 million one-time and $61.4 million ongoing General Fund, plus 51 positions. It supports <strong>seven C-130s<\/strong>, extends S-2T life, and buys <strong>four more S-70i<\/strong> so flight operations continue when frontline helicopters are in maintenance.<\/p><p><strong>Aviation Management Unit:<\/strong> 5500 Price Avenue, McClellan.<\/p><p><strong>Fleet status by type (batches 06 and 07, retrieved 17 Nov 2026; confirmed items only):<\/strong><\/p><ul><li><strong>S-70i Fire Hawk:<\/strong> a fleet of <strong>16<\/strong> (Governor, 31 Jul 2025).<\/li><li><strong>UH-1H Super Huey:<\/strong> <strong>in reserve<\/strong>. All ten helitack bases converted to the Fire Hawk (Governor, 31 Jul 2025), and the fact sheet describes reserve status. No count is given.<\/li><li><strong>C-130H:<\/strong> <strong>5 (active)<\/strong> vs <strong>7 (planned)<\/strong>. CAL FIRE's 14 Nov 2026 post says \"CAL FIRE is putting its fifth C-130H airtanker into service, another major step toward a planned fleet of seven\" (@CAL_FIRE; @calfireSCU used the same \"fifth C-130H\" wording on 23 Oct 2026). The first entered service 26 Aug 2024 at McClellan, and the fourth on 4 Jun 2026 at Ramona (Governor). A C-130H airframe arrived at the <strong>Paso Robles Air Attack Base on 19 Oct 2026<\/strong> (CAL FIRE San Luis Obispo Unit release, 20 Oct 2026). The Governor's 6 Oct 2026 release still said the state \"operates four\"; it predates the fifth. The 2026-27 Budget's seven C-130s is a program-level figure, not seven in service.<\/li><li><strong>S-2T:<\/strong> <strong>23 (per the fact sheet, which is undated and was posted by Apr 2025)<\/strong> vs <strong>26 (acquired in 1996 through FEPP)<\/strong>. The fact sheet says \"CAL FIRE has 23 S-2T one of which is in Sacramento at CAL FIRE's Aviation Management Unit (AMU) as maintenance relief.\" The sources don't explain the gap between 26 acquired and 23 on hand (unverified), so don't merge or explain the two figures.<\/li><li><strong>OV-10, King Air 200 (Intel 641):<\/strong> current types. Counts are withheld until Ranger confirms them. <strong>FIRIS<\/strong> is a separate program flown \"along with\" Intel 641 (Governor, 4 Jun 2026), not CAL FIRE fleet.<\/li><li><strong>Global Hawk:<\/strong> not found as a CAL FIRE aircraft type. The Aviation Program page says UAS are integrated but gives no UAS inventory.<\/li><\/ul><p><strong>S-70i crews (S-70i page):<\/strong><\/p><ul><li><strong>Day crew, conflicting on the same official page (shown side by side, not quizzed):<\/strong><ul><li>Listed roles: 1 Pilot, 2 Helitack Captains, 1 Operations Supervisor, and 6 Firefighters. These sum to 10.<\/li><li>The same list ends: \"Up to 9 personnel total.\"<\/li><li>Both wordings are official. They're not reconciled here.<\/li><\/ul><\/li><li><strong>Night crew:<\/strong> 1 Pilot, 1 Front Seat Captain, 1 Operations Supervisor, 1 Night Operations Crewmember, 1 Helitender with operator, and 1 Base mechanic.<\/li><li><strong>Rescue crew:<\/strong> 1 Pilot, 1 Crew Chief, and 2 to 3 Rescuers.<\/li><\/ul><p><strong>Publications:<\/strong> the Communications Office page lists an Aviation Program Overview (PDF, also in Spanish), the Aviation Recognition Guide (print-friendly PDF and interactive), and type PDFs for the S-2T, UH-1H Super Huey, OV-10A, C-130H, Sikorsky S70i, Hoist Rescue, and Fire Retardant. The Aviation Program page links an Aviation Program Fact Sheet. These PDF bodies weren't retrieved, so any counts inside them are unverified.<\/p>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Retardant:<\/strong> S-2Ts fly fast initial attack from air attack bases, and C-130Hs carry larger loads from tanker bases.<\/li><li><strong>In the air:<\/strong> the OV-10's Air Attack Officer coordinates with the incident commander, runs all aerial resources, and directs drops.<\/li><li><strong>Helitack:<\/strong> S-70i Fire Hawks, now flown from all ten converted helitack bases (Governor, 31 Jul 2025), insert helitack crews, drop water, and perform rescues. The S-70i is night-capable. The UH-1H is in reserve (fact sheet).<\/li><li><strong>Intelligence:<\/strong> the King Air (Intel 641) maps fire perimeters from the air.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li><strong>S-2T:<\/strong> in 1996 CAL FIRE acquired 26 S-2E/G planes through FEPP. Marsh Aviation converted them, and the final three S-2Ts were delivered in 2005. That's acquisition history, not a current inventory.<\/li><li><strong>OV-10:<\/strong> in 1993, 15 OV-10As were acquired through FEPP, replacing Cessna O-2As. In 2009, three OV-10Ds were acquired, and one has been converted.<\/li><li><strong>UH-1:<\/strong> in 1981, 12 UH-1Fs were acquired through FEPP. In 1990 they were replaced by modified UH-1H \"Super Hueys.\" The Governor's 31 Jul 2025 release says the Huey was the helitack workhorse \"for over four decades.\" It also says the transition to the Fire Hawk began in 2018, the first base received a Fire Hawk in 2020, and all ten bases were converted by 2025.<\/li><li><strong>C-130H:<\/strong> in July 2018 California got approval to acquire seven C-130Hs. The NDAA (Dec 2023) authorized transfer from the U.S. Coast Guard.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "A fast-moving fire needs the biggest retardant load available from a tanker base. Which airtanker fits better, an S-2T or a C-130H? Compare crew and payload.", "a": "The C-130H: a 3-person crew (pilot, co-pilot, flight engineer) and 4,000 gal of long-term retardant, versus the S-2T's single pilot and 1,200 gal (type pages).", "qh": "A fast-moving fire needs the biggest retardant load available from a tanker base. Which airtanker fits better, an S-2T or a C-130H? Compare crew and payload.", "ah": "The C-130H: a 3-person crew (pilot, co-pilot, flight engineer) and 4,000 gal of long-term retardant, versus the S-2T's single pilot and 1,200 gal (type pages).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "C-130H: 3 crew and 4,000 gal, vs the S-2T's 1 pilot and 1,200 gal", "wh": ["S-2T: 3 crew and 4,000 gal, vs the C-130H's 1 pilot and 1,200 gal", "C-130H: 2 crew and 3,000 gal, vs the S-2T's 1 pilot and 1,200 gal", "C-130H: 3 crew and 4,000 gal, vs the S-2T's 2 pilots and 2,000 gal"], "hash": "sha256:6a30bd25d8635b9e7ba406befce87608ec3f429951160e8005f4307fbb68dbc0"}, {"n": 2, "q": "A hiker is injured on a steep ridge after dark, and the IC wants a helicopter hoist rescue. Which CAL FIRE helicopter type fits, and what does its type page say about its capabilities?", "a": "The S-70i Fire Hawk. Its type page describes it as night-capable, with external rescue hoists and a 1,000-gal tank, and its missions include complex rescue (S-70i page).", "qh": "A hiker is injured on a steep ridge after dark, and the IC wants a helicopter hoist rescue. Which CAL FIRE helicopter type fits, and what does its type page say about its capabilities?", "ah": "The S-70i Fire Hawk. Its type page describes it as night-capable, with external rescue hoists and a 1,000-gal tank, and its missions include complex rescue (S-70i page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "S-70i Fire Hawk: night-capable, external rescue hoists, 1,000-gal tank", "wh": ["S-70i Fire Hawk: night-capable, external rescue hoists, 2,000-gal tank", "S-70i Fire Hawk: night-capable, internal cabin hoist only, 1,000-gal tank", "S-70i Fire Hawk: night-capable, external rescue hoists, 360-gal fixed tank"], "hash": "sha256:97ac656064c15a00e246cb14a1bf34434334192f5b0031b739e6fa62c763c7d9"}, {"n": 3, "q": "A new helitack crew member in late 2025 asks whether their base still flies the UH-1H Super Huey. What do official sources say about the ten helitack bases and the Super Huey's status?", "a": "No. The Governor's 31 Jul 2025 release marks the full conversion of all ten CAL FIRE helitack bases from the UH-1H to the Fire Hawk. The UH-1H fact sheet says Super Hueys are being placed in reserve status as Fire Hawks are placed in service (Governor, 31 Jul 2025; UH-1H fact sheet).", "qh": "A new helitack crew member in late 2025 asks whether their base still flies the UH-1H Super Huey. What do official sources say about the ten helitack bases and the Super Huey's status?", "ah": "No. The Governor's 31 Jul 2025 release marks the full conversion of all ten CAL FIRE helitack bases from the UH-1H to the Fire Hawk. The UH-1H fact sheet says Super Hueys are being placed in reserve status as Fire Hawks are placed in service (Governor, 31 Jul 2025; UH-1H fact sheet).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "All ten bases converted to the Fire Hawk; Super Hueys placed in reserve status", "wh": ["All ten bases converted to the Fire Hawk; Super Hueys kept as front-line night helicopters", "Half the bases converted to the Fire Hawk; Super Hueys still front-line at the rest", "All ten bases still fly the Super Huey; Fire Hawks are held in reserve status"], "hash": "sha256:52107965765916e6d30ef44ee315a58f647a6e23539f598eba042b3e330ea37c"}, {"n": 4, "q": "Who in the air coordinates directly with the incident commander and directs drops? In which aircraft, and what extra lead role can that aircraft take on?", "a": "The Air Attack Officer, a fire officer, flying in the OV-10. With the right staffing, the OV-10 can also fill the Aerial Supervision Module role, leading airtankers on drop runs (OV-10 page).", "qh": "Who in the air coordinates directly with the incident commander and directs drops? In which aircraft, and what extra lead role can that aircraft take on?", "ah": "The Air Attack Officer, a fire officer, flying in the OV-10. With the right staffing, the OV-10 can also fill the Aerial Supervision Module role, leading airtankers on drop runs (OV-10 page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Air Attack Officer in the OV-10; it can also lead airtankers as an Aerial Supervision Module", "wh": ["Air Attack Officer in the King Air; it can also lead airtankers as an Aerial Supervision Module", "Air Tactical Group Supervisor in the C-130H; it can also drop retardant", "Air Attack Officer in the OV-10; it can also map fire perimeters as Intel 641"], "hash": "sha256:c93ed15f04e028dc9a7cb175053eee36ea00d4539947208ba807fbf5a551efe4"}, {"n": 5, "q": "What is \"Intel 641,\" what does it collect, and what training role does the same aircraft type fill?", "a": "The King Air 200 aerial intelligence and mapping platform, collecting more than 290,000 acres per hour. The King Air is also the Air Tactical Group Supervisor (ATGS) training platform (King Air page).", "qh": "What is \"Intel 641,\" what does it collect, and what training role does the same aircraft type fill?", "ah": "The King Air 200 aerial intelligence and mapping platform, collecting more than 290,000 acres per hour. The King Air is also the Air Tactical Group Supervisor (ATGS) training platform (King Air page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "King Air 200 mapping: over 290,000 acres/hour; also the ATGS training platform", "wh": ["OV-10 mapping: over 290,000 acres/hour; also the Air Attack training platform", "King Air 200 mapping: over 29,000 acres/hour; also the ATGS training platform", "King Air 200 mapping: over 290,000 acres/hour; also the pilot training platform"], "hash": "sha256:07877cd3e8bd12d30567d683b24e5246548fb949073b34e3cd2c7ac6b62ccdbd"}, {"n": 6, "q": "What did the Governor's 4 Jun 2026 release announce about C-130H airtankers at Ramona, and how does it describe Ramona's place in the air attack system?", "a": "The fourth C-130H entered active service, stationed at Ramona Airport, \"the fourth aircraft out of a planned statewide fleet of seven.\" The release calls Ramona \"the oldest air attack base in the department's system\" (Governor, 4 Jun 2026).", "qh": "What did the Governor's 4 Jun 2026 release announce about C-130H airtankers at Ramona, and how does it describe Ramona's place in the air attack system?", "ah": "The fourth C-130H entered active service, stationed at Ramona Airport, \"the fourth aircraft out of a planned statewide fleet of seven.\" The release calls Ramona \"the oldest air attack base in the department's system\" (Governor, 4 Jun 2026).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "The fourth C-130H entered active service there; Ramona is the oldest air attack base", "wh": ["The first C-130H entered active service there; Ramona is the oldest air attack base", "The fourth C-130H entered active service there; Ramona is the newest air attack base", "The fourth C-130H was retired there; Ramona is the oldest air attack base"], "hash": "sha256:fa5286dc3678bb5e8b0624398cbb7191520d14ca4b7483fc64f1862d6d86d851"}, {"n": 7, "q": "A student says, \"The Aviation Program page says 13 air attack bases, but the facilities inventory shows 16. One must be wrong.\" How do you answer?", "a": "Both are official and both are tagged active, but they measure different scopes. The 13 is the program count (Aviation Program page and Budget). The 16 is Active TYPE=AAB rows in the Facilities inventory, which includes county, federal, and local-funded sites such as Fullerton, Pacoima, and Fresno (federal). Report both, because no official crosswalk exists (batch 02).", "qh": "A student says, \"The Aviation Program page says 13 air attack bases, but the facilities inventory shows 16. One must be wrong.\" How do you answer?", "ah": "Both are official and both are tagged active, but they measure different scopes. The 13 is the program count (Aviation Program page and Budget). The 16 is Active TYPE=AAB rows in the Facilities inventory, which includes county, federal, and local-funded sites such as Fullerton, Pacoima, and Fresno (federal). Report both, because no official crosswalk exists (batch 02).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Neither is wrong: program count vs inventory rows incl. county/federal sites; report both", "wh": ["The 13 is right; the inventory double-counts bases with two runways", "The 16 is right; the Aviation Program page and Budget are outdated", "Neither is right; average them and report about 14 air attack bases"], "hash": "sha256:dfaa06c34ee563817229aa9730de578b2994c5b0ff23a4815db8e62dfb8b0814"}, {"n": 8, "q": "The 2026-27 Budget funds four more S-70i helicopters. What gap are they meant to fill?", "a": "Aircraft availability, so flight operations continue during critical fire weather when frontline helicopters are due for maintenance (2026-27 Budget).", "qh": "The 2026-27 Budget funds four more S-70i helicopters. What gap are they meant to fill?", "ah": "Aircraft availability, so flight operations continue during critical fire weather when frontline helicopters are due for maintenance (2026-27 Budget).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Aircraft availability, so flight operations continue when frontline helicopters are in maintenance", "wh": ["Converting the last helitack bases off the UH-1H, still pending in 2026", "Replacing the OV-10 as the air attack command platform", "Night rescue coverage, since the current S-70i fleet is day-only"], "hash": "sha256:cdddce3191759edec73a80f2c31ee7142e198714342224482957af246be1c786"}, {"n": 9, "q": "What two numbers make up CAL FIRE's aviation response goal, and which page states them?", "a": "Reach remote SRA fires in about 20 minutes, and keep 95% of fires at 10 acres or less (Aviation Program page).", "qh": "What two numbers make up CAL FIRE's aviation response goal, and which page states them?", "ah": "Reach remote SRA fires in about 20 minutes, and keep 95% of fires at 10 acres or less (Aviation Program page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "About 20 minutes to remote SRA fires and 95% at 10 acres or less; Aviation Program page", "wh": ["About 20 minutes to remote SRA fires and 95% at 10 acres or less; Mobile Equipment page", "About 20 minutes to remote SRA fires and 90% at 10 acres or less; Aviation Program page", "About 10 minutes to remote SRA fires and 95% at 20 acres or less; Aviation Program page"], "hash": "sha256:a7ffa6a6978ff94b345ada1d64d18e6ef292b839708fabc27d56db2a759320ba"}, {"n": 10, "q": "A reporter in November 2026 writes, \"CAL FIRE flies seven C-130H airtankers.\" Using only the official sources in this doc, what can you actually say about the C-130H fleet, and what's missing?", "a": "Five are in service and seven are planned. CAL FIRE's 14 Nov 2026 post says it is \"putting its fifth C-130H airtanker into service, another major step toward a planned fleet of seven.\" The Budget's seven is program-level, not seven flying, so \"flies seven\" isn't supported (@CAL_FIRE, 14 Nov 2026; Governor, 4 Jun 2026).", "qh": "A reporter in November 2026 writes, \"CAL FIRE flies seven C-130H airtankers.\" Using only the official sources in this doc, what can you actually say about the C-130H fleet, and what's missing?", "ah": "Five are in service and seven are planned. CAL FIRE's 14 Nov 2026 post says it is \"putting its fifth C-130H airtanker into service, another major step toward a planned fleet of seven.\" The Budget's seven is program-level, not seven flying, so \"flies seven\" isn't supported (@CAL_FIRE, 14 Nov 2026; Governor, 4 Jun 2026).", "fmt": "A", "gateStatus": "failed"}, {"n": 11, "q": "A classmate says the S-70i fleet is just the 12 funded in 2018. What's the current official fleet figure and its source, and how does the 2026-27 Budget's S-70i item relate?", "a": "Out of date. The Governor's 31 Jul 2025 release says the final two of sixteen S-70i Fire Hawks arrived, bringing the fleet to 16 stationed throughout the state. Separately, the 2026-27 Budget funds four additional S-70i for aircraft availability when frontline helicopters are in maintenance.", "qh": "A classmate says the S-70i fleet is just the 12 funded in 2018. What's the current official fleet figure and its source, and how does the 2026-27 Budget's S-70i item relate?", "ah": "Out of date. The Governor's 31 Jul 2025 release says the final two of sixteen S-70i Fire Hawks arrived, bringing the fleet to 16 stationed throughout the state. Separately, the 2026-27 Budget funds four additional S-70i for aircraft availability when frontline helicopters are in maintenance.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "16, per the Governor's 31 Jul 2025 release; the Budget separately funds four more S-70i", "wh": ["12, per the 2018 funding; the four FY 2022-23 aircraft were never purchased", "16, per the Governor's 31 Jul 2025 release; the Budget cuts the fleet by four S-70i", "16, per the 2026-27 Budget; the Governor's release separately funds four more S-70i"], "hash": "sha256:9c83df674e880198eefb7df751417aa27d1bf1b581729753af37dc731cfcabca"}, {"n": 12, "q": "An S-70i is launched for a hoist rescue rather than a fire mission. What crew does the official S-70i page list for a rescue crew?", "a": "1 Pilot, 1 Crew Chief, and 2 to 3 Rescuers (S-70i page, Rescue Crew).", "qh": "An S-70i is launched for a hoist rescue rather than a fire mission. What crew does the official S-70i page list for a rescue crew?", "ah": "1 Pilot, 1 Crew Chief, and 2 to 3 Rescuers (S-70i page, Rescue Crew).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "1 Pilot, 1 Crew Chief, and 2 to 3 Rescuers", "wh": ["1 Pilot, 1 Crew Chief, and 4 to 5 Rescuers", "2 Pilots, 1 Crew Chief, and 2 to 3 Rescuers", "1 Pilot, 1 Front Seat Captain, and 2 to 3 Rescuers"], "hash": "sha256:6b38ce730055a72cbff38e1d9051e65bd6639ca697e0b60758dace7d984f5837"}], "sources": [{"label": "CAL FIRE Aviation Program", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program"}, {"label": "CAL FIRE Fire Protection", "url": "https://www.fire.ca.gov/what-we-do/fire-protection"}, {"label": "S-2T type page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program/cal-fire-s2t"}, {"label": "S-2T fact sheet (undated; posted by Apr 2025)", "url": "https://34c031f8-c9fd-4018-8c5a-4159cdff6b0d-cdn-endpoint.azureedge.net/-/media/calfire-website/what-we-do/fire-protection/aviation-program/s-2t-factsheet.pdf"}, {"label": "C-130H type page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program/cal-fire-c-130"}, {"label": "OV-10 type page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program/cal-fire-ov10"}, {"label": "S-70i type page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program/cal-fire-s-70"}, {"label": "UH-1H type page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program/cal-fire-uh-1h"}, {"label": "King Air type page", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/aviation-program/cal-fire-king-air"}, {"label": "Governor's release, fourth C-130H and new helitack base (4 Jun 2026)", "url": "https://www.gov.ca.gov/2026/06/04/governor-newsom-announces-expansion-of-the-worlds-largest-civilian-aerial-firefighting-fleet-deployment-of-fourth-c-130-h-airtanker-and-new-helitack-base/"}, {"label": "2026-27 Governor's Budget Summary, Natural Resources", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}, {"label": "CAL FIRE Facilities for Wildland Fire Protection, Public View", "url": "https://services1.arcgis.com/jUJYIo9tSA7EHvfZ/arcgis/rest/services/CAL_FIRE_Facilities_for_Wildland_Fire_Protection_-_Public_View/FeatureServer"}, {"label": "Ranger batch: /workspace/can-report/calfire/calfire-batch-02.md and calfire-batch-02.json (conflicting_counts)", "url": ""}, {"label": "CAL FIRE Communications Office (aviation publications)", "url": "https://www.fire.ca.gov/about/programs/communications"}, {"label": "Ranger batch 05: /workspace/can-report/calfire/calfire-batch-05.md", "url": ""}, {"label": "Governor's release, 16-aircraft Fire Hawk fleet and helitack conversion (31 Jul 2025)", "url": "https://www.gov.ca.gov/2025/07/31/as-trump-defunds-federal-firefighting-california-steps-up-introducing-the-worlds-largest-helicopter-firefighting-fleet/"}, {"label": "UH-1H Super Huey fact sheet (Apr 2025)", "url": "https://34c031f8-c9fd-4018-8c5a-4159cdff6b0d-cdn-endpoint.azureedge.net/-/media/calfire-website/what-we-do/fire-protection/aviation-program/uh-1h-factsheet.pdf"}, {"label": "CAL FIRE San Luis Obispo Unit release, C-130H arrival at Paso Robles (20 Oct 2026; official PDF copy hosted by KPRL)", "url": "https://kprl.com/wp-content/uploads/News-Release-OCT20-C130-to-Paso-Robles.pdf"}, {"label": "Ranger batch 06: /workspace/can-report/calfire/calfire-batch-06.md", "url": ""}, {"label": "CAL FIRE on X, fifth C-130H into service (14 Nov 2026)", "url": "https://x.com/CAL_FIRE/status/2121615454753997109"}, {"label": "CAL FIRE SCU on X, fifth C-130H (23 Oct 2026)", "url": "https://x.com/calfireSCU/status/2113676950107509033"}, {"label": "Governor's release, \"operates four\" C-130Hs (6 Oct 2026)", "url": "https://www.gov.ca.gov/2026/10/06/governor-newsom-announces-new-disaster-intelligence-satellites-opens-modernized-state-operations-center-as-trump-erodes-national-disaster-readiness/"}, {"label": "Ranger batch 07: /workspace/can-report/calfire/calfire-batch-07.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 9. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 10.6.3 Related Classifications (Aviation).", "note_html": "Study aid only. Source: CAL FIRE Aviation Program page and aircraft type pages, the Fire Protection page, the 2026-27 Governor's Budget, Governor's releases (31 Jul 2025, 4 Jun 2026), the UH-1H fact sheet (Apr 2025), a CAL FIRE San Luis Obispo Unit release (20 Oct 2026), official CAL FIRE X posts on the fifth C-130H (@calfireSCU 23 Oct 2026, @CAL_FIRE 14 Nov 2026), and the Facilities Public View inventory (Ranger calfire-batch-02, -05, -06, -07). The S-2T count comes from the official S-2T fact sheet (undated; posted by Apr 2025). Counts for the OV-10, King Air, UAS, and reserve UH-1H are withheld until Ranger confirms them. <strong>Official fleet and base counts disagree.<\/strong> They're shown side by side below with Ranger's basis tags. Don't pick one."}, "hasContent": true, "counts": [{"label": "C-130H airtankers", "active": {"value": "5", "source": {"label": "https://x.com/CAL_FIRE/status/2121615454753997109", "url": "https://x.com/CAL_FIRE/status/2121615454753997109"}}, "planned": {"value": "7", "basis": "statewide fleet", "source": {"label": "https://www.gov.ca.gov/2026/06/04/governor-newsom-announces-expansion-of-the-worlds-largest-civilian-aerial-firefighting-fleet-deployment-of-fourth-c-130-h-airtanker-and-new-helitack-base/", "url": "https://www.gov.ca.gov/2026/06/04/governor-newsom-announces-expansion-of-the-worlds-largest-civilian-aerial-firefighting-fleet-deployment-of-fourth-c-130-h-airtanker-and-new-helitack-base/"}}}], "disagreements": [], "datasets": [], "x": 1398.67, "y": 686.65, "angle": 115.5, "vx": 752.01, "vy": 1238.81, "vangle": 181.0}, "10.6.10": {"id": "10.6.10", "name": "Engines, Dozers, and Mobile Equipment", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.6.3"], "doc": {"title": "10.6.10 Engines, Dozers, and Mobile Equipment", "file": "10.6.10_Engines_Dozers_and_Mobile_Equipment.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>CAL FIRE's <strong>Mobile Equipment Program<\/strong> handles everything on wheels and tracks. The fleet includes fire engines, bulldozers, crew-carrying vehicles, administrative vehicles, mobile kitchen units (MKUs), mobile communications units, trailers, forklifts, construction equipment, ATVs, snowmobiles, and insect-control vehicles. The <strong>Mobile Equipment Facility in Davis<\/strong> designs, acquires, maintains, repairs, replaces, and disposes of CAL FIRE vehicles.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>Engine models (linked spec sheets):<\/strong> Model 14-15, Model 24, Model 25, and Model 34 &amp; 35.<\/li><li><strong>Pumps:<\/strong> \"two-stage, 500 GPM, PTO operated fire pumps with 180 GPM diesel powered auxiliary pumps,\" built to NFPA guidelines. Engines now have fully enclosed, air-conditioned cabs.<\/li><li><strong>Emergency Crew Transports (ECTs):<\/strong> 17-passenger, code 3 equipped, fully air conditioned.<\/li><li><strong>MKUs:<\/strong> 1,000-meal capacity. <strong>Mobile Communication Centers (MCCs)<\/strong> support incidents.<\/li><li><strong>Linked spec PDFs (Mobile Equipment page, checked 17 Nov 2026):<\/strong> Model 14-15, 24, 25, and 34 &amp; 35 Engines, Emergency Crew Transports, Bulldozers, Mobile Kitchen Units (MKUs), and Mobile Communication Centers (MCCs). The PDF bodies still weren't retrieved, so model-level pump GPM, tank gallons, crew, and chassis are <strong>unverified<\/strong> and aren't given here (batch 05).<\/li><li><strong>Dozers:<\/strong> later-model Caterpillar <strong>D6XL and D6M<\/strong> high-track dozers with enclosed, air-conditioned cabs.<\/li><li><strong>Year-round engines (2026-27 Budget):<\/strong> $32.6 million and 131 positions added <strong>13 more year-round engines<\/strong>. That \"expanded the fleet to a total of 356 engines\" and raised to <strong>65<\/strong> the engines resourced for baseline year-round staffing.<\/li><li><strong>Surge equipment:<\/strong> $35.8 million one-time plus $5.8 million ongoing to buy <strong>42 fire engines and 10 bulldozers<\/strong>. Since 2023, surge units have been staffed during elevated fire weather or to cover other engines on extended assignments.<\/li><\/ul><p><strong>Fleet counts, side by side (basis as Ranger tagged it):<\/strong><\/p><ul><li><strong>Vehicles:<\/strong><ul><li>over 3,000 (unclear; Mobile Equipment page opening)<\/li><li>over 2,800 (unclear; same page, \"current fleet\" paragraph)<\/li><\/ul><\/li><li><strong>Engines:<\/strong><ul><li>383 front-line in 12 models (unclear; Mobile Equipment \"current fleet\" paragraph)<\/li><li>356 (unclear; 2026-27 Budget)<\/li><li>84 (unclear; state-funded in the six Contract Counties, a different scope)<\/li><\/ul><\/li><li><strong>Bulldozers:<\/strong><ul><li>58 (active; Mobile Equipment \"current fleet\" paragraph)<\/li><li>12 (unclear; Contract Counties, a different scope)<\/li><li>10 (unclear; Budget surge purchase, a different scope)<\/li><\/ul><\/li><li><strong>Crew buses:<\/strong> 237 (same \"current fleet\" paragraph).<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Year-round engines<\/strong> cover the \"year-round fire season,\" addressing \"the need for additional resources earlier and later in the calendar year\" (Budget).<\/li><li><strong>Surge engines and dozers<\/strong> add capacity on elevated-fire-weather days, or backfill when other engines are out on extended assignments.<\/li><li><strong>Dozers<\/strong> are run by Heavy Fire Equipment Operators (class 6387, see 10.6.3).<\/li><li><strong>ECTs<\/strong> move hand crews. <strong>MKUs<\/strong> feed large incidents.<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li>ECTs evolved from 13-passenger crew-carrying vehicles in the 1970s (Mobile Equipment page).<\/li><li>The dozer fleet moved up from Caterpillar D6C dozers built in the 1960s (Mobile Equipment page).<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Describe the standard CAL FIRE engine fire pump as published, including its auxiliary pump.", "a": "Two-stage, 500 GPM, PTO-operated fire pumps with 180 GPM diesel-powered auxiliary pumps, built to NFPA guidelines (Mobile Equipment page).", "qh": "Describe the standard CAL FIRE engine fire pump as published, including its auxiliary pump.", "ah": "Two-stage, 500 GPM, PTO-operated fire pumps with 180 GPM diesel-powered auxiliary pumps, built to NFPA guidelines (Mobile Equipment page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Two-stage, 500 GPM, PTO-operated, with a 180 GPM diesel auxiliary pump; built to NFPA", "wh": ["Single-stage, 500 GPM, PTO-operated, with a 180 GPM diesel auxiliary pump; built to NFPA", "Two-stage, 1,000 GPM, PTO-operated, with a 180 GPM diesel auxiliary pump; built to NFPA", "Two-stage, 500 GPM, PTO-operated, with a 120 GPM gasoline auxiliary pump; built to NFPA"], "hash": "sha256:1414c0d055883ce27b837e4a1bf0e06f3e7b76f6ef5018cef63cb7c0620d0021"}, {"n": 2, "q": "Red Flag conditions are forecast and two of your unit's engines are out on a long assignment. What Budget-funded equipment exists for this, and how has it been used since 2023?", "a": "Surge equipment: 42 fire engines and 10 bulldozers bought with $35.8 million one-time and $5.8 million ongoing. Since 2023 they've been staffed during elevated fire weather or to cover other engines on extended assignments (2026-27 Budget).", "qh": "Red Flag conditions are forecast and two of your unit's engines are out on a long assignment. What Budget-funded equipment exists for this, and how has it been used since 2023?", "ah": "Surge equipment: 42 fire engines and 10 bulldozers bought with $35.8 million one-time and $5.8 million ongoing. Since 2023 they've been staffed during elevated fire weather or to cover other engines on extended assignments (2026-27 Budget).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Surge: 42 engines and 10 dozers; staffed in elevated fire weather or to cover extended assignments", "wh": ["Surge: 24 engines and 10 dozers; staffed in elevated fire weather or to cover extended assignments", "Surge: 42 engines and 20 dozers; staffed in elevated fire weather or to cover extended assignments", "Surge: 42 engines and 10 dozers; staffed only in winter for academy training"], "hash": "sha256:b7a82135c954964d41a6e58568f1d1eb2296fdc396a7009c7ec5a79c69cc2cc8"}, {"n": 3, "q": "Today 65 engines are resourced for baseline year-round staffing. What does the Budget say that number becomes, and what has to happen first?", "a": "With full 66-hour workweek implementation, engines staffed during the base period increase from 65 to 153. The 153 is a planned figure tied to full implementation (2026-27 Budget; see 10.6.12).", "qh": "Today 65 engines are resourced for baseline year-round staffing. What does the Budget say that number becomes, and what has to happen first?", "ah": "With full 66-hour workweek implementation, engines staffed during the base period increase from 65 to 153. The 153 is a planned figure tied to full implementation (2026-27 Budget; see 10.6.12).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "It rises from 65 to 153, with full 66-hour workweek implementation", "wh": ["It rises from 65 to 153, with full 56-hour workweek implementation", "It rises from 65 to 135, with full 66-hour workweek implementation", "It rises from 56 to 153, with the 13 new year-round engines"], "hash": "sha256:ac1a2cdb13a888a98b11b5b865dfd4cd4c00ebae19a48ba3cb5355c98c301809"}, {"n": 4, "q": "A classmate writes \"CAL FIRE has 383 engines\" on a flashcard. What's wrong with presenting that as the single answer?", "a": "The 383 figure is from one paragraph of the Mobile Equipment page. The 2026-27 Budget says 356, and the Contract Counties page cites 84 state-funded engines (a different scope). Ranger tags the engine figures unclear, so show them side by side with sources.", "qh": "A classmate writes \"CAL FIRE has 383 engines\" on a flashcard. What's wrong with presenting that as the single answer?", "ah": "The 383 figure is from one paragraph of the Mobile Equipment page. The 2026-27 Budget says 356, and the Contract Counties page cites 84 state-funded engines (a different scope). Ranger tags the engine figures unclear, so show them side by side with sources.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "It's one page's figure; the Budget and Contract Counties page differ; show each with its source", "wh": ["Nothing; 383 is the only engine figure CAL FIRE has published", "It's one page's figure; add the Contract Counties' 84 to get the real total", "It's a typo for the Budget figure, so correct it and drop the other numbers"], "hash": "sha256:4b7a744e86d63497b6034e13b1e25361eb16daa8d3ba86ba9f8fe800f30f60f4"}, {"n": 5, "q": "What does the Mobile Equipment Facility in Davis do?", "a": "It designs, acquires, maintains, repairs, replaces, and disposes of CAL FIRE vehicles (Mobile Equipment page and Fire Protection page).", "qh": "What does the Mobile Equipment Facility in Davis do?", "ah": "It designs, acquires, maintains, repairs, replaces, and disposes of CAL FIRE vehicles (Mobile Equipment page and Fire Protection page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Designs, acquires, maintains, repairs, replaces, and disposes of CAL FIRE vehicles", "wh": ["Builds every CAL FIRE engine in-house from a bare chassis", "Trains Heavy Fire Equipment Operators and engine drivers", "Stores reserve engines and dispatches them during surges"], "hash": "sha256:3615fd469f7b49b3de24a7706c0ce9a79e0d202f3f08ee945f1151e986334547"}, {"n": 6, "q": "What is an ECT, and how is it equipped?", "a": "An Emergency Crew Transport: a 17-passenger, code 3 equipped, fully air-conditioned crew vehicle (Mobile Equipment page).", "qh": "What is an ECT, and how is it equipped?", "ah": "An Emergency Crew Transport: a 17-passenger, code 3 equipped, fully air-conditioned crew vehicle (Mobile Equipment page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Emergency Crew Transport: 17 passengers, code 3 equipped, fully air-conditioned", "wh": ["Emergency Crew Transport: 12 passengers, code 3 equipped, fully air-conditioned", "Engine Crew Tender: 17 passengers, code 3 equipped, fully air-conditioned", "Emergency Crew Transport: 17 passengers, not code 3 equipped, open cab"], "hash": "sha256:3e67a09a37caa97a643dd07d3246598d190687379e5d436d29e4f5e609425da5"}, {"n": 7, "q": "Which dozer models does the Mobile Equipment page describe as the later-model fleet, and what operator class runs dozers?", "a": "Caterpillar D6XL and D6M high-track dozers with enclosed cabs (Mobile Equipment page). Heavy Fire Equipment Operator (6387) is the operator class (pay scale).", "qh": "Which dozer models does the Mobile Equipment page describe as the later-model fleet, and what operator class runs dozers?", "ah": "Caterpillar D6XL and D6M high-track dozers with enclosed cabs (Mobile Equipment page). Heavy Fire Equipment Operator (6387) is the operator class (pay scale).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Caterpillar D6XL and D6M high-track; Heavy Fire Equipment Operator (6387)", "wh": ["Caterpillar D8T and D6M high-track; Heavy Fire Equipment Operator (6387)", "Caterpillar D6XL and D6M high-track; Fire Apparatus Engineer (1077)", "Caterpillar D6XL and D6M low-track; Forestry Technician (1085)"], "hash": "sha256:bf3f47b9097e84ff2d4168e6ef2f5d0ed5c3dbeace8a3fcf82b38c1e8aa6e06d"}, {"n": 8, "q": "You're tallying statewide dozers and plan to add the Contract Counties' 12 and the surge 10 to the 58. Why is that a bad idea?", "a": "They're different scopes. The 12 are state-funded dozers in the six Contract Counties, and the 10 are a Budget surge purchase. The 58 comes from the Mobile Equipment fleet paragraph. Adding them could double-count, so report each with its source.", "qh": "You're tallying statewide dozers and plan to add the Contract Counties' 12 and the surge 10 to the 58. Why is that a bad idea?", "ah": "They're different scopes. The 12 are state-funded dozers in the six Contract Counties, and the 10 are a Budget surge purchase. The 58 comes from the Mobile Equipment fleet paragraph. Adding them could double-count, so report each with its source.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Different scopes (Contract County funding, a surge buy, the fleet paragraph); may double-count", "wh": ["It's fine; they're separate fleets, so the statewide total is 80", "Only add the 12, because the surge 10 are already inside the 58", "Only add the 10, because Contract County dozers are county-owned"], "hash": "sha256:7536b210a9852489f1f7510e3391b50815cce49b445d4ab0338ccac39c0d7afa"}, {"n": 9, "q": "What did the 2026-27 \"Additional Engines with Year-Round Staffing\" item buy, and what total engine figure does the Budget give?", "a": "13 additional year-round engines ($32.6 million and 131 positions ongoing). The Budget says this expanded the fleet to 356 engines and raised baseline year-round staffing to 65 engines.", "qh": "What did the 2026-27 \"Additional Engines with Year-Round Staffing\" item buy, and what total engine figure does the Budget give?", "ah": "13 additional year-round engines ($32.6 million and 131 positions ongoing). The Budget says this expanded the fleet to 356 engines and raised baseline year-round staffing to 65 engines.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "13 more year-round engines ($32.6M, 131 positions); Budget total of 356 engines", "wh": ["31 more year-round engines ($32.6M, 131 positions); Budget total of 356 engines", "13 more year-round engines ($32.6M, 131 positions); Budget total of 365 engines", "13 more year-round engines ($23.6M, 113 positions); Budget total of 356 engines"], "hash": "sha256:42b4107c568a709026795e622692b88cd8820cede8ac488a213cefb79a23118b"}], "sources": [{"label": "CAL FIRE Mobile Equipment", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/mobile-equipment"}, {"label": "CAL FIRE Fire Protection", "url": "https://www.fire.ca.gov/what-we-do/fire-protection"}, {"label": "CAL FIRE What We Do", "url": "https://www.fire.ca.gov/what-we-do"}, {"label": "CAL FIRE Cooperative Efforts (Contract County equipment)", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/cooperative-efforts/"}, {"label": "2026-27 Governor's Budget Summary, Natural Resources", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}, {"label": "CalHR Civil Service Pay Scale (HFEO 6387)", "url": "https://www.calhr.ca.gov/wp-content/uploads/sites/361/2026/09/PS_Sec_15.pdf"}, {"label": "Ranger batch: /workspace/can-report/calfire/calfire-batch-02.md and calfire-batch-02.json (conflicting_counts)", "url": ""}, {"label": "Ranger batch 05: /workspace/can-report/calfire/calfire-batch-05.md", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 10. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 10.6.3 Related Classifications (Heavy Equipment).", "note_html": "Study aid only. Source: CAL FIRE Mobile Equipment page, the 2026-27 Governor's Budget, and the Cooperative Efforts page (Ranger calfire-batch-02). The engine and dozer spec PDFs weren't retrieved. <strong>Fleet counts disagree across official pages.<\/strong> They're shown side by side with Ranger's basis tags."}, "hasContent": true, "counts": [{"label": "Engines staffed in the base period", "active": {"value": "65", "source": {"label": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}}, "planned": {"value": "153", "basis": "full 66-hour workweek implementation", "source": {"label": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}}}], "disagreements": [], "datasets": [], "x": 1429.31, "y": 638.55, "angle": 105.5, "vx": 859.45, "vy": 1233.4, "vangle": 350.5}, "10.6.11": {"id": "10.6.11", "name": "Hand Crews, Conservation Camps, and Fire Centers", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.6.4"], "doc": {"title": "10.6.11 Hand Crews, Conservation Camps, and Fire Centers", "file": "10.6.11_Hand_Crews_Conservation_Camps_and_Fire_Centers.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>The <strong>Hand Crew Program<\/strong> runs CAL FIRE Firefighter Hand Crews and partners with <strong>CDCR<\/strong> (incarcerated crews), the <strong>California Conservation Corps (CCC)<\/strong>, and the <strong>California Military Department (CMD)<\/strong>. Crews respond to wildfires, floods, search and rescue, and earthquakes. Between emergencies they do hazardous-fuels reduction and prescribed-fire projects. The official facilities inventory lists <strong>conservation camps<\/strong> (CC) and three <strong>fire center<\/strong> types: FCFFC (Firefighter Crews), FCCCC (CCC), and CNA (CMD).<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<p><strong>Official counts, side by side (basis as Ranger tagged it):<\/strong><\/p><ul><li><strong>Hand crews:<\/strong><ul><li>38 CAL FIRE + 75 incarcerated + 19 CCC (including 4 Ventura Training Center) + 14 CMD, \"currently authorized\" (unclear; Cooperative Efforts page)<\/li><li>180 state crews (95 incarcerated, 38 CAL FIRE, 33 CCC, 14 CMD) + 12 contract-county crews, \"as of January 2026\" (active; 2026-27 Budget)<\/li><\/ul><\/li><li><strong>Conservation camps:<\/strong><ul><li>25 (unclear; Budget \"operates\")<\/li><li>31 (active; Facilities Public View, Active TYPE=CC)<\/li><li>Of the 31: 25 are STATE/funding B, 5 are LAC-named camps, and 1 is VNC \"Camp 14.\" The 25-to-25 match is an observer count, not an official legend.<\/li><\/ul><\/li><li><strong>Fire centers:<\/strong><ul><li>31 (unclear; Budget \"operates\")<\/li><li>FCFFC (Firefighter Crews) 20, FCCCC (CCC) 13, CNA (CMD) 10 (active; Facilities Public View type counts). These don't sum to 31 and aren't the same classification.<\/li><\/ul><\/li><\/ul><p><strong>Other specs:<\/strong><\/p><ul><li><strong>Investment (2026-27 Budget):<\/strong> $484.4 million and 2,022 positions across CAL FIRE, CCC, and CMD for non-incarcerated crews. This responds to \"decreases in the number of incarcerated individuals available to staff hand crews.\"<ul><li>Since 2019: <strong>60 new state hand crews<\/strong>, <strong>12 contract-county crews<\/strong>, and <strong>16 state crews converted from seasonal to year-round<\/strong>.<\/li><\/ul><\/li><li><strong>CCC seven-day schedule:<\/strong> $11.7 million and 49 positions (plus 47 corpsmember FTE) for a year-round seven-day operating schedule.<\/li><li><strong>Inactive camps (inventory):<\/strong> Alder CC (temporarily decommissioned). Parlin Fork, Mount Bullion, La Cima, and Norco (decommissioned).<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Who runs a camp:<\/strong> an <strong>Assistant Chief<\/strong> may serve as Division Chief over a conservation camp. Camp ACs liaise with CDCR staff, direct \"workday custody, training, and daily ratings of inmates and wards,\" and plan and evaluate work projects (EX-4883).<\/li><li><strong>Crew supervision:<\/strong> Fire Captains supervise engine companies <strong>and hand crews<\/strong> (EX-5398). BCs may manage camps as a program (Join CAL FIRE).<\/li><li><strong>Background checks:<\/strong> FFII and FAE jobs in camps or supervising incarcerated people need <strong>Live Scan / PREA<\/strong> clearance.<\/li><li><strong>Hand-crew FFI training (Applicant Information Sheet):<\/strong> EMS <strong>and<\/strong> Confined Space Awareness <strong>and<\/strong> FEMA IS-100/200/700/800 <strong>and<\/strong> CAL FIRE 1B <strong>and<\/strong> 1C.<\/li><li><strong>Chainsaw:<\/strong> CAL FIRE Chainsaw Operations (C-212) is an Acceptable Documents item.<\/li><\/ul>"}, {"key": "safety", "title": "Safety considerations", "html": "<ul><li>Hand-crew FFIs need <strong>Confined Space Awareness<\/strong>, which engine FFIs don't (Applicant Information Sheet).<\/li><li>Chainsaw Operations (C-212) carries \"qualification cards and refresher training\" (Acceptable Documents).<\/li><\/ul>"}, {"key": "history", "title": "History (background only, not quizzed)", "html": "<ul><li>In WWII, \"honor camp\" inmate crews led to a 1945 Youth Honor Camp system with the California Youth Authority. The program later extended to the Department of Corrections' adult population, and honor camps were \"later renamed conservation camps\" (Our Organization page).<\/li><\/ul>"}], "qa": [{"n": 1, "q": "Why has California spent heavily since 2019 on non-incarcerated hand crews? Name the three changes the Budget lists.", "a": "Fewer incarcerated individuals are available to staff hand crews. Since 2019 the state has added 60 new state hand crews and 12 contract-county crews, and converted 16 seasonal state crews to year-round ($484.4 million, 2,022 positions; 2026-27 Budget).", "qh": "Why has California spent heavily since 2019 on non-incarcerated hand crews? Name the three changes the Budget lists.", "ah": "Fewer incarcerated individuals are available to staff hand crews. Since 2019 the state has added 60 new state hand crews and 12 contract-county crews, and converted 16 seasonal state crews to year-round ($484.4 million, 2,022 positions; 2026-27 Budget).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Fewer incarcerated people available; 60 new state crews, 12 contract-county crews, 16 made year-round", "wh": ["Fewer incarcerated people available; 16 new state crews, 12 contract-county crews, 60 made year-round", "Fewer incarcerated people available; 60 new state crews, 21 contract-county crews, 16 made year-round", "Rising fire activity; 60 new state crews, 12 contract-county crews, 16 made year-round"], "hash": "sha256:7fd82f9509328e04fcca974fa724a1c319d419ce2e92d7ed9c75ff85455b59e8"}, {"n": 2, "q": "One source says 75 incarcerated crews and another says 95. Show how to present this correctly, and explain why both can appear on official pages.", "a": "Show both with labels and sources. 75 incarcerated is the \"currently authorized\" figure (Cooperative Efforts page, tagged unclear). 95 is \"as of January 2026\" (2026-27 Budget, tagged active). They use different wording (\"authorized\" vs a date-stamped count), so Ranger says don't blend them.", "qh": "One source says 75 incarcerated crews and another says 95. Show how to present this correctly, and explain why both can appear on official pages.", "ah": "Show both with labels and sources. 75 incarcerated is the \"currently authorized\" figure (Cooperative Efforts page, tagged unclear). 95 is \"as of January 2026\" (2026-27 Budget, tagged active). They use different wording (\"authorized\" vs a date-stamped count), so Ranger says don't blend them.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Both, labeled: 75 \"currently authorized\" (Cooperative Efforts) and 95 \"as of January 2026\" (Budget)", "wh": ["Both, labeled: 75 \"as of January 2026\" (Budget) and 95 \"currently authorized\" (Cooperative Efforts)", "One figure: report 85, the midpoint, and cite both pages", "One figure: report only the Budget's, since the newer page wins"], "hash": "sha256:86e0ef55505dc7947265b4aa16896202c21c4be6da21499363ce8db76873b191"}, {"n": 3, "q": "You're told to report to a \"fire center.\" What three Facilities types exist, and which partner's crews does each serve?", "a": "FCFFC is Fire Center for Firefighter Crews (CAL FIRE). FCCCC is Fire Center for CCC crews. CNA is Fire Center for CMD crews (Facilities Public View type codes).", "qh": "You're told to report to a \"fire center.\" What three Facilities types exist, and which partner's crews does each serve?", "ah": "FCFFC is Fire Center for Firefighter Crews (CAL FIRE). FCCCC is Fire Center for CCC crews. CNA is Fire Center for CMD crews (Facilities Public View type codes).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "FCFFC: CAL FIRE crews; FCCCC: CCC crews; CNA: CMD crews", "wh": ["FCFFC: CCC crews; FCCCC: CAL FIRE crews; CNA: CMD crews", "FCFFC: CAL FIRE crews; FCCCC: CMD crews; CNA: CCC crews", "FCFFC: CAL FIRE crews; FCCCC: CCC crews; CNA: CDCR crews"], "hash": "sha256:ab0604085c76880ce9003d5174e841c15ba8366a23472af17d8072b07ef54483"}, {"n": 4, "q": "The Budget says CAL FIRE operates 25 conservation camps, but the inventory shows 31 Active camps. What explains the gap, and what's the right way to cite it?", "a": "The inventory's 31 Active TYPE=CC rows include 5 LAC-named camps and 1 VNC \"Camp 14\" alongside 25 STATE/funding-B camps. The Budget's 25 happens to match that group, but that's an observer count, not an official legend. Cite both: 25 (Budget, unclear) and 31 (inventory, active).", "qh": "The Budget says CAL FIRE operates 25 conservation camps, but the inventory shows 31 Active camps. What explains the gap, and what's the right way to cite it?", "ah": "The inventory's 31 Active TYPE=CC rows include 5 LAC-named camps and 1 VNC \"Camp 14\" alongside 25 STATE/funding-B camps. The Budget's 25 happens to match that group, but that's an observer count, not an official legend. Cite both: 25 (Budget, unclear) and 31 (inventory, active).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "The 31 include 6 LAC/VNC camps besides 25 state ones; cite 25 (Budget) and 31 (inventory)", "wh": ["The 31 include 6 decommissioned camps still listed; cite only the Budget's figure", "The Budget omits 6 newly opened state camps; cite only the inventory's figure", "The inventory double-counts 6 camps; cite only the Budget's figure"], "hash": "sha256:cf3ba8f7558d8e3220f336515c777b1a2eaae6615a8bcff37975c7e145c512f3"}, {"n": 5, "q": "You're promoted to Assistant Chief and assigned to a conservation camp. What are your camp-specific duties?", "a": "Liaise with CDCR staff. Direct workday custody, training, and daily ratings of inmates and wards. Plan and evaluate work projects (EX-4883).", "qh": "You're promoted to Assistant Chief and assigned to a conservation camp. What are your camp-specific duties?", "ah": "Liaise with CDCR staff. Direct workday custody, training, and daily ratings of inmates and wards. Plan and evaluate work projects (EX-4883).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Liaise with CDCR; direct workday custody, training, and ratings; plan and evaluate projects", "wh": ["Liaise with CDCR; set custody levels and sentence credits; plan and evaluate projects", "Liaise with the CCC; direct workday custody, training, and ratings; plan and evaluate projects", "Liaise with CDCR; supervise engine companies and the unit's emergency command center"], "hash": "sha256:f0e7fa7278f1cc866104c2506c4720786c16c9633318952cefc698066beb8d32"}, {"n": 6, "q": "An FAE is offered a position supervising incarcerated crews. What extra clearance applies?", "a": "Live Scan / PREA background clearance for camp or incarcerated-supervision positions (EX-4473 FAE bulletin).", "qh": "An FAE is offered a position supervising incarcerated crews. What extra clearance applies?", "ah": "Live Scan / PREA background clearance for camp or incarcerated-supervision positions (EX-4473 FAE bulletin).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Live Scan / PREA background clearance", "wh": ["POST peace officer background investigation", "Live Scan / PREA clearance plus a polygraph exam", "A federal security clearance from CDCR"], "hash": "sha256:3ef7230639c46c380969d1ef2fe0626641223c19afc7ee6600d5251545767053"}, {"n": 7, "q": "An FFI applicant wants a hand-crew job. List the required trainings and compare them with an engine job.", "a": "Hand crew: EMS (CPR/AED and PSFA, or EMT, or Paramedic), Confined Space Awareness, FEMA IS-100/200/700/800, and CAL FIRE 1B and 1C. Engine jobs need EMS and FEMA plus either an SFT FFI certificate or CAL FIRE 1A/B/C. They don't list Confined Space Awareness separately (Applicant Information Sheet).", "qh": "An FFI applicant wants a hand-crew job. List the required trainings and compare them with an engine job.", "ah": "Hand crew: EMS (CPR/AED and PSFA, or EMT, or Paramedic), Confined Space Awareness, FEMA IS-100/200/700/800, and CAL FIRE 1B and 1C. Engine jobs need EMS and FEMA plus either an SFT FFI certificate or CAL FIRE 1A/B/C. They don't list Confined Space Awareness separately (Applicant Information Sheet).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Hand crew: EMS, Confined Space, FEMA, 1B and 1C; engine: EMS, FEMA, plus SFT FFI or 1A/B/C", "wh": ["Hand crew: EMS, FEMA, plus SFT FFI or 1A/B/C; engine: EMS, Confined Space, FEMA, 1B and 1C", "Hand crew: EMS, Confined Space, FEMA, 1A and 1B; engine: EMS, FEMA, plus SFT FFI or 1A/B/C", "Hand crew: EMS, Confined Space, FEMA, 1B and 1C; engine: EMS, Confined Space, FEMA, and CPAT"], "hash": "sha256:9db4058a0cc746cbea8d0bf31349b5f07e1da07538e52083cb88c0cdce9bd680"}, {"n": 8, "q": "What do hand crews do between emergencies?", "a": "Hazardous-fuels reduction and prescribed-fire project work (Cooperative Efforts page).", "qh": "What do hand crews do between emergencies?", "ah": "Hazardous-fuels reduction and prescribed-fire project work (Cooperative Efforts page).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Hazardous-fuels reduction and prescribed-fire project work", "wh": ["Defensible space inspections and citations", "Station maintenance and apparatus checks", "Hazardous-fuels reduction and timber harvest planning"], "hash": "sha256:d11f34c4cc00443269031904891b2e7047fa6fdb618a695dc20077424751a4f1"}, {"n": 9, "q": "What scheduling change did the Budget fund for CCC hand crews?", "a": "A seven-day-per-week operating schedule year-round: $11.7 million, 49 positions, and 47 corpsmember FTE (2026-27 Budget).", "qh": "What scheduling change did the Budget fund for CCC hand crews?", "ah": "A seven-day-per-week operating schedule year-round: $11.7 million, 49 positions, and 47 corpsmember FTE (2026-27 Budget).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Seven days a week, year-round: $11.7M, 49 positions, 47 corpsmember FTE", "wh": ["Five days a week, year-round: $11.7M, 49 positions, 47 corpsmember FTE", "Seven days a week, peak season only: $11.7M, 49 positions, 47 corpsmember FTE", "Seven days a week, year-round: $17.1M, 94 positions, 74 corpsmember FTE"], "hash": "sha256:598ee290141f2494696b279c23529c587c98d816ad08cdee10bdb43732c0a68a"}], "sources": [{"label": "CAL FIRE Cooperative Efforts (Hand Crew Program)", "url": "https://www.fire.ca.gov/what-we-do/fire-protection/cooperative-efforts/"}, {"label": "2026-27 Governor's Budget Summary, Natural Resources", "url": "https://ebudget.ca.gov/2026-27/pdf/BudgetSummary/NaturalResources.pdf"}, {"label": "CAL FIRE Facilities for Wildland Fire Protection, Public View", "url": "https://services1.arcgis.com/jUJYIo9tSA7EHvfZ/arcgis/rest/services/CAL_FIRE_Facilities_for_Wildland_Fire_Protection_-_Public_View/FeatureServer"}, {"label": "Facilities dataset page", "url": "https://data.ca.gov/@cal-fire/facilities-for-wildland-fire-protection1"}, {"label": "Assistant Chief exam bulletin EX-4883", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4883"}, {"label": "Fire Captain exam bulletin EX-5398", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=5398"}, {"label": "FAE exam bulletin EX-4473", "url": "https://calcareers.ca.gov/CalHrPublic/Exams/ExamBulletin.aspx?ExamControlId=4473"}, {"label": "Join CAL FIRE, Battalion Chief", "url": "https://www.joincalfire.com/classifications/fire-protection/firefighting-and-paramedics/battalion-chief"}, {"label": "FFI Applicant Information Sheet", "url": "https://www.fire.ca.gov/-/media/1EAFA2A1528141EE892CB692D4B982E0"}, {"label": "CAL FIRE Acceptable Documents", "url": "https://www.fire.ca.gov/-/media/BF147896DED446F9B142FEF464A0E9AD"}, {"label": "CAL FIRE Our Organization (camp history)", "url": "https://www.fire.ca.gov/about/our-organization"}, {"label": "Ranger batches: /workspace/can-report/calfire/calfire-batch-01.md, calfire-batch-02.md, calfire-batch-03.md, calfire-batch-03-facilities-public-view.csv", "url": ""}], "position_html": "<strong>Tree position:<\/strong> Path 10 Officer, Station and Career &gt; 10.6 CAL FIRE Career Path &gt; tool 11. <strong>Unlocks after:<\/strong> 10.1 Station Life, Daily Apparatus and Equipment Checks. <strong>Cross-links:<\/strong> 10.6.4 Programs and Contract Counties.", "note_html": "Study aid only. Source: CAL FIRE Cooperative Efforts page, the 2026-27 Governor's Budget, the Facilities Public View inventory (queried 17 Nov 2026, layer modified 5 Aug 2026), exam bulletins, and the Acceptable Documents file (Ranger calfire-batch-01, -02, -03). <strong>Crew, camp, and fire-center counts disagree across official sources.<\/strong> They're shown side by side."}, "hasContent": true, "counts": [], "disagreements": [], "datasets": [], "x": 1410.99, "y": 627.53, "angle": 136.5, "vx": 857.22, "vy": 1254.66, "vangle": 21.5}, "10.6.12": {"id": "10.6.12", "name": "Peak and Base Staffing (Seasonal, Year-Round, and Workweek)", "path": "10", "kind": "tool", "parent": "10.6", "prereqRaw": "parent 10.6", "children": [], "prereqs": ["10.6"], "unlocks": [], "cross": ["10.6.5"], "doc": {"title": "10.6.12 Peak and Base Staffing (Seasonal, Year-Round, and Workweek)", "file": "10.6.12_Peak_and_Base_Staffing_Seasonal_Year-Round_and_Workweek.md", "sections": [{"key": "what", "title": "What it is", "html": "<p>CAL FIRE staffs up in <strong>peak<\/strong> fire season and drops to <strong>base<\/strong> staffing the rest of the year. The Budget describes \"a year-round fire season and longer, more severe peak fire seasons.\" The state is moving from a <strong>72-hour<\/strong> to a <strong>66-hour workweek<\/strong>, adding year-round engines and crews, and hiring more engineers to cover it.<\/p>"}, {"key": "specs", "title": "Key specs", "html": "<ul><li><strong>66-hour workweek:<\/strong> $770.4 million ($756.3 million General Fund) and 2,457 positions ongoing, phased in over <strong>five years beginning 2024-25<\/strong>. It reflects the <strong>2022 MOU with CAL FIRE Local 2881 (Bargaining Unit 8)<\/strong>, which committed to cutting the 72-hour workweek to 66 hours <strong>starting 1 Nov 2024<\/strong>.<\/li><li><strong>At full implementation:<\/strong> CAL FIRE will run <strong>peak staffing 9 months a year<\/strong> (previously 4 to 5) and <strong>base staffing 3 months<\/strong>. Engines staffed in the base period go from <strong>65 to 153<\/strong>.<\/li><li><strong>Engineers:<\/strong><ul><li>\"In 2025, CAL FIRE graduated a record 658 new Fire Apparatus Engineers through the Company Officer Academy.\" They begin a three-year apprenticeship toward Captain.<\/li><li>More than 600 more are projected for 2026, part of <strong>more than 1,350 new FAEs<\/strong> funded over the five-year plan.<\/li><\/ul><\/li><li><strong>Three-platoon schedule:<\/strong> \"As staffing levels rise, units across the state are moving to a three-platoon schedule, improving coverage and reducing reliance on extended duty.\"<\/li><li><strong>Relief Staffing:<\/strong> $175.3 million and 576 positions ongoing, including expanded training-center positions and proportional Contract County funding.<\/li><li><strong>Year-round engines:<\/strong> 13 more, for 65 engines resourced for baseline year-round staffing.<\/li><li><strong>Year-round crews:<\/strong> 16 state hand crews converted from seasonal to year-round since 2019. CCC crews moved to a seven-day year-round schedule.<\/li><li><strong>Year-round inspectors:<\/strong> $6.2 million and 31 positions toward the goal of <strong>250,000 annual defensible-space parcel inspections<\/strong> in the SRA.<\/li><li><strong>FFI:<\/strong> still Non-Tenured, Full Time. Annual compensation on JC-533177 is stated as a \"max of 9 months,\" and <strong>EDWC<\/strong> (Extended Duty Week Compensation) is paid every 4 weeks.<\/li><\/ul>"}, {"key": "how", "title": "How it's used", "html": "<ul><li><strong>Peak vs base:<\/strong> at full implementation, more of the year runs at peak, and more engines stay staffed during the base months.<\/li><li><strong>The hiring push:<\/strong> the Budget puts the FAE graduations, the 1,350+ new FAEs, and the move to three platoons all under the 66-hour workweek item.<\/li><li><strong>For an FFI applicant:<\/strong> the entry job stays seasonal and non-tenured (see 10.6.5), even as engine staffing periods get longer.<\/li><\/ul>"}], "qa": [{"n": 1, "q": "What workweek change is CAL FIRE implementing? From what to what, starting when, and under what agreement?", "a": "From a 72-hour to a 66-hour workweek starting 1 Nov 2024, under the 2022 MOU with CAL FIRE Local 2881 (Bargaining Unit 8) (2026-27 Budget).", "qh": "What workweek change is CAL FIRE implementing? From what to what, starting when, and under what agreement?", "ah": "From a 72-hour to a 66-hour workweek starting 1 Nov 2024, under the 2022 MOU with CAL FIRE Local 2881 (Bargaining Unit 8) (2026-27 Budget).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "72 to 66 hours, from 1 Nov 2024, under the 2022 MOU with Local 2881 (BU 8)", "wh": ["72 to 56 hours, from 1 Nov 2024, under the 2022 MOU with Local 2881 (BU 8)", "72 to 66 hours, from 1 Nov 2025, under the 2022 MOU with Local 2881 (BU 8)", "72 to 66 hours, from 1 Nov 2024, under the 2024 MOU with Local 2881 (BU 6)"], "hash": "sha256:3351eceb0b3109d20aa1a72708549347dec57e7bb40f9dbb00c888d5973ce74d"}, {"n": 2, "q": "Once the 66-hour workweek is fully implemented, how many months a year will CAL FIRE run at peak and at base staffing? How does that compare with before?", "a": "Peak for 9 months a year (previously 4 to 5 months) and base for 3 months (2026-27 Budget).", "qh": "Once the 66-hour workweek is fully implemented, how many months a year will CAL FIRE run at peak and at base staffing? How does that compare with before?", "ah": "Peak for 9 months a year (previously 4 to 5 months) and base for 3 months (2026-27 Budget).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "Peak 9 months and base 3 (peak used to be 4 to 5 months)", "wh": ["Peak 3 months and base 9 (peak used to be 4 to 5 months)", "Peak 8 months and base 4 (peak used to be 4 to 5 months)", "Peak 9 months and base 3 (peak used to be 6 to 7 months)"], "hash": "sha256:b56da76a61147951fdf5cb93dd912e7206bedc91dc18788887b3cc893aff47da"}, {"n": 3, "q": "How many engines are staffed in the base period now, and how many under full implementation? Label each figure correctly.", "a": "65 now (active, baseline after the year-round engine investment). 153 under full 66-hour implementation (planned) (2026-27 Budget).", "qh": "How many engines are staffed in the base period now, and how many under full implementation? Label each figure correctly.", "ah": "65 now (active, baseline after the year-round engine investment). 153 under full 66-hour implementation (planned) (2026-27 Budget).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "65 now (active); 153 under full 66-hour implementation (planned)", "wh": ["65 now (planned); 153 under full 66-hour implementation (active)", "56 now (active); 153 under full 66-hour implementation (planned)", "65 now (active); 135 under full 66-hour implementation (planned)"], "hash": "sha256:26711d763a5133130c669f014012974ff96a4804ea793fa453e0bfa512166797"}, {"n": 4, "q": "Under which Budget item do the record Fire Apparatus Engineer graduations appear, and what are the numbers?", "a": "The 66-hour workweek item. It lists 658 new FAEs graduated through the Company Officer Academy in 2025 (a record), more than 600 more Company Officers projected for 2026, and more than 1,350 new FAEs funded over the five-year plan (2026-27 Budget).", "qh": "Under which Budget item do the record Fire Apparatus Engineer graduations appear, and what are the numbers?", "ah": "The 66-hour workweek item. It lists 658 new FAEs graduated through the Company Officer Academy in 2025 (a record), more than 600 more Company Officers projected for 2026, and more than 1,350 new FAEs funded over the five-year plan (2026-27 Budget).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "66-hour workweek item: 658 FAEs in 2025, 600+ projected 2026, 1,350+ over five years", "wh": ["Relief Staffing item: 658 FAEs in 2025, 600+ projected 2026, 1,350+ over five years", "66-hour workweek item: 568 FAEs in 2025, 600+ projected 2026, 1,350+ over five years", "66-hour workweek item: 658 FAEs in 2025, 600+ projected 2026, 1,350+ over three years"], "hash": "sha256:db733cd154633e832a16e781d5eebf1d5519fbf821acfa5f74747b282ec54d12"}, {"n": 5, "q": "What schedule change are units making as staffing rises, and what two benefits does the Budget claim?", "a": "Moving to a three-platoon schedule, which the Budget says improves coverage and reduces reliance on extended duty.", "qh": "What schedule change are units making as staffing rises, and what two benefits does the Budget claim?", "ah": "Moving to a three-platoon schedule, which the Budget says improves coverage and reduces reliance on extended duty.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "A three-platoon schedule: better coverage and less reliance on extended duty", "wh": ["A two-platoon schedule: better coverage and less reliance on extended duty", "A four-platoon schedule: better coverage and less reliance on extended duty", "A three-platoon schedule: lower overtime pay and a shorter fire season"], "hash": "sha256:35058bcac4b9ff6973457fdf47e79056ccf8a367a1d7ca7c22775bde6ff8c1f4"}, {"n": 6, "q": "A seasonal FFI hire asks if the job is permanent now that the fire season is year-round. What does JC-533177 say about job type and pay period?", "a": "No. JC-533177 lists FFI as Non-Tenured, Full Time, with annual compensation figured on a maximum of 9 months.", "qh": "A seasonal FFI hire asks if the job is permanent now that the fire season is year-round. What does JC-533177 say about job type and pay period?", "ah": "No. JC-533177 lists FFI as Non-Tenured, Full Time, with annual compensation figured on a maximum of 9 months.", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "No: Non-Tenured, Full Time, with annual pay figured on a maximum of 9 months", "wh": ["Yes: Permanent, Full Time, with annual pay figured on 12 months", "No: Non-Tenured, Part Time, with annual pay figured on a maximum of 6 months", "No: Non-Tenured, Full Time, with annual pay figured on 12 months"], "hash": "sha256:78be2ec0bd44fe749a80e0be3be7afe9f42552df1516312b6434b66c48e6f71c"}, {"n": 7, "q": "What's the \"Relief Staffing\" item, and what does it include beyond field positions?", "a": "$175.3 million General Fund and 576 positions ongoing for relief staffing. It includes expanded training-center positions and proportional ongoing Contract County funding (2026-27 Budget).", "qh": "What's the \"Relief Staffing\" item, and what does it include beyond field positions?", "ah": "$175.3 million General Fund and 576 positions ongoing for relief staffing. It includes expanded training-center positions and proportional ongoing Contract County funding (2026-27 Budget).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "$175.3M GF and 576 positions; includes training-center positions and Contract County funding", "wh": ["$157.3M GF and 576 positions; includes training-center positions and Contract County funding", "$175.3M GF and 576 positions; includes new aircraft and Contract County funding", "$175.3M GF and 675 positions; includes training-center positions and Contract County funding"], "hash": "sha256:036ee8fe7cf043bbda3a5a458e40d7aa09cbe11d2f8611fb010bf5b0064cb1e7"}, {"n": 8, "q": "Name two year-round conversions besides engines that the Budget describes.", "a": "Any two: 16 state hand crews converted from seasonal to year-round; CCC hand crews moved to a seven-day year-round schedule; added year-round defensible-space inspectors (2026-27 Budget).", "qh": "Name two year-round conversions besides engines that the Budget describes.", "ah": "Any two: 16 state hand crews converted from seasonal to year-round; CCC hand crews moved to a seven-day year-round schedule; added year-round defensible-space inspectors (2026-27 Budget).", "fmt": "A", "gateStatus": "pass", "gate": true, "ch": "16 state hand crews made year-round; CCC crews on a seven-day, year-round schedule", "wh": ["12 contract-county crews converted to year-round; CCC crews on a seven-day schedule", "16 state hand crews made year-round; all seasonal FFI jobs converted to permanent", "All S-70i helitack bases made year-round; CCC crews on a seven-day schedule"], "hash": "sha256:a0f51c0cf298cc58d48424b3483a96ba90f3f43e4d0ed316fd0e689382b1022c"}, {"n": 9, "q": "How is the 66-hour workweek funded and phased?", "a": "$770.4 million ($756.3 million General Fund) and 2,457 positions ongoing, phased in over five years beginning in 2024-
